# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs
# as an AI agent drives them (ADR-0008). key MUST equal the folder name and never changes once published.
schema: 2
key: KEY
title: TITLE AS A VERB PHRASE
protocols: [PROTOCOL]
tier: foundations          # foundations | working-servers | secure-servers | advanced | new-protocols
surface: mcp
mcp-tools: [start_server, transfer]   # every tool the cases call; each explained in the Discussion
exit-codes: []
references: []

fixtures: {}               # path: content, written into the folder both hosts are confined to

# Both hosts are started once for the whole recipe and its cases run in order, so a value one
# call saves (save: {name: path.in.the.answer}) is {{name}} in every later call, in any case.
cases:                     # one per claim the book makes; exactly one has role: solution
  - id: solution
    role: solution
    claim: What this proves, in one sentence.
    mcp:
      - host: surl         # surl -> surl-mcp, curl -> curl-mcp
        tool: start_server
        arguments: { listen_urls: ["http://127.0.0.1:0"], files: { hello.txt: "hello from surl\n" } }
        save: { url: bound_urls.0, server: server_id }
      - host: curl
        tool: transfer
        arguments: { url: "{{url}}hello.txt" }
        expect:            # on the call, not the case; a call with no expect: need only not be an error
          result-contains: { statusCode: 200, body: { content: "hello from surl\n" } }
          # is-error: true          the call must be an error (a refusal is a claim too)
          # error-contains: TEXT    and its answer must contain TEXT
