# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: KEY
title: TITLE AS A VERB PHRASE
protocols: [PROTOCOL]
tier: foundations          # foundations | working-servers | secure-servers | advanced | new-protocols
surface: mcp
mcp-tools: [start_server, transfer]   # every tool the programs call; each explained in the Discussion
exit-codes: [0]
references: []

fixtures: {}               # path: content, written into the folder both hosts are confined to

cases:                     # one per claim the book makes; exactly one has role: solution
  - id: solution
    role: solution
    claim: What this proves, in one sentence.
    program: program.cs    # rename it for what it does; run as: dotnet run program.cs -- ARGS
    args: []               # pick a claim's scenario with an argument, or give each claim its own .cs
    expect:
      exit: 0
      stdout: "200\nhello from surl\n"   # exact; or stdout-matches: REGEX; stderr-contains: TEXT
