# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: KEY
title: TITLE AS A VERB PHRASE
protocols: [PROTOCOL]
tier: foundations          # foundations | working-servers | secure-servers | advanced (Libcurl only here) | new-protocols
surface: csharp
api-types: []              # every public type the programs use, e.g. [SurlServer, SurlServerOptions, CurlClient, CurlRequest]
exit-codes: [0]
references: []

fixtures: {}               # path: content, written before anything runs

# servers: is optional. Leave it out when the program hosts its server through Surl.Api;
# add it, as in the console template, when the program is a client of a surl process.

cases:                     # one per claim the book makes; exactly one has role: solution
  - id: solution
    role: solution
    claim: What this proves, in one sentence.
    program: program.cs    # a C# file-based app in this folder, run as: dotnet run program.cs -- ARGS
    args: []               # placeholders work here, e.g. ["http://127.0.0.1:{{port}}/hello.txt"]
    expect:
      exit: 0
      stdout: "hello from surl\n"     # exact; or stdout-matches: REGEX; stderr-contains: TEXT; files: {path: content}
