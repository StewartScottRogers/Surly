# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: KEY
title: TITLE AS A VERB PHRASE
protocols: [PROTOCOL]
tier: foundations          # foundations | working-servers | secure-servers | advanced | new-protocols
surl-options: []
curl-options: []
exit-codes: [0]
references: []

fixtures: {}               # path: content, written before anything runs

servers:                   # started before the cases, stopped after; {{port}} allocated at run time
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port            # port | stderr-contains: TEXT | none

cases:                     # one per claim the book makes; exactly one has role: solution
  - id: solution
    role: solution
    claim: What this proves, in one sentence.
    run: curl http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"     # exact; or stdout-matches: REGEX; stderr-contains: TEXT; files: {path: content}
