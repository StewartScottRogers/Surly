# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: amqp-process-a-work-queue-end-to-end-in-csharp
title: Processing a Work Queue End to End
protocols: [amqp, stomp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerMessages, SurlQueuePage, SurlEventQuery, StoreChangedEvent, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, amqp091, stomp12]
triplet: amqp-process-a-work-queue-end-to-end

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Three jobs are queued; a STOMP worker sent through Curl.Api as a telnet:// body receives job-1, job-2 and job-3 oldest first, acknowledges each and disconnects, and the answer ends with the receipt.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '^worker received: job-1, job-2, job-3, then the receipt\n'

  - id: queue-is-empty
    claim: The test checks the queue afterwards; every job was acknowledged, so BrowseQueueAsync counts none ready and none in flight.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nqueue: ready 0 \[\], in flight 0\n'

  - id: events-recorded
    claim: With RecordExchanges the server keeps its own record; FindEvents on the bus counts three enqueued, three delivered and three acknowledged.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nevents: enqueued 3, delivered 3, acknowledged 3\n$'

  - id: durable-across-a-restart
    claim: Two jobs are queued, the server is disposed and another started on the same DataDirectory, and the worker receives job-4 and job-5 in order.
    program: program.cs
    args: [restart]
    expect:
      exit: 0
      stdout-matches: '^after the restart the worker received: job-4, job-5, then the receipt\n'

  - id: empty-after-the-restart
    claim: The jobs the worker acknowledged after the restart are gone; the queue holds none.
    program: program.cs
    args: [restart]
    expect:
      exit: 0
      stdout-matches: '\nqueue: ready 0 \[\], in flight 0\n'

  - id: record-starts-again
    claim: A restarted server keeps a record of its own; it saw no enqueued event, because the jobs came from disk, and two delivered and two acknowledged.
    program: program.cs
    args: [restart]
    expect:
      exit: 0
      stdout-matches: '\nevents: enqueued 0, delivered 2, acknowledged 2\n$'

  - id: worker-fails
    claim: A worker that acknowledges two of three jobs still receives all three, job-6, job-7 and job-8, and disconnects without acknowledging the third.
    program: program.cs
    args: [fails]
    expect:
      exit: 0
      stdout-matches: '^worker received: job-6, job-7, job-8, then the receipt\n'

  - id: unacknowledged-comes-back
    claim: The test finds the job the worker did not acknowledge ready again, and only that one, none in flight.
    program: program.cs
    args: [fails]
    expect:
      exit: 0
      stdout-matches: '\nafter the worker: ready 1 \[job-8\], in flight 0\n'

  - id: next-receive-takes-it
    claim: A receive with Curl.Api takes the returned job, job-8.
    program: program.cs
    args: [fails]
    expect:
      exit: 0
      stdout-matches: '\nsecond receive: \[job-8\]\n'

  - id: then-empty
    claim: Once the job is taken the queue is empty again.
    program: program.cs
    args: [fails]
    expect:
      exit: 0
      stdout-matches: '\nqueue: ready 0 \[\], in flight 0\n'

  - id: failure-recorded
    claim: The server's record tells the story of the failure; three enqueued, four delivered, because job-8 went out twice, and three acknowledged.
    program: program.cs
    args: [fails]
    expect:
      exit: 0
      stdout-matches: '\nevents: enqueued 3, delivered 4, acknowledged 3\n$'

  - id: app-refused
    claim: Without AllowAnonymous the app's receive throws CurlException 67, because the server offers only CRAM-MD5, which Curl.Api does not use.
    program: program.cs
    args: [refused]
    expect:
      exit: 0
      stdout-matches: '^receive: CurlException 67 LoginDenied: AMQP server offers no mechanism this client can use \(it offers "CRAM-MD5"\)\n'

  - id: worker-refused
    claim: Without it the STOMP worker is answered an ERROR frame and receives nothing.
    program: program.cs
    args: [refused]
    expect:
      exit: 0
      stdout-matches: '\nworker: ERROR\n$'
