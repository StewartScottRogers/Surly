# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs program.cs, a C# program on the official MCP SDK that
# starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: mqtt-test-a-sensor-to-alert-flow-from-an-agent
title: Testing a Sensor-to-Alert Flow from an Agent
protocols: [mqtt, smtp]
tier: scenarios
surface: mcp
mcp-tools: [start_server, stop_server, wait_for_event, get_events, list_messages, read_retained_message, curl]
curl-options: [-s, -S, -m, -d, -T, --mail-from, --mail-rcpt]
exit-codes: [0]
references: [surl-readme, curl-readme, mqtt311, rfc5321, rfc5322, rfc1939]
triplet: mqtt-test-a-sensor-to-alert-flow

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The agent publishes 81.5 as the boiler's reading with the curl tool and runs the service with a limit of 75; the service reads 81.5 and sends an alert.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\Aservice: alert sent for boiler at 81\.5\n'

  - id: delivery-event
    claim: wait_for_event reports the delivery, store_changed on the mail store with the change delivered, into the one anonymous mailbox's INBOX as UID 1.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\ndelivered: delivered /INBOX/;UID=1\n'

  - id: empty-owner-refused
    claim: list_messages refuses that empty owner before it runs, an MCP invalid-params error, so the mailbox is read another way.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nlist_messages for the empty owner: .*Invalid params: arguments\.owner: expected at least 1 characters\n'

  - id: alert-mail
    claim: The agent reads message 1 over POP3 with the curl tool; it is the alert, from sensors@example.com to ops@example.com with the subject boiler at 81.5 C, behind the Return-Path line surl adds.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nalert: Return-Path: <sensors@example\.com> \| From: sensors@example\.com \| To: ops@example\.com \| Subject: boiler at 81\.5 C \| boiler reads 81\.5 C, past the limit of 75 C\.\n'

  - id: one-mail
    claim: The mailbox holds that one message and no other.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nmailbox: 1 message\(s\)\n'

  - id: reading-kept
    claim: The broker kept the reading the service read, under --topic "sensors/#;retain"; read_retained_message answers 81.5.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nkept: 81\.5\n\Z'

  - id: under-the-limit
    claim: On a second server a reading of 64.0, under the limit, makes the service send nothing.
    program: program.cs
    args: [quiet]
    expect:
      exit: 0
      stdout-matches: '\Aservice: no alert for boiler at 64\.0\n'

  - id: at-the-limit
    claim: A reading of exactly 75 is not past the limit, and the service sends nothing either.
    program: program.cs
    args: [quiet]
    expect:
      exit: 0
      stdout-matches: '\nservice: no alert for kiln at 75\n'

  - id: mailbox-empty
    claim: The second server's record holds no delivery, get_events finds no store_changed on the mail store, and the mailbox lists no message.
    program: program.cs
    args: [quiet]
    expect:
      exit: 0
      stdout-matches: '\ndeliveries: 0\nmailbox: 0 message\(s\)\n'

  - id: no-reading
    claim: A sensor that never published leaves the service nothing to read; after five tries a second apart it says so.
    program: program.cs
    args: [quiet]
    expect:
      exit: 0
      stdout-matches: '\nservice: no reading from pump\n\Z'
