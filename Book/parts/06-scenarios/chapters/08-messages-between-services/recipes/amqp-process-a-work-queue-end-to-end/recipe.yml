schema: 2
key: amqp-process-a-work-queue-end-to-end
title: Processing a Work Queue End to End
protocols: [amqp, stomp]
tier: scenarios
surl-options: [--directory, --queue, --allow-anonymous]
curl-options: [-s, -S, -d, -m, -T]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, amqp091, stomp12]
triplet: amqp-process-a-work-queue-end-to-end

# The app queues jobs with curl over AMQP; the worker is a STOMP client on the same bus, which can hold a
# job until it acknowledges it. A STOMP frame ends in a NUL byte. Both workers log in with no account,
# subscribe to the queue jobs with per-message acknowledgement and disconnect with a receipt.
# worker.stomp acknowledges the messages 1, 2 and 3; two.stomp only 1 and 2. data/readme.txt only makes
# the folder data exist, as surl needs; the durable queue goes under data/.surl/bus.
fixtures:
  worker.stomp: "CONNECT\naccept-version:1.2\nhost:/\n\n\0SUBSCRIBE\nid:0\ndestination:/queue/jobs\nack:client-individual\n\n\0ACK\nid:1\n\n\0ACK\nid:2\n\n\0ACK\nid:3\n\n\0DISCONNECT\nreceipt:bye\n\n\0"
  two.stomp: "CONNECT\naccept-version:1.2\nhost:/\n\n\0SUBSCRIBE\nid:0\ndestination:/queue/jobs\nack:client-individual\n\n\0ACK\nid:1\n\n\0ACK\nid:2\n\n\0DISCONNECT\nreceipt:bye\n\n\0"
  data/readme.txt: "the server's data directory\n"

# main: a durable queue jobs on disk, AMQP for the app and STOMP for the worker. locked: the same without
# --allow-anonymous.
servers:
  main:
    command: surl --directory data --allow-anonymous --queue "jobs;durable" amqp://127.0.0.1:{{port}}/ stomp://127.0.0.1:{{port2}}/
    ready: port
  locked:
    command: surl --queue "jobs;durable" amqp://127.0.0.1:{{port3}}/ stomp://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The app queues job-1, job-2 and job-3 over AMQP; a STOMP worker receives them oldest first, acknowledges each and disconnects, exit 0, and the receipt shows the server took its disconnect.
    run: curl -sS -d job-1 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -d job-2 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -d job-3 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -m 10 -T worker.stomp telnet://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: 'CONNECTED[\s\S]*job-1[\s\S]*job-2[\s\S]*job-3[\s\S]*RECEIPT'

  - id: queue-is-empty
    claim: The test checks the queue afterwards; every job was acknowledged, so a receive finds the queue empty and writes nothing, exit 0.
    run: curl -sS amqp://127.0.0.1:{{port}}/%2F/jobs
    expect:
      exit: 0
      stdout: ""

  - id: queued-before-a-restart
    claim: Two more jobs are queued, job-4 and job-5, and nothing is written.
    run: curl -sS -d job-4 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -d job-5 amqp://127.0.0.1:{{port}}/%2F/jobs
    expect:
      exit: 0
      stdout: ""

  - id: durable-across-a-restart
    claim: After the server is stopped outright and started again with the same command, the durable queue still holds both jobs and the worker receives job-4 and job-5 in order.
    restart: [main]
    run: curl -sS -m 10 -T two.stomp telnet://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: 'CONNECTED[\s\S]*job-4[\s\S]*job-5[\s\S]*RECEIPT'

  - id: empty-after-the-restart
    claim: The jobs the worker acknowledged after the restart are gone too; a receive finds the queue empty.
    run: curl -sS amqp://127.0.0.1:{{port}}/%2F/jobs
    expect:
      exit: 0
      stdout: ""

  - id: worker-fails
    claim: A worker that stops after acknowledging two of three jobs still receives all three, job-6, job-7 and job-8, and disconnects without acknowledging the third.
    run: curl -sS -d job-6 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -d job-7 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -d job-8 amqp://127.0.0.1:{{port}}/%2F/jobs --next -sS -m 10 -T two.stomp telnet://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: 'CONNECTED[\s\S]*job-6[\s\S]*job-7[\s\S]*job-8[\s\S]*RECEIPT'

  - id: unacknowledged-comes-back
    claim: The test finds the job the worker did not acknowledge ready again, and only that one; a receive writes job-8.
    run: curl -sS amqp://127.0.0.1:{{port}}/%2F/jobs
    expect:
      exit: 0
      stdout: "job-8"

  - id: then-empty
    claim: Once the second worker has taken it, the queue is empty again.
    run: curl -sS amqp://127.0.0.1:{{port}}/%2F/jobs
    expect:
      exit: 0
      stdout: ""

  - id: app-refused
    claim: Without --allow-anonymous the app cannot queue a job; curl offers PLAIN only and the server offers CRAM-MD5, so curl stops before it sends anything, exit 67.
    run: curl -sS -d job-1 amqp://127.0.0.1:{{port3}}/%2F/jobs
    expect:
      exit: 67
      stdout: ""
      stderr-contains: 'AMQP server offers no mechanism this client can use (it offers "CRAM-MD5")'

  - id: worker-refused
    claim: Without it the STOMP worker is answered an ERROR frame, Authentication failed, and receives nothing.
    run: curl -sS -m 10 -T worker.stomp telnet://127.0.0.1:{{port4}}/
    expect:
      exit: 0
      stdout-matches: '\AERROR\r?\nmessage:Authentication failed'
