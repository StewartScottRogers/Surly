# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: ws-test-a-chat-round-trip
title: Testing a WebSocket Chat Round Trip
protocols: [ws]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlExchangeRecord, CurlClient, CurlWebSocket, CurlWebSocketMessage, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc6455]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The client sends three chat messages over one WebSocket to a server with --ws-echo, and each comes back whole as a text message, in the order sent.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\Aechoed: Text "hi", Text "how are you\?", Text "bye for now"\nin order: True\n'

  - id: close
    claim: The client closes with code 1000 and the server answers with a close frame carrying the same code.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nclose: Close 1000\n'

  - id: server-record
    claim: The server's record, read once the exchange has ended, shows what it sent; the 101 head, the three messages in order, one text frame each, and the close.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nserver sent: HTTP/1\.1 101 Switching Protocols, then text "hi", text "how are you\?", text "bye for now", close 1000\n\Z'

  - id: too-big
    claim: A message past the server's --max-message of 1k is not echoed; the server answers with a close frame, code 1009, message too big.
    program: program.cs
    args: [too-big]
    expect:
      exit: 0
      stdout: "answer: Close 1009\n"

  - id: no-echo
    claim: Without --ws-echo the server looks the path up as a file, finds no chat, and refuses the upgrade, so ConnectWebSocketAsync throws CurlException 22.
    program: program.cs
    args: [no-echo]
    expect:
      exit: 0
      stdout: "connect: CurlException 22 HttpReturnedError\n"
