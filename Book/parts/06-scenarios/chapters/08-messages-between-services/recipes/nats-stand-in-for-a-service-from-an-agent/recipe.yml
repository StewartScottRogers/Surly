# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs program.cs, a C# program on the official MCP SDK that
# starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: nats-stand-in-for-a-service-from-an-agent
title: Standing In for a NATS Service
protocols: [nats]
tier: scenarios
surface: mcp
mcp-tools: [start_server, get_exchanges, publish_message, curl]
curl-options: [-s, -S, -m, -d]
exit-codes: [0, 28, 56]
references: [surl-readme, curl-readme, curl-protocols, nats-protocol]
triplet: nats-stand-in-for-a-service

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The agent stands in for the price service; with a subscriber on prices.get, it reads the request's reply subject from the server's record and publishes price=9.99 there, and the app's request with sku=A1 gets price=9.99, exit 0.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\Aapp got: price=9\.99 \(exit 0\)\n'

  - id: what-was-asked
    claim: The subscriber's output is what the app asked, sku=A1, and the reply subject curl made for it is _INBOX. and 32 hexadecimal digits.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nthe app asked: sku=A1\nreply subject: _INBOX\.[0-9a-f]{32}\n'

  - id: server-record
    claim: get_exchanges holds both sides; the app's PUB to prices.get with that reply subject and 6 bytes, received, and the 10-byte MSG on it that the server sent the app.
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout-matches: '\nserver record, the app.s request: PUB prices\.get (_INBOX\.[0-9a-f]{32}) 6\nserver record, the reply sent to the app: MSG \1 1 10\n\Z'

  - id: no-stand-in
    claim: With nothing subscribed to prices.get, the server tells the app at once that nobody answers, and the curl tool answers exit 56, no responders.
    program: program.cs
    args: [none]
    expect:
      exit: 0
      stdout-matches: '\Aapp: exit 56, curl: \(56\) .*no responders'

  - id: silent-stand-in
    claim: 'A stand-in that receives the request and never answers still records it: the subscriber writes sku=A1, and the app waits until -m 3 and exits 28.'
    program: program.cs
    args: [silent]
    expect:
      exit: 0
      stdout-matches: '\Athe subscriber received: sku=A1\napp: exit 28, curl: \(28\) '
