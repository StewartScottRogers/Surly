# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: signalr-test-a-notification-client
title: Testing a SignalR Notification Client
protocols: [signalr]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: "A client listening on the stand-in hub receives what the test sends to the hub's Broadcast method: one notification, as target Broadcast with the text sent."
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout: "received: Broadcast: order 1042 has shipped\n"

  - id: order
    claim: "Three notifications sent one after another reach the client in the order sent."
    program: program.cs
    args: [order]
    timeout: 120
    expect:
      exit: 0
      stdout: "received: Broadcast: first\nreceived: Broadcast: second\nreceived: Broadcast: third\n"

  - id: sender-copy
    claim: "The hub also calls the sender back, so a test that sends with no client listening gets its own copy of the call as the response."
    program: program.cs
    args: [copy]
    timeout: 120
    expect:
      exit: 0
      stdout: "sender got: [\"Broadcast\",\"order 1042 has shipped\"]\n"

  - id: two-listeners
    claim: "Two clients listening at once each receive the notification."
    program: program.cs
    args: [two]
    timeout: 120
    expect:
      exit: 0
      stdout: "one received: Broadcast: order 1042 has shipped\ntwo received: Broadcast: order 1042 has shipped\n"

  - id: no-replay
    claim: "A notification sent before the client connected is not replayed: the first thing the client receives is the one sent after."
    program: program.cs
    args: [missed]
    timeout: 120
    expect:
      exit: 0
      stdout: "received: Broadcast: sent after\n"

  - id: silence
    claim: "A client that is sent nothing receives nothing: the bounded wait ends after 1.5 seconds with no notification instead of hanging."
    program: program.cs
    args: [silent]
    timeout: 120
    expect:
      exit: 0
      stdout: "received: nothing within 1.5 s\n"

  - id: anonymous-refused
    claim: "Without AllowAnonymous the hub refuses the client's negotiate request: connecting throws CurlException with Code HttpReturnedError and the message SignalR: The negotiate request failed with HTTP status 401."
    program: program.cs
    args: [refused]
    timeout: 120
    expect:
      exit: 0
      stdout: "HttpReturnedError: SignalR: The negotiate request failed with HTTP status 401.\n"
