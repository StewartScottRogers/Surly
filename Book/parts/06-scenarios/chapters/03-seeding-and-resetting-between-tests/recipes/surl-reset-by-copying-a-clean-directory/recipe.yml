# Executable specification. key MUST equal the folder name and never changes once published.
# The script starts and stops its own surl for each test; held is the one long-running server,
# there to show a data directory in use.
schema: 2
key: surl-reset-by-copying-a-clean-directory
title: Resetting by Copying a Clean Directory
protocols: [http]
tier: scenarios
surl-options: [-s, --directory, --user, --allow-uploads]
curl-options: [-s, -o, --digest, -u, -T]
exit-codes: [0, 124]
references: [surl-readme, rfc7616, rfc9110]

fixtures:
  clean/counter.txt: "1\n"
  held/counter.txt: "1\n"
  fresh-copy.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Runs one test on a fresh copy of clean/: copies it to data/, starts surl on the copy,
    # runs the test, stops surl. Usage: sh fresh-copy.sh <port> [keep]
    #   keep  start on data/ as the last test left it, without copying clean/ again
    url=http://127.0.0.1:$1/
    if [ "$2" != keep ]; then
      rm -rf data && cp -R clean data || exit 1
    fi
    surl -s --directory data --user tester:secret --allow-uploads "$url" &
    pid=$!
    tries=0
    until curl -s -o /dev/null "$url"; do        # wait until surl answers
      tries=$((tries + 1))
      if [ "$tries" -ge 50 ]; then echo "surl did not start" >&2; kill "$pid"; exit 1; fi
      sleep 0.1
    done
    # The test: read the counter, write it back one higher, read it again.
    n=$(curl -s --digest -u tester:secret "${url}counter.txt")
    echo "$n"
    echo $((n + 1)) | curl -s --digest -u tester:secret -T - "${url}counter.txt"
    curl -s --digest -u tester:secret "${url}counter.txt"
    kill "$pid"
    wait "$pid" 2>/dev/null
    exit 0

servers:
  held:
    command: surl --directory held http://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The script copies clean to data, starts surl on the copy, and the test reads the counter as 1 and leaves it at 2.
    run: sh fresh-copy.sh {{port}}
    timeout: 60
    expect:
      exit: 0
      stdout: "1\n2\n"

  - id: next-test-starts-clean
    claim: The next test gets a new copy, so it reads 1 again, though the last test left 2.
    run: sh fresh-copy.sh {{port2}}
    timeout: 60
    expect:
      exit: 0
      stdout: "1\n2\n"
      files:
        clean/counter.txt: "1\n"
        data/counter.txt: "2\n"

  - id: without-a-copy
    claim: Started on data as the last test left it, without a new copy, the next test reads 2, the last test's change.
    run: sh fresh-copy.sh {{port3}} keep
    timeout: 60
    expect:
      exit: 0
      stdout: "2\n3\n"

  - id: stop-before-copying
    claim: A data directory a running surl still serves cannot be served by another; the second surl exits 124, so stop the last test's server before starting the next.
    run: surl --directory held http://127.0.0.1:{{port5}}/
    timeout: 10
    expect:
      exit: 124
      stderr-contains: "is in use by another surl process"
