# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: redis-seed-a-cache-for-a-test-from-an-agent
title: Seeding a Cache for a Test
protocols: [redis, http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, set_key, read_key, curl]
curl-options: [-s, -S, -u, -i]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, curl-protocols, redis-resp, rfc9110, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A setting seeded with set_key and no expire_ms, a cached copy seeded with expire_ms 4000 and a file in start_server's files all read back as seeded through curl; five seconds later the setting is still there, the copy is a tool error in read_key and null in curl, and the origin file still answers over HTTP.
    program: program.cs
    args: [expire]
    timeout: 90
    expect:
      exit: 0
      stdout: "set_key settings:currency, expire_ms none: 3 bytes\ncurl GET/settings:currency: exit 0, EUR\nset_key cache:products, expire_ms 4000: 11 bytes\nread_key cache:products: cached-copy, expires_at a time\ncurl GET/cache:products: exit 0, cached-copy\ncurl GET/settings:currency: exit 0, EUR\nread_key cache:products: error: No such key.\ncurl GET/cache:products: exit 0, null\ncurl products.json: exit 0, {\"items\":[\"tea\",\"coffee\"]}\n"

  - id: time-to-live
    claim: The seeded copy has an expires_at in read_key and a positive time to live, the setting seeded with no expiry has no expires_at and the time to live -1, and a key never seeded is a tool error with -2.
    program: program.cs
    args: [ttl]
    timeout: 90
    expect:
      exit: 0
      stdout: "set_key settings:currency, expire_ms none: 3 bytes\nset_key cache:prices, expire_ms 60000: 6 bytes\nread_key settings:currency: EUR, expires_at none\ncurl TTL/settings:currency: exit 0, -1\nread_key cache:prices: seeded, expires_at a time\ncurl TTL/cache:prices: exit 0, positive\nread_key never-seeded: error: No such key.\ncurl TTL/never-seeded: exit 0, -2\n"

  - id: miss-now
    claim: A test that cannot wait forces the miss at once, and curl's DEL answers 1, the next GET is null, and a second set_key puts a copy back for the app to find.
    program: program.cs
    args: [miss-now]
    timeout: 90
    expect:
      exit: 0
      stdout: "set_key settings:currency, expire_ms none: 3 bytes\nset_key cache:orders, expire_ms 60000: 3 bytes\ncurl DEL/cache:orders: exit 0, 1\ncurl GET/cache:orders: exit 0, null\nset_key cache:orders, expire_ms 60000: 8 bytes\ncurl GET/cache:orders: exit 0, refilled\n"

  - id: origin-statuses
    claim: The same account reads the origin over HTTP with status 200, a file that is not in the content is 404, and a request with no login is 401.
    program: program.cs
    args: [origin]
    timeout: 90
    expect:
      exit: 0
      stdout: "set_key settings:currency, expire_ms none: 3 bytes\nproducts.json with a login: HTTP/1.1 200 OK\nmissing.json with a login: HTTP/1.1 404 Not Found\nproducts.json with no login: HTTP/1.1 401 Unauthorized\n"

  - id: plaintext-refused
    claim: Without --allow-plaintext-auth the account's login over redis:// is refused and curl exits 67 with WRONGPASS.
    program: program.cs
    args: [no-plaintext]
    timeout: 90
    expect:
      exit: 0
      stdout-matches: '^set_key settings:currency, expire_ms none: 3 bytes\ncurl GET/settings:currency: exit 67, null \(curl: \(67\) Redis server answered HELLO with error: WRONGPASS '
