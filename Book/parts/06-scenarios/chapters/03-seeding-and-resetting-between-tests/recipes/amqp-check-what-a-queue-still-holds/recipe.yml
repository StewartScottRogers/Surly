# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs check-queue.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: amqp-check-what-a-queue-still-holds
title: Checking What a Queue Still Holds
protocols: [amqp, stomp]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, browse_queue, wait_for_event, get_events]
curl-options: [-s, -S, -u, -d, -m, -T]
exit-codes: [0, 1, 28, 67]
references: [surl-readme, curl-readme, amqp091, stomp12]

# worker.stomp is a worker that holds jobs: STOMP frames, each ended by a NUL byte. It logs in,
# subscribes to the queue with per-message acknowledgement and acknowledges the first two messages.
fixtures:
  worker.stomp: "CONNECT\naccept-version:1.2\nhost:/\nlogin:worker\npasscode:s3cret\n\n\0SUBSCRIBE\nid:0\ndestination:/queue/jobs\nack:client-individual\n\n\0ACK\nid:1\n\n\0ACK\nid:2\n\n\0"

cases:
  - id: solution
    role: solution
    claim: The app queues five jobs over AMQP and the worker takes two; browse_queue reports job-3, job-4 and job-5 ready and none in flight, and the bus's events count five enqueued, two delivered and two acknowledged.
    program: check-queue.cs
    args: [report]
    expect:
      exit: 0
      stdout: "worker took job-1\nworker took job-2\nafter the worker: ready 3 [job-3, job-4, job-5], in flight 0\nget_events: enqueued 5, delivered 2, acknowledged 2\n"

  - id: in-flight
    claim: A worker that has all five jobs and has acknowledged two leaves none ready and three in flight, counted but not listed; when its connection ends, the three come back as ready jobs.
    program: check-queue.cs
    args: [in-flight]
    expect:
      exit: 0
      stdout: "while the worker runs: ready 0 [], in flight 3\nworker ended: curl exit 28\nafter it ended: ready 3 [job-3, job-4, job-5], in flight 0\nget_events: enqueued 5, delivered 5, acknowledged 2\n"

  - id: no-queue
    claim: browse_queue on a queue the server does not have is a tool error, No queue job.
    program: check-queue.cs
    args: [no-queue]
    expect:
      exit: 1
      stdout: "browse_queue job: tool error yes, No queue job.\n"

  - id: no-plaintext
    claim: Without --allow-plaintext-auth the broker offers only CRAM-MD5 on amqp://, which curl does not use for AMQP, so the app's first publish exits 67.
    program: check-queue.cs
    args: [no-plaintext]
    expect:
      exit: 1
      stdout: "app could not queue job-1: curl exit 67, curl: (67) AMQP server offers no mechanism this client can use (it offers \"CRAM-MD5\")\n"
