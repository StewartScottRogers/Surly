# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: mqtt-change-retained-config-mid-test
title: Changing Retained Config Mid-Test
protocols: [mqtt]
tier: scenarios
surl-options: [--allow-anonymous, --topic, --directory]
curl-options: [-s, -S, -d, --next]
exit-codes: [0, 8]
references: [surl-readme, curl-readme, curl-protocols, mqtt311]

# state/ must exist before surl --directory opens it.
fixtures:
  state/README.txt: "retained messages are kept here\n"

# main is the recipe: it keeps what is published under devices/. noretain keeps nothing. closed has no
# --allow-anonymous. kept holds its retained messages on disk, so a restart can be a case.
servers:
  main:
    command: surl --allow-anonymous --topic "devices/#;retain" mqtt://127.0.0.1:{{port}}/
    ready: port
  noretain:
    command: surl --allow-anonymous mqtt://127.0.0.1:{{port2}}/
    ready: port
  closed:
    command: surl --topic "devices/#;retain" mqtt://127.0.0.1:{{port3}}/
    ready: port
  kept:
    command: surl --allow-anonymous --directory state --topic "devices/#;retain" mqtt://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A config published to devices/lamp/config is what the device reads when it connects, and after a second publish to the same topic the device's second read is the new config alone, each read written as the topic's length in two bytes, the topic and the message.
    run: curl -s -d interval=60 mqtt://127.0.0.1:{{port}}/devices/lamp/config --next -s mqtt://127.0.0.1:{{port}}/devices/lamp/config --next -s -d interval=15 mqtt://127.0.0.1:{{port}}/devices/lamp/config --next -s mqtt://127.0.0.1:{{port}}/devices/lamp/config
    expect:
      exit: 0
      stdout-matches: '\A\x00\x13devices/lamp/configinterval=60\x00\x13devices/lamp/configinterval=15\Z'

  - id: later-device
    claim: The change replaces the old config and does not add to it, so a device that connects after the change, with no publish of its own, reads one message, the new config.
    run: curl -s mqtt://127.0.0.1:{{port}}/devices/lamp/config
    expect:
      exit: 0
      stdout-matches: '\A\x00\x13devices/lamp/configinterval=15\Z'

  - id: replaced-twice
    claim: Two changes in a row leave only the last, so a device that connects afterwards reads the second change and nothing of the first.
    run: curl -s -d interval=30 mqtt://127.0.0.1:{{port}}/devices/door/config --next -s -d interval=5 mqtt://127.0.0.1:{{port}}/devices/door/config --next -s mqtt://127.0.0.1:{{port}}/devices/door/config
    expect:
      exit: 0
      stdout-matches: '\A\x00\x13devices/door/configinterval=5\Z'

  - id: other-topic-untouched
    claim: A change to one topic leaves another topic's config as it was, so the lamp still reads interval=15 after the door's config changed.
    run: curl -s mqtt://127.0.0.1:{{port}}/devices/lamp/config
    expect:
      exit: 0
      stdout-matches: '\A\x00\x13devices/lamp/configinterval=15\Z'

  - id: clear-the-config
    claim: Publishing an empty message clears the topic, so a device that connects afterwards finds no config, reads nothing and curl still exits 0.
    run: curl -s -d "" mqtt://127.0.0.1:{{port}}/devices/lamp/config --next -s mqtt://127.0.0.1:{{port}}/devices/lamp/config
    expect:
      exit: 0
      stdout: ""

  - id: outside-the-filter
    claim: A config on a topic outside the --topic filter is not kept, so the device that connects next reads nothing, though the publish was accepted and exited 0.
    run: curl -s -d interval=60 mqtt://127.0.0.1:{{port}}/lab/lamp/config --next -s mqtt://127.0.0.1:{{port}}/lab/lamp/config
    expect:
      exit: 0
      stdout: ""

  - id: no-retain-filter
    claim: A surl started without ;retain keeps no config at all, because curl publishes with the retain flag clear, so the device reads nothing.
    run: curl -s -d interval=60 mqtt://127.0.0.1:{{port2}}/devices/lamp/config --next -s mqtt://127.0.0.1:{{port2}}/devices/lamp/config
    expect:
      exit: 0
      stdout: ""

  - id: seed-the-kept-one
    claim: On the surl started with --directory the config is seeded the same way, and the device reads it.
    run: curl -s -d interval=60 mqtt://127.0.0.1:{{port4}}/devices/lamp/config --next -s mqtt://127.0.0.1:{{port4}}/devices/lamp/config
    expect:
      exit: 0
      stdout-matches: '\A\x00\x13devices/lamp/configinterval=60\Z'

  - id: after-a-restart
    claim: With --directory the retained config is on disk, so after surl restarts the device still reads it.
    restart: [kept]
    run: curl -s mqtt://127.0.0.1:{{port4}}/devices/lamp/config
    expect:
      exit: 0
      stdout-matches: '\A\x00\x13devices/lamp/configinterval=60\Z'

  - id: no-anonymous-refused
    claim: Without --allow-anonymous the surl refuses the publish of the change, curl exits 8 and writes Expected 0000 but got 0005, so the config never changes.
    run: curl -sS -d interval=15 mqtt://127.0.0.1:{{port3}}/devices/lamp/config
    expect:
      exit: 8
      stdout: ""
      stderr-contains: "got 0005"
