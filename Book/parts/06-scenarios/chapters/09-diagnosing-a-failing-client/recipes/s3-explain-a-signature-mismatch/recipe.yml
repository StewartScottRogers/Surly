# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs explain-signature.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the client.
schema: 2
key: s3-explain-a-signature-mismatch
title: Explaining an S3 Signature Mismatch
protocols: [s3]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, wait_for_event, get_exchanges]
curl-options: [-s, -S, --cacert, --connect-to, -w, -H, -u, --aws-sigv4]
exit-codes: [0]
references: [surl-readme, curl-manual, aws-s3-api]

fixtures: {}

# A certificate for 127.0.0.1 and for any bucket's host name in us-east-1; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

cases:
  - id: solution
    role: solution
    claim: "An app's own signer signs /photos/hello.txt and sends GET /hello.txt to the bucket's host; the server answers 403 SignatureDoesNotMatch. get_exchanges shows the request with the scope us-east-1/s3/aws4_request and the signed headers host, x-amz-content-sha256 and x-amz-date; signed again with the account's secret, the request as received differs and the reading with the bucket in the path matches, so the agent names the canonical path."
    program: explain-signature.cs
    args: [path]
    timeout: 120
    expect:
      exit: 0
      stdout: "client: 403 SignatureDoesNotMatch\nsigned: GET /hello.txt, scope us-east-1/s3/aws4_request, headers host;x-amz-content-sha256;x-amz-date\nas received: differs\nwith the bucket in the path: matches\nwith UNSIGNED-PAYLOAD as the payload hash: differs\ndiagnosis: the client signed the request with the bucket in the path: the canonical path it signed is not /hello.txt, the path it sent\n"

  - id: secret
    claim: curl signing with a wrong secret also gets 403 SignatureDoesNotMatch; no reading reproduces its signature, and the agent names the signing key.
    program: explain-signature.cs
    args: [secret]
    timeout: 120
    expect:
      exit: 0
      stdout: "client: 403 SignatureDoesNotMatch\nsigned: GET /hello.txt, scope us-east-1/s3/aws4_request, headers host;x-amz-content-sha256;x-amz-date\nas received: differs\nwith the bucket in the path: differs\nwith UNSIGNED-PAYLOAD as the payload hash: differs\ndiagnosis: no reading reproduces the client's signature, which leaves the signing key: check the secret\n"

  - id: right
    claim: curl signing with the right secret gets 200, and the agent's signature of the request as received matches the client's.
    program: explain-signature.cs
    args: [right]
    timeout: 120
    expect:
      exit: 0
      stdout: "client: 200\nsigned: GET /hello.txt, scope us-east-1/s3/aws4_request, headers host;x-amz-content-sha256;x-amz-date\nas received: matches\nwith the bucket in the path: differs\nwith UNSIGNED-PAYLOAD as the payload hash: differs\ndiagnosis: the signature is right for the request as it arrived\n"
