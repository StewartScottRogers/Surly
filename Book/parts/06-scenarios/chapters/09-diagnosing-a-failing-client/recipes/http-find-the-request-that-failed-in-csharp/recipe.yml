# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-find-the-request-that-failed-in-csharp
title: Finding the Request That Failed in C#
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, SurlExchangeChunk, SurlExchangeDirection, SurlEventQuery, SurlEventKind, LogLevel, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: client-run
    claim: The client run makes fifty requests and one of them is not answered 200; nothing throws, and the client side knows no more than that.
    program: find-failed-request.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^run: 50 requests, 49 answered 200\n'

  - id: solution
    role: solution
    claim: Narrowed, the recorded exchange gives the one failing answer, 404, with the request that caused it, its place in the run and its exchange, and the server's reason from its log, that nothing exists at that path.
    program: find-failed-request.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nrequest 37 of the run, exchange \d+\n> GET /reports/report-37\.csv HTTP/1\.1\n> Host: 127\.0\.0\.1:\d+\n> Accept: \*/\*\n\* GET /reports/report-37\.csv: 404, nothing exists at [^\n]*report-37\.csv\n< HTTP/1\.1 404 Not Found\n< Server: surl\n< Content-Type: text/plain; charset=utf-8\n< Content-Length: 14\n\n50 requests, 1 answered 400 or more\n$'

  - id: one-exchange
    claim: One CurlClient made all fifty requests over one connection, so they are one recorded exchange, and the exchange alone does not point at the request.
    program: find-failed-request.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nexchanges: 1\n'

  - id: nothing-failed
    claim: Over a run in which every request succeeds, the test finds no answer of 400 or more and exits 1.
    program: find-failed-request.cs
    args: [clean]
    expect:
      exit: 1
      stdout-matches: '\n36 requests, 0 answered 400 or more\n$'
