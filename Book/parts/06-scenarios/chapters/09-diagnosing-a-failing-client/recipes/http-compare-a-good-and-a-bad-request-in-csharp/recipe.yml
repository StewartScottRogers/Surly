# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-compare-a-good-and-a-bad-request-in-csharp
title: Comparing a Good and a Bad Request
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, SurlEventQuery, SurlEventKind, LogLevel, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: good-client
    claim: The client that sends its key as X-Api-Key gets the report, 200.
    program: compare-requests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^good client: 200\n'

  - id: bad-client
    claim: The client whose header name ends in a space is answered 400 Bad Request by the same server, with that one line as the body; SendAsync throws nothing.
    program: compare-requests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nbad client: 400, body 400 Bad Request, '

  - id: solution
    role: solution
    claim: Side by side, the two recorded requests differ in one line, the X-Api-Key header with and without the space, and the server's log says it read no request head because of the whitespace before the colon.
    program: compare-requests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\ngood: exchange \d+, answered 200\nbad:  exchange \d+, answered 400\n- X-Api-Key: k123\n\+ X-Api-Key : k123\nsame: \d+ lines\nwhy:  No request head was read: WhitespaceBeforeColon; answered 400 and closed\.\n$'

  - id: same-other-lines
    claim: Every other line of the two requests is the same, the request line, Host and Accept, so the header is the whole difference.
    program: compare-requests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsame: 3 lines\n'

  - id: closes-the-connection
    claim: The 400 for a malformed head also closes the connection, Connection close.
    program: compare-requests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nbad client: 400, [^\n]*, Connection close\n'

  - id: missing-host
    claim: The same comparison finds any header; a request with Host removed differs from the good one by that line, and the server names that reason instead.
    program: compare-requests.cs
    args: [no-host]
    expect:
      exit: 0
      stdout-matches: '\nbad:  exchange \d+, answered 400\n- Host: 127\.0\.0\.1:\d+\nsame: 3 lines\nwhy:  GET /report\.csv: a request may carry at most one Host field, and an HTTP/1\.1 request needs one; answered 400 and closed\.\n$'
