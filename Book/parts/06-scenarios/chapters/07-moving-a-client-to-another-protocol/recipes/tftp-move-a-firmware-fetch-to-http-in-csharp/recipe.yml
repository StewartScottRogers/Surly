# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: tftp-move-a-firmware-fetch-to-http-in-csharp
title: Moving a Firmware Fetch to HTTP
protocols: [tftp, http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlTftpOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc1350, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api, on two listeners.

cases:
  - id: solution
    role: solution
    claim: One in-memory image served over TFTP and HTTP is fetched both ways with Curl.Api, and the two copies are the same 1300 bytes as the image the server holds.
    program: firmware-over-http.cs
    args: []
    expect:
      exit: 0
      stdout: "tftp: 1300 bytes\nhttp: 1300 bytes\nidentical\n"

  - id: exact-blocks
    claim: An image of exactly 1024 bytes, two full TFTP blocks, arrives whole over both.
    program: firmware-over-http.cs
    args: [exact]
    expect:
      exit: 0
      stdout: "tftp: 1024 bytes\nhttp: 1024 bytes\nidentical\n"

  - id: block-size
    claim: A CurlTftpOptions with a block size of 1024 changes how the image travels over TFTP and not what arrives.
    program: firmware-over-http.cs
    args: [blksize]
    expect:
      exit: 0
      stdout: "tftp: 1300 bytes\nhttp: 1300 bytes\nidentical\n"

  - id: missing
    claim: A missing image throws a CurlException whose Code is TftpNotFound, 68, over TFTP, and is an ordinary 404 Not Found response over HTTP that throws nothing.
    program: firmware-over-http.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "tftp: TftpNotFound (68)\nhttp: 404 Not Found\n"

  - id: write-refused
    claim: An upload over HTTP is answered 401 Unauthorized, because surl has uploads off and no login configured.
    program: firmware-over-http.cs
    args: [write]
    expect:
      exit: 0
      stdout: "http: 401 Unauthorized\n"
