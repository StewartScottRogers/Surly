schema: 2
key: mqtt-move-a-device-to-mqtt5-in-csharp
title: Moving a Device to MQTT 5 in C#
protocols: [mqtt, mqtt5]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlRetainedMessage, SurlEventQuery, SurlEventKind, SurlEvent, CurlClient, CurlRequest, CurlContent, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 8, 67]
references: [surl-readme, curl-readme, mqtt311, mqtt5]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A device on MQTT 3.1.1 publishes 68 and a subscriber over MQTT 5 receives it, the payload alone; the broker holds the same 68.
    program: program.cs
    args: ["old-to-new"]
    expect:
      exit: 0
      stdout: "mqtt5 subscriber reads: 68\nbroker keeps: 68\n"

  - id: new-to-old
    claim: A message from the MQTT 5 side is received by an MQTT 3.1.1 subscriber, which is given the topic's length, 15, and the topic before the payload.
    program: program.cs
    args: ["new-to-old"]
    expect:
      exit: 0
      stdout: "mqtt subscriber reads: length 15, topic plant/hall/temp, payload 71\n"

  - id: one-message-per-topic
    claim: The bus keeps one retained message per topic; after the old device publishes 72 over the 71 the MQTT 5 side left, an MQTT 5 subscriber receives 72 alone.
    program: program.cs
    args: ["replaced"]
    expect:
      exit: 0
      stdout: "mqtt5 subscriber reads: 72\n"

  - id: empty-message-clears
    claim: An empty message from the MQTT 5 side clears the topic for the old device, which receives 0 bytes, and the broker keeps nothing.
    program: program.cs
    args: ["clear"]
    expect:
      exit: 0
      stdout: "mqtt subscriber reads 0 bytes\nbroker keeps: nothing\n"

  - id: outside-the-filter
    claim: A publish by the old device to a topic outside the --topic filter is kept by neither listener; the MQTT 5 subscriber reads nothing and the broker keeps nothing.
    program: program.cs
    args: ["outside"]
    expect:
      exit: 0
      stdout: "mqtt5 subscriber reads: nothing\nbroker keeps: nothing\n"

  - id: same-login-both
    claim: One account serves both versions; the login that published over MQTT 3.1.1 reads the message back over MQTT 5.
    program: program.cs
    args: ["login"]
    expect:
      exit: 0
      stdout: "mqtt5 subscriber reads: 21\n"

  - id: wrong-password-mqtt3
    claim: A wrong password over MQTT 3.1.1 makes the call throw CurlException with code 8, WeirdServerReply, and the message that it got 0004.
    program: program.cs
    args: ["wrong-password", "mqtt"]
    expect:
      exit: 8
      stdout: "mqtt refused: curl code 8 WeirdServerReply: Expected 0000 but got 0004\n"

  - id: wrong-password-mqtt5
    claim: The same wrong password over MQTT 5 is code 67, LoginDenied, with reason code 0x86, so a test that catches code 8 from the old device has to catch 67 from the new one.
    program: program.cs
    args: ["wrong-password", "mqtt5"]
    expect:
      exit: 67
      stdout: "mqtt5 refused: curl code 67 LoginDenied: MQTT 5 CONNACK reason code 0x86 BadUserNameOrPassword\n"

  - id: no-login-mqtt3
    claim: A connection with no user name is refused with code 5, not authorized, over MQTT 3.1.1, code 8 again.
    program: program.cs
    args: ["no-login", "mqtt"]
    expect:
      exit: 8
      stdout: "mqtt refused: curl code 8 WeirdServerReply: Expected 0000 but got 0005\n"

  - id: no-login-mqtt5
    claim: It is reason code 0x87, NotAuthorized, over MQTT 5, code 67.
    program: program.cs
    args: ["no-login", "mqtt5"]
    expect:
      exit: 67
      stdout: "mqtt5 refused: curl code 67 LoginDenied: MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"

  - id: clear-password-refused-mqtt3
    claim: With no AllowPlaintextAuthentication the right password is refused unchecked over MQTT 3.1.1, as not authorized, 0005.
    program: program.cs
    args: ["clear-password", "mqtt"]
    expect:
      exit: 8
      stdout: "mqtt refused: curl code 8 WeirdServerReply: Expected 0000 but got 0005\n"

  - id: clear-password-refused-mqtt5
    claim: It is refused the same way over MQTT 5, with 0x87.
    program: program.cs
    args: ["clear-password", "mqtt5"]
    expect:
      exit: 67
      stdout: "mqtt5 refused: curl code 67 LoginDenied: MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"
