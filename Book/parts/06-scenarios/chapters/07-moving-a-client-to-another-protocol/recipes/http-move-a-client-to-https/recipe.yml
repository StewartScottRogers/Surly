# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: http-move-a-client-to-https
title: Moving a Client from HTTP to HTTPS
protocols: [http, https]
tier: scenarios
surl-options: [--directory, --cert, --key, --trace-ascii]
curl-options: [--proto, --cacert, -s, -S]
exit-codes: [0, 1, 7, 58]
references: [rfc9110, rfc8446, surl-readme, curl-manual]

fixtures:
  during/hello.txt: "hello from surl\n"
  after/hello.txt: "hello from surl\n"
  requests.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Lists the requests a surl --trace-ascii file records: scheme, method, path, status.
    # surl traces an exchange's last lines a moment after its client has gone: wait, at most 10 s,
    # until every exchange the trace opened has ended.
    i=0; until [ "$(grep -c 'Exchange [0-9]* opened: ' "$1")" -eq "$(grep -c 'Exchange [0-9]* ended; ' "$1")" ]; do i=$((i+1)); [ $i -ge 100 ] && break; sleep 0.1; done
    awk '/ opened: / { scheme[$1] = $6 }
         / \* GET / { sub(/:$/, "", $4); sub(/,$/, "", $5); print scheme[$1], $3, $4, $5 }' "$1"

# A certificate for 127.0.0.1, which the client trusts with --cacert.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

servers:
  # During the move: the same files over plain HTTP (8080) and HTTPS (8081).
  during:
    command: surl --directory during --cert server.pem --key server.key --trace-ascii during.log http://127.0.0.1:{{port}}/ https://127.0.0.1:{{port2}}/
    ready: port
  # After the move: HTTPS only (8082); nothing listens on 8083, where plain HTTP was.
  after:
    command: surl --directory after --cert server.pem --key server.key --trace-ascii after.log https://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The moved client fetches over HTTPS with --proto =https, trusting the server's certificate with --cacert, while both listeners are up.
    run: curl --proto =https --cacert server.pem https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: plain-still-served
    claim: During the move a client not yet moved still gets the same file over plain HTTP from the same server.
    run: curl http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: guard-refuses-plain
    claim: With --proto =https a plain http URL left in the client fails at once, exit 1, Protocol "http" is disabled, even though the plain listener would answer.
    run: curl -sS --proto =https http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 1
      stderr-contains: 'curl: (1) Protocol "http" is disabled'

  - id: during-record
    claim: The server's trace records two requests, the Solution's over https and the unmoved client's over http; the call --proto refused never reached it.
    run: sh requests.sh during.log
    expect:
      exit: 0
      stdout: "https GET /hello.txt 200\nhttp GET /hello.txt 200\n"

  - id: after-https
    claim: After the move the server has only its HTTPS listener, and the moved client is served as before.
    run: curl --proto =https --cacert server.pem https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: after-plain-gone
    claim: A client still on a plain http URL cannot connect once nothing listens for it, exit 7.
    run: curl -sS http://127.0.0.1:{{port4}}/hello.txt
    expect:
      exit: 7
      stderr-contains: "curl: (7) Failed to connect to 127.0.0.1"

  - id: after-record
    claim: Every request the HTTPS-only server's trace records came in over https.
    run: sh requests.sh after.log
    expect:
      exit: 0
      stdout: "https GET /hello.txt 200\n"

  - id: https-needs-a-certificate
    claim: An https listen URL with no --cert and no --self-signed is refused before anything listens, exit 58.
    run: surl https://127.0.0.1:{{port5}}/
    expect:
      exit: 58
      stderr-contains: "needs a certificate: give --cert <file>, or --self-signed for a throwaway one"
