# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs logins.cs, a C# program on the official MCP SDK that
# starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: http-move-logins-from-basic-to-digest-from-an-agent
title: Moving Logins from Basic to Digest
protocols: [http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, get_events, get_exchanges]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc7617, rfc7616, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: During the move an agent logs in through curl-mcp as billing with Basic and as search with Digest; both get 200, the login_judged events name billing as still sending Basic, and they hold no password; exit 0.
    program: logins.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nbilling, Basic: 200\nsearch, Digest: 200\nlogin judged: Basic billing accepted\nlogin judged: Digest search accepted\nstill sending Basic: billing\nmoved to Digest: search\nevents hold a password: no\n$'

  - id: loosening-warns
    claim: start_server answers the warning --allow-plaintext-auth gives on start in its log_lines.
    program: logins.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^surl: warning: --allow-plaintext-auth: passwords and tokens are accepted over unencrypted connections\n'

  - id: basic-client-found
    claim: get_events, asked for login_judged, names each login's mechanism and account, so the agent finds billing as the client still sending Basic.
    program: logins.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nstill sending Basic: billing\n'

  - id: digest-client-found
    claim: The same events name search as the account that logged in with Digest.
    program: logins.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmoved to Digest: search\n'

  - id: password-not-recorded
    claim: The events name the accounts but hold neither password.
    program: logins.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nevents hold a password: no\n$'

  - id: both-offered
    claim: During the move a request with no login is answered 401 with three Digest challenges, then Basic and Bearer.
    program: logins.cs
    args: [challenge]
    expect:
      exit: 0
      stdout: "no login offers: 401 Digest, Digest, Digest, Basic, Bearer\n"

  - id: wrong-basic-password
    claim: A Basic login with the wrong password is checked and answered 401 during the move.
    program: logins.cs
    args: [wrong]
    expect:
      exit: 0
      stdout-matches: '^billing, Basic, wrong password: 401\n'

  - id: refusal-logged
    claim: The refused Basic login is a login_judged event under the account it claimed, with is_accepted false.
    program: logins.cs
    args: [wrong]
    expect:
      exit: 0
      stdout-matches: '\nlogin judged: Basic billing refused\n$'

  - id: anyauth-picks-digest
    claim: Given --anyauth, curl picks Digest from the challenge, gets 200, and the login is recorded as Digest.
    program: logins.cs
    args: [any]
    expect:
      exit: 0
      stdout: "billing, --anyauth: 200\nlogin judged: Digest billing accepted\n"

  - id: cutover-refuses-basic
    claim: On a server started without --allow-plaintext-auth a Basic login over plain HTTP is answered 403, the right password included.
    program: logins.cs
    args: [cutover]
    expect:
      exit: 0
      stdout-matches: '^billing, Basic: 403\n'

  - id: cutover-no-challenge
    claim: The 403 carries no WWW-Authenticate header.
    program: logins.cs
    args: [cutover]
    expect:
      exit: 0
      stdout-matches: '\nbilling, Basic, offers: 403 nothing\n'

  - id: cutover-digest-only
    claim: After the cutover a request with no login is offered the three Digest challenges and nothing else.
    program: logins.cs
    args: [cutover]
    expect:
      exit: 0
      stdout-matches: '\nno login offers: 401 Digest, Digest, Digest\n'

  - id: cutover-serves-digest
    claim: After the cutover search logs in with --digest and billing with --anyauth, so a client that picks from the challenge survives the move.
    program: logins.cs
    args: [cutover]
    expect:
      exit: 0
      stdout-matches: '\nsearch, Digest: 200\nbilling, --anyauth: 200\n'

  - id: cutover-still-finds-basic
    claim: After the cutover no Basic login is judged, but get_exchanges still shows the two requests that arrived with Basic.
    program: logins.cs
    args: [cutover]
    expect:
      exit: 0
      stdout-matches: '\nBasic logins judged: 0\nrequests that arrived with Basic: 2\n$'
