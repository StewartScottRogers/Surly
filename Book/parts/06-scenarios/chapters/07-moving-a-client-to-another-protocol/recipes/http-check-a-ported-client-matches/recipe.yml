# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: http-check-a-ported-client-matches
title: Checking a Ported Client Matches
protocols: [http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, transfer, get_events, get_exchanges]
curl-options: [-s, --compressed, -u, -e, -A, -H, -d, -o]
surl-options: [--allow-anonymous, --allow-uploads]
exit-codes: [0]
references: [surl-readme, curl-readme, curl-manual, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "A port of a curl command line with -u, -e and --compressed that sets only the method, user agent, two headers and the body is found by comparing the two recorded requests to lack Authorization, Accept-Encoding and Referer; once the agent adds those three headers with the values the old client's request carried, the port's recorded request matches it, Content-Type and Content-Length included."
    program: program.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "port, first try: only the old client sent Authorization; only the old client sent Accept-Encoding; only the old client sent Referer\nport, second try: the two requests match\n"

  - id: body
    claim: "A port that sends its body with a trailing newline is found even after the headers match: the recorded Content-Length is 4 where the old client's was 3, and the bodies differ."
    program: program.cs
    args: [body]
    expect:
      exit: 0
      stdout: "port, first try: only the old client sent Authorization; only the old client sent Accept-Encoding; only the old client sent Referer; Content-Length differs: old 3, port 4; body\nport, second try: Content-Length differs: old 3, port 4; body\n"

  - id: plain
    claim: "A port of a plain GET with a user agent and two headers matches the old client's recorded request at the first try: transfer's userAgent field is curl's -A, and its headers are curl's -H."
    program: program.cs
    args: [plain]
    expect:
      exit: 0
      stdout: "port, first try: the two requests match\n"

  - id: no-agent
    claim: "A port that leaves out the userAgent sends no User-Agent at all, where the old client sent nightly/2; the comparison lists it with the three headers the first port lacked, and copying them from the old request makes the two match."
    program: program.cs
    args: [no-agent]
    expect:
      exit: 0
      stdout: "port, first try: only the old client sent Authorization; only the old client sent User-Agent; only the old client sent Accept-Encoding; only the old client sent Referer\nport, second try: the two requests match\n"

  - id: no-method
    claim: "A port that gives a body but no method does not send a POST: the request lines differ, and copying the missing headers does not make them match, so the agent still reports the request line."
    program: program.cs
    args: [no-method]
    expect:
      exit: 0
      stdout: "port, first try: request line; only the old client sent Authorization; only the old client sent Accept-Encoding; only the old client sent Referer\nport, second try: request line\n"
