# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: s3-refuse-a-request-from-a-skewed-clock
title: Refusing a Request from a Skewed Clock
protocols: [s3]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlServerFiles, SurlFolderPage, SurlEventQuery, SurlEventKind, CurlClient, CurlRequest, CurlResponse, CurlException, CurlAuthenticationOptions, CurlNetworkOptions, CurlTlsOptions, CurlTlsPeerOptions]
exit-codes: [0]
references: [surl-readme, aws-s3-api]

fixtures: {}

# A certificate for 127.0.0.1 and for any bucket's host name in us-east-1, good for 30 days,
# signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With the server's clock twenty minutes ahead a correctly signed put throws HttpReturnedError, 403 RequestTimeTooSkewed, and stores nothing; with the clock put back the same put is answered 200 and the bucket then holds the new object beside the old one.
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^server 20 min ahead: HttpReturnedError S3 returned error 403: RequestTimeTooSkewed: [^\n]*\nstore: 2026-q2\.csv\nclock put back: 200\nstore: 2026-q2\.csv, 2026-q3\.csv\n$'

  - id: window
    claim: The server accepts a signed request whose time is 14 minutes from its own, ahead or behind, and refuses one 16 minutes away in either direction with RequestTimeTooSkewed, so the limit sits between them.
    program: program.cs
    args: [window]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^server \+14 min: 200\nserver \+16 min: HttpReturnedError S3 returned error 403: RequestTimeTooSkewed: [^\n]*\nserver -14 min: 200\nserver -16 min: HttpReturnedError S3 returned error 403: RequestTimeTooSkewed: [^\n]*\n$'

  - id: record
    claim: The refused request is recorded as one exchange, and the server's record holds one judged login for the access key, refused, so a test finds a clock refusal among the login events.
    program: program.cs
    args: [record]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '\nexchanges recorded: 1\nlogin judged: AKIAIOSFODNN7EXAMPLE refused\n$'


  - id: inside-the-limit
    claim: "With the server's clock 10 minutes ahead the same signed put is accepted, 200, and the bucket holds the new object."
    program: program.cs
    args: [inside]
    timeout: 120
    expect:
      exit: 0
      stdout: "server +10 min: 200\nstore: 2026-q2.csv, x.csv\n"

  - id: behind
    claim: "A clock 20 minutes behind is refused the same way as one 20 minutes ahead: RequestTimeTooSkewed, and nothing is stored."
    program: program.cs
    args: [behind]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^server -20 min: HttpReturnedError S3 returned error 403: RequestTimeTooSkewed: [^\n]*\nstore: 2026-q2\.csv\n$'

  - id: refusal-text
    claim: "The refusal reads, whole, HttpReturnedError S3 returned error 403: RequestTimeTooSkewed: The difference between the request time and the server's time is too large."
    program: program.cs
    args: [message]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^server \+20 min: HttpReturnedError S3 returned error 403: RequestTimeTooSkewed: The difference between the request time and the server''s time is too large\.\n'
