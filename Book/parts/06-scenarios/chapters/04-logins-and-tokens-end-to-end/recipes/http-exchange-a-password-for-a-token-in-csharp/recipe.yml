# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-exchange-a-password-for-a-token-in-csharp
title: Exchanging a Password for a Token
protocols: [https]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlEventQuery, SurlEventKind, LoginJudgedEvent, CurlClient, CurlRequest, CurlResponse, CurlTlsOptions, CurlTlsPeerOptions, CurlAuthenticationOptions, HttpAuthenticationMethods]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc7617, rfc6750, rfc8446]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The client logs in with Basic over HTTPS, takes the token from the body, and calls the API with it as a Bearer token, 200 both times; the server recorded a Basic login as app and then a Bearer login, named bearer token.
    program: token-flow.cs
    args: []
    expect:
      exit: 0
      stdout: "login: 200\napi: 200 [{\"id\":1,\"total\":40}]\nrecorded: Basic app accepted\nrecorded: Bearer bearer token accepted\n"

  - id: wrong-password
    claim: With a wrong password the login is answered 401, the program never calls the API, and the server recorded one refused Basic login as app.
    program: token-flow.cs
    args: [guess]
    expect:
      exit: 1
      stdout: "login: 401\nrecorded: Basic app refused\n"

  - id: wrong-token
    claim: A token the server does not hold is answered 401 by the API after a good login, and the server recorded the Bearer login as refused.
    program: token-flow.cs
    args: [s3cret, tok-0000]
    expect:
      exit: 1
      stdout: "login: 200\napi: 401\nrecorded: Basic app accepted\nrecorded: Bearer bearer token refused\n"
