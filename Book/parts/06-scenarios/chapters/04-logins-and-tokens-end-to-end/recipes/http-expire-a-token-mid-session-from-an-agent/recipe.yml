# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs token-session.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-expire-a-token-mid-session-from-an-agent
title: Expiring a Token Mid-Session from an Agent
protocols: [https, oci]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, reset_server, add_fault, wait_for_event, get_events, add_account]
curl-options: [-s, -f, --cacert, -u, --oauth2-bearer, -o, -w, -D]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, oci-distribution, rfc6750, rfc7617, rfc8446]

fixtures: {}

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: The client logs in and calls the API through curl-mcp (200); the agent revokes every token with reset_server; the next call with the kept token is answered 401, the client logs in again, gets a new token and retries once, 200.
    program: token-session.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\Alogin: token issued\ncall: 200\nreset: every token revoked\ncall: 401\nlogin: new token\nretry: 200\n'

  - id: server-recorded-two-logins
    claim: Waiting with wait_for_event for each login in turn, the server judged two for the session, both app's password at the token endpoint, both accepted; the calls with a token are not logins.
    program: token-session.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nretry: 200\nrecorded: app password accepted\nrecorded: app password accepted\n\Z'

  - id: token-endpoint-answer
    claim: The token endpoint answers a Basic login with JSON whose expires_in is 300.
    program: token-session.cs
    args: [endpoint]
    expect:
      exit: 0
      stdout-matches: '\Atoken endpoint: expires_in 300\n'

  - id: token-kept-without-revocation
    claim: Without a revocation the second call reuses the kept token, 200, and the client does not log in again.
    program: token-session.cs
    args: [steady]
    expect:
      exit: 0
      stdout: "login: token issued\ncall: 200\ncall: 200\nrecorded: app password accepted\n"

  - id: no-token-challenge
    claim: A call with no token is answered 401 Unauthorized with a Bearer challenge naming the token endpoint as its realm.
    program: token-session.cs
    args: [endpoint]
    expect:
      exit: 0
      stdout-matches: '\nno token: HTTP/1\.1 401 Unauthorized, WWW-Authenticate: Bearer realm="https://127\.0\.0\.1:\d+/token",service="surl"\n'

  - id: retries-once-only
    claim: When a fault added with add_fault answers the call 401 even after the new login, the client stops after its one retry and the program exits 1.
    program: token-session.cs
    args: [broken]
    expect:
      exit: 1
      stdout: "login: token issued\ncall: 401\nlogin: new token\nretry: 401\nrecorded: app password accepted\nrecorded: app password accepted\n"

  - id: login-refused
    claim: With a stale token and a wrong password the call is answered 401, the login again fails with curl exit 22, and the client stops without a retry; the server recorded the login as refused.
    program: token-session.cs
    args: [guess]
    expect:
      exit: 1
      stdout: "call: 401\nlogin: curl exit 22\nrecorded: app password refused\n"

  - id: fixed-bearer-account-not-a-registry-token
    claim: add_account adds an account with an empty user name, a fixed Bearer token; the registry still refuses that token, 401, since it takes only the tokens it issues.
    program: token-session.cs
    args: [endpoint]
    expect:
      exit: 0
      stdout-matches: '\nadd_account with an empty user: added\nthe fixed token at the registry: 401\n\Z'
