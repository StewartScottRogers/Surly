# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: http-stop-a-client-hammering-a-refused-login
title: Stopping a Client Retrying a Bad Login
protocols: [http]
tier: scenarios
surl-options: [-v, --log-file, --directory, --user, --fault]
curl-options: [-s, -S, -f, --retry, --retry-delay, --retry-all-errors, --digest, -u, -o, -w]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc7616, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  site2/hello.txt: "hello from surl\n"

# main and hammer are the same server, each with its own folder and log: two accounts, and a rule
# that refuses every login of app, whatever its password. main is the client that stops; hammer
# is the client that retries every error.
servers:
  main:
    command: surl -v --log-file surl.log --directory site --user app:s3cret --user other:o-secret --fault "refuse-login;account=app" http://127.0.0.1:{{port}}/
    ready: port
  hammer:
    command: surl -v --log-file hammer.log --directory site2 --user app:s3cret --user other:o-secret --fault "refuse-login;account=app" http://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With the rule on app, curl -f --retry 3 logs in with app's right password, is answered 401, makes no retry and exits 22.
    run: curl -sS -f --retry 3 --retry-delay 1 --digest -u app:s3cret -o {{null}} -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: "401 0\n"
      stderr-contains: "curl: (22) The requested URL returned error: 401"

  - id: server-saw-one-login
    claim: The server's verbose log holds exactly one refused login for app, so the client tried its password once.
    run: 'grep -c "Login refused: Digest app" surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: others-unaffected
    claim: The rule refuses only app; the account other logs in and gets the file.
    run: curl -s --digest -u other:o-secret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: no-fail-no-error
    claim: Without -f the 401 is a finished transfer, not an error, so curl makes no retry either and exits 0.
    run: curl -s --retry 3 --retry-delay 1 --digest -u app:s3cret -o {{null}} -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401 0\n"

  - id: retry-all-errors-hammers
    claim: With --retry-all-errors added, curl treats the 401 as worth retrying and sends the same password three more times, each refused, then exits 22.
    run: curl -sS -f --retry 3 --retry-delay 1 --retry-all-errors --digest -u app:s3cret -o {{null}} -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port2}}/hello.txt
    timeout: 30
    expect:
      exit: 22
      stdout: "401 3\n"
      stderr-contains: "curl: (22) The requested URL returned error: 401"

  - id: server-saw-four-logins
    claim: That server's log holds four refused logins for app, one per try.
    run: 'grep -c "Login refused: Digest app" hammer.log'
    expect:
      exit: 0
      stdout: "4\n"
