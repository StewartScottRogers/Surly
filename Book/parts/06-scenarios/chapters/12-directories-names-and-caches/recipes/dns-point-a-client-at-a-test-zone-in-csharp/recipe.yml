# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: dns-point-a-client-at-a-test-zone-in-csharp
title: Pointing a Client at a Test Zone
protocols: [dns, http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerZones, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlNetworkOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlException]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc1035]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With DohUrl naming the in-process server's DNS over HTTPS resource and its certificate trusted, the client's call by name resolves api.example.test from the seeded zone and is answered 200 with the status file.
    program: point-at-zone.cs
    args: []
    expect:
      exit: 0
      stdout: "200 orders api: up\n"

  - id: not-in-zone
    claim: A name the zone does not hold does not resolve; SendAsync throws CurlException with curl error 6 and no call is made.
    program: point-at-zone.cs
    args: [not-in-zone]
    expect:
      exit: 1
      stdout: "old-api.example.test: curl error 6 (CouldntResolveHost)\n"

  - id: no-doh
    claim: Without DohUrl the client asks the machine's resolver, which has no test zone, and the call fails with curl error 6.
    program: point-at-zone.cs
    args: [no-doh]
    expect:
      exit: 1
      stdout: "api.example.test: curl error 6 (CouldntResolveHost)\n"

  - id: untrusted
    claim: Without the server's certificate as an authority the lookup cannot be made, and the failure is the lookup's, curl error 6, not 60.
    program: point-at-zone.cs
    args: [untrusted]
    expect:
      exit: 1
      stdout: "api.example.test: curl error 6 (CouldntResolveHost)\n"
