# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: dns-change-answers-between-tests
title: Changing DNS Answers Between Tests
protocols: [dns]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerZones, SurlSeedRefusedException, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc1035]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: On one server, the first test's zone answers api.example.test with 192.0.2.10; after ResetAsync and a new zone the second test gets 192.0.2.20; after a ResetAsync alone the third test's lookup is REFUSED, because no zone holds the name.
    program: change-answers.cs
    args: []
    expect:
      exit: 0
      stdout: "test 1: NOERROR 192.0.2.10\ntest 2: NOERROR 192.0.2.20\ntest 3: REFUSED\n"

  - id: no-reset
    claim: A second AddZoneAsync for an apex the server already holds does not replace the zone; it throws SurlSeedRefusedException, store Zones, and the name still answers the first test's address.
    program: change-answers.cs
    args: [no-reset]
    expect:
      exit: 1
      stdout: "test 1: NOERROR 192.0.2.10\ntest 2 seed refused: Zones a second zone for example.test\ntest 2: NOERROR 192.0.2.10\n"

  - id: reset-drops-zones
    claim: ListAsync names the seeded apex with its final dot, and after ResetAsync the server holds no zones.
    program: change-answers.cs
    args: [list]
    expect:
      exit: 0
      stdout: "zones: example.test.\nafter ResetAsync: 0 zones\n"
