# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs point-at-zone.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: dns-point-a-client-at-a-test-zone-from-an-agent
title: Pointing a Client at a Test Zone
protocols: [dns, http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, add_dns_zone, read_zone, curl]
curl-options: [-s, -S, --max-time, --doh-url, --cacert]
exit-codes: [0, 1]
references: [surl-readme, curl-manual, rfc1035]

fixtures: {}

# The certificate the DNS over HTTPS listener serves, in the folder both hosts are confined to.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: Once add_dns_zone has seeded the test zone, curl-mcp's curl tool with --doh-url naming the test server and --cacert trusting its certificate resolves api.example.test from the zone and the call answers the status file, exit 0.
    program: point-at-zone.cs
    args: []
    expect:
      exit: 0
      stdout: "curl exit 0, tool error False\norders api: up\n"

  - id: before-seed
    claim: Before the zone is seeded the server holds no zone and the same call cannot resolve the name; curl exits 6, which the curl tool reports as a tool error.
    program: point-at-zone.cs
    args: [before-seed]
    expect:
      exit: 1
      stdout: "curl exit 6, tool error True\ncurl: (6) Could not resolve host: api.example.test\n"

  - id: not-in-zone
    claim: A name the seeded zone does not hold, old-api.example.test, does not resolve either; curl exits 6.
    program: point-at-zone.cs
    args: [not-in-zone]
    expect:
      exit: 1
      stdout: "curl exit 6, tool error True\ncurl: (6) Could not resolve host: old-api.example.test\n"

  - id: untrusted
    claim: Without --cacert the lookup cannot verify the test server, and the failure is reported as the lookup's, exit 6, not 60.
    program: point-at-zone.cs
    args: [untrusted]
    expect:
      exit: 1
      stdout: "curl exit 6, tool error True\ncurl: (6) Could not resolve host: api.example.test\n"

  - id: read-back
    claim: read_zone answers the seeded zone as master-file text, a record a line, with absolute names and the TTL and class on every line.
    program: point-at-zone.cs
    args: [read-back]
    expect:
      exit: 0
      stdout: "example.test. 300 IN SOA ns1.example.test. hostmaster.example.test. 1 3600 600 86400 300\nexample.test. 300 IN NS ns1.example.test.\napi.example.test. 300 IN A 127.0.0.1\n"
