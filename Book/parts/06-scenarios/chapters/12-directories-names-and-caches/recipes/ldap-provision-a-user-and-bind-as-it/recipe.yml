# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: ldap-provision-a-user-and-bind-as-it
title: Provisioning a User and Binding as It
protocols: [ldap]
tier: scenarios
surl-options: [--directory, --allow-plaintext-auth, --user, --control, --control-token-file]
curl-options: [-s, -S, -o, -w, -H, --data-binary, --json, --next, -u]
exit-codes: [0, 38, 67]
references: [surl-readme, curl-readme, rfc4511, rfc4516]

fixtures:
  site/.surl/ldap/directory.ldif: |
    dn: dc=example,dc=com
    objectClass: domain
    dc: example

    dn: ou=people,dc=example,dc=com
    objectClass: organizationalUnit
    ou: people

    dn: uid=alice,ou=people,dc=example,dc=com
    objectClass: inetOrgPerson
    uid: alice
    cn: Alice Liddell
    sn: Liddell
    mail: alice@example.com
  partial/.surl/ldap/directory.ldif: |
    dn: dc=example,dc=com
    objectClass: domain
    dc: example

    dn: ou=people,dc=example,dc=com
    objectClass: organizationalUnit
    ou: people
  bob.ldif: |
    dn: uid=bob,ou=people,dc=example,dc=com
    objectClass: inetOrgPerson
    uid: bob
    cn: Bob Jones
    sn: Jones
    mail: bob@example.com
    userPassword: b0b-pass
  bob.json: "{\"user\":\"bob\",\"password\":\"b0b-pass\"}"
  control-token.txt: "control-token-0123456789abcdefghij\n"

# main is the recipe: the directory the provisioning job writes to, with a control endpoint that
# stands in for the job, and tester, the account the test searches as. partial is the same tree on
# its own folder, where the job adds the entry but not the account. strict is the default, which
# refuses a password sent in clear.
servers:
  main:
    command: surl --directory site --allow-plaintext-auth --user tester:t3st-pass --control http://127.0.0.1:{{port2}} --control-token-file control-token.txt ldap://127.0.0.1:{{port}}/
    ready: port
  partial:
    command: surl --directory partial --allow-plaintext-auth --user tester:t3st-pass --control http://127.0.0.1:{{port4}} --control-token-file control-token.txt ldap://127.0.0.1:{{port3}}/
    ready: port
  strict:
    command: surl --user tester:t3st-pass ldap://127.0.0.1:{{port5}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The job adds bob's entry and his account (204 each); then a search as tester for (uid=bob) finds the entry, and a bind as bob's DN with his password reads it, on every platform's layout.
    run: 'curl -s -o {{null}} -w "%{response_code}\n" -H "Authorization: Bearer control-token-0123456789abcdefghij" -H "Content-Type: text/plain" --data-binary @bob.ldif http://127.0.0.1:{{port2}}/v1/directory --next -s -o {{null}} -w "%{response_code}\n" -H "Authorization: Bearer control-token-0123456789abcdefghij" --json @bob.json http://127.0.0.1:{{port2}}/v1/accounts --next -s -u tester:t3st-pass "ldap://127.0.0.1:{{port}}/ou=people,dc=example,dc=com?cn,mail?sub?(uid=bob)" --next -s -u "uid=bob,ou=people,dc=example,dc=com:b0b-pass" "ldap://127.0.0.1:{{port}}/uid=bob,ou=people,dc=example,dc=com?uid?base"'
    expect:
      exit: 0
      stdout-matches: '\A204\n204\nDN: uid=bob,ou=people,dc=example,dc=com\n\tcn: Bob Jones\n\n\tmail: bob@example.com\n\n\n?DN: uid=bob,ou=people,dc=example,dc=com\n\tuid: bob\n\n\n?\Z'

  - id: server-recorded-the-bind
    claim: Waiting on the control endpoint for the first judged login of bob answers at once with it, an accepted password login over ldap; the first change it recorded is the directory seeded with bob's entry.
    run: 'curl -s -H "Authorization: Bearer control-token-0123456789abcdefghij" "http://127.0.0.1:{{port2}}/v1/events/wait?kind=login_judged&account=bob&timeout_ms=10000" --next -s -H "Authorization: Bearer control-token-0123456789abcdefghij" "http://127.0.0.1:{{port2}}/v1/events/wait?kind=store_changed&timeout_ms=10000"'
    expect:
      exit: 0
      stdout-matches: '\A\{"event":\{"sequence":\d+,"at":"[^"]+","kind":"login_judged","exchange_id":\d+,"scheme":"ldap","account":"bob","mechanism":"password","is_accepted":true,"is_refused_by_fault":false\}\}\{"event":\{"sequence":\d+,"at":"[^"]+","kind":"store_changed","byte_count":\d+,"store":"directory","change":"seeded","name":"uid=bob,ou=people,dc=example,dc=com"\}\}\Z'

  - id: read-back-without-password
    claim: The directory read back as LDIF holds bob's entry beside alice's, with his userPassword left out.
    run: 'curl -s -H "Authorization: Bearer control-token-0123456789abcdefghij" http://127.0.0.1:{{port2}}/v1/directory'
    expect:
      exit: 0
      stdout-matches: '(?s)\A(?!.*userPassword)(?!.*b0b-pass).*dn: uid=alice,ou=people,dc=example,dc=com\n.*dn: uid=bob,ou=people,dc=example,dc=com\nobjectClass: inetOrgPerson\nuid: bob\ncn: Bob Jones\nsn: Jones\nmail: bob@example.com\n'

  - id: wrong-password
    claim: On Windows a bind as bob with a wrong password is refused, exit 38, and WinLDAP names the server's answer, Invalid Credentials.
    platforms: [windows]
    run: curl -s -S -u "uid=bob,ou=people,dc=example,dc=com:guess" "ldap://127.0.0.1:{{port}}/uid=bob,ou=people,dc=example,dc=com?uid?base"
    expect:
      exit: 38
      stdout: ""
      stderr-contains: "Invalid Credentials"

  - id: wrong-password-on-openldap
    claim: On Linux and macOS the same refusal is exit 67, Login denied.
    platforms: [linux, macos]
    run: curl -s -S -u "uid=bob,ou=people,dc=example,dc=com:guess" "ldap://127.0.0.1:{{port}}/uid=bob,ou=people,dc=example,dc=com?uid?base"
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: before-the-job
    claim: Before the job runs, the same search as tester finds nothing, exit 0 with no output.
    run: curl -s -u tester:t3st-pass "ldap://127.0.0.1:{{port3}}/ou=people,dc=example,dc=com?cn,mail?sub?(uid=bob)"
    expect:
      exit: 0
      stdout: ""

  - id: entry-without-account
    claim: When the job adds only the entry, its userPassword included, the search finds bob.
    run: 'curl -s -o {{null}} -w "%{response_code}\n" -H "Authorization: Bearer control-token-0123456789abcdefghij" -H "Content-Type: text/plain" --data-binary @bob.ldif http://127.0.0.1:{{port4}}/v1/directory --next -s -u tester:t3st-pass "ldap://127.0.0.1:{{port3}}/ou=people,dc=example,dc=com?cn?sub?(uid=bob)"'
    expect:
      exit: 0
      stdout-matches: '\A204\nDN: uid=bob,ou=people,dc=example,dc=com\n\tcn: Bob Jones\n\n\n?\Z'

  - id: entry-without-account-cannot-bind
    claim: On Windows, with the entry but no account, a bind as bob with his password is refused, exit 38, Invalid Credentials, because surl checks binds against its accounts.
    platforms: [windows]
    run: curl -s -S -u "uid=bob,ou=people,dc=example,dc=com:b0b-pass" "ldap://127.0.0.1:{{port3}}/uid=bob,ou=people,dc=example,dc=com?uid?base"
    expect:
      exit: 38
      stdout: ""
      stderr-contains: "Invalid Credentials"

  - id: entry-without-account-cannot-bind-on-openldap
    claim: On Linux and macOS the same refused bind is exit 67, Login denied.
    platforms: [linux, macos]
    run: curl -s -S -u "uid=bob,ou=people,dc=example,dc=com:b0b-pass" "ldap://127.0.0.1:{{port3}}/uid=bob,ou=people,dc=example,dc=com?uid?base"
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: clear-password-refused
    claim: Without --allow-plaintext-auth a simple bind over ldap:// is refused unchecked, the right password included, exit 38 on every platform.
    run: curl -s -S -u tester:t3st-pass "ldap://127.0.0.1:{{port5}}/"
    expect:
      exit: 38
      stdout: ""
      stderr-contains: "curl: (38)"
