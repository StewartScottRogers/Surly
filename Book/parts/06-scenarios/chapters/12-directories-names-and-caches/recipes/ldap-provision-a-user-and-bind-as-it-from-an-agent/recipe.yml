# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs provision-and-bind.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: ldap-provision-a-user-and-bind-as-it-from-an-agent
title: Provisioning a User and Binding as It
protocols: [ldap]
tier: scenarios
surface: mcp
mcp-tools: [start_server, add_ldap_entries, add_account, curl, wait_for_event, read_directory]
curl-options: [-s, -S, -u]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc4511, rfc4516]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: After the job adds bob's entry and his account, a search as tester for (uid=bob) finds the entry, and a bind as bob's DN with his password reads it.
    program: provision-and-bind.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsearch as tester: 1 \[uid=bob,ou=people,dc=example,dc=com, cn: Bob Jones, mail: bob@example\.com\]\nbind as bob: 1 \[uid=bob,ou=people,dc=example,dc=com, uid: bob\]\n'

  - id: server-recorded-the-bind
    claim: wait_for_event answers bob's first judged login, an accepted password login over ldap, and the directory change that seeded his entry.
    program: provision-and-bind.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nrecorded: ldap password bob accepted\nrecorded: directory seeded uid=bob,ou=people,dc=example,dc=com\n'

  - id: read-back-without-password
    claim: read_directory reads the directory back as LDIF with bob's entry in it and his userPassword left out.
    program: provision-and-bind.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nexport: bob present, userPassword absent, b0b-pass absent\n$'

  - id: wrong-password
    claim: On Windows a bind as bob with a wrong password fails with curl exit 38, and the record holds his login as refused.
    platforms: [windows]
    program: provision-and-bind.cs
    args: [guess]
    expect:
      exit: 0
      stdout-matches: '\nbind as bob: refused, curl exit 38\nrecorded: ldap password bob refused\n'

  - id: wrong-password-on-openldap
    claim: On Linux and macOS the same refusal fails with curl exit 67.
    platforms: [linux, macos]
    program: provision-and-bind.cs
    args: [guess]
    expect:
      exit: 0
      stdout-matches: '\nbind as bob: refused, curl exit 67\nrecorded: ldap password bob refused\n'

  - id: before-the-job
    claim: Before the job runs, the same search as tester finds nothing.
    program: provision-and-bind.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\Abefore the job: 0 \[\]\n'

  - id: entry-without-account
    claim: When the job adds only the entry, its userPassword included, the search finds bob.
    program: provision-and-bind.cs
    args: [entry-only]
    expect:
      exit: 0
      stdout-matches: '\nsearch as tester: 1 \[uid=bob,ou=people,dc=example,dc=com, cn: Bob Jones, mail: bob@example\.com\]\n'

  - id: entry-without-account-cannot-bind
    claim: On Windows, with the entry but no account, a bind as bob with his password fails with curl exit 38, because the server checks binds against its accounts.
    platforms: [windows]
    program: provision-and-bind.cs
    args: [entry-only]
    expect:
      exit: 0
      stdout-matches: '\nbind as bob: refused, curl exit 38\n'

  - id: entry-without-account-cannot-bind-on-openldap
    claim: On Linux and macOS the same refused bind fails with curl exit 67.
    platforms: [linux, macos]
    program: provision-and-bind.cs
    args: [entry-only]
    expect:
      exit: 0
      stdout-matches: '\nbind as bob: refused, curl exit 67\n'

  - id: clear-password-refused
    claim: Without --allow-plaintext-auth in start_server{apos}s arguments a simple bind over ldap:// is refused unchecked, the right password included, curl exit 38 on every platform.
    program: provision-and-bind.cs
    args: [strict]
    expect:
      exit: 0
      stdout: "bind as tester: refused, curl exit 38\n"
