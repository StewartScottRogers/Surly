# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-report-progress-of-a-large-upload
title: Reporting Progress of a Large Upload
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFileContents, CurlClient, CurlRequest, CurlContent, CurlResponse, CurlTransferProgress]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, libcurl-api, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A 16 MiB PUT with a Progress recorder is answered 201 Created; the reports, ten or more, never go back, end at 16777216 of 16777216 bytes uploaded, and the server stored 16777216 bytes with the same SHA-256.
    program: progress.cs
    args: [upload]
    expect:
      exit: 0
      stdout: "PUT: 201 Created\nreports: 10 or more, never going back: yes\nlast report: 16777216 of 16777216 bytes\nphases seen: Connecting, Uploading\nserver stored: 16777216 bytes, same SHA-256: yes\n"

  - id: refused
    claim: To a server without AllowUploads the PUT is answered 405 Method Not Allowed before the body is sent, and the last report still says 0 of 0 bytes uploaded; the phases go from Connecting to Downloading, for the refusal's short body, never Uploading, so the reports alone never show an upload that did not happen as done.
    program: progress.cs
    args: [refused]
    expect:
      exit: 1
      stdout-matches: '^PUT: 405 Method Not Allowed\nreports: \d+, never going back: yes\nlast report: 0 of 0 bytes\nphases seen: Connecting, Downloading\n$'
