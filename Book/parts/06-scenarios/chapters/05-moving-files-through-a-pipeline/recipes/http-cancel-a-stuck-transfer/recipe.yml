# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-cancel-a-stuck-transfer
title: Cancelling a Stuck Transfer
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, SurlExchangeRecord, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, libcurl-api, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A request the server holds for a minute is ended by a CancellationToken cancelled after one second, SendAsync throws OperationCanceledException within 1 to 5 s, and the next request on the same client gets 200 at once, on a new connection or on one kept from before, never on the one given up.
    program: cancel.cs
    args: [cancel]
    expect:
      exit: 0
      stdout-matches: '^stuck\.txt: OperationCanceledException\ngiven up after: 1 to 5 s\nnext: 200 OK hello from surl\nnext on a new connection: (?:yes|no)\nnext on the given-up connection: no\nnext took under 5 s: yes\n$'

  - id: timeout
    claim: The client's own Timeout of one second ends the same request with a CurlException OperationTimedOut instead, and the client goes on working the same way.
    program: cancel.cs
    args: [timeout]
    expect:
      exit: 0
      stdout-matches: '^stuck\.txt: CurlException OperationTimedOut\ngiven up after: 1 to 5 s\nnext: 200 OK hello from surl\nnext on a new connection: (?:yes|no)\nnext on the given-up connection: no\nnext took under 5 s: yes\n$'

  - id: server-still-holds-it
    claim: "Against a server that takes one connection per address, the next request races the server's notice of the cancel: surl ends a held request once it sees its client gone, so the next request is answered 200 if surl has noticed by then and 503 Service Unavailable if it has not; either way it goes on a new connection and well under 5 s."
    program: cancel.cs
    args: [one-slot]
    expect:
      exit: 0
      stdout-matches: '^stuck\.txt: OperationCanceledException\ngiven up after: 1 to 5 s\nnext: (?:503 Service Unavailable|200 OK hello from surl)\nnext on a new connection: yes\nnext on the given-up connection: no\nnext took under 5 s: yes\n$'
