# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-stream-a-download-and-hash-it
title: Streaming a Download and Hashing It
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, SurlFileContents, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A 16 MiB download read block by block from CurlResponse.Body into a file and an IncrementalHash gets all 16777216 bytes, its SHA-256 equals that of the server's copy, the heap grows by less than 4 MiB, and the file is kept.
    program: stream-and-hash.cs
    args: [whole]
    expect:
      exit: 0
      stdout: "status: 200\nreceived: 16777216 bytes\nsame SHA-256 as the server's copy: yes\nheap grew by less than 4 MiB: yes\nkept as big.bin\n"
      files:
        big.bin: null

  - id: dropped
    claim: When the server drops the connection after 1,000,000 bytes, the body's ReadAsync throws a CurlException after the 200, the hash does not match, and the partial file is removed.
    program: stream-and-hash.cs
    args: [dropped]
    expect:
      exit: 1
      stdout: "status: 200\nfailed: CurlException after fewer than 16777216 bytes: yes\nsame SHA-256 as the server's copy: no\nheap grew by less than 4 MiB: yes\nremoved big.bin.part\n"
