# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-skip-unchanged-files-with-etags-in-csharp
title: Skipping Unchanged Files with ETags in C#
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, TimeProvider]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The first run fetches both files, the second sends each saved ETag as If-None-Match and gets 304 for both, and after a.txt is rewritten with the server's clock five seconds on, the third run fetches a.txt alone; the server answered six GET requests, three with 200 and three with 304.
    program: sync.cs
    args: [changed]
    expect:
      exit: 0
      stdout: "run 1: a.txt fetched, b.txt fetched\nrun 2: a.txt unchanged, b.txt unchanged\na.txt rewritten 5 s later\nrun 3: a.txt fetched, b.txt unchanged\nlocal a.txt: alpha, revised\nlocal b.txt: beta\nserver answered: 6 GET, 3 with 200, 3 with 304\n"

  - id: same-second
    claim: A rewrite within the same second keeps the same Last-Modified, but the ETag changes with the length, so the third run fetches a.txt.
    program: sync.cs
    args: [same-second]
    expect:
      exit: 0
      stdout-matches: 'a.txt rewritten in the same second\n  a.txt: 200, ETag "([0-9a-f]+)-f", Last-Modified Tue, 02 Jan 2024 15:04:05 GMT, saved "\1-6"\n  b.txt: 304, [^\n]+\nrun 3: a.txt fetched, b.txt unchanged\nlocal a.txt: alpha, revised\n'

  - id: deleted
    claim: A file deleted on the server answers 404 Not Found, and the job keeps its local copy rather than overwrite it.
    program: sync.cs
    args: [deleted]
    expect:
      exit: 0
      stdout: "run 1: a.txt fetched, b.txt fetched\nrun 2: a.txt unchanged, b.txt unchanged\nb.txt deleted\nrun 3: a.txt unchanged, b.txt gone, local copy kept\nlocal a.txt: alpha\nlocal b.txt: beta\nserver answered: 6 GET, 2 with 200, 3 with 304\n"

  - id: written-to-disk
    claim: Each fetched copy is written to disk, so after the changed case local-changed/a.txt holds the revised text and local-changed/b.txt the first one.
    program: sync.cs
    args: [changed]
    expect:
      exit: 0
      files:
        local-changed/a.txt: "alpha, revised\n"
        local-changed/b.txt: "beta\n"

  - id: older-date-fetched
    claim: A file rewritten with an earlier date, as a restore from a backup can do, gets a new ETag and is fetched again. With the clock moved back, b.txt's Last-Modified moves back to 15:04:00 too, since surl sends none later than its Date, but its ETag stays, so b.txt is still answered 304.
    program: sync.cs
    args: [older]
    expect:
      exit: 0
      stdout-matches: 'a.txt rewritten 5 s earlier\n  a.txt: 200, ETag "[0-9a-f]+-10", Last-Modified Tue, 02 Jan 2024 15:04:00 GMT, saved "[0-9a-f]+-6"\n  b.txt: 304, ETag ("[0-9a-f]+-5"), Last-Modified Tue, 02 Jan 2024 15:04:00 GMT, saved \1\nrun 3: a.txt fetched, b.txt unchanged\nlocal a.txt: alpha, restored\nlocal b.txt: beta\n'

  - id: tags-compared
    claim: The 304 carries the same ETag the job saved, and the ETag ends in the file's length in hexadecimal (6 for alpha and a newline); after the rewrite a.txt's ETag and its Last-Modified, 15:04:10, are new.
    program: sync.cs
    args: [tags]
    expect:
      exit: 0
      stdout-matches: '^  a.txt: 200, ETag ("[0-9a-f]+-6"), Last-Modified Tue, 02 Jan 2024 15:04:05 GMT, saved none\n  b.txt: 200, ETag ("[0-9a-f]+-5"), [^\n]+\nrun 1: a.txt fetched, b.txt fetched\n  a.txt: 304, ETag \1, Last-Modified Tue, 02 Jan 2024 15:04:05 GMT, saved \1\n  b.txt: 304, ETag \2, [^\n]+ saved \2\nrun 2: a.txt unchanged, b.txt unchanged\na.txt rewritten 5 s later\n  a.txt: 200, ETag "[0-9a-f]+-f", Last-Modified Tue, 02 Jan 2024 15:04:10 GMT, saved \1\n'
