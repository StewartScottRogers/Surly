schema: 2
key: sftp-upload-a-batch-and-verify-it-in-csharp
title: Uploading a Batch and Verifying It in C#
protocols: [sftp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, CurlClient, CurlRequest, CurlResponse, CurlSshOptions, CurlFtpOptions, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

setup:
  - ssh-keygen -q -t rsa -b 3072 -N "" -f host_key

cases:
  - id: solution
    role: solution
    claim: "Four files are uploaded to /inbox/ with Curl.Api against a pinned host key, then the server's listing is read back and every name and size matches the local files."
    program: batch.cs
    args: ["all"]
    expect:
      exit: 0
      stdout: "all 4 files match: blob.bin 1500, config.ini 18, data.csv 16, notes.txt 14\n"

  - id: wrong-pin
    claim: "A host key that is not the pinned one is refused before any login: CurlException, Code PeerFailedVerification, 60."
    program: batch.cs
    args: ["wrong-pin"]
    expect:
      exit: 0
      stdout: "upload: PeerFailedVerification (60)\n"

  - id: missing-file-found
    claim: "When one file is not uploaded, the comparison names it."
    program: batch.cs
    args: ["missing"]
    expect:
      exit: 0
      stdout: "missing: blob.bin (1500)\n"

  - id: wrong-size-found
    claim: "When a file arrives short, 1,000 bytes for 1,500, the comparison shows both sizes."
    program: batch.cs
    args: ["short"]
    expect:
      exit: 0
      stdout: "size: blob.bin local 1500, remote 1000\n"

  - id: repaired
    claim: "Uploading the whole batch again replaces the short file, and the comparison passes."
    program: batch.cs
    args: ["repaired"]
    expect:
      exit: 0
      stdout: "all 4 files match: blob.bin 1500, config.ini 18, data.csv 16, notes.txt 14\n"

  - id: uploads-off
    claim: "A server started without AllowUploads refuses the upload: RemoteAccessDenied, 9."
    program: batch.cs
    args: ["uploads-off"]
    expect:
      exit: 0
      stdout: "upload: RemoteAccessDenied (9)\n"

  - id: no-listing
    claim: "A server that takes uploads but has ListDirectories off cannot be checked: the listing is refused, RemoteFileNotFound, 78."
    program: batch.cs
    args: ["no-listing"]
    expect:
      exit: 0
      stdout: "upload: ok\nlisting refused: RemoteFileNotFound (78)\n"

