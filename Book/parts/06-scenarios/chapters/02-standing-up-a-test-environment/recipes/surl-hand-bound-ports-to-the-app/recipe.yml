# Executable specification. key MUST equal the folder name and never changes once published.
# Every listener asks for port 0, so the recipe has no servers: block and no {{port}}: the
# scripts below start surl themselves, read the ports from its Listening on lines and stop it.
schema: 1
key: surl-hand-bound-ports-to-the-app
title: Handing Bound Ports to the App
protocols: [http, smtp]
tier: scenarios
surl-options: [-v, --directory, --mail-domain, --mailbox]
curl-options: [-f, -s, -S, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0, 124]
references: [surl-readme, curl-readme]

fixtures:
  site/greeting.txt: "Welcome aboard.\n"
  site2/greeting.txt: "Welcome aboard.\n"
  run-tests.sh: |
    #!/bin/sh
    # Starts surl on free ports, hands the bound URLs to the app, and checks what surl recorded.
    # SITE names the directory to serve; it defaults to site.
    out=$(mktemp)
    log=$(mktemp)
    surl -v --directory "${SITE:-site}" --mail-domain example.com --mailbox app@example.com:secret \
      http://127.0.0.1:0/ smtp://127.0.0.1:0/ > "$out" 2> "$log" &
    surl_pid=$!
    trap 'kill $surl_pid 2>/dev/null; rm -f "$out" "$log"' EXIT

    # surl writes one Listening on line per listen URL once every listener has bound.
    # If surl exits first, it refused to start: show why and stop with its exit code.
    until [ "$(grep -c '^Listening on ' "$out")" -eq 2 ]; do
      kill -0 $surl_pid 2>/dev/null || { wait $surl_pid; code=$?; cat "$log" >&2; exit $code; }
      sleep 0.1
    done

    APP_HTTP_URL=$(sed -n 's|^Listening on \(http://.*\)$|\1|p' "$out")
    APP_SMTP_URL=$(sed -n 's|^Listening on \(smtp://.*\)$|\1|p' "$out")
    export APP_HTTP_URL APP_SMTP_URL
    echo "the app gets $APP_HTTP_URL and $APP_SMTP_URL"
    sh app.sh || exit

    # What surl recorded: its log notes each message it stored.
    grep -o 'Message stored: .*' "$log"
  app.sh: |
    #!/bin/sh
    # Stands in for the app under test: it finds both servers through the environment alone.
    greeting=$(curl -fsS "${APP_HTTP_URL}greeting.txt") || exit
    printf 'Subject: Welcome\r\n\r\n%s\r\n' "$greeting" |
      curl -sS -u app@example.com:secret --mail-from app@example.com --mail-rcpt app@example.com \
        -T - "${APP_SMTP_URL}example.com" || exit
    echo "the app mailed: $greeting"
  run-twice.sh: |
    #!/bin/sh
    # Runs the tests twice at once, the first serving directory $1 and the second $2.
    SITE=$1 sh run-tests.sh > run1.txt 2>&1 &
    first=$!
    SITE=$2 sh run-tests.sh > run2.txt 2>&1 &
    second=$!
    wait $first; a=$?
    wait $second; b=$?
    if [ $a -le $b ]; then echo "exit codes: $a $b"; else echo "exit codes: $b $a"; fi
    if [ $a -eq 0 ] && [ $b -eq 0 ] && [ "$(head -n 1 run1.txt)" != "$(head -n 1 run2.txt)" ]; then
      echo "each run got its own ports"
    fi
    grep -h -o 'is in use by another surl process' run1.txt run2.txt || true

cases:
  - id: solution
    role: solution
    claim: Started with port 0 for HTTP and SMTP, surl writes one Listening on line per listen URL with the port it bound; the script hands both URLs to the app through the environment, the app fetches over HTTP and mails over SMTP, and surl's log shows it stored the message.
    run: sh run-tests.sh
    expect:
      exit: 0
      stdout-matches: '^the app gets http://127\.0\.0\.1:[1-9]\d*/ and smtp://127\.0\.0\.1:[1-9]\d*/\nthe app mailed: Welcome aboard\.\nMessage stored: \d+ bytes for 1 recipients\n$'

  - id: two-runs-at-once
    claim: Two runs started at the same moment, each with its own directory, both pass, and each is handed different ports.
    run: sh run-twice.sh site site2
    expect:
      exit: 0
      stdout: "exit codes: 0 0\neach run got its own ports\n"

  - id: shared-directory
    claim: Port 0 ends port clashes but not directory clashes; two runs serving the same directory at once fail one of them, because surl exits 124 when another surl process holds the directory, and the script stops with that code before handing anything to the app.
    run: sh run-twice.sh site site
    expect:
      exit: 0
      stdout: "exit codes: 0 124\nis in use by another surl process\n"
