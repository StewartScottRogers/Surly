# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-hand-bound-ports-to-the-app-in-csharp
title: Handing Bound Ports to the App
protocols: [http, smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, SurlMessageSummary, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions, CurlContent]
exit-codes: [0, 45]
references: [surl-readme, curl-readme]

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A server started with port 0 for HTTP and SMTP names the ports it bound in BoundUrls, in the order of ListenUrls; the app, handed those URLs, fetches over HTTP and mails over SMTP, and the server's mail store shows the message it recorded.
    program: hand-ports.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^the app gets http://127\.0\.0\.1:[1-9]\d*/ and smtp://127\.0\.0\.1:[1-9]\d*/\nthe app mailed: Welcome aboard\. \(SMTP 250\)\nstored: UID 1, \d+ bytes\nserver stopped: Ok\n$'

  - id: two-at-once
    claim: Two servers started side by side, as two parallel test runs would start them, each with port 0, share no port, and their in-memory stores do not clash.
    program: hand-ports.cs
    args: [twice]
    expect:
      exit: 0
      stdout-matches: '^first:  http://127\.0\.0\.1:\d+/ smtp://127\.0\.0\.1:\d+/\nsecond: http://127\.0\.0\.1:\d+/ smtp://127\.0\.0\.1:\d+/\nno port is shared\n$'

  - id: fixed-port-clashes
    claim: A server that asks for a port another server holds, as a fixed port in a parallel run would, is refused with SurlServerStartException, ExitCode BindFailed (45), and surl's own message.
    program: hand-ports.cs
    args: [fixed-port]
    expect:
      exit: 45
      stdout-matches: '^refused: BindFailed \(45\)\n\(45\) Could not bind http://127\.0\.0\.1:\d+/: Address already in use\n$'
