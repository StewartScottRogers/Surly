# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs hand-ports.cs, a C# program on the official MCP SDK
# that starts both hosts from PATH and calls their tools; its argument picks the scenario.
schema: 2
key: surl-hand-bound-ports-to-the-app-from-an-agent
title: Handing Bound Ports to the App
protocols: [http, smtp]
tier: scenarios
surface: mcp
mcp-tools: [start_server, list_servers, list_messages, curl]
exit-codes: [0, 7]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent starts HTTP and SMTP on port 0, hands the URLs in bound_urls to the app, which fetches over HTTP and mails over SMTP, and list_messages shows the message the server stored.
    program: hand-ports.cs
    args: [hand]
    expect:
      exit: 0
      stdout-matches: '^the app gets http://127\.0\.0\.1:[1-9]\d*/ and smtp://127\.0\.0\.1:[1-9]\d*/\nthe app mailed: Welcome aboard\. \(curl exit 0\)\nstored: UID 1, \d+ bytes\n$'

  - id: listen-urls-are-not-addresses
    claim: listen_urls echoes port 0 as asked, so an app handed listen_urls instead of bound_urls cannot connect; curl exits 7.
    program: hand-ports.cs
    args: [listen-urls]
    expect:
      exit: 1
      stdout-matches: '^the app gets http://127\.0\.0\.1:0/ and smtp://127\.0\.0\.1:0/\nfetch failed: curl exit 7, '

  - id: list-servers-again
    claim: list_servers answers the same bound_urls as start_server did, so an agent that has lost that answer can hand the ports on all the same.
    program: hand-ports.cs
    args: [list]
    expect:
      exit: 0
      stdout-matches: '^start_server said: (http://127\.0\.0\.1:\d+/ smtp://127\.0\.0\.1:\d+/)\nlist_servers says: \1\n$'
