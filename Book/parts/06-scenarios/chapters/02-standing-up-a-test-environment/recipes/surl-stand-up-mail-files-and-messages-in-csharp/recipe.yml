# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-stand-up-mail-files-and-messages-in-csharp
title: Standing Up Mail, Files and Messages
protocols: [smtp, imap, http, mqtt]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlMessagePage, SurlMailMessage, SurlFileContents, SurlRetainedMessage, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlMailOptions, CurlContent, CurlException]
exit-codes: [0, 1]
references: [surl-readme, rfc5321, rfc7616, mqtt311]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: One in-process server takes the app's mail (250), invoice upload (201 Created) and MQTT event; the test reads the mail's subject, the file and the retained message from the server's stores, all as expected, and exits 0.
    program: test-environment.cs
    args: []
    expect:
      exit: 0
      stdout: "app mailed ann: 250\napp uploaded the invoice: 201\napp published on orders/7\nmail: Order 7 shipped\nfile: Invoice 7: 3 widgets, 42.00\nmessage: shipped\n"

  - id: wrong-topic
    claim: An event published on invoices/7, outside the retained orders/# filter, raises no error in the app; the test finds no retained message on orders/7 and exits 1.
    program: test-environment.cs
    args: [wrong-topic]
    expect:
      exit: 1
      stdout: "app mailed ann: 250\napp uploaded the invoice: 201\napp published on invoices/7\nmail: Order 7 shipped\nfile: Invoice 7: 3 widgets, 42.00\nFAIL: message is (none), want shipped\n"

  - id: strict
    claim: Without AllowPlaintextAuthentication the mail and the Digest upload still succeed, but the MQTT publish, whose login sends the password as it is, is refused and SendAsync throws CurlException 8.
    program: test-environment.cs
    args: [strict]
    expect:
      exit: 1
      stdout: "app mailed ann: 250\napp uploaded the invoice: 201\napp failed: curl error 8: Expected 0000 but got 0005\n"
