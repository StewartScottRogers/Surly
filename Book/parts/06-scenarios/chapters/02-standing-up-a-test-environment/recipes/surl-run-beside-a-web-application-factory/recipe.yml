# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: surl-run-beside-a-web-application-factory
title: Running Beside a WebApplicationFactory
protocols: [http, smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlEventKind, SurlServerMail]
exit-codes: [0, 1]
references: [surl-readme, rfc9110, rfc5321]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An ASP.NET Core app started in the test's process with the server's HTTP and SMTP addresses in its configuration listens on a port of its own, reads rates from the server over HTTP, mails a sign-up through it, and the server holds the one welcome mail for ann.
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout: "app and server on different ports: True\n/rates: 200 {\"eur\":1.08}\n/signup: 202\nmail to ann: 1 message, Subject: Welcome\n"

  - id: two-apps
    claim: Two apps started from the same code with the same configuration each take a port of their own and both read the rates from the one server.
    program: program.cs
    args: [two-apps]
    timeout: 120
    expect:
      exit: 0
      stdout: "two ports: True\nfirst app /rates: 200\nsecond app /rates: 200\n"

  - id: no-injection
    claim: An app started without the addresses uses its default, a place that answers no one, so its /rates is 502 and not the server's file.
    program: program.cs
    args: [no-injection]
    timeout: 120
    expect:
      exit: 1
      stdout: "app and server on different ports: True\n/rates: 502 \n"

  - id: password-refused
    claim: Without AllowPlaintextAuthentication the server refuses the app's mail password, the app answers its /signup with 502, and no mail reaches ann within two seconds although /rates still works.
    program: program.cs
    args: [no-plaintext]
    timeout: 120
    expect:
      exit: 1
      stdout: "app and server on different ports: True\n/rates: 200 {\"eur\":1.08}\n/signup: 502\nmail to ann: none\n"
