# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-share-one-server-across-a-test-class
title: Sharing One Server Across a Test Class
protocols: [http, smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlMailOptions, CurlContent]
exit-codes: [0, 1]
references: [surl-readme, rfc9110, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A class fixture starts one server for three tests and calls ResetAsync before each; every test sees the same HTTP and SMTP addresses, each finds exactly the files and mail its own step made on top of the start state (config.json, no mail), and all three pass.
    program: class-fixture.cs
    args: []
    expect:
      exit: 0
      stdout: "PASS Upload_adds_one_report\nPASS Signup_sends_one_mail\nPASS Starts_from_the_seeded_state\nserver addresses the tests saw: 1\n"

  - id: order-does-not-matter
    claim: Run in the opposite order, the same three tests pass on the same server, because each starts from the reset state rather than from what the test before left.
    program: class-fixture.cs
    args: [reverse]
    expect:
      exit: 0
      stdout: "PASS Starts_from_the_seeded_state\nPASS Signup_sends_one_mail\nPASS Upload_adds_one_report\nserver addresses the tests saw: 1\n"

  - id: without-the-reset
    claim: Without the reset, the report the first test uploaded and the mail the second test sent are still there, so the second and third tests fail although the app did nothing wrong, and each failure names what the server holds.
    program: class-fixture.cs
    args: [no-reset]
    expect:
      exit: 1
      stdout: "PASS Upload_adds_one_report\nFAIL Signup_sends_one_mail: server holds files [config.json, report.csv] and 1 mail, want [config.json] and 1\nFAIL Starts_from_the_seeded_state: server holds files [config.json, report.csv] and 1 mail, want [config.json] and 0\nserver addresses the tests saw: 1\n"
