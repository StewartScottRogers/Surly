# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: oci-push-and-pull-through-a-test-registry
title: Pushing and Pulling Through a Registry
protocols: [oci]
tier: scenarios
surl-options: [--directory, --cert, --key, --user, --allow-uploads]
curl-options: [--cacert, -u, -T, -s, -S, -D, -o]
exit-codes: [0, 1, 22, 67]
references: [surl-readme, curl-protocols, oci-distribution, oci-image-spec, rfc8446]

# The build's image: the empty config, one layer (app.txt, build 41) and manifest.json, which names
# them by SHA-256 (44136f..., 339846...); manifest.json's own digest is sha256:267a1a.... The
# rebuild, build 42, is app-42.txt (cdb288...) and manifest-42.json. deploy.sh is the deploy step.
fixtures:
  empty.json: "{}"
  app.txt: "app build 41\n"
  manifest.json: "{\"schemaVersion\":2,\"mediaType\":\"application/vnd.oci.image.manifest.v1+json\",\"config\":{\"mediaType\":\"application/vnd.oci.empty.v1+json\",\"digest\":\"sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a\",\"size\":2},\"layers\":[{\"mediaType\":\"text/plain\",\"digest\":\"sha256:33984613b0129bf0f7350dad5e7e372ccbfd585857d4cc9da2f1e333ac5b7603\",\"size\":13}]}\n"
  app-42.txt: "app build 42\n"
  manifest-42.json: "{\"schemaVersion\":2,\"mediaType\":\"application/vnd.oci.image.manifest.v1+json\",\"config\":{\"mediaType\":\"application/vnd.oci.empty.v1+json\",\"digest\":\"sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a\",\"size\":2},\"layers\":[{\"mediaType\":\"text/plain\",\"digest\":\"sha256:cdb288a305e18bfa3b50b6762520d8b133efab26e67ba430d803221c6bc976fc\",\"size\":13}]}\n"
  store/readme.txt: "The registry's store.\n"
  deploy.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # The deploy step: pulls the manifest at REF from the registry, checks that it hashes to the
    # digest the build pushed, then pulls each blob it names and checks each the same way.
    # Usage: sh deploy.sh REGISTRY REF DIGEST, e.g. sh deploy.sh 127.0.0.1:5000 demo/app:1.0 sha256:...
    repo=${2%%[:@]*}
    curl -sS --cacert server.pem -u deploy:d3ploy -D pull.headers -o pulled.json "oci://$1/$2" || exit $?
    got=sha256:$(openssl dgst -sha256 -r pulled.json | cut -d ' ' -f 1)
    said=$(tr -d '\r' < pull.headers | grep -i '^docker-content-digest:' | tail -n 1 | sed 's/^[^:]*: *//')
    echo "pulled $2: $got"
    echo "the registry says: $said"
    if [ "$got" != "$3" ]; then
      echo "not the manifest the build pushed ($3)"
      exit 1
    fi
    for blob in $(grep -o '"digest":"sha256:[0-9a-f]*"' pulled.json | cut -d '"' -f 4); do
      curl -sS --cacert server.pem -u deploy:d3ploy -o blob.bin "oci://$1/$repo@$blob" || exit $?
      test "sha256:$(openssl dgst -sha256 -r blob.bin | cut -d ' ' -f 1)" = "$blob" || { echo "blob $blob: hash differs"; exit 1; }
      echo "blob $(echo "$blob" | cut -c 1-19): $(wc -c < blob.bin | tr -d ' ') bytes, hash ok"
    done
    echo "deploy: image verified"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# The test registry: a store on disk, an account for the build and one for the deploy, pushes allowed.
servers:
  main:
    command: surl --directory store --cert server.pem --key server.key --user build:b1ld --user deploy:d3ploy --allow-uploads oci://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The build pushes the config, the layer and the manifest under demo/app:1.0 in one curl; the deploy pulls the manifest by its tag, finds it hashes to the digest of the manifest the build pushed, as the registry's Docker-Content-Digest also says, and pulls the config and the layer, each hashing to its name.
    run: curl -sS --cacert server.pem -u build:b1ld -T empty.json oci://127.0.0.1:{{port}}/demo/app@sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a -T app.txt oci://127.0.0.1:{{port}}/demo/app@sha256:33984613b0129bf0f7350dad5e7e372ccbfd585857d4cc9da2f1e333ac5b7603 -T manifest.json oci://127.0.0.1:{{port}}/demo/app:1.0 && sh deploy.sh 127.0.0.1:{{port}} demo/app:1.0 sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275
    timeout: 120
    expect:
      exit: 0
      stdout: "pulled demo/app:1.0: sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\nthe registry says: sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\nblob sha256:44136fa355b3: 2 bytes, hash ok\nblob sha256:33984613b012: 13 bytes, hash ok\ndeploy: image verified\n"

  - id: tag-in-the-store
    claim: The push left the image in the store on disk in OCI image layout; index.json records the tag 1.0 against the manifest's digest.
    run: curl -sS --cacert server.pem -u deploy:d3ploy oci://127.0.0.1:{{port}}/demo/app:1.0 -o {{null}} && test -f store/demo/app/blobs/sha256/267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275 && grep -o "267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\",\"size\":359,\"annotations\":{\"org.opencontainers.image.ref.name\":\"1.0\"" store/demo/app/index.json
    timeout: 120
    expect:
      exit: 0
      stdout: "267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\",\"size\":359,\"annotations\":{\"org.opencontainers.image.ref.name\":\"1.0\"\n"

  - id: unknown-tag
    claim: A deploy of a tag the build never pushed stops at the pull, 404 MANIFEST_UNKNOWN, curl exit 22.
    run: sh deploy.sh 127.0.0.1:{{port}} demo/app:2.0 sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275
    timeout: 120
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "404 (MANIFEST_UNKNOWN"

  - id: wrong-password
    claim: A pull with the wrong password gets no token, curl exit 67.
    run: curl -sS --cacert server.pem -u deploy:wrong oci://127.0.0.1:{{port}}/demo/app:1.0
    expect:
      exit: 67
      stderr-contains: "The token endpoint answered 401 without a token"

  - id: tag-moved
    claim: When a rebuild pushes build 42 under the same tag, the deploy of 1.0 pulls a manifest with another digest, says so and exits 1.
    run: curl -sS --cacert server.pem -u build:b1ld -T app-42.txt oci://127.0.0.1:{{port}}/demo/app@sha256:cdb288a305e18bfa3b50b6762520d8b133efab26e67ba430d803221c6bc976fc -T manifest-42.json oci://127.0.0.1:{{port}}/demo/app:1.0 && sh deploy.sh 127.0.0.1:{{port}} demo/app:1.0 sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275
    timeout: 120
    expect:
      exit: 1
      stdout: "pulled demo/app:1.0: sha256:0bdf1c73f543e0ac481c1db12a0608afd498c076228adca73e717ea95a7b7b7c\nthe registry says: sha256:0bdf1c73f543e0ac481c1db12a0608afd498c076228adca73e717ea95a7b7b7c\nnot the manifest the build pushed (sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275)\n"

  - id: pinned-by-digest
    claim: A deploy that pulls by the manifest's digest, not the tag, still gets build 41 after the tag moved, and verifies it.
    run: sh deploy.sh 127.0.0.1:{{port}} demo/app@sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275 sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275
    timeout: 120
    expect:
      exit: 0
      stdout: "pulled demo/app@sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275: sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\nthe registry says: sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\nblob sha256:44136fa355b3: 2 bytes, hash ok\nblob sha256:33984613b012: 13 bytes, hash ok\ndeploy: image verified\n"

  - id: changed-layer-not-served
    claim: When build 41's layer file in the store is overwritten with other bytes of the same length, the registry does not serve it, 404 BLOB_UNKNOWN, and the deploy stops with curl's exit 22.
    run: sh -c "cp app-42.txt store/demo/app/blobs/sha256/33984613b0129bf0f7350dad5e7e372ccbfd585857d4cc9da2f1e333ac5b7603" && sh deploy.sh 127.0.0.1:{{port}} demo/app@sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275 sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275
    timeout: 120
    expect:
      exit: 22
      stdout: "pulled demo/app@sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275: sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\nthe registry says: sha256:267a1a95fbd5b9ea80c16d403cfb6c46dfa46b3abc615dafa13acb32e452c275\nblob sha256:44136fa355b3: 2 bytes, hash ok\n"
      stderr-contains: "404 (BLOB_UNKNOWN"
