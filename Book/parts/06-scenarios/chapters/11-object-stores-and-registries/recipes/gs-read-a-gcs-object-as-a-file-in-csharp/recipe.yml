# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: gs-read-a-gcs-object-as-a-file-in-csharp
title: Reading a GCS Object as a File in C#
protocols: [gs, https]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlServerFiles, SurlFileContents, SurlNotFoundException, CurlClient, CurlRequest, CurlResponse, CurlContent, CurlNetworkOptions, CurlAuthenticationOptions, HttpAuthenticationMethods, CurlTlsOptions, CurlTlsPeerOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, gcs-xml-api, rfc6750, rfc7617]

fixtures: {}

# A certificate for 127.0.0.1 and for Google's storage host, good for 30 days, signed by its own
# key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:storage.googleapis.com"

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A put through gs:// signed with the HMAC key pair is answered 200, the same bytes are read over https:// with the token, and the server's store holds the object.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout: "put: 200\nread: 200 hello from gcs\nstored: hello from gcs\n"

  - id: no-trailing-newline
    claim: An object whose last byte is not a newline is read back with exactly 17 bytes, identical to the upload.
    program: program.cs
    args: [no-trailing-newline]
    expect:
      exit: 0
      stdout: "read 17 bytes, identical to the upload: True\n"

  - id: nested-name
    claim: A slash in an object name makes folders; photos/2026/q1/report.txt is read over https:// at the same path, and the store holds it there.
    program: program.cs
    args: [nested-name]
    expect:
      exit: 0
      stdout: "read: q1 totals\nstored at /photos/2026/q1/report.txt: q1 totals\n"

  - id: file-is-an-object
    claim: An object that was already in the store is read through gs:// like any other.
    program: program.cs
    args: [file-is-an-object]
    expect:
      exit: 0
      stdout: "get: 200 already here\n"

  - id: put-with-the-token
    claim: A put through gs:// with the OAuth token is answered 200, and https:// reads it with the HMAC key pair as a Basic login.
    program: program.cs
    args: [put-with-the-token]
    expect:
      exit: 0
      stdout: "put: 200\nread: 200 hello from gcs\n"

  - id: content-type
    claim: Read over https://, an object named .txt is served as Content-Type text/plain.
    program: program.cs
    args: [content-type]
    expect:
      exit: 0
      stdout: "Content-Type: text/plain\n"

  - id: https-needs-a-login
    claim: A read over https:// with no login is answered 401, an ordinary response.
    program: program.cs
    args: [https-needs-a-login]
    expect:
      exit: 0
      stdout: "read with no login: 401\n"

  - id: wrong-secret
    claim: A put signed with the wrong secret throws CurlException with code HttpReturnedError and the message names 403 SignatureDoesNotMatch.
    program: program.cs
    args: [wrong-secret]
    expect:
      exit: 0
      stdout: "put: HttpReturnedError 403 SignatureDoesNotMatch\n"

  - id: refused-is-not-written
    claim: After the refused put, a read over https:// is 404 and the store has no such object.
    program: program.cs
    args: [refused-is-not-written]
    expect:
      exit: 0
      stdout: "put: HttpReturnedError 403 SignatureDoesNotMatch\nread over https: 404\nstore: no such object\n"

  - id: missing-object
    claim: A name with no object throws CurlException, 404 NoSuchKey.
    program: program.cs
    args: [missing-object]
    expect:
      exit: 0
      stdout: "get: HttpReturnedError 404 NoSuchKey\n"

  - id: uploads-off
    claim: With AllowUploads off, a correctly signed put throws CurlException, 403 AccessDenied.
    program: program.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "put: HttpReturnedError 403 AccessDenied\n"

  - id: uploads-off-reads
    claim: With AllowUploads off, the objects already there are still read, through gs:// and over https:// alike.
    program: program.cs
    args: [uploads-off-reads]
    expect:
      exit: 0
      stdout: "gs get: 200 already here\nhttps get: 200 already here\n"
