# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs through-socks.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: socks5-reach-test-services-through-socks-from-an-agent
title: Reaching Test Services Through SOCKS from an Agent
protocols: [socks5h, http, ftp]
tier: scenarios
surface: mcp
mcp-tools: [start_server, transfer, get_exchanges]
exit-codes: [0]
references: [surl-readme, rfc1928, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: transfer with a socks5h:// proxy fetches over HTTP and over FTP, and get_exchanges on the proxy's listen URL shows three exchanges, each asking for localhost, to the HTTP service, the FTP service and the FTP passive port named in the 229 reply.
    program: through-socks.cs
    args: []
    expect:
      exit: 0
      stdout: "http: hello from surl\nftp: hello from surl\nproxy exchange: localhost, the HTTP service\nproxy exchange: localhost, the FTP service\nproxy exchange: localhost, the FTP passive port from the 229 reply\n"

  - id: refused-call-recorded
    claim: Through the same proxy an FTP service without --allow-anonymous refuses the anonymous login, exit code 67, and the proxy's record still has the exchange to that service.
    program: through-socks.cs
    args: [locked]
    expect:
      exit: 0
      stdout: "ftp: curl exit code 67 (LoginDenied)\nproxy exchange: localhost, the locked FTP service\n"
