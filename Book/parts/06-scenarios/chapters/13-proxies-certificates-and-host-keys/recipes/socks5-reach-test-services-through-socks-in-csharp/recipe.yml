# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: socks5-reach-test-services-through-socks-in-csharp
title: Reaching Test Services Through SOCKS in C#
protocols: [socks5h, http, ftp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlClientOptions, CurlProxyOptions, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, rfc1928, rfc959]

fixtures: {}

# No servers: block. The program hosts the services and the proxy through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A CurlClient whose proxy is socks5h:// fetches over HTTP and over FTP, and the proxy's log has a connection to the HTTP service, one to the FTP service, and one to the FTP passive port named in the 229 reply.
    program: through-socks.cs
    args: []
    expect:
      exit: 0
      stdout: "http: hello from surl\nftp: hello from surl\nproxy connected to the HTTP service\nproxy connected to the FTP service\nproxy connected to the FTP passive port from the 229 reply\n"

  - id: refused-call-recorded
    claim: Through the same proxy an FTP service without AllowAnonymous refuses the anonymous login, CurlException LoginDenied (67), and the proxy's log still has the connection to that service.
    program: through-socks.cs
    args: [locked]
    expect:
      exit: 0
      stdout: "ftp: CurlException LoginDenied (67)\nproxy connected to the locked FTP service\n"
