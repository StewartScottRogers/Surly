# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: socks5-reach-test-services-through-socks
title: Reaching Test Services Through SOCKS
protocols: [socks5h, http, ftp]
tier: scenarios
surl-options: [--directory, --allow-anonymous, -v, --log-file]
curl-options: [-x, -s, -S]
exit-codes: [0, 67]
references: [surl-readme, curl-manual, rfc1928, rfc959]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  # One surl: the HTTP and FTP services on localhost, and the SOCKS5 proxy the test network allows,
  # logging every exchange to socks.log. --allow-anonymous lets curl's anonymous FTP login in.
  main:
    command: surl --directory site --allow-anonymous http://localhost:{{port}}/ ftp://localhost:{{port2}}/ socks5h://127.0.0.1:{{port3}}/ -v --log-file socks.log
    ready: port
  # An FTP service started as surl starts by default: no anonymous login.
  locked:
    command: surl ftp://localhost:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -x socks5h:// fetches over HTTP through the SOCKS5 proxy, which resolves localhost and relays the request and the answer.
    run: curl -s -x socks5h://127.0.0.1:{{port3}} http://localhost:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: ftp-through-socks
    claim: The same -x fetches the same file over FTP, exit 0.
    run: curl -s -x socks5h://127.0.0.1:{{port3}} ftp://localhost:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: record-http
    claim: The proxy's log has one connection to the HTTP service's port, answered 05 00, success.
    run: grep "Connected to localhost:{{port}};" socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Connected to localhost:\d+; answered 05 00\.\n$'

  - id: record-ftp-control
    claim: It has one connection to the FTP service's port, the control connection.
    run: grep "Connected to localhost:{{port2}};" socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Connected to localhost:\d+; answered 05 00\.\n$'

  - id: record-ftp-data
    claim: The FTP transfer's data connection went through the proxy too; after the HTTP and FTP control connections, the third connection goes to the port the FTP server named in its 229 passive-mode reply.
    run: grep -m1 "229 Entering" socks.log && grep "Connected to " socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ > 229 Entering Extended Passive Mode \(\|\|\|(\d+)\|\)\\r\\n\n#\d+ \* Connected to localhost:\d+; answered 05 00\.\n#\d+ \* Connected to localhost:\d+; answered 05 00\.\n#\d+ \* Connected to localhost:\1; answered 05 00\.\n$'

  - id: ftp-needs-a-login
    claim: Through the same proxy, an FTP service without --allow-anonymous refuses curl's anonymous login, exit 67.
    run: curl -sS -x socks5h://127.0.0.1:{{port3}} ftp://localhost:{{port4}}/hello.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "curl: (67)"

  - id: record-refused-call
    claim: The proxy's log records that call too, a connection to that service's port, so a refused call is in the record as well as a served one.
    run: grep "Connected to localhost:{{port4}};" socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Connected to localhost:\d+; answered 05 00\.\n$'
