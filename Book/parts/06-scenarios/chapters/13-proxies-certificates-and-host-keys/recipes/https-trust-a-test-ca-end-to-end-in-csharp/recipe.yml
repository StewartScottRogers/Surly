# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: https-trust-a-test-ca-end-to-end-in-csharp
title: Trusting a Test CA End to End in C#
protocols: [https, smtps]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, rfc5280, rfc8314]

fixtures: {}

# One test certificate authority (CA), and two server certificates it signs for 127.0.0.1: www for
# HTTPS, mail for SMTPS. stray is signed by another authority, as a server nobody trusts.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 30 -subj "/CN=Test CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
  - printf "subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n" > server.ext
  - openssl req -newkey rsa:2048 -nodes -keyout www.key -out www.csr -subj "/CN=127.0.0.1"
  - openssl x509 -req -in www.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out www.pem -days 30 -extfile server.ext
  - openssl req -newkey rsa:2048 -nodes -keyout mail.key -out mail.csr -subj "/CN=127.0.0.1"
  - openssl x509 -req -in mail.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out mail.pem -days 30 -extfile server.ext
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout other.key -out other.pem -days 30 -subj "/CN=Other CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
  - openssl req -newkey rsa:2048 -nodes -keyout stray.key -out stray.csr -subj "/CN=127.0.0.1"
  - openssl x509 -req -in stray.csr -CA other.pem -CAkey other.key -CAcreateserial -out stray.pem -days 30 -extfile server.ext

# No servers: block. The program hosts its two servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: One CurlClient trusting only the test CA fetches over HTTPS (200), sends over SMTPS (250), and the mail reaches Ann's mailbox.
    program: trust-ca.cs
    args: []
    expect:
      exit: 0
      stdout: "HTTPS 200: hello from surl\nSMTPS 250\nann@example.com holds 1\n"

  - id: without-the-ca
    claim: With no CertificateAuthorityFile both requests throw CurlException PeerFailedVerification, 60.
    program: trust-ca.cs
    args: [no-ca]
    expect:
      exit: 0
      stdout: "HTTPS refused: PeerFailedVerification (60)\nSMTPS refused: PeerFailedVerification (60)\n"

  - id: other-authority-refused
    claim: A server whose certificate another authority signed, for the same address, is refused by the client that trusts only the test CA, PeerFailedVerification.
    program: trust-ca.cs
    args: [stray]
    expect:
      exit: 0
      stdout: "HTTPS refused: PeerFailedVerification (60)\n"

  - id: skipping-the-check-hides-it
    claim: With VerifyPeer and VerifyHost false the client fetches from that server, 200, which is why the test never sets them.
    program: trust-ca.cs
    args: [insecure]
    expect:
      exit: 0
      stdout: "HTTPS 200: hello from surl\n"

  - id: windows-checks-revocation
    platforms: [windows]
    claim: On Windows, without SslOptions.NoRevoke, the right CertificateAuthorityFile still fails with PeerFailedVerification, because the test certificates name no revocation list.
    program: trust-ca.cs
    args: [revocation]
    expect:
      exit: 0
      stdout: "HTTPS refused: PeerFailedVerification (60)\n"
