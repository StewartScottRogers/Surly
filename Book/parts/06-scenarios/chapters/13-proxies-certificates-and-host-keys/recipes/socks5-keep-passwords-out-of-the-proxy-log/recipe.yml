# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: socks5-keep-passwords-out-of-the-proxy-log
title: Keeping Passwords out of a Proxy's Log
protocols: [socks5h, ftp, http]
tier: scenarios
surl-options: [--directory, --user, --allow-plaintext-auth, -v, --log-file, --trace-ascii]
curl-options: [-x, -s, -u, --basic, -o, -w]
exit-codes: [0, 1]
references: [surl-readme, curl-manual, rfc1928, rfc959, rfc7617]

fixtures:
  site/hello.txt: "hello from surl\n"
  strict/hello.txt: "hello from surl\n"

servers:
  # The services the test logs in to: HTTP and FTP on localhost, one account. --allow-plaintext-auth
  # lets HTTP Basic be checked over plain http://, as a test service often must.
  services:
    command: surl --directory site --user app:s3cret-pw --allow-plaintext-auth http://localhost:{{port}}/ ftp://localhost:{{port2}}/
    ready: port
  # The SOCKS5 proxy, in its own surl, whose verbose log the test keeps as evidence.
  proxy:
    command: surl socks5h://127.0.0.1:{{port3}}/ -v --log-file proxy.log
    ready: port
  # The same service started with no loosening: Basic over plain http:// is refused unchecked.
  # Its own folder: one surl holds a folder at a time.
  strict:
    command: surl --directory strict --user app:s3cret-pw http://localhost:{{port5}}/
    ready: port
  # A second proxy that keeps a full trace instead.
  traced:
    command: surl socks5h://127.0.0.1:{{port4}}/ --trace-ascii proxy.trace
    ready: port

cases:
  - id: solution
    role: solution
    claim: Through the SOCKS5 proxy curl logs in to the FTP service as app and fetches hello.txt, exit 0.
    run: curl -s -x socks5h://127.0.0.1:{{port3}} -u app:s3cret-pw ftp://localhost:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: http-through
    claim: Through the same proxy curl logs in to the HTTP service with Basic and fetches hello.txt, exit 0.
    run: curl -s -x socks5h://127.0.0.1:{{port3}} --basic -u app:s3cret-pw http://localhost:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: ftp-pass-masked
    claim: The proxy's log records the relayed FTP login with the user name as sent, USER app, and the password as ****, PASS ****.
    run: grep -E "< (USER|PASS) " proxy.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ < USER app\\r\\n\n#\d+ < PASS \*\*\*\*\\r\\n\n$'

  - id: http-authorization-masked
    claim: It records the relayed HTTP request line as sent and the Authorization header with its scheme kept and its credentials as ****.
    run: grep -E "< (GET|Authorization)" proxy.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ < GET /hello\.txt HTTP/1\.1\\r\\n\n#\d+ < Authorization: Basic \*\*\*\*\\r\\n\n$'

  - id: no-password-in-log
    claim: Neither the password nor the Basic credentials that encode it, YXBwOnMzY3JldC1wdw==, appear anywhere in the proxy's log; grep counts 0 lines and exits 1.
    run: grep -c -e s3cret-pw -e YXBwOnMzY3JldC1wdw== proxy.log
    expect:
      exit: 1
      stdout: "0\n"

  - id: trace-masked
    claim: A proxy started with --trace-ascii instead writes the relayed PASS line into its trace as PASS ****.
    run: 'curl -s -x socks5h://127.0.0.1:{{port4}} -u app:s3cret-pw ftp://localhost:{{port2}}/hello.txt && grep -E "^[0-9a-f]+: PASS " proxy.trace'
    expect:
      exit: 0
      stdout: "hello from surl\n0000: PASS ****\n"

  - id: no-password-in-trace
    claim: The trace holds the password nowhere either; grep counts 0 lines and exits 1.
    run: grep -c s3cret-pw proxy.trace
    expect:
      exit: 1
      stdout: "0\n"

  - id: strict-service-refuses
    claim: Without --allow-plaintext-auth the service answers the same Basic login over plain HTTP 403 Forbidden, unchecked; the proxy relayed the request all the same, and its log has the connection to that service's port.
    run: 'curl -s -o {{null}} -w "%{http_code}\n" -x socks5h://127.0.0.1:{{port3}} --basic -u app:s3cret-pw http://localhost:{{port5}}/hello.txt && grep "Connected to localhost:{{port5}};" proxy.log'
    expect:
      exit: 0
      stdout-matches: '^403\n#\d+ \* Connected to localhost:\d+; answered 05 00\.\n$'
