schema: 2
key: http-prove-a-client-uses-its-proxy-in-csharp
title: Proving a Client Uses Its Proxy in C#
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, CurlClient, CurlClientOptions, CurlProxyOptions, CurlRequest, CurlResponse]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: After the client fetched two files through the proxy, the origin's recorded requests number two, both carrying the proxy's Via 1.1 surl header and none without it; the program exits 0.
    program: program.cs
    args: ["proxied"]
    expect:
      exit: 0
      stdout-matches: '\norigin: 2 via the proxy, 0 direct\n\Z'

  - id: client-got-the-files
    claim: The client received both files through the proxy, 200 with 16 and 14 bytes.
    program: program.cs
    args: ["proxied"]
    expect:
      exit: 0
      stdout-matches: '\Ahello\.txt: 200, 16 bytes, [^\n]*\nprices\.json: 200, 14 bytes, '

  - id: proxy-forwarded
    claim: The proxy listener's recorded exchanges hold one absolute-form request for the origin for each request it passed on.
    program: program.cs
    args: ["proxied"]
    expect:
      exit: 0
      stdout-matches: '\nproxy received 2 requests for the origin\n'

  - id: via-on-the-answer
    claim: The client can see it too; each answer that came through the proxy carries Via 1.1 surl in CurlResponse.Headers.
    program: program.cs
    args: ["proxied"]
    expect:
      exit: 0
      stdout-matches: '\Ahello\.txt: [^\n]*, Via: 1\.1 surl\nprices\.json: [^\n]*, Via: 1\.1 surl\n'

  - id: bypass
    claim: A client without the proxy still gets the file, 200 with no Via header, because the origin answers anyone.
    program: program.cs
    args: ["bypass"]
    expect:
      exit: 1
      stdout-matches: '\nhello\.txt: 200, 16 bytes, Via: none\n'

  - id: bypass-caught
    claim: The check catches it; the origin's requests now include one without Via, and the program exits 1.
    program: program.cs
    args: ["bypass"]
    expect:
      exit: 1
      stdout-matches: '\norigin: 1 via the proxy, 1 direct\n\Z'
