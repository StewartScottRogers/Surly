# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-run-tests-in-parallel-without-clashes-in-csharp
title: Running Tests in Parallel Without Clashes
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlFileContents, SurlServerStartException, SurlExitCode, CurlClient, CurlRequest, CurlResponse, CurlContent, CurlAuthenticationOptions, HttpAuthenticationMethods]
exit-codes: [0, 1, 45, 124]
references: [surl-readme, curl-readme, rfc7616]

fixtures: {}

# No servers: block. Each worker hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Four workers run at once, each on its own in-process server, and each reads back the result it uploaded under the shared name result.txt and its own whoami.txt, with its server's store holding that result; the four servers had four ports and the run exits 0.
    program: workers.cs
    args: ["4"]
    expect:
      exit: 0
      stdout: "worker 1: worker 1, result of worker 1; stored result of worker 1\nworker 2: worker 2, result of worker 2; stored result of worker 2\nworker 3: worker 3, result of worker 3; stored result of worker 3\nworker 4: worker 4, result of worker 4; stored result of worker 4\nports: 4 different\n"

  - id: one-worker-fails
    claim: When one worker's tests fail, here worker 2 logging in with a wrong password so its upload is answered 401, the other workers still pass and the run exits 1.
    program: workers.cs
    args: ["3", "2"]
    expect:
      exit: 1
      stdout: "worker 1: worker 1, result of worker 1; stored result of worker 1\nworker 2 failed: upload answered 401\nworker 3: worker 3, result of worker 3; stored result of worker 3\nports: 3 different\n"

  - id: shared-directory
    claim: Two servers cannot share a DataDirectory; the second StartAsync throws SurlServerStartException with ExitCode DataDirectoryInUse (124).
    program: workers.cs
    args: [shared-directory]
    expect:
      exit: 124
      stdout: "shared-directory: DataDirectoryInUse (124)\n"

  - id: shared-port
    claim: A fixed port another server holds is refused with ExitCode BindFailed (45), which port 0 never meets.
    program: workers.cs
    args: [shared-port]
    expect:
      exit: 45
      stdout: "shared-port: BindFailed (45)\n"
