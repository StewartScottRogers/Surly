# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-keep-the-server-log-for-a-failed-run-in-csharp
title: Keeping the Server Log for Failures
protocols: [https, ftps]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, LogLevel, CurlClient, CurlRequest, CurlResponse, CurlException, CurlTlsOptions, CurlTlsPeerOptions, CurlAuthenticationOptions, HttpAuthenticationMethods]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc4217, rfc6750, rfc8446]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: passing-run-keeps-nothing
    claim: When every fetch passes, the test exits 0 and keeps nothing.
    program: keep-logs.cs
    args: []
    expect:
      exit: 0
      stdout: "https password: 200\nhttps token: 200\nftps password: 0\n"

  - id: solution
    role: solution
    claim: When the FTPS login is refused, Curl.Api throws CurlException LoginDenied (67), and the test keeps the server's log in ci-logs/surl.log and exits 1.
    program: keep-logs.cs
    args: [guess]
    expect:
      exit: 1
      stdout: "https password: 200\nhttps token: 200\nftps password: 67 LoginDenied\nkept ci-logs/surl.log\n"
      files:
        ci-logs/surl.log: null

  - id: kept-log-says-why
    claim: The kept log names the method and the account of each judged login, the refused FTPS login as app last.
    run: grep -E "Login (accepted|refused)" ci-logs/surl.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Login accepted: Basic app\r?\n#\d+ \* Login accepted: Bearer bearer token\r?\n#\d+ \* Login refused: ftps app\r?\n$'

  - id: kept-log-keeps-replies
    claim: The kept log still holds the lines the server sent, here the 530 reply that refused the login.
    run: grep -c "> 530 Login incorrect" ci-logs/surl.log
    expect:
      exit: 0
      stdout: "1\n"

  - id: password-withheld
    claim: The log holds the FTP PASS command the client sent, with four asterisks where the password was.
    run: grep -c "< PASS [*][*][*][*]" ci-logs/surl.log
    expect:
      exit: 0
      stdout: "1\n"

  - id: kept-log-holds-no-secret
    claim: The kept log holds neither password nor the token.
    run: grep -c -e s3cret -e guess -e tok-7f3a9c ci-logs/surl.log
    expect:
      exit: 1
      stdout: "0\n"
