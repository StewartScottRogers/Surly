# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-send-server-logs-to-test-output
title: Sending Server Logs to Test Output
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, LogLevel, CurlClient, CurlRequest, CurlResponse]
exit-codes: [1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With each test's server logging at LogLevel.Verbose into that test's output, the failing test shows the server's Listening on line, the request it received, the 404 event saying nothing exists at the path, the reply it sent and the end of the exchange; the passing test shows nothing; one test failed, so the run exits 1.
    program: log-to-test-output.cs
    args: []
    expect:
      exit: 1
      stdout-matches: '^PASS fetches the report\nFAIL fetches the summary: expected 200 for summary\.csv, got 404\n  \[surl\] Listening on http://127\.0\.0\.1:\d+/\n  \[surl\] #1 \* Exchange 1 opened: http from 127\.0\.0\.1:\d+\.\n  \[surl\] #1 < GET /summary\.csv HTTP/1\.1\\r\\n\n(  \[surl\] #1 < .*\n)+  \[surl\] #1 \* GET /summary\.csv: 404, nothing exists at .*summary\.csv\n  \[surl\] #1 > HTTP/1\.1 404 Not Found\\r\\n\n(  \[surl\] #1 > .*\n)+  \[surl\] #1 \* The client closed the connection: ConnectionClosed\.\n  \[surl\] #1 \* Exchange 1 ended; closing the connection\.\n$'

  - id: info-says-little
    claim: At LogLevel.Info, the level a server logs at unless told otherwise, the failing test's output holds only the Listening on line and the exchange opening, nothing about the request or the 404.
    program: log-to-test-output.cs
    args: [info]
    expect:
      exit: 1
      stdout-matches: '^PASS fetches the report\nFAIL fetches the summary: expected 200 for summary\.csv, got 404\n  \[surl\] Listening on http://127\.0\.0\.1:\d+/\n  \[surl\] #1 \* Exchange 1 opened: http from 127\.0\.0\.1:\d+\.\n$'
