# Executable specification. key MUST equal the folder name and never changes once published.
# ci-servers.sh starts its own surl; the server under servers: only holds a port for the
# port-taken case.
schema: 1
key: surl-run-a-test-server-in-ci
title: Running a Test Server in CI
protocols: [http, smtp]
tier: scenarios
surl-options: [-v, --directory, --mail-domain, --mailbox]
curl-options: [-f, -s, -S, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0, 45, 67, 137]
references: [surl-readme, curl-manual, rfc5321]

fixtures:
  site/greeting.txt: "Welcome aboard.\n"
  ci-servers.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # A CI step: start surl's HTTP and SMTP listeners, write their URLs to servers.env, run the
    # tests with those URLs in the environment, then stop surl. The step fails with surl's exit
    # code if surl does not start or ends before it is stopped, and with the tests' if they fail.
    # Usage: sh ci-servers.sh <http port> <smtp port> <test command> [<argument>...]
    http_port=$1; smtp_port=$2; shift 2
    : > listening.txt
    surl -v --directory site --mail-domain example.com --mailbox app@example.com:secret \
      "http://127.0.0.1:$http_port/" "smtp://127.0.0.1:$smtp_port/" > listening.txt 2> surl.log &
    pid=$!
    echo "$pid" > surl.pid

    # One Listening on line per listen URL once both have bound. If surl exits first, it
    # refused to start: show why and fail the step with its exit code.
    tries=0
    until [ "$(grep -c '^Listening on ' listening.txt)" -eq 2 ]; do
      if ! kill -0 "$pid" 2>/dev/null; then
        wait "$pid"; code=$?
        cat surl.log >&2
        echo "surl did not start: exit $code" >&2
        exit "$code"
      fi
      tries=$((tries + 1))
      if [ "$tries" -ge 100 ]; then kill "$pid"; echo "surl did not start in 10 s" >&2; exit 1; fi
      sleep 0.1
    done

    # The URLs, as NAME=value lines a later step can read too.
    sed -n -e 's|^Listening on \(http://.*\)|HTTP_URL=\1|p' \
           -e 's|^Listening on \(smtp://.*\)|SMTP_URL=\1|p' listening.txt > servers.env
    . ./servers.env
    export HTTP_URL SMTP_URL

    "$@"
    tests=$?

    # Stop surl and read how it ended: 0 when it handled SIGTERM, 143 when the shell ended it
    # outright (Git Bash on Windows). Any other code means it ended before it was asked to.
    kill "$pid" 2>/dev/null
    wait "$pid"; code=$?
    echo "tests: exit $tests; surl: exit $code" >&2
    case $code in
      0|143) ;;
      *) echo "surl ended before it was stopped" >&2
         [ "$tests" -ne 0 ] || tests=$code ;;
    esac
    exit "$tests"
  tests.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # The job's tests: fetch the greeting over HTTP and mail it over SMTP, to the URLs the step
    # put in the environment. The first failure ends them with curl's exit code.
    # Usage: sh tests.sh [<mailbox password>]
    set -e
    greeting=$(curl -fsS "${HTTP_URL}greeting.txt")
    printf 'Subject: Greeting\r\n\r\n%s\r\n' "$greeting" |
      curl -sS -u "app@example.com:${1:-secret}" --mail-from app@example.com \
        --mail-rcpt app@example.com -T - "${SMTP_URL}example.com"
    echo "mailed: $greeting"
  kill-surl.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Stands in for a test that brings the server down: ends surl at once with SIGKILL.
    kill -9 "$(cat surl.pid)"

# Something else holding a port, for the port-taken case.
servers:
  holder:
    command: surl http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The step starts surl on free ports for HTTP and SMTP, the tests fetch over HTTP and mail over SMTP to the URLs it hands them, surl is stopped, and the step exits 0.
    run: sh ci-servers.sh 0 0 sh tests.sh
    timeout: 30
    expect:
      exit: 0
      stdout: "mailed: Welcome aboard.\n"
      stderr-contains: "tests: exit 0; surl: exit "

  - id: urls-for-later-steps
    claim: servers.env holds one NAME=value line per listener, each URL with the port surl bound, never 0.
    run: grep -E "^(HTTP|SMTP)_URL=" servers.env
    expect:
      exit: 0
      stdout-matches: '^HTTP_URL=http://127\.0\.0\.1:[1-9]\d*/\nSMTP_URL=smtp://127\.0\.0\.1:[1-9]\d*/\n$'

  - id: server-recorded-the-mail
    claim: surl's verbose log shows the server stored the message the tests sent, for one recipient.
    run: 'grep -o "Message stored: [0-9]* bytes for 1 recipients" surl.log'
    expect:
      exit: 0
      stdout-matches: '^Message stored: \d+ bytes for 1 recipients\n$'

  - id: tests-fail
    claim: When a test fails, here an SMTP login with the wrong password that curl reports as exit 67, surl is still stopped and the step exits 67.
    run: sh ci-servers.sh 0 0 sh tests.sh wrong
    timeout: 30
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "tests: exit 67; surl: exit "

  - id: port-taken
    claim: When surl cannot start, here because a fixed HTTP port is held by another server, it exits 45 and writes no Listening on line; the step shows surl's message, runs no test and exits 45.
    run: sh ci-servers.sh {{port}} 0 sh tests.sh
    timeout: 30
    expect:
      exit: 45
      stdout: ""
      stderr-contains: "surl did not start: exit 45"

  - id: surl-ended-early
    claim: When surl ends before the step stops it, here killed with SIGKILL so the shell reports 137, the step fails with 137 even though the test command passed.
    run: sh ci-servers.sh 0 0 sh kill-surl.sh
    timeout: 30
    expect:
      exit: 137
      stderr-contains: "surl ended before it was stopped"

  - id: clean-stop-unix
    platforms: [linux, macos]
    claim: On Linux and macOS surl handles the step's SIGTERM and exits 0.
    run: sh ci-servers.sh 0 0 true
    timeout: 30
    expect:
      exit: 0
      stderr-contains: "tests: exit 0; surl: exit 0\n"

  - id: clean-stop-windows
    platforms: [windows]
    claim: On Windows Git Bash's kill ends surl outright, so the step reads 143 and counts it as a clean stop.
    run: sh ci-servers.sh 0 0 true
    timeout: 30
    expect:
      exit: 0
      stderr-contains: "tests: exit 0; surl: exit 143\n"
