# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs keep-logs.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument is the FTPS password the last test uses.
schema: 2
key: surl-keep-the-server-log-for-a-failed-run-from-an-agent
title: Keeping the Server Log for Failures
protocols: [https, ftps]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, get_events, get_exchanges]
exit-codes: [0, 1, 67]
references: [surl-readme, curl-readme, mcp-spec, rfc4217, rfc6750, rfc8446]

fixtures: {}

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: passing-run-keeps-nothing
    claim: When every test passes, curl exits 0 three times and the agent keeps nothing.
    program: keep-logs.cs
    args: []
    expect:
      exit: 0
      stdout: "https password: exit 0\nhttps token: exit 0\nftps password: exit 0\n"

  - id: solution
    role: solution
    claim: When the FTPS login is refused, the curl tool answers exit 67 as a tool error, and the agent keeps the server's events and exchanges in ci-logs and exits 1; the exchanges it was given hold the password.
    program: keep-logs.cs
    args: [guess]
    expect:
      exit: 1
      stdout: "https password: exit 0\nhttps token: exit 0\nftps password: exit 67\nrecorded exchanges hold the password: True\nkept ci-logs/events.json, ci-logs/exchanges.txt\n"
      files:
        ci-logs/events.json: null
        ci-logs/exchanges.txt: null

  - id: no-log-file
    claim: start_server refuses --log-file as a tool error, since a log file belongs to whoever runs the host.
    program: keep-logs.cs
    args: [log-file]
    expect:
      exit: 1
      stdout-matches: '^tool error: True: --log-file, --trace and --trace-ascii belong to a host'

  - id: events-say-why
    claim: The kept events hold one login_judged event per login, with its scheme, account and mechanism and whether it was accepted; the last is the refused FTPS login as app.
    run: grep -o "\"kind\":\"login_judged\",\"exchange_id\":[0-9]*,\"scheme\":\"[a-z]*\",\"account\":\"[a-z ]*\",\"mechanism\":\"[A-Za-z]*\",\"is_accepted\":[a-z]*" ci-logs/events.json
    expect:
      exit: 0
      stdout-matches: '"scheme":"https","account":"app","mechanism":"Basic","is_accepted":true\n.*"scheme":"ftps","account":"app","mechanism":"password","is_accepted":false\n$'

  - id: exchanges-keep-replies
    claim: The kept exchanges still hold what the server sent, here the 530 reply that refused the login.
    run: grep -c "> 530 Login incorrect" ci-logs/exchanges.txt
    expect:
      exit: 0
      stdout: "1\n"

  - id: kept-holds-no-secret
    claim: Neither kept file holds a password or the token.
    run: grep -c -e s3cret -e guess -e tok-7f3a9c ci-logs/events.json ci-logs/exchanges.txt
    expect:
      exit: 1
      stdout: "ci-logs/events.json:0\nci-logs/exchanges.txt:0\n"
