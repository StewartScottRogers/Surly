# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs rerun.cs, a C# program on the official MCP SDK that starts both hosts from
# PATH; its arguments pick the run.
schema: 2
key: surl-repeat-a-failure-with-a-fixed-seed-from-an-agent
title: Repeating a Failure with a Fixed Seed
protocols: [s3, http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, read_file]
exit-codes: [0, 1, 2]
references: [surl-readme, curl-readme, mcp-spec, aws-s3-api]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Rerun with the seed a failed run printed, 3 here, the upload draws the same ID, 5639b40740dd9a241e86ed60a3306b6a, the stand-in bug fails on it, read_file finds no big.bin, and the run exits 1.
    program: rerun.cs
    args: ["3"]
    expect:
      exit: 1
      stdout: "seed=3\nupload 5639b40740dd9a241e86ed60a3306b6a\nfailed: upload 5639b40740dd9a241e86ed60a3306b6a cannot be named\nserver holds no big.bin\n"

  - id: again
    claim: A second rerun with seed 3 draws that ID once more, the ID surl draws for seed 3 on the console and in-process too.
    program: rerun.cs
    args: ["3"]
    expect:
      exit: 1
      stdout-matches: '^seed=3\nupload 5639b40740dd9a241e86ed60a3306b6a\n'

  - id: other-seed
    claim: Seed 1 draws a3f0bca96a94bddcbbdee7353d87db57, which the bug lets through; the upload completes, read_file shows big.bin with its one part, and the run exits 0.
    program: rerun.cs
    args: ["1"]
    expect:
      exit: 0
      stdout: "seed=1\nupload a3f0bca96a94bddcbbdee7353d87db57\nstored big.bin\nserver holds big.bin: part one\n"

  - id: order-matters
    claim: The IDs follow the order of connections as well as the seed, so seed 3 after one more curl call first, a readiness check, draws bb73347a1372eccb4997db86ac06e8c4 for the upload and the failure is gone.
    program: rerun.cs
    args: ["3", "probe"]
    expect:
      exit: 0
      stdout-matches: '^seed=3\nupload bb73347a1372eccb4997db86ac06e8c4\nstored big.bin\n'

  - id: nonces-never-seeded
    claim: Two HTTP servers started with --random-seed 3 and one account still send different Digest nonces, because surl never draws a nonce, key, challenge, salt or token from the seed.
    program: rerun.cs
    args: [nonces]
    expect:
      exit: 0
      stdout: "same seed, same nonce: False\n"

  - id: bad-seed
    claim: A seed that is not a whole number is a start_server tool error carrying surl's exit code 2 and its message.
    program: rerun.cs
    args: [bad-seed]
    expect:
      exit: 2
      stdout: "tool error True: exit_code 2, option --random-seed: expected a proper numerical parameter\n"
