# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-stop-servers-cleanly-in-teardown
title: Stopping Servers Cleanly in Teardown
protocols: [http, ftp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, SurlExitCode, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 45]
references: [surl-readme, curl-readme, rfc9110, rfc959]

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The test fetches over HTTP (200) and then throws CurlException LoginDenied (67) over FTP; the teardown in finally disposes the client and stops both servers, each StopAsync returning Ok in under 3 seconds, and a next run binds HTTP and FTP on the very same ports.
    program: teardown.cs
    args: []
    expect:
      exit: 0
      stdout: "http: 200\nthe test threw: CurlException LoginDenied (67)\nteardown: Ok, Ok, under 3 s\nnext run bound http on the same port\nnext run bound ftp on the same port\n"

  - id: no-teardown
    claim: Without the teardown the servers outlive the test, and the next run asking for the same port fails to start with SurlServerStartException BindFailed (45).
    program: teardown.cs
    args: [no-teardown]
    expect:
      exit: 45
      stdout: "http: 200\nthe test threw: CurlException LoginDenied (67)\nnext run refused: BindFailed (45)\n"

  - id: clients-last
    claim: Stopping the servers while the client still holds its kept-alive HTTP connection still ends in Ok and frees the ports, but the teardown takes more than 3 seconds.
    program: teardown.cs
    args: [clients-last]
    expect:
      exit: 0
      stdout: "http: 200\nthe test threw: CurlException LoginDenied (67)\nteardown: Ok, Ok, over 3 s\nnext run bound http on the same port\nnext run bound ftp on the same port\n"
