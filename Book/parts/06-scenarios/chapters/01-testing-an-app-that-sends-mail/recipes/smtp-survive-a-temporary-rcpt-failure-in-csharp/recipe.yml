# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-survive-a-temporary-rcpt-failure-in-csharp
title: Surviving a Temporary RCPT Failure in C#
protocols: [smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, SurlFaultRule, SurlEventQuery, SurlMailboxInfo]
exit-codes: [0, 1]
references: [surl-readme, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The first RCPT is answered 451, which SmtpClient throws as an SmtpException; the sender waits a second and tries again, the second try is accepted, the rule is spent, it acted once, and ann has exactly one message.
    program: retry-send.cs
    args: []
    timeout: 90
    expect:
      exit: 0
      stdout: "try 1: SmtpException, 451 LocalErrorInProcessing: Error in processing. The server response was: 4.3.0 try later\ntry 2: sent\nrule f1 remaining: 0\nfault applied: 1\nmessages for ann: 1\n"

  - id: no-retry
    claim: A sender that gives up on the first refusal leaves ann with no message, and the test exits 1.
    program: retry-send.cs
    args: [no-retry]
    expect:
      exit: 1
      stdout: "try 1: SmtpException, 451 LocalErrorInProcessing: Error in processing. The server response was: 4.3.0 try later\nrule f1 remaining: 0\nfault applied: 1\nmessages for ann: 0\n"

  - id: permanent-is-not-retried
    claim: A 550 comes as an SmtpFailedRecipientException; the sender does not retry it, the rule (which has no limit) acted once, and ann has no message.
    program: retry-send.cs
    args: [permanent]
    expect:
      exit: 1
      stdout: "try 1: SmtpFailedRecipientException, 550 MailboxUnavailable: Mailbox unavailable. The server response was: 5.1.1 mailbox unavailable\nrule f1 remaining: no limit\nfault applied: 1\nmessages for ann: 0\n"

  - id: smtpclient-needs-plaintext
    claim: Without AllowPlaintextAuthentication, SmtpClient cannot log in, MAIL is refused 530 before any RCPT, and the rule is never reached.
    program: retry-send.cs
    args: [no-plaintext]
    expect:
      exit: 1
      stdout: "try 1: SmtpException, 530 MustIssueStartTlsFirst: The SMTP server requires a secure connection or the client was not authenticated. The server response was: 5.7.0 Authentication required\nrule f1 remaining: 1\nfault applied: 0\nmessages for ann: 0\n"
