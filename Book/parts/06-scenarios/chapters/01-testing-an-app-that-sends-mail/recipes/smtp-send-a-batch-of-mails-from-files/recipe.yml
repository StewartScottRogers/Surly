# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: smtp-send-a-batch-of-mails-from-files
title: Sending a Batch of Mails from Files
protocols: [smtp, imap]
tier: scenarios
surl-options: [--mail-domain, --mailbox]
curl-options: [-s, -S, --crlf, -u, --mail-from, --mail-rcpt, -T, -w, --next, -X]
exit-codes: [0, 26]
references: [surl-readme, curl-readme, rfc5321, rfc9051]

# The test messages, one file each, with plain line feeds as an editor saves them.
fixtures:
  outbox/order-101.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 101 shipped\n\nOrder 101 is on its way.\n"
  outbox/order-102.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 102 shipped\n\nOrder 102 is on its way.\n"
  outbox/order-103.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 103 shipped\n\nOrder 103 is on its way.\n"

servers:
  main:
    command: surl --mail-domain example.com --mailbox shop@example.com:shoppass --mailbox ann@example.com:annpass smtp://127.0.0.1:{{port}}/ imap://127.0.0.1:{{port2}}/
    ready: port

# The cases run in order against the same server.
cases:
  - id: solution
    role: solution
    claim: One curl sends the three files as three mails over one SMTP connection, each answered 250, and an IMAP STATUS then counts 3 messages in ann's INBOX.
    run: 'curl -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T "outbox/order-[101-103].eml" -w "%{response_code} %{num_connects}\n" smtp://127.0.0.1:{{port}}/example.com --next -u ann@example.com:annpass -X "STATUS INBOX (MESSAGES)" imap://127.0.0.1:{{port2}}/'
    expect:
      exit: 0
      stdout: "250 1\n250 0\n250 0\n* STATUS INBOX (MESSAGES 3)\n"

  - id: each-subject-in-order
    claim: A UID range in the IMAP URL fetches the Subject field of messages 1 to 3, which are the three files in the order they were sent.
    run: 'curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX;UID=[1-3];SECTION=HEADER.FIELDS%20(SUBJECT)"'
    expect:
      exit: 0
      stdout: "Subject: Order 101 shipped\n\nSubject: Order 102 shipped\n\nSubject: Order 103 shipped\n\n"

  - id: search-the-batch
    claim: An IMAP SEARCH for the subject text the batch shares answers all three UIDs.
    run: 'curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX?SUBJECT%20shipped"'
    expect:
      exit: 0
      stdout: "* SEARCH 1 2 3\n"

  - id: missing-file-stops-the-batch
    claim: In a list of files where one is missing, curl sends the files before it, stops at the missing one with exit 26, and never sends the files after it.
    run: 'curl -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T "outbox/order-{103,104,102}.eml" -w "%{response_code}\n" smtp://127.0.0.1:{{port}}/example.com'
    expect:
      exit: 26
      stdout: "250\n000\n"
      stderr-contains: "curl: (26) Failed to open/read local data from file/application"

  - id: count-after-the-failure
    claim: After that run ann's INBOX holds 4 messages, not 6; the one new message is a second Order 103, and Order 102 was not sent again.
    run: 'curl -sS -u ann@example.com:annpass imap://127.0.0.1:{{port2}}/ -X "STATUS INBOX (MESSAGES)" --next -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX?SUBJECT%20%22Order%20102%22"'
    expect:
      exit: 0
      stdout: "* STATUS INBOX (MESSAGES 4)\n* SEARCH 2\n"
