# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-catch-every-address-in-one-mailbox-in-csharp
title: Catching Every Address in One Mailbox
protocols: [smtp, pop3]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlMailboxInfo, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions]
exit-codes: [0, 1]
references: [surl-readme, rfc5321, rfc1939]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: SmtpClient mails three generated addresses no mailbox has, one message each; MailCatchAlls lands all three in the catch-all, whose POP3 list and store both count three, and the program exits 0.
    program: catch-all.cs
    args: []
    expect:
      exit: 0
      stdout: "mailed 3 addresses\ncaught over POP3: 3\ncaught in the store: 3\n"

  - id: one-message-counts-once
    claim: One message to the same three addresses is stored in the catch-all once, so the count is 1 and the program exits 1.
    program: catch-all.cs
    args: [one-message]
    expect:
      exit: 1
      stdout: "mailed 3 addresses\ncaught over POP3: 1\ncaught in the store: 1\n"

  - id: no-catch-all
    claim: Without MailCatchAlls the three mails are accepted, SmtpClient reports nothing, and they are discarded, so the count is 0.
    program: catch-all.cs
    args: [no-catch-all]
    expect:
      exit: 1
      stdout: "mailed 3 addresses\ncaught over POP3: 0\ncaught in the store: 0\n"

  - id: other-domain
    claim: An address outside MailDomains is not caught but refused 5.7.1 Relaying denied, and SmtpClient throws SmtpFailedRecipientException naming it.
    program: catch-all.cs
    args: [other-domain]
    expect:
      exit: 1
      stdout: "refused <user-1@example.org>: Mailbox unavailable. The server response was: 5.7.1 Relaying denied\n"
