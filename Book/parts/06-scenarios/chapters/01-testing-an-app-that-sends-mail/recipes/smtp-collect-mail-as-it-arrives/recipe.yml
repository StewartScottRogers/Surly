# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-collect-mail-as-it-arrives
title: Collecting Mail as It Arrives
protocols: [smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlEventKind, StoreKind, StoreChangedEvent, StoreChange, SurlServerMail, SurlMailMessage, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlContent, CurlAuthenticationOptions]
exit-codes: [0, 1]
references: [surl-readme, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.
cases:
  - id: solution
    role: solution
    claim: A callback registered with OnEvent for mail store changes reads each delivered message as it arrives; after the app sends three confirmations, to ann, bob and ann, the list holds all three in delivery order with each owner, mailbox, UID and Subject, and the program exits 0.
    program: collect-mail.cs
    args: []
    expect:
      exit: 0
      stdout: "app sent to ann@example.com: SMTP 250\napp sent to bob@example.com: SMTP 250\napp sent to ann@example.com: SMTP 250\ncollected 3 of 3:\n  ann@example.com INBOX UID 1: Subject: Order 1001 confirmed\n  bob@example.com INBOX UID 1: Subject: Order 1002 confirmed\n  ann@example.com INBOX UID 2: Subject: Order 1003 confirmed\n"

  - id: alias
    claim: One mail to an alias for ann and bob is two deliveries, so the callback runs twice and the list holds one entry per mailbox.
    program: collect-mail.cs
    args: [alias]
    expect:
      exit: 0
      stdout: "app sent to team@example.com: SMTP 250\ncollected 2 of 2:\n  ann@example.com INBOX UID 1: Subject: Stock count on Friday\n  bob@example.com INBOX UID 1: Subject: Stock count on Friday\n"

  - id: unknown
    claim: Mail to an address in the domain with no mailbox is accepted 250 and discarded; no delivery event comes, the list stays empty, and the test's two-second wait ends with 0 of 1 and exit 1.
    program: collect-mail.cs
    args: [unknown]
    expect:
      exit: 1
      stdout: "app sent to nobody@example.com: SMTP 250\ncollected 0 of 1 within 2 s:\n"
