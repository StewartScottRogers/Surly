# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: smtp-wait-for-mail-on-a-fake-clock
title: Waiting for Mail on a Fake Clock
protocols: [smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlEventKind, SurlServerMail]
exit-codes: [0, 1]
references: [surl-readme, rfc5321]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A wait for mail to ann on a server built with the test's own TimeProvider ends with a Delivered change as soon as the app's mail arrives, and the fake clock has not moved.
    program: program.cs
    args: []
    timeout: 90
    expect:
      exit: 0
      stdout: "mail for ann: Delivered\nfake time spent waiting: 0 s\n"

  - id: missing-mail
    claim: When no mail comes the wait stays open while the clock stands still and at 29 seconds of fake time, ends with a TimeoutException at 30, and all of it takes well under ten real seconds.
    program: program.cs
    args: [missing]
    timeout: 90
    expect:
      exit: 1
      stdout: "after 0 s of fake time: waiting\nafter 29 s of fake time: waiting\nafter 30 s of fake time: TimeoutException\nreal time spent: under ten seconds: True\n"

  - id: wrong-recipient
    claim: Mail the app sends to bob is delivered but does not end the wait for ann, which times out at 30 seconds of fake time, and bob's inbox holds the one message.
    program: program.cs
    args: [wrong-recipient]
    timeout: 90
    expect:
      exit: 1
      stdout: "after 0 s of fake time: waiting\nafter 29 s of fake time: waiting\nafter 30 s of fake time: TimeoutException\nreal time spent: under ten seconds: True\nbob's inbox: 1 message\n"

  - id: password-refused
    claim: Without AllowPlaintextAuthentication the app's password is refused (SmtpClient reports MustIssueStartTlsFirst), no mail is delivered, and the wait times out like any other missing mail.
    program: program.cs
    args: [no-plaintext]
    timeout: 90
    expect:
      exit: 1
      stdout: "app could not send: MustIssueStartTlsFirst\nafter 0 s of fake time: waiting\nafter 29 s of fake time: waiting\nafter 30 s of fake time: TimeoutException\nreal time spent: under ten seconds: True\n"
