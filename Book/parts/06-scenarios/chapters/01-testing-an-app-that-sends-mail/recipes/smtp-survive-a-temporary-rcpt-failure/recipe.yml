# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: smtp-survive-a-temporary-rcpt-failure
title: Surviving a Temporary RCPT Failure
protocols: [smtp, imap]
tier: scenarios
surl-options: [--mail-domain, --mailbox, --fault, -v, --log-file]
curl-options: [--crlf, -u, --mail-from, --mail-rcpt, -T, -s, -w, -X, --retry, --retry-all-errors, --retry-delay, --no-progress-meter]
exit-codes: [0, 55]
references: [surl-readme, curl-manual, rfc5321, rfc9051]

# order.eml is the mail the app sends. send-retrying.sh stands in for the app's sender: it retries
# a temporary (4xx) refusal and gives up on a permanent (5xx) one.
fixtures:
  order.eml: "From: app@example.com\nTo: ann@example.com\nSubject: Order 1042 has shipped\n\nYour order is on its way.\n"
  send-retrying.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Sends one message with curl, retrying only a temporary (4xx) refusal, at most <tries> tries in all.
    # Usage: sh send-retrying.sh <tries> <curl arguments...>
    tries=$1
    shift
    while :; do
      code=$(curl -s -w "%{response_code}" "$@")
      status=$?
      if [ "$status" -eq 0 ]; then
        echo "sent: $code"
        exit 0
      fi
      tries=$((tries - 1))
      case $code in
        4??)
          if [ "$tries" -gt 0 ]; then
            echo "temporary: $code, retrying"
            sleep 1
            continue
          fi ;;
      esac
      echo "gave up: $code"
      exit "$status"
    done

# Each server answers the first RCPT 451 (times=1) and accepts every one after it, except
# permanent, which answers every RCPT 550. The rule acts on the RCPT command, so the readiness
# check, which connects and sends nothing, does not spend it.
servers:
  main:
    command: surl -v --log-file surl.log --mail-domain example.com --mailbox app@example.com:apppass --mailbox ann@example.com:annpass --fault "error;scheme=smtp;command=RCPT;reply=451 4.3.0 try later;times=1" smtp://127.0.0.1:{{port}}/ imap://127.0.0.1:{{port2}}/
    ready: port
  curlretry:
    command: surl --mail-domain example.com --mailbox app@example.com:apppass --mailbox ann@example.com:annpass --fault "error;scheme=smtp;command=RCPT;reply=451 4.3.0 try later;times=1" smtp://127.0.0.1:{{port3}}/ imap://127.0.0.1:{{port4}}/
    ready: port
  plain:
    command: surl --mail-domain example.com --mailbox app@example.com:apppass --mailbox ann@example.com:annpass --fault "error;scheme=smtp;command=RCPT;reply=451 4.3.0 try later;times=1" smtp://127.0.0.1:{{port5}}/ imap://127.0.0.1:{{port6}}/
    ready: port
  permanent:
    command: surl --mail-domain example.com --mailbox app@example.com:apppass --mailbox ann@example.com:annpass --fault "error;scheme=smtp;command=RCPT;reply=550 5.1.1 mailbox unavailable" smtp://127.0.0.1:{{port7}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The first RCPT is answered 451; send-retrying.sh waits a second, sends again and gets 250, and ann's INBOX then holds exactly one message.
    run: 'sh send-retrying.sh 3 --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt ann@example.com -T order.eml smtp://127.0.0.1:{{port}}/example.com && curl -s -u ann@example.com:annpass -X "STATUS INBOX (MESSAGES)" imap://127.0.0.1:{{port2}}/'
    timeout: 30
    expect:
      exit: 0
      stdout: "temporary: 451, retrying\nsent: 250\n* STATUS INBOX (MESSAGES 1)\n"

  - id: log-one-refusal
    claim: The server's log records the one RCPT that fault rule f1 answered, and that nothing was stored for it.
    run: 'grep -c "RCPT answered with the chosen error of fault rule f1; nothing was stored." surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: log-one-stored
    claim: The same log records exactly one message stored.
    run: 'grep -c "Message stored: " surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: retry-alone-does-not-retry
    claim: curl's --retry alone does not count an SMTP 451 as transient; it makes no retry, exits 55 and reports the 451.
    run: curl -s --retry 3 --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt ann@example.com -T order.eml -w "%{response_code} %{num_retries}\n" smtp://127.0.0.1:{{port5}}/example.com
    expect:
      exit: 55
      stdout: "451 0\n"

  - id: refused-is-not-stored
    claim: A message whose RCPT was refused is not stored; ann's INBOX on that server holds none.
    run: 'curl -s -u ann@example.com:annpass -X "STATUS INBOX (MESSAGES)" imap://127.0.0.1:{{port6}}/'
    expect:
      exit: 0
      stdout: "* STATUS INBOX (MESSAGES 0)\n"

  - id: curl-retry-all-errors
    claim: With --retry-all-errors curl does retry the 451, after the --retry-delay second, and exits 0 with one retry counted.
    run: curl --no-progress-meter --retry 1 --retry-all-errors --retry-delay 1 --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt ann@example.com -T order.eml -w "%{response_code} %{num_retries}\n" smtp://127.0.0.1:{{port3}}/example.com
    timeout: 30
    expect:
      exit: 0
      stdout: "250 1\n"
      stderr-contains: "curl: (55) RCPT failed: 451\nWarning: Problem (retrying all errors). Retrying in 1 second. 1 retry left.\n"

  - id: curl-retry-one-copy
    claim: That retry also leaves exactly one message in ann's INBOX.
    run: 'curl -s -u ann@example.com:annpass -X "STATUS INBOX (MESSAGES)" imap://127.0.0.1:{{port4}}/'
    expect:
      exit: 0
      stdout: "* STATUS INBOX (MESSAGES 1)\n"

  - id: retry-all-errors-retries-550
    claim: --retry-all-errors cannot tell a temporary refusal from a permanent one; it retries a 550 too, and exits 55 after its two retries.
    run: curl -s --retry 2 --retry-all-errors --retry-delay 1 --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt ann@example.com -T order.eml -w "%{response_code} %{num_retries}\n" smtp://127.0.0.1:{{port7}}/example.com
    timeout: 30
    expect:
      exit: 55
      stdout: "550 2\n"

  - id: script-gives-up-on-550
    claim: send-retrying.sh gives up on a 550 at once, with curl's exit code 55, and does not try again.
    run: sh send-retrying.sh 3 --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt ann@example.com -T order.eml smtp://127.0.0.1:{{port7}}/example.com
    timeout: 30
    expect:
      exit: 55
      stdout: "gave up: 550\n"
