# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs reset-link.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-test-a-password-reset-mail-from-an-agent
title: Testing a Password Reset Mail
protocols: [smtp, imap, http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, put_file, curl, transfer]
curl-options: [-s, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc5321, rfc9051, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The app publishes its reset page with put_file and mails the link through the curl tool; the test reads the mail's body over IMAP, finds the link, and transfer fetches it with no login, status 200 and the page.
    program: reset-link.cs
    args: [right]
    expect:
      exit: 0
      stdout-matches: '^app sent: curl exit 0\nlink: http://127\.0\.0\.1:\d+/reset/[0-9a-f]{16}\n200: Choose a new password for ann@example\.com\.\n$'

  - id: wrong-token
    claim: A link whose token the app never published is answered 404, and the test fails, exit 1.
    program: reset-link.cs
    args: [wrong-token]
    expect:
      exit: 1
      stdout-matches: '^app sent: curl exit 0\nlink: http://127\.0\.0\.1:\d+/reset/0000000000000000\nFAIL: the link answered 404\n$'

  - id: no-link
    claim: A reset mail with no link in it fails the test before any fetch, exit 1.
    program: reset-link.cs
    args: [no-link]
    expect:
      exit: 1
      stdout: "app sent: curl exit 0\nFAIL: no reset link in the mail\n"
