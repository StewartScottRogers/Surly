# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-check-a-mail-attachment-in-csharp
title: Checking a Mail's Attachment in C#
protocols: [smtp, imap]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions]
exit-codes: [0, 1]
references: [surl-readme, rfc9051, rfc2195]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.
cases:
  - id: solution
    role: solution
    claim: The app attaches report.csv with SmtpClient; part 2 of ann's UID 1 is text/csv named report.csv, and its body, decoded from base64, is report.csv's 85 bytes; the program exits 0.
    program: check-attachment.cs
    args: []
    expect:
      exit: 0
      stdout: "Content-Type: text/csv; name=report.csv\nattachment matches report.csv, 85 bytes\n"

  - id: old-report
    claim: An older report is delivered like any attachment; decoded, it is 69 bytes and differs from report.csv, and the program exits 1.
    program: check-attachment.cs
    args: [old-report]
    expect:
      exit: 1
      stdout: "Content-Type: text/csv; name=report.csv\nFAIL: attachment is 69 bytes and differs from report.csv, 85 bytes\n"

  - id: no-attachment
    claim: For mail with no attachment, Curl.Api's fetches of SECTION=2.MIME and SECTION=2 succeed with empty bodies, so the program checks for an empty part and exits 1.
    program: check-attachment.cs
    args: [no-attachment]
    expect:
      exit: 1
      stdout: "no part 2\nFAIL: no attachment\n"

  - id: smtpclient-needs-plaintext
    claim: Without AllowPlaintextAuthentication the server offers only CRAM-MD5, which SmtpClient cannot use, so MAIL is refused 5.7.0 Authentication required and nothing is sent.
    program: check-attachment.cs
    args: [no-plaintext]
    expect:
      exit: 1
      stdout: "app could not send: MustIssueStartTlsFirst: The SMTP server requires a secure connection or the client was not authenticated. The server response was: 5.7.0 Authentication required\n"
