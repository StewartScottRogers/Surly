# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs check-attachment.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-check-a-mail-attachment-from-an-agent
title: Checking a Mail's Attachment from an Agent
protocols: [smtp, imap]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, read_message]
curl-options: [-s, --crlf, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0, 1]
references: [surl-readme, curl-manual, rfc5321, rfc9051]

# report.csv is the report the app attaches. report-mail.eml is the mail it should send, with
# report.csv in base64 as its second part; old-report-mail.eml attaches last week's report, and
# no-attachment.eml forgets it.
fixtures:
  report.csv: "date,builds,failures\n2026-11-17,44,2\n2026-11-18,41,0\n2026-11-19,42,3\n2026-11-20,40,1\n"
  report-mail.eml: |
    From: app@example.com
    To: ann@example.com
    Subject: Nightly build report
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="report-boundary"

    --report-boundary
    Content-Type: text/plain; charset=us-ascii

    The nightly build report is attached.
    --report-boundary
    Content-Type: text/csv; name="report.csv"
    Content-Disposition: attachment; filename="report.csv"
    Content-Transfer-Encoding: base64

    ZGF0ZSxidWlsZHMsZmFpbHVyZXMKMjAyNi0xMS0xNyw0NCwyCjIwMjYtMTEtMTgsNDEsMAoyMDI2
    LTExLTE5LDQyLDMKMjAyNi0xMS0yMCw0MCwxCg==
    --report-boundary--
  old-report-mail.eml: |
    From: app@example.com
    To: ann@example.com
    Subject: Nightly build report
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="report-boundary"

    --report-boundary
    Content-Type: text/plain; charset=us-ascii

    The nightly build report is attached.
    --report-boundary
    Content-Type: text/csv; name="report.csv"
    Content-Disposition: attachment; filename="report.csv"
    Content-Transfer-Encoding: base64

    ZGF0ZSxidWlsZHMsZmFpbHVyZXMKMjAyNi0xMS0xNyw0NCwyCjIwMjYtMTEtMTgsNDEsMAoyMDI2
    LTExLTE5LDQyLDMK
    --report-boundary--
  no-attachment.eml: |
    From: app@example.com
    To: ann@example.com
    Subject: Nightly build report

    The nightly build report is attached.

cases:
  - id: solution
    role: solution
    claim: The curl tool sends report-mail.eml as the app; read_message shows the stored attachment header, the curl tool fetches part 2 of ann's UID 1, and decoded from base64 it is report.csv's 85 bytes; the program exits 0.
    program: check-attachment.cs
    args: [right]
    expect:
      exit: 0
      stdout: "app sent report-mail.eml: curl exit 0\nread_message: Content-Disposition: attachment; filename=\"report.csv\"\nfetch part 2: curl exit 0, 118 characters\nPASS: attachment matches report.csv, 85 bytes\n"

  - id: old-report
    claim: Last week's report is delivered like any attachment; decoded, it is 69 bytes, not report.csv's 85, and the program exits 1.
    program: check-attachment.cs
    args: [old-report]
    expect:
      exit: 1
      stdout: "app sent old-report-mail.eml: curl exit 0\nread_message: Content-Disposition: attachment; filename=\"report.csv\"\nfetch part 2: curl exit 0, 94 characters\nFAIL: attachment is 69 bytes, report.csv 85\n"

  - id: no-attachment
    claim: For mail with no attachment, the stored message has no Content-Disposition and fetching part 2 exits 0 with nothing, so the program checks for an empty part and exits 1.
    program: check-attachment.cs
    args: [no-attachment]
    expect:
      exit: 1
      stdout: "app sent no-attachment.eml: curl exit 0\nread_message: no Content-Disposition\nfetch part 2: curl exit 0, 0 characters\nFAIL: no attachment\n"
