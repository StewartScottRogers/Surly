# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-check-the-mail-an-app-sent-in-csharp
title: Checking the Mail an App Sent
protocols: [smtp, imap]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 1]
references: [surl-readme, rfc5321, rfc9051]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The app sends its sign-up mail with SmtpClient; the test fetches From, To and Subject of ann's UID 1 over IMAP with Curl.Api, all three are as expected, and the program exits 0.
    program: check-signup.cs
    args: []
    expect:
      exit: 0
      stdout: "From: app@example.com\nTo: ann@example.com\nSubject: Welcome to Example\n"

  - id: wrong-subject
    claim: A misspelt subject is delivered, and the test names the field, what arrived and what it wanted, and exits 1.
    program: check-signup.cs
    args: [wrong-subject]
    expect:
      exit: 1
      stdout: "From: app@example.com\nTo: ann@example.com\nFAIL: Subject is Welcome to Exmaple, want Welcome to Example\n"

  - id: wrong-sender
    claim: A sender outside the domain is accepted from a logged-in app, so the test catches it by the From field and exits 1.
    program: check-signup.cs
    args: [wrong-sender]
    expect:
      exit: 1
      stdout: "FAIL: From is noreply@example.org, want app@example.com\nTo: ann@example.com\nSubject: Welcome to Example\n"

  - id: wrong-recipient
    claim: Mail to a mistyped address in the domain is accepted and discarded, so the app sees no error; the fetch for ann throws CurlException 78 and the test exits 1.
    program: check-signup.cs
    args: [wrong-recipient]
    expect:
      exit: 1
      stdout: "FAIL: no mail for ann@example.com (curl error 78: Remote file not found)\n"

  - id: smtpclient-needs-plaintext
    claim: Without AllowPlaintextAuthentication the server offers only CRAM-MD5, which SmtpClient cannot use, so SmtpClient sends no login and MAIL is refused 5.7.0 Authentication required.
    program: check-signup.cs
    args: [no-plaintext]
    expect:
      exit: 1
      stdout: "app could not send: MustIssueStartTlsFirst: The SMTP server requires a secure connection or the client was not authenticated. The server response was: 5.7.0 Authentication required\n"
