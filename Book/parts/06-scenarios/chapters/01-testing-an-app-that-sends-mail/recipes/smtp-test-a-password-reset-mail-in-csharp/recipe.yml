# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-test-a-password-reset-mail-in-csharp
title: Testing a Password Reset Mail in C#
protocols: [smtp, imap, http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions, CurlContent]
exit-codes: [0, 1]
references: [surl-readme, rfc5321, rfc9051, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The app publishes a reset page under a fresh token and mails the link with Curl.Api; the test reads the mail's body over IMAP, finds the link, and fetching it with no login returns 200 and the page, exit 0.
    program: reset-link.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^app sent: SMTP 250\nlink: http://127\.0\.0\.1:\d+/reset/[0-9a-f]{16}\n200 OK: Choose a new password for ann@example\.com\.\n$'

  - id: wrong-token
    claim: A link whose token the app never published is answered 404 Not Found, and the test fails, exit 1.
    program: reset-link.cs
    args: [wrong-token]
    expect:
      exit: 1
      stdout-matches: '^app sent: SMTP 250\nlink: http://127\.0\.0\.1:\d+/reset/0000000000000000\nFAIL: the link answered 404 Not Found\n$'

  - id: no-link
    claim: A reset mail with no link in it fails the test before any fetch, exit 1.
    program: reset-link.cs
    args: [no-link]
    expect:
      exit: 1
      stdout: "app sent: SMTP 250\nFAIL: no reset link in the mail\n"
