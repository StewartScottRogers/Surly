# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: smtp-catch-every-address-in-one-mailbox
title: Catching Every Address in One Mailbox
protocols: [smtp, pop3]
tier: scenarios
surl-options: [--mail-domain, --mailbox, --mail-catch-all]
curl-options: [--crlf, -u, --mail-from, --mail-rcpt, -T, --next, -X, -v, -s, -S]
exit-codes: [0, 2, 55]
references: [surl-readme, curl-readme, rfc5321, rfc1939]

fixtures:
  invite.eml: "From: app@example.com\nSubject: You are invited\n\nFollow the link to join.\n"

# main has the catch-all; plain is the same server without it, there for the claims only.
servers:
  main:
    command: surl --mail-domain example.com --mailbox app@example.com:apppass --mailbox catchall@example.com:catchpass --mail-catch-all example.com=catchall@example.com smtp://127.0.0.1:{{port}}/ pop3://127.0.0.1:{{port2}}/
    ready: port
  plain:
    command: surl --mail-domain example.com --mailbox app@example.com:apppass --mailbox catchall@example.com:catchpass smtp://127.0.0.1:{{port3}}/ pop3://127.0.0.1:{{port4}}/
    ready: port

# The cases run in order against the same servers.
cases:
  - id: solution
    role: solution
    claim: Mail to two generated addresses no mailbox has, user-1 and user-2 at example.com, both land in the catch-all mailbox, whose POP3 list then shows two messages.
    run: curl --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt user-1@example.com -T invite.eml smtp://127.0.0.1:{{port}}/example.com --next --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt user-2@example.com -T invite.eml smtp://127.0.0.1:{{port}}/example.com --next -u catchall@example.com:catchpass pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \d+\n2 \d+\n$'

  - id: count-with-stat
    claim: -X STAT answers the count and total size in one line, +OK 2 and the octets, which -v shows on standard error.
    run: curl -s -v -u catchall@example.com:catchpass -X STAT pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stderr-contains: "< +OK 2 "

  - id: one-message-many-addresses
    claim: One message sent to two more unknown addresses at once is stored in the catch-all once, not once per address; the list now shows three.
    run: curl --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt user-3@example.com --mail-rcpt user-4@example.com -T invite.eml smtp://127.0.0.1:{{port}}/example.com --next -u catchall@example.com:catchpass pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \d+\n2 \d+\n3 \d+\n$'

  - id: real-mailbox-not-caught
    claim: Mail to an address that has a mailbox goes to that mailbox, not the catch-all, which still lists three.
    run: curl --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt app@example.com -T invite.eml smtp://127.0.0.1:{{port}}/example.com --next -u catchall@example.com:catchpass pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \d+\n2 \d+\n3 \d+\n$'

  - id: other-domain-refused
    claim: An address outside the mail domain is not caught but refused 550, and curl exits 55.
    run: curl -s -S --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt user-5@example.org -T invite.eml smtp://127.0.0.1:{{port}}/example.com
    expect:
      exit: 55
      stderr-contains: "curl: (55) RCPT failed: 550"

  - id: without-catch-all-discarded
    claim: Without --mail-catch-all the same send is accepted, exit 0, but the mail is discarded, and STAT on the would-be catch-all answers +OK 0 0.
    run: curl -s -v --crlf -u app@example.com:apppass --mail-from app@example.com --mail-rcpt user-1@example.com -T invite.eml smtp://127.0.0.1:{{port3}}/example.com --next -u catchall@example.com:catchpass -X STAT pop3://127.0.0.1:{{port4}}/
    expect:
      exit: 0
      stderr-contains: "< +OK 0 0"

  - id: needs-mail-domain
    claim: A --mail-catch-all with no --mail-domain is refused at start with exit 2.
    run: surl --mail-catch-all example.com=catchall@example.com smtp://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: option --mail-catch-all: catch-all domain example\.com needs --mail-domain\n'

  - id: target-must-be-a-mailbox
    claim: A catch-all whose address has no mailbox would catch its own mail, and is refused at start with exit 2.
    run: surl --mail-domain example.com --mail-catch-all example.com=nobody@example.com smtp://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: \(2\) option --mail-catch-all: catch-all nobody@example\.com includes itself\n'
