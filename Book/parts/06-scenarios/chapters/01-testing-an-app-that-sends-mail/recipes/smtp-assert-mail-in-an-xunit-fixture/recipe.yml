# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-assert-mail-in-an-xunit-fixture
title: Asserting Mail in an xUnit Fixture
protocols: [smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerMail, SurlMessagePage, SurlMessageSummary, SurlMailMessage, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlContent, CurlAuthenticationOptions]
exit-codes: [0, 1]
references: [surl-readme, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.
cases:
  - id: solution
    role: solution
    claim: With one server for both tests and a reset before each, each sign-up test finds exactly one welcome mail in the whole store, to the address it signed up, and both pass; the program exits 0.
    program: mail-fixture.cs
    args: []
    expect:
      exit: 0
      stdout: "PASS Signup_sends_one_welcome_mail\nPASS Second_signup_sees_only_its_own_mail\n"

  - id: sends-twice
    claim: An app that sends each welcome mail twice fails both tests, and each failure lists every mail the server holds next to the one wanted.
    program: mail-fixture.cs
    args: [sends-twice]
    expect:
      exit: 1
      stdout: "FAIL Signup_sends_one_welcome_mail: the server holds [ann@example.com: Welcome to Example; ann@example.com: Welcome to Example], want [ann@example.com: Welcome to Example]\nFAIL Second_signup_sees_only_its_own_mail: the server holds [bob@example.com: Welcome to Example; bob@example.com: Welcome to Example], want [bob@example.com: Welcome to Example]\n"

  - id: no-reset
    claim: Without the reset between tests the first test's mail is still in the store, so the second test, though its app is right, fails on ann's mail.
    program: mail-fixture.cs
    args: [no-reset]
    expect:
      exit: 1
      stdout: "PASS Signup_sends_one_welcome_mail\nFAIL Second_signup_sees_only_its_own_mail: the server holds [ann@example.com: Welcome to Example; bob@example.com: Welcome to Example], want [bob@example.com: Welcome to Example]\n"
