# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-fail-a-test-on-a-wrong-recipient-in-csharp
title: Failing a Test on a Wrong Recipient
protocols: [smtp]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlMailboxInfo]
exit-codes: [0, 1]
references: [surl-readme, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With MailDomains example.com, the app's SmtpClient mailing carol@elsewhere.org throws SmtpFailedRecipientException naming her and 5.7.1 Relaying denied, so the test fails with exit 1; ann has no mail.
    program: stray-recipient.cs
    args: []
    expect:
      exit: 1
      stdout: "FAIL: refused <carol@elsewhere.org>: Mailbox unavailable. The server response was: 5.7.1 Relaying denied\nmessages for ann: 0\n"

  - id: own-domain
    claim: Mail to ann@example.com is accepted, SmtpClient throws nothing, the store holds it, and the program exits 0.
    program: stray-recipient.cs
    args: [own-domain]
    expect:
      exit: 0
      stdout: "sent to ann@example.com\nmessages for ann: 1\n"

  - id: mixed-still-delivers
    claim: One mail to ann and carol throws SmtpFailedRecipientException for carol, yet SmtpClient has sent it to ann, who has it.
    program: stray-recipient.cs
    args: [mixed]
    expect:
      exit: 1
      stdout: "FAIL: refused <carol@elsewhere.org>: Mailbox unavailable. The server response was: 5.7.1 Relaying denied\nmessages for ann: 1\n"

  - id: no-domain-passes
    claim: With no MailDomains, only an account in Accounts, the domain is ignored, so the stray address is accepted and the test wrongly passes.
    program: stray-recipient.cs
    args: [no-domain]
    expect:
      exit: 0
      stdout: "sent to carol@elsewhere.org\n"
