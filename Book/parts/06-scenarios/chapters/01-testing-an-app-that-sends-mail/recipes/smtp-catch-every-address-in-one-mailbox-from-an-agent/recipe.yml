# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs catch-all.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-catch-every-address-in-one-mailbox-from-an-agent
title: Catching Every Address in One Mailbox
protocols: [smtp, pop3]
tier: scenarios
surface: mcp
mcp-tools: [start_server, curl, list_mailboxes]
curl-options: [-s, -S, --crlf, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0, 1, 2, 55]
references: [surl-readme, curl-readme, rfc5321, rfc1939]

fixtures:
  invite.eml: "From: app@example.com\r\nSubject: You are invited\r\n\r\nFollow the link to join.\r\n"

cases:
  - id: solution
    role: solution
    claim: The agent starts a server whose --mail-catch-all sends example.com's unknown addresses to catchall@example.com, mails three generated addresses with the curl tool, and counts three over POP3 and three with list_mailboxes.
    program: catch-all.cs
    args: [catch-all]
    expect:
      exit: 0
      stdout: "sent to user-1@example.com: curl exit 0\nsent to user-2@example.com: curl exit 0\nsent to user-3@example.com: curl exit 0\ncaught over POP3: 3\nlist_mailboxes: 3 messages\n"

  - id: no-catch-all
    claim: Without --mail-catch-all the three sends still exit 0, but the mail is discarded and both counts are 0.
    program: catch-all.cs
    args: [no-catch-all]
    expect:
      exit: 1
      stdout: "sent to user-1@example.com: curl exit 0\nsent to user-2@example.com: curl exit 0\nsent to user-3@example.com: curl exit 0\ncaught over POP3: 0\nlist_mailboxes: 0 messages\n"

  - id: other-domain
    claim: An address outside the mail domain is not caught but refused 550, curl exits 55, and the catch-all stays empty.
    program: catch-all.cs
    args: [other-domain]
    expect:
      exit: 1
      stdout: "sent to user-1@example.org: curl exit 55, curl: (55) RCPT failed: 550\ncaught over POP3: 0\nlist_mailboxes: 0 messages\n"

  - id: needs-mail-domain
    claim: start_server with a --mail-catch-all and no --mail-domain is a tool error carrying surl's exit code 2, FailedInit, and its message.
    program: catch-all.cs
    args: [no-domain]
    expect:
      exit: 1
      stdout: "start_server: exit_code 2 (FailedInit), option --mail-catch-all: catch-all domain example.com needs --mail-domain\n"
