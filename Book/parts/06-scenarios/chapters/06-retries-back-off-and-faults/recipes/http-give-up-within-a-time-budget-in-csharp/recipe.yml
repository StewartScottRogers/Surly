# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
# Each case runs one scenario and prints only the lines of one label (the second argument).
# Every run makes one untimed warm-up request before the rules and the clock.
schema: 2
key: http-give-up-within-a-time-budget-in-csharp
title: Giving Up Within a Time Budget
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, FaultStage, SurlEventQuery, SurlEventKind, FaultAppliedEvent, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlException]
exit-codes: [22]
references: [surl-readme, curl-readme, curl-manual, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Against a server that holds each connection 1.5 s and answers every request 503, a loop allowed ten retries one second apart with a 5-second budget gives up after one to three retries.
    program: budget.cs
    args: ["budget", "gave up"]
    timeout: 90
    expect:
      exit: 22
      stdout-matches: "^gave up: 503 after [1-3] retries\\n$"

  - id: loop-bounded
    claim: That loop takes from 5 to under 10 seconds.
    program: budget.cs
    args: ["budget", "loop took"]
    timeout: 90
    expect:
      exit: 22
      stdout: "loop took 5 to 10 s: yes\n"

  - id: server-agrees
    claim: The server applied each of its two rules once per try, retries plus one.
    program: budget.cs
    args: ["budget", "server agrees"]
    timeout: 90
    expect:
      exit: 22
      stdout: "server agrees: yes, rules f1 f2\n"

  - id: no-budget-counts-retries
    claim: Without a budget, all three retries allowed are made.
    program: budget.cs
    args: ["no-budget", "gave up"]
    timeout: 90
    expect:
      exit: 22
      stdout: "gave up: 503 after 3 retries\n"

  - id: no-budget-takes-longer
    claim: Without a budget, four slow tries and three waits take at least nine seconds.
    program: budget.cs
    args: ["no-budget", "loop took"]
    timeout: 90
    expect:
      exit: 22
      stdout: "loop took at least 9 s: yes\n"

  - id: hanging-needs-a-timeout
    claim: Against a server that holds every request 5 s, a one-second Timeout ends each try with OperationTimedOut (28), and a 3-second budget stops the loop after one to three retries.
    program: budget.cs
    args: ["hang", "gave up"]
    timeout: 90
    expect:
      exit: 22
      stdout-matches: "^gave up: OperationTimedOut \\(28\\) after [1-3] retries\\n$"

  - id: hanging-bounded
    claim: That loop takes from 3 to under 8 seconds.
    program: budget.cs
    args: ["hang", "loop took"]
    timeout: 90
    expect:
      exit: 22
      stdout: "loop took 3 to 8 s: yes\n"

  - id: hanging-server-agrees
    claim: The server held one request per try under its one rule.
    program: budget.cs
    args: ["hang", "server agrees"]
    timeout: 90
    expect:
      exit: 22
      stdout: "server agrees: yes, rules f1\n"
