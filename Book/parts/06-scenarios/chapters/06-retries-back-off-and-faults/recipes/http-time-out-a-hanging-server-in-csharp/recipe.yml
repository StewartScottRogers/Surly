# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-time-out-a-hanging-server-in-csharp
title: Timing Out a Hanging Server in C#
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, FaultStage, SurlEventQuery, SurlEventKind, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 28]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The server holds the request ten seconds; a client whose Timeout is two seconds fails with CurlException 28, OperationTimedOut, before the hold is over, and the server counts one hold.
    program: hang.cs
    args: [timeout]
    expect:
      exit: 28
      stdout: "attempt 1: CurlException 28 (OperationTimedOut), within 10 s\nfault applied: 1\n"

  - id: connect-timeout-is-not-enough
    claim: ConnectTimeout limits only the connection, which the server accepts at once, so the client waits out the hold and gets 200 OK after ten seconds.
    program: hang.cs
    args: [connect]
    expect:
      exit: 0
      stdout: "attempt 1: 200 OK, hello from surl, after 10 s\nfault applied: 1\n"

  - id: no-limit
    claim: With no limit at all, the client waits as long as the server holds the request and gets 200 OK after ten seconds.
    program: hang.cs
    args: [none]
    expect:
      exit: 0
      stdout: "attempt 1: 200 OK, hello from surl, after 10 s\nfault applied: 1\n"

  - id: cancel
    claim: A CancellationToken cancelled after two seconds ends the call too, but with OperationCanceledException, .NET's own cancellation, not a CurlException.
    program: hang.cs
    args: [cancel]
    expect:
      exit: 28
      stdout: "attempt 1: OperationCanceledException, within 10 s\nfault applied: 1\n"

  - id: retry-after-timeout
    claim: The rule holds only the first request, so a client that retries once after the timeout gets 200 OK on its second attempt, well within ten seconds of it; the server still counts one hold.
    program: hang.cs
    args: [timeout, "1"]
    expect:
      exit: 0
      stdout: "attempt 1: CurlException 28 (OperationTimedOut), within 10 s\nattempt 2: 200 OK, hello from surl, within 10 s\nfault applied: 1\n"
