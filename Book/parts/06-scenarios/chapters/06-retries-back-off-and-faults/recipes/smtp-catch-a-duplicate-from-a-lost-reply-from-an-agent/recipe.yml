# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs lost-reply.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-catch-a-duplicate-from-a-lost-reply-from-an-agent
title: Catching a Duplicate from a Lost Reply from an Agent
protocols: [smtp, imap]
tier: scenarios
surface: mcp
mcp-tools: [start_server, add_fault, curl, get_events, get_exchanges]
curl-options: [-s, -S, --crlf, -m, -u, --mail-from, --mail-rcpt, --retry, --retry-all-errors, --retry-delay, -T, -w, -X]
exit-codes: [0, 1]
references: [surl-readme, curl-manual, rfc5321, rfc5322, rfc9051]

# The shop's order confirmation to Ann, with its own Message-ID.
fixtures:
  order.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 1042 confirmed\nMessage-ID: <order-1042@shop.example.com>\n\nThank you for order 1042.\n"

cases:
  - id: solution
    role: solution
    claim: With the next SMTP connection cut cleanly after the 320th byte the server sends, the sender with one retry ends with exit 0, reply 250 and one retry; the IMAP search finds the order's Message-ID in UIDs 1 and 2, the events show two deliveries from two exchanges, and the agent reports the duplicate, exit 1.
    program: lost-reply.cs
    args: []
    expect:
      exit: 1
      stdout: "add_fault: f1\ncurl exit 0, reply 250, retries 1\n<order-1042@shop.example.com>: UIDs 1 2\ndeliveries: 2, from 2 exchange(s)\nFAIL: the order was stored 2 times\n"

  - id: tries
    claim: In get_exchanges both exchanges had been sent 319 bytes by the end of the 354; after it the first was sent only 2, the second 250 2.0.0 Message accepted and 221 2.0.0 Bye.
    program: lost-reply.cs
    args: [tries]
    expect:
      exit: 1
      stdout-matches: '\nexchange 1: 319 bytes to the end of the 354, then 2\nexchange 2: 319 bytes to the end of the 354, then 250 2\.0\.0 Message accepted \| 221 2\.0\.0 Bye\n$'

  - id: no-retry
    claim: A sender without the retry ends with curl exit 56 and no reply, 000, yet the search finds the order once, from one delivery, and the count passes, exit 0.
    program: lost-reply.cs
    args: [no-retry]
    expect:
      exit: 0
      stdout: "add_fault: f1\ncurl exit 56, reply 000, retries 0\n<order-1042@shop.example.com>: UIDs 1\ndeliveries: 1, from 1 exchange(s)\nPASS\n"

  - id: cut-before
    claim: With the cut one byte sooner, after the 319th byte, the end of the 354, the sender ends with reply 250 after one retry, and the order is found once, from one delivery, exit 0.
    program: lost-reply.cs
    args: [cut-before]
    expect:
      exit: 0
      stdout: "add_fault: f1\ncurl exit 0, reply 250, retries 1\n<order-1042@shop.example.com>: UIDs 1\ndeliveries: 1, from 1 exchange(s)\nPASS\n"
