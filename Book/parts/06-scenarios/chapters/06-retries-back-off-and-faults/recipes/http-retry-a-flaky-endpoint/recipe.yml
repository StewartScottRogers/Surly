# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-retry-a-flaky-endpoint
title: Retrying a Flaky Endpoint
protocols: [http]
tier: scenarios
surl-options: [--directory, --fault, -v, --log-file]
curl-options: [--no-progress-meter, -s, -f, -w, --retry, --retry-delay]
exit-codes: [0, 22]
references: [surl-readme, curl-manual, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  plain/hello.txt: "hello from surl\n"
  few/hello.txt: "hello from surl\n"
  fixed/hello.txt: "hello from surl\n"

# Each server answers the first two requests for /hello.txt 503 and serves every one after them.
# The rule acts at the command stage, when a request has arrived, so the readiness check, which
# connects and sends nothing, does not spend it. One surl holds a folder at a time.
servers:
  main:
    command: surl -v --log-file surl.log --directory site --fault "error;scheme=http;reply=503;path=/hello.txt;times=2" http://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --directory plain --fault "error;scheme=http;reply=503;path=/hello.txt;times=2" http://127.0.0.1:{{port2}}/
    ready: port
  few:
    command: surl --directory few --fault "error;scheme=http;reply=503;path=/hello.txt;times=2" http://127.0.0.1:{{port3}}/
    ready: port
  fixed:
    command: surl --directory fixed --fault "error;scheme=http;reply=503;path=/hello.txt;times=2" http://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Two 503 answers and then the file; curl with --retry 3 waits one second, then two, gets the file on its third try, exits 0 and counts two retries.
    run: curl --no-progress-meter --retry 3 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port}}/hello.txt
    timeout: 30
    expect:
      exit: 0
      stdout: "hello from surl\n200 2\n"
      stderr-contains: "Warning: Problem : HTTP error. Retrying in 1 second. 3 retries left.\nWarning: Problem : HTTP error. Retrying in 2 seconds. 2 retries left.\n"

  - id: server-saw-three
    claim: The server's verbose log records three requests for /hello.txt from that one command.
    run: grep -c " < GET /hello.txt HTTP/1.1" surl.log
    expect:
      exit: 0
      stdout: "3\n"

  - id: server-answered-two
    claim: The same log records that fault rule f1 answered two of them 503 Service Unavailable; the third was served from the folder.
    run: 'grep -c "GET /hello.txt: answered 503 Service Unavailable by fault rule f1" surl.log'
    expect:
      exit: 0
      stdout: "2\n"

  - id: warns-on-start
    claim: A server with a fault rule writes a warning on start, here to its log file.
    run: 'grep -c "surl: warning: --fault: 1 fault rule(s) make this server misbehave on purpose" surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: no-retry
    claim: Without --retry, curl takes the first 503 as the answer and exits 0, with no retry.
    run: curl -s -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "503 0\n"

  - id: no-retry-fail
    claim: With -f, the second 503 is a failure, exit 22.
    run: curl -s -f -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 22
      stdout: "503 0\n"

  - id: third-is-served
    claim: The rule has times=2, so the third request, from a new command, is served.
    run: curl -s http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: not-transient
    claim: A 404 is not a status curl counts as transient, so --retry 3 makes no retry on it.
    run: curl -s --retry 3 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port2}}/missing.txt
    expect:
      exit: 0
      stdout: "404 0\n"

  - id: too-few-retries
    claim: With --retry 1 the one retry gets the second 503 too, so with -f curl gives up with exit 22 after one retry.
    run: curl -s -f --retry 1 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port3}}/hello.txt
    timeout: 30
    expect:
      exit: 22
      stdout: "503 1\n"

  - id: fixed-delay
    claim: --retry-delay 1 replaces the doubling wait with one second before every retry.
    run: curl --no-progress-meter --retry 3 --retry-delay 1 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port4}}/hello.txt
    timeout: 30
    expect:
      exit: 0
      stdout: "hello from surl\n200 2\n"
      stderr-contains: "Warning: Problem : HTTP error. Retrying in 1 second. 3 retries left.\nWarning: Problem : HTTP error. Retrying in 1 second. 2 retries left.\n"
