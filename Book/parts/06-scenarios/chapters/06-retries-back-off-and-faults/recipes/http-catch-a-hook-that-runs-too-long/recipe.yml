# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-catch-a-hook-that-runs-too-long
title: Catching a Hook That Runs Too Long
protocols: [http]
tier: scenarios
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerFaults, SurlFault, SurlFaultScope, FaultStage, FaultPoint, HookFailedEvent, HookFailure, SurlEventQuery, SurlEventKind, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: "A decision that waits 30 seconds under a 300 millisecond limit does not hold the request: it is answered 200 after at least the limit and under 20 seconds, far less than the decision's 30, and the server publishes a HookFailed event with Failure TimedOut that names the limit."
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^GET /report\.txt: 200 totals\ntook at least the limit: True; took less than 20 s: True\nTimedOut: The response override ran past its time limit of 00:00:00\.3000000\.\n$'

  - id: token-cancelled
    claim: "At the limit the server cancels the token it gave the decision, so a decision that passes it to its waits ends instead of running on."
    program: program.cs
    args: [token]
    timeout: 120
    expect:
      exit: 0
      stdout: "the decision's token was cancelled\n"

  - id: stays
    claim: "The slow override stays in the plan: a second request is also answered 200, and the server publishes a second TimedOut event, so two requests give two events."
    program: program.cs
    args: [twice]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^GET /report\.txt: 200 totals\nGET /report\.txt: 200 totals\nfailure events: 2\n$'

  - id: in-time
    claim: "A decision that is slow but finishes inside its limit is used: with a 5 second limit and a 300 millisecond decision the request is answered 503 after at least the decision's wait, and no HookFailed event is published."
    program: program.cs
    args: [in-time]
    timeout: 120
    expect:
      exit: 0
      stdout: "GET /report.txt: 503 503 Service Unavailable\ntook at least the decision's wait: True\nfailure events: 0\n"

  - id: limit-range
    claim: "HookTimeLimit is accepted from one millisecond to 30 seconds: 30 seconds starts a server, while 31 seconds and zero are refused with an ArgumentException that states the range."
    program: program.cs
    args: [range]
    timeout: 120
    expect:
      exit: 0
      stdout: "00:00:31: HookTimeLimit must be from 1 millisecond to 30 seconds. (Parameter 'options')\n00:00:00: HookTimeLimit must be from 1 millisecond to 30 seconds. (Parameter 'options')\n00:00:30: started\n"
