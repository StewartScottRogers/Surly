# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs flaky.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-retry-a-flaky-endpoint-from-an-agent
title: Retrying a Flaky Endpoint from an Agent
protocols: [http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, add_fault, curl, transfer, get_events, list_faults]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, curl-manual, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: With a rule added by add_fault that answers the first two requests 503, the curl tool with --retry 3 waits one second, then two, gets the file on its third try and exits 0 with two retries, each 503's one-line body in standardOutput before the file; the server counts two uses of the rule and none left.
    program: flaky.cs
    args: [curl]
    expect:
      exit: 0
      stdout: "add_fault: f1\ncurl: exit 0, tool error: no\n  503 Service Unavailable\n  503 Service Unavailable\n  hello from surl\n  200 2\n  Warning: Problem : HTTP error. Retrying in 1 second. 3 retries left.\n  Warning: Problem : HTTP error. Retrying in 2 seconds. 2 retries left.\nget_events: 2 fault_applied\nlist_faults: f1 remaining 0\n"

  - id: too-few-retries
    claim: With -f --retry 1, the one retry gets the second 503 too, and the curl tool's answer is exit code 22 and a tool error; the rule is spent all the same.
    program: flaky.cs
    args: [curl-few]
    expect:
      exit: 0
      stdout: "add_fault: f1\ncurl: exit 22, tool error: yes\n  503 1\n  curl: (22) The requested URL returned error: 503\n  Warning: Problem : HTTP error. Retrying in 1 second. 1 retry left.\n  curl: (22) The requested URL returned error: 503\nget_events: 2 fault_applied\nlist_faults: f1 remaining 0\n"

  - id: transfer-loop
    claim: transfer makes one attempt per call and a 503 is an answer, with failure null and no tool error; an agent that waits one second, then two, and calls again gets the file on its third call.
    program: flaky.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "add_fault: f1\ntransfer 1: 503, failure null, tool error: no, waiting 1 s\ntransfer 2: 503, failure null, tool error: no, waiting 2 s\ntransfer 3: 200, failure null, tool error: no, hello from surl\nget_events: 2 fault_applied\nlist_faults: f1 remaining 0\n"
