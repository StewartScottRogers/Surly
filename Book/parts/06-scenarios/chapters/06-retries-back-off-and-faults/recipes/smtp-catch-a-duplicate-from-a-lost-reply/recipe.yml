# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-catch-a-duplicate-from-a-lost-reply
title: Catching a Duplicate from a Lost Reply
protocols: [smtp, imap]
tier: scenarios
surl-options: [--trace-ascii, --mail-domain, --mailbox, --control, --control-token-file]
curl-options: [-s, -S, -o, -H, -d, --crlf, -m, -u, --mail-from, --mail-rcpt, --retry, --retry-all-errors, --retry-delay, -T, -w, -X]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc5321, rfc5322, rfc9051]

# token.txt is the bearer token the test sends to surl's control endpoint.
# order.eml is the shop's order confirmation to Ann, with its own Message-ID. tries.sh reads, from
# surl's trace, what the server sent from its 354 on in each SMTP exchange that reached DATA.
fixtures:
  token.txt: "control-token-0123456789abcdefghij"
  order.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 1042 confirmed\nMessage-ID: <order-1042@shop.example.com>\n\nThank you for order 1042.\n"
  tries.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Usage: sh tries.sh TRACE. Waits (at most 10 s) until every exchange in surl's --trace-ascii
    # file has ended, then, for each SMTP exchange that reached DATA (a try), prints what the server
    # sent from its 354 on, each line after the bytes the server had sent by the end of it, and
    # where the server stored the message or cut the connection.
    trace=$1
    tries=0
    until [ "$(grep -c ' opened: ' "$trace")" -le "$(grep -c ' ended; ' "$trace")" ]; do
      tries=$((tries + 1))
      if [ "$tries" -gt 10 ]; then echo "an exchange has not ended" >&2; exit 1; fi
      sleep 1
    done
    tr -d '\r' < "$trace" | awk '
      / opened: smtp / { smtp[$1] = 1 }
      / => Send data, / { take = smtp[$1] ? $1 : ""; sent[$1] += $5; next }
      / \* Message stored/ && ($1 in try) { print "try " try[$1] ": message stored"; next }
      / cut after / && ($1 in try) { n = $0; sub(/.* cut after /, "", n); sub(/ bytes.*/, "", n); print "try " try[$1] ": cut after " n " bytes"; next }
      /^#/ { take = ""; next }
      take != "" && /^[0-9a-f][0-9a-f][0-9a-f][0-9a-f]: / {
        line = substr($0, 7)
        if (!(take in try) && index(line, "354 ") == 1) try[take] = ++count
        if (take in try) print "try " try[take] ": " sent[take] " " line
      }'

# One surl: SMTP for the shop, IMAP to search Ann's mailbox, one mail store, and the control endpoint
# through which the test adds its fault rule once the server is up. --trace-ascii keeps every byte.
servers:
  main:
    command: surl --trace-ascii smtp.trace --mail-domain example.com --mailbox shop@example.com:shoppass --mailbox ann@example.com:annpass --control http://127.0.0.1:{{port3}} --control-token-file token.txt smtp://127.0.0.1:{{port}}/ imap://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The control endpoint answers 201 to the rule that cuts the next SMTP connection cleanly after the 320th byte the server sends; the sender, curl with one retry on any error, then ends with reply 250 after one retry, and an IMAP search of Ann's INBOX for the order's Message-ID finds two messages, UIDs 1 and 2.
    run: 'curl -sS -o {{null}} -w "%{http_code}\n" -H "Authorization: Bearer control-token-0123456789abcdefghij" -H "Content-Type: text/plain" -d "drop;scheme=smtp;after-bytes=320;close=graceful;times=1" http://127.0.0.1:{{port3}}/v1/faults && curl -sS --crlf -m 10 --retry 1 --retry-all-errors --retry-delay 1 -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T order.eml -w "%{response_code} %{num_retries}\n" smtp://127.0.0.1:{{port}}/shop.example.com && curl -sS -u ann@example.com:annpass -X "UID SEARCH HEADER Message-ID <order-1042@shop.example.com>" imap://127.0.0.1:{{port2}}/INBOX'
    timeout: 60
    expect:
      exit: 0
      stdout: "201\n250 1\n* SEARCH 1 2\n"

  - id: tries
    claim: In the trace both tries had been sent 319 bytes by the end of the 354; in the first the server stored the message, sent one byte of its reply, 2, and cut the connection after 320 bytes; in the second it stored the message again and sent 250 2.0.0 Message accepted (347 bytes) and 221 2.0.0 Bye (362).
    run: sh tries.sh smtp.trace
    timeout: 60
    expect:
      exit: 0
      stdout: "try 1: 319 354 End data with <CR><LF>.<CR><LF>\ntry 1: message stored\ntry 1: 320 2\ntry 1: cut after 320 bytes\ntry 2: 319 354 End data with <CR><LF>.<CR><LF>\ntry 2: message stored\ntry 2: 347 250 2.0.0 Message accepted\ntry 2: 362 221 2.0.0 Bye\n"

  - id: no-retry
    claim: On a fresh server with the same rule, a sender without retries ends with curl exit 56 and no reply code, 000, yet the search finds the message stored once, UID 1.
    restart: main
    run: 'curl -sS -o {{null}} -w "%{http_code}\n" -H "Authorization: Bearer control-token-0123456789abcdefghij" -H "Content-Type: text/plain" -d "drop;scheme=smtp;after-bytes=320;close=graceful;times=1" http://127.0.0.1:{{port3}}/v1/faults && curl -sS --crlf -m 10 -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T order.eml -w "%{response_code} %{exitcode}\n" smtp://127.0.0.1:{{port}}/shop.example.com || curl -sS -u ann@example.com:annpass -X "UID SEARCH HEADER Message-ID <order-1042@shop.example.com>" imap://127.0.0.1:{{port2}}/INBOX'
    timeout: 60
    expect:
      exit: 0
      stdout: "201\n000 56\n* SEARCH 1\n"

  - id: cut-before
    claim: On a fresh server with the cut one byte sooner, after the 319th byte, the end of the 354, the sender with one retry ends with reply 250 after one retry and the search finds the message once, UID 1.
    restart: main
    run: 'curl -sS -o {{null}} -w "%{http_code}\n" -H "Authorization: Bearer control-token-0123456789abcdefghij" -H "Content-Type: text/plain" -d "drop;scheme=smtp;after-bytes=319;close=graceful;times=1" http://127.0.0.1:{{port3}}/v1/faults && curl -sS --crlf -m 10 --retry 1 --retry-all-errors --retry-delay 1 -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T order.eml -w "%{response_code} %{num_retries}\n" smtp://127.0.0.1:{{port}}/shop.example.com && curl -sS -u ann@example.com:annpass -X "UID SEARCH HEADER Message-ID <order-1042@shop.example.com>" imap://127.0.0.1:{{port2}}/INBOX'
    timeout: 60
    expect:
      exit: 0
      stdout: "201\n250 1\n* SEARCH 1\n"
