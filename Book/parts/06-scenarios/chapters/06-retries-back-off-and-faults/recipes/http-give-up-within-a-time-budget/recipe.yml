schema: 1
key: http-give-up-within-a-time-budget
title: Giving Up Within a Time Budget
protocols: [http]
tier: scenarios
surl-options: [--directory, --fault, -v, --log-file]
curl-options: [--no-progress-meter, -s, -f, -w, -m, --retry, --retry-delay, --retry-max-time]
exit-codes: [22, 28]
references: [surl-readme, curl-manual, rfc9110]

fixtures:
  site/report.txt: "report ready\n"
  hang/report.txt: "report ready\n"
  timed.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Runs curl with the arguments after the first two and says whether the whole command,
    # every attempt and every wait, took from MIN to under MAX seconds.
    # Usage: sh timed.sh MIN MAX CURL-ARGUMENTS...
    min=$1; max=$2; shift 2
    start=$(date +%s)
    curl "$@"
    code=$?
    end=$(date +%s)
    elapsed=$((end - start))
    if [ "$elapsed" -ge "$min" ] && [ "$elapsed" -lt "$max" ]; then
      echo "exit $code within $min to $max seconds"
    else
      echo "exit $code after $elapsed seconds"
    fi

# main is slow and failing: it holds every connection 1.5 s before reading it, then answers every
# request 503. hang holds every request 10 s and answers nothing in that time. No rule has times,
# so nothing is ever spent. One surl holds a folder at a time, so each server has its own.
servers:
  main:
    command: surl -v --log-file surl.log --directory site --fault "delay;ms=1500" --fault "error;scheme=http;reply=503" http://127.0.0.1:{{port}}/
    ready: port
  hang:
    command: surl --directory hang --fault "delay;stage=command;ms=10000" http://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Against a server that is slow and always 503, curl with --retry 10 and a 5-second --retry-max-time waits one second between tries, stops retrying once five seconds have passed, after one to three of its ten retries, and exits 22.
    run: curl --no-progress-meter -f --retry 10 --retry-delay 1 --retry-max-time 5 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port}}/report.txt
    timeout: 60
    expect:
      exit: 22
      stdout-matches: "^503 [1-3]\\n$"
      stderr-contains: "Warning: Problem : HTTP error. Retrying in 1 second. 10 retries left.\n"

  - id: whole-loop-bounded
    claim: The whole command, every try and every wait, takes at least the five-second budget and well under twenty seconds. This one needs a POSIX shell.
    run: sh timed.sh 5 20 -s -f --retry 10 --retry-delay 1 --retry-max-time 5 -o {{null}} http://127.0.0.1:{{port}}/report.txt
    timeout: 60
    expect:
      exit: 0
      stdout: "exit 22 within 5 to 20 seconds\n"

  - id: server-held-each
    claim: The server's verbose log shows it held connections 1.5 s by fault rule f1 and answered 503 by fault rule f2.
    run: 'grep -c -e "held for 1.5 s by fault rule f1" -e "GET /report.txt: answered 503 Service Unavailable by fault rule f2" surl.log'
    expect:
      exit: 0
      stdout-matches: "^([4-9]|[1-9][0-9])\\n$"

  - id: no-budget-counts-retries
    claim: Without --retry-max-time, --retry 3 makes all three retries and exits 22.
    run: curl -s -f --retry 3 --retry-delay 1 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port}}/report.txt
    timeout: 60
    expect:
      exit: 22
      stdout: "503 3\n"

  - id: no-budget-takes-longer
    claim: Without a budget the retry count alone sets the time; four slow tries and three one-second waits come to nine seconds, so the command takes at least eight by the whole-second clock. This one needs a POSIX shell.
    run: sh timed.sh 8 40 -s -f --retry 3 --retry-delay 1 -o {{null}} http://127.0.0.1:{{port}}/report.txt
    timeout: 60
    expect:
      exit: 0
      stdout: "exit 22 within 8 to 40 seconds\n"

  - id: hanging-needs-max-time
    claim: Against a server that answers nothing, -m 1 ends each try after one second with exit 28, and the 3-second budget stops the retries after one to three of ten.
    run: curl -s -m 1 --retry 10 --retry-delay 1 --retry-max-time 3 -w "%{http_code} %{num_retries}\n" http://127.0.0.1:{{port2}}/report.txt
    timeout: 60
    expect:
      exit: 28
      stdout-matches: "^000 [1-3]\\n$"

  - id: hanging-bounded
    claim: That whole command takes at least the three-second budget and well under twenty seconds. This one needs a POSIX shell.
    run: sh timed.sh 3 20 -s -m 1 --retry 10 --retry-delay 1 --retry-max-time 3 -o {{null}} http://127.0.0.1:{{port2}}/report.txt
    timeout: 60
    expect:
      exit: 0
      stdout: "exit 28 within 3 to 20 seconds\n"
