# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs budget.cs, a C# program on the official MCP SDK that starts both hosts from PATH,
# with one scenario and one label (the second argument): it prints only that label's lines.
# Every run makes one untimed warm-up transfer before the rules and the clock.
schema: 2
key: http-give-up-within-a-time-budget-from-an-agent
title: Giving Up Within a Time Budget
protocols: [http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, add_fault, curl, transfer, get_events]
exit-codes: [0]
references: [surl-readme, curl-readme, curl-manual, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Against a server that holds each connection 1.5 s and answers every request 503, the curl tool with -f --retry 10 --retry-delay 1 --retry-max-time 5 gives up with exit 22 after one to three retries.
    program: budget.cs
    args: [curl, curl]
    timeout: 90
    expect:
      exit: 0
      stdout-matches: "^curl: exit 22, 503 [1-3]\\n$"

  - id: call-bounded
    claim: That call takes from 5 to under 15 seconds.
    program: budget.cs
    args: [curl, took]
    timeout: 90
    expect:
      exit: 0
      stdout: "took 5 to 15 s: yes\n"

  - id: server-agrees
    claim: The server applied each of its two rules once per try, retries plus one.
    program: budget.cs
    args: [curl, fault_applied]
    timeout: 90
    expect:
      exit: 0
      stdout: "fault_applied: f1 f2, once per try: yes\n"

  - id: no-budget-counts-retries
    claim: Without --retry-max-time, --retry 3 makes all three retries.
    program: budget.cs
    args: [no-budget, curl]
    timeout: 90
    expect:
      exit: 0
      stdout: "curl: exit 22, 503 3\n"

  - id: no-budget-takes-longer
    claim: Without a budget, four slow tries and three waits take at least nine seconds.
    program: budget.cs
    args: [no-budget, took]
    timeout: 90
    expect:
      exit: 0
      stdout: "took 9 to 40 s: yes\n"

  - id: hanging-needs-max-time
    claim: Against a server that holds every request 5 s, -m 1 ends each try with exit 28 and --retry-max-time 3 stops the retries after one to three.
    program: budget.cs
    args: [hang, curl]
    timeout: 90
    expect:
      exit: 0
      stdout-matches: "^curl: exit 28, 000 [1-3]\\n$"

  - id: hanging-bounded
    claim: That call takes from 3 to under 12 seconds.
    program: budget.cs
    args: [hang, took]
    timeout: 90
    expect:
      exit: 0
      stdout: "took 3 to 12 s: yes\n"

  - id: transfer-budget
    claim: transfer makes one attempt per call and timeoutSeconds 1 ends each with exit 28; an agent that keeps its own 3-second budget stops after one to three retries.
    program: budget.cs
    args: [transfer, transfer]
    timeout: 90
    expect:
      exit: 0
      stdout-matches: "^transfer: exit 28 after [1-3] retries\\n$"

  - id: transfer-bounded
    claim: The agent's own loop takes from 3 to under 12 seconds.
    program: budget.cs
    args: [transfer, took]
    timeout: 90
    expect:
      exit: 0
      stdout: "took 3 to 12 s: yes\n"
