# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs tune.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-tune-a-retry-policy-by-experiment
title: Tuning a Retry Policy by Experiment
protocols: [http]
tier: scenarios
surface: mcp
mcp-tools: [start_server, add_fault, list_faults, remove_fault, get_events, curl]
curl-options: [-s, -S, -f, --max-time, --retry, --retry-delay, -o, -w]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc9110]

fixtures: {}

# The sweep makes eleven curl calls and waits up to 3 s in some of them; it is given 300 s.
cases:
  - id: solution
    role: solution
    claim: Against a server that fails its first 1, 2 and then 3 requests with 503, trying policies cheapest first, the smallest that succeeds is one retry, then two, then three, each with a 1-second delay; a 2-second delay with too few retries fails just the same; and the agent recommends --retry 3 --retry-delay 1, at most 3 s of waiting.
    program: tune.cs
    args: []
    timeout: 300
    expect:
      exit: 0
      stdout: "1 failures, --retry 0 --retry-delay 1: exit 22, status 503 after 0 retries\n1 failures, --retry 1 --retry-delay 1: exit 0, status 200 after 1 retries\n2 failures, --retry 0 --retry-delay 1: exit 22, status 503 after 0 retries\n2 failures, --retry 1 --retry-delay 1: exit 22, status 503 after 1 retries\n2 failures, --retry 1 --retry-delay 2: exit 22, status 503 after 1 retries\n2 failures, --retry 2 --retry-delay 1: exit 0, status 200 after 2 retries\n3 failures, --retry 0 --retry-delay 1: exit 22, status 503 after 0 retries\n3 failures, --retry 1 --retry-delay 1: exit 22, status 503 after 1 retries\n3 failures, --retry 1 --retry-delay 2: exit 22, status 503 after 1 retries\n3 failures, --retry 2 --retry-delay 1: exit 22, status 503 after 2 retries\n3 failures, --retry 3 --retry-delay 1: exit 0, status 200 after 3 retries\nrecommended: --retry 3 --retry-delay 1, at most 3 s of waiting\n"

  - id: events
    claim: The server records one fault_applied event, an error on the path, for each request the outage failed; a trial that succeeds after two retries leaves two.
    program: tune.cs
    args: [events]
    timeout: 120
    expect:
      exit: 0
      stdout: "2 failures, --retry 2 --retry-delay 1: exit 0, status 200 after 2 retries\nfault_applied: error on /status.json\nfault_applied: error on /status.json\n"

  - id: no-fail
    claim: Without -f a trial that runs out of retries still exits 0, with the last 503 as its status, so the agent judges a trial by the status and not the exit code alone.
    program: tune.cs
    args: [no-fail]
    timeout: 120
    expect:
      exit: 0
      stdout: "2 failures, --retry 1 without -f: exit 0, status 503 after 1 retries\n"
