# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: ftp-retry-after-a-refused-login
title: Retrying After a Refused Login
protocols: [ftp]
tier: scenarios
surl-options: [--user, --allow-plaintext-auth, --directory, --fault, -v, --log-file]
curl-options: [--no-progress-meter, -u, -w, --retry, --retry-all-errors, --retry-delay]
exit-codes: [0, 67]
references: [surl-readme, curl-manual, rfc959]

fixtures:
  site/hello.txt: "hello from surl\n"
  plain/hello.txt: "hello from surl\n"
  slow/hello.txt: "hello from surl\n"
  strict/hello.txt: "hello from surl\n"

# Each server has one account, app, and a rule that refuses its first login (two on slow) whatever
# the password. The rule acts at the login stage, so the readiness check, which connects and sends
# nothing, does not spend it. One surl holds a folder at a time, so each server has its own.
servers:
  main:
    command: surl -v --log-file surl.log --user app:s3cret --allow-plaintext-auth --directory site --fault "refuse-login;times=1" ftp://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --user app:s3cret --allow-plaintext-auth --directory plain --fault "refuse-login;times=1" ftp://127.0.0.1:{{port2}}/
    ready: port
  slow:
    command: surl --user app:s3cret --allow-plaintext-auth --directory slow --fault "refuse-login;times=2" ftp://127.0.0.1:{{port3}}/
    ready: port
  strict:
    command: surl --user app:s3cret --directory strict ftp://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The first login is refused with 530; curl with --retry 3 --retry-all-errors reports exit 67 for it, waits one second, logs in on its second try, downloads the file, exits 0 and counts one retry.
    run: curl --no-progress-meter -u app:s3cret --retry 3 --retry-all-errors -w "%{exitcode} %{num_retries}\n" ftp://127.0.0.1:{{port}}/hello.txt
    timeout: 30
    expect:
      exit: 0
      stdout: "hello from surl\n0 1\n"
      stderr-contains: "curl: (67) Access denied: 530\nWarning: Problem (retrying all errors). Retrying in 1 second. 3 retries left.\n"

  - id: server-refused-one
    claim: The server's verbose log records one refused login for app from that command.
    run: 'grep -c "Login refused: ftp app" surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: server-accepted-one
    claim: The same log records one accepted login for app, the retry's.
    run: 'grep -c "Login accepted: ftp app" surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: server-sent-530
    claim: The log shows the reply the client was given for the refused login, 530 Login incorrect.
    run: grep -c "> 530 Login incorrect" surl.log
    expect:
      exit: 0
      stdout: "1\n"

  - id: password-withheld
    claim: The log shows both logins' passwords as PASS ****, never the password itself.
    run: grep -c -F "PASS ****" surl.log
    expect:
      exit: 0
      stdout: "2\n"

  - id: rule-leaves-no-line
    claim: A login refused by the rule leaves no line naming the rule; only the start-up warning says a rule is there.
    run: grep -c "by fault rule" surl.log
    expect:
      exit: 1
      stdout: "0\n"

  - id: warns-on-start
    claim: The server writes a warning on start for the fault rule, here to its log file.
    run: 'grep -c "surl: warning: --fault: 1 fault rule(s) make this server misbehave on purpose" surl.log'
    expect:
      exit: 0
      stdout: "1\n"

  - id: retry-alone-does-not
    claim: curl does not count a 530 as transient, so --retry 3 alone makes no retry and exits 67.
    run: curl --no-progress-meter -u app:s3cret --retry 3 -w "%{exitcode} %{num_retries}\n" ftp://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 67
      stdout: "67 0\n"
      stderr-contains: "curl: (67) Access denied: 530\n"

  - id: rule-is-spent
    claim: The rule has times=1, so the next login, from a new command, is accepted.
    run: curl --no-progress-meter -u app:s3cret -w "%{exitcode} %{num_retries}\n" ftp://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n0 0\n"

  - id: wrong-password-stays-refused
    claim: A wrong password is refused with the same 530 every time, so --retry 2 --retry-all-errors retries twice and still exits 67.
    run: curl --no-progress-meter -u app:wrong --retry 2 --retry-all-errors --retry-delay 1 -w "%{exitcode} %{num_retries}\n" ftp://127.0.0.1:{{port2}}/hello.txt
    timeout: 30
    expect:
      exit: 67
      stdout: "67 2\n"

  - id: longer-wait
    claim: With two refusals and --retry-delay 2, curl waits two seconds before each retry and logs in on its third try.
    run: curl --no-progress-meter -u app:s3cret --retry 3 --retry-all-errors --retry-delay 2 -w "%{exitcode} %{num_retries}\n" ftp://127.0.0.1:{{port3}}/hello.txt
    timeout: 30
    expect:
      exit: 0
      stdout: "hello from surl\n0 2\n"
      stderr-contains: "Retrying in 2 seconds. 3 retries left.\ncurl: (67) Access denied: 530\nWarning: Problem (retrying all errors). Retrying in 2 seconds. 2 retries left.\n"

  - id: plaintext-refused
    claim: Without --allow-plaintext-auth the server refuses a password sent in clear over ftp://, with no fault rule at all, and a retry meets the same refusal.
    run: curl --no-progress-meter -u app:s3cret --retry 1 --retry-all-errors --retry-delay 1 -w "%{exitcode} %{num_retries}\n" ftp://127.0.0.1:{{port4}}/hello.txt
    timeout: 30
    expect:
      exit: 67
      stdout: "67 1\n"
