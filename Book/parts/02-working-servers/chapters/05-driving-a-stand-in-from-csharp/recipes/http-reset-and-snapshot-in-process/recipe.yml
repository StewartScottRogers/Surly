# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-reset-and-snapshot-in-process
title: Resetting a Server Between Tests from C#
protocols: [http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlSnapshot, SurlFolderPage, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, HttpAuthenticationMethods]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: After a snapshot of the seeded server and a test whose client adds one file and overwrites another, RestoreAsync puts back exactly the seeded files, and ResetAsync then leaves only the file given at start.
    program: between-tests.cs
    args: []
    expect:
      exit: 0
      stdout: "seeded: hello.txt 16, user.json 17\nPUT /report.csv: 201\nPUT /user.json: 204\nafter the test: hello.txt 16, report.csv 4, user.json 3\nrestored: hello.txt 16, user.json 17\nreset: hello.txt 16\n"

  - id: seed-is-a-file
    claim: Files.PutAsync puts a file the test seeds beside the one given in Files at start, and Files.ListAsync lists both with their sizes.
    program: between-tests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^seeded: hello\.txt 16, user\.json 17\n'

  - id: uploads-change-the-store
    claim: With AllowUploads and a Digest login, a PUT of a new path is answered 201 Created and a PUT over an existing file 204 No Content, and both change what the store holds.
    program: between-tests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nPUT /report\.csv: 201\nPUT /user\.json: 204\nafter the test: hello\.txt 16, report\.csv 4, user\.json 3\n'

  - id: restore-undoes-the-test
    claim: RestoreAsync removes the file the test added and puts back the seeded contents of the file it overwrote.
    program: between-tests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nrestored: hello\.txt 16, user\.json 17\n'

  - id: reset-to-start
    claim: ResetAsync returns the content store to the Files given at start and no others, dropping what the test seeded as well.
    program: between-tests.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nreset: hello\.txt 16\n$'

  - id: another-servers-snapshot
    claim: Restoring a snapshot into a server other than the one that took it throws ArgumentException.
    program: between-tests.cs
    args: [other-server]
    expect:
      exit: 1
      stdout: "seeded: hello.txt 16, user.json 17\nanother server's snapshot: ArgumentException\n"

  - id: on-disk-refused
    claim: On a server with DataDirectory set, ResetAsync and SnapshotAsync both throw InvalidOperationException, so a fixture never empties a real directory.
    program: between-tests.cs
    args: [on-disk]
    expect:
      exit: 0
      stdout: "ResetAsync: InvalidOperationException\nSnapshotAsync: InvalidOperationException\n"
