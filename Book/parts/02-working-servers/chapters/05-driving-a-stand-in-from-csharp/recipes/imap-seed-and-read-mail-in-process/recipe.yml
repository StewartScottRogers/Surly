# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: imap-seed-and-read-mail-in-process
title: Seeding a Mailbox and Reading It over IMAP from C#
protocols: [imap]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlSeedRefusedException, SurlMessagePage, SurlMessageSummary, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 1, 67]
references: [surl-readme, curl-readme, rfc9051, rfc5322]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Mail.DeliverAsync puts the message in alice's INBOX as UID 1, and Curl.Api, logged in as alice, fetches it over IMAP byte for byte.
    program: seed-and-read.cs
    args: []
    expect:
      exit: 0
      stdout: "seeded: UID 1, 87 bytes, flags []\nFrom: shop@example.com\nTo: alice@example.com\nSubject: Your order\n\nIt has shipped.\nfetched: UID 1, 87 bytes, flags [\\Seen]\n"

  - id: seed-is-unseen
    claim: A seeded message arrives with no flags, so Mail.ListMessagesAsync shows it unseen.
    program: seed-and-read.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^seeded: UID 1, 87 bytes, flags \[\]\n'

  - id: fetch-sets-seen
    claim: Fetching the message over IMAP marks it \Seen, which the next read of the store shows.
    program: seed-and-read.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nfetched: UID 1, 87 bytes, flags \[\\Seen\]\n$'

  - id: domain-ignored
    claim: With no MailDomains configured, the domain of the address is ignored, so alice@example.com is delivered to the account alice.
    program: seed-and-read.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^seeded: UID 1, '

  - id: unknown-account
    claim: Seeding mail for an account the server does not have throws SurlSeedRefusedException with Store Mail and Refusal NoSuchAccount.
    program: seed-and-read.cs
    args: [bob]
    expect:
      exit: 1
      stdout: "seed refused: Mail NoSuchAccount\n"

  - id: wrong-password
    claim: A fetch with the wrong password throws CurlException with Code 67 and the message Login denied.
    program: seed-and-read.cs
    args: [wrong-password]
    expect:
      exit: 67
      stdout: "seeded: UID 1, 87 bytes, flags []\ncurl error 67: Login denied\n"
