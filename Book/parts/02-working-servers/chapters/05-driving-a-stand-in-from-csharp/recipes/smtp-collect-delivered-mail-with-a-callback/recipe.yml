# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-collect-delivered-mail-with-a-callback
title: Collecting Delivered Mail with a Callback
protocols: [smtp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, StoreChangedEvent, SurlMessagePage, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions]
exit-codes: [0, 1]
references: [surl-readme, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A callback registered with OnEvent for StoreChanged events in the Mail store with Scheme smtp collects one Delivered event per message the app sends, to Ann, Bob and Ann, in order, and leaves out the welcome message the test seeded with DeliverAsync.
    program: collect-deliveries.cs
    args: []
    expect:
      exit: 0
      stdout: "collected 3\nDelivered ann@example.com/INBOX/;UID=2\nDelivered bob@example.com/INBOX/;UID=1\nDelivered ann@example.com/INBOX/;UID=3\n"

  - id: unfiltered
    claim: Without Scheme in the query the callback also collects the test's own seed, a Seeded change of Ann's INBOX at UID 1, ahead of the three deliveries.
    program: collect-deliveries.cs
    args: [unfiltered]
    expect:
      exit: 0
      stdout: "collected 4\nSeeded ann@example.com/INBOX/;UID=1\nDelivered ann@example.com/INBOX/;UID=2\nDelivered bob@example.com/INBOX/;UID=1\nDelivered ann@example.com/INBOX/;UID=3\n"

  - id: sizes
    claim: Each event's ByteCount equals the size of the message the store holds at the UID its Name gives.
    program: collect-deliveries.cs
    args: [sizes]
    expect:
      exit: 0
      stdout: "collected 3\nDelivered ann@example.com/INBOX/;UID=2 ByteCount equals the stored size\nDelivered bob@example.com/INBOX/;UID=1 ByteCount equals the stored size\nDelivered ann@example.com/INBOX/;UID=3 ByteCount equals the stored size\n"

  - id: one-send-two-mailboxes
    claim: One send to Ann and Bob is two deliveries, one event per mailbox, both with the same ExchangeId, the SMTP connection that made them.
    program: collect-deliveries.cs
    args: [two]
    expect:
      exit: 0
      stdout-matches: '^collected 2\nDelivered ann@example\.com/INBOX/;UID=2 exchange (\d+)\nDelivered bob@example\.com/INBOX/;UID=1 exchange \1\n$'

  - id: unknown-address
    claim: Mail to an address in the domain with no mailbox is accepted and discarded, so nothing is collected; the test's two-second wait ends with an empty list and exit 1.
    program: collect-deliveries.cs
    args: [unknown]
    expect:
      exit: 1
      stdout: "collected 0\n"
