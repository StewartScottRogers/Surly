# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-refuse-to-reset-a-real-directory
title: Refusing to Reset a Real Directory
protocols: [http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 1]
references: [surl-readme, curl-readme]

# The real folder the server serves: one report, as a team might keep it.
fixtures:
  data/report.txt: "quarterly figures\n"

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With DataDirectory set, a test's upload is written to the folder and the fixture's ResetAsync is refused with InvalidOperationException naming the store on disk; nothing is deleted, so the report and the draft are both still served and both still in the folder.
    program: reset-guard.cs
    args: []
    expect:
      exit: 1
      stdout: "upload: 201\nResetAsync refused: Content: the store could not be reset. The content store is on disk (--directory): reset, snapshot and restore are refused so a test never empties a real directory.\nGET report.txt: 200, GET draft.txt: 200\ndata folder: draft.txt report.txt\n"

  - id: in-memory
    claim: With the same file in Files instead, ResetAsync succeeds and the next test finds the files given at start, the report served and the draft gone.
    program: reset-guard.cs
    args: [in-memory]
    expect:
      exit: 0
      stdout: "upload: 201\nResetAsync: done\nGET report.txt: 200, GET draft.txt: 404\n"

  - id: snapshot-refused
    claim: SnapshotAsync on a server with DataDirectory is refused the same way, with InvalidOperationException.
    program: reset-guard.cs
    args: [snapshot]
    expect:
      exit: 1
      stdout: "SnapshotAsync refused: Content: the store could not be snapshotted. The content store is on disk (--directory): reset, snapshot and restore are refused so a test never empties a real directory.\n"
