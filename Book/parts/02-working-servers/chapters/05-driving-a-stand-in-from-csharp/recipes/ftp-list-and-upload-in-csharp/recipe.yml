# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: ftp-list-and-upload-in-csharp
title: Listing and Uploading over FTP in C#
protocols: [ftp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerFiles, SurlFileContents, SurlFolderPage, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions, FtpCreateMissingDirectories, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A GET on the root URL lists it, long-listing lines with a hidden file left out and a folder marked d; a PUT with a body uploads notes.txt, the next listing shows it, and the server's store holds its bytes.
    program: list-and-upload.cs
    args: []
    expect:
      exit: 0
      stdout: "/: - hello.txt, d sub\nuploaded /notes.txt\n/: - hello.txt, - notes.txt, d sub\nstore: uploaded by curl\n"

  - id: subfolder
    claim: A subfolder is listed by naming it with a trailing slash.
    program: list-and-upload.cs
    args: [subfolder]
    expect:
      exit: 0
      stdout: "/sub/: - a.txt\n"

  - id: missing-folder
    claim: An upload into a folder that is not there throws a CurlException with code RemoteAccessDenied, 9, the code curl exits with; with CreateMissingDirectories set to Create the folder is made and the upload lands in it.
    program: list-and-upload.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "missing: CurlException 9 RemoteAccessDenied\nuploaded /new/notes.txt\ncreated: notes.txt\n"

  - id: anonymous-login
    claim: With no account on the request, the login the server receives is USER anonymous, and AllowAnonymous lets it in.
    program: list-and-upload.cs
    args: [login]
    expect:
      exit: 0
      stdout: "/: - hello.txt, d sub\nreceived: USER anonymous\n"

  - id: listings-off
    claim: With ListDirectories left off, a listing throws a CurlException, FtpCouldntRetrFile, 19, the code curl exits with.
    program: list-and-upload.cs
    args: [listings-off]
    expect:
      exit: 0
      stdout: "listings-off: CurlException 19 FtpCouldntRetrFile\n"

  - id: uploads-off
    claim: With AllowUploads left off, listings still work and the upload throws a CurlException, UploadFailed, 25.
    program: list-and-upload.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "/: - hello.txt, d sub\nuploads-off: CurlException 25 UploadFailed\n"

  - id: anonymous-refused
    claim: With AllowAnonymous left off, the anonymous login is refused and the listing throws a CurlException, LoginDenied, 67.
    program: list-and-upload.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "no-login: CurlException 67 LoginDenied\n"
