schema: 2
key: surl-split-options-across-config-files-from-an-agent
title: Splitting Config Files from an Agent
protocols: [http, ftp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, read_file]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "An agent starts a server from two layers of arguments, the base's and the test's, and curl-mcp's curl tool logs in as tester, whose account the base layer names, and reads hello.txt."
    program: split.cs
    args: ["both"]
    expect:
      exit: 0
      stdout: "tester: from the store\n"

  - id: second-account
    claim: "A user in the second layer adds an account: second logs in to the same server."
    program: split.cs
    args: ["second-account"]
    expect:
      exit: 0
      stdout: "second: from the store\n"

  - id: login-needed
    claim: "With an account configured, every request needs a login: without one, 401."
    program: split.cs
    args: ["login-needed"]
    expect:
      exit: 0
      stdout: "no login: 401\n"

  - id: later-layer-wins
    claim: "Both layers set --max-filesize, the base 100 and the test 10; the later wins, and a 21-byte upload is refused 413."
    program: split.cs
    args: ["later-layer-wins"]
    expect:
      exit: 0
      stdout: "21 bytes: 413\n"

  - id: under-the-limit
    claim: "An 8-byte upload is under 10 and accepted, 201."
    program: split.cs
    args: ["under-the-limit"]
    expect:
      exit: 0
      stdout: "8 bytes: 201\n"

  - id: ftp-limit
    claim: "The same limit holds over FTP: the 21-byte upload is refused and curl exits 70."
    program: split.cs
    args: ["ftp-limit"]
    expect:
      exit: 0
      stdout: "ftp: exit code 70\n"

  - id: ftp-same-store
    claim: "An 8-byte upload over FTP is accepted and lands in the store the HTTP server serves, which read_file reads."
    program: split.cs
    args: ["ftp-same-store"]
    expect:
      exit: 0
      stdout: "ftp: \nthe store holds: 1234567\n"

  - id: order-matters
    claim: "With the layers the other way round, the test's first and the base's after, the base's 100 wins: the 21-byte upload is accepted, 201."
    program: split.cs
    args: ["order-matters"]
    expect:
      exit: 0
      stdout: "21 bytes: 201\n"

  - id: override-after-wins
    claim: "A last layer of --max-filesize 5 beats both: the 8-byte upload is refused, 413."
    program: split.cs
    args: ["override-after-wins"]
    expect:
      exit: 0
      stdout: "8 bytes: 413\n"

  - id: override-before-loses
    claim: "The same layer placed before the others loses to them: the test's 10 applies and the 8-byte upload is accepted, 201."
    program: split.cs
    args: ["override-before-loses"]
    expect:
      exit: 0
      stdout: "8 bytes: 201\n"

  - id: no-allow-after
    claim: "--no-allow-uploads in a last layer turns off the --allow-uploads of the base: the same upload is refused 405."
    program: split.cs
    args: ["no-allow-after"]
    expect:
      exit: 0
      stdout: "8 bytes: 405\n"

  - id: config-refused
    claim: "start_server takes no config file: -K base.conf is a tool error naming the option."
    program: split.cs
    args: ["config-refused"]
    expect:
      exit: 0
      stdout: "tool error: refused: -K/--config is not accepted: a config file could name paths this host never checks\n"

  - id: typo-names-the-option
    claim: "A mistake in a layer is a tool error with surl's own line, naming the option."
    program: split.cs
    args: ["typo"]
    expect:
      exit: 0
      stdout: "tool error: surl: option --max-filesise: is unknown\n"

