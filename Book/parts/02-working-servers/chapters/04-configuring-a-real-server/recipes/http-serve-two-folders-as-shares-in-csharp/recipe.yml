# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: http-serve-two-folders-as-shares-in-csharp
title: Serving Two Folders as Shares in C#
protocols: [http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, rfc9110]
triplet: http-serve-two-folders-as-shares

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The two folders are served at /docs/ and /data/, each file at its relative path under its share.
    program: two-shares.cs
    args: [serve]
    expect:
      exit: 0
      stdout: "docs: Read me first.\ndata: first\n"

  - id: readonly-refuses-upload
    claim: An upload into the readonly share is refused 403 Forbidden although AllowUploads is on, and no file appears in the folder.
    program: two-shares.cs
    args: [readonly]
    expect:
      exit: 0
      stdout: "upload: 403\non disk: False\n"

  - id: writable-takes-upload
    claim: The same upload into the other share is accepted 201 Created, and the file is in the folder on disk.
    program: two-shares.cs
    args: [writable]
    expect:
      exit: 0
      stdout: "upload: 201\non disk: uploaded\n"

  - id: second-reads-readonly
    claim: A second server serves the readonly folder at the same time, since a readonly share takes no lock on it.
    program: two-shares.cs
    args: [second-readonly]
    expect:
      exit: 0
      stdout: "second docs: Read me first.\n"

  - id: second-refused-writable
    claim: A second server asked to serve the writable folder is refused with a SurlServerStartException, because the first holds it; its first line is what surl would print for exit 124.
    program: two-shares.cs
    args: [second-writable]
    expect:
      exit: 0
      stdout-matches: '^second refused: .*in use by another surl process'
