# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-offer-a-share-to-ftp-only-in-csharp
title: Offering FTP-only Shares in C#
protocols: [ftp, http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlTlsOptions, CurlTlsPeerOptions]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A share given protocols=ftp is read over FTP like any folder, here drop/report.txt.
    program: ftp-only-share.cs
    args: [ftp]
    expect:
      exit: 0
      stdout: "ftp: totals\n"

  - id: http-404
    claim: The same path over HTTP, from the same server, is answered 404, as if the share were not there.
    program: ftp-only-share.cs
    args: [http]
    expect:
      exit: 0
      stdout: "http: 404\n"

  - id: other-share-open
    claim: A share with no protocols= is reached over HTTP, so the 404 for drop is the share's limit and not a fault in the HTTP listener.
    program: ftp-only-share.cs
    args: [open-http]
    expect:
      exit: 0
      stdout: "open-http: open to all\n"

  - id: other-share-ftp
    claim: That other share is read over FTP as well.
    program: ftp-only-share.cs
    args: [open-ftp]
    expect:
      exit: 0
      stdout: "open-ftp: open to all\n"

  - id: ftps-too
    claim: protocols=ftp admits the TLS twin, so the share is read over FTPS from the FTPS listener, with the throwaway certificate accepted.
    program: ftp-only-share.cs
    args: [ftps]
    expect:
      exit: 0
      stdout: "ftps: totals\n"

  - id: listed-over-ftp
    claim: An FTP listing of the root names both shares.
    program: ftp-only-share.cs
    args: [root]
    expect:
      exit: 0
      stdout: "root: drop public\n"

  - id: hidden-from-http-folder
    claim: The share's folder is not served over HTTP either, 404.
    program: ftp-only-share.cs
    args: [http-folder]
    expect:
      exit: 0
      stdout: "http-folder: 404\n"

  - id: unknown-scheme
    claim: A protocols= value that names no scheme makes StartAsync throw a SurlServerStartException, whose first line names the scheme.
    program: ftp-only-share.cs
    args: [unknown-scheme]
    expect:
      exit: 0
      stdout: "refused: option --share: unknown scheme nope\n"
