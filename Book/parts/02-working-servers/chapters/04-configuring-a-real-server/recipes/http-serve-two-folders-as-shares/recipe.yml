# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: http-serve-two-folders-as-shares
title: Serving Two Folders as Shares
protocols: [http]
tier: working-servers
surl-options: [--share, --allow-uploads, --allow-anonymous]
curl-options: [-s, -T, -o, -w]
exit-codes: [0, 124]
references: [surl-readme, rfc9110]
triplet: http-serve-two-folders-as-shares

fixtures:
  docs/guide.txt: "Read me first.\n"
  data/a.txt: "first\n"
  up.txt: "uploaded\n"

servers:
  main:
    command: surl --allow-anonymous --allow-uploads --share "docs=docs;readonly" --share data=data http://127.0.0.1:{{port}}/
    ready: port
  reader:
    command: surl --share "docs=docs;readonly" http://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The two folders are served at /docs/ and /data/, each file at its relative path under its share.
    run: curl -s http://127.0.0.1:{{port}}/docs/guide.txt http://127.0.0.1:{{port}}/data/a.txt
    expect:
      exit: 0
      stdout: "Read me first.\nfirst\n"

  - id: readonly-refuses-upload
    claim: An upload into the readonly share is refused 403 Forbidden although --allow-uploads is on, and nothing is written.
    run: curl -s -T up.txt -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/docs/up.txt
    expect:
      exit: 0
      stdout: "403"

  - id: writable-takes-upload
    claim: The same upload into the other share is accepted 201 Created, and the file is in the folder on disk.
    run: curl -s -T up.txt -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/data/up.txt
    expect:
      exit: 0
      stdout: "201"
      files:
        data/up.txt: "uploaded\n"

  - id: second-reads-readonly
    claim: A second surl serves the readonly folder at the same time, since a readonly share takes no lock on it.
    run: curl -s http://127.0.0.1:{{port2}}/docs/guide.txt
    expect:
      exit: 0
      stdout: "Read me first.\n"

  - id: second-refused-writable
    claim: A second surl asked to serve the writable folder is refused, exit 124, because the first surl holds it.
    run: surl --share data=data http://127.0.0.1:{{port3}}/ 2>&1
    timeout: 20
    expect:
      exit: 124
      stdout: "surl: (124) Directory data is in use by another surl process\n"
