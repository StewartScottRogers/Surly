# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-share-a-folder-read-only
title: Sharing a Folder Read-Only over HTTP
protocols: [http]
tier: working-servers
surl-options: [--directory, --allow-uploads, --user, --share, --share-access]
curl-options: [-s, --digest, -u, -T, -o, -w]
exit-codes: [0, 2, 37]
references: [surl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  docs/guide.txt: "Read me first.\n"
  notes.txt: "a note\n"

servers:
  main:
    command: surl --directory site --allow-uploads --user alice:secret --user bob:hunter2 --share "docs=docs;readonly" --share-access docs=alice:rw http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Alice, granted the share, reads a file from the folder docs under /docs/.
    run: curl -s --digest -u alice:secret http://127.0.0.1:{{port}}/docs/guide.txt
    expect:
      exit: 0
      stdout: "Read me first.\n"

  - id: readonly-refuses-upload
    claim: An upload into the read-only share is refused 403 Forbidden, although Alice's grant is rw and --allow-uploads is on.
    run: curl -s --digest -u alice:secret -T notes.txt -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/docs/notes.txt
    expect:
      exit: 0
      stdout: "403"

  - id: nothing-written
    claim: The refused upload left nothing behind; the file is not in the share.
    run: curl -s --digest -u alice:secret -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/docs/notes.txt
    expect:
      exit: 0
      stdout: "404"

  - id: root-takes-uploads
    claim: The same upload to the served root, which is not read-only, is accepted 201 Created.
    run: curl -s --digest -u alice:secret -T notes.txt -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout: "201"

  - id: ungranted-account-sees-nothing
    claim: Bob, a valid account the share does not name, is answered 404 Not Found, as if the share were not there.
    run: curl -s --digest -u bob:hunter2 -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/docs/guide.txt
    expect:
      exit: 0
      stdout: "404"

  - id: ungranted-account-reads-root
    claim: Bob still reads the served root, which no --share-access closes.
    run: curl -s --digest -u bob:hunter2 http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: anonymous-asked-to-log-in
    claim: A request with no login is answered 401 Unauthorized, since accounts are configured.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/docs/guide.txt
    expect:
      exit: 0
      stdout: "401"

  - id: unknown-member
    claim: A --share-access member that names no account is refused at start with exit 2.
    run: surl --user alice:secret --share docs=docs --share-access docs=carol:r http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout: "surl: (2) option --share-access: member carol names no account or group\n"

  - id: missing-folder
    claim: A --share whose folder does not exist is refused at start with exit 37; surl does not create it.
    run: surl --share docs=nowhere http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 37
      stdout: "surl: (37) Could not open directory nowhere for share docs\n"
