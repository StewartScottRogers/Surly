# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs two-shares.cs, a C# program on the official MCP SDK
# that starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: http-serve-two-folders-as-shares-from-an-agent
title: Serving Two Shares from an Agent
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl]
curl-options: [-s, -T, -o, -w]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]
triplet: http-serve-two-folders-as-shares

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The two folders are served at /docs/ and /data/, each file at its relative path under its share.
    program: two-shares.cs
    args: [serve]
    expect:
      exit: 0
      stdout: "docs: Read me first.\ndata: first\n"

  - id: readonly-refuses-upload
    claim: An upload into the readonly share is refused 403 Forbidden although --allow-uploads is on, and no file appears in the folder.
    program: two-shares.cs
    args: [readonly]
    expect:
      exit: 0
      stdout: "upload: 403\non disk: False\n"

  - id: writable-takes-upload
    claim: The same upload into the other share is accepted 201 Created, and the file is in the folder on disk.
    program: two-shares.cs
    args: [writable]
    expect:
      exit: 0
      stdout: "upload: 201\non disk: uploaded\n"

  - id: second-reads-readonly
    claim: A second start_server serves the readonly folder at the same time, since a readonly share takes no lock on it.
    program: two-shares.cs
    args: [second-readonly]
    expect:
      exit: 0
      stdout: "second docs: Read me first.\n"

  - id: second-refused-writable
    claim: A second start_server on the writable folder is a tool error naming the folder as in use by another surl process, with the exit code 124 surl gives.
    program: two-shares.cs
    args: [second-writable]
    expect:
      exit: 0
      stdout-matches: '^second refused: surl: \(124\) Directory data is in use by another surl process\n$'
