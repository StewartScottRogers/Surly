# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: surl-split-options-across-config-files
title: Splitting Options Across Config Files
protocols: [http, ftp]
tier: working-servers
surl-options: [-K, --directory, --user, --allow-plaintext-auth, --allow-uploads, --no-allow-uploads, --max-filesize]
curl-options: [-s, -S, -u, -T, -w, -o]
exit-codes: [0, 2, 70]
references: [surl-readme, curl-readme]

fixtures:
  site/hello.txt: "from base.conf\n"
  site-b/hello.txt: "from the command line\n"
  site-c/hello.txt: "from the command line\n"
  site-d/hello.txt: "from the command line\n"
  site-e/hello.txt: "from the command line\n"
  # The shared base: where the files are, who may log in, what they may do.
  base.conf: |
    # Shared by every test: surl -K base.conf
    directory = site
    user = "tester:secret"
    allow-plaintext-auth
    allow-uploads
    max-filesize = 100
  # What this test changes: a smaller limit, and one more account.
  test.conf: |
    # This test only: surl -K base.conf -K test.conf
    max-filesize = 10
    user = "second:pw"
  bad.conf: "max-filesize = 10\nmax-filesise = 20\n"
  up.txt: "0123456789abcdefghij\n"
  mid.txt: "1234567\n"

servers:
  both:
    command: surl -K base.conf -K test.conf http://127.0.0.1:{{port}}/ ftp://127.0.0.1:{{port2}}/
    ready: port
  swapped:
    command: surl -K test.conf -K base.conf --directory site-b http://127.0.0.1:{{port3}}/
    ready: port
  last:
    command: surl -K base.conf -K test.conf --directory site-c --max-filesize 5 http://127.0.0.1:{{port4}}/
    ready: port
  first:
    command: surl --max-filesize 5 -K base.conf -K test.conf --directory site-d http://127.0.0.1:{{port5}}/
    ready: port
  read-only:
    command: surl -K base.conf -K test.conf --directory site-e --no-allow-uploads http://127.0.0.1:{{port6}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: "surl -K base.conf -K test.conf serves the directory and the account base.conf names: tester logs in and reads hello.txt from site."
    run: 'curl -s -S -u tester:secret http://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 0
      stdout: "from base.conf\n"

  - id: second-file-adds-an-account
    claim: "A user line in the second file adds an account; it does not replace the first file's. second logs in to the same server."
    run: 'curl -s -S -u second:pw http://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 0
      stdout: "from base.conf\n"

  - id: login-needed
    claim: "With an account configured, every request needs a login: without one, 401."
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: later-file-wins
    claim: "Both files set max-filesize, base.conf 100 and test.conf 10; the later file wins, and a 21-byte upload is refused 413."
    run: 'curl -s -S -u tester:secret -T up.txt http://127.0.0.1:{{port}}/up.txt -o {{null}} -w "%{http_code}"'
    expect:
      exit: 0
      stdout: "413"

  - id: under-the-limit
    claim: "An 8-byte upload is under 10 and accepted, 201."
    run: 'curl -s -S -u tester:secret -T mid.txt http://127.0.0.1:{{port}}/mid.txt -w "%{http_code}"'
    expect:
      exit: 0
      stdout: "201"

  - id: ftp-limit
    claim: "The same limit holds over FTP: the 21-byte upload is refused and curl exits 70."
    run: 'curl -s -S -u tester:secret -T up.txt ftp://127.0.0.1:{{port2}}/up.txt'
    expect:
      exit: 70

  - id: ftp-same-directory
    claim: "An 8-byte upload over FTP is accepted and lands in the directory base.conf names."
    run: 'curl -s -S -u tester:secret -T mid.txt ftp://127.0.0.1:{{port2}}/ftp-mid.txt'
    expect:
      exit: 0
      files:
        site/ftp-mid.txt: "1234567\n"

  - id: order-matters
    claim: "With the files the other way round, -K test.conf -K base.conf, base.conf is later and its 100 wins: the 21-byte upload is accepted, 201."
    run: 'curl -s -S -u tester:secret -T up.txt http://127.0.0.1:{{port3}}/up.txt -w "%{http_code}"'
    expect:
      exit: 0
      stdout: "201"

  - id: command-line-after-wins
    claim: "An option on the command line after the files beats both: --max-filesize 5 refuses the 8-byte upload, 413."
    run: 'curl -s -S -u tester:secret -T mid.txt http://127.0.0.1:{{port4}}/mid.txt -o {{null}} -w "%{http_code}"'
    expect:
      exit: 0
      stdout: "413"

  - id: command-line-before-loses
    claim: "The same option before the files loses to them: test.conf's 10 applies and the 8-byte upload is accepted, 201."
    run: 'curl -s -S -u tester:secret -T mid.txt http://127.0.0.1:{{port5}}/mid.txt -w "%{http_code}"'
    expect:
      exit: 0
      stdout: "201"

  - id: command-line-directory
    claim: "--directory on the command line after the files beats the one in base.conf: the server serves site-b."
    run: 'curl -s -S -u tester:secret http://127.0.0.1:{{port3}}/hello.txt'
    expect:
      exit: 0
      stdout: "from the command line\n"

  - id: no-allow-after-the-files
    claim: "--no-allow-uploads after the files turns off the allow-uploads base.conf set: the same upload is refused 405."
    run: 'curl -s -S -u tester:secret -T mid.txt http://127.0.0.1:{{port6}}/mid.txt -o {{null}} -w "%{http_code}"'
    expect:
      exit: 0
      stdout: "405"

  - id: typo-names-its-file
    claim: "A mistake in the second file is named by file and line, and surl exits 2 before listening."
    run: surl -K base.conf -K bad.conf http://127.0.0.1:{{port7}}/
    expect:
      exit: 2
      stderr-contains: "surl: bad.conf:2: option --max-filesise: is unknown"
