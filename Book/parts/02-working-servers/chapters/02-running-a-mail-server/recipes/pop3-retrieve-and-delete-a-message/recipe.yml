# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: pop3-retrieve-and-delete-a-message
title: Downloading Mail and Deleting It
protocols: [pop3, smtp, imap]
tier: working-servers
surl-options: [--allow-anonymous]
curl-options: [-o, -X, --next, --crlf, --mail-from, --mail-rcpt, -T, -v]
exit-codes: [0, 8]
references: [surl-readme, curl-readme, rfc1939, rfc5321, rfc9051]

fixtures:
  lunch.txt: "From: ann@example.com\nTo: bob@example.com\nSubject: Lunch\n\nNoon at the usual place.\n"
  invoice.txt: "From: carol@example.com\nTo: bob@example.com\nSubject: Invoice 42\n\nPlease pay invoice 42.\n"

servers:
  main:
    command: surl --allow-anonymous smtp://127.0.0.1:{{port}}/ pop3://127.0.0.1:{{port2}}/ imap://127.0.0.1:{{port3}}/
    ready: port

# The cases run in order against the same server. The solution sends, downloads and
# deletes one message; then two more arrive, one is deleted and undeleted, then
# deleted for good.
cases:
  - id: solution
    role: solution
    claim: One curl sends lunch.txt over SMTP, saves message 1 from the POP3 maildrop to lunch.eml, then deletes it with -X "DELE 1", exit 0.
    run: curl --crlf --mail-from ann@example.com --mail-rcpt bob@example.com -T lunch.txt smtp://127.0.0.1:{{port}}/example.com --next -o lunch.eml pop3://127.0.0.1:{{port2}}/1 --next -X "DELE 1" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: ""
      files:
        lunch.eml: null

  - id: deleted-after-solution
    claim: After the Solution, message 1 is gone; retrieving a message number that is not there is answered -ERR, and curl exits 8, printing nothing.
    run: curl pop3://127.0.0.1:{{port2}}/1
    expect:
      exit: 8
      stdout: ""

  - id: deliver-two
    claim: Two more messages are delivered over SMTP in one curl, lunch.txt from ann and invoice.txt from carol, exit 0.
    run: curl --crlf --mail-from ann@example.com --mail-rcpt bob@example.com -T lunch.txt smtp://127.0.0.1:{{port}}/example.com --next --crlf --mail-from carol@example.com --mail-rcpt bob@example.com -T invoice.txt smtp://127.0.0.1:{{port}}/example.com
    expect:
      exit: 0
      stdout: ""

  - id: list
    claim: A POP3 URL with no message number lists the maildrop, one line per message, its number and its size in octets.
    run: curl pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \d+\n2 \d+\n$'

  - id: uidl
    claim: -X UIDL lists each message's number and unique id instead.
    run: curl -X UIDL pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \S+\n2 \S+\n$'

  - id: retrieve
    claim: A message number in the URL retrieves that message (RETR); message 1 is the lunch message.
    run: curl pop3://127.0.0.1:{{port2}}/1
    expect:
      exit: 0
      stdout-matches: 'From: ann@example\.com\nTo: bob@example\.com\nSubject: Lunch\n\nNoon at the usual place\.\n$'

  - id: dele-then-rset
    claim: In one session, after DELE 1 the list leaves message 1 out and message 2 keeps its number; RSET then undeletes it.
    run: curl -X "DELE 1" pop3://127.0.0.1:{{port2}}/ --next pop3://127.0.0.1:{{port2}}/ --next -X RSET pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^2 \d+\n$'

  - id: rset-kept-both
    claim: After that session both messages are still there.
    run: curl pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \d+\n2 \d+\n$'

  - id: delete-for-good
    claim: Without RSET, -X "DELE 1" in a session of its own deletes message 1 when the session ends, exit 0.
    run: curl -X "DELE 1" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: ""

  - id: one-left
    claim: In the next session the maildrop holds one message, numbered 1.
    run: curl pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 \d+\n$'

  - id: renumbered
    claim: Message 1 is now the invoice, which was message 2 before the deletion.
    run: curl pop3://127.0.0.1:{{port2}}/1
    expect:
      exit: 0
      stdout-matches: 'Subject: Invoice 42\n\nPlease pay invoice 42\.\n$'

  - id: gone-from-imap
    claim: The deleted message is gone from the one store, so an IMAP search of INBOX for its subject finds nothing.
    run: curl "imap://127.0.0.1:{{port3}}/INBOX?SUBJECT%20Lunch"
    expect:
      exit: 0
      stdout: "* SEARCH\n"

  - id: dele-missing
    claim: Deleting a message number that is not there is answered -ERR No such message, and curl exits 8.
    run: curl -v -X "DELE 5" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 8
      stderr-contains: "-ERR No such message"
