# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-send-to-several-recipients-in-csharp
title: Sending to Several Recipients in C#
protocols: [smtp, imap]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, StoreChangedEvent, SurlMailMessage, SurlMessagePage, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions, CurlContent, CurlException]
exit-codes: [0]
references: [surl-readme, rfc5321]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: One CurlRequest with three MailRecipients is answered 250; three store-changed events name Ann's, Bob's and Cy's INBOX, UID 1 each, and ListMessagesAsync shows one message in each.
    program: send-notice.cs
    args: []
    expect:
      exit: 0
      stdout: "SMTP 250\ndelivered: ann@example.com/INBOX/;UID=1, bob@example.com/INBOX/;UID=1, cy@example.com/INBOX/;UID=1\nann@example.com holds 1\nbob@example.com holds 1\ncy@example.com holds 1\n"

  - id: envelope-not-header
    claim: The envelope decides who gets the message, not its headers; Bob's copy has a To field that names Ann.
    program: send-notice.cs
    args: [header]
    expect:
      exit: 0
      stdout: "SMTP 250\ndelivered: ann@example.com/INBOX/;UID=1, bob@example.com/INBOX/;UID=1, cy@example.com/INBOX/;UID=1\nTo: ann@example.com\n"

  - id: stored-once
    claim: The server's verbose log has one Message stored line for the three recipients, not three.
    program: send-notice.cs
    args: [log]
    expect:
      exit: 0
      stdout: "SMTP 250\ndelivered: ann@example.com/INBOX/;UID=1, bob@example.com/INBOX/;UID=1, cy@example.com/INBOX/;UID=1\nstored once for 3 recipients: 1\n"

  - id: one-refused-abandons-all
    claim: When one recipient is refused, an address outside every mail domain, SendAsync throws a CurlException with code 55, SendError, and the 550, and the message is abandoned.
    program: send-notice.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "refused: curl error 55 SendError: RCPT failed: 550\n"

  - id: nothing-for-dee
    claim: Dee, who was named before the refused recipient, holds no message; the server stored nothing for her.
    program: send-notice.cs
    args: [refused-none]
    expect:
      exit: 0
      stdout: "refused: curl error 55 SendError: RCPT failed: 550\ndee@example.com holds 0\n"

  - id: allowfails
    claim: With MailRecipientAllowFails the send goes to the recipients that were accepted and is answered 250, though Carol was refused; Fay receives her copy.
    program: send-notice.cs
    args: [allowfails]
    expect:
      exit: 0
      stdout: "SMTP 250\ndelivered: fay@example.com/INBOX/;UID=1\nfay@example.com holds 1\n"

  - id: unknown-in-domain
    claim: An address inside the domain that is no mailbox is answered 250 and its copy discarded, with no event of its own; Gus still receives his copy.
    program: send-notice.cs
    args: [unknown]
    expect:
      exit: 0
      stdout: "SMTP 250\ndelivered: gus@example.com/INBOX/;UID=1\ngus@example.com holds 1\n"

  - id: same-address-twice
    claim: An address named twice gets one copy, not two; Hal is named twice and Ivy once, and after Ivy's delivery event Hal holds one message.
    program: send-notice.cs
    args: [twice]
    expect:
      exit: 0
      stdout: "SMTP 250\ndelivered: hal@example.com/INBOX/;UID=1, ivy@example.com/INBOX/;UID=1\nhal@example.com holds 1\nivy@example.com holds 1\n"
