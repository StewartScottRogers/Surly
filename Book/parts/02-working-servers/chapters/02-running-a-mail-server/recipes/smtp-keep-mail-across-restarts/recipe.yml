# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-keep-mail-across-restarts
title: Keeping Mail Across Restarts
protocols: [smtp, imap]
tier: working-servers
surl-options: [--directory, --mail-domain, --mailbox]
curl-options: [--crlf, -u, --mail-from, --mail-rcpt, -T, --next, -s, -S, -o, -X, --retry, --retry-all-errors, --retry-delay]
exit-codes: [0, 124]
references: [surl-readme, curl-manual, rfc5321, rfc9051]

# order.eml is the first message, later.eml the one sent after the restart. data/readme.txt only makes the folder
# data exist, as surl needs; mail goes under data/.surl/mail.
fixtures:
  order.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 1042 has shipped\n\nYour order is on its way.\n"
  later.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 1043 has shipped\n\nYour second order is on its way.\n"
  data/readme.txt: "the server's data directory\n"

# kept: --directory data, so mail is written to disk. memory: the same options without it.
servers:
  kept:
    command: surl --directory data --mail-domain example.com --mailbox shop@example.com:shoppass --mailbox ann@example.com:annpass smtp://127.0.0.1:{{port}}/ imap://127.0.0.1:{{port2}}/
    ready: port
  memory:
    command: surl --mail-domain example.com --mailbox shop@example.com:shoppass --mailbox ann@example.com:annpass smtp://127.0.0.1:{{port3}}/ imap://127.0.0.1:{{port4}}/
    ready: port

# Before the first case: the shop mails Ann on each server; the test waits, bounded, until she can read it, and flags it on the kept one.
seed:
  - curl -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T order.eml smtp://127.0.0.1:{{port}}/example.com --next -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T order.eml smtp://127.0.0.1:{{port3}}/example.com
  - curl -sS --retry 10 --retry-all-errors --retry-delay 1 -o {{null}} -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX;UID=1" --next -sS --retry 10 --retry-all-errors --retry-delay 1 -o {{null}} -u ann@example.com:annpass "imap://127.0.0.1:{{port4}}/INBOX;UID=1"
  - curl -sS -u ann@example.com:annpass -X "STORE 1 +FLAGS \Flagged" imap://127.0.0.1:{{port2}}/INBOX

cases:
  - id: solution
    role: solution
    claim: After the server with --directory data is stopped outright and started again with the same command, an IMAP fetch of Ann's first message returns its text.
    restart: [kept]
    run: curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX;UID=1;SECTION=TEXT"
    expect:
      exit: 0
      stdout-matches: '\AYour order is on its way\.\r?\n\Z'

  - id: on-disk
    claim: The mail store is under data/.surl/mail, an index beside the lock file, and the folder is the one the server was given.
    run: curl -sS -o {{null}} -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX;UID=1"
    expect:
      exit: 0
      files:
        data/.surl/mail/index: null
        data/.surl/lock: null

  - id: uids-carry-on
    claim: After the restart the INBOX still holds one message and its next UID is still 2, so a client that remembers UIDs need not start over.
    run: curl -sS -u ann@example.com:annpass -X "STATUS INBOX (MESSAGES UIDNEXT)" imap://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '\* STATUS INBOX \(MESSAGES 1 UIDNEXT 2\)'

  - id: flags-kept
    claim: A flag set before the restart is still set after it; the flagged search finds the message.
    run: curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX?FLAGGED"
    expect:
      exit: 0
      stdout: "* SEARCH 1\n"

  - id: new-mail-continues
    claim: The restarted server takes new mail as before; a second message to Ann becomes UID 2 and she holds two.
    run: 'curl -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T later.eml smtp://127.0.0.1:{{port}}/example.com --next -sS --retry 10 --retry-all-errors --retry-delay 1 -o {{null}} -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX;UID=2" --next -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX?ALL"'
    expect:
      exit: 0
      stdout: "* SEARCH 1 2\n"

  - id: second-restart
    claim: A second restart keeps what was added since the first; both messages are there.
    restart: [kept]
    run: curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX?ALL"
    expect:
      exit: 0
      stdout: "* SEARCH 1 2\n"

  - id: directory-in-use
    claim: A second surl cannot use the directory while the first runs; it stops with exit 124 and says so.
    run: surl --directory data --mail-domain example.com --mailbox ann@example.com:annpass smtp://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout-matches: '^surl: \(124\) Directory data is in use by another surl process\n'

  - id: memory-before
    claim: The server without --directory holds the same message while it runs.
    run: curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port4}}/INBOX?ALL"
    expect:
      exit: 0
      stdout: "* SEARCH 1\n"

  - id: memory-forgets
    claim: Without --directory a restart starts the mail store over; the mailboxes are back, from the command line, and Ann's is empty.
    restart: [memory]
    run: curl -sS -u ann@example.com:annpass -X "STATUS INBOX (MESSAGES)" imap://127.0.0.1:{{port4}}/
    expect:
      exit: 0
      stdout-matches: '\* STATUS INBOX \(MESSAGES 0\)'
