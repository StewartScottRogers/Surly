# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: imap-search-a-mailbox
title: Searching a Mailbox and Fetching a Match
protocols: [imap, smtp]
tier: working-servers
surl-options: [--allow-anonymous]
curl-options: [-X, --next, --crlf, --mail-from, --mail-rcpt, -T, -v]
exit-codes: [0, 21, 67]
references: [surl-readme, curl-readme, rfc9051, rfc5321]

fixtures:
  lunch.txt: "From: ann@example.com\nTo: bob@example.com\nSubject: Lunch\n\nNoon at the usual place.\n"
  invoice42.txt: "From: carol@example.com\nTo: bob@example.com\nSubject: Invoice 42\n\nPlease pay invoice 42.\n"
  invoice43.txt: "From: carol@example.com\nTo: bob@example.com\nSubject: Invoice 43\n\nPlease pay invoice 43.\n"

servers:
  main:
    command: surl --allow-anonymous smtp://127.0.0.1:{{port}}/ imap://127.0.0.1:{{port2}}/
    ready: port

# The cases run in order against the same server: three messages arrive, then INBOX
# is searched and the matches fetched.
cases:
  - id: deliver-three
    claim: Three messages are delivered over SMTP in one curl, so INBOX holds messages 1 (Lunch, from ann), 2 (Invoice 42, from carol) and 3 (Invoice 43, from carol).
    run: curl --crlf --mail-from ann@example.com --mail-rcpt bob@example.com -T lunch.txt smtp://127.0.0.1:{{port}}/example.com --next --crlf --mail-from carol@example.com --mail-rcpt bob@example.com -T invoice42.txt smtp://127.0.0.1:{{port}}/example.com --next --crlf --mail-from carol@example.com --mail-rcpt bob@example.com -T invoice43.txt smtp://127.0.0.1:{{port}}/example.com
    expect:
      exit: 0
      stdout: ""

  - id: list-mailboxes
    claim: An IMAP URL with no mailbox lists the mailboxes; the anonymous store has INBOX.
    run: curl imap://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: "* LIST (\\HasNoChildren) \"/\" INBOX\n"

  - id: solution
    role: solution
    claim: A query after the mailbox is sent as an IMAP SEARCH; SUBJECT invoice matches messages 2 and 3, case ignored.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX?SUBJECT%20invoice"
    expect:
      exit: 0
      stdout: "* SEARCH 2 3\n"

  - id: fetch-a-match
    claim: ;UID=3 then fetches the whole of one match.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX;UID=3"
    expect:
      exit: 0
      stdout-matches: 'From: carol@example\.com\nTo: bob@example\.com\nSubject: Invoice 43\n\nPlease pay invoice 43\.\n$'

  - id: fetch-the-subject
    claim: ;SECTION=HEADER.FIELDS (SUBJECT) fetches only that header of a match.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX;UID=2;SECTION=HEADER.FIELDS%20(SUBJECT)"
    expect:
      exit: 0
      stdout: "Subject: Invoice 42\n\n"

  - id: criteria-and
    claim: Criteria in a row must all match; FROM carol SUBJECT 43 matches message 3 only.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX?FROM%20carol%20SUBJECT%2043"
    expect:
      exit: 0
      stdout: "* SEARCH 3\n"

  - id: criteria-or
    claim: OR takes the next two criteria and matches either; OR FROM ann SUBJECT 43 matches messages 1 and 3.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX?OR%20FROM%20ann%20SUBJECT%2043"
    expect:
      exit: 0
      stdout: "* SEARCH 1 3\n"

  - id: body
    claim: BODY searches the message text, not the headers; BODY noon matches message 1.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX?BODY%20noon"
    expect:
      exit: 0
      stdout: "* SEARCH 1\n"

  - id: quoted-phrase
    claim: A phrase with a space is quoted (%22); SUBJECT "invoice 42" matches message 2.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX?SUBJECT%20%22invoice%2042%22"
    expect:
      exit: 0
      stdout: "* SEARCH 2\n"

  - id: unquoted-phrase
    claim: Unquoted, the 42 of SUBJECT invoice 42 is a second criterion, message number 42, which no message has, so nothing matches and curl still exits 0.
    run: curl "imap://127.0.0.1:{{port2}}/INBOX?SUBJECT%20invoice%2042"
    expect:
      exit: 0
      stdout: "* SEARCH\n"

  - id: uid-search
    claim: -X "UID SEARCH ..." answers with UIDs rather than message numbers; in a mailbox nothing has been removed from, they are the same.
    run: curl -X "UID SEARCH SUBJECT invoice" imap://127.0.0.1:{{port2}}/INBOX
    expect:
      exit: 0
      stdout: "* SEARCH 2 3\n"

  - id: bad-criterion
    claim: A search key IMAP does not have is refused with BAD, and curl exits 21.
    run: curl -v "imap://127.0.0.1:{{port2}}/INBOX?BOGUS"
    expect:
      exit: 21
      stderr-contains: "BAD Invalid arguments"

  - id: missing-mailbox
    claim: Searching a mailbox that does not exist fails at SELECT, and curl exits 67.
    run: curl "imap://127.0.0.1:{{port2}}/Archive?ALL"
    expect:
      exit: 67
      stdout: ""

  - id: create-and-list
    claim: After -X "CREATE Archive", the list shows both mailboxes, and a search of the new one finds nothing.
    run: curl -X "CREATE Archive" imap://127.0.0.1:{{port2}}/ --next imap://127.0.0.1:{{port2}}/ --next "imap://127.0.0.1:{{port2}}/Archive?ALL"
    expect:
      exit: 0
      stdout: "* LIST (\\HasNoChildren) \"/\" INBOX\n* LIST (\\HasNoChildren) \"/\" Archive\n* SEARCH\n"
