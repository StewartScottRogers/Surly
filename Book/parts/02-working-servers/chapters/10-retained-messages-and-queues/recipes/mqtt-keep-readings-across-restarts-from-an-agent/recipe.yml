# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: mqtt-keep-readings-across-restarts-from-an-agent
title: Keeping Readings Across Restarts from an Agent
protocols: [mqtt]
tier: working-servers
surface: mcp
mcp-tools: [start_server, stop_server, publish_message, wait_for_event, read_retained_message, curl]
curl-options: [-s, -S, -d]
exit-codes: [0, 8, 37, 124]
references: [surl-readme, curl-readme, curl-protocols, mqtt311, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "Two readings are published through the curl tool and waited for with wait_for_event; after stop_server and a second start_server on the same --directory, a subscriber reads the kitchen's 21.5, and read_retained_message holds it at QoS 0."
    program: program.cs
    args: [restart]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp: subscriber reads 21.5\nkept: 21.5 at QoS 0\n"

  - id: every-topic
    claim: "Every topic that was kept comes back: a subscription to sensors/# is sent both readings, the hall's 19.0 and the kitchen's 21.5, 49 bytes in all."
    program: program.cs
    args: [every-topic]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/#: 49 bytes, hall True, kitchen True\n"

  - id: on-disk
    claim: "While the broker runs the folder holds the lock file and the retained messages, .surl/bus/retained; after stop_server both files are still there, the lock as a stale file that is no obstacle to the next broker."
    program: program.cs
    args: [on-disk]
    timeout: 90
    expect:
      exit: 0
      stdout: "running: lock True, retained True\nstopped: lock True, retained True\n"

  - id: outside-the-filter
    claim: "A curl publish outside the filter, to lab/kitchen/temp, was never kept, so after the restart read_retained_message answers retained false and a subscriber reads nothing, while the kitchen's reading under the filter is there."
    program: program.cs
    args: [outside]
    timeout: 90
    expect:
      exit: 0
      stdout: "lab/kitchen/temp, kept: nothing\nlab/kitchen/temp: subscriber reads nothing\nsensors/kitchen/temp, kept: 21.5 at QoS 0\n"

  - id: seeded-reading
    claim: "A reading seeded with publish_message and retain true is written to the folder too, and is there after the restart."
    program: program.cs
    args: [seeded]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp, kept: 21.5 at QoS 0\nsensors/kitchen/temp: subscriber reads 21.5\n"

  - id: second-restart
    claim: "The restarted broker keeps what is published to it: after a new hall reading, 20.0, and a second restart the subscription is sent 20.0 for the hall and 21.5 for the kitchen."
    program: program.cs
    args: [twice]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/#: 49 bytes, hall True, kitchen True\n"

  - id: memory-holds-while-running
    claim: "A broker started with no --directory is read the same reading while it runs."
    program: program.cs
    args: [memory-holds]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp: subscriber reads 21.5\n"

  - id: memory-forgets
    claim: "Without --directory a restart starts the retained messages over: the subscriber reads nothing and read_retained_message answers retained false."
    program: program.cs
    args: [memory]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp: subscriber reads nothing\nkept: nothing\n"

  - id: directory-in-use
    claim: "A second start_server on the folder while the first broker runs is a tool error with exit code 124, Directory in use by another surl process."
    program: program.cs
    args: [in-use]
    timeout: 90
    expect:
      exit: 0
      stdout: "second broker: exit 124, in use: True\n"

  - id: directory-must-exist
    claim: "A --directory that does not exist is a tool error at the start, exit code 37, Could not open directory."
    program: program.cs
    args: [missing]
    timeout: 90
    expect:
      exit: 0
      stdout: "exit 37, could not open: True\n"

  - id: closed-without-anonymous
    claim: "The filter does not open the broker: without --allow-anonymous the curl tool's publish exits 8, with Expected 0000 but got 0005 on standard error."
    program: program.cs
    args: [closed]
    timeout: 90
    expect:
      exit: 0
      stdout: "client refused: exit 8, curl: (8) Expected 0000 but got 0005\n"
