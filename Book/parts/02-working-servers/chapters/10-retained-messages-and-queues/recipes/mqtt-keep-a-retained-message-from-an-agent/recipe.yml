# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: mqtt-keep-a-retained-message-from-an-agent
title: Keeping a Retained Message from an Agent
protocols: [mqtt]
tier: working-servers
surface: mcp
mcp-tools: [start_server, publish_message, read_retained_message, wait_for_event, curl]
curl-options: [-s, -S, -d]
exit-codes: [0, 8]
references: [surl-readme, curl-readme, curl-protocols, mqtt311, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A reading seeded with publish_message and retain true is what a later subscriber reads through the curl tool, a second subscriber reads it too, and read_retained_message holds it at QoS 0.
    program: program.cs
    args: [seed]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp: subscriber reads 21.5\nsensors/kitchen/temp: subscriber reads 21.5\nkept: 21.5 at QoS 0\n"

  - id: through-the-filter
    claim: A reading that the curl tool publishes, with the retain flag clear, under the declared filter sensors/# is kept, once the agent has waited for the end of curl's connection with wait_for_event, and a later subscriber reads it.
    program: program.cs
    args: [filter]
    timeout: 90
    expect:
      exit: 0
      stdout: "kept: 21.5 at QoS 0\nsensors/kitchen/temp: subscriber reads 21.5\n"

  - id: last-reading-wins
    claim: A second publish to the same topic replaces the first, so a later subscriber reads only the newer reading.
    program: program.cs
    args: [replaced]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp: subscriber reads 22.0\n"

  - id: one-per-topic
    claim: Each topic keeps its own reading, so a publish to sensors/hall/temp leaves the kitchen's alone.
    program: program.cs
    args: [topics]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/hall/temp: subscriber reads 19.0\nsensors/kitchen/temp: subscriber reads 22.0\n"

  - id: outside-the-filter
    claim: A curl publish on a topic outside the filter is not kept, while a message seeded with publish_message on the same topic is, because retain true sets the flag.
    program: program.cs
    args: [outside]
    timeout: 90
    expect:
      exit: 0
      stdout: "client publish, kept: nothing\nseeded, kept: 21.5 at QoS 0\nlab/kitchen/temp: subscriber reads 21.5\n"

  - id: no-filter
    claim: A broker started with no --topic keeps nothing a curl publish sends, but a seeded message is kept.
    program: program.cs
    args: [no-filter]
    timeout: 90
    expect:
      exit: 0
      stdout: "client publish, kept: nothing\nseeded, kept: 21.5 at QoS 0\nsensors/kitchen/temp: subscriber reads 21.5\n"

  - id: empty-message-clears
    claim: An empty message clears the topic, so a later subscriber reads nothing and read_retained_message answers retained false.
    program: program.cs
    args: [clear]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/hall/temp: subscriber reads nothing\nkept: nothing\n"

  - id: closed-without-anonymous
    claim: The seed needs no login, but on a broker without --allow-anonymous the curl tool's subscription is refused with exit code 8 and Expected 0000 but got 0005 on standard error.
    program: program.cs
    args: [closed]
    timeout: 90
    expect:
      exit: 0
      stdout: "sensors/kitchen/temp: subscriber refused: exit 8, curl: (8) Expected 0000 but got 0005\n"
