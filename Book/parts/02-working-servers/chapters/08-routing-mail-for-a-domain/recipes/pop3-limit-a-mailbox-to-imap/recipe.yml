# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: pop3-limit-a-mailbox-to-imap
title: Limiting a Mailbox to IMAP
protocols: [pop3, imap, smtp]
tier: working-servers
surl-options: [-v, --log-file, --mail-domain, --mailbox]
curl-options: [-s, -S, -v, -u, -o, -X, --crlf, --mail-from, --mail-rcpt, -T, --retry, --retry-all-errors, --retry-delay]
exit-codes: [0, 67]
references: [surl-readme, curl-manual, rfc1939, rfc9051]

# order.eml is the mail waiting for ann. wait-for-log.sh is the test's bounded read of the server's log.
fixtures:
  order.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 1042 shipped\n\nYour order is on its way.\n"
  wait-for-log.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Waits, at most ten seconds, until the log holds <count> lines with <text>, then prints them
    # without their exchange numbers. Exit 1 if they never come.
    # Usage: sh wait-for-log.sh <text> <count> <log file>
    tries=0
    until [ "$(grep -c -F -- "$1" "$3")" -ge "$2" ]; do
      tries=$((tries + 1))
      [ "$tries" -ge 10 ] && exit 1
      sleep 1
    done
    grep -F -- "$1" "$3" | sed 's/^#[0-9]* //'

# ann logs in over IMAP only; bob over every mail protocol; shop sends ann her mail.
servers:
  main:
    command: surl -v --log-file surl.log --mail-domain example.com --mailbox "ann@example.com:annpass;protocols=imap" --mailbox bob@example.com:bobpass --mailbox shop@example.com:shoppass smtp://127.0.0.1:{{port}}/ imap://127.0.0.1:{{port2}}/ pop3://127.0.0.1:{{port3}}/
    ready: port

# The shop's mail to ann, then a wait (at most ten tries a second apart) until it is in her INBOX.
seed:
  - curl -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T order.eml smtp://127.0.0.1:{{port}}/shop.example.com
  - curl -sS -o {{null}} --retry 10 --retry-all-errors --retry-delay 1 -u ann@example.com:annpass -X "FETCH 1 FLAGS" imap://127.0.0.1:{{port2}}/INBOX

cases:
  - id: solution
    role: solution
    claim: A mail client that tries POP3 with ann's right password is refused, exit 67, Login denied.
    run: curl -sS -u ann@example.com:annpass pop3://127.0.0.1:{{port3}}/
    expect:
      exit: 67
      stderr-contains: "curl: (67) Login denied"

  - id: pop3-reply
    claim: The POP3 server answers her login -ERR [AUTH] Authentication failed.
    run: curl -s -v -u ann@example.com:annpass pop3://127.0.0.1:{{port3}}/
    expect:
      exit: 67
      stderr-contains: "< -ERR [AUTH] Authentication failed"

  - id: like-no-account
    claim: An address with no mailbox at all, nobody@example.com, gets the same reply, so the refusal does not tell a client that ann exists.
    run: curl -s -v -u nobody@example.com:annpass pop3://127.0.0.1:{{port3}}/
    expect:
      exit: 67
      stderr-contains: "< -ERR [AUTH] Authentication failed"

  - id: like-a-wrong-password
    claim: A wrong password for bob, who may use POP3, gets the same reply too.
    run: curl -s -v -u bob@example.com:wrong pop3://127.0.0.1:{{port3}}/
    expect:
      exit: 67
      stderr-contains: "< -ERR [AUTH] Authentication failed"

  - id: imap-reads-it
    claim: Over IMAP the same login reads the mail SMTP delivered to her.
    run: curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX;UID=1;SECTION=HEADER.FIELDS%20(SUBJECT)"
    expect:
      exit: 0
      stdout: "Subject: Order 1042 shipped\n\n"

  - id: fall-back-to-imap
    claim: A client that falls back to IMAP when POP3 is refused gets the mail, and the command exits 0.
    run: curl -sS -u ann@example.com:annpass pop3://127.0.0.1:{{port3}}/ || curl -sS -u ann@example.com:annpass "imap://127.0.0.1:{{port2}}/INBOX?ALL"
    expect:
      exit: 0
      stdout: "* SEARCH 1\n"
      stderr-contains: "curl: (67) Login denied"

  - id: log-names-the-protocols
    claim: The server's log names at start the protocols ann logs in on, IMAP alone.
    run: 'grep "^\* Mailbox ann@example.com:" surl.log'
    expect:
      exit: 0
      stdout: "* Mailbox ann@example.com: logins on imap\n"

  - id: log-gives-no-reason
    claim: The log records each refused POP3 login alike, a refused CRAM-MD5 login and the account named, whether the mailbox is limited, missing or given a wrong password; the test waits at most ten seconds for the five lines.
    run: 'sh wait-for-log.sh "Login refused: " 5 surl.log'
    timeout: 30
    expect:
      exit: 0
      stdout: |
        * Login refused: CRAM-MD5 ann@example.com
        * Login refused: CRAM-MD5 ann@example.com
        * Login refused: CRAM-MD5 nobody@example.com
        * Login refused: CRAM-MD5 bob@example.com
        * Login refused: CRAM-MD5 ann@example.com
