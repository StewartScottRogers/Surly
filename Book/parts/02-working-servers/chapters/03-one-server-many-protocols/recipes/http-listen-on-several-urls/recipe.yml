# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: http-listen-on-several-urls
title: Listening on Several URLs at Once
protocols: [http]
tier: working-servers
surl-options: [--directory]
curl-options: [--next, -s, -o, -w]
exit-codes: [0, 7, 45, 124]
references: [surl-readme, curl-readme]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/ http://127.0.0.1:{{port2}}/ http://localhost:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Each of the three listen URLs answers, from the same directory; curl fetches the file from all three in one command, joined by --next.
    run: curl http://127.0.0.1:{{port}}/hello.txt --next http://127.0.0.1:{{port2}}/hello.txt --next http://localhost:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\nhello from surl\nhello from surl\n"

  - id: same-answers
    claim: The listeners serve one store, so a path missing on one is missing on another; the second listener answers 404 Not Found as the first would.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/missing.txt
    expect:
      exit: 0
      stdout: "404"

  - id: directory-held
    claim: A second surl process given the same directory is refused, exit 124, so several listeners over one directory belong in one process.
    run: surl --directory site http://127.0.0.1:{{port4}}/
    expect:
      exit: 124
      stdout: ""
      stderr-contains: "is in use by another surl process"

  - id: one-bind-fails-all-fail
    claim: If any listen URL cannot bind, here a port the first surl holds, surl exits 45 naming it, and serves on none of its listen URLs.
    run: surl http://127.0.0.1:{{port5}}/ http://127.0.0.1:{{port}}/
    expect:
      exit: 45
      stdout: ""
      stderr-contains: "Could not bind http://127.0.0.1:"

  - id: nothing-left-listening
    claim: The listen URL that could have bound is not left listening; curl cannot connect, exit 7.
    run: curl -s http://127.0.0.1:{{port5}}/hello.txt
    expect:
      exit: 7
      stdout: ""
