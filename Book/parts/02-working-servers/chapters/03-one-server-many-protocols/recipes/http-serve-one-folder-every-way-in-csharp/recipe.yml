# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: http-serve-one-folder-every-way-in-csharp
title: Serving One Folder Every Way in C#
protocols: [http, ftp, tftp, gopher, dict, ws]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerFiles, CurlClient, CurlRequest, CurlResponse, CurlWebSocket, CurlWebSocketMessage, CurlException]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, rfc9110, rfc959, rfc1350, rfc1436, rfc2229, rfc6455]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: One Surl.Api server with six listen URLs on port 0 serves one in-memory file; Curl.Api gets the same 16 bytes over HTTP, FTP, TFTP, Gopher and WebSocket, and a DICT reply holding them as a definition.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout: "http: 16 bytes, the served bytes\nftp: 16 bytes, the served bytes\ntftp: 16 bytes, the served bytes\ngopher: 16 bytes, the served bytes\ndict: 157 bytes, a DICT reply holding them\nws: 16 bytes, the served bytes\n"

  - id: one-store
    claim: The six listeners read one store, so a file replaced with Files.PutAsync after the start is served new over all six.
    program: program.cs
    args: [replaced]
    expect:
      exit: 0
      stdout-matches: '^http: 23 bytes, the served bytes\nftp: 23 bytes, the served bytes\ntftp: 23 bytes, the served bytes\ngopher: 23 bytes, the served bytes\ndict: \d+ bytes, a DICT reply holding them\nws: 23 bytes, the served bytes\n$'

  - id: ftp-needs-a-login
    claim: Without AllowAnonymous and with no account, Curl.Api's anonymous FTP login is refused with CurlException LoginDenied (67), while the other five still serve the file.
    program: program.cs
    args: [no-anonymous]
    expect:
      exit: 0
      stdout-matches: '^http: 16 bytes, the served bytes\nftp: CurlException LoginDenied \(67\)\ntftp: 16 bytes, the served bytes\ngopher: 16 bytes, the served bytes\ndict: \d+ bytes, a DICT reply holding them\nws: 16 bytes, the served bytes\n$'
