# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: ftp-upload-and-fetch-over-http
title: Sharing Uploaded Files Between FTP and HTTP
protocols: [ftp, http]
tier: working-servers
surl-options: [--directory, --allow-anonymous, --allow-uploads]
curl-options: [-T, --next, -s, -o, -w, -v]
exit-codes: [0, 25, 67]
references: [surl-readme, curl-readme, rfc959, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  notes.txt: "uploaded over ftp\n"
  reply.txt: "uploaded over http\n"

# main is the recipe; in-memory drops --directory; no-uploads and no-anonymous each leave one loosening out,
# so that what each option adds is a case and not a citation.
servers:
  main:
    command: surl --directory site --allow-anonymous --allow-uploads ftp://127.0.0.1:{{port}}/ http://127.0.0.1:{{port2}}/
    ready: port
  in-memory:
    command: surl --allow-anonymous --allow-uploads ftp://127.0.0.1:{{port5}}/ http://127.0.0.1:{{port6}}/
    ready: port
  no-uploads:
    command: surl --allow-anonymous ftp://127.0.0.1:{{port3}}/
    ready: port
  no-anonymous:
    command: surl --allow-uploads ftp://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: not-there-before
    claim: Before the upload, the file is not there to fetch over HTTP; the answer is 404 Not Found.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/notes.txt
    expect:
      exit: 0
      stdout: "404"

  - id: solution
    role: solution
    claim: A file uploaded over FTP with -T is fetched straight back over HTTP from the same surl, in one curl command joined by --next, and written into the served directory.
    run: curl -T notes.txt ftp://127.0.0.1:{{port}}/notes.txt --next http://127.0.0.1:{{port2}}/notes.txt
    expect:
      exit: 0
      stdout: "uploaded over ftp\n"
      files:
        site/notes.txt: "uploaded over ftp\n"

  - id: fetch-over-ftp-too
    claim: The uploaded file is also there over FTP; there is one store, not one per protocol.
    run: curl -s ftp://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout: "uploaded over ftp\n"

  - id: http-upload-fetched-over-ftp
    claim: The other way round works too; an HTTP PUT with -T is answered 201 Created.
    run: curl -s -T reply.txt -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/reply.txt
    expect:
      exit: 0
      stdout: "201"

  - id: http-upload-read-over-ftp
    claim: The file put over HTTP is downloaded over FTP.
    run: curl -s ftp://127.0.0.1:{{port}}/reply.txt
    expect:
      exit: 0
      stdout: "uploaded over http\n"
      files:
        site/reply.txt: "uploaded over http\n"

  - id: in-memory-store-shared
    claim: Without --directory the store is in memory, and it is still one store; a file uploaded over FTP is fetched over HTTP.
    run: curl -T notes.txt ftp://127.0.0.1:{{port5}}/notes.txt --next http://127.0.0.1:{{port6}}/notes.txt
    expect:
      exit: 0
      stdout: "uploaded over ftp\n"

  - id: uploads-refused-by-default
    claim: Without --allow-uploads, the FTP upload is refused (550) and curl exits 25, upload failed.
    run: curl -v -s -T notes.txt ftp://127.0.0.1:{{port3}}/notes.txt
    expect:
      exit: 25
      stdout: ""
      stderr-contains: "< 550"

  - id: anonymous-refused-by-default
    claim: Without --allow-anonymous, curl's anonymous login is refused (530) and curl exits 67, login denied.
    run: curl -v -s -T notes.txt ftp://127.0.0.1:{{port4}}/notes.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "< 530"
