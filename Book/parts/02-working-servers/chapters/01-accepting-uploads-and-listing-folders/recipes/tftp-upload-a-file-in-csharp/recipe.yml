schema: 2
key: tftp-upload-a-file-in-csharp
title: Uploading over TFTP in C#
protocols: [tftp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc1350]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "A PUT with a body to a tftp:// URL on a server with AllowUploads is a TFTP write: SendAsync returns, and the server's store holds the file."
    program: upload.cs
    args: ["stored"]
    expect:
      exit: 0
      stdout: "put: ok\nstored: hostname r1\n"

  - id: read-back
    claim: "The file just written is read back over TFTP, byte for byte."
    program: upload.cs
    args: ["read-back"]
    expect:
      exit: 0
      stdout: "read: hostname r1\n"

  - id: overwrite
    claim: "Uploading to a name that exists replaces the file."
    program: upload.cs
    args: ["overwrite"]
    expect:
      exit: 0
      stdout: "stored: hostname r2\n"

  - id: several-blocks
    claim: "A file of 1,300 bytes, three blocks, is uploaded in whole."
    program: upload.cs
    args: ["several-blocks"]
    expect:
      exit: 0
      stdout: "put: ok\nstored: 1300 bytes\n"

  - id: several-blocks-read-back
    claim: "Read back, the 1,300-byte file is 1,300 bytes."
    program: upload.cs
    args: ["several-blocks-read-back"]
    expect:
      exit: 0
      stdout: "read: 1300 bytes\n"

  - id: no-subfolders
    claim: "A name in a folder is refused: CurlException, Code TftpPerm, 69, and nothing is made."
    program: upload.cs
    args: ["no-subfolders"]
    expect:
      exit: 0
      stdout: "put: TftpPerm (69)\n"

  - id: no-dot-files
    claim: "A name that begins with a dot is refused the same way, 69."
    program: upload.cs
    args: ["no-dot-files"]
    expect:
      exit: 0
      stdout: "put: TftpPerm (69)\n"

  - id: uploads-off
    claim: "With AllowUploads off the write is refused: TftpPerm, 69."
    program: upload.cs
    args: ["uploads-off"]
    expect:
      exit: 0
      stdout: "put: TftpPerm (69)\n"

  - id: uploads-off-error-two
    claim: "The recorded exchange shows the refusal on the wire: an error packet, opcode 5, with TFTP error code 2, access violation."
    program: upload.cs
    args: ["uploads-off-error-two"]
    expect:
      exit: 0
      stdout: "server sent: opcode 5, error 2\n"

  - id: uploads-off-nothing-kept
    claim: "After the refused write the file is not served: the read fails."
    program: upload.cs
    args: ["uploads-off-nothing-kept"]
    expect:
      exit: 0
      stdout: "read: True\n"

  - id: over-the-limit
    claim: "With MaxFileSize 1000 the 1,300-byte file is refused: RemoteDiskFull, 70."
    program: upload.cs
    args: ["over-the-limit"]
    expect:
      exit: 0
      stdout: "put: RemoteDiskFull (70)\n"

  - id: over-the-limit-kept-nothing
    claim: "The refused file was not kept: the store holds nothing under its name."
    program: upload.cs
    args: ["over-the-limit-kept-nothing"]
    expect:
      exit: 0
      stdout: "stored: (nothing)\n"

