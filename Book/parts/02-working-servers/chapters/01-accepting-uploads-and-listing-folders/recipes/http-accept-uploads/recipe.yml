# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-accept-uploads
title: Accepting Uploads over HTTP
protocols: [http]
tier: working-servers
surl-options: [--directory, --allow-uploads, --user, --allow-anonymous]
curl-options: [-T, --digest, -u, -s, -o, -w]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  notes.txt: "uploaded by curl\n"
  drop/readme.txt: "read me\n"

# main: the recipe's server, an account and uploads on.
# no-account: uploads on, no account, so every login is refused.
# anonymous: uploads on and --allow-anonymous, the loosening, in memory.
# no-uploads: an account but uploads off, in memory.
servers:
  main:
    command: surl --directory site --allow-uploads --user alice:s3cret http://127.0.0.1:{{port}}/
    ready: port
  no-account:
    command: surl --directory drop --allow-uploads http://127.0.0.1:{{port2}}/
    ready: port
  anonymous:
    command: surl --allow-uploads --allow-anonymous http://127.0.0.1:{{port3}}/
    ready: port
  no-uploads:
    command: surl --user alice:s3cret http://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --allow-uploads and an account, curl -T with --digest -u uploads notes.txt, exit 0, and the file lands in site byte for byte.
    run: curl --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout: ""
      files:
        site/notes.txt: "uploaded by curl\n"

  - id: read-it-back
    claim: The uploaded file is served at the path it was put to, to a client that logs in.
    run: curl -s --digest -u alice:s3cret http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout: "uploaded by curl\n"

  - id: created
    claim: A new file is answered 201 Created.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/fresh.txt
    expect:
      exit: 0
      stdout: "201"

  - id: replaced
    claim: Putting to the same path again replaces the file and is answered 204 No Content.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/fresh.txt
    expect:
      exit: 0
      stdout: "204"

  - id: trailing-slash-names-it
    claim: A URL that ends in a slash makes curl append the local file name, so -T notes.txt to / stores /notes.txt.
    fixtures:
      notes.txt: "second version\n"
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "204"
      files:
        site/notes.txt: "second version\n"

  - id: missing-folder
    claim: A path whose parent folder does not exist is answered 409 Conflict; surl creates no folders.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/nowhere/notes.txt
    expect:
      exit: 0
      stdout: "409"

  - id: no-login
    claim: An upload with no login is answered 401 Unauthorized.
    run: curl -s -o {{null}} -w "%{http_code}" -T notes.txt http://127.0.0.1:{{port}}/anon.txt
    expect:
      exit: 0
      stdout: "401"

  - id: get-needs-login-too
    claim: Once an account exists, a GET with no login is answered 401 Unauthorized as well.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: wrong-password
    claim: A wrong password is answered 401 Unauthorized.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:wrong -T notes.txt http://127.0.0.1:{{port}}/w.txt
    expect:
      exit: 0
      stdout: "401"

  - id: basic-refused
    claim: Without --digest, curl sends the password in clear with Basic, and surl refuses it unchecked with 403 Forbidden.
    run: curl -s -o {{null}} -w "%{http_code}" -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/b.txt
    expect:
      exit: 0
      stdout: "403"

  - id: no-account-get
    claim: With no account configured, a GET needs no login.
    run: curl http://127.0.0.1:{{port2}}/readme.txt
    expect:
      exit: 0
      stdout: "read me\n"

  - id: no-account-put
    claim: With no account configured, an upload is still refused 401 Unauthorized, even with --allow-uploads, because no login can succeed.
    run: curl -s -o {{null}} -w "%{http_code}" -T notes.txt http://127.0.0.1:{{port2}}/notes.txt
    expect:
      exit: 0
      stdout: "401"

  - id: anonymous-put
    claim: With --allow-anonymous, an upload with no login is accepted, 201 Created.
    run: curl -s -o {{null}} -w "%{http_code}" -T notes.txt http://127.0.0.1:{{port3}}/notes.txt
    expect:
      exit: 0
      stdout: "201"

  - id: anonymous-read-back
    claim: Without --directory the upload is kept in memory and served from there.
    run: curl http://127.0.0.1:{{port3}}/notes.txt
    expect:
      exit: 0
      stdout: "second version\n"

  - id: uploads-off
    claim: Without --allow-uploads, a logged-in upload is answered 405 Method Not Allowed.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port4}}/notes.txt
    expect:
      exit: 0
      stdout: "405"
