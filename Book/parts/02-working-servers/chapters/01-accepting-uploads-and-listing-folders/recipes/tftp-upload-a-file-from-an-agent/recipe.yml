schema: 2
key: tftp-upload-a-file-from-an-agent
title: Uploading over TFTP from an Agent
protocols: [tftp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, transfer, read_file, get_exchanges]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc1350]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "An agent starts a TFTP server with --allow-uploads through surl-mcp, curl-mcp's curl tool uploads a file with -T, exit code 0, and surl-mcp's read_file finds it in the store."
    program: upload.cs
    args: ["stored"]
    expect:
      exit: 0
      stdout: "exit code 0\nstored: hostname r1\n"

  - id: read-back
    claim: "curl-mcp's transfer tool reads the file just written, byte for byte."
    program: upload.cs
    args: ["read-back"]
    expect:
      exit: 0
      stdout: "read: hostname r1\n"

  - id: overwrite
    claim: "Uploading to a name that exists replaces the file."
    program: upload.cs
    args: ["overwrite"]
    expect:
      exit: 0
      stdout: "stored: hostname r2\n"

  - id: several-blocks
    claim: "A file of 1,300 bytes, three blocks, is uploaded in whole, and read_file reports it whole."
    program: upload.cs
    args: ["several-blocks"]
    expect:
      exit: 0
      stdout: "exit code 0\nstored: 1300 bytes\n"

  - id: several-blocks-read-back
    claim: "Read back with the curl tool, the 1,300-byte file is 1,300 bytes."
    program: upload.cs
    args: ["several-blocks-read-back"]
    expect:
      exit: 0
      stdout: "read: 1300 bytes\n"

  - id: no-subfolders
    claim: "A name in a folder is refused with TFTP error 2: curl exits 69 and nothing is made."
    program: upload.cs
    args: ["no-subfolders"]
    expect:
      exit: 0
      stdout: "exit code 69, curl: (69) TFTP: Access Violation\n"

  - id: no-dot-files
    claim: "A name that begins with a dot is refused the same way, 69."
    program: upload.cs
    args: ["no-dot-files"]
    expect:
      exit: 0
      stdout: "exit code 69, curl: (69) TFTP: Access Violation\n"

  - id: uploads-off
    claim: "With uploads off the write is refused: exit code 69, access violation."
    program: upload.cs
    args: ["uploads-off"]
    expect:
      exit: 0
      stdout: "exit code 69, curl: (69) TFTP: Access Violation\n"

  - id: uploads-off-error-two
    claim: "get_exchanges shows the refusal on the wire: an error packet, opcode 5, with TFTP error code 2, access violation."
    program: upload.cs
    args: ["uploads-off-error-two"]
    expect:
      exit: 0
      stdout: "server sent: opcode 5, error 2\n"

  - id: uploads-off-nothing-kept
    claim: "After the refused write the file is not in the store: read_file answers that there is none."
    program: upload.cs
    args: ["uploads-off-nothing-kept"]
    expect:
      exit: 0
      stdout: "stored: (nothing)\n"

  - id: over-the-limit
    claim: "With --max-filesize 1000 the 1,300-byte file is refused: exit code 70, disk full."
    program: upload.cs
    args: ["over-the-limit"]
    expect:
      exit: 0
      stdout: "exit code 70, curl: (70) Disk full or allocation exceeded\n"

  - id: over-the-limit-kept-nothing
    claim: "The refused file was not kept: read_file finds nothing under its name."
    program: upload.cs
    args: ["over-the-limit-kept-nothing"]
    expect:
      exit: 0
      stdout: "stored: (nothing)\n"

