# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-list-a-directory
title: Listing a Directory Served over the Web
protocols: [http, ws]
tier: working-servers
surl-options: [--directory, --list-directories]
curl-options: [-s, -o, -w]
exit-codes: [0, 22]
references: [surl-readme, rfc6455, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/sub/a.txt: "a\n"
  site/.hidden: "not for you\n"
  other/readme.txt: "read me\n"

# main: one surl, one directory, an http and a ws listen URL, listings on.
# no-listings: a ws listen URL on another directory, listings left off.
servers:
  main:
    command: surl --directory site --list-directories http://127.0.0.1:{{port}}/ ws://127.0.0.1:{{port2}}/
    ready: port
  no-listings:
    command: surl --directory other ws://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --list-directories, a WebSocket request for / is answered with the folder's listing as one message, one name a line, a folder's name ending in a slash, and curl prints it and exits 0.
    run: curl ws://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: "hello.txt\nsub/\n"

  - id: dot-names-left-out
    claim: Names beginning with a dot, .hidden and surl's own .surl folder among them, are left out of the listing; the listing above is the whole of it.
    run: curl -s ws://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: "hello.txt\nsub/\n"

  - id: subfolder
    claim: A subfolder is listed the same way, with or without the trailing slash.
    run: curl -s ws://127.0.0.1:{{port2}}/sub/ ws://127.0.0.1:{{port2}}/sub
    expect:
      exit: 0
      stdout: "a.txt\na.txt\n"

  - id: file-as-message
    claim: The same WebSocket listen URL still sends a file's bytes for a file's path.
    run: curl -s ws://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: http-never-lists
    claim: The http listen URL answers a folder 404 Not Found, --list-directories or not, with a body of one line, 404 Not Found, and no listing.
    run: curl -s -w "%{http_code}" http://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "404 Not Found\n404"

  - id: http-serves-files
    claim: The http listen URL serves the same directory's files as usual.
    run: curl http://127.0.0.1:{{port}}/sub/a.txt
    expect:
      exit: 0
      stdout: "a\n"

  - id: http-listener-no-upgrade
    claim: The http listen URL does not take a WebSocket upgrade, so a ws request to its port fails and curl exits 22.
    run: curl -s -o {{null}} ws://127.0.0.1:{{port}}/
    expect:
      exit: 22
      stdout: ""

  - id: missing-folder
    claim: A folder that is not there is refused 404 Not Found, and curl exits 22.
    run: curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port2}}/nowhere/
    expect:
      exit: 22
      stdout: "404"

  - id: listings-off
    claim: Without --list-directories, a folder is refused 404 Not Found as if it were not there, and curl exits 22 with nothing listed.
    run: curl -s -w "%{http_code}" ws://127.0.0.1:{{port3}}/
    expect:
      exit: 22
      stdout: "404"

  - id: listings-off-files-served
    claim: Without --list-directories, files are still sent.
    run: curl -s ws://127.0.0.1:{{port3}}/readme.txt
    expect:
      exit: 0
      stdout: "read me\n"
