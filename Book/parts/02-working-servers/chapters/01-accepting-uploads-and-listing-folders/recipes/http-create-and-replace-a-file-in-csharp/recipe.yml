# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: http-create-and-replace-a-file-in-csharp
title: Creating and Replacing a File in C#
protocols: [http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlServerFiles, SurlFileContents, SurlNotFoundException, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A PUT to a new path is 201 Created and Files.ReadAsync then returns its bytes; a second PUT to the same path is 204 No Content and the store holds the second body; a PUT into a folder that does not exist is 409 Conflict and stores nothing.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^PUT /report.txt: 201 Created; store holds: version one\nPUT /report.txt: 204 No Content; store holds: version two\nPUT /archive/report.txt: 409 Conflict; store holds: no file\n'

  - id: folder-is-not-a-file
    claim: A PUT to a path that names a folder is 409 Conflict, and Files.ReadAsync of a folder throws SurlNotFoundException, as for a missing file.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nPUT /drafts: 409 Conflict; store holds: no file\n$'

  - id: uploads-off
    claim: With AllowUploads off, the default, every logged-in PUT is 405 Method Not Allowed and the store gains nothing; SendAsync throws for none of these statuses.
    program: program.cs
    args: [read-only]
    expect:
      exit: 0
      stdout: "PUT /report.txt: 405 Method Not Allowed; store holds: no file\nPUT /report.txt: 405 Method Not Allowed; store holds: no file\nPUT /archive/report.txt: 405 Method Not Allowed; store holds: no file\nPUT /drafts: 405 Method Not Allowed; store holds: no file\n"
