# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH;
# its argument picks the scenario.
schema: 2
key: http-create-and-replace-a-file-from-an-agent
title: Creating and Replacing Files from an Agent
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, read_file]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  report.txt: "version one\n"
  report-v2.txt: "version two\n"

cases:
  - id: solution
    role: solution
    claim: Through the curl tool, a PUT to a new path is 201 and read_file returns its text, the same path again is 204 and read_file returns the second file, and a path into a missing folder is 409 and read_file finds no file; none of the three is a tool error.
    program: program.cs
    args: [uploads]
    expect:
      exit: 0
      stdout: "PUT /report.txt: 201, exitCode 0, tool error no; read_file: version one\nPUT /report.txt: 204, exitCode 0, tool error no; read_file: version two\nPUT /archive/report.txt: 409, exitCode 0, tool error no; read_file: No file at /archive/report.txt.\n"

  - id: fail-on-conflict
    claim: With -f the 409 is curl exit 22, which the curl tool answers as a tool error, with the -w status still in standardOutput.
    program: program.cs
    args: [fail]
    expect:
      exit: 1
      stdout: "PUT /archive/report.txt: 409, exitCode 22, tool error yes; read_file: No file at /archive/report.txt.\n"

  - id: uploads-off
    claim: A server started without --allow-uploads answers the same logged-in PUT 405 Method Not Allowed and stores nothing.
    program: program.cs
    args: [read-only]
    expect:
      exit: 0
      stdout: "PUT /report.txt: 405, exitCode 0, tool error no; read_file: No file at /report.txt.\n"
