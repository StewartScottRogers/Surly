# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-refuse-a-second-server-on-one-folder
title: Refusing a Second Server on One Folder
protocols: [http, ws, ftp]
tier: working-servers
surl-options: [--directory]
curl-options: []
exit-codes: [0, 124]
references: [surl-readme]

fixtures:
  site/hello.txt: "hello from surl\n"
  other/readme.txt: "read me\n"

# main: the first surl, holding site, with two listen URLs.
# other: a surl on another folder, running alongside.
servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/ ws://127.0.0.1:{{port2}}/
    ready: port
  other:
    command: surl --directory other http://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A second surl given a --directory another surl holds exits 124 at once, with a surl (124) line on standard error naming the folder.
    run: surl --directory site http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout: "surl: (124) Directory site is in use by another surl process\n"

  - id: any-protocol
    claim: The lock is on the folder, not the protocol or the port; a second surl on site that would serve FTP is refused the same way.
    run: surl --directory site ftp://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout: "surl: (124) Directory site is in use by another surl process\n"

  - id: any-spelling
    claim: The same folder named another way, ./site/, is refused too, and the line repeats the name as given.
    run: surl --directory ./site/ http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout: "surl: (124) Directory ./site/ is in use by another surl process\n"

  - id: first-still-serves
    claim: The first surl is untouched and still serves the folder.
    run: curl http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: lock-file
    claim: The first surl holds site through the lock file site/.surl/lock.
    run: curl -s http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      files:
        site/.surl/lock: null

  - id: one-surl-two-listeners
    claim: One surl with two listen URLs serves one folder over both; here the same file over WebSocket.
    run: curl ws://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: another-folder
    claim: A surl on another folder runs alongside the first.
    run: curl http://127.0.0.1:{{port3}}/readme.txt
    expect:
      exit: 0
      stdout: "read me\n"
