# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-upload-several-files-at-once-from-an-agent
title: Uploading Several Files from an Agent
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, list_files]
exit-codes: [0, 1, 26]
references: [surl-readme, curl-readme, rfc9110]

# The files the agent uploads, in the folder both hosts are confined to.
fixtures:
  a.txt: "alpha\n"
  b.txt: "bravo\n"
  c.txt: "charlie\n"

cases:
  - id: solution
    role: solution
    claim: One curl tool call with an -T and a URL for each of a.txt, b.txt and c.txt, logged in with Digest, uploads all three into /reports/, each 201 Created, exitCode 0; list_files then shows the three beside old.txt, with their sizes.
    program: program.cs
    args: [upload]
    expect:
      exit: 0
      stdout: "exitCode: 0\n201 /reports/a.txt\n201 /reports/b.txt\n201 /reports/c.txt\ncurl tool error: no\n/reports: a.txt (6 bytes), b.txt (6 bytes), c.txt (8 bytes), old.txt (15 bytes)\n"

  - id: glob
    claim: The curl tool takes the console's -T "{a,b,c}.txt" as well; each name the glob expands to is inside CURL_MCP_ROOT, and all three are uploaded, 201 Created each.
    program: program.cs
    args: [glob]
    expect:
      exit: 0
      stdout: "exitCode: 0\n201 /reports/a.txt\n201 /reports/b.txt\n201 /reports/c.txt\ncurl tool error: no\n/reports: a.txt (6 bytes), b.txt (6 bytes), c.txt (8 bytes), old.txt (15 bytes)\n"

  - id: glob-outside
    claim: A glob that expands to a name outside CURL_MCP_ROOT, -T "{a,../b}.txt", refuses the whole call before curl runs, a tool error with exitCode null; nothing is uploaded.
    program: program.cs
    args: [glob-outside]
    expect:
      exit: 1
      stdout-matches: "^exitCode: null\nfailure: Refused -T: -T '\\.\\./b\\.txt' resolves to '[^\\n]*', which is outside CURL_MCP_ROOT \\('[^\\n]*'\\)\\.\ncurl tool error: yes\n/reports: old\\.txt \\(15 bytes\\)\n$"

  - id: outside-root
    claim: A file outside CURL_MCP_ROOT anywhere in the list refuses the whole call before curl runs, so not even the files before it are uploaded.
    program: program.cs
    args: [outside-root]
    expect:
      exit: 1
      stdout-matches: "^exitCode: null\nfailure: Refused -T: -T '\\.\\./b\\.txt' resolves to '[^\\n]*', which is outside CURL_MCP_ROOT \\('[^\\n]*'\\)\\.\ncurl tool error: yes\n/reports: old\\.txt \\(15 bytes\\)\n$"

  - id: missing-file
    claim: A file in the list that is not there stops curl at it with exitCode 26, a tool error; the file before it was uploaded and the one after it was not sent.
    program: program.cs
    args: [missing-file]
    expect:
      exit: 1
      stdout: "exitCode: 26\n201 /reports/a.txt\n000 /reports/missing.txt\nfailure: curl: cannot open 'missing.txt'\ncurl tool error: yes\n/reports: a.txt (6 bytes), old.txt (15 bytes)\n"

  - id: no-login
    claim: Without a login each upload is answered 401 Unauthorized, with that line as its body, which to the curl tool is a successful call, exitCode 0 and no tool error; list_files shows nothing new.
    program: program.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "exitCode: 0\n401 Unauthorized\n401 /reports/a.txt\n401 Unauthorized\n401 /reports/b.txt\n401 Unauthorized\n401 /reports/c.txt\ncurl tool error: no\n/reports: old.txt (15 bytes)\n"
