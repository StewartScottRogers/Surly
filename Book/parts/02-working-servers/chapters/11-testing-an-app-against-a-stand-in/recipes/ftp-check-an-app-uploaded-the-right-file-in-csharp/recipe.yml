schema: 2
key: ftp-check-an-app-uploaded-the-right-file-in-csharp
title: Checking an App's Upload in C#
protocols: [ftp, http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFileContents, SurlNotFoundException, CurlClient, CurlRequest, CurlContent, CurlResponse, CurlFtpOptions, FtpCreateMissingDirectories, CurlException]
exit-codes: [0, 1, 9, 67]
references: [surl-readme, curl-readme, rfc959, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "The app uploads tonight's export over FTP; the check reads /exports/nightly.csv with Files.ReadAsync, finds it the same as the expected bytes, prints so and returns 0."
    program: program.cs
    args: ["matches"]
    expect:
      exit: 0
      stdout: "matches expected\n"

  - id: same-store-over-http
    claim: "The file the app stored over FTP is served over HTTP at the same path, from the same store: a GET on the second bound URL answers 200 with the export."
    program: program.cs
    args: ["over-http"]
    expect:
      exit: 0
      stdout: "200\nid,region,total\n1,north,42\n2,south,17\n"

  - id: broken-app-finishes
    claim: "An app that uploads its export without the last row finishes without an exception, so nothing in the app itself says the file is wrong."
    program: program.cs
    args: ["broken-app"]
    expect:
      exit: 0
      stdout: "app finished\n"

  - id: mismatch-fails
    claim: "The check finds the file differs from the expected bytes, says it holds 27 bytes where 38 were expected, and returns 1, which is the failing test."
    program: program.cs
    args: ["mismatch"]
    expect:
      exit: 1
      stdout: "differs from expected: expected 38 bytes, arrived 27\n"

  - id: missing-file-fails
    claim: "When the file never arrived, Files.ReadAsync throws SurlNotFoundException and the check says nothing arrived and returns 1."
    program: program.cs
    args: ["missing"]
    expect:
      exit: 1
      stdout: "nothing arrived at /exports/nightly-2.csv\n"

  - id: uploads-off-refused
    claim: "Without AllowUploads the server refuses to make the exports folder, the first write the app asks for: CurlException with code 9, RemoteAccessDenied."
    program: program.cs
    args: ["uploads-off"]
    expect:
      exit: 9
      stdout: "refused: curl code 9 RemoteAccessDenied\n"

  - id: login-needed
    claim: "Without AllowAnonymous and with no account given, the app's anonymous login is refused: CurlException with code 67, LoginDenied."
    program: program.cs
    args: ["login-needed"]
    expect:
      exit: 67
      stdout: "refused: curl code 67 LoginDenied\n"
