schema: 2
key: ftp-check-an-app-cleaned-up-in-csharp
title: Checking an App Cleaned Up in C#
protocols: [ftp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFolderPage, CurlClient, CurlRequest, CurlContent, CurlResponse, CurlFtpOptions, CurlException]
exit-codes: [0, 1, 19, 21, 25]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "An app that uploads two temporary files and deletes both leaves nothing behind; the check lists the folder with Files.ListAsync, finds no .tmp, prints clean and returns 0."
    program: program.cs
    args: ["clean"]
    expect:
      exit: 0
      stdout: "clean\n"

  - id: kept-files-do-not-count
    claim: "The check looks for temporary files only; keep.txt, which the app was never meant to remove, is still in the folder and does not fail it."
    program: program.cs
    args: ["kept"]
    expect:
      exit: 0
      stdout: "folder holds: keep.txt\n"

  - id: leaky-app
    claim: "An app that deletes only the first of its two temporary files finishes without an exception, so nothing in the app itself says it leaked."
    program: program.cs
    args: ["leaky-app"]
    expect:
      exit: 0
      stdout: "app finished\n"

  - id: leftover-fails
    claim: "The check finds b.tmp, names it and returns 1, which is the failing test."
    program: program.cs
    args: ["leftover"]
    expect:
      exit: 1
      stdout: "leftover: b.tmp\n"

  - id: delete-missing
    claim: "A cleanup that deletes a file the server does not have throws CurlException with code 21, QuoteError, when the listing it rides on has been read."
    program: program.cs
    args: ["delete-missing"]
    expect:
      exit: 21
      stdout: "refused: curl code 21 QuoteError\n"

  - id: client-listing-needs-the-option
    claim: "Without ListDirectories a client cannot list the folder: the request throws CurlException with code 19, FtpCouldntRetrFile."
    program: program.cs
    args: ["client-listing"]
    expect:
      exit: 19
      stdout: "refused: curl code 19 FtpCouldntRetrFile\n"

  - id: server-listing-needs-no-option
    claim: "The server's own Files.ListAsync lists the folder whether or not ListDirectories is set, so a check made that way cannot fail for want of the option."
    program: program.cs
    args: ["server-listing"]
    expect:
      exit: 0
      stdout: "server lists: keep.txt\n"

  - id: uploads-off-refused
    claim: "Without AllowUploads the server refuses the app's first upload: CurlException with code 25, UploadFailed."
    program: program.cs
    args: ["uploads-off"]
    expect:
      exit: 25
      stdout: "refused: curl code 25 UploadFailed\n"

  - id: nothing-written-passes
    claim: "A folder the app never wrote to passes the check too, so a clean listing alone does not show the app ran."
    program: program.cs
    args: ["nothing-written"]
    expect:
      exit: 0
      stdout: "clean\n"
