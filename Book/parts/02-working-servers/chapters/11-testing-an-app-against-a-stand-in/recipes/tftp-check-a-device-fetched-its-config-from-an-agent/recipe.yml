# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: tftp-check-a-device-fetched-its-config-from-an-agent
title: Checking a Config Fetch from an Agent
protocols: [tftp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, wait_for_event, get_exchanges]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, mcp-spec, rfc1350, rfc2347, rfc2348]
triplet: tftp-check-a-device-fetched-its-config

fixtures: {}

# Each case starts its own server holding four 27-byte configs. curl-mcp's curl tool stands in for the
# device's boot loader.
cases:
  - id: solution
    role: solution
    claim: A device that fetches r1.cfg asking for 1,024-byte blocks leaves a finished TFTP exchange; the agent waits for it with wait_for_event and finds in its get_exchanges packets the read request for r1.cfg, the 27 bytes in one data block, acknowledged, and the option acknowledgement that agreed blksize 1024.
    program: check-fetch.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "r1.cfg: read, 27 bytes in 1 data block, all acknowledged\nagreed: blksize 1024\n"

  - id: device-got-the-file
    claim: What the device received is byte for byte the served config.
    program: check-fetch.cs
    args: [got-the-file]
    expect:
      exit: 0
      stdout: "identical\n"

  - id: default-block-size
    claim: A device that asks for no block size of its own, as curl does by default, asks for blksize 512, and the record shows that agreed.
    program: check-fetch.cs
    args: [default]
    expect:
      exit: 0
      stdout: "r2.cfg: read, 27 bytes in 1 data block, all acknowledged\nagreed: blksize 512\n"

  - id: no-options
    claim: A device that sends no options, curl's --tftp-no-options, gets no option acknowledgement, and the read uses 512-byte blocks, the size RFC 1350 fixed.
    program: check-fetch.cs
    args: [no-options]
    expect:
      exit: 0
      stdout: "r3.cfg: read, 27 bytes in 1 data block, all acknowledged\nagreed: no options, 512 by default\n"

  - id: config-missing
    claim: When the device asks for a config the server does not have, the record holds the error packet the server sent, TFTP error 1, and the check fails with exit 1.
    program: check-fetch.cs
    args: [missing]
    expect:
      exit: 1
      stdout: "r9.cfg: asked for, not on the server (error 1)\n"

  - id: device-sees-not-found
    claim: "The device itself is answered with file not found; the curl tool answers exit code 68 and curl's message TFTP: File Not Found."
    program: check-fetch.cs
    args: [device-missing]
    expect:
      exit: 0
      stdout: "device: exit code 68, curl: (68) TFTP: File Not Found\n"

  - id: never-fetched
    claim: A config no device read, r5.cfg, fails the check when wait_for_event answers timed_out after ten seconds, exit 1.
    program: check-fetch.cs
    args: [never]
    expect:
      exit: 1
      stdout: "r5.cfg: never read\n"
