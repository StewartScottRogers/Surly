# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-check-an-app-sent-the-right-mail-in-csharp
title: Checking an App's Mail in C#
protocols: [smtp, imap]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerMail, SurlEventQuery, SurlMailMessage, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions]
exit-codes: [0]
references: [surl-readme, rfc5321, rfc9051]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api and runs every claim's step;
# each case checks one line of what it prints.

cases:
  - id: solution
    role: solution
    claim: "The test waits for the delivery event of ann's mail, at most ten seconds, and the copy ReadMessageAsync returns says Delivered-To ann with the subject the app should write."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "^ann: Delivered-To: ann@example\\.com \\| Subject: Reset your password\\n"

  - id: link
    claim: "A regular expression over the stored copy picks out the reset link exactly."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nann's link: https://app\\.example\\.com/reset/4f9c2a7e\\n"

  - id: one-search
    claim: "One IMAP SEARCH through Curl.Api asks for recipient, subject and link together, and names the message that has all three."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nsearch in ann's INBOX: \\* SEARCH 1\\n"

  - id: local-link-not-found
    claim: "Carol's mail has a link to localhost, so the same search in her INBOX names no message."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nsearch in carol's INBOX: \\* SEARCH\\n"

  - id: local-link-shows
    claim: "Picking any reset link out of her stored copy shows what the app wrote instead."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\ncarol's link: http://localhost:5000/reset/9b03d6e1\\n"

  - id: wrong-recipient-times-out
    claim: "Mail the app addressed To dave but sent to bob never reaches dave's mailbox, and the wait bounded to two seconds throws TimeoutException."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\ndave: TimeoutException after 2 s\\n"

  - id: delivered-to-is-the-envelope
    claim: "In bob's mailbox the stored copy says Delivered-To bob, the envelope recipient, while its To field still says dave."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nbob: Delivered-To: bob@example\\.com \\| To: dave@example\\.com\\n$"
