# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs check-reset-mail.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-check-an-app-sent-the-right-mail-from-an-agent
title: Checking an App's Mail from an Agent
protocols: [smtp, imap]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, wait_for_event, read_message]
curl-options: [-s, -S, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc5321, rfc9051]

# reset.eml is the mail the app should send ann; the other two are the app getting it wrong.
fixtures:
  reset.eml: "From: app@example.com\r\nTo: ann@example.com\r\nSubject: Reset your password\r\n\r\nSomeone asked to reset the password for ann@example.com.\r\nOpen this link to choose a new one:\r\nhttps://app.example.com/reset/4f9c2a7e\r\n"
  local-link.eml: "From: app@example.com\r\nTo: carol@example.com\r\nSubject: Reset your password\r\n\r\nSomeone asked to reset the password for carol@example.com.\r\nOpen this link to choose a new one:\r\nhttp://localhost:5000/reset/9b03d6e1\r\n"
  wrong-to.eml: "From: app@example.com\r\nTo: dave@example.com\r\nSubject: Reset your password\r\n\r\nSomeone asked to reset the password for dave@example.com.\r\nOpen this link to choose a new one:\r\nhttps://app.example.com/reset/c71e0a52\r\n"

cases:
  - id: solution
    role: solution
    claim: "The agent waits for the store_changed event of ann's mail, at most ten seconds, and the copy read_message returns says Delivered-To ann with the subject the app should write."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "^ann: Delivered-To: ann@example\\.com \\| Subject: Reset your password\\n"

  - id: link
    claim: "A regular expression over read_message's text picks out the reset link exactly."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nann's link: https://app\\.example\\.com/reset/4f9c2a7e\\n"

  - id: one-search
    claim: "One IMAP SEARCH through the curl tool asks for recipient, subject and link together, and names the message that has all three."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nsearch in ann's INBOX: \\* SEARCH 1\\n"

  - id: local-link-not-found
    claim: "Carol's mail has a link to localhost, so the same search in her INBOX names no message."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nsearch in carol's INBOX: \\* SEARCH\\n"

  - id: local-link-shows
    claim: "Picking any reset link out of her stored copy shows what the app wrote instead."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\ncarol's link: http://localhost:5000/reset/9b03d6e1\\n"

  - id: wrong-recipient-times-out
    claim: "Mail the app addressed To dave but sent to bob never reaches dave's mailbox, and wait_for_event with timeout_ms 2000 answers timed_out."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\ndave: timed_out after 2000 ms\\n"

  - id: delivered-to-is-the-envelope
    claim: "In bob's mailbox the stored copy says Delivered-To bob, the envelope recipient, while its To field still says dave."
    program: check-reset-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\\nbob: Delivered-To: bob@example\\.com \\| To: dave@example\\.com\\n$"
