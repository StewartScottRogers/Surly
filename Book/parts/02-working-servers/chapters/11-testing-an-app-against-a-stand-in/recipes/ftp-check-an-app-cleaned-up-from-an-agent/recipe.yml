schema: 2
key: ftp-check-an-app-cleaned-up-from-an-agent
title: Checking an App Cleaned Up from an Agent
protocols: [ftp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, list_files]
curl-options: [-T, -Q, -l, -sS]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "An app that uploads two temporary files and deletes both, through the curl tool, leaves nothing behind; list_files finds no .tmp and the agent reports clean."
    program: program.cs
    args: ["clean"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app upload: exit 0\napp cleanup: exit 0\nclean\n"

  - id: kept-files-do-not-count
    claim: "The check looks for temporary files only; keep.txt, which the app was never meant to remove, is still in the folder."
    program: program.cs
    args: ["kept"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app upload: exit 0\napp cleanup: exit 0\nfolder holds: keep.txt\n"

  - id: leaky-app
    claim: "An app that deletes only the first of its two temporary files still finishes with exit 0, so nothing in the app itself says it leaked."
    program: program.cs
    args: ["leaky-app"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app upload: exit 0\napp cleanup: exit 0\n"

  - id: leftover-fails
    claim: "list_files finds b.tmp and the agent names it as a leftover."
    program: program.cs
    args: ["leftover"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app upload: exit 0\napp cleanup: exit 0\nleftover: b.tmp\n"

  - id: delete-missing
    claim: "A cleanup that deletes a file the server does not have is refused, and curl exits 21 saying the quote string was not accepted."
    program: program.cs
    args: ["delete-missing"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app cleanup: exit 21 curl: (21) QUOT string not accepted: DELE gone.tmp\n"

  - id: client-listing-needs-the-option
    claim: "Without --list-directories curl cannot list the folder and exits 19."
    program: program.cs
    args: ["client-listing"]
    timeout: 90
    expect:
      exit: 0
      stdout: "client listing: exit 19 curl: (19) RETR response: 550\n"

  - id: server-listing-needs-no-option
    claim: "list_files lists the folder whether or not --list-directories is set, so a check made that way cannot fail for want of the option."
    program: program.cs
    args: ["server-listing"]
    timeout: 90
    expect:
      exit: 0
      stdout: "list_files /work: keep.txt\n"

  - id: uploads-off-refused
    claim: "Without --allow-uploads the server refuses both of the app's uploads, and curl exits 25."
    program: program.cs
    args: ["uploads-off"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app upload: exit 25 curl: (25) Failed FTP upload: 550\ncurl: (25) Failed FTP upload: 550\n"

  - id: nothing-written-passes
    claim: "A folder the app never wrote to passes the check too, so a clean listing alone does not show the app ran."
    program: program.cs
    args: ["nothing-written"]
    timeout: 90
    expect:
      exit: 0
      stdout: "clean\n"
