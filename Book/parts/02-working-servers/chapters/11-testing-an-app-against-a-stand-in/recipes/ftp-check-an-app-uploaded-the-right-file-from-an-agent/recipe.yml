schema: 2
key: ftp-check-an-app-uploaded-the-right-file-from-an-agent
title: Checking an App's Upload from an Agent
protocols: [ftp, http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, read_file]
curl-options: [-T, --ftp-create-dirs, -s, -sS]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959, rfc9110, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "The app uploads tonight's export through the curl tool; read_file of /exports/nightly.csv answers the same text as the expected file and the agent reports a match."
    program: program.cs
    args: ["matches"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app: exit 0\nmatches expected\n"

  - id: same-store-over-http
    claim: "The file the app stored over FTP is served over HTTP at the same path, from the same store: curl on the second bound URL prints the export."
    program: program.cs
    args: ["over-http"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app: exit 0\nid,region,total\n1,north,42\n2,south,17\n"

  - id: broken-app-exits-0
    claim: "An app that uploads its export without the last row finishes with exit 0, so nothing in the app itself says the file is wrong."
    program: program.cs
    args: ["broken-app"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app: exit 0\n"

  - id: mismatch-fails
    claim: "read_file answers a file that differs from the expected one, with a byte_count of 27 where 38 were expected, and the agent reports the difference."
    program: program.cs
    args: ["mismatch"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app: exit 0\ndiffers from expected: expected 38 bytes, arrived 27\n"

  - id: missing-file
    claim: "When the file never arrived, read_file is a tool error saying there is no file at that path."
    program: program.cs
    args: ["missing"]
    timeout: 90
    expect:
      exit: 0
      stdout: "app: exit 0\nread_file: No file at /exports/nightly-2.csv.\n"

  - id: uploads-off-refused
    claim: "Without --allow-uploads the server refuses to make the exports folder, the first write the app asks for, and curl exits 9."
    program: program.cs
    args: ["uploads-off"]
    timeout: 90
    expect:
      exit: 0
      stdout-matches: '^app: exit 9 curl: \(9\) '

  - id: login-needed
    claim: "Without --allow-anonymous and with no account given, the app's anonymous login is refused and curl exits 67."
    program: program.cs
    args: ["login-needed"]
    timeout: 90
    expect:
      exit: 0
      stdout-matches: '^app: exit 67 curl: \(67\) '
