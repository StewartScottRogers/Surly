# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: pop3-peek-at-headers-with-top-in-csharp
title: Peeking at Headers with TOP in C#
protocols: [pop3]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerMail, SurlMessagePage, SurlMessageSummary, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 1]
references: [surl-readme, rfc1939]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: UIDL through Curl.Api lists three messages with their unique IDs; TOP n 0 for each gives a 73-byte header whose Subject the program parses; only message 2, the delayed order, is retrieved in full, 113 bytes, the size the store gives.
    program: peek-headers.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^1 (\d+)\.1: Order 1 shipped \(73 header bytes\)\n2 \1\.2: Order 2 delayed \(73 header bytes\)\n3 \1\.3: Order 3 shipped \(73 header bytes\)\nretrieved message 2: 113 bytes, the store says 113\n$'

  - id: first-lines
    claim: TOP with the path 2%202 sends TOP 2 2, whose answer after the header's blank line is the first two body lines only.
    program: peek-headers.cs
    args: [lines]
    expect:
      exit: 0
      stdout: "First line.\nSecond line.\n"

  - id: no-such-message
    claim: TOP for message 9, which is not there, throws CurlException with code 8, Weird server reply.
    program: peek-headers.cs
    args: [missing]
    expect:
      exit: 1
      stdout: "curl error 8: Weird server reply\n"

  - id: more-lines-than-body
    claim: TOP 2 99, more lines than the body has, answers the whole message, 113 bytes, the same bytes as RETR 2.
    program: peek-headers.cs
    args: [whole]
    expect:
      exit: 0
      stdout: "TOP 2 99: 113 bytes; RETR 2: 113 bytes; same: True\n"

  - id: ids-outlast-numbers
    claim: After DELE 1 the same client's session lists messages 2 and 3 under their old numbers; once that client is disposed (QUIT) a new client's session numbers them 1 and 2, and each keeps its unique ID, ending .2 and .3.
    program: peek-headers.cs
    args: [after-delete]
    expect:
      exit: 0
      stdout-matches: '^same session:\n2 (\d+)\.2\n3 \1\.3\nnext session:\n1 \1\.2\n2 \1\.3\n$'
