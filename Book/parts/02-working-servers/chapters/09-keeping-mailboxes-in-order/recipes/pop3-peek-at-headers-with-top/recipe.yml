# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: pop3-peek-at-headers-with-top
title: Peeking at Headers with TOP
protocols: [pop3, smtp]
tier: working-servers
surl-options: [--mail-domain, --mailbox]
curl-options: [-u, -X, -s, -S, -v, --crlf, --mail-from, --mail-rcpt, -T, --next, --retry, --retry-all-errors, --retry-delay]
exit-codes: [0, 8]
references: [surl-readme, curl-manual, rfc1939]

fixtures:
  order1.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 1 shipped\n\nYour first order is on its way.\nIt left the warehouse this morning.\nTrack it with code 1111.\n"
  order2.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 2 delayed\n\nYour second order is late.\nA part is out of stock.\nWe will write again within a week.\n"
  order3.eml: "From: shop@example.com\nTo: ann@example.com\nSubject: Order 3 shipped\n\nYour third order is on its way.\nIt left the warehouse this morning.\nTrack it with code 3333.\n"

# One surl: SMTP to put mail in, POP3 to read it, one mail store.
servers:
  main:
    command: surl --mail-domain example.com --mailbox ann@example.com:annpass --mailbox shop@example.com:shoppass smtp://127.0.0.1:{{port}}/ pop3://127.0.0.1:{{port2}}/
    ready: port

# The shop mails ann three orders in one SMTP session; delivery is asynchronous, so the second line
# waits, a try a second for at most ten, until message 3 exists (LIST 3 fails while it does not).
seed:
  - curl -sS --crlf -u shop@example.com:shoppass --mail-from shop@example.com --mail-rcpt ann@example.com -T "order[1-3].eml" smtp://127.0.0.1:{{port}}/example.com
  - curl -sS --retry 10 --retry-all-errors --retry-delay 1 -u ann@example.com:annpass -X "LIST 3" pop3://127.0.0.1:{{port2}}/

cases:
  - id: solution
    role: solution
    claim: In one POP3 session UIDL lists each message's number and unique ID, and TOP 2 0 prints message 2's header and the blank line after it, with no body.
    run: curl -u ann@example.com:annpass -X UIDL pop3://127.0.0.1:{{port2}}/ --next -u ann@example.com:annpass -X "TOP 2 0" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^1 (\d+)\.1\n2 \1\.2\n3 \1\.3\nReturn-Path: <shop@example\.com>\nReceived: from example\.com \(\[127\.0\.0\.1\]\) by surl with ESMTPA; [^\n]+\nFrom: shop@example\.com\nTo: ann@example\.com\nSubject: Order 2 delayed\n\n$'

  - id: first-lines
    claim: TOP 2 2 prints the header, the blank line and the first two lines of the body, and stops there.
    run: curl -u ann@example.com:annpass -X "TOP 2 2" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: 'Subject: Order 2 delayed\n\nYour second order is late\.\nA part is out of stock\.\n$'

  - id: more-lines-than-body
    claim: Asking for more lines than the body has, TOP 2 99, prints the whole message, down to its last line.
    run: curl -u ann@example.com:annpass -X "TOP 2 99" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: 'Subject: Order 2 delayed\n\nYour second order is late\.\nA part is out of stock\.\nWe will write again within a week\.\n$'

  - id: number-in-the-url
    claim: The same TOP can be written as -X TOP with the message number and line count in the URL path, a space encoded as %20.
    run: curl -u ann@example.com:annpass -X TOP pop3://127.0.0.1:{{port2}}/2%200
    expect:
      exit: 0
      stdout-matches: 'Subject: Order 2 delayed\n\n$'

  - id: one-uidl
    claim: UIDL with a message number answers in one line that curl does not print; -v shows it, +OK 2 and message 2's ID.
    run: curl -s -v -u ann@example.com:annpass -X "UIDL 2" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: ""
      stderr-contains: "< +OK 2 "

  - id: ids-outlast-numbers
    claim: After DELE 1, UIDL in the same session lists messages 2 and 3 under their old numbers; the next session, after the deletion took effect at QUIT, numbers them 1 and 2, but each keeps its unique ID, ending .2 and .3.
    run: curl -s -u ann@example.com:annpass -X "DELE 1" pop3://127.0.0.1:{{port2}}/ --next -s -u ann@example.com:annpass -X UIDL pop3://127.0.0.1:{{port2}}/ && curl -s -u ann@example.com:annpass -X UIDL pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '^2 (\d+)\.2\n3 \1\.3\n1 \1\.2\n2 \1\.3\n$'

  - id: no-such-message
    claim: TOP for a message that is not there is answered -ERR No such message, and curl exits 8.
    run: curl -s -S -v -u ann@example.com:annpass -X "TOP 9 0" pop3://127.0.0.1:{{port2}}/
    expect:
      exit: 8
      stderr-contains: "< -ERR No such message"
