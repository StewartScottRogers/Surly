# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: pop3-drain-a-maildrop-in-csharp
title: Draining a POP3 Maildrop in C#
protocols: [pop3]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerMail, SurlMessagePage, SurlMessageSummary, SurlEventQuery, SurlEventKind, SurlEvent, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 8]
references: [surl-readme, rfc1939]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: "Curl.Api lists the maildrop, retrieves messages 1 to 3 into files, then deletes each with DELE, and the program counts three retrieved, three deleted and three files."
    program: program.cs
    args: []
    timeout: 90
    expect:
      exit: 0
      stdout: "retrieved 3, deleted 3, files 3\n"

  - id: retrieved-whole
    claim: "The three files hold the three orders, in the order they arrived, each the same bytes as the message delivered."
    program: program.cs
    args: [whole]
    timeout: 90
    expect:
      exit: 0
      stdout: "msg1.eml: Subject: Order 1 shipped, same as delivered: True\nmsg2.eml: Subject: Order 2 shipped, same as delivered: True\nmsg3.eml: Subject: Order 3 shipped, same as delivered: True\n"

  - id: next-session-empty
    claim: "Once the client that drained it is disposed, a new session finds the maildrop empty: its listing has no lines."
    program: program.cs
    args: [next-session]
    timeout: 90
    expect:
      exit: 0
      stdout: "next session lists 0 messages\n"

  - id: store-is-empty
    claim: "The store, read with ListMessagesAsync and no client, holds no message in INBOX after the drain."
    program: program.cs
    args: [count]
    timeout: 90
    expect:
      exit: 0
      stdout: "in the store after the drain: 0\n"

  - id: drain-of-an-empty-maildrop
    claim: "Retrieving message 1 of the drained maildrop is answered -ERR, and Curl.Api throws a CurlException with code 8, Weird server reply."
    program: program.cs
    args: [empty]
    timeout: 90
    expect:
      exit: 8
      stdout: "curl error 8: Weird server reply\n"

  - id: count-first
    claim: "A GET of the POP3 URL with no message number lists the maildrop, three lines, and the octets in them are the sizes the store gives."
    program: program.cs
    args: [listing]
    timeout: 90
    expect:
      exit: 0
      stdout: "listing: 3 messages, octets match the store: True\n"

  - id: unsaved-mail-is-not-deleted
    claim: "When the folder for the files does not exist, saving message 1 throws before the first DELE, so no DELE is sent."
    program: program.cs
    args: [unwritable]
    timeout: 90
    expect:
      exit: 0
      stdout: "save failed: no DELE sent\n"

  - id: failed-save-kept-everything
    claim: "After that failure, and the end of the session, the store still holds all three messages."
    program: program.cs
    args: [unwritable-kept]
    timeout: 90
    expect:
      exit: 0
      stdout: "save failed: no DELE sent\nin the store: 3\n"

  - id: dele-needs-quit
    claim: "DELE only marks: a session that sends DELE for each message and then RSET deletes nothing, and each command is answered +OK, so the program sends all four."
    program: program.cs
    args: [rset]
    timeout: 90
    expect:
      exit: 0
      stdout: "DELE 1, DELE 2, DELE 3, RSET sent\n"

  - id: marks-undone
    claim: "After that session has ended, a new session still lists all three messages."
    program: program.cs
    args: [rset-kept]
    timeout: 90
    expect:
      exit: 0
      stdout: "DELE 1, DELE 2, DELE 3, RSET sent\nnext session lists 3 messages\n"
