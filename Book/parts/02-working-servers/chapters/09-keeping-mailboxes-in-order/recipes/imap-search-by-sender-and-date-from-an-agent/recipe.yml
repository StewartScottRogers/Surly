# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs search.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: imap-search-by-sender-and-date-from-an-agent
title: Searching by Sender and Date from an Agent
protocols: [imap]
tier: working-servers
surface: mcp
mcp-tools: [start_server, seed_mail, wait_for_event, curl]
curl-options: [-s, -S, -v, -u, -X]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc9051]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "A search for FROM shop and SENTSINCE 01-Jun-2026 through the curl tool names messages 3 and 4, and fetching UIDs 3 and 4 gives their From and Subject headers."
    program: search.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "^search:\\ \\*\\ SEARCH\\ 3\\ 4\\nUID\\ 3:\\ From:\\ shop@example\\.com\\ \\|\\ Subject:\\ Order\\ 2\\nUID\\ 4:\\ From:\\ Shop\\ Team\\ <shop@example\\.com>\\ \\|\\ Subject:\\ Order\\ 3\\n$"

  - id: from-is-a-substring
    claim: "FROM matches part of the header in any letter case; shop and SHOP both name messages 1, 3 and 4."
    program: search.cs
    args: ["substring"]
    expect:
      exit: 0
      stdout-matches: "^shop:\\ \\*\\ SEARCH\\ 1\\ 3\\ 4\\nSHOP:\\ \\*\\ SEARCH\\ 1\\ 3\\ 4\\n$"

  - id: from-matches-the-display-name
    claim: "FROM reads the whole From header, display name included; \"Shop Team\" names message 4 alone."
    program: search.cs
    args: ["name"]
    expect:
      exit: 0
      stdout-matches: "^\\*\\ SEARCH\\ 4\\n$"

  - id: since-is-the-arrival-date
    claim: "SINCE compares the date the server received a message; all four arrived today, so SINCE 01-Jan-2020 names all of them."
    program: search.cs
    args: ["since"]
    expect:
      exit: 0
      stdout-matches: "^\\*\\ SEARCH\\ 1\\ 2\\ 3\\ 4\\n$"

  - id: since-the-future
    claim: "Nothing arrived since 01-Jan-2099; the answer is an empty * SEARCH line and curl exits 0."
    program: search.cs
    args: ["future"]
    expect:
      exit: 0
      stdout-matches: "^\\*\\ SEARCH\\n$"

  - id: sent-dates-use-the-header
    claim: "SENTSINCE and SENTBEFORE compare the Date header; 01-Jul-2026 splits the mailbox into messages 3 and 4 and messages 1 and 2."
    program: search.cs
    args: ["sent"]
    expect:
      exit: 0
      stdout-matches: "^SENTSINCE:\\ \\*\\ SEARCH\\ 3\\ 4\\nSENTBEFORE:\\ \\*\\ SEARCH\\ 1\\ 2\\n$"

  - id: criteria-combine
    claim: "Criteria in one search must all hold; FROM shop with SENTSINCE 01-Jun-2026 and SENTBEFORE 01-Oct-2026 names message 3 alone."
    program: search.cs
    args: ["combine"]
    expect:
      exit: 0
      stdout-matches: "^\\*\\ SEARCH\\ 3\\n$"

  - id: or-widens
    claim: "OR takes two criteria and names a message that meets either; OR FROM bank FROM Team names messages 2 and 4."
    program: search.cs
    args: ["or"]
    expect:
      exit: 0
      stdout-matches: "^\\*\\ SEARCH\\ 2\\ 4\\n$"

  - id: no-match-is-not-an-error
    claim: "A search that matches nothing, FROM nobody, returns an empty * SEARCH line and curl exits 0."
    program: search.cs
    args: ["nothing"]
    expect:
      exit: 0
      stdout-matches: "^\\*\\ SEARCH\\n$"

  - id: bad-date
    claim: "SENTSINCE 2026-11-03 is answered BAD Invalid arguments, and the curl tool reports curl exit 21."
    program: search.cs
    args: ["bad-date"]
    expect:
      exit: 0
      stdout-matches: "^SENTSINCE\\ 2026\\-11\\-03:\\ curl\\ exit\\ 21,\\ <\\ A004\\ BAD\\ Invalid\\ arguments\\n$"

  - id: numbers-renumber
    claim: "After message 1 is marked deleted and expunged, the same FROM shop search names 2 and 3."
    program: search.cs
    args: ["renumber"]
    expect:
      exit: 0
      stdout-matches: "^before:\\ \\*\\ SEARCH\\ 1\\ 3\\ 4\\nafter\\ expunging\\ 1:\\ \\*\\ SEARCH\\ 2\\ 3\\n$"

  - id: uid-search
    claim: "UID SEARCH, sent as a custom request, answers UIDs, which do not move: FROM shop names 3 and 4 after the expunge, and fetching UID 3 gives Order 2."
    program: search.cs
    args: ["uid"]
    expect:
      exit: 0
      stdout-matches: "^UID\\ SEARCH:\\ \\*\\ SEARCH\\ 3\\ 4\\nUID\\ 3:\\ Subject:\\ Order\\ 2\\n$"
