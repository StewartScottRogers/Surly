# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: imap-file-mail-into-a-folder-in-csharp
title: Filing Mail into a Folder in C#
protocols: [imap]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerMail, SurlMailboxInfo, SurlMessagePage, SurlMessageSummary, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, rfc9051]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: "CREATE, COPY 1, STORE +FLAGS (\\Deleted) and EXPUNGE through Curl.Api file order 1: the store counts INBOX 2 and Archive 1."
    program: file-mail.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "^copied:\\ Archive\\ 1,\\ INBOX\\ 3\\nSTORE:\\ \\*\\ 1\\ FETCH\\ \\(FLAGS\\ \\(\\\\Deleted\\)\\)\\nEXPUNGE:\\ \\*\\ 1\\ EXPUNGE\\nfiled:\\ Archive\\ 1,\\ INBOX\\ 2\\n$"

  - id: create-existing
    claim: "A second CREATE of the same folder is refused with CurlException code 21, and the store still lists one Archive."
    program: file-mail.cs
    args: ["exists"]
    expect:
      exit: 0
      stdout-matches: "^curl\\ error\\ 21,\\ Quote\\ command\\ returned\\ error\\nfolders:\\ Archive\\ 0,\\ INBOX\\ 3\\n$"

  - id: copy-to-missing-folder
    claim: "COPY into a folder that does not exist is refused with CurlException code 21, and the store gains no folder."
    program: file-mail.cs
    args: ["no-folder"]
    expect:
      exit: 0
      stdout-matches: "^curl\\ error\\ 21,\\ Quote\\ command\\ returned\\ error\\nfolders:\\ INBOX\\ 3\\n$"

  - id: copy-missing-message
    claim: "COPY of message 9, which INBOX does not have, is refused with CurlException code 21, and Archive stays empty."
    program: file-mail.cs
    args: ["no-message"]
    expect:
      exit: 0
      stdout-matches: "^curl\\ error\\ 21,\\ Quote\\ command\\ returned\\ error\\nfolders:\\ Archive\\ 0,\\ INBOX\\ 3\\n$"

  - id: copy-keeps-the-original
    claim: "COPY 2 alone leaves INBOX at 3 messages and puts 1 in Archive."
    program: file-mail.cs
    args: ["keeps"]
    expect:
      exit: 0
      stdout-matches: "^after\\ COPY\\ 2:\\ Archive\\ 1,\\ INBOX\\ 3\\n$"

  - id: copy-carries-flags
    claim: "A flagged message copied into Archive is found there by a FLAGGED search, and INBOX still names the original."
    program: file-mail.cs
    args: ["flags"]
    expect:
      exit: 0
      stdout-matches: "^FLAGGED\\ in\\ Archive:\\ \\*\\ SEARCH\\ 1\\nFLAGGED\\ in\\ INBOX:\\ \\*\\ SEARCH\\ 2\\n$"

  - id: deleted-flag-is-not-removal
    claim: "STORE +FLAGS (\\Deleted) only marks UID 1: the store lists the flag, a DELETED search names it, and INBOX still holds 3."
    program: file-mail.cs
    args: ["deleted"]
    expect:
      exit: 0
      stdout-matches: "^copied:\\ Archive\\ 1,\\ INBOX\\ 3\\nSTORE:\\ \\*\\ 1\\ FETCH\\ \\(FLAGS\\ \\(\\\\Deleted\\)\\)\\nDELETED\\ in\\ INBOX:\\ \\*\\ SEARCH\\ 1\\nstore\\ flags\\ of\\ UID\\ 1:\\ \\\\Deleted\\nmarked:\\ Archive\\ 1,\\ INBOX\\ 3\\n$"

  - id: expunge-removes
    claim: "EXPUNGE takes the marked message out: INBOX holds 2, and STATUS (through CustomRequest) answers MESSAGES 2 and UIDNEXT 4."
    program: file-mail.cs
    args: ["expunge"]
    expect:
      exit: 0
      stdout-matches: "(?s)^(?=.*filed:\\ Archive\\ 1,\\ INBOX\\ 2\\nSTATUS:\\ \\*\\ STATUS\\ INBOX\\ \\(MESSAGES\\ 2\\ UIDNEXT\\ 4\\)\\n)"

  - id: move-in-one-command
    claim: "MOVE 1 Archive is the copy and the removal in one command: INBOX goes from 3 to 2 and Archive holds UID 1."
    program: file-mail.cs
    args: ["move"]
    expect:
      exit: 0
      stdout-matches: "^before:\\ Archive\\ 0,\\ INBOX\\ 3\\nafter\\ MOVE\\ 1:\\ Archive\\ 1,\\ INBOX\\ 2\\nArchive\\ UIDs:\\ 1\\n$"
