# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-append-to-a-file-in-csharp
title: Appending over FTP in C#
protocols: [ftp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFileContents, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Two uploads with Append set add their lines after the first one, and the server's store holds all three, in the order they were sent, after each.
    program: append-log.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^log\.txt: first line\\nsecond line\\n\nlog\.txt: first line\\nsecond line\\nthird line\\n\n'

  - id: appe-commands
    claim: The server received APPE for each of the two uploads, and no STOR.
    program: append-log.cs
    args: []
    expect:
      exit: 0
      stdout: "log.txt: first line\\nsecond line\\n\nlog.txt: first line\\nsecond line\\nthird line\\n\ncommands: APPE log.txt, APPE log.txt\n"

  - id: without-append-replaces
    claim: The same upload without Append sends STOR and replaces the file, so the old contents are gone.
    program: append-log.cs
    args: [replace]
    expect:
      exit: 0
      stdout: "replace.txt: third line\\n\ncommands: STOR replace.txt\n"

  - id: edges
    claim: Appending to a file that is not there creates it, and appending to one that does not end in a newline joins the new text to its last line.
    program: append-log.cs
    args: [edges]
    expect:
      exit: 0
      stdout: "fresh.txt: second line\\n\nno-newline.txt: no newlinesecond line\\n\n"

  - id: uploads-off
    claim: A server with AllowUploads left off refuses the append, SendAsync throws a CurlException with code UploadFailed, 25, and the file is unchanged.
    program: append-log.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "uploads-off: CurlException 25 UploadFailed\nlog.txt: first line\\n\n"

  - id: too-big
    claim: With MaxFileSize 15, an append that would take the 11-byte file past it is refused with code RemoteDiskFull, 70, though the 12 bytes sent are under the limit, and the file is unchanged.
    program: append-log.cs
    args: [too-big]
    expect:
      exit: 0
      stdout: "too-big: CurlException 70 RemoteDiskFull\nlog.txt: first line\\n\n"

  - id: no-login
    claim: Without AllowAnonymous the server refuses the anonymous login, SendAsync throws a CurlException with code LoginDenied, 67, and the file is unchanged.
    program: append-log.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "no-login: CurlException 67 LoginDenied\nlog.txt: first line\\n\n"
