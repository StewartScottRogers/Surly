# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the pinned
# surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 2
key: ftp-create-folders-while-uploading
title: Creating Folders While Uploading
protocols: [ftp]
tier: working-servers
surl-options: [--directory, --allow-anonymous, --allow-uploads, --list-directories]
curl-options: [-T, --ftp-create-dirs, -l, -v, -s]
exit-codes: [0, 9, 67]
references: [surl-readme, curl-readme, rfc959]

fixtures:
  site/2026/old.txt: "already here\n"
  other/existing/old.txt: "already here\n"
  report.txt: "totals\n"

servers:
  main:
    command: surl --directory site --allow-anonymous --allow-uploads --list-directories ftp://127.0.0.1:{{port}}/
    ready: port
  read-only:
    command: surl --directory other --allow-anonymous --list-directories ftp://127.0.0.1:{{port2}}/
    ready: port
  default:
    command: surl ftp://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --ftp-create-dirs, curl makes every folder of the path that is missing, 11 and 12 below the existing 2026, and the upload lands in the last, exit 0.
    run: curl -s --ftp-create-dirs -T report.txt ftp://127.0.0.1:{{port}}/2026/11/12/report.txt
    expect:
      exit: 0
      stdout: ""
      files:
        site/2026/11/12/report.txt: "totals\n"

  - id: without-the-option
    claim: Without it, an upload into a folder that is not there fails, curl exits 9, remote access denied, and nothing is created.
    run: curl -s -T report.txt ftp://127.0.0.1:{{port}}/2027/01/report.txt
    expect:
      exit: 9

  - id: nothing-made-without-it
    claim: The root listing after that failure holds only the folders that were already there, 2026 and not 2027.
    run: curl -s -l ftp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "2026\n"

  - id: middle-folder
    claim: The folder made first, 11, is inside 2026 beside the file that was already there, and holds the second folder.
    run: curl -s -l ftp://127.0.0.1:{{port}}/2026/
    expect:
      exit: 0
      stdout: "11\nold.txt\n"

  - id: last-folder
    claim: The last folder holds the uploaded file.
    run: curl -s -l ftp://127.0.0.1:{{port}}/2026/11/12/
    expect:
      exit: 0
      stdout: "report.txt\n"

  - id: only-missing-folders-made
    claim: curl asks for each folder with CWD and sends MKD only for one that answers 550 No such directory, so 2026 and 11, which exist by now, are entered and not made, and 13 is made.
    run: curl -s -v --ftp-create-dirs -T report.txt ftp://127.0.0.1:{{port}}/2026/11/13/report.txt 2>&1
    expect:
      exit: 0
      stdout-matches: '^(?!.*MKD 2026)(?!.*MKD 11)(?!.*MKD 12).*< 550 No such directory.*> MKD 13.*< 257 "/2026/11/13" created'

  - id: repeat-makes-nothing
    claim: Sent again, the same command makes no folder, because every one answers 250, and replaces the file.
    run: curl -s -v --ftp-create-dirs -T report.txt ftp://127.0.0.1:{{port}}/2026/11/13/report.txt 2>&1
    expect:
      exit: 0
      stdout-matches: '^(?!.*MKD).*> STOR report\.txt'

  - id: uploads-off
    claim: A server started without --allow-uploads answers MKD 550 Not permitted, so the folder is not made and curl exits 9, even with the option.
    run: curl -s -v --ftp-create-dirs -T report.txt ftp://127.0.0.1:{{port2}}/new/report.txt 2>&1
    expect:
      exit: 9
      stdout-matches: '> MKD new.*< 550 Not permitted'

  - id: nothing-made-when-off
    claim: The folder is not there afterwards.
    run: curl -s -l ftp://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: "existing\n"

  - id: login-refused
    claim: A server started without --allow-anonymous refuses curl's anonymous login before any folder is made, and curl exits 67, login denied.
    run: curl -s --ftp-create-dirs -T report.txt ftp://127.0.0.1:{{port3}}/new/report.txt
    expect:
      exit: 67
