# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs make-folders.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: ftp-create-folders-while-uploading-from-an-agent
title: Creating Folders While Uploading from an Agent
protocols: [ftp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, list_files, get_exchanges]
exit-codes: [0, 9, 67]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: curl --ftp-create-dirs through curl-mcp uploads into 2026/11/12, exit 0, and list_files shows each level, the two missing folders made below the existing 2026 and the last holding report.txt.
    program: make-folders.cs
    args: []
    expect:
      exit: 0
      stdout: "upload exit: 0\n/: 2026/\n/2026: 11/ old.txt\n/2026/11: 12/\n/2026/11/12: report.txt\n"

  - id: without-the-option
    claim: The same upload without --ftp-create-dirs makes curl exit 9, remote access denied, and list_files shows the root still holds only 2026.
    program: make-folders.cs
    args: [without]
    expect:
      exit: 0
      stdout: "without: upload exit 9\n/: 2026/\n"

  - id: only-missing-folders-made
    claim: get_exchanges shows the server received MKD for the folders that were missing, 11 and 13, and not for 2026, which existed, and a second upload into the same path received no MKD at all.
    program: make-folders.cs
    args: [commands]
    expect:
      exit: 0
      stdout: "commands: MKD 11, MKD 13, STOR report.txt, STOR report.txt\n"

  - id: uploads-off
    claim: A server started without --allow-uploads refuses MKD, so even with --ftp-create-dirs curl exits 9 and list_files shows no folder was made.
    program: make-folders.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "uploads-off: upload exit 9\n/: 2026/\n"

  - id: no-login
    claim: A server started without --allow-anonymous refuses curl's anonymous login before any folder is made, and curl exits 67, login denied.
    program: make-folders.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "no-login: upload exit 67\n/: 2026/\n"
