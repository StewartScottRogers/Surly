# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-create-folders-while-uploading-in-csharp
title: Creating Folders While Uploading in C#
protocols: [ftp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerFiles, SurlFolderPage, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions, FtpCreateMissingDirectories, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: An upload with CreateMissingDirectories set to Create makes the two missing folders, 11 and 12, below the existing 2026, and the server's store lists each level, the last holding report.txt.
    program: make-folders.cs
    args: []
    expect:
      exit: 0
      stdout: "/: 2026/\n/2026: 11/ old.txt\n/2026/11: 12/\n/2026/11/12: report.txt\n"

  - id: without-the-option
    claim: Left at None, the same upload into a folder that is not there throws a CurlException with code RemoteAccessDenied, 9, the code curl exits with, and the store still holds only 2026.
    program: make-folders.cs
    args: [without]
    expect:
      exit: 0
      stdout: "without: CurlException 9 RemoteAccessDenied\n/: 2026/\n"

  - id: only-missing-folders-made
    claim: The server received MKD for the folders that were missing, 11 and 13, and not for 2026, which existed, and a second upload into the same path received no MKD at all.
    program: make-folders.cs
    args: [commands]
    expect:
      exit: 0
      stdout: "commands: MKD 11, MKD 13, STOR report.txt, STOR report.txt\n"

  - id: uploads-off
    claim: A server with AllowUploads left off refuses MKD, so even with folder creation on the upload throws a CurlException with code RemoteAccessDenied, 9, and no folder is made.
    program: make-folders.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "uploads-off: CurlException 9 RemoteAccessDenied\n/: 2026/\n"

  - id: no-login
    claim: Without AllowAnonymous the server refuses the anonymous login before any folder is made, and SendAsync throws a CurlException with code LoginDenied, 67.
    program: make-folders.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "no-login: CurlException 67 LoginDenied\n/: 2026/\n"
