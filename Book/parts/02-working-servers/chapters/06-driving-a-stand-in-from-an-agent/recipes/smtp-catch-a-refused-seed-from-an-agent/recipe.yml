# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs seed-or-correct.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-catch-a-refused-seed-from-an-agent
title: Catching a Refused Seed from an Agent
protocols: [smtp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, seed_mail, list_messages, get_events, curl, wait_for_event, list_mailboxes]
curl-options: [-s, -S, -u, --mail-from, --mail-rcpt, -T, -w]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc5321]

# The order confirmation, as the shop app would send it over SMTP in the smtp case.
fixtures:
  order.eml: "From: shop@example.com\r\nTo: ann@example.com\r\nSubject: Order 1042 confirmed\r\n\r\nThank you for your order.\r\n"

cases:
  - id: solution
    role: solution
    claim: seed_mail for anne@example.com, in the domain but with no mailbox, is a tool error naming the refusal NoSuchAccount; the agent reads it, seeds ann@example.com, a mailbox it started the server with, and list_messages finds the message there.
    program: seed-or-correct.cs
    args: [typo]
    expect:
      exit: 0
      stdout: "seed_mail anne@example.com: tool error, Mail: Mail for anne@example.com was refused: NoSuchAccount.\nrefusal NoSuchAccount: seeding ann@example.com instead\nseed_mail ann@example.com: {\"delivered\":true}\nann@example.com holds 1\n"

  - id: unchanged
    claim: The refused seed changed nothing; get_events finds no change to the mail store.
    program: seed-or-correct.cs
    args: [unchanged]
    expect:
      exit: 0
      stdout: "seed_mail anne@example.com: tool error, Mail: Mail for anne@example.com was refused: NoSuchAccount.\nmail store changes: 0\n"

  - id: outside
    claim: A seed for an address outside every mail domain is refused as RelayingDenied.
    program: seed-or-correct.cs
    args: [outside]
    expect:
      exit: 0
      stdout: "seed_mail ann@example.org: tool error, Mail: Mail for ann@example.org was refused: RelayingDenied.\nrefusal RelayingDenied\n"

  - id: malformed
    claim: A seed for a string that is not an address is refused as InvalidAddress.
    program: seed-or-correct.cs
    args: [malformed]
    expect:
      exit: 0
      stdout: "seed_mail ann: tool error, Mail: Mail for ann was refused: InvalidAddress.\nrefusal InvalidAddress\n"

  - id: smtp-loses-it
    claim: The same mail for anne@example.com sent over SMTP with the curl tool exits 0 with the reply 250, but no mail store change comes within 2 seconds and list_mailboxes finds no mailbox for the address; the mail was discarded.
    program: seed-or-correct.cs
    args: [smtp]
    expect:
      exit: 0
      stdout: "curl exit 0, reply 250\nwait_for_event: {\"timed_out\":true}\nlist_mailboxes anne@example.com: No mailboxes for anne@example.com.\n"
