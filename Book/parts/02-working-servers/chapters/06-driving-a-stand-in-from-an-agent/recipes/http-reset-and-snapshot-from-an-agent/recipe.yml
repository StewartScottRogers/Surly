# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs reset.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-reset-and-snapshot-from-an-agent
title: Resetting a Server Between Tests from an Agent
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, put_file, delete_file, snapshot_server, restore_server, reset_server, transfer, read_file, list_servers]
exit-codes: []
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from disk\n"

cases:
  - id: solution
    role: solution
    claim: restore_server puts back the files snapshot_server saved, so a file added after the snapshot is 404 again and a file deleted after it is 200 again.
    program: reset.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "restore_server: answered the IDs it was given\ntransfer scratch.txt: 404\ntransfer hello.txt: 200 hello from surl\n"

  - id: reset-to-start
    claim: reset_server returns the files to what start_server gave, so the file put before the snapshot is gone and hello.txt is still served.
    program: reset.cs
    args: [reset-to-start]
    expect:
      exit: 0
      stdout: "reset_server: answered the IDs it was given\ntransfer fixture.txt: 404\ntransfer hello.txt: 200 hello from surl\n"

  - id: snapshot-outlives-reset
    claim: A snapshot outlives a reset, and restoring it brings fixture.txt back.
    program: reset.cs
    args: [snapshot-outlives-reset]
    expect:
      exit: 0
      stdout: "reset_server: answered the IDs it was given\nrestore_server: answered the IDs it was given\nread_file /fixture.txt: \"set up once\\n\"\n"

  - id: exchanges-stay
    claim: Reset and restore change the stores, not the record of exchanges; list_servers still counts all four requests made so far.
    program: reset.cs
    args: [exchanges-stay]
    expect:
      exit: 0
      stdout: "restore_server: answered the IDs it was given\ntransfer scratch.txt: 404\ntransfer hello.txt: 200 hello from surl\nreset_server: answered the IDs it was given\ntransfer fixture.txt: 404\ntransfer hello.txt: 200 hello from surl\nrestore_server: answered the IDs it was given\nlist_servers: exchange_count 4\n"

  - id: newest-four
    claim: Only a server's newest four snapshots are kept; after four more, restoring the first is a tool error.
    program: reset.cs
    args: [newest-four]
    expect:
      exit: 0
      stdout-matches: '^restore_server: error: server \S+ has no snapshot \S+; it was never taken of this server, or was dropped as one past its newest 4 snapshots\n$'

  - id: not-on-disk
    claim: A server whose files are a folder on disk, given with --directory, refuses reset_server and snapshot_server, so a test never empties a real folder.
    program: reset.cs
    args: [not-on-disk]
    expect:
      exit: 0
      stdout: "reset_server: error: Content: the store could not be reset. The content store is on disk (--directory): reset, snapshot and restore are refused so a test never empties a real directory.\nsnapshot_server: error: Content: the store could not be snapshotted. The content store is on disk (--directory): reset, snapshot and restore are refused so a test never empties a real directory.\n"
