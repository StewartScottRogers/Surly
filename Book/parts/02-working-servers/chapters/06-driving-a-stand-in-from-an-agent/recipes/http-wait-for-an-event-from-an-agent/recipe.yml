# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs wait.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-wait-for-an-event-from-an-agent
title: Waiting for an Upload from an Agent
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, wait_for_event, curl, get_events]
curl-options: [-s, --digest, -u, -T, -o, -w]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  report.txt: "all green\n"

cases:
  - id: solution
    role: solution
    claim: After curl uploads report.txt, status 201, wait_for_event answers the change to the content store at /uploads/report.txt, 10 bytes, written by exchange 1.
    program: wait.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "curl exit 0, status 201\nwait_for_event: kind=store_changed store=content change=written name=/uploads/report.txt byte_count=10 exchange_id=1\n"

  - id: wait-first
    claim: A wait_for_event sent before the upload answers the same change when it happens, after curl's 201.
    program: wait.cs
    args: [wait-first]
    expect:
      exit: 0
      stdout: "curl exit 0, status 201\nwait_for_event: kind=store_changed store=content change=written name=/uploads/report.txt byte_count=10 exchange_id=1\n"

  - id: nothing-yet
    claim: wait_for_event for a change under /reports, which nothing has made, waits timeout_ms and answers timed_out true.
    program: wait.cs
    args: [nothing-yet]
    expect:
      exit: 0
      stdout: "wait_for_event: {\"timed_out\":true}\n"

  - id: whole-segments
    claim: name matches whole path segments, so /upload does not match /uploads/report.txt and the wait times out.
    program: wait.cs
    args: [whole-segments]
    expect:
      exit: 0
      stdout: "curl exit 0, status 201\nwait_for_event: {\"timed_out\":true}\n"

  - id: by-kind
    claim: wait_for_event with kinds login_judged answers the login the upload made, alice by Digest, accepted, in the same exchange.
    program: wait.cs
    args: [by-kind]
    expect:
      exit: 0
      stdout: "curl exit 0, status 201\nwait_for_event: kind=login_judged exchange_id=1 scheme=http account=alice mechanism=Digest is_accepted=true is_refused_by_fault=false\n"

  - id: the-whole-story
    claim: get_events answers every event kept, oldest first, from the exchange starting on the server's listen URL to the exchange ending, with has_more false.
    program: wait.cs
    args: [the-whole-story]
    expect:
      exit: 0
      stdout: "curl exit 0, status 201\nget_events: kind=exchange_started exchange_id=1 listen_url=url scheme=http\nget_events: kind=login_judged exchange_id=1 scheme=http account=alice mechanism=Digest is_accepted=true is_refused_by_fault=false\nget_events: kind=store_changed store=content change=written name=/uploads/report.txt byte_count=10 exchange_id=1\nget_events: kind=exchange_ended exchange_id=1\nget_events: has_more false\n"

  - id: a-page-at-a-time
    claim: max_events 1 answers only the oldest event, the exchange starting, and has_more true.
    program: wait.cs
    args: [a-page-at-a-time]
    expect:
      exit: 0
      stdout: "curl exit 0, status 201\nget_events: kind=exchange_started exchange_id=1 listen_url=url scheme=http\nget_events: has_more true\n"

  - id: timeout-bounds
    claim: timeout_ms outside 1 to 60000 is a tool error.
    program: wait.cs
    args: [timeout-bounds]
    expect:
      exit: 0
      stdout: "wait_for_event: error: timeout_ms must be 1 to 60000, not 70000\n"

  - id: no-password-in-clear
    claim: The same upload with -u but without --digest sends the password by Basic authentication, and the server answers 403.
    program: wait.cs
    args: [no-password-in-clear]
    expect:
      exit: 0
      stdout: "curl exit 0, status 403\n"
