# Executable specification for a recipe whose subject is surl-mcp or curl-mcp (ADR-0008).
schema: 2
key: http-accept-uploads-from-an-agent
title: Accepting Uploads from an Agent
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, read_file, get_events]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: With --allow-uploads and an account, the curl tool with --digest -u and -T uploads notes.txt, answered 201 Created, and read_file finds its exact text in the store.
    program: uploads.cs
    args: []
    expect:
      exit: 0
      stdout: "upload: 201\nread_file /notes.txt: 17 bytes, text/plain, uploaded by curl\n"

  - id: replaced
    claim: Putting to the same path again replaces the file and is answered 204 No Content.
    program: uploads.cs
    args: [replace]
    expect:
      exit: 0
      stdout: "first: 201\nsecond: 204\n"

  - id: refused
    claim: A missing folder is 409 Conflict, no login 401, a wrong password 401, and Basic, which sends the password in clear, 403 Forbidden; none of them stores anything, which read_file shows.
    program: uploads.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "missing folder: 409\nno login: 401\nwrong password: 401\nbasic: 403\nread_file /anon.txt: error: No file at /anon.txt.\n"

  - id: uploads-off
    claim: Without --allow-uploads, a logged-in upload is answered 405 Method Not Allowed.
    program: uploads.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "upload: 405\n"

  - id: no-account
    claim: With no account configured, an upload is still refused 401 Unauthorized, even with --allow-uploads, because no login can succeed.
    program: uploads.cs
    args: [no-account]
    expect:
      exit: 0
      stdout: "upload: 401\nread_file /notes.txt: error: No file at /notes.txt.\n"

  - id: anonymous
    claim: With --allow-anonymous and --allow-uploads, an upload with no login is accepted, 201 Created, and read_file finds it.
    program: uploads.cs
    args: [anonymous]
    expect:
      exit: 0
      stdout: "upload: 201\nread_file /notes.txt: 17 bytes, text/plain, uploaded by curl\n"

  - id: store-event
    claim: get_events with kinds store_changed records the upload as a write of /notes.txt.
    program: uploads.cs
    args: [events]
    expect:
      exit: 0
      stdout: "upload: 201\nstore_changed: written /notes.txt\n"
