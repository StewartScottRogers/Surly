# Executable specification for a recipe whose subject is surl-mcp or curl-mcp (ADR-0008).
schema: 2
key: ftp-list-and-upload-from-an-agent
title: Listing and Uploading over FTP
protocols: [ftp]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, list_files, read_file]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The curl tool with -l lists the root, names one to a line, hidden file left out; -T uploads notes.txt, the next listing shows it, and list_files and read_file agree from the server's side.
    program: list-and-upload.cs
    args: []
    expect:
      exit: 0
      stdout: "list /: exit 0, tool error: no, hello.txt sub\nupload: exit 0, tool error: no\nlist /: exit 0, tool error: no, hello.txt notes.txt sub\nlist_files /: hello.txt notes.txt sub/\nread_file /notes.txt: 17 bytes, uploaded by curl\n"

  - id: long-listing
    claim: Without -l the curl tool answers the long listing, a line a name in the style of Unix ls -l, a folder's starting with d.
    program: list-and-upload.cs
    args: [long]
    expect:
      exit: 0
      stdout: "  - hello.txt\n  d sub\n"

  - id: subfolder
    claim: A subfolder is listed by naming it with a trailing slash.
    program: list-and-upload.cs
    args: [subfolder]
    expect:
      exit: 0
      stdout: "list /sub/: exit 0, tool error: no, a.txt\n"

  - id: listings-off
    claim: Without --list-directories a listing is refused, curl exit 19, a tool error with nothing listed.
    program: list-and-upload.cs
    args: [listings-off]
    expect:
      exit: 0
      stdout: "list /: exit 19, tool error: yes\nupload: exit 0, tool error: no\n"

  - id: uploads-off
    claim: Without --allow-uploads the listing works and the upload is curl exit 25, a tool error.
    program: list-and-upload.cs
    args: [uploads-off]
    expect:
      exit: 0
      stdout: "list /: exit 0, tool error: no, hello.txt sub\nupload: exit 25, tool error: yes\n"

  - id: anonymous-refused
    claim: Without --allow-anonymous the anonymous login is refused, curl exit 67, a tool error, before anything is listed or uploaded.
    program: list-and-upload.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "list /: exit 67, tool error: yes\nupload: exit 67, tool error: yes\n"
