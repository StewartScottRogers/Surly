# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs seed.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-seed-mail-from-an-agent
title: Seeding Mail from an Agent
protocols: [smtp, imap]
tier: working-servers
surface: mcp
mcp-tools: [start_server, seed_mail, curl, read_message, list_mailboxes, list_messages]
curl-options: [-s, -S, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0, 55]
references: [surl-readme, curl-readme, rfc5321, rfc5322, rfc9051]

fixtures:
  note.eml: "From: alice@example.com\r\nTo: alice@example.com\r\nSubject: Note\r\n\r\nSent over SMTP.\r\n"

cases:
  - id: solution
    role: solution
    claim: seed_mail delivers a message into alice's INBOX on a running server, and curl reads it back over IMAP, byte for byte, as UID 1.
    program: seed.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "seed_mail alice@example.com: {\"delivered\":true}\ncurl exit 0, output \"From: bob@example.com\\r\\nTo: alice@example.com\\r\\nSubject: Hello\\r\\n\\r\\nHello from surl.\\r\\n\"\n"

  - id: imap-marks-it-seen
    claim: Fetching the message over IMAP set its \Seen flag, which list_messages shows with its UID and size.
    program: seed.cs
    args: [imap-marks-it-seen]
    expect:
      exit: 0
      stdout: "seed_mail alice@example.com: {\"delivered\":true}\ncurl exit 0, output \"From: bob@example.com\\r\\nTo: alice@example.com\\r\\nSubject: Hello\\r\\n\\r\\nHello from surl.\\r\\n\"\nlist_messages: uid 1, size 82, flags [\"\\\\Seen\"]\n"

  - id: read-without-a-client
    claim: read_message answers a second seeded message's exact text without a login and sets no flag, so list_mailboxes counts two messages, one unseen.
    program: seed.cs
    args: [read-without-client]
    expect:
      exit: 0
      stdout: "seed_mail alice@example.com: {\"delivered\":true}\ncurl exit 0, output \"From: bob@example.com\\r\\nTo: alice@example.com\\r\\nSubject: Hello\\r\\n\\r\\nHello from surl.\\r\\n\"\nseed_mail alice@example.com: {\"delivered\":true}\nread_message uid 2: \"From: bob@example.com\\r\\nTo: alice@example.com\\r\\nSubject: Again\\r\\n\\r\\nStill here.\\r\\n\"\nlist_mailboxes: INBOX, 2 messages, 1 unseen\n"

  - id: smtp-needs-a-login
    claim: A client sending over SMTP without a login is refused at MAIL with 530 and curl exits 55; with alice's login the same message is delivered, after the seeded one, as UID 2.
    program: seed.cs
    args: [smtp-needs-a-login]
    expect:
      exit: 0
      stdout: "seed_mail alice@example.com: {\"delivered\":true}\ncurl exit 55, output \"\", error curl: (55) MAIL failed: 530\ncurl exit 0, output \"\"\nlist_messages: uid 2, size 208, flags []\n"

  - id: no-such-account
    claim: seed_mail to an address no account owns is a tool error, NoSuchAccount.
    program: seed.cs
    args: [no-such-account]
    expect:
      exit: 0
      stdout: "seed_mail carol@example.com: error: Mail: Mail for carol@example.com was refused: NoSuchAccount.\n"
