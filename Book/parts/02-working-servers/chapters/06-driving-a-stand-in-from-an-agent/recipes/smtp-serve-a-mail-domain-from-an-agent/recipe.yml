# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs serve-domain.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: smtp-serve-a-mail-domain-from-an-agent
title: Serving a Mail Domain from an Agent
protocols: [smtp, imap]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, wait_for_event, get_exchanges, list_mailboxes]
curl-options: [-s, -S, -u, --mail-from, --mail-rcpt, -T, -w]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc5321]

fixtures:
  memo.eml: "From: ann@example.com\r\nTo: bob@example.com\r\nSubject: Stand-up moved to ten\r\n\r\nSame room.\r\n"

cases:
  - id: solution
    role: solution
    claim: On a server started for example.com with Ann's and Bob's mailboxes, Ann, logged in with her whole address, sends to Bob with the curl tool, reply 250; the delivery is a store_changed event for bob@example.com/INBOX/;UID=1, and Bob, logged in over IMAP, reads its From and Subject.
    program: serve-domain.cs
    args: [deliver]
    expect:
      exit: 0
      stdout: "curl exit 0, reply 250\nevent: bob@example.com/INBOX/;UID=1\nFrom: ann@example.com\nSubject: Stand-up moved to ten\n\n"

  - id: relaying-denied
    claim: Mail to carol@elsewhere.org, outside the domain, is refused even though Ann has logged in; the curl tool exits 55 with RCPT failed 550, and get_exchanges shows the RCPT TO answered 550 5.7.1 Relaying denied.
    program: serve-domain.cs
    args: [relay]
    expect:
      exit: 0
      stdout: "curl exit 55: curl: (55) RCPT failed: 550\nRCPT TO:<carol@elsewhere.org> answered 550 5.7.1 Relaying denied\n"

  - id: unknown-in-domain
    claim: Mail to cy@example.com, inside the domain with no mailbox, is answered 250 and kept nowhere; list_mailboxes finds no mailbox for the address.
    program: serve-domain.cs
    args: [unknown]
    expect:
      exit: 0
      stdout: "curl exit 0, reply 250\nlist_mailboxes cy@example.com: No mailboxes for cy@example.com.\n"

  - id: no-login
    claim: A send with no login is refused at MAIL; the curl tool exits 55 with MAIL failed 530.
    program: serve-domain.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "curl exit 55: curl: (55) MAIL failed: 530\n"

  - id: mailbox-outside-domain
    claim: start_server with a mailbox outside every --mail-domain is a tool error with exit_code 2 naming the mailbox.
    program: serve-domain.cs
    args: [outside-box]
    expect:
      exit: 0
      stdout: "start_server refused: exit_code 2, option --mailbox: mailbox bob@example.org is not in any --mail-domain\n"
