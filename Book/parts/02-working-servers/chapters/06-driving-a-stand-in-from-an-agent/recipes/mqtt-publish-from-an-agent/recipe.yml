# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs publish.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: mqtt-publish-from-an-agent
title: Publishing a Retained Message from an Agent
protocols: [mqtt]
tier: working-servers
surface: mcp
mcp-tools: [start_server, publish_message, read_retained_message, curl]
curl-options: [-s, -d]
exit-codes: [0, 8]
references: [surl-readme, curl-readme, mqtt311]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: publish_message with retain true keeps 21.5 as the retained message of sensors/1, and read_retained_message answers it, at QoS 0.
    program: publish.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "publish_message sensors/1: {\"published\":true}\nread_retained_message sensors/1: {\"topic\":\"sensors/1\",\"qos\":0,\"text\":\"21.5\"}\n"

  - id: not-retained
    claim: Without retain the message is published but not kept, and read_retained_message answers retained false, not an error.
    program: publish.cs
    args: [not-retained]
    expect:
      exit: 0
      stdout: "publish_message sensors/2: {\"published\":true}\nread_retained_message sensors/2: {\"retained\":false}\n"

  - id: empty-clears
    claim: A retained publish with an empty payload clears the topic's retained message.
    program: publish.cs
    args: [empty-clears]
    expect:
      exit: 0
      stdout: "publish_message sensors/1: {\"published\":true}\npublish_message sensors/1: {\"published\":true}\nread_retained_message sensors/1: {\"retained\":false}\n"

  - id: no-wildcards
    claim: A topic with a wildcard is not a topic name one can publish to, and publish_message refuses it, InvalidTopic.
    program: publish.cs
    args: [no-wildcards]
    expect:
      exit: 0
      stdout: "publish_message sensors/+: error: Bus: A message on sensors/+ was refused: InvalidTopic.\n"

  - id: client-refused
    claim: The same server refuses curl's connection with no login, so curl exits 8 and reads nothing; publish_message needed no login.
    program: publish.cs
    args: [client-refused]
    expect:
      exit: 0
      stdout: "publish_message sensors/1: {\"published\":true}\ncurl exit 8, output \"\"\n"

  - id: subscriber-reads-it
    claim: A server started with --allow-anonymous warns that it accepts any login or none; there curl subscribes to sensors/1 and prints the retained message as MQTT carries it, the topic's length in two bytes, the topic, then the payload.
    program: publish.cs
    args: [subscriber]
    expect:
      exit: 0
      stdout: "surl: warning: --allow-anonymous: every request and login is accepted without checking credentials\npublish_message sensors/1: {\"published\":true}\ncurl exit 0, output \"\\u0000\\tsensors/121.5\"\n"

  - id: client-publish-not-kept
    claim: A client's publish without the RETAIN flag, curl -d 22.0 to sensors/3, is not kept either, and read_retained_message answers retained false.
    program: publish.cs
    args: [client-publish]
    expect:
      exit: 0
      stdout: "surl: warning: --allow-anonymous: every request and login is accepted without checking credentials\ncurl exit 0, output \"\"\nread_retained_message sensors/3: {\"retained\":false}\n"
