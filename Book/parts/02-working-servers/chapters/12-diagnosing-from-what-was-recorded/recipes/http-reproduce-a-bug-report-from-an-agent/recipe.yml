# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs reproduce.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-reproduce-a-bug-report-from-an-agent
title: Reproducing a Bug Report
protocols: [http]
tier: working-servers
surface: mcp
mcp-tools: [start_server, curl, get_exchanges, delete_file]
curl-options: [-s, -S, --max-time, -o, -w, -A, -H, -X]
exit-codes: [0, 1]
references: [surl-readme, curl-manual, rfc9110]

fixtures: {}

# The report, 573 bytes, is generated by the program and given to each server in start_server's files.
cases:
  - id: solution
    role: solution
    claim: The user's download stopped at 100 bytes; get_exchanges gives the user's request, GET /report.csv with four headers besides Host, answered 206; replayed with the curl tool on a fresh server holding the same file it is answered 206 with 100 bytes again, and dropping one header at a time shows the answer turns on Range alone, 200 with all 573 bytes without it.
    program: reproduce.cs
    args: [cut]
    expect:
      exit: 0
      stdout: "the user's app: 206 100 bytes\nrecorded: GET /report.csv HTTP/1.1 with 4 headers besides Host; answered 206\nreplayed on a fresh server: 206 100 bytes\nreproduced: 206 both times\nwithout Range: bytes=0-99: 200 573 bytes; the answer turns on it\n"

  - id: same-request
    claim: The replayed request head is the reported one line for line but for Host, the user agent, Accept and both of the app's own headers in the same order.
    program: reproduce.cs
    args: [head]
    expect:
      exit: 0
      stdout-matches: 'replayed head equals the reported one but for Host: True\n  GET /report\.csv HTTP/1\.1\n  User-Agent: shop/2\.1\n  Accept: \*/\*\n  X-App-Build: 2\.1\.7\n  Range: bytes=0-99\n\Z'

  - id: not-reproduced
    claim: A report that depends on the server's state does not reproduce; the user got 404 for a file deleted on that server, the same request on a fresh server is 200 with 573 bytes, and the agent says the answer depends on the server's state, exit 1.
    program: reproduce.cs
    args: [state]
    expect:
      exit: 1
      stdout: "the user's app: 404 14 bytes\nrecorded: GET /report.csv HTTP/1.1 with 2 headers besides Host; answered 404\nreplayed on a fresh server: 200 573 bytes\nnot reproduced: 404 for the user, 200 here; the answer depends on the server's state, not the request\n"
