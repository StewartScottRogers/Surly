# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-find-the-client-that-misbehaved-in-csharp
title: Finding the Client That Misbehaved in C#
protocols: [http]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, SurlExchangeChunk, SurlExchangeDirection, CurlClient, CurlClientOptions, CurlNetworkOptions, CurlRequest, CurlResponse]
exit-codes: [0]
references: [rfc9110, surl-readme]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api; the three ports are the
# local ports the clients connect from.

cases:
  - id: solution
    role: solution
    claim: Walking the recorded exchanges finds one answer of 400, in the search client's exchange; the program prints that exchange's client endpoint, whose port is the search client's, and the bytes of the request head with the X-Request ID line.
    program: program.cs
    args: ["{{port2}}", "{{port3}}", "{{port4}}"]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '\nanswered 400: exchange \d+, client 127\.0\.0\.1:\d+\nthat is the search client''s port\nrequest, \d+ bytes:\n  GET /hello\.txt HTTP/1\.1\n  Host: 127\.0\.0\.1:\d+\n  Accept: \*/\*\n  X-Request ID: 7\nanswers of 400 in 3 exchanges: 1\n\Z'

  - id: clients-see-a-status
    claim: Each client gets an answer for every request and no exception; the search client's last is 400, the rest 200.
    program: program.cs
    args: ["{{port2}}", "{{port3}}", "{{port4}}"]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '\Astatuses: billing 200 200 200 200 200; search 200 200 400; reports 200 200 200 200 200\n'

  - id: one-exchange-per-client
    claim: The record holds three exchanges, one per client connection, each from 127.0.0.1 on that client's port, and holding all of that client's requests.
    program: program.cs
    args: ["{{port2}}", "{{port3}}", "{{port4}}", record]
    timeout: 120
    expect:
      exit: 0
      stdout: "statuses: billing 200 200 200 200 200; search 200 200 400; reports 200 200 200 200 200\nexchanges: 3\nbilling: one exchange from 127.0.0.1, 5 requests\nreports: one exchange from 127.0.0.1, 5 requests\nsearch: one exchange from 127.0.0.1, 3 requests\n"
