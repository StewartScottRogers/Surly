# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: smtp-see-exactly-what-an-app-sent-in-csharp
title: Seeing an App's SMTP Dialogue in C#
protocols: [smtp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlExchangeRecord, SurlExchangeChunk, SurlMailMessage, CurlClient, CurlRequest, CurlResponse, CurlMailOptions, CurlAuthenticationOptions]
exit-codes: [0, 1]
references: [surl-readme, rfc5321, rfc5322]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api. A failing test exits 1.

cases:
  - id: app-sees-success
    claim: The app's send, whose envelope names the test address left in its settings, is answered 250, so the app has nothing to report.
    program: see-dialogue.cs
    args: []
    expect:
      exit: 1
      stdout-matches: '^SMTP 250\n'

  - id: solution
    role: solution
    claim: The test's wait for Ann's mail times out after 2 seconds, and from MAIL FROM on the recorded exchange shows the envelope recipient test@example.com answered 250 Recipient OK and, after DATA, a message whose To header names Ann.
    program: see-dialogue.cs
    args: []
    expect:
      exit: 1
      stdout: "SMTP 250\nFAIL: no mail for ann@example.com within 2 s\nthe dialogue from MAIL FROM:\nC: MAIL FROM:<app@example.com>\nS: 250 2.1.0 Sender OK\nC: RCPT TO:<test@example.com>\nS: 250 2.1.5 Recipient OK\nC: DATA\nS: 354 End data with <CR><LF>.<CR><LF>\nC: From: app@example.com\nC: To: ann@example.com\nC: Subject: Your order has shipped\nC: \nC: Order 1042 left the warehouse today.\nC: .\nS: 250 2.0.0 Message accepted\nC: QUIT\nS: 221 2.0.0 Bye\n"

  - id: landed-in-test
    claim: The notice went where the envelope said; ListMessagesAsync finds one message in the test mailbox and none in Ann's.
    program: see-dialogue.cs
    args: [landed]
    expect:
      exit: 1
      stdout: "SMTP 250\nFAIL: no mail for ann@example.com within 2 s\ntest@example.com holds 1\nann@example.com holds 0\n"

  - id: before-the-envelope
    claim: Before the envelope the client sent EHLO with the name from the URL's path, AUTH CRAM-MD5, and its answer to the challenge, which the recorded exchange keeps as sent, in base64.
    program: see-dialogue.cs
    args: [login]
    expect:
      exit: 1
      stdout-matches: '^SMTP 250\nFAIL: no mail for ann@example\.com within 2 s\nbefore MAIL FROM:\nC: EHLO shop\.example\.com\nC: AUTH CRAM-MD5\nC: [A-Za-z0-9+/]{20,}=*\n$'

  - id: log-withholds
    claim: The server's verbose log, unlike the record, withholds that answer as ****.
    program: see-dialogue.cs
    args: [log]
    expect:
      exit: 1
      stdout: "SMTP 250\nFAIL: no mail for ann@example.com within 2 s\nthe log:\n< AUTH CRAM-MD5\\r\\n\n< ****\\r\\n\n* Login accepted: CRAM-MD5 app@example.com\n"

  - id: stored-adds-headers
    claim: The stored copy is not byte for byte what the record shows; ReadMessageAsync returns Return-Path, the envelope sender, and a Received line above the headers the app sent.
    program: see-dialogue.cs
    args: [stored]
    expect:
      exit: 1
      stdout-matches: '^SMTP 250\nFAIL: no mail for ann@example\.com within 2 s\nstored:\nReturn-Path: <app@example\.com>\nReceived: from shop\.example\.com \(\[127\.0\.0\.1\]\) by surl with ESMTPA; [^\n]+\nFrom: app@example\.com\n$'

  - id: fixed
    claim: With the app's setting corrected the test passes, exit 0, and the recorded RCPT TO names Ann.
    program: see-dialogue.cs
    args: [fixed]
    expect:
      exit: 0
      stdout: "SMTP 250\nPASS: ann@example.com has the notice\nC: RCPT TO:<ann@example.com>\n"
