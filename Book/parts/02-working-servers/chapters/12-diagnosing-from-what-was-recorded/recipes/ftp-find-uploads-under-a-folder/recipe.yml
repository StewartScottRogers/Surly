# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-find-uploads-under-a-folder
title: Finding Uploads Under a Folder
protocols: [ftp]
tier: working-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlEventKind, StoreKind, StoreChange, StoreChangedEvent, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions]
exit-codes: [0]
references: [surl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: "A query for content store changes with Name /uploads finds the three uploads under the folder, one of them in a subfolder, and none from /uploads2; it also matches the two folders the uploads created, so the test keeps the Written changes."
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout: "name /uploads: 5 events, 3 written\n  /uploads/a.txt 6 bytes\n  /uploads/b.txt 5 bytes\n  /uploads/2026/c.txt 6 bytes\n"

  - id: no-name
    claim: "The same query with no Name finds all four uploads and the three folders created, so it is Name that leaves /uploads2 out."
    program: program.cs
    args: [all]
    timeout: 120
    expect:
      exit: 0
      stdout: "name (none): 7 events, 4 written\n  /uploads/a.txt 6 bytes\n  /uploads/b.txt 5 bytes\n  /uploads/2026/c.txt 6 bytes\n  /uploads2/d.txt 6 bytes\n"

  - id: subfolder
    claim: "A Name that is a subfolder, /uploads/2026, finds the upload in it and the creation of the folder, and nothing else."
    program: program.cs
    args: [nested]
    timeout: 120
    expect:
      exit: 0
      stdout: "name /uploads/2026: 2 events, 1 written\n  /uploads/2026/c.txt 6 bytes\n"

  - id: case-sensitive
    claim: "Name is case-sensitive: /Uploads finds no event."
    program: program.cs
    args: [case]
    timeout: 120
    expect:
      exit: 0
      stdout: "name /Uploads: 0 events, 0 written\n"

  - id: event-detail
    claim: "An upload's event is a Written change that names the file, carries its size, and is tied to the connection that made it."
    program: program.cs
    args: [detail]
    timeout: 120
    expect:
      exit: 0
      stdout: "Written /uploads/a.txt, 6 bytes, exchange recorded: True\n"
