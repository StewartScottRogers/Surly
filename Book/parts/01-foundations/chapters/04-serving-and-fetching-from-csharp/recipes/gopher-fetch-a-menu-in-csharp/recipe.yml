# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: gopher-fetch-a-menu-in-csharp
title: Fetching a Gopher Menu from C#
protocols: [gopher]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc1436]

fixtures: {}

# No servers: block. The program hosts its own Gopher server through Surl.Api, on a free port.

cases:
  - id: solution
    role: solution
    claim: With ListDirectories on, the empty path fetches the root menu, which the program parses into one entry per line, hello.txt as type 0 and notes as type 1, each with its selector, the host and the server's own port; the dot file is not listed.
    program: fetch-menu.cs
    args: [""]
    expect:
      exit: 0
      stdout: "== / (server received '')\ntype 0: hello.txt -> '/hello.txt' on 127.0.0.1:<bound>\ntype 1: notes -> '/notes' on 127.0.0.1:<bound>\n"

  - id: sub-menu
    claim: The path 1/notes fetches the menu of the notes folder, whose entry carries its full selector, and the server receives /notes, not the item type the path began with.
    program: fetch-menu.cs
    args: ["1/notes"]
    expect:
      exit: 0
      stdout: "== /1/notes (server received '/notes')\ntype 0: today.txt -> '/notes/today.txt' on 127.0.0.1:<bound>\n"

  - id: fetch-a-file
    claim: The path 0/hello.txt sends the selector /hello.txt, and the file comes back byte for byte as the body.
    program: fetch-menu.cs
    args: ["0/hello.txt"]
    expect:
      exit: 0
      stdout: "== /0/hello.txt (server received '/hello.txt')\nhello from surl\n"

  - id: missing-selector
    claim: A selector that names nothing, and a dot file the store holds, are both answered with the same error menu, one type 3 line that does not echo the selector, in an ordinary response; nothing is thrown.
    program: fetch-menu.cs
    args: ["0/missing.txt", "0/.secret"]
    expect:
      exit: 0
      stdout: "== /0/missing.txt (server received '/missing.txt')\ntype 3: Nothing is served at this selector. -> '' on error.host:1\n== /0/.secret (server received '/.secret')\ntype 3: Nothing is served at this selector. -> '' on error.host:1\n"

  - id: listings-off
    claim: Without ListDirectories the root and a folder are answered with that error menu too, while a file is still served.
    program: fetch-menu.cs
    args: ["off", "", "1/notes", "0/hello.txt"]
    expect:
      exit: 0
      stdout: "== / (server received '')\ntype 3: Nothing is served at this selector. -> '' on error.host:1\n== /1/notes (server received '/notes')\ntype 3: Nothing is served at this selector. -> '' on error.host:1\n== /0/hello.txt (server received '/hello.txt')\nhello from surl\n"
