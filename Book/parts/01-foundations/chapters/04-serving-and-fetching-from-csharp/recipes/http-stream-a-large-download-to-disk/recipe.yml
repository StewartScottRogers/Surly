# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-stream-a-large-download-to-disk
title: Streaming a Large Download to Disk
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A 64 MiB file served from disk by Surl.Api is copied to disk from CurlResponse.Body a buffer at a time; the copy has the served length and SHA-256, and the program never held 16 MiB more than before it started.
    program: stream-to-disk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^served: 67108864 bytes, sha256 ([0-9a-f]{16})\n200, Content-Length 67108864\nwritten: 67108864 bytes, sha256 \1\nmost memory held while copying: under 16 MiB\n$'

  - id: buffered
    claim: Reading the whole body into a MemoryStream first gives the same file, but holds 16 MiB or more while doing it.
    program: stream-to-disk.cs
    args: [buffer]
    expect:
      exit: 0
      stdout-matches: '^served: 67108864 bytes, sha256 ([0-9a-f]{16})\n200, Content-Length 67108864\nwritten: 67108864 bytes, sha256 \1\nmost memory held while copying: 16 MiB or more\n$'
