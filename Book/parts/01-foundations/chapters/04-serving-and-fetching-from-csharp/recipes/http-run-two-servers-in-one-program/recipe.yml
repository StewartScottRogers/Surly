# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-run-two-servers-in-one-program
title: Running Two Servers in One Program
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Two SurlServer instances in one program, each started on port 0 with its own Files, bind two different ports; each answers 200 for its own file and 404, with surl's short body "404 Not Found", for the other's, and each StopAsync returns Ok.
    program: two-servers.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^orders on http://127\.0\.0\.1:\d+/\nstock on http://127\.0\.0\.1:\d+/\ntwo ports\norders /orders\.json: 200 \{"orders":3\}\norders /stock\.json: 404 404 Not Found\nstock /orders\.json: 404 404 Not Found\nstock /stock\.json: 200 \{"items":12\}\norders stopped: Ok\nstock stopped: Ok\n$'

  - id: separate-stores
    claim: The stores are separate; a file given to one server is not served by the other, which answers 404 Not Found.
    program: two-servers.cs
    args: []
    expect:
      exit: 0
      stdout-matches: 'orders /stock\.json: 404 404 Not Found\nstock /orders\.json: 404 404 Not Found\n'

  - id: same-port
    claim: A second server asked for the address and port the first one bound fails to start with SurlServerStartException, ExitCode BindFailed, and the first is unharmed, its StopAsync still returns Ok.
    program: two-servers.cs
    args: [same-port]
    expect:
      exit: 0
      stdout: "second server refused: BindFailed\norders stopped: Ok\n"
