# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-show-the-response-headers-in-csharp
title: Reading Response Headers in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Before the body is read, CurlResponse gives the version, 1.1, the status 200 and reason OK, and every header in the order surl sent them, Date, Server, Last-Modified, Content-Type and Content-Length; the body follows.
    program: show-headers.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 200 OK\nDate: [^\n]+ GMT\nServer: surl\nLast-Modified: [^\n]+ GMT\nContent-Type: text/plain\nContent-Length: 16\n\nhello from surl\n\(16 bytes of body\)\n$'

  - id: head-has-no-body
    claim: A HEAD request gets the same headers, Content-Length 16 included, and a body of 0 bytes.
    program: show-headers.cs
    args: [hello.txt, HEAD]
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 200 OK\n(?:[^\n]+\n)*Content-Length: 16\n\n\(0 bytes of body\)\n$'

  - id: not-found-head
    claim: A 404 Not Found has its own, shorter set of headers, Date, Server and Content-Length 0, with no Content-Type or Last-Modified.
    program: show-headers.cs
    args: [missing.txt]
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 404 Not Found\nDate: [^\n]+ GMT\nServer: surl\nContent-Length: 0\n\n\(0 bytes of body\)\n$'
