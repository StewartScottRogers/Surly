# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-fetch-from-a-surl-process
title: Fetching from a surl Process in C#
protocols: [http]
tier: foundations
surface: csharp
surl-options: [--directory]
api-types: [CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 1, 3, 7, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"

# The program is only the client: the server is a surl process, started before the
# cases and stopped after them, as in a console recipe.
servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Curl.Api fetches a file a surl process serves from a directory, prints its contents and exits 0.
    program: fetch.cs
    args: ["http://127.0.0.1:{{port}}/hello.txt"]
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: missing-path
    claim: A path the directory does not hold comes back as a CurlResponse with 404 Not Found, nothing throws, and the program reports it and exits 22 as curl -f would.
    program: fetch.cs
    args: ["http://127.0.0.1:{{port}}/missing.txt"]
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "404 Not Found"

  - id: nothing-listening
    claim: A port nothing listens on throws CurlException with code 7, CouldntConnect, the code curl exits with for the same failure.
    program: fetch.cs
    args: ["http://127.0.0.1:1/hello.txt"]
    expect:
      exit: 7
      stderr-contains: "curl error 7 (CouldntConnect)"

  - id: malformed-url
    claim: A URL curl cannot parse throws CurlException with code 3, UrlMalformat.
    program: fetch.cs
    args: ["http://[oops/hello.txt"]
    expect:
      exit: 3
      stderr-contains: "curl error 3 (UrlMalformat)"

  - id: unsupported-scheme
    claim: A scheme curl has no protocol for throws CurlException with code 1, UnsupportedProtocol.
    program: fetch.cs
    args: ["nosuch://127.0.0.1:{{port}}/hello.txt"]
    expect:
      exit: 1
      stderr-contains: "curl error 1 (UnsupportedProtocol)"
