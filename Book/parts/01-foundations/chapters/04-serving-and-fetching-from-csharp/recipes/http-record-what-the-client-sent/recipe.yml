# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-record-what-the-client-sent
title: Recording What an HTTP Client Sent
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, CurlClient, CurlClientOptions, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With RecordExchanges on, server.Exchanges holds the request head exactly as the client sent it, header X-Trace included, and the status line the server answered.
    program: record.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^exchange 1 on http, truncated: False\n> GET /hello\.txt HTTP/1\.1\n> Host: 127\.0\.0\.1:\d+\n> Accept: \*/\*\n> X-Trace: 42\n< HTTP/1\.1 200 OK\n$'

  - id: no-user-agent
    claim: Curl.Api sends no User-Agent header unless CurlClientOptions.UserAgent sets one.
    program: record.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^(?!.*User-Agent).*$'

  - id: user-agent
    claim: With CurlClientOptions.UserAgent set, the recorded request carries it as a User-Agent header.
    program: record.cs
    args: [agent]
    expect:
      exit: 0
      stdout-matches: '\n> User-Agent: my-test/1\.0\n'

  - id: one-connection-one-exchange
    claim: An exchange is one connection, so two requests from one client over a reused connection are one exchange holding both requests.
    program: record.cs
    args: [requests]
    expect:
      exit: 0
      stdout: "exchanges recorded: 1\nexchange 1: 2 requests\n"

  - id: recording-off
    claim: With RecordExchanges left off, the default, reading server.Exchanges throws InvalidOperationException.
    program: record.cs
    args: ["off"]
    expect:
      exit: 0
      stdout: "recording is off: Exchanges throws InvalidOperationException\n"
