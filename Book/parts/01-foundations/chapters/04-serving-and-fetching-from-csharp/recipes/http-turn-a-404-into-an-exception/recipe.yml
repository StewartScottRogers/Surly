# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-turn-a-404-into-an-exception
title: Turning a 404 into an Exception
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, CurlClient, CurlRequest, CurlResponse, CurlException, HttpRequestException]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: For a path the server has, the helper returns the body of the 200 response as text and throws nothing.
    program: fetch-or-throw.cs
    args: []
    expect:
      exit: 0
      stdout: "id,total\n1,40\n"

  - id: not-found-throws
    claim: For a path the server does not have, SendAsync returns a 404 response without throwing, and the helper turns it into a NotFoundException, an HttpRequestException whose StatusCode is NotFound and whose message names the URL.
    program: fetch-or-throw.cs
    args: [missing.csv]
    expect:
      exit: 1
      stdout-matches: '^NotFoundException, StatusCode NotFound: GET http://127\.0\.0\.1:\d+/missing\.csv answered 404 Not Found\n$'

  - id: other-status
    claim: A 503 Service Unavailable, made by a SurlFault for one path, is not a 404, so the helper throws a plain HttpRequestException with StatusCode ServiceUnavailable, which a catch for NotFoundException lets past.
    program: fetch-or-throw.cs
    args: [busy.csv]
    expect:
      exit: 1
      stdout-matches: '^HttpRequestException, StatusCode ServiceUnavailable: GET http://127\.0\.0\.1:\d+/busy\.csv answered 503 Service Unavailable\n$'

  - id: unreachable-is-not-a-404
    claim: When nothing listens at the URL there is no status to judge; SendAsync itself throws CurlException CouldntConnect, and the helper lets it through unchanged.
    program: fetch-or-throw.cs
    args: [stopped]
    expect:
      exit: 1
      stdout-matches: '^CurlException, Code CouldntConnect: Failed to connect to 127\.0\.0\.1:\d+ after \d+ ms: Could not connect to server\n$'
