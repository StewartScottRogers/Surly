# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-report-download-progress
title: Reporting Download Progress
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlTransferProgress, CurlTransferPhase]
exit-codes: [0]
references: [surl-readme, curl-readme, libcurl-api, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A Progress recorder on a 16 MiB GET prints a line at 25, 50, 75 and 100 percent, in that order, each while the body is still being read.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^downloaded 25% \(\d+ of 16777216 bytes\)\ndownloaded 50% \(\d+ of 16777216 bytes\)\ndownloaded 75% \(\d+ of 16777216 bytes\)\ndownloaded 100% \(16777216 of 16777216 bytes\)\nbody read to its end\nbig\.bin: 200 OK\n'

  - id: reports-climb
    claim: The reports, ten or more, never go back, and the last says 16777216 of 16777216 bytes.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nreports: 10 or more, never going back: yes\nlast report: 16777216 of 16777216 bytes\n'

  - id: phases
    claim: The reports' Phase is Connecting before the body has a size or a byte, then Downloading.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nphases seen: Connecting, Downloading\n$'

  - id: missing
    claim: For a 404 with an empty body no percentage line is printed; DownloadTotal stays 0, the size not known, and the reports stay Connecting.
    program: program.cs
    args: [missing.bin]
    expect:
      exit: 0
      stdout-matches: '^body read to its end\nmissing\.bin: 404 Not Found\nreports: \d+, never going back: yes\nlast report: 0 of 0 bytes\nphases seen: Connecting\n$'
