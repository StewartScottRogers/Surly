# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-serve-and-fetch-in-process
title: Serving and Fetching a File in One C# Program
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Surl.Api serves an in-memory file on a free port, Curl.Api fetches it with 200 OK, StopAsync returns Ok, and the program exits 0.
    program: serve-and-fetch.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^listening on http://127\.0\.0\.1:\d+/\n200 OK\nhello from surl\nserver stopped: Ok\n$'

  - id: free-port
    claim: A listen URL with port 0 binds a free port, and BoundUrl names that port, never 0.
    program: serve-and-fetch.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^listening on http://127\.0\.0\.1:[1-9]\d*/\n'

  - id: missing-path
    claim: A path not in Files is answered 404 Not Found as an ordinary CurlResponse, nothing throws, and the program exits 22 as curl -f would.
    program: serve-and-fetch.cs
    args: [missing.txt]
    expect:
      exit: 22
      stdout-matches: '\n404 Not Found\nserver stopped: Ok\n$'
