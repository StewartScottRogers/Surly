# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-serve-a-folder-from-disk-in-process
title: Serving a Folder from Disk
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 2, 124]
references: [surl-readme, curl-readme]

# The folder the program serves, written into the folder the program runs in.
fixtures:
  site/hello.txt: "hello from surl\n"

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With DataDirectory set to site, Surl.Api serves site/hello.txt at /hello.txt, 200 OK, with its bytes.
    program: serve-folder.cs
    args: [fetch]
    expect:
      exit: 0
      stdout: "/hello.txt: 200 OK\nhello from surl\n"

  - id: state-folder-not-served
    claim: The server keeps its state in a .surl folder inside the folder it serves, its lock file there included, and answers 404 Not Found for anything under /.surl.
    program: serve-folder.cs
    args: [state]
    expect:
      exit: 0
      stdout: "site/.surl/lock exists: True\n/.surl/lock: 404 Not Found\n/.surl/: 404 Not Found\n"

  - id: files-written-later
    claim: A file written into the folder while the server runs is served on the next request, with no restart.
    program: serve-folder.cs
    args: [new-file]
    expect:
      exit: 0
      stdout: "/later.txt: 200 OK\nwritten while serving\n"

  - id: one-server-per-folder
    claim: A second server on the same DataDirectory is refused with SurlServerStartException, surl's exit code 124, DataDirectoryInUse, while the first holds the lock.
    program: serve-folder.cs
    args: [second]
    expect:
      exit: 124
      stdout: "second server refused: 124 (DataDirectoryInUse)\n"

  - id: disk-or-memory
    claim: DataDirectory and Files together are refused with an ArgumentException before anything starts; a server serves one or the other.
    program: serve-folder.cs
    args: [both]
    expect:
      exit: 2
      stdout: "ArgumentException: DataDirectory and Files cannot both be given. (Parameter 'options')\n"
