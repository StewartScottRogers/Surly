# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-download-with-curl-api
title: Downloading over FTP from C#
protocols: [ftp]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlExchangeRecord, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 67, 78]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own FTP server through Surl.Api, on a free port.

cases:
  - id: solution
    role: solution
    claim: A server with one account, and a CurlRequest that carries that user name and password, download hello.txt over FTP and the body is the file.
    program: download.cs
    args: [ok]
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: control-connection
    claim: The control connection the server recorded shows USER alice, a PASS, PWD, EPSV, TYPE I, SIZE and RETR hello.txt, in that order.
    program: download.cs
    args: [commands]
    expect:
      exit: 0
      stdout: "hello from surl\nUSER alice\nPASS ****\nPWD\nEPSV\nTYPE I\nSIZE hello.txt\nRETR hello.txt\n"

  - id: wrong-password
    claim: The wrong password is refused, and SendAsync throws a CurlException whose Code is LoginDenied, 67.
    program: download.cs
    args: [wrong]
    expect:
      exit: 0
      stdout: "LoginDenied (67)\n"

  - id: no-account
    claim: A request with no Authentication gets no login from a server that has an account and no AllowAnonymous, and SendAsync throws a CurlException with Code LoginDenied, 67.
    program: download.cs
    args: [anonymous]
    expect:
      exit: 0
      stdout: "LoginDenied (67)\n"

  - id: password-in-clear
    claim: With AllowPlaintextAuthentication left off, the same right password over plain FTP is refused unchecked, LoginDenied, 67; the solution sets it on.
    program: download.cs
    args: [plaintext]
    expect:
      exit: 0
      stdout: "LoginDenied (67)\n"

  - id: missing-file
    claim: A file the server does not have throws a CurlException whose Code is RemoteFileNotFound, 78.
    program: download.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "RemoteFileNotFound (78)\n"

  - id: dot-file-not-served
    claim: A dot file the server holds is refused as if it were missing, RemoteFileNotFound, 78.
    program: download.cs
    args: [dot]
    expect:
      exit: 0
      stdout: "RemoteFileNotFound (78)\n"
