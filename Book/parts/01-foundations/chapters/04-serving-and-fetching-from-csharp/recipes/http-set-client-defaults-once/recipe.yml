# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-set-client-defaults-once
title: Setting Client Defaults Once
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, CurlClient, CurlClientOptions, CurlRequest, CurlHttpOptions, CurlResponse, CurlException]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A CurlClient created with CurlClientOptions.UserAgent sends that User-Agent on every request, and Surl.Api records it on all three.
    program: client-defaults.cs
    args: []
    expect:
      exit: 0
      stdout: "request 1: User-Agent: report-tests/1.0\nrequest 2: User-Agent: report-tests/1.0\nrequest 3: User-Agent: report-tests/1.0\nevery request carried the default\n"

  - id: override-one-request
    claim: A request whose own CurlHttpOptions sets UserAgent sends that one instead, and the next request is back to the client's default.
    program: client-defaults.cs
    args: [override]
    expect:
      exit: 1
      stdout: "request 1: User-Agent: report-tests/1.0\nrequest 2: User-Agent: one-off/2.0\nrequest 3: User-Agent: report-tests/1.0\nnot every request carried the default\n"

  - id: no-default-no-header
    claim: A client created with no options sends no User-Agent header at all, and the test fails.
    program: client-defaults.cs
    args: [bare]
    expect:
      exit: 1
      stdout: "request 1: (no User-Agent)\nrequest 2: (no User-Agent)\nrequest 3: (no User-Agent)\nnot every request carried the default\n"

  - id: timeout
    claim: The client's two-second Timeout ends a request the server holds for five seconds with CurlException OperationTimedOut, before the server answers.
    program: client-defaults.cs
    args: [timeout]
    expect:
      exit: 0
      stdout: "failed: OperationTimedOut\ngave up before the server answered: yes\n"
