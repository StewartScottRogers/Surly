# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-choose-the-http-version-in-csharp
title: Choosing the HTTP Version in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlHttpOptions, HttpVersion, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110, rfc9113]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Asked for HTTP/1.0, HTTP/1.1 and HTTP/2 with prior knowledge in turn, Surl.Api answers in 1.1, 1.1 and 2.0, and records request lines of HTTP/1.0, HTTP/1.1 and the HTTP/2 connection preface.
    program: choose-version.cs
    args: []
    expect:
      exit: 0
      stdout: "Http10: answered in 1.1, 200, Connection: close\n  server received: GET /hello.txt HTTP/1.0\nHttp11: answered in 1.1, 200\n  server received: GET /hello.txt HTTP/1.1\nHttp2PriorKnowledge: answered in 2.0, 200\n  server received: PRI * HTTP/2.0\n"

  - id: http1-0-gets-1-1
    claim: An HTTP/1.0 request is answered with a 1.1 status line and Connection close, so the response Version is 1.1, not 1.0.
    program: choose-version.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^Http10: answered in 1\.1, 200, Connection: close\n  server received: GET /hello\.txt HTTP/1\.0\n'

  - id: prior-knowledge
    claim: With Http2PriorKnowledge the client opens with the HTTP/2 preface, no HTTP/1.1 request first, and the response Version is 2.0.
    program: choose-version.cs
    args: []
    expect:
      exit: 0
      stdout-matches: 'Http2PriorKnowledge: answered in 2\.0, 200\n  server received: PRI \* HTTP/2\.0\n$'

  - id: upgrade
    claim: Http2 without prior knowledge over http:// sends an HTTP/1.1 request with Upgrade h2c; Surl.Api accepts the upgrade and the response Version is 2.0.
    program: choose-version.cs
    args: [upgrade]
    expect:
      exit: 0
      stdout: "Http2: answered in 2.0, 200\n  server received: GET /hello.txt HTTP/1.1 (Upgrade: h2c)\n"
