# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-resume-an-interrupted-download-in-csharp
title: Resuming an FTP Download in C#
protocols: [ftp]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlException, CurlFtpOptions, CurlHttpOptions]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc959, rfc3659]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api and writes the partial copy itself.

cases:
  - id: solution
    role: solution
    claim: A partial copy of 65,536 bytes is resumed with REST 65536; the other 134,464 bytes arrive, the file is identical to the server's, and the exchange the server recorded shows the REST and its 350 answer; exit 0.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout: "resume: from 65536: 134464 bytes\nupdate.iso: 200000 bytes, identical to the server's\nserver received: REST 65536, RETR update.iso\nserver answered: 350 Restarting at 65536\n"

  - id: resumed-size
    claim: Only the 134,464 missing bytes are fetched, not 200,000.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^resume: from 65536: 134464 bytes\n'

  - id: joined-matches
    claim: The joined file is 200,000 bytes, identical to the server's image.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nupdate.iso: 200000 bytes, identical to the server''s\n'

  - id: rest-offset
    claim: The recorded exchange holds REST with the length of the partial file, 65536, and the server answered 350 Restarting at 65536.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nserver received: REST 65536, RETR update.iso\nserver answered: 350 Restarting at 65536\n$'

  - id: rest-before-retr
    claim: REST comes right before RETR in the exchange, so the server is told where to start and the next command asks for the file.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: 'REST 65536, RETR update\.iso'

  - id: no-partial-file
    claim: With no local file the program sends no REST and fetches all 200,000 bytes; the server answered no 350.
    program: resume.cs
    args: [fresh]
    expect:
      exit: 0
      stdout: "fresh: from 0: 200000 bytes\nupdate.iso: 200000 bytes, identical to the server's\nserver received: RETR update.iso\nserver answered: no 350\n"

  - id: without-rest-starts-over
    claim: Without REST the same request starts at byte 0 and replaces the partial copy, 200,000 bytes, again identical.
    program: resume.cs
    args: [restart]
    expect:
      exit: 0
      stdout: "restart: from 0: 200000 bytes\nupdate.iso: 200000 bytes, identical to the server's\nserver received: RETR update.iso\nserver answered: no 350\n"

  - id: explicit-offset
    claim: REST 100000 sent whatever is on disk receives the last 100,000 bytes of the image, identical to the end of the server's file.
    program: resume.cs
    args: [offset]
    expect:
      exit: 0
      stdout: "offset: from 100000: 100000 bytes\nupdate.iso: 100000 bytes, identical to the last 100000 bytes of the server's\nserver received: REST 100000, RETR update.iso\nserver answered: 350 Restarting at 100000\n"

  - id: wrong-prefix-trusted
    claim: A partial copy of 65,536 zeros is resumed as readily, 134,464 bytes arrive, and the joined file has the right length and the wrong first bytes, so the comparison fails and the test exits 1.
    program: resume.cs
    args: [wrong]
    expect:
      exit: 1
      stdout: "wrong: from 65536: 134464 bytes\nupdate.iso: 200000 bytes, DIFFERENT from the server's\nserver received: REST 65536, RETR update.iso\nserver answered: 350 Restarting at 65536\n"

  - id: checked-against-size
    claim: Without IgnoreContentLength the client expects the 200,000 bytes SIZE reported, so the resumed fetch throws CurlException PartialFile although all 134,464 missing bytes arrived; the REST was sent and answered.
    program: resume.cs
    args: [checked]
    expect:
      exit: 0
      stdout: "checked: from 65536: PartialFile\nupdate.iso: 200000 bytes, identical to the server's\nserver received: REST 65536, RETR update.iso\nserver answered: 350 Restarting at 65536\n"
