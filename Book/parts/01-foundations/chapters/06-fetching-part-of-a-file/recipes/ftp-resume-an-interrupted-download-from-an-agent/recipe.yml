# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs resume.cs, a C# program on the official MCP SDK that
# starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: ftp-resume-an-interrupted-download-from-an-agent
title: Resuming an FTP Download from an Agent
protocols: [ftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_exchanges]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc959, rfc3659]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent resumes a 65,536-byte partial update.iso through curl-mcp with -C -; the other 134,464 bytes arrive, the file is identical to the server's, and get_exchanges holds REST 65536 and the 350 answer; exit 0.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout: "resume: exit 0, 134464 bytes fetched\nupdate.iso: 200000 bytes, identical to the server's\nserver received: REST 65536, RETR update.iso\nserver answered: 350 Restarting at 65536\n"

  - id: resumed-size
    claim: Only the 134,464 missing bytes are fetched, not 200,000; the tool answers exit code 0.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^resume: exit 0, 134464 bytes fetched\n'

  - id: joined-matches
    claim: The joined file is 200,000 bytes, identical to the image the server holds.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nupdate\.iso: 200000 bytes, identical to the server''s\n'

  - id: rest-offset
    claim: The exchange holds REST with the length of the partial file, 65536, and the server sent 350 Restarting at 65536.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nserver received: REST 65536, RETR update\.iso\nserver answered: 350 Restarting at 65536\n$'

  - id: rest-before-retr
    claim: REST comes right before RETR in the exchange, so the server is told where to start and the next command asks for the file.
    program: resume.cs
    args: []
    expect:
      exit: 0
      stdout-matches: 'REST 65536, RETR update\.iso'

  - id: client-side-view
    claim: The curl tool answers the standard error of curl -v as text, so the agent can read the same REST from the client's side.
    program: resume.cs
    args: [verbose]
    expect:
      exit: 0
      stdout-matches: '\n> REST 65536\n$'

  - id: no-partial-file
    claim: With no local file -C - sends no REST and the whole 200,000 bytes arrive; the server sent no 350.
    program: resume.cs
    args: [fresh]
    expect:
      exit: 0
      stdout: "fresh: exit 0, 200000 bytes fetched\nupdate.iso: 200000 bytes, identical to the server's\nserver received: RETR update.iso\nserver answered: no 350\n"

  - id: without-c-starts-over
    claim: Without -C the same fetch starts at byte 0 over the partial copy, 200,000 bytes, again identical.
    program: resume.cs
    args: [restart]
    expect:
      exit: 0
      stdout: "restart: exit 0, 200000 bytes fetched\nupdate.iso: 200000 bytes, identical to the server's\nserver received: RETR update.iso\nserver answered: no 350\n"

  - id: explicit-offset
    claim: -C 100000 receives the last 100,000 bytes of the image, whatever is on disk.
    program: resume.cs
    args: [offset]
    expect:
      exit: 0
      stdout: "offset: exit 0, 100000 bytes fetched\nupdate.iso: 100000 bytes, identical to the last 100000 bytes of the server's\nserver received: REST 100000, RETR update.iso\nserver answered: 350 Restarting at 100000\n"

  - id: wrong-prefix-trusted
    claim: A partial copy of 65,536 other bytes is resumed as readily, 134,464 bytes arrive and the tool answers exit code 0, but the joined file differs from the server's and the program exits 1.
    program: resume.cs
    args: [wrong]
    expect:
      exit: 1
      stdout: "wrong: exit 0, 134464 bytes fetched\nupdate.iso: 200000 bytes, DIFFERENT from the server's\nserver received: REST 65536, RETR update.iso\nserver answered: 350 Restarting at 65536\n"
