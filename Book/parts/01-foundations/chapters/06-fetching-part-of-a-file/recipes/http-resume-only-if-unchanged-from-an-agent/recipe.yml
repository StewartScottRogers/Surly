# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: http-resume-only-if-unchanged-from-an-agent
title: Resuming Only Unchanged Files from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer, put_file, get_exchanges]
exit-codes: [0]
references: [rfc9110, surl-readme, curl-readme, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: After put_file replaces the file between the halves, the transfer that sends Range bytes=100- and If-Range with the first half's ETag is answered 200 with all 180 bytes of version 2, which the agent keeps instead of splicing.
    program: resume-if-unchanged.cs
    args: []
    expect:
      exit: 0
      stdout: "first half: 206, 100 bytes, ETag kept\nput_file: 180 bytes\nsecond half: 200, 180 bytes\nresult: version 2, 180 bytes\nserver saw: Range: bytes=100-\nserver saw: If-Range: <the ETag of the first half>\n"

  - id: unchanged-appends
    claim: With the file left alone the ETag matches, the transfer is answered 206 with the 80 missing bytes, and the two halves make version 1.
    program: resume-if-unchanged.cs
    args: [unchanged]
    expect:
      exit: 0
      stdout: "first half: 206, 100 bytes, ETag kept\nsecond half: 206, 80 bytes\nresult: version 1, 180 bytes\nserver saw: Range: bytes=100-\nserver saw: If-Range: <the ETag of the first half>\n"

  - id: without-if-range-splices
    claim: Without If-Range the transfer after put_file is answered 206 with version 2's last 80 bytes, and the joined text is 180 bytes of neither version.
    program: resume-if-unchanged.cs
    args: [no-if-range]
    expect:
      exit: 0
      stdout: "first half: 206, 100 bytes, ETag kept\nput_file: 180 bytes\nsecond half: 206, 80 bytes\nresult: neither version, 180 bytes\nserver saw: Range: bytes=100-\n"
