# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-download-a-byte-range-in-csharp
title: Fetching a Byte Range in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 1, 2]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A Range header of bytes=100-199 is answered 206 Partial Content with Content-Range bytes 100-199/300 and exactly those 100 bytes, records 10 to 19.
    program: read-slice.cs
    args: []
    expect:
      exit: 0
      stdout: "206 Partial Content\nContent-Range: bytes 100-199/300\n100 bytes\nrecord 10\nrecord 11\nrecord 12\nrecord 13\nrecord 14\nrecord 15\nrecord 16\nrecord 17\nrecord 18\nrecord 19\n"

  - id: past-the-end
    claim: A range that starts past the end is answered 416 Range Not Satisfiable with a 26-byte body, surl's own text "416 Range Not Satisfiable" and none of the file, as an ordinary CurlResponse, and its Content-Range bytes */300 gives the file's length.
    program: read-slice.cs
    args: [400-499]
    expect:
      exit: 2
      stdout: "416 Range Not Satisfiable\nContent-Range: bytes */300\n26 bytes\npast the end: the file is 300 bytes\n"

  - id: cut-at-the-end
    claim: A range that ends past the end is cut there, so the Content-Range names fewer bytes than were asked for and the program does not take it for the slice it asked for.
    program: read-slice.cs
    args: [280-999]
    expect:
      exit: 1
      stdout: "206 Partial Content\nContent-Range: bytes 280-299/300\n20 bytes\nnot the slice asked for\n"

  - id: ignored-range
    claim: A range with its end before its start is ignored, and the whole file comes back with 200 and no Content-Range.
    program: read-slice.cs
    args: [200-100]
    expect:
      exit: 1
      stdout: "200 OK\nContent-Range: (none)\n300 bytes\nnot the slice asked for\n"
