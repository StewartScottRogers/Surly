# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs look-up.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument is the DICT path to ask for.
schema: 2
key: dict-look-up-a-word-from-an-agent
title: Looking Up a Word from an Agent
protocols: [dict]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc2229]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "An agent starts a DICT server on port 0 whose files are the headwords, and the curl tool's curl -s dict://.../d:surly gets 150 and 151 naming the word and the database surl, the definition, a line holding a dot and 250 ok; curl's exitCode is 0."
    program: look-up.cs
    args: [d:surly]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 0\nlines end in CR LF: yes\n220 surl DICT server <mime> <\d+@surl>\n250 ok\n150 1 definitions retrieved\n151 "surly" surl "Files served by surl"\nbad-tempered and unfriendly\n\.\n250 ok\n221 bye\ntool error: no\n$'

  - id: match-by-prefix
    claim: m:surl asks which headwords match; with no strategy named the match is by prefix, so both surl and surly are listed under 152.
    program: look-up.cs
    args: [m:surl]
    expect:
      exit: 0
      stdout-matches: '\n152 2 matches found\nsurl "surl"\nsurl "surly"\n\.\n250 ok\n'

  - id: no-such-word
    claim: A word with no file is answered 552 no match; to the curl tool that is still curl's exit code 0 and not a tool error.
    program: look-up.cs
    args: [d:cheerful]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 0\n.*\n552 no match\n221 bye\ntool error: no\n$'

  - id: crlf
    claim: The reply comes back as the server sent it, every line ended by CR LF, in standardOutput's content.
    program: look-up.cs
    args: [d:surl]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 0\nlines end in CR LF: yes\n.*\nthe server that answers curl\n'
