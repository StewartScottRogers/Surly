# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs run-curl.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the curl arguments it sends.
schema: 2
key: http-run-curl-from-an-agent
title: Running curl from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl]
curl-options: [-s, -S, -f, -w, -o]
exit-codes: [0, 22]
references: [curl-readme, surl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: curl-mcp's curl tool runs curl with the arguments given and answers its exit code, 0, its standard output, the file, and an empty standard error.
    program: run-curl.cs
    args: [fetch]
    expect:
      exit: 0
      stdout: "exitCode: 0\nstandardOutput: \"hello from surl\\n\"\nstandardError: \"\"\nfailure: null\ntool error: no\n"

  - id: status-code
    claim: With -s and -w "%{http_code}", a missing path prints 404 and curl exits 0, so the call is not a tool error.
    program: run-curl.cs
    args: [status]
    expect:
      exit: 0
      stdout: "exitCode: 0\nstandardOutput: \"404\"\nstandardError: \"\"\nfailure: null\ntool error: no\n"

  - id: fail-is-a-tool-error
    claim: With -f the same 404 makes curl exit 22, and a nonzero exit is a tool error whose answer still carries the exit code, in exitCode and in a failure of kind CurlExit.
    program: run-curl.cs
    args: [fail]
    expect:
      exit: 1
      stdout: "exitCode: 22\nstandardOutput: \"\"\nstandardError: \"\"\nfailure: CurlExit, exitCode 22\ncurl exit code 22 (HttpReturnedError)\ntool error: yes\n"

  - id: show-error
    claim: "Adding -S puts curl's own message for that exit, The requested URL returned error: 404, in standard error and in the failure."
    program: run-curl.cs
    args: [show-error]
    expect:
      exit: 1
      stdout-matches: '^exitCode: 22\nstandardOutput: ""\nstandardError: "curl: \(22\) The requested URL returned error: 404(\\r)?\\n"\nfailure: CurlExit, exitCode 22\ncurl: \(22\) The requested URL returned error: 404\ncurl exit code 22 \(HttpReturnedError\)\ntool error: yes\n$'

  - id: write-inside-root
    claim: -o writes the body to a file inside the folder CURL_MCP_ROOT names, and standard output then holds only what -w prints, 200.
    program: run-curl.cs
    args: [write]
    expect:
      exit: 0
      stdout: "exitCode: 0\nstandardOutput: \"200\"\nstandardError: \"\"\nfailure: null\nhello.txt holds: hello from surl\ntool error: no\n"

  - id: path-outside-root-refused
    claim: An -o path outside that folder is refused before curl runs, as PathRefused, so the answer has no exit code and no streams at all.
    program: run-curl.cs
    args: [outside-root]
    expect:
      exit: 1
      stdout-matches: '^exitCode: null\nstandardOutput: null\nstandardError: null\nfailure: PathRefused, exitCode null\nRefused -o: -o ''\.\./hello\.txt'' resolves to ''[^\n]*'', which is outside CURL_MCP_ROOT \(''[^\n]*''\)\.\ntool error: yes\n$'

  - id: unknown-option-refused
    claim: An option curl-mcp does not know is refused the same way, since it cannot tell whether the option names a local path.
    program: run-curl.cs
    args: [unknown]
    expect:
      exit: 1
      stdout: "exitCode: null\nstandardOutput: null\nstandardError: null\nfailure: PathRefused, exitCode null\nRefused --no-such-option: --no-such-option is not an option this server knows, so it cannot tell whether it uses a local path.\ntool error: yes\n"
