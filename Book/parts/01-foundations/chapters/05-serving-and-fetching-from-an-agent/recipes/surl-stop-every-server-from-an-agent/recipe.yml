# Executable specification for a recipe whose subject is surl-mcp (ADR-0008).
# Each case runs stop-every-server.cs, a C# program on the official MCP SDK that starts surl-mcp
# from PATH; its argument picks the scenario.
schema: 2
key: surl-stop-every-server-from-an-agent
title: Stopping Every Server
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, list_servers, stop_server]
exit-codes: [0, 45]
references: [surl-readme, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: list_servers shows both servers the agent started with every URL each listens on, three in all; stop_server stops each with exit code 0 (Ok); list_servers then shows none, and a new server binds each of the three URLs again, so every port is free.
    program: stop-every-server.cs
    args: [stop]
    expect:
      exit: 0
      stdout-matches: '^running: (s\d+) on http://127\.0\.0\.1:\d+/\nrunning: (s\d+) on http://127\.0\.0\.1:\d+/ http://127\.0\.0\.1:\d+/\nstopped \1: exit_code 0 \(Ok\)\nstopped \2: exit_code 0 \(Ok\)\nleft running: 0\nports free: 3 of 3\n$'

  - id: one-stop-frees-every-listener
    claim: One stop_server releases every listener of a server; the server with two listeners leaves both of its ports free.
    program: stop-every-server.cs
    args: [stop]
    expect:
      exit: 0
      stdout-matches: '\nports free: 3 of 3\n$'

  - id: busy-before-the-stop
    claim: While a server runs, starting another on its URL is a tool error carrying surl's exit code 45, BindFailed, which is what the free-port check would see for a port still held.
    program: stop-every-server.cs
    args: [busy]
    expect:
      exit: 1
      stdout-matches: '\nbind http://127\.0\.0\.1:\d+/ while it runs: exit_code 45 \(BindFailed\), tool error: yes\n$'
