# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs fetch-tftp.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: tftp-download-a-file-from-an-agent
title: Downloading over TFTP from an Agent
protocols: [tftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, transfer, get_exchanges, read_file]
exit-codes: [0, 68, 69]
references: [surl-readme, curl-readme, rfc1350]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent starts a TFTP server on port 0 with a file in memory, curl-mcp's curl tool downloads it, exit 0, and get_exchanges shows the first packet the server received was a read request, opcode 1, for hello.txt in octet mode.
    program: fetch-tftp.cs
    args: [fetch]
    expect:
      exit: 0
      stdout: "exit: 0\nhello from surl\nserver received: opcode 1, hello.txt, octet\n"

  - id: transfer-tool
    claim: The transfer tool also downloads over TFTP; the answer has no HTTP status, so statusCode is 0, and the file is in the body.
    program: fetch-tftp.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "statusCode: 0\nhello from surl\n"

  - id: save-to-file
    claim: With -o, the curl tool writes the file into the folder curl-mcp is confined to, byte for byte.
    program: fetch-tftp.cs
    args: [save]
    expect:
      exit: 0
      stdout: "exit: 0\nhello from surl\n"

  - id: missing-file
    claim: A file that is not there is answered with TFTP error 1, and the curl tool answers exit code 68, TftpNotFound.
    program: fetch-tftp.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "exit: 68, curl exit code 68 (TftpNotFound)\n"

  - id: dot-file-not-served
    claim: A file whose name begins with a dot, held by the server, is refused as if it were missing; exit code 68.
    program: fetch-tftp.cs
    args: [dot-file]
    expect:
      exit: 0
      stdout: "exit: 68, curl exit code 68 (TftpNotFound)\n"

  - id: upload-refused
    claim: A write, curl -T, is answered with TFTP error 2 while uploads are off, and the curl tool answers exit code 69, TftpPerm.
    program: fetch-tftp.cs
    args: [upload]
    expect:
      exit: 0
      stdout: "exit: 69\ncurl exit code 69 (TftpPerm)\n"

  - id: upload-with-the-option
    claim: A server started with --allow-uploads accepts the same write, exit code 0, and read_file shows the file in its store.
    program: fetch-tftp.cs
    args: [upload-on]
    expect:
      exit: 0
      stdout: "exit: 0\nsent by the agent\n"
