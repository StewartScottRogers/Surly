# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs choose-version.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-choose-the-http-version-from-an-agent
title: Choosing the HTTP Version from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_exchanges, transfer]
exit-codes: [0]
references: [curl-readme, surl-readme, rfc9110, rfc9113]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Through the curl tool, --http1.0, --http1.1 and --http2-prior-knowledge each exit 0; -w reports answers in 1.1, 1.1 and 2, and the server received request lines in HTTP/1.0, HTTP/1.1 and the HTTP/2 preface.
    program: choose-version.cs
    args: []
    expect:
      exit: 0
      stdout: "--http1.0: exit 0, answered in 1.1\n  server received: GET /hello.txt HTTP/1.0\n--http1.1: exit 0, answered in 1.1\n  server received: GET /hello.txt HTTP/1.1\n--http2-prior-knowledge: exit 0, answered in 2\n  server received: PRI * HTTP/2.0\n"

  - id: http1-0-answered-in-1-1
    claim: An HTTP/1.0 request reaches surl as HTTP/1.0 but is answered in HTTP/1.1, so the answer's version alone does not show what was asked.
    program: choose-version.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^--http1\.0: exit 0, answered in 1\.1\n  server received: GET /hello\.txt HTTP/1\.0\n'

  - id: prior-knowledge
    claim: With --http2-prior-knowledge the connection starts with the HTTP/2 preface, not an HTTP/1.1 request, and the answer is HTTP/2.
    program: choose-version.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '--http2-prior-knowledge: exit 0, answered in 2\n  server received: PRI \* HTTP/2\.0\n$'

  - id: transfer-has-no-version
    claim: The transfer tool has no field for the version; its info answers httpVersion 1.1, and the server received an HTTP/1.1 request.
    program: choose-version.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "transfer: answered in 1.1\n  server received: GET /hello.txt HTTP/1.1\n"
