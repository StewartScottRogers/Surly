# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs check-support.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: surl-check-what-curl-supports-from-an-agent
title: Checking What curl Supports
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [version, curl, start_server]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The version tool answers curl's version number, a version line that begins with it, a list of protocols that holds ftp and tftp, a list of extended protocols that holds redis, a feature list that holds SSL, and a TLS backend by name.
    program: check-support.cs
    args: [version]
    expect:
      exit: 0
      stdout-matches: '^version: \d+\.\d+\.\d+\nversion line starts: True\nprotocols: True, ftp True, tftp True, redis False\nextended protocols: redis True, ftp False\nfeatures: SSL True\ntls backend named: True\n$'

  - id: agrees-with-dash-v
    claim: The version tool and curl -V, run through the curl tool, tell the same story, the first line equal to versionLine, every protocol of the tool in the Protocols line and the same features.
    program: check-support.cs
    args: [agree]
    expect:
      exit: 0
      stdout: "first line is the version line: True\nevery protocol of the tool is in curl -V: True\nfeatures are the same: True\n"

  - id: plan-from-both-hosts
    claim: An agent can ask both hosts about a plan, curl-mcp's version tool whether curl speaks a scheme and surl-mcp's start_server whether surl serves it; an unknown scheme is refused by both.
    program: check-support.cs
    args: [plan]
    expect:
      exit: 0
      stdout: "http: curl yes, surl yes\nftp: curl yes, surl yes\ntftp: curl yes, surl yes\ndict: curl yes, surl yes\nredis: curl yes, surl yes\ncarrier-pigeon: curl no, surl no\n"
