# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# verify starts both hosts once and runs the cases in order; a saved value is {{name}} later.
schema: 2
key: http-serve-and-fetch-from-an-agent
title: Serving and Fetching Files from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer]
exit-codes: [45]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent starts an HTTP server on port 0 with one file in memory, and curl-mcp's transfer fetches that file from the URL start_server says it bound, status 200.
    mcp:
      - host: surl
        tool: start_server
        arguments: { listen_urls: ["http://127.0.0.1:0"], files: { hello.txt: "hello from surl\n" } }
        save: { url: bound_urls.0, server: server_id }
        expect:
          result-contains: { listen_urls: ["http://127.0.0.1:0"] }
      - host: curl
        tool: transfer
        arguments: { url: "{{url}}hello.txt" }
        expect:
          result-contains: { statusCode: 200, body: { content: "hello from surl\n", isBase64: false } }

  - id: headers-as-a-list
    claim: transfer answers the response headers as a list of name and value pairs, here Content-Type text/plain.
    mcp:
      - host: curl
        tool: transfer
        arguments: { url: "{{url}}hello.txt" }
        expect:
          result-contains: { headers: [{ name: Content-Type, value: text/plain }] }

  - id: missing-is-not-an-error
    claim: A path that is not there is answered 404 Not Found, and to transfer that is a successful answer, not a tool error.
    mcp:
      - host: curl
        tool: transfer
        arguments: { url: "{{url}}missing.txt" }
        expect:
          result-contains: { statusCode: 404, failure: null, isError: false }

  - id: port-in-use
    claim: Starting a second server on an address and port already bound is a tool error carrying surl's exit code 45, BindFailed.
    mcp:
      - host: surl
        tool: start_server
        arguments: { listen_urls: ["{{url}}"] }
        expect:
          is-error: true
          result-contains: { exit_code: 45, exit_code_name: BindFailed }

  - id: loopback-only
    claim: A listen URL whose host is not loopback is refused, because only whoever starts surl-mcp can allow that, with --allow-non-loopback.
    mcp:
      - host: surl
        tool: start_server
        arguments: { listen_urls: ["http://0.0.0.0:0"] }
        expect:
          is-error: true
          error-contains: "is not loopback"

  - id: no-file-urls
    claim: transfer refuses a file URL and names the curl tool, which confines local files to its root, instead.
    mcp:
      - host: curl
        tool: transfer
        arguments: { url: "file:///etc/hosts" }
        expect:
          is-error: true
          result-contains: { failure: { kind: InvalidRequest } }
          error-contains: "use the curl tool"
