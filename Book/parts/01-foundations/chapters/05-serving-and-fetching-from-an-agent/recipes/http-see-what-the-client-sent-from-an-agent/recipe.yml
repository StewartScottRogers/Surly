# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs read-exchanges.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario. The server listens on port 0, so each pattern
# captures the bound port once and requires the Host line to name the same one.
schema: 2
key: http-see-what-the-client-sent-from-an-agent
title: Reading the Client's Request from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer, curl, get_exchanges]
curl-options: [-s, -A]
exit-codes: []
references: [surl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: get_exchanges answers the request transfer sent, byte for byte, and the response surl sent back, body last; transfer sends no User-Agent header.
    program: read-exchanges.cs
    args: [all]
    expect:
      exit: 0
      stdout-matches: '^exchange 1: http via http://127\.0\.0\.1:(\d+)/\n  received wire text: "GET /hello\.txt HTTP/1\.1\\r\\nHost: 127\.0\.0\.1:\1\\r\\nAccept: \*/\*\\r\\n\\r\\n"\n  sent wire text: "hello from surl\\n"\nhas_more: false\n$'

  - id: after-an-exchange
    claim: after_exchange_id 1 answers what came after it, here the curl tool's request with the User-Agent that -A names, and has_more false.
    program: read-exchanges.cs
    args: [after]
    expect:
      exit: 0
      stdout-matches: '^exchange 2: http via http://127\.0\.0\.1:(\d+)/\n  received wire text: "GET /hello\.txt HTTP/1\.1\\r\\nHost: 127\.0\.0\.1:\1\\r\\nUser-Agent: surly-reader\\r\\nAccept: \*/\*\\r\\n\\r\\n"\n  sent wire text: "hello from surl\\n"\nhas_more: false\n$'

  - id: a-page-at-a-time
    claim: max_exchanges 1 answers the oldest exchange and has_more true, so an agent reads a long record a page at a time.
    program: read-exchanges.cs
    args: [page]
    expect:
      exit: 0
      stdout-matches: '^exchange 1: [^\n]*\n  received [^\n]*\n  sent [^\n]*\nhas_more: true\n$'

  - id: filtered-by-listener
    claim: scheme, matched without regard to case, and listen_url, spelled as bound_urls spells it, keep the exchanges that came through that listener, here both.
    program: read-exchanges.cs
    args: [filter]
    expect:
      exit: 0
      stdout-matches: '^exchange 1: http via [^\n]*\n  received [^\n]*\n  sent [^\n]*\nexchange 2: http via [^\n]*\n  received [^\n]*User-Agent: surly-reader[^\n]*\n  sent [^\n]*\nhas_more: false\n$'

  - id: unknown-server
    claim: A server ID this host is not running is a tool error, no running server has ID s9.
    program: read-exchanges.cs
    args: [unknown]
    expect:
      exit: 1
      stdout: "no running server has ID s9\n"
