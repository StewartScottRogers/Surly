# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs list.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-list-a-servers-files-from-an-agent
title: Listing a Server's Files from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, list_files, transfer]
exit-codes: []
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: list_files on / answers the root's children in ordinal order of name, each with its kind and a file's byte_count, a folder without one; the agent fetches the .txt files it found with transfer, each 200 with the size listed.
    program: list.cs
    args: [list]
    expect:
      exit: 0
      stdout: "docs folder\nhello.txt file 16 bytes\nlogo.png file 8 bytes\nnotes.txt file 10 bytes\nfetched hello.txt: 200, 16 bytes\nfetched notes.txt: 200, 10 bytes\ntool error: no\n"

  - id: dot-files-not-listed
    claim: A file whose name begins with a dot, .env here, is not listed, as it is never served.
    program: list.cs
    args: [list]
    expect:
      exit: 0
      stdout-matches: '^(?![\s\S]*\.env)docs folder\n'

  - id: one-level
    claim: list_files lists one folder's children, not what is under them; /docs holds the folder archive and the file guide.md.
    program: list.cs
    args: [folder]
    expect:
      exit: 0
      stdout: "archive folder\nguide.md file 8 bytes\ntool error: no\n"

  - id: paging
    claim: With limit 2 the first answer has two entries and has_more true; asking again with after_name set to the last name seen answers the rest and has_more false.
    program: list.cs
    args: [page]
    expect:
      exit: 0
      stdout: "docs folder\nhello.txt file 16 bytes\nhas_more: true\nlogo.png file 8 bytes\nnotes.txt file 10 bytes\nhas_more: false\ntool error: no\n"

  - id: no-such-folder
    claim: A folder that is not there is a tool error, No folder at /nope.
    program: list.cs
    args: [missing]
    expect:
      exit: 1
      stdout: "No folder at /nope.\ntool error: yes\n"

  - id: path-must-be-rooted
    claim: A path without its leading /, docs for /docs, is a tool error naming NotRooted; path is a request path, as a client would send it.
    program: list.cs
    args: [not-rooted]
    expect:
      exit: 1
      stdout: "The path is not one a request may name (NotRooted).\ntool error: yes\n"
