# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs compare-tools.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-compare-the-transfer-and-curl-tools-from-an-agent
title: Choosing transfer or curl
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer, curl]
exit-codes: [0, 22]
references: [curl-readme, surl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: For the same file, transfer answers the status, the headers as a list and the body, while the curl tool answers the exit code and what curl printed, the body alone.
    program: compare-tools.cs
    args: [hello]
    expect:
      exit: 0
      stdout: "transfer: statusCode 200, Content-Type text/plain, body \"hello from surl\\n\", tool error no\ncurl: exitCode 0, standardOutput \"hello from surl\\n\"\n"

  - id: missing
    claim: For a missing path, transfer answers statusCode 404 and is not a tool error; the curl tool without -f exits 0 with only the body, 404 Not Found, so the status is not there to compare, and with -f it exits 22 as a tool error while -w still reports 404.
    program: compare-tools.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "transfer: statusCode 404, Content-Type text/plain; charset=utf-8, body \"404 Not Found\\n\", tool error no\ncurl: exitCode 0, standardOutput \"404 Not Found\\n\"\ncurl -f: exitCode 22, standardOutput \"404\", failure curl exit code 22 (HttpReturnedError)\n"

  - id: save-to-a-file
    claim: The curl tool saves the body to a file inside CURL_MCP_ROOT with -o and --create-dirs, and -w makes its output the status code alone.
    program: compare-tools.cs
    args: [save]
    expect:
      exit: 0
      stdout: "curl: exitCode 0, standardOutput \"200\"\ndownloads/hello.txt: \"hello from surl\\n\"\n"
