# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs stop-server.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks what the program does after the stop. Each pattern captures
# the server's ID and URL once and requires every later line to name the same ones.
schema: 2
key: http-stop-a-server-from-an-agent
title: Stopping a Server from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, list_servers, stop_server, transfer, get_exchanges]
exit-codes: [0, 7]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: list_servers shows the running server by its ID and bound URL, and stop_server stops it with surl's exit code 0, Ok.
    program: stop-server.cs
    args: [stop]
    expect:
      exit: 0
      stdout-matches: '^started (\S+) on (http://127\.0\.0\.1:\d+/)\nrunning: \1 on \2, exchange_count 0\nstopped \1: exit_code 0 \(Ok\)\n$'

  - id: nothing-listens
    claim: After the stop nothing listens on that URL, so a fetch from it fails to connect with curl's exit code 7, a tool error with no status code.
    program: stop-server.cs
    args: [fetch]
    expect:
      exit: 1
      stdout-matches: '^started (\S+) on \S+\nstopped \1: exit_code 0 \(Ok\)\nstatusCode: null, failure: CurlExit, exitCode 7\n$'

  - id: stop-twice
    claim: Stopping the same ID again is a tool error, no running server has that ID.
    program: stop-server.cs
    args: [stop-again]
    expect:
      exit: 1
      stdout-matches: '^started (\S+) on \S+\nstopped \1: exit_code 0 \(Ok\)\nno running server has ID \1\n$'

  - id: exchanges-go-with-it
    claim: The stopped server's exchanges go with it; get_exchanges on its ID is the same tool error.
    program: stop-server.cs
    args: [exchanges]
    expect:
      exit: 1
      stdout-matches: '^started (\S+) on \S+\nstopped \1: exit_code 0 \(Ok\)\nno running server has ID \1\n$'

  - id: port-released
    claim: The port is released, so a new server binds the same URL at once, under a new ID, serves its own file, and list_servers shows only the new server, with its own exchange count, 1.
    program: stop-server.cs
    args: [restart]
    expect:
      exit: 0
      stdout-matches: '^started (\S+) on (\S+)\nstopped \1: exit_code 0 \(Ok\)\nstarted a new ID on \2\nfetched: hello again\nrunning: (\S+) on \2, exchange_count 1\nstopped \3: exit_code 0 \(Ok\)\n$'
