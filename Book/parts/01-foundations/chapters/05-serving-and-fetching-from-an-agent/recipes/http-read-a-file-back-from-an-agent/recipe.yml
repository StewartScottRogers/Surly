# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs read-back.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument is the request path to fetch and read back.
schema: 2
key: http-read-a-file-back-from-an-agent
title: Reading a File Back from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer, read_file]
exit-codes: []
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: For a text file, read_file answers its byte_count, its content as text and its content_type, and the bytes and Content-Type transfer got from the server are the same.
    program: read-back.cs
    args: [/hello.txt]
    expect:
      exit: 0
      stdout: "transfer: 200\nread_file: 16 bytes as text, content_type text/plain\nsame bytes: yes\nsame type: yes (text/plain)\ntool error: no\n"

  - id: binary-as-base64
    claim: For a file that is not valid UTF-8 text, read_file answers base64 in place of text, and the decoded bytes are the ones transfer got, with the same Content-Type, image/png.
    program: read-back.cs
    args: [/logo.png]
    expect:
      exit: 0
      stdout: "transfer: 200\nread_file: 13 bytes as base64, content_type image/png\nsame bytes: yes\nsame type: yes (image/png)\ntool error: no\n"

  - id: nested-path
    claim: A file in a folder is read by its whole request path, /docs/guide.md, and its content_type, text/markdown, is again the one a client is sent.
    program: read-back.cs
    args: [/docs/guide.md]
    expect:
      exit: 0
      stdout: "transfer: 200\nread_file: 8 bytes as text, content_type text/markdown\nsame bytes: yes\nsame type: yes (text/markdown)\ntool error: no\n"

  - id: missing
    claim: A path with no file is 404 to transfer and a tool error to read_file, No file at the path.
    program: read-back.cs
    args: [/nope.txt]
    expect:
      exit: 1
      stdout: "transfer: 404\nread_file: No file at /nope.txt.\ntool error: yes\n"

  - id: folder-is-not-a-file
    claim: A folder is not a file to either tool; /docs is 404 to transfer and No file at /docs to read_file.
    program: read-back.cs
    args: [/docs]
    expect:
      exit: 1
      stdout: "transfer: 404\nread_file: No file at /docs.\ntool error: yes\n"

  - id: dot-file
    claim: A dot file given at start is neither served nor read back; /.env is 404 to transfer and No file at /.env to read_file.
    program: read-back.cs
    args: [/.env]
    expect:
      exit: 1
      stdout: "transfer: 404\nread_file: No file at /.env.\ntool error: yes\n"
