# The recipe's executable specification. Edit this, never the generated files.
# Timings are claimed as ranges or as zero, wide enough for a slow CI runner, never as exact values.
schema: 2
key: http-time-each-phase-of-a-download
title: Timing Each Phase of a Download
protocols: [http]
tier: foundations
surl-options: [--directory, --fault, --cert, --key]
curl-options: [-w, -s, -o, --cacert]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  slow/hello.txt: "hello from surl\n"
  tls/hello.txt: "hello from surl\n"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main is the recipe. slow holds every request 1.5 s before answering; tls is main over HTTPS.
# Each serves its own folder: one surl holds a folder at a time.
servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port
  slow:
    command: surl --directory slow --fault "delay;stage=command;ms=1500" http://127.0.0.1:{{port2}}/
    ready: port
  tls:
    command: surl --directory tls --cert server.pem --key server.key https://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -w prints the time at which each phase ended, in seconds from the start; over plain HTTP on loopback the connection is made in under a second and time_appconnect is 0.
    run: curl -s -o {{null}} -w "namelookup %{time_namelookup}\nconnect %{time_connect}\nappconnect %{time_appconnect}\npretransfer %{time_pretransfer}\nstarttransfer %{time_starttransfer}\ntotal %{time_total}\n" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^namelookup \d+\.\d{6}\nconnect 0\.\d{6}\nappconnect 0\.000000\npretransfer \d+\.\d{6}\nstarttransfer \d+\.\d{6}\ntotal \d+\.\d{6}\n$'

  - id: slow-server
    claim: When the server takes 1.5 s to answer, the wait lands between pretransfer and starttransfer (the first byte); pretransfer stays under a second and starttransfer is 1.5 s or more.
    run: curl -s -o {{null}} -w "pretransfer %{time_pretransfer}\nstarttransfer %{time_starttransfer}\n" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^pretransfer 0\.\d{6}\nstarttransfer (1\.[5-9]\d{5}|[2-9]\.\d{6})\n$'

  - id: tls-handshake
    claim: Over HTTPS, time_appconnect is no longer 0; it marks the end of the Transport Layer Security handshake.
    run: curl -s --cacert server.pem -o {{null}} -w "appconnect %{time_appconnect}\n" https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^appconnect (0\.(?!000000)\d{6}|[1-9]\d*\.\d{6})\n$'

  - id: reused-connection
    claim: The second of two URLs in one command reuses the first one's connection, so its time_connect is 0.
    run: curl -s -o {{null}} -o {{null}} -w "connect %{time_connect}\n" http://127.0.0.1:{{port}}/hello.txt http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^connect 0\.\d{6}\nconnect 0\.000000\n$'
