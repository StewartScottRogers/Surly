# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-log-every-exchange
title: Logging Every Exchange surl Serves
protocols: [http]
tier: foundations
surl-options: [-v, --directory, --log-file, -s, -S, --log-level]
curl-options: [-s, -o, -w]
exit-codes: [0, 2, 23, 58]
references: [surl-readme]

fixtures:
  site/hello.txt: "hello from surl\n"

# The log file is written inside the served folder only so that the cases can
# fetch it and check what it says; in real use, keep it outside.
servers:
  main:
    command: surl -v --directory site --log-file site/surl.log http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A file fetched from a surl started with -v and --log-file comes back as usual, and the exchange goes into the log file.
    run: curl http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: verbose-log-shows-request-and-answer
    claim: At the verbose level the log holds the request line surl received (marked <), what it served and from where (marked *), and the status line it sent back (marked >).
    run: curl -s http://127.0.0.1:{{port}}/surl.log
    expect:
      exit: 0
      stdout-matches: '#\d+ < GET /hello\.txt HTTP/1\.1.*#\d+ \* GET /hello\.txt: 200, 16 bytes of .*#\d+ > HTTP/1\.1 200 OK'

  - id: missing-path
    claim: A path that is not there is answered 404 Not Found.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/missing.txt
    expect:
      exit: 0
      stdout: "404"

  - id: verbose-log-says-why
    claim: The log says why the path was answered 404 Not Found, naming the file that does not exist.
    run: curl -s http://127.0.0.1:{{port}}/surl.log
    expect:
      exit: 0
      stdout-matches: '#\d+ \* GET /missing\.txt: 404, nothing exists at .*#\d+ > HTTP/1\.1 404 Not Found'

  - id: default-writes-failures
    claim: At the default level a surl that cannot start writes a surl (N) line to stderr; https with no certificate exits 58.
    run: surl https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: "surl: (58) https://127.0.0.1:0/ needs a certificate: give --cert <file>, or --self-signed for a throwaway one\n"

  - id: silent-writes-nothing
    claim: With -s the same failure writes nothing at all, and only the exit code says what went wrong.
    run: surl -s https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: ""

  - id: show-error-brings-failures-back
    claim: With -s -S the failure line is written again, and nothing else is.
    run: surl -s -S https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: "surl: (58) https://127.0.0.1:0/ needs a certificate: give --cert <file>, or --self-signed for a throwaway one\n"

  - id: last-level-wins
    claim: The last level option given wins, so -v -s is silent.
    run: surl -v -s https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: ""

  - id: log-level-by-name
    claim: --log-level none is the same as -s.
    run: surl --log-level none https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: ""

  - id: log-level-refused
    claim: A level name surl does not know is a refused command line, written even under -s, and exits 2.
    run: surl -s --log-level loud http://127.0.0.1:{{port}}/ 2>&1
    expect:
      exit: 2
      stdout: "surl: option --log-level: is badly used here\nsurl: try 'surl --help' or 'surl --manual' for more information\n"

  - id: failures-stay-on-stderr
    claim: With --log-file the failure line still goes to stderr.
    run: surl --log-file surl.log https://127.0.0.1:0/
    timeout: 10
    expect:
      exit: 58
      stderr-contains: "surl: (58) https://127.0.0.1:0/ needs a certificate"

  - id: log-file-cannot-open
    claim: A --log-file in a folder that does not exist cannot be opened, and surl exits 23 before it listens.
    run: surl --log-file nodir/surl.log http://127.0.0.1:{{port}}/ 2>&1
    expect:
      exit: 23
      stdout-matches: '^surl: \(23\) Could not open nodir/surl\.log for --log-file'
