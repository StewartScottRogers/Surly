# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
# No servers: block. Both questions are answered by the programs' own version output.
schema: 1
key: surl-list-the-schemes-it-serves
title: Listing the Schemes surl Serves
protocols: [http]
tier: foundations
surl-options: [--version, -V]
curl-options: [-V, -s]
exit-codes: [0, 1]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: surl --version prints its version and platform, a Protocols line and an Extended line, and exits 0.
    run: surl --version
    expect:
      exit: 0
      stdout-matches: '^surl \d+\.\d+\.\d+ \(.+\)\r?\nProtocols: [^\r\n]+\r?\nExtended: [^\r\n]+\r?\n$'

  - id: short-form
    claim: -V is the short form of --version and prints the same.
    run: surl -V
    expect:
      exit: 0
      stdout-matches: '^surl \d+\.\d+\.\d+ \(.+\)\r?\nProtocols: [^\r\n]+\r?\nExtended: [^\r\n]+\r?\n$'

  - id: classic-schemes
    claim: The Protocols line holds the classic schemes, http, https, ftp, tftp and dict among them.
    run: surl --version
    expect:
      exit: 0
      stdout-matches: 'Protocols:(?=[^\n]* http )(?=[^\n]* https )(?=[^\n]* ftp )(?=[^\n]* tftp )(?=[^\n]* dict )[^\n]*\n'

  - id: extended-schemes
    claim: The Extended line holds more schemes, redis and kafka among them.
    run: surl --version
    expect:
      exit: 0
      stdout-matches: 'Extended:(?=[^\n]* redis )(?=[^\n]* kafka )[^\n]*\n'

  - id: curl-protocols
    claim: curl -V prints its version, a Protocols line that holds http, ftp, tftp and file, and a Features line that holds SSL.
    run: curl -V
    expect:
      exit: 0
      stdout-matches: '^curl \d+\.\d+\.\d+ .*\nRelease-Date: .*\nProtocols:(?=[^\n]* http )(?=[^\n]* ftp )(?=[^\n]* tftp )(?=[^\n]* file )[^\n]*\nFeatures:[^\n]* SSL '

  - id: the-lists-differ
    claim: The two lists are not the same list, because surl serves socks5, which curl does not speak as a scheme, and curl reads file, which surl does not serve.
    run: curl -V
    expect:
      exit: 0
      stdout-matches: '^(?!.*Protocols:[^\n]* socks5 ).*Protocols:[^\n]* file '

  - id: surl-has-socks5
    claim: surl lists socks5 and does not list file.
    run: surl --version
    expect:
      exit: 0
      stdout-matches: '^(?!.*Protocols:[^\n]* file ).*Protocols:[^\n]* socks5 '

  - id: unknown-scheme-surl
    claim: A scheme that is on neither list is refused by surl, which exits 1 and names the scheme.
    run: surl carrier-pigeon://127.0.0.1:0/
    expect:
      exit: 1
      stderr-contains: 'Protocol "carrier-pigeon" not supported'

  - id: unknown-scheme-curl
    claim: curl refuses the same scheme too, and exits 1, unsupported protocol.
    run: curl -s carrier-pigeon://127.0.0.1:1/
    expect:
      exit: 1
