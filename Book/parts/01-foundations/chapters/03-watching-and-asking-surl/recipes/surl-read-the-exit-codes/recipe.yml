# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: surl-read-the-exit-codes
title: Reading surl's Exit Codes
protocols: [http, https]
tier: foundations
surl-options: [--directory, -s, -S, --aihelp, --version]
curl-options: []
exit-codes: [0, 1, 58, 124]
references: [surl-readme]

fixtures:
  site/hello.txt: "hello from surl\n"

# The first surl, which holds site; the solution starts a second one on the same directory.
servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A second surl given a --directory another surl holds exits 124 at once, with a surl (124) line naming the directory.
    run: surl --directory site http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout: "surl: (124) Directory site is in use by another surl process\n"

  - id: first-still-serves
    claim: The first surl is untouched and still serves the directory.
    run: curl http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: refused-scheme
    claim: A listen URL whose scheme this build does not serve, such as file, exits 1.
    run: surl file://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 1
      stdout: "surl: (1) Protocol \"file\" not supported\n"

  - id: version-lists-schemes
    claim: surl --version lists the schemes this build serves on its Protocols line, http and https among them.
    run: surl --version
    expect:
      exit: 0
      stdout-matches: '\nProtocols: [^\n]*\bhttp https\b'

  - id: missing-certificate
    claim: An https listen URL with no certificate exits 58, and the line names both ways to give one.
    run: surl https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: "surl: (58) https://127.0.0.1:0/ needs a certificate: give --cert <file>, or --self-signed for a throwaway one\n"

  - id: silent-leaves-only-the-code
    claim: With -s the 124 line is not written, and the exit code alone says what failed.
    run: surl -s --directory site http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout: ""

  - id: silent-unsupported-scheme
    claim: -s silences the exit 1 line too, since a scheme that is not served is found once the command line is read.
    run: surl -s file://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 1
      stdout: ""

  - id: show-error-brings-it-back
    claim: With -s -S the 124 line is written again.
    run: surl -s -S --directory site http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 124
      stdout: "surl: (124) Directory site is in use by another surl process\n"

  - id: look-it-up
    claim: surl --aihelp exit-codes gives each code its name and what to do next; 124 is DataDirectoryInUse, another surl holding the data directory, and the next step names stopping the other surl, another --directory, or serving in memory without --directory.
    run: surl --aihelp exit-codes
    expect:
      exit: 0
      stdout-matches: '\| 124 \| .DataDirectoryInUse. \| Another surl holds the data directory[^|\n]* \| Stop the other surl[^|\n]*another --directory[^|\n]*serve in memory without --directory[^|\n]* \|'
