# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: surl-ask-for-help-as-an-agent
title: Asking surl for Help as an Agent
protocols: []
tier: foundations
surl-options: [--aihelp, -s]
curl-options: []
exit-codes: [0]
references: [surl-readme]

# No servers: every case is a surl that writes its help and exits by itself.
cases:
  - id: solution
    role: solution
    claim: surl --aihelp with no topic writes a Markdown overview ending in a table of topics, exit-codes among them, and exits 0.
    run: surl --aihelp
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp: Overview and topic list\n.*\n## Topics\n.*\| .exit-codes. \| Exit codes and what to do next \|'

  - id: one-topic
    claim: surl --aihelp exit-codes writes the page for that topic alone, with a table giving each exit code its name, its meaning and what to do next.
    run: surl --aihelp exit-codes
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp exit-codes: Exit codes and what to do next\n.*\| Code \| Name \| Meaning \| What to do next \|.*\| 124 \| .DataDirectoryInUse. \| Another surl holds the data directory[^|\n]* \| Stop the other surl[^|\n]* \|'

  - id: five-sections
    claim: A topic page has the sections About, Schemes, Options, Exit codes and Examples, in that order.
    run: surl --aihelp logging
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp logging: [^\n]*\n\n## About\n.*\n## Schemes\n.*\n## Options\n.*\n## Exit codes\n.*\n## Examples\n'

  - id: empty-section-says-so
    claim: A section with nothing in it holds the one line "Nothing for this topic." rather than being left out.
    run: surl --aihelp exit-codes
    expect:
      exit: 0
      stdout-matches: '\n## Schemes\n\nNothing for this topic\.\n\n## Options\n\nNothing for this topic\.\n'

  - id: loosening-options-marked
    claim: The option table says which options loosen security; --self-signed is marked "yes, for tests only".
    run: surl --aihelp testing
    expect:
      exit: 0
      stdout-matches: '\| .--self-signed. \| flag \| off \|[^\n]*\| yes, for tests only \|'

  - id: examples-reach-with-curl
    claim: A protocol topic's examples give the surl command, what it prints, and an upstream curl command that reaches it.
    run: surl --aihelp http
    expect:
      exit: 0
      stdout-matches: '## Examples\n\n### Serve HTTP\n\n...\nsurl http://127\.0\.0\.1:0/\n...\n.*Reach it with upstream curl:\n\n...\ncurl [^\n]*http://127\.0\.0\.1:<port>/\n...'

  - id: topic-in-any-case
    claim: A topic name is matched in any case, so HTTP finds the http topic.
    run: surl --aihelp HTTP
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp http: HTTP and HTTPS protocol\n'

  - id: unknown-topic
    claim: An unknown topic is not an error; surl says so, lists the topics, and exits 0.
    run: surl --aihelp nosuch
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp: unknown topic\n\nUnknown topic provided, here is a list of all topics:\n.*\| .exit-codes. \|'

  - id: all-topics
    claim: surl --aihelp all writes the overview and then the topic pages, amqp to xmpp.
    run: surl --aihelp all
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp: Overview and topic list\n.*\n# surl --aihelp amqp: .*\n# surl --aihelp exit-codes: .*\n# surl --aihelp xmpp: '

  - id: silent-still-helps
    claim: Help goes to stdout even with -s, which silences only the log.
    run: surl -s --aihelp exit-codes
    expect:
      exit: 0
      stdout-matches: '^# surl --aihelp exit-codes: '
