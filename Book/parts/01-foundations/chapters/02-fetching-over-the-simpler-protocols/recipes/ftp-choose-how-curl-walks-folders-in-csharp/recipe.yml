# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-choose-how-curl-walks-folders-in-csharp
title: Choosing the FTP Method in C#
protocols: [ftp]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, SurlExchangeRecord, LogLevel, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions, FtpFileMethod, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Three fetches, each on a client of its own and each three folders down, with FileMethod MultiCwd, SingleCwd and NoCwd, send the commands the exchange records below and each returns its file.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout: "multicwd: CWD a, CWD b, CWD c, SIZE one.txt, RETR one.txt -> one\nsinglecwd: CWD d/e/f, SIZE two.txt, RETR two.txt -> two\nnocwd: SIZE g/h/i/three.txt, RETR g/h/i/three.txt -> three\n"

  - id: multicwd-steps
    claim: MultiCwd sends one CWD for each folder, a then b then c, then SIZE and RETR with the bare file name.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^multicwd: CWD a, CWD b, CWD c, SIZE one\.txt, RETR one\.txt -> one\n'

  - id: singlecwd-steps
    claim: SingleCwd sends the folder path in one CWD, d/e/f, then SIZE and RETR with the bare file name.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsinglecwd: CWD d/e/f, SIZE two\.txt, RETR two\.txt -> two\n'

  - id: nocwd-steps
    claim: NoCwd sends no CWD at all and names the whole path in SIZE and RETR.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nnocwd: SIZE g/h/i/three\.txt, RETR g/h/i/three\.txt -> three\n$'

  - id: default-is-multicwd
    claim: With FileMethod left unset the client behaves as MultiCwd and sends a CWD for each folder.
    program: walk.cs
    args: [default]
    expect:
      exit: 0
      stdout: "default: CWD a, CWD b, CWD c, SIZE one.txt, RETR one.txt -> one\n"

  - id: multicwd-refused
    claim: Under /locked the server answers every CWD 550; with MultiCwd the first CWD fails and SendAsync throws a CurlException with code RemoteAccessDenied, 9, before any SIZE or RETR.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '^multicwd: CWD locked -> 9 RemoteAccessDenied\n'

  - id: singlecwd-refused
    claim: SingleCwd has the same trouble, since one CWD is still a CWD; the CWD of locked/in fails with RemoteAccessDenied.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '\nsinglecwd: CWD locked/in -> 9 RemoteAccessDenied\n'

  - id: nocwd-works-around
    claim: NoCwd never changes folder, so the same file under /locked arrives.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '\nnocwd: SIZE locked/in/there\.txt, RETR locked/in/there\.txt -> there\n'

  - id: refusal-reply
    claim: The server recorded the refusal it sent, 550 CWD is not allowed here, the text of the rule.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '\n550 CWD is not allowed here\n$'

  - id: missing-file
    claim: A missing file in a folder that exists, with MultiCwd, is a CurlException with code RemoteFileNotFound, 78, after the CWDs and a SIZE.
    program: walk.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '^missing file: CWD a, CWD b, CWD c, SIZE nope\.txt -> 78 RemoteFileNotFound\n'

  - id: missing-folder
    claim: A missing folder with MultiCwd is RemoteAccessDenied, 9, since the CWD fails.
    program: walk.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '\nmissing folder, multicwd: CWD a, CWD nope -> 9 RemoteAccessDenied\n'

  - id: missing-folder-nocwd
    claim: The same missing folder with NoCwd is RemoteFileNotFound, 78, since only the file lookup fails.
    program: walk.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '\nmissing folder, nocwd: SIZE a/nope/x\.txt -> 78 RemoteFileNotFound\n$'

  - id: server-log
    claim: The server log, taken through SurlServerOptions.Log at LogLevel.Verbose, holds one CWD d/e/f, one RETR g/h/i/three.txt, and no CWD into g, h or i.
    program: walk.cs
    args: [log]
    expect:
      exit: 0
      stdout-matches: '\nCWD d/e/f logged: 1\nRETR g/h/i/three\.txt logged: 1\nCWD into g, h or i logged: 0\n$'
