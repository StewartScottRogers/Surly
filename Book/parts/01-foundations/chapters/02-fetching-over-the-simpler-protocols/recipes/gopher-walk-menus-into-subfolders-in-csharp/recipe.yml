# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: gopher-walk-menus-into-subfolders-in-csharp
title: Walking Gopher Menus in C#
protocols: [gopher]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: []

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "From the root menu the program follows each menu's first directory entry by the selector on its line, down two levels to the archive folder, then fetches the file that menu lists."
    program: program.cs
    args: ["walk"]
    expect:
      exit: 0
      stdout: "menu / -> /notes\nmenu /notes -> /notes/archive\nfile /notes/archive/2025.txt\nold news\n"

  - id: folder-menu
    claim: "A folder's menu lists its own entries, a file as type 0 and a folder as type 1, each with the full selector from the root, so the notes menu names the archive folder as /notes/archive."
    program: program.cs
    args: ["folder-menu"]
    expect:
      exit: 0
      stdout: "1archive\t/notes/archive\t127.0.0.1\tPORT\n0today.txt\t/notes/today.txt\t127.0.0.1\tPORT\n.\n"

  - id: deepest-menu
    claim: "A folder with no sub-folders answers a menu of files only."
    program: program.cs
    args: ["deepest-menu"]
    expect:
      exit: 0
      stdout: "02025.txt\t/notes/archive/2025.txt\t127.0.0.1\tPORT\n.\n"

  - id: file-by-selector
    claim: "A file listed in a nested menu is fetched with its selector, byte for byte."
    program: program.cs
    args: ["file-by-selector"]
    expect:
      exit: 0
      stdout: "old news\n"

  - id: trailing-slash
    claim: "A trailing slash names the same folder: the answers for notes/ and notes are identical."
    program: program.cs
    args: ["trailing-slash"]
    expect:
      exit: 0
      stdout: "True\n"

  - id: type-is-not-checked
    claim: "The item type in the URL is not checked: asked for as a menu, a file is still answered as a file, and asked for as a file, a folder is still answered as its menu."
    program: program.cs
    args: ["type-is-not-checked"]
    expect:
      exit: 0
      stdout: "hello from surl\n02025.txt\t/notes/archive/2025.txt\t127.0.0.1\tPORT\n.\n"

  - id: missing-folder
    claim: "A selector inside the served folder that names nothing is answered with the fixed error menu, one type 3 line that does not repeat the selector, and nothing is thrown."
    program: program.cs
    args: ["missing-folder"]
    expect:
      exit: 0
      stdout: "3Nothing is served at this selector.\t\terror.host\t1\n.\n"

  - id: missing-file
    claim: "A missing file gets the same error menu, so the first character of the answer, not an exception, tells a menu line from an error."
    program: program.cs
    args: ["missing-file"]
    expect:
      exit: 0
      stdout: "3Nothing is served at this selector.\t\terror.host\t1\n.\n"

  - id: listing-off-no-walk
    claim: "With ListDirectories off, the root and the folders answer the error menu, so a walk cannot start."
    program: program.cs
    args: ["listing-off-no-walk"]
    expect:
      exit: 0
      stdout: "3Nothing is served at this selector.\t\terror.host\t1\n.\n3Nothing is served at this selector.\t\terror.host\t1\n.\n"

  - id: listing-off-file-served
    claim: "With ListDirectories off, a file whose selector is known is still served."
    program: program.cs
    args: ["listing-off-file-served"]
    expect:
      exit: 0
      stdout: "hello from surl\n"

