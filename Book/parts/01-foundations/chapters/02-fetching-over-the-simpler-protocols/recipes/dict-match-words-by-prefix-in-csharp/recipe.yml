# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: dict-match-words-by-prefix-in-csharp
title: Finding Words That Match in C#
protocols: [dict]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc2229]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "m:ap:*:prefix is answered 152 listing apple and apricot and not banana, the program picks the first, and d:apple is answered with its definition, in the body of an ordinary GET."
    program: program.cs
    args: ["m:ap:*:prefix"]
    expect:
      exit: 0
      stdout-matches: '^220 surl DICT server <mime> <\d+@surl>\n250 ok\n152 2 matches found\nsurl "apple"\nsurl "apricot"\n\.\n250 ok\n221 bye\npicked: apple\n.*150 1 definitions retrieved\n151 "apple" surl "Files served by surl"\na round fruit\n\.\n250 ok\n221 bye\n$'

  - id: strategy-defaults-to-prefix
    claim: "With the strategy left out, m:ap lists the same two words."
    program: program.cs
    args: ["m:ap"]
    expect:
      exit: 0
      stdout-matches: '152 2 matches found\nsurl "apple"\nsurl "apricot"\n\.\n'

  - id: exact-is-not-prefix
    claim: "The exact strategy is answered 552 no match, and the response is still a successful one, so nothing is thrown and the program has nothing to pick."
    program: program.cs
    args: ["m:ap:*:exact"]
    expect:
      exit: 0
      stdout-matches: '\n552 no match\n221 bye\nnothing to pick\n$'

  - id: strategy-not-offered
    claim: "A strategy the server does not offer, suffix, is answered 551 invalid strategy."
    program: program.cs
    args: ["m:ple:*:suffix"]
    expect:
      exit: 0
      stdout-matches: '\n551 invalid strategy, use "SHOW STRAT" for a list of strategies\n221 bye\nnothing to pick\n$'

  - id: strategies-offered
    claim: "show:strat lists the two strategies the server offers, exact and prefix."
    program: program.cs
    args: ["show:strat"]
    expect:
      exit: 0
      stdout-matches: '111 2 strategies available\nexact "Match headwords exactly"\nprefix "Match prefixes"\n\.\n'

  - id: case-matters
    claim: "Headwords are matched as written: m:AP is answered 552 no match."
    program: program.cs
    args: ["m:AP"]
    expect:
      exit: 0
      stdout-matches: '\n552 no match\n221 bye\nnothing to pick\n$'
