# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: telnet-hold-a-line-session-in-csharp
title: Holding a Telnet Session in C#
protocols: [telnet]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlTelnetOptions]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc854]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Three lines sent over a socket to surl's TELNET server come back as the banner, the two echoes and bye, and the server then closes the connection.
    program: telnet-session.cs
    args: []
    expect:
      exit: 0
      stdout: "surl TELNET server: each line is echoed back; quit ends the session.\nhello\nworld\nbye\n[the server closed the connection]\n"

  - id: quit-any-case
    claim: QUIT in capitals ends the session as quit does, and the line after it is never read.
    program: telnet-session.cs
    args: [upper]
    expect:
      exit: 0
      stdout: "surl TELNET server: each line is echoed back; quit ends the session.\none\nbye\n[the server closed the connection]\n"

  - id: no-quit
    claim: A session that never sends quit stays open after the last echo; the server says nothing more and does not close.
    program: telnet-session.cs
    args: [no-quit]
    expect:
      exit: 0
      stdout: "surl TELNET server: each line is echoed back; quit ends the session.\nhello\n[the server went quiet and the session is still open]\n"

  - id: line-too-long
    claim: A line of 9000 characters is past the default limit of 8192 bytes; the server answers line too long and closes the connection, with no bye.
    program: telnet-session.cs
    args: [too-long]
    expect:
      exit: 0
      stdout: "surl TELNET server: each line is echoed back; quit ends the session.\nline too long\n[the server closed the connection]\n"

  - id: banner-and-terminal-type
    claim: Curl.Api opens the session, delivers the banner as the first line of the response body, and with TelnetOptions TTYPE=vt100 the server's log records vt100 as the terminal type.
    program: telnet-session.cs
    args: [banner]
    expect:
      exit: 0
      stdout: "surl TELNET server: each line is echoed back; quit ends the session.\nThe client's terminal type (TERMINAL-TYPE) is vt100.\n"
