# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 2
key: ftp-read-a-files-size-and-date
title: Reading an FTP File's Size and Date
protocols: [ftp]
tier: foundations
surl-options: [--directory, --allow-anonymous]
curl-options: [-I, -v, -s, -R, -o]
exit-codes: [0, 67, 78]
references: [surl-readme, curl-readme, rfc959]

fixtures:
  site/hello.txt: "hello from surl\n"
  marker.txt: "written after the time was set\n"
  keep-time.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Downloads the URL in the first argument with the curl options after it, then says
    # whether the local copy is older than marker.txt, a file written a moment ago.
    url=$1; shift
    curl -s "$@" -o copy.txt "$url" || exit
    if [ copy.txt -ot marker.txt ]; then echo "copy is older than marker.txt"; else echo "copy is new"; fi

# Give the served file a modification time in the past, as a real server's files have.
setup:
  - touch -t 202401021504.05 site/hello.txt

servers:
  main:
    command: surl --directory site --allow-anonymous ftp://127.0.0.1:{{port}}/
    ready: port
  closed:
    command: surl ftp://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -I asks for the file's modification time and size and prints them as headers, Last-Modified from MDTM and Content-Length from SIZE, without downloading the file.
    run: curl -I ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^Last-Modified: \w{3}, 0[123] Jan 2024 \d\d:\d\d:\d\d GMT\r?\nContent-Length: 16\r?\nAccept-ranges: bytes\r?\n$'

  - id: asks-with-mdtm-and-size
    claim: The two answers come from two FTP commands, MDTM for the time and SIZE for the length, which -v shows.
    run: curl -I -v -s ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stderr-contains: "> MDTM hello.txt"

  - id: size-reply
    claim: surl answers SIZE with 213 and the length in bytes, 16 for the 16-byte file.
    run: curl -I -v -s ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stderr-contains: "< 213 16"

  - id: time-reply
    claim: surl answers MDTM with 213 and the time as year, month, day, hour, minute and second in Coordinated Universal Time, 14 digits.
    run: curl -I -v -s ftp://127.0.0.1:{{port}}/hello.txt 2>&1
    expect:
      exit: 0
      stdout-matches: '< 213 2024010?[123]\d{6}\r?\n'

  - id: no-data-connection
    claim: Nothing is downloaded, because no data connection is set up and none of EPSV, PASV, EPRT, PORT or RETR is sent.
    run: curl -I -v -s ftp://127.0.0.1:{{port}}/hello.txt 2>&1
    expect:
      exit: 0
      stdout-matches: '^(?!.*(EPSV|PASV|EPRT|PORT|RETR)).*$'

  - id: copy-keeps-the-time
    claim: With -R, a downloaded copy takes the server's modification time, so it is older than a file written a moment ago.
    run: sh keep-time.sh ftp://127.0.0.1:{{port}}/hello.txt -R
    expect:
      exit: 0
      stdout: "copy is older than marker.txt\n"

  - id: copy-without-r-is-new
    claim: Without -R, the same copy is dated when it was written, so it is not older than that file.
    run: sh keep-time.sh ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "copy is new\n"

  - id: missing-file
    claim: A file that is not there is answered 550 to SIZE, and curl -I exits 78, remote file not found, printing no headers.
    run: curl -I -s ftp://127.0.0.1:{{port}}/missing.txt
    expect:
      exit: 78
      stdout: ""

  - id: login-refused-without-the-option
    claim: Without --allow-anonymous, the same server refuses curl's anonymous login before it is asked anything, and curl -I exits 67, login denied.
    run: curl -I -s ftp://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 67
      stdout: ""
