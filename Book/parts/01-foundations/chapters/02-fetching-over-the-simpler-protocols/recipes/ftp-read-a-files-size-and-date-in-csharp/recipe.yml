# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-read-a-files-size-and-date-in-csharp
title: Reading FTP Sizes in C#
protocols: [ftp]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A HEAD request with MDTM as a quote command returns the file's size, 14, from Content-Length and its modification time, 2 January 2024 15:04:05 UTC, from the reply to MDTM, and the server received MDTM and SIZE only.
    program: check-file.cs
    args: []
    expect:
      exit: 0
      stdout: "size: 14\nmodified: 2024-01-02T15:04:05Z\ncommands: MDTM SIZE\n"

  - id: no-download
    claim: The server received no RETR and set up no data connection, so asking costs two short replies and the file is not downloaded.
    program: check-file.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^(?!.*(RETR|EPSV|PASV)).*$'

  - id: sync-decision
    claim: A sync tool that compares the remote size and time with its local copy downloads on the first run and, after setting the copy's time to the server's, finds it up to date on the second.
    program: check-file.cs
    args: [sync]
    expect:
      exit: 0
      stdout: "run 1: download\nrun 2: up to date\n"

  - id: missing-file
    claim: Asking about a file that is not there throws a CurlException, with code QuoteError, 21, because the MDTM quote command is answered 550 before SIZE is tried.
    program: check-file.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "missing: CurlException 21 QuoteError\n"

  - id: anonymous-login-refused
    claim: Without AllowAnonymous, the server refuses the anonymous login and SendAsync throws a CurlException with code LoginDenied, 67.
    program: check-file.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "refused: CurlException 67 LoginDenied\n"
