# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: gopher-walk-menus-into-subfolders
title: Walking Gopher Menus
protocols: [gopher]
tier: foundations
surl-options: [--directory, --list-directories]
curl-options: [-s]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/notes/today.txt: "nothing happened\n"
  site/notes/archive/2025.txt: "old news\n"
  bare/hello.txt: "hello from surl\n"
  walk.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Usage: sh walk.sh PORT. Starts at the root menu, follows the first directory entry
    # of each menu until a menu has none, then fetches the first file that menu lists.
    base=gopher://127.0.0.1:$1
    sel=""
    while :; do
      menu=$(curl -s "$base/1$sel" | tr -d '\r')
      next=$(printf '%s\n' "$menu" | awk -F'\t' '/^1/ { print $2; exit }')
      [ -z "$next" ] && break
      echo "menu ${sel:-/} -> $next"
      sel=$next
    done
    file=$(printf '%s\n' "$menu" | awk -F'\t' '/^0/ { print $2; exit }')
    echo "file $file"
    curl -s "$base/0$file"

servers:
  main:
    command: surl --directory site --list-directories gopher://127.0.0.1:{{port}}/
    ready: port
  bare:
    command: surl --directory bare gopher://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: "Starting from the root menu, the script follows each menu's first directory entry by the selector on its line, down two levels to the archive folder, then fetches the file that menu lists, and curl exits 0 at every step."
    run: sh walk.sh {{port}}
    expect:
      exit: 0
      stdout: "menu / -> /notes\nmenu /notes -> /notes/archive\nfile /notes/archive/2025.txt\nold news\n"

  - id: folder-menu
    claim: "A folder's menu lists its own entries, a file as type 0 and a folder as type 1, each with the full selector from the root, so /1/notes names the archive folder as /notes/archive."
    run: curl -s gopher://127.0.0.1:{{port}}/1/notes
    expect:
      exit: 0
      stdout-matches: '^1archive\t/notes/archive\t127\.0\.0\.1\t\d+\n0today\.txt\t/notes/today\.txt\t127\.0\.0\.1\t\d+\n\.\n$'

  - id: deepest-menu
    claim: "A folder with no sub-folders answers a menu of files only."
    run: curl -s gopher://127.0.0.1:{{port}}/1/notes/archive
    expect:
      exit: 0
      stdout-matches: '^02025\.txt\t/notes/archive/2025\.txt\t127\.0\.0\.1\t\d+\n\.\n$'

  - id: file-by-selector
    claim: "A file listed in a nested menu is fetched with its selector, byte for byte."
    run: curl -s gopher://127.0.0.1:{{port}}/0/notes/archive/2025.txt
    expect:
      exit: 0
      stdout: "old news\n"

  - id: trailing-slash
    claim: "A trailing slash names the same folder: /1/notes/ answers the menu /1/notes does."
    run: curl -s gopher://127.0.0.1:{{port}}/1/notes/
    expect:
      exit: 0
      stdout-matches: '^1archive\t/notes/archive\t127\.0\.0\.1\t\d+\n0today\.txt\t/notes/today\.txt\t127\.0\.0\.1\t\d+\n\.\n$'

  - id: type-is-not-checked
    claim: "The item type in the URL is not sent and not checked: asked for as a menu, a file is still answered as a file, and asked for as a file, a folder is still answered as its menu."
    run: curl -s gopher://127.0.0.1:{{port}}/1/hello.txt gopher://127.0.0.1:{{port}}/0/notes/archive
    expect:
      exit: 0
      stdout-matches: '^hello from surl\n02025\.txt\t/notes/archive/2025\.txt\t127\.0\.0\.1\t\d+\n\.\n$'

  - id: missing-folder
    claim: "A selector inside the served folder that names nothing is answered with the fixed error menu, one type 3 line that does not repeat the selector, and curl exits 0."
    run: curl -s gopher://127.0.0.1:{{port}}/1/notes/nope
    expect:
      exit: 0
      stdout-matches: '^3Nothing is served at this selector\.\t\terror\.host\t1\n\.\n$'

  - id: missing-file
    claim: "A missing file gets the same error menu, so the first character of the answer, not the exit code, tells a menu line from an error."
    run: curl -s gopher://127.0.0.1:{{port}}/0/notes/archive/2026.txt
    expect:
      exit: 0
      stdout-matches: '^3Nothing is served at this selector\.\t\terror\.host\t1\n\.\n$'

  - id: listing-off-no-walk
    claim: "Without --list-directories the root and the folders answer the error menu, so a walk cannot start."
    run: curl -s gopher://127.0.0.1:{{port2}}/ gopher://127.0.0.1:{{port2}}/1/notes
    expect:
      exit: 0
      stdout-matches: '^(3Nothing is served at this selector\.\t\terror\.host\t1\n\.\n){2}$'

  - id: listing-off-file-served
    claim: "Without --list-directories a file whose selector is known is still served."
    run: curl -s gopher://127.0.0.1:{{port2}}/0/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
