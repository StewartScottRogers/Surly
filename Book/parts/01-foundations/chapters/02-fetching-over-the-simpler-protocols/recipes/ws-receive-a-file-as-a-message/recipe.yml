# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: ws-receive-a-file-as-a-message
title: Receiving a File as a WebSocket Message
protocols: [ws]
tier: foundations
surl-options: [--directory]
curl-options: [-s, -o, -w, -X]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  main:
    command: surl --directory site ws://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The upgrade to a file that exists is accepted, the file arrives as the message, and curl writes its bytes to standard output and exits 0.
    run: curl ws://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: switching-protocols
    claim: The upgrade is answered 101 Switching Protocols, and with -o the message is written to a local file byte for byte.
    run: curl -s -o copy.txt -w "%{http_code}" ws://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "101"
      files:
        copy.txt: "hello from surl\n"

  - id: missing-path
    claim: An upgrade to a path that is not there is refused 404 Not Found, and curl exits 22 without -f, as it does for any answer but 101.
    run: curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port}}/missing.txt
    expect:
      exit: 22
      stdout: "404"

  - id: dot-file-not-served
    claim: A file whose name begins with a dot is refused 404 as if it were missing; curl exits 22.
    fixtures:
      site/.secret: "not for you\n"
    run: curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port}}/.secret
    expect:
      exit: 22
      stdout: "404"

  - id: wrong-method
    claim: An upgrade with a method other than GET is refused 405 Method Not Allowed, and curl exits 22.
    run: curl -s -o {{null}} -w "%{http_code}" -X POST ws://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: "405"

  - id: plain-http-refused
    claim: A plain HTTP GET with no upgrade, sent to the same listener, is answered 426 Upgrade Required, and curl exits 0, since this is a plain HTTP transfer and -f was not given.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "426"
