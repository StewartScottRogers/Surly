# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: ftp-choose-passive-or-active-mode
title: Choosing Passive or Active FTP
protocols: [ftp]
tier: foundations
surl-options: [--directory, --allow-anonymous, -v, --log-file]
curl-options: [-v, -s, -o, -P, --disable-epsv, --disable-eprt]
exit-codes: [0, 30, 67]
references: [surl-readme, curl-readme, rfc959]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/passive.txt: "fetched passive\n"
  site/active.txt: "fetched active\n"

servers:
  main:
    command: surl -v --directory site --allow-anonymous --log-file site/surl.log ftp://127.0.0.1:{{port}}/
    ready: port
  closed:
    command: surl ftp://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --disable-epsv, curl asks for a passive data connection with PASV and the file arrives, exit 0.
    run: curl -v --disable-epsv ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
      stderr-contains: "> PASV"

  - id: pasv-answered
    claim: surl answers PASV with 227 and the address and port as six decimal numbers.
    run: curl -v -s -o {{null}} --disable-epsv ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stderr-contains: "< 227 Entering Passive Mode (127,0,0,1,"

  - id: default-is-epsv
    claim: With no mode option, curl tries extended passive mode first and sends EPSV.
    run: curl -v -s -o {{null}} ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stderr-contains: "> EPSV"

  - id: epsv-answered
    claim: surl answers EPSV with 229, the port to connect to, and the transfer goes on over it.
    run: curl -v -s -o {{null}} ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stderr-contains: "< 229 Entering Extended Passive Mode"

  - id: active-eprt
    claim: With -P -, curl opens a listening port itself and sends EPRT, giving the server its address and port, and the file arrives.
    run: curl -v -P - ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
      stderr-contains: "> EPRT |1|127.0.0.1|"

  - id: active-port
    claim: With -P - and --disable-eprt, curl sends the older PORT command, the address and port as six decimal numbers, and the file arrives.
    run: curl -v -P - --disable-eprt ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
      stderr-contains: "> PORT 127,0,0,1,"

  - id: passive-file
    claim: A second file fetched with --disable-epsv, so passively, arrives intact.
    run: curl -s --disable-epsv ftp://127.0.0.1:{{port}}/passive.txt
    expect:
      exit: 0
      stdout: "fetched passive\n"

  - id: active-file
    claim: A third file fetched with -P -, so actively, arrives intact.
    run: curl -s -P - ftp://127.0.0.1:{{port}}/active.txt
    expect:
      exit: 0
      stdout: "fetched active\n"

  - id: read-the-log
    claim: surl's log, which this recipe writes into the served directory and so reads back over FTP, records the second file's data connection as passive and the third's as active, after an EPRT.
    run: curl -s ftp://127.0.0.1:{{port}}/surl.log
    expect:
      exit: 0
      stdout-matches: 'RETR passive\.txt\S*\s#\d+ \* Data connection opened: passive.*EPRT \|1\|127\.0\.0\.1\|\d+\|.*RETR active\.txt\S*\s#\d+ \* Data connection opened: active'

  - id: address-pinned
    claim: With -P and an address instead of -, curl names that address in EPRT; the address of the client itself is accepted.
    run: curl -v -s -P 127.0.0.1 ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
      stderr-contains: "> EPRT |1|127.0.0.1|"

  - id: other-address-refused
    claim: surl accepts an active connection only back to the client that asks for it; EPRT naming another address is answered 501, and curl exits 30, FTP port command failed.
    run: curl -v -s -P 192.0.2.1 ftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 30
      stderr-contains: "< 501 Address must be your own, port 1024 or above"

  - id: login-refused-without-the-option
    claim: Without --allow-anonymous, the same server refuses curl's anonymous login, and curl exits 67, login denied, whatever the mode.
    run: curl -s -P - ftp://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 67
      stdout: ""
