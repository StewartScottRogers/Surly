# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs walk.cs, a C# program on the official MCP SDK that
# starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: ftp-choose-how-curl-walks-folders-from-an-agent
title: Choosing the FTP Method from an Agent
protocols: [ftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_exchanges]
exit-codes: [0, 9, 78]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Three fetches through curl-mcp, each three folders down, with --ftp-method multicwd, singlecwd and nocwd, and get_exchanges holds the commands each sent; each fetch exits 0 with its file.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout: "multicwd: CWD a, CWD b, CWD c, SIZE one.txt, RETR one.txt -> exit 0, one\nsinglecwd: CWD d/e/f, SIZE two.txt, RETR two.txt -> exit 0, two\nnocwd: SIZE g/h/i/three.txt, RETR g/h/i/three.txt -> exit 0, three\n"

  - id: multicwd-steps
    claim: multicwd sends one CWD for each folder, a then b then c, then SIZE and RETR with the bare file name.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^multicwd: CWD a, CWD b, CWD c, SIZE one\.txt, RETR one\.txt -> exit 0, one\n'

  - id: singlecwd-steps
    claim: singlecwd sends the folder path in one CWD, d/e/f, then SIZE and RETR with the bare file name.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsinglecwd: CWD d/e/f, SIZE two\.txt, RETR two\.txt -> exit 0, two\n'

  - id: nocwd-steps
    claim: nocwd sends no CWD at all and names the whole path in SIZE and RETR.
    program: walk.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nnocwd: SIZE g/h/i/three\.txt, RETR g/h/i/three\.txt -> exit 0, three\n$'

  - id: default-is-multicwd
    claim: A fetch with no --ftp-method sends a CWD for each folder, as multicwd does.
    program: walk.cs
    args: [default]
    expect:
      exit: 0
      stdout: "default: CWD a, CWD b, CWD c, SIZE one.txt, RETR one.txt -> exit 0, one\n"

  - id: client-side-view
    claim: The curl tool answers the standard error of curl -v as text, so the agent can read the same CWD from the client's side.
    program: walk.cs
    args: [verbose]
    expect:
      exit: 0
      stdout: "> CWD d/e/f\nverbose: CWD d/e/f, SIZE two.txt, RETR two.txt -> exit 0, two\n"

  - id: multicwd-refused
    claim: Under /locked the server answers every CWD 550; with multicwd the first CWD fails, the tool answers exit code 9 and no SIZE or RETR follows.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '^multicwd: CWD locked -> exit 9, \n'

  - id: singlecwd-refused
    claim: singlecwd has the same trouble, since one CWD is still a CWD; the CWD of locked/in is refused, exit code 9.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '\nsinglecwd: CWD locked/in -> exit 9, \n'

  - id: nocwd-works-around
    claim: nocwd never changes folder, so the same file under /locked arrives, exit code 0.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '\nnocwd: SIZE locked/in/there\.txt, RETR locked/in/there\.txt -> exit 0, there\n$'

  - id: refusal-reply
    claim: The exchange get_exchanges records holds the refusal the server sent, 550 CWD is not allowed here, the text of the rule.
    program: walk.cs
    args: [locked]
    expect:
      exit: 0
      stdout-matches: '\n550 CWD is not allowed here\n'

  - id: missing-file
    claim: A missing file in a folder that exists, with multicwd, is exit code 78 after the CWDs and a SIZE.
    program: walk.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '^missing file: CWD a, CWD b, CWD c, SIZE nope\.txt -> exit 78, \n'

  - id: missing-folder
    claim: A missing folder with multicwd is exit code 9, since the CWD fails.
    program: walk.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '\nmissing folder, multicwd: CWD a, CWD nope -> exit 9, \n'

  - id: missing-folder-nocwd
    claim: The same missing folder with nocwd is exit code 78, since only the file lookup fails.
    program: walk.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '\nmissing folder, nocwd: SIZE a/nope/x\.txt -> exit 78, \n$'
