# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-choose-passive-or-active-mode-in-csharp
title: Choosing Passive or Active FTP in C#
protocols: [ftp]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlExchangeRecord, CurlClient, CurlRequest, CurlResponse, CurlFtpOptions, CurlException, LogLevel]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Four fetches of one file, each on a client of its own, send EPSV by default, PASV with UseEpsv off, EPRT with ActiveAddress "-" and PORT with UseEprt off as well, read from the recorded exchange, and each returns the file.
    program: choose-mode.cs
    args: []
    expect:
      exit: 0
      stdout: "default: EPSV -> hello from surl\nno EPSV: PASV -> hello from surl\nactive: EPRT -> hello from surl\nactive, no EPRT: PORT -> hello from surl\n"

  - id: server-logs-the-modes
    claim: The server's own log, taken through SurlServerOptions.Log at LogLevel.Verbose, records a passive fetch as a passive data connection and an active one as an active one.
    program: choose-mode.cs
    args: [log]
    expect:
      exit: 0
      stdout: "passive: PASV -> hello from surl\nactive: EPRT -> hello from surl\nData connection opened: passive\nData connection opened: active\n"

  - id: other-address-refused
    claim: An ActiveAddress that is not the client's gets EPRT answered 501, curl falls back to PORT, which fails too, and SendAsync throws a CurlException with code FtpPortFailed, 30.
    program: choose-mode.cs
    args: [other]
    expect:
      exit: 0
      stdout: "other address: EPRT PORT -> 30 FtpPortFailed\n"

  - id: anonymous-login-refused
    claim: Without AllowAnonymous, the server refuses the client's anonymous login before any data-connection command, and SendAsync throws a CurlException with code LoginDenied, 67.
    program: choose-mode.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "refused:  -> 67 LoginDenied\n"
