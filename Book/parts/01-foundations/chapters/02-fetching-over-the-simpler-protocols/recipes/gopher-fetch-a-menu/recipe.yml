# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: gopher-fetch-a-menu
title: Fetching a Gopher Menu
protocols: [gopher]
tier: foundations
surl-options: [--directory, --list-directories]
curl-options: [-s]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/notes/today.txt: "nothing happened\n"

servers:
  main:
    command: surl --directory site --list-directories gopher://127.0.0.1:{{port}}/
    ready: port

# Menu lines carry the port, which changes on every run, so they are matched with a pattern.
cases:
  - id: solution
    role: solution
    claim: "The empty selector names the served directory, and surl answers with its menu: one line per entry, a file as type 0 and a directory as type 1, each with its display name, its selector, the host and the port, tab-separated, then a line holding a dot; curl exits 0."
    run: curl gopher://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout-matches: '^0hello\.txt\t/hello\.txt\t127\.0\.0\.1\t\d+\n1notes\t/notes\t127\.0\.0\.1\t\d+\n\.\n$'

  - id: fetch-a-file
    claim: "In a URL, the character after the first slash is the item type and is not sent; /0/hello.txt sends the selector /hello.txt, and the file comes back byte for byte."
    run: curl -s gopher://127.0.0.1:{{port}}/0/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: fetch-a-submenu
    claim: "/1/notes fetches the menu of the notes directory, whose entries carry their full selectors."
    run: curl -s gopher://127.0.0.1:{{port}}/1/notes
    expect:
      exit: 0
      stdout-matches: '^0today\.txt\t/notes/today\.txt\t127\.0\.0\.1\t\d+\n\.\n$'

  - id: missing-selector
    claim: "A selector that names nothing is answered with a fixed error menu, one type 3 line that does not echo the selector, and curl exits 0, since Gopher has no status for it to fail on."
    run: curl -s gopher://127.0.0.1:{{port}}/0/missing.txt
    expect:
      exit: 0
      stdout-matches: '^3Nothing is served at this selector\.\t\terror\.host\t1\n\.\n$'

  - id: dot-file-not-served
    claim: A file whose name begins with a dot is not served and gets the same error menu as a missing one.
    fixtures:
      site/.secret: "not for you\n"
    run: curl -s gopher://127.0.0.1:{{port}}/0/.secret
    expect:
      exit: 0
      stdout-matches: '^3Nothing is served at this selector\.\t\terror\.host\t1\n\.\n$'

  - id: dot-file-not-listed
    claim: The menu leaves the dot file out.
    fixtures:
      site/.secret: "not for you\n"
    run: curl -s gopher://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout-matches: '^0hello\.txt\t[^\n]*\n1notes\t[^\n]*\n\.\n$'
