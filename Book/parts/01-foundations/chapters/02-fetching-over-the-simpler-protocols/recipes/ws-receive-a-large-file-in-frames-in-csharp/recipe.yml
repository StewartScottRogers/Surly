# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: ws-receive-a-large-file-in-frames-in-csharp
title: Receiving Multi-frame Messages in C#
protocols: [ws]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, LogLevel, CurlClient, CurlWebSocket, CurlWebSocketMessage]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc6455]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: 'A 200,000-byte file is received with one ReceiveAsync call as a single Binary message, and the bytes are identical to the original.'
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^big\.bin: Binary, 200000 bytes, identical: yes\n'

  - id: whole-message
    claim: 'The message is 200,000 bytes, the whole file, with nothing from the frame headers between the parts.'
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: 'big\.bin: Binary, 200000 bytes, '

  - id: then-close
    claim: 'The next message after the file is the server''s close, so the file was one message and not the first of several.'
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nbig\.bin: then Close\n'

  - id: four-frames
    claim: 'The server''s log records the 200,000 bytes as one binary message sent in 4 frames.'
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlog: Sent 200000 bytes of /big\.bin as a binary message in 4 frames\n'

  - id: at-limit
    claim: 'A file of exactly 65,536 bytes goes in one frame and arrives whole.'
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nat-limit\.bin: Binary, 65536 bytes, identical: yes\n(?s:.*)\nlog: Sent 65536 bytes of /at-limit\.bin as a binary message in 1 frames\n'

  - id: over-limit
    claim: 'One byte more, 65,537, goes in 2 frames and arrives whole.'
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nover-limit\.bin: Binary, 65537 bytes, identical: yes\n(?s:.*)\nlog: Sent 65537 bytes of /over-limit\.bin as a binary message in 2 frames\n'
