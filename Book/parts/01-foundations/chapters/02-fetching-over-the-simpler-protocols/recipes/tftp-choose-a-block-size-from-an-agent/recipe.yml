# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs block-size.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: tftp-choose-a-block-size-from-an-agent
title: Choosing TFTP Block Sizes from an Agent
protocols: [tftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, transfer, get_exchanges]
exit-codes: [0, 68]
references: [surl-readme, curl-readme, rfc1350]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent serves a 3,000-byte file over TFTP and fetches it with curl -v --tftp-blksize 1024; curl's trace reports tsize 3000 and blksize 1024 parsed from the option acknowledgement, the copy is identical, and get_exchanges shows the request carrying tsize 0 and blksize 1024, the opcode 6 reply and 3 data blocks.
    program: block-size.cs
    args: [fetch]
    expect:
      exit: 0
      stdout-matches: '^exit: 0\ncurl: tsize parsed from OACK \(3000\)\ncurl: blksize parsed from OACK \(1024\) requested \(1024\)\ncopy: identical\nrequest: opcode 1, big\.bin octet tsize 0 blksize 1024 timeout [56]\nreply: opcode 6, tsize 3000 blksize 1024 timeout [56]\ndata blocks: 3\n$'

  - id: default-size
    claim: Without --tftp-blksize the request asks for blksize 512 and the same file takes 6 data blocks.
    program: block-size.cs
    args: [default]
    expect:
      exit: 0
      stdout-matches: '^exit: 0\ncurl: tsize parsed from OACK \(3000\)\ncurl: blksize parsed from OACK \(512\) requested \(512\)\ncopy: identical\nrequest: opcode 1, big\.bin octet tsize 0 blksize 512 timeout [56]\nreply: opcode 6, tsize 3000 blksize 512 timeout [56]\ndata blocks: 6\n$'

  - id: no-options
    claim: With --tftp-no-options the request holds only the file name and mode, the server answers with data block 1 instead of an option acknowledgement, and curl's trace has no option lines.
    program: block-size.cs
    args: [none]
    expect:
      exit: 0
      stdout: "exit: 0\ncopy: identical\nrequest: opcode 1, big.bin octet\nreply: opcode 3, block 1\ndata blocks: 6\n"

  - id: too-large
    claim: A block size of 70000 is sent and agreed as 65464, the largest the server accepts, so one data block carries the file.
    program: block-size.cs
    args: [large]
    expect:
      exit: 0
      stdout-matches: '^exit: 0\ncurl: tsize parsed from OACK \(3000\)\ncurl: blksize parsed from OACK \(65464\) requested \(65464\)\ncopy: identical\nrequest: opcode 1, big\.bin octet tsize 0 blksize 65464 timeout [56]\nreply: opcode 6, tsize 3000 blksize 65464 timeout [56]\ndata blocks: 1\n$'

  - id: transfer-tool
    claim: The transfer tool has no TFTP option, so it fetches at the default block size, with statusCode 0, the whole file in the body and a request asking for blksize 512.
    program: block-size.cs
    args: [transfer]
    expect:
      exit: 0
      stdout-matches: '^statusCode: 0\nbytes: 3000\nrequest: opcode 1, big\.bin octet tsize 0 blksize 512 timeout [56]\n$'

  - id: missing-file
    claim: A file that is not there is answered with TFTP error 1, the curl tool answers exit code 68, TftpNotFound, and get_exchanges shows the error datagram and no data.
    program: block-size.cs
    args: [missing]
    expect:
      exit: 0
      stdout-matches: '^exit: 68\ncurl exit code 68 \(TftpNotFound\)\nrequest: opcode 1, nope\.bin octet tsize 0 blksize 1024 timeout [56]\nreply: opcode 5, error 1\ndata blocks: 0\n$'
