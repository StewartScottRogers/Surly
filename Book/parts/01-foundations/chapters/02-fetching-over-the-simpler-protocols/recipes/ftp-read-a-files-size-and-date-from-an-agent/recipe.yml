# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs check-file.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: ftp-read-a-files-size-and-date-from-an-agent
title: Reading FTP Sizes from an Agent
protocols: [ftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_exchanges]
exit-codes: [0, 67, 78]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: curl -I through curl-mcp prints the file's date as Last-Modified, 2 January 2024 15:04:05 GMT, and its size as Content-Length, 14, and get_exchanges shows the server received MDTM and SIZE only.
    program: check-file.cs
    args: []
    expect:
      exit: 0
      stdout: "Last-Modified: Tue, 02 Jan 2024 15:04:05 GMT\nContent-Length: 14\nAccept-ranges: bytes\ncommands: MDTM SIZE\n"

  - id: no-download
    claim: The server's record holds no RETR and no passive command, so asking for the size and date downloaded nothing.
    program: check-file.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^(?!.*(RETR|EPSV|PASV)).*$'

  - id: copy-keeps-the-time
    claim: With -R, a downloaded copy takes the server's modification time, and without -R it is dated when it was written.
    program: check-file.cs
    args: [copy]
    expect:
      exit: 0
      stdout: "exit: 0\ncopy dated: 2024-01-02T15:04:05Z\ncopy without -R dated 2024: False\n"

  - id: missing-file
    claim: A file that is not there makes curl -I exit 78, remote file not found, with no headers in the answer.
    program: check-file.cs
    args: [missing]
    expect:
      exit: 0
      stdout: "exit: 78, headers: 0\n"

  - id: anonymous-login-refused
    claim: A server started without --allow-anonymous refuses the anonymous login, and curl -I exits 67, login denied.
    program: check-file.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "exit: 67, headers: 0\n"
