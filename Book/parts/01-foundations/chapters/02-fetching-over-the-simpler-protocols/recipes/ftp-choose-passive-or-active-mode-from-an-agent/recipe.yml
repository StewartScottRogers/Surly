# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs choose-mode.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: ftp-choose-passive-or-active-mode-from-an-agent
title: Choosing the FTP Mode from an Agent
protocols: [ftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_exchanges]
exit-codes: [0, 30, 67]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent fetches one file four ways through curl-mcp, by default, with --disable-epsv, with -P - and with -P - --disable-eprt, and get_exchanges shows the exchange of each holding EPSV, PASV, EPRT and PORT, each fetch exiting 0 with the file.
    program: choose-mode.cs
    args: []
    expect:
      exit: 0
      stdout: "default: EPSV -> exit 0, hello from surl\nno EPSV: PASV -> exit 0, hello from surl\nactive: EPRT -> exit 0, hello from surl\nactive, no EPRT: PORT -> exit 0, hello from surl\n"

  - id: client-side-view
    claim: The curl tool answers the standard error of curl -v as text, so the agent can also read the command from the client's side, here the EPSV that matches the server's record.
    program: choose-mode.cs
    args: [verbose]
    expect:
      exit: 0
      stdout: "verbose: EPSV -> exit 0, hello from surl\n> EPSV\n"

  - id: other-address-refused
    claim: An active address that is not the client's gets EPRT answered 501, curl falls back to PORT, which fails too, and the tool answers exit code 30, FTP port command failed.
    program: choose-mode.cs
    args: [other]
    expect:
      exit: 0
      stdout: "other address: EPRT PORT -> exit 30, \n"

  - id: anonymous-login-refused
    claim: A server started without --allow-anonymous refuses the anonymous login before any data-connection command, and the tool answers exit code 67, login denied.
    program: choose-mode.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "refused:  -> exit 67, \n"
