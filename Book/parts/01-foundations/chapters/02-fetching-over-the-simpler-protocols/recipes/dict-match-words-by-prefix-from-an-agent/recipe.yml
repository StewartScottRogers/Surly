# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008).
schema: 2
key: dict-match-words-by-prefix-from-an-agent
title: Finding Words That Match from an Agent
protocols: [dict]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl]
exit-codes: [0]
references: [surl-readme, rfc2229]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "An agent starts a DICT server whose files are the headwords; the curl tool's m:ap:*:prefix is answered 152 listing apple and apricot and not banana, the agent picks the first, and d:apple is answered with its definition; curl's exitCode is 0 both times."
    program: program.cs
    args: ["m:ap:*:prefix"]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 0\n220 surl DICT server <mime> <\d+@surl>\n250 ok\n152 2 matches found\nsurl "apple"\nsurl "apricot"\n\.\n250 ok\n221 bye\npicked: apple\nexitCode: 0\n.*150 1 definitions retrieved\n151 "apple" surl "Files served by surl"\na round fruit\n\.\n250 ok\n221 bye\n$'

  - id: strategy-defaults-to-prefix
    claim: "With the strategy left out, m:ap lists the same two words."
    program: program.cs
    args: ["m:ap"]
    expect:
      exit: 0
      stdout-matches: '152 2 matches found\nsurl "apple"\nsurl "apricot"\n\.\n'

  - id: exact-is-not-prefix
    claim: "The exact strategy is answered 552 no match, which is still curl's exitCode 0, and the agent has nothing to pick."
    program: program.cs
    args: ["m:ap:*:exact"]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 0\n.*\n552 no match\n221 bye\nnothing to pick\n$'

  - id: strategy-not-offered
    claim: "A strategy the server does not offer, suffix, is answered 551 invalid strategy, with exitCode 0."
    program: program.cs
    args: ["m:ple:*:suffix"]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 0\n.*\n551 invalid strategy, use "SHOW STRAT" for a list of strategies\n221 bye\nnothing to pick\n$'

  - id: strategies-offered
    claim: "show:strat lists the two strategies the server offers, exact and prefix."
    program: program.cs
    args: ["show:strat"]
    expect:
      exit: 0
      stdout-matches: '111 2 strategies available\nexact "Match headwords exactly"\nprefix "Match prefixes"\n\.\n'

  - id: case-matters
    claim: "Headwords are matched as written: m:AP is answered 552 no match."
    program: program.cs
    args: ["m:AP"]
    expect:
      exit: 0
      stdout-matches: '\n552 no match\n221 bye\nnothing to pick\n$'
