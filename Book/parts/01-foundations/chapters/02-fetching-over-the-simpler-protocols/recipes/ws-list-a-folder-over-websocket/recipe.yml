# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: ws-list-a-folder-over-websocket
title: Listing a Folder over WebSocket
protocols: [ws, http]
tier: foundations
surl-options: [--directory, --list-directories, -v, --log-file]
curl-options: [-s, -o, -w]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc6455, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/notes/today.txt: "nothing happened\n"
  plain/hello.txt: "hello from surl\n"
  plain/notes/today.txt: "nothing happened\n"

setup:
  - mkdir -p logs

# main lists folders; plain serves the same files and does not; reader serves main's log over HTTP.
servers:
  main:
    command: surl -v --log-file logs/surl.log --directory site --list-directories ws://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --directory plain ws://127.0.0.1:{{port2}}/
    ready: port
  reader:
    command: surl --directory logs http://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A WebSocket client that asks for the root receives the folder's listing, one entry per line with a slash after each folder, and curl writes it to standard output and exits 0.
    run: curl ws://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "hello.txt\nnotes/\n"

  - id: sub-folder
    claim: A sub-folder is listed the same way, with or without the closing slash.
    run: curl -s ws://127.0.0.1:{{port}}/notes/ ws://127.0.0.1:{{port}}/notes
    expect:
      exit: 0
      stdout: "today.txt\ntoday.txt\n"

  - id: one-text-message
    claim: The listing is sent as one text message in one frame, which the server's log counts.
    run: curl -s -o {{null}} ws://127.0.0.1:{{port}}/ && curl -s http://127.0.0.1:{{port3}}/surl.log | grep -a -o -E "Sent [0-9]+ bytes of / as a text message in [0-9]+ frames" | tail -n 1
    expect:
      exit: 0
      stdout: "Sent 17 bytes of / as a text message in 1 frames\n"

  - id: file-still-a-file
    claim: A path that is a file is still sent as its own bytes in one message, so the same listener serves both.
    run: curl -s ws://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: dot-file-not-listed
    claim: A file whose name begins with a dot is left out of the listing, and asking for it is a 404.
    fixtures:
      site/.secret: "not for you\n"
    run: curl -s ws://127.0.0.1:{{port}}/ && curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port}}/.secret
    expect:
      exit: 22
      stdout: "hello.txt\nnotes/\n404"

  - id: missing-folder
    claim: A path that is neither a file nor a folder is refused 404 Not Found, and curl exits 22.
    run: curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port}}/nowhere/
    expect:
      exit: 22
      stdout: "404"

  - id: listings-off
    claim: Without --list-directories the same request for a folder is refused 404 Not Found in the upgrade, no message is sent, and curl exits 22.
    run: curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port2}}/
    expect:
      exit: 22
      stdout: "404"

  - id: listings-off-sub-folder
    claim: A sub-folder is refused the same way when listings are off, while a file on that listener is still sent.
    run: curl -s ws://127.0.0.1:{{port2}}/hello.txt && curl -s -o {{null}} -w "%{http_code}" ws://127.0.0.1:{{port2}}/notes/
    expect:
      exit: 22
      stdout: "hello from surl\n404"
