# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: telnet-hold-a-line-session-from-an-agent
title: Holding a Telnet Session from an Agent
protocols: [telnet]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_exchanges]
exit-codes: [0, 28]
references: [surl-readme, curl-readme, rfc854]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent starts a TELNET server on port 0, runs curl with the lines on stdin, and the answer's standardOutput holds the banner, each line echoed and bye, with exitCode 0.
    program: telnet-session.cs
    args: [session]
    expect:
      exit: 0
      stdout: "exitCode: 0\nsurl TELNET server: each line is echoed back; quit ends the session.\nhello\nworld\nbye\ntool error: no\n"

  - id: quit-any-case
    claim: QUIT in capitals ends the session as quit does, and the line after it is never read.
    program: telnet-session.cs
    args: [upper]
    expect:
      exit: 0
      stdout: "exitCode: 0\nsurl TELNET server: each line is echoed back; quit ends the session.\none\nbye\ntool error: no\n"

  - id: no-quit
    claim: A session with no quit stays open after the last echo, so with -m 2 curl exits 28, the answer is a tool error with failure kind CurlExit, and standardOutput still holds the echo.
    program: telnet-session.cs
    args: [no-quit]
    expect:
      exit: 1
      stdout: "exitCode: 28\nsurl TELNET server: each line is echoed back; quit ends the session.\nhello\nfailure: CurlExit\ntool error: yes\n"

  - id: line-too-long
    claim: A server started with --max-line 10 in arguments answers a longer line with line too long and ends the session, with exitCode 0 and no bye.
    program: telnet-session.cs
    args: [too-long]
    expect:
      exit: 0
      stdout: "exitCode: 0\nsurl TELNET server: each line is echoed back; quit ends the session.\nshort\nline too long\ntool error: no\n"

  - id: terminal-type
    claim: With -t TTYPE=vt100 the bytes surl-mcp keeps for the exchange, read with get_exchanges, show that the server was told vt100 and read the three lines.
    program: telnet-session.cs
    args: [terminal]
    expect:
      exit: 0
      stdout: "exitCode: 0\nsurl TELNET server: each line is echoed back; quit ends the session.\nhello\nworld\nbye\nthe server was told vt100: True\nthe server read all three lines: True\ntool error: no\n"
