# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs fetch-series.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-download-a-numbered-series-from-an-agent
title: Downloading a Numbered Series from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, transfer]
curl-options: [-s, -f, -O, -o, -w, --create-dirs, --output-dir, --fail-early]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, curl-manual]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: One globbed curl command through the curl tool fetches report-1.csv to report-12.csv into reports/, saves the ten that are there, and its standard output names the two missing, 4 and 9; curl exits 0 and the call is not a tool error.
    program: fetch-series.cs
    args: [series]
    expect:
      exit: 0
      stdout: "exitCode: 0\nmissing: /report-4.csv, /report-9.csv\nsaved: 10\nfailure: null\ntool error: no\n"
      files:
        reports/report-1.csv: "month,total\n1,100\n"
        reports/report-12.csv: "month,total\n12,1200\n"

  - id: fail-early
    claim: With --fail-early curl stops at report-4.csv and exits 22, a tool error of kind CurlExit, after saving only the three before it.
    program: fetch-series.cs
    args: [fail-early]
    expect:
      exit: 1
      stdout: "exitCode: 22\nmissing: /report-4.csv\nsaved: 3\nfailure: CurlExit\ntool error: yes\n"

  - id: hash-in-o-refused
    claim: curl-mcp refuses -o with a #1 glob reference before curl runs, because it cannot check a name curl fills in later against CURL_MCP_ROOT.
    program: fetch-series.cs
    args: [hash]
    expect:
      exit: 1
      stdout: "exitCode: null\nRefused -o: -o 'reports/report-#1.csv' names a file with a #<n> glob reference, which curl fills from the URL, so it cannot be checked before curl runs.\ntool error: yes\n"

  - id: transfer-does-not-glob
    claim: transfer does not glob; it sends the brackets as part of the path, and the server answers 404.
    program: fetch-series.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "statusCode: 404\nfailure: null\ntool error: no\n"
