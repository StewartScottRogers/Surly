# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-download-to-a-chosen-folder-in-csharp
title: Choosing Where Downloads Land in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 22, 23]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Each response body is streamed from CurlResponse.Body into its own file under downloads/, at the URL's path, in folders the program creates first, and the program exits 0.
    program: download.cs
    args: []
    expect:
      exit: 0
      stdout: "docs/guide.txt: saved 10 bytes to downloads/docs/guide.txt\nreports/2026/summary.txt: saved 12 bytes to downloads/reports/2026/summary.txt\n"
      files:
        downloads/docs/guide.txt: "the guide\n"
        downloads/reports/2026/summary.txt: "the summary\n"

  - id: missing-not-saved
    claim: A path the server does not have is answered 404 Not Found as an ordinary CurlResponse; the program checks StatusCode before opening a file, so no file is created, and it exits 22 as curl -f would.
    program: download.cs
    args: [downloads, absent.txt]
    expect:
      exit: 22
      stdout: "absent.txt: 404 Not Found, not saved; downloads/absent.txt exists: False\n"

  - id: no-folder
    claim: Without creating the folders first, File.Create throws DirectoryNotFoundException, the program's counterpart of curl's exit 23 without --create-dirs.
    program: download.cs
    args: [elsewhere, --no-create, docs/guide.txt]
    expect:
      exit: 23
      stdout: "docs/guide.txt: no folder for elsewhere/docs/guide.txt\n"
