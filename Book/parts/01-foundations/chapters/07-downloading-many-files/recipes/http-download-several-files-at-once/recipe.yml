# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: http-download-several-files-at-once
title: Downloading Files in Parallel
protocols: [http]
tier: foundations
surl-options: [--directory, --fault, --trace-ascii]
curl-options: [--parallel, --parallel-max, -s, -o, --create-dirs]
exit-codes: [0]
references: [surl-readme, curl-manual]

fixtures:
  site/f1.txt: "file 1
"
  site/f2.txt: "file 2
"
  site/f3.txt: "file 3
"
  site/f4.txt: "file 4
"
  site/f5.txt: "file 5
"
  site/f6.txt: "file 6
"
  site/f7.txt: "file 7
"
  site/f8.txt: "file 8
"
  site/f9.txt: "file 9
"
  site/f10.txt: "file 10
"
  site/f11.txt: "file 11
"
  site/f12.txt: "file 12
"
  peak.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Usage: sh peak.sh PORT GLOB [curl options]
    # Serves site with every answer held 1 s, so transfers that run together overlap; fetches GLOB
    # with the given curl options; then reads surl's trace and prints the most connections open at
    # once and the most requests being answered at once.
    port=$1; glob=$2; shift 2
    rm -f trace.txt listening.txt
    surl --directory site --fault "delay;stage=command;ms=1000" --trace-ascii trace.txt http://127.0.0.1:$port/ >listening.txt 2>/dev/null &
    pid=$!
    until grep -q Listening listening.txt; do sleep 0.1; done
    curl -s "$@" "http://127.0.0.1:$port/$glob"
    # curl has exited: wait (at most 10 s) until surl has seen every connection close.
    tries=0
    while [ "$(grep -c ' ended; closing' trace.txt)" != "$(grep -c ' opened: ' trace.txt)" ] && [ $tries -lt 100 ]; do
      sleep 0.1; tries=$((tries + 1))
    done
    kill $pid
    wait $pid 2>/dev/null
    awk '/ opened: / { n++; if (n > peak) peak = n } / ended; closing/ { n-- } END { print "connections", peak + 0 }' trace.txt
    awk '/held for/ { n++; if (n > peak) peak = n } / \* GET .*: 200/ { n-- } END { print "requests", peak + 0 }' trace.txt

cases:
  - id: solution
    role: solution
    claim: "With --parallel and --parallel-max 4, curl fetches twelve files, and surl's trace shows four requests being answered at once and four connections open together, or five if curl opens one before it reuses a freed one; curl exits 0."
    run: sh peak.sh {{port}} "f[1-12].txt" --parallel --parallel-max 4 --create-dirs -o "got/f#1.txt"
    expect:
      exit: 0
      stdout-matches: '^connections [45]\nrequests 4\n$'

  - id: copies-match
    claim: "The twelve downloaded files are byte for byte the twelve the server holds."
    run: diff -r -x .surl site got
    expect:
      exit: 0
      stdout: ""

  - id: default-is-wide
    claim: "With --parallel alone, curl may run up to 50 transfers at once, so the twelve files run together: more than four connections are open at once, and more than four requests are in flight."
    run: sh peak.sh {{port2}} "f[1-12].txt" --parallel -o {{null}}
    expect:
      exit: 0
      stdout-matches: '^connections (?:[5-9]|1[0-2])\nrequests (?:[5-9]|1[0-2])\n$'

  - id: serial
    claim: "Without --parallel, curl fetches the files one after another on one connection: one connection and one request at a time."
    run: sh peak.sh {{port3}} "f[1-3].txt" -o {{null}}
    expect:
      exit: 0
      stdout: "connections 1\nrequests 1\n"

  - id: cap-of-one
    claim: "--parallel-max 1 allows one transfer at a time, so --parallel with it is as serial as no --parallel."
    run: sh peak.sh {{port4}} "f[1-3].txt" --parallel --parallel-max 1 -o {{null}}
    expect:
      exit: 0
      stdout: "connections 1\nrequests 1\n"

