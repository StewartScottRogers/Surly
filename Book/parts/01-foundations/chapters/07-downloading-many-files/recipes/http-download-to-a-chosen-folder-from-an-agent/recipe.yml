# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs save.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the curl arguments it sends.
schema: 2
key: http-download-to-a-chosen-folder-from-an-agent
title: Choosing Where Downloads Land from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl]
curl-options: [-s, -o, -O, --output-dir, --create-dirs, -w]
exit-codes: [0]
references: [curl-readme, surl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Through curl-mcp's curl tool, --create-dirs and --output-dir downloads put one file under the name -o gives and another under the name -O takes from its URL, both inside CURL_MCP_ROOT, where the agent reads them back; curl exits 0 and -w names each file.
    program: save.cs
    args: [save]
    expect:
      exit: 0
      stdout: "exitCode: 0\ndownloads/handbook.txt\ndownloads/summary.txt\ndownloads/handbook.txt holds: the guide\ndownloads/summary.txt holds: the summary\ntool error: no\n"

  - id: output-dir-outside-root
    claim: An --output-dir that resolves outside CURL_MCP_ROOT is refused before curl runs, as PathRefused, so there is no exit code and no output, and the call is a tool error.
    program: save.cs
    args: [outside-dir]
    expect:
      exit: 1
      stdout-matches: '^exitCode: null\nstandardOutput: null\nfailure: PathRefused\nRefused --output-dir: --output-dir ''\.\.'' resolves to ''[^\n]*'', which is outside CURL_MCP_ROOT \(''[^\n]*''\)\.\ntool error: yes\n$'

  - id: o-outside-root
    claim: An -o path that climbs out of CURL_MCP_ROOT is refused the same way, and the refusal names the option, the path given and where it resolves.
    program: save.cs
    args: [outside-o]
    expect:
      exit: 1
      stdout-matches: '^exitCode: null\nstandardOutput: null\nfailure: PathRefused\nRefused -o: -o ''\.\./guide\.txt'' resolves to ''[^\n]*guide\.txt'', which is outside CURL_MCP_ROOT \(''[^\n]*''\)\.\ntool error: yes\n$'
