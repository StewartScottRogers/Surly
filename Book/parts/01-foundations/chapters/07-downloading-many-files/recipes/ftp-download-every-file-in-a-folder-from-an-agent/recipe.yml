# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs fetch-folder.cs, a C# program on the official MCP SDK
# that starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: ftp-download-every-file-in-a-folder-from-an-agent
title: Downloading FTP Folders from an Agent
protocols: [ftp]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, read_file]
exit-codes: [0, 19, 78]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The agent lists /pub/ through curl-mcp with -l and again without it, skips the archive subfolder, fetches the three files into its root, and read_file finds each identical to the local copy; exit 0.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout: "listing: a.txt archive b.txt c.txt\nfolders: archive\nget a.txt: exit 0, identical to the server's\nskip archive/\nget b.txt: exit 0, identical to the server's\nget c.txt: exit 0, identical to the server's\nin out/pub: a.txt b.txt c.txt\n"

  - id: names-only
    claim: curl -l answers the names only, in order, with the subfolder among them and the dot file left out.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^listing: a\.txt archive b\.txt c\.txt\n'

  - id: folders-from-long-listing
    claim: The long listing, taken without -l, marks archive with a leading d, which is how the agent tells it from a file.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nfolders: archive\n'

  - id: subfolder-skipped
    claim: The folder is skipped, not fetched.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nskip archive/\n'

  - id: local-files-only
    claim: The agent's root holds the three files under out/pub and nothing else.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nin out/pub: a\.txt b\.txt c\.txt\n$'

  - id: subfolder-by-hand
    claim: The same routine on the subfolder fetches its one file, identical to the server's.
    program: fetch-folder.cs
    args: [sub]
    expect:
      exit: 0
      stdout: "listing: old.txt\nfolders: \nget old.txt: exit 0, identical to the server's\nin out/pub/archive: old.txt\n"

  - id: listing-refused
    claim: A server started without --list-directories refuses the listing and the tool answers exit code 19.
    program: fetch-folder.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "listing: exit 19\n"

  - id: folder-is-not-a-file
    claim: Asking for a subfolder as if it were a file is exit code 78, the file does not exist.
    program: fetch-folder.cs
    args: [folder]
    expect:
      exit: 0
      stdout: "archive: exit 78\n"

  - id: vanished-file
    claim: A name that is not on the server is exit code 78, which an agent must check for each file.
    program: fetch-folder.cs
    args: [vanished]
    expect:
      exit: 0
      stdout: "gone.txt: exit 78\n"

  - id: dot-file-not-served
    claim: The dot file is not served even when asked for by name; exit code 78.
    program: fetch-folder.cs
    args: [hidden]
    expect:
      exit: 0
      stdout: ".hidden: exit 78\n"
