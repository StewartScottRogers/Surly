# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: http-download-several-files-at-once-from-an-agent
title: Downloading Files in Parallel from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, curl, get_events]
exit-codes: [0]
references: []

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "With --parallel and --parallel-max 4 in the curl tool's args, twelve files are fetched, curl exits 0, and the server's events show four connections open at once."
    program: program.cs
    args: ["capped"]
    expect:
      exit: 0
      stdout-matches: '^curl exit 0\n12 of 12 fetched\nconnections 4\n$'

  - id: all-files-match
    claim: "The twelve files curl wrote under the root are byte for byte the files the server holds."
    program: program.cs
    args: ["capped"]
    expect:
      exit: 0
      stdout-matches: '\n12 of 12 fetched\n'

  - id: default-is-wide
    claim: "With --parallel alone, the twelve transfers run together: the server's events show more than four connections open at once."
    program: program.cs
    args: ["uncapped"]
    expect:
      exit: 0
      stdout-matches: '^curl exit 0\n12 of 12 fetched\nconnections (?:[5-9]|1[0-2])\n$'

  - id: serial
    claim: "Without --parallel, the files are fetched in turn over one connection."
    program: program.cs
    args: ["serial"]
    expect:
      exit: 0
      stdout-matches: '^curl exit 0\n3 of 3 fetched\nconnections 1\n$'

  - id: cap-of-one
    claim: "--parallel-max 1 with --parallel is as serial as no --parallel: one connection."
    program: program.cs
    args: ["cap-of-one"]
    expect:
      exit: 0
      stdout-matches: '^curl exit 0\n3 of 3 fetched\nconnections 1\n$'

