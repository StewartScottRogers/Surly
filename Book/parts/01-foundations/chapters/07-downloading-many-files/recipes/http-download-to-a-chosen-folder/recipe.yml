# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: http-download-to-a-chosen-folder
title: Choosing Where Downloads Land
protocols: [http]
tier: foundations
surl-options: [--directory]
curl-options: [-o, -O, --output-dir, --create-dirs, --remote-name-all, -s, -S, -w]
exit-codes: [0, 23]
references: [curl-manual, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/docs/guide.txt: "the guide\n"
  site/reports/2026/summary.txt: "the summary\n"

servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --output-dir and --create-dirs, -o saves one file under the name given and -O saves another under the last part of its URL path, both in a folder curl creates, and -w names each file written while the bodies stay off the terminal.
    run: curl -s --create-dirs --output-dir downloads -o handbook.txt http://127.0.0.1:{{port}}/docs/guide.txt -O http://127.0.0.1:{{port}}/reports/2026/summary.txt -w "%{filename_effective}\n"
    expect:
      exit: 0
      stdout: "downloads/handbook.txt\ndownloads/summary.txt\n"
      files:
        downloads/handbook.txt: "the guide\n"
        downloads/summary.txt: "the summary\n"

  - id: o-path-with-folders
    claim: -o takes a path, and --create-dirs makes every missing folder on it.
    run: curl -s --create-dirs -o archive/2026/11/guide.txt http://127.0.0.1:{{port}}/docs/guide.txt
    expect:
      exit: 0
      stdout: ""
      files:
        archive/2026/11/guide.txt: "the guide\n"

  - id: missing-folder
    claim: Without --create-dirs, a folder that does not exist is a write error, exit 23, and nothing is saved.
    run: curl -sS -o nowhere/guide.txt http://127.0.0.1:{{port}}/docs/guide.txt
    expect:
      exit: 23
      stderr-contains: "curl: (23)"

  - id: missing-output-dir
    claim: The same holds for an --output-dir that does not exist.
    run: curl -sS --output-dir nowhere -O http://127.0.0.1:{{port}}/docs/guide.txt
    expect:
      exit: 23
      stderr-contains: "curl: (23)"

  - id: remote-name-all
    claim: --remote-name-all gives every URL on the line an -O, so each file lands under its own name.
    run: curl -s --remote-name-all --create-dirs --output-dir all http://127.0.0.1:{{port}}/hello.txt http://127.0.0.1:{{port}}/docs/guide.txt -w "%{filename_effective}\n"
    expect:
      exit: 0
      stdout: "all/hello.txt\nall/guide.txt\n"
      files:
        all/hello.txt: "hello from surl\n"
        all/guide.txt: "the guide\n"

  - id: no-name-in-url
    claim: For a path ending in a slash -O takes the last folder name, and for the bare root, which names nothing, curl saves the body as curl_response.
    run: curl -s --remote-name-all --output-dir names --create-dirs -w "%{http_code} %{filename_effective}\n" http://127.0.0.1:{{port}}/docs/ http://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "404 names/docs\n404 names/curl_response\n"

  - id: overwrite
    claim: An -o file that already exists is overwritten without a question.
    fixtures:
      kept.txt: "an older copy\n"
    run: curl -s -o kept.txt http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      files:
        kept.txt: "hello from surl\n"

  - id: missing-file-still-saved
    claim: A 404 Not Found still writes the file, empty, and curl exits 0.
    run: curl -s -o absent.txt -w "%{http_code}" http://127.0.0.1:{{port}}/absent.txt
    expect:
      exit: 0
      stdout: "404"
      files:
        absent.txt: ""
