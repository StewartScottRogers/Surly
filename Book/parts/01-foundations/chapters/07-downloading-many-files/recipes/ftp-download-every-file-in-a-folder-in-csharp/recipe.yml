# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ftp-download-every-file-in-a-folder-in-csharp
title: Downloading a Whole FTP Folder in C#
protocols: [ftp]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc959]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The program lists /pub/, skips the archive subfolder, fetches the three files and finds each identical to the bytes Surl.Api serves; exit 0.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout: "listing: a.txt archive/ b.txt c.txt\nget a.txt: 6 bytes, identical to the server's\nskip archive/\nget b.txt: 6 bytes, identical to the server's\nget c.txt: 8 bytes, identical to the server's\nin out/pub: a.txt b.txt c.txt\n"

  - id: listing-is-long
    claim: A GET on the folder URL answers the long listing; the program reads the first character of each line as the type and the last word as the name, and the dot file is not among them.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^listing: a\.txt archive/ b\.txt c\.txt\n'

  - id: subfolder-skipped
    claim: The line that starts with d, archive, is skipped, not fetched.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nskip archive/\n'

  - id: local-files-only
    claim: The local folder holds the three files and nothing else.
    program: fetch-folder.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nin out/pub: a\.txt b\.txt c\.txt\n$'

  - id: subfolder-by-hand
    claim: The same routine on the subfolder fetches its one file, identical to the server's.
    program: fetch-folder.cs
    args: [sub]
    expect:
      exit: 0
      stdout: "listing: old.txt\nget old.txt: 15 bytes, identical to the server's\nin out/pub/archive: old.txt\n"

  - id: listing-refused
    claim: A server without ListDirectories refuses the listing, and the GET throws a CurlException with code FtpCouldntRetrFile, 19.
    program: fetch-folder.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "listing: 19 FtpCouldntRetrFile\n"

  - id: folder-is-not-a-file
    claim: Asking for a subfolder as if it were a file throws a CurlException with code RemoteFileNotFound, 78.
    program: fetch-folder.cs
    args: [folder]
    expect:
      exit: 0
      stdout: "archive as a file: 78 RemoteFileNotFound\n"

  - id: vanished-file
    claim: A name that is no longer on the server throws RemoteFileNotFound, 78, which the program must catch for each file.
    program: fetch-folder.cs
    args: [vanished]
    expect:
      exit: 0
      stdout: "gone.txt: 78 RemoteFileNotFound\n"

  - id: dot-file-not-served
    claim: The dot file is not served even when asked for by name; RemoteFileNotFound, 78.
    program: fetch-folder.cs
    args: [hidden]
    expect:
      exit: 0
      stdout: ".hidden: 78 RemoteFileNotFound\n"
