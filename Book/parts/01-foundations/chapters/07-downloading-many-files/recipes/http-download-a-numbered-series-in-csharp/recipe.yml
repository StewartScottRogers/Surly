# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-download-a-numbered-series-in-csharp
title: Downloading a Numbered Series in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: One shared CurlClient fetches report-1.csv to report-12.csv in turn, saves the ten that are there, reports 4 and 9 as missing, and the program exits 1.
    program: fetch-series.cs
    args: []
    expect:
      exit: 1
      stdout-matches: '^saved: 10\nmissing: 4, 9\n'
      files:
        reports/report-1.csv: "month,total\n1,100\n"
        reports/report-12.csv: "month,total\n12,1200\n"

  - id: one-connection
    claim: Every request of the series, the 404s included, goes over one kept-alive connection, so the server records one exchange.
    program: fetch-series.cs
    args: []
    expect:
      exit: 1
      stdout-matches: '\nconnections: 1\n$'

  - id: no-gaps
    claim: A series with no gaps, 1 to 3, is all saved, nothing is reported missing, and the program exits 0.
    program: fetch-series.cs
    args: ["3"]
    expect:
      exit: 0
      stdout: "saved: 3\nmissing: none\nconnections: 1\n"
