# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-download-several-files-at-once-in-csharp
title: Downloading Files in Parallel in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, SurlEventQuery, CurlClient, CurlClientOptions, CurlRequest, CurlResponse]
exit-codes: [0]
references: []

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "With MaxConnectionsPerHost set to 4, one CurlClient fetches twelve files started together, and the server's events show four connections open at once; the answers are held 1 s each, so the twelve take 3 s or more."
    program: program.cs
    args: ["capped"]
    expect:
      exit: 0
      stdout-matches: '^12 of 12 fetched\nconnections 4\ntook [3-6] s\n$'

  - id: all-bodies-match
    claim: "Every one of the twelve responses is a 200 whose body is the file the server holds under that name."
    program: program.cs
    args: ["capped"]
    expect:
      exit: 0
      stdout-matches: '^12 of 12 fetched\n'

  - id: uncapped-is-wide
    claim: "With no cap, the twelve requests started together open more than four connections, up to twelve, and finish in about the 1 s the server holds them."
    program: program.cs
    args: ["uncapped"]
    expect:
      exit: 0
      stdout-matches: '^12 of 12 fetched\nconnections (?:[5-9]|1[0-2])\ntook [1-2] s\n$'

  - id: serial
    claim: "Awaited one after another, the requests share one connection, and three held for 1 s each take 3 s or more."
    program: program.cs
    args: ["serial"]
    expect:
      exit: 0
      stdout-matches: '^3 of 3 fetched\nconnections 1\ntook [3-9] s\n$'

  - id: cap-of-one
    claim: "A cap of 1 on requests started together makes them as serial as awaiting them: one connection, 3 s or more."
    program: program.cs
    args: ["cap-of-one"]
    expect:
      exit: 0
      stdout-matches: '^3 of 3 fetched\nconnections 1\ntook [3-9] s\n$'

