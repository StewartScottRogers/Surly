# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-show-the-response-headers
title: Seeing the Status Line and Headers
protocols: [http]
tier: foundations
surl-options: [--directory]
curl-options: [-i, -I, -s, -o, -w]
exit-codes: [0]
references: [surl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With -i, curl prints the status line and headers, a blank line, then the body.
    run: curl -s -i http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 200 OK\n(?:[^\n]+\n)*Content-Length: 16\n\nhello from surl\n$'

  - id: head-has-no-body
    claim: With -I, curl sends HEAD and prints the same headers with no body after them.
    run: curl -s -I http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 200 OK\n(?:[^\n]+\n)*Content-Length: 16\n\n$'

  - id: pick-out-values
    claim: -w picks out single values; surl names itself in Server and serves a .txt file as text/plain.
    run: curl -s -o {{null}} -w "%header{server} %{content_type} %{size_download}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "surl text/plain 16"

  - id: not-found-status-line
    claim: A missing path shows its status line, 404 Not Found, the same way.
    run: curl -s -i http://127.0.0.1:{{port}}/missing.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 404 Not Found\n'
