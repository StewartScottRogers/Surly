# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-choose-the-http-version
title: Choosing the HTTP Version
protocols: [http]
tier: foundations
surl-options: [--directory]
curl-options: [--http2-prior-knowledge, --http1.0, -s, -o, -w, -i, -I]
exit-codes: [0]
references: [surl-readme, rfc9110, rfc9113]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --http2-prior-knowledge, curl speaks HTTP/2 from the first byte and surl answers in HTTP/2.
    run: curl -s -o {{null}} -w "%{http_version}" --http2-prior-knowledge http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "2"

  - id: default-is-http1-1
    claim: Without a version option, an http URL is fetched over HTTP/1.1.
    run: curl -s -o {{null}} -w "%{http_version}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "1.1"

  - id: http2-head-is-lower-case
    claim: Over HTTP/2 the status line has no reason phrase and header names are lower-case.
    run: curl -s -I --http2-prior-knowledge http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/2 200 \n(?:[^\n]+\n)*content-length: 16\n'

  - id: http1-0-answered-in-1-1
    claim: An HTTP/1.0 request is answered with an HTTP/1.1 status line and Connection close.
    run: curl -s -i --http1.0 http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 200 OK\n(?:[^\n]+\n)*Connection: close\n'
