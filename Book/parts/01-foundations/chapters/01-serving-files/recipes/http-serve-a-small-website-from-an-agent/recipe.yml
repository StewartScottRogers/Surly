# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs serve-site.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its arguments pick the paths it fetches.
schema: 2
key: http-serve-a-small-website-from-an-agent
title: Serving a Small Website from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A site given to start_server in files and files_base64 is served with the Content-Type each extension names, text/html, text/css, text/javascript, image/png, image/svg+xml, application/json, and application/octet-stream for an unknown one, as transfer's headers show, with no tool error.
    program: serve-site.cs
    args: []
    expect:
      exit: 0
      stdout: "/index.html 200 text/html isBase64: false\n/css/site.css 200 text/css isBase64: false\n/js/app.js 200 text/javascript isBase64: false\n/img/logo.png 200 image/png isBase64: true\n  same bytes: True\n/img/icon.svg 200 image/svg+xml isBase64: false\n/data/menu.json 200 application/json isBase64: false\n/downloads/notes.xyz 200 application/octet-stream isBase64: false\ntool error: no\n"

  - id: binary-image
    claim: An image given in files_base64 comes back from transfer as base64, isBase64 true, with the same bytes, because they are not valid UTF-8.
    program: serve-site.cs
    args: [img/logo.png]
    expect:
      exit: 0
      stdout: "/img/logo.png 200 image/png isBase64: true\n  same bytes: True\ntool error: no\n"

  - id: no-index-page
    claim: The root path is answered 404 Not Found as plain text, not a page, since there is no index page, and to transfer that is an answer, not a tool error.
    program: serve-site.cs
    args: [""]
    expect:
      exit: 0
      stdout: "/ 404 text/plain; charset=utf-8 isBase64: false\ntool error: no\n"
