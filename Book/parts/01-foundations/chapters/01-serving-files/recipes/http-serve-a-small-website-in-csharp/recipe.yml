# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-serve-a-small-website-in-csharp
title: Serving a Small Website in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A site seeded into SurlServerOptions.Files is served with the Content-Type each extension names, text/html, text/css, text/javascript, image/png, image/svg+xml, application/json, and application/octet-stream for an unknown one, every body byte for byte, and the program exits 0.
    program: serve-site.cs
    args: []
    expect:
      exit: 0
      stdout: "/index.html 200 text/html 77 bytes ok\n/css/site.css 200 text/css 20 bytes ok\n/js/app.js 200 text/javascript 23 bytes ok\n/img/logo.png 200 image/png 8 bytes ok\n/img/icon.svg 200 image/svg+xml 42 bytes ok\n/data/menu.json 200 application/json 14 bytes ok\n/downloads/notes.xyz 200 application/octet-stream 32 bytes ok\n"

  - id: binary-image
    claim: Bytes that are not UTF-8 text, a PNG signature, are stored and served unchanged as image/png.
    program: serve-site.cs
    args: [img/logo.png]
    expect:
      exit: 0
      stdout: "/img/logo.png 200 image/png 8 bytes ok\n"

  - id: no-index-page
    claim: The root path is answered 404 Not Found as 14 bytes of plain text, not a page, since surl serves no index page for a folder, and the program's check fails with exit 1.
    program: serve-site.cs
    args: [""]
    expect:
      exit: 1
      stdout: "/ 404 text/plain; charset=utf-8 14 bytes WRONG\n"
