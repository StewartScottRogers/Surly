# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-serve-an-empty-store
title: Running an HTTP Server with Nothing in It
protocols: [http]
tier: foundations
surl-options: []
curl-options: [-s, -o, -w, -I, -X, -D]
exit-codes: [0]
references: [surl-readme, rfc9110]

servers:
  main:
    command: surl http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With no --directory, a path is answered 404 Not Found, because the store is empty.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "404"

  - id: root-not-listed
    claim: The root path is answered 404 too; nothing is listed.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "404"

  - id: head-not-found
    claim: A HEAD request for a missing path is answered 404 as well.
    run: curl -s -o {{null}} -w "%{http_code}" -I http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "404"

  - id: other-methods-need-a-login
    claim: Any method but GET and HEAD is answered 401 Unauthorized, since it needs an account and there is none.
    run: curl -s -o {{null}} -w "%{http_code}" -X DELETE http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: challenge-offers-digest
    claim: The 401 offers Digest logins, SHA-256 among them, in WWW-Authenticate headers.
    run: curl -s -o {{null}} -D - -X DELETE http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: 'WWW-Authenticate: Digest realm="surl", qop="auth", algorithm=SHA-256'
