# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-hide-and-show-dot-files
title: Serving Dot Files on Purpose
protocols: [http]
tier: foundations
surl-options: [--directory, --serve-dot-files]
curl-options: [-s, -o, -w]
exit-codes: [0]
references: [surl-readme]

fixtures:
  site/.well-known/security.txt: "Contact: mailto:security@example.com\n"
  site/.env: "API_KEY=not-for-you\n"
  site/.surl/notes.txt: "the server's own\n"

servers:
  main:
    command: surl --directory site --serve-dot-files http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --serve-dot-files, a file in a folder whose name begins with a dot is served.
    run: curl -s http://127.0.0.1:{{port}}/.well-known/security.txt
    expect:
      exit: 0
      stdout: "Contact: mailto:security@example.com\n"

  - id: every-dot-file
    claim: The option serves every dot name, a secrets file such as .env included.
    run: curl -s http://127.0.0.1:{{port}}/.env
    expect:
      exit: 0
      stdout: "API_KEY=not-for-you\n"

  - id: surl-folder-never
    claim: The .surl folder is never served, even with --serve-dot-files.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/.surl/notes.txt
    expect:
      exit: 0
      stdout: "404"
