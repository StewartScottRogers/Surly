# Executable specification. key MUST equal the folder name and never changes once published.
# No servers: block. The script starts its own surl two seconds after curl, on the port verify gives it.
schema: 1
key: http-retry-until-the-server-is-up
title: Waiting for a Server to Come Up
protocols: [http]
tier: foundations
surl-options: [--directory]
curl-options: [--no-progress-meter, -s, -S, -w, --retry, --retry-connrefused, --retry-delay]
exit-codes: [0, 7]
references: [surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"
  start-late.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Starts curl first and surl two seconds later, as a test that starts both at once may,
    # then stops surl once curl is done. Usage: sh start-late.sh <port> [curl options]
    port=$1; shift
    curl "$@" "http://127.0.0.1:$port/hello.txt" > fetched.txt &
    client=$!
    sleep 2
    surl --directory site "http://127.0.0.1:$port/" > surl.log 2>&1 &
    server=$!
    wait "$client"
    status=$?
    kill "$server"
    cat fetched.txt
    exit $status

cases:
  - id: solution
    role: solution
    claim: curl starts two seconds before surl; with --retry 5 --retry-connrefused --retry-delay 1 it counts each refused connection as worth a retry, tries once a second, and gets the file once surl is listening, exit 0, after at least one retry.
    run: sh start-late.sh {{port}} --no-progress-meter --retry 5 --retry-connrefused --retry-delay 1 -w "%{num_retries}\n"
    timeout: 30
    expect:
      exit: 0
      stdout-matches: '^hello from surl\n[1-5]\n$'
      stderr-contains: "Warning: Problem : connection refused. Retrying in 1 second. 5 retries left."

  - id: retry-alone
    claim: --retry alone does not count a refused connection as transient, so with nothing listening curl makes no retry and exits 7 at once.
    run: curl -sS --retry 5 --retry-delay 1 -w "%{num_retries}\n" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 7
      stdout: "0\n"
      stderr-contains: "curl: (7) Failed to connect to 127.0.0.1"

  - id: no-retry
    claim: With no retry at all, a refused connection is exit 7, Failed to connect.
    run: curl -sS http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 7
      stdout: ""
      stderr-contains: "curl: (7) Failed to connect to 127.0.0.1"

  - id: gives-up
    claim: The wait is bounded; if surl never comes up, --retry 2 --retry-connrefused --retry-delay 1 makes two retries a second apart and then exits 7.
    run: curl -sS --retry 2 --retry-connrefused --retry-delay 1 -w "%{num_retries}\n" http://127.0.0.1:{{port3}}/hello.txt
    timeout: 30
    expect:
      exit: 7
      stdout: "2\n"
      stderr-contains: "curl: (7) Failed to connect to 127.0.0.1"
