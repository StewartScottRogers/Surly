# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-tell-a-dead-server-from-a-missing-file-in-csharp
title: Diagnosing a Failed Fetch in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 6, 7, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A path the server does not have is answered 404 Not Found as an ordinary CurlResponse, nothing throws, and the program exits 22 as curl -f would.
    program: diagnose.cs
    args: []
    expect:
      exit: 22
      stdout: "missing: 404 Not Found\n"

  - id: up
    claim: A path the server has is answered 200 OK, and the program exits 0.
    program: diagnose.cs
    args: [up]
    expect:
      exit: 0
      stdout: "up: 200 OK\n"

  - id: stopped
    claim: After StopAsync the same URL throws a CurlException whose Code is CouldntConnect, libcurl code 7, where before it was answered.
    program: diagnose.cs
    args: [stopped]
    expect:
      exit: 7
      stdout: "stopped: CurlException CouldntConnect (7)\n"

  - id: no-listener
    claim: A port where nothing was ever listening throws the same CurlException with Code CouldntConnect, 7.
    program: diagnose.cs
    args: [no-listener]
    expect:
      exit: 7
      stdout: "no-listener: CurlException CouldntConnect (7)\n"

  - id: unresolved
    claim: A host name that does not resolve throws a CurlException whose Code is CouldntResolveHost, libcurl code 6, before any connection is tried.
    program: diagnose.cs
    args: [unresolved]
    expect:
      exit: 6
      stdout: "unresolved: CurlException CouldntResolveHost (6)\n"
