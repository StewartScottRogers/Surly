# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-retry-until-the-server-is-up-in-csharp
title: Retrying Until Servers Start in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlException, CurlCode]
exit-codes: [0, 7]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The client starts two seconds before the server; each attempt before the server listens fails with CurlException 7, CouldntConnect, and the client retries a second later until an attempt gets 200 OK and the file, within ten tries.
    program: wait-for-server.cs
    args: ["10", "2"]
    expect:
      exit: 0
      stdout-matches: '^attempt 1: CurlException 7 \(CouldntConnect\)\n(attempt \d+: CurlException 7 \(CouldntConnect\)\n)*attempt \d+: 200 OK, hello from surl\nserver stopped: Ok\n$'

  - id: already-up
    claim: With the server started before the client, the first attempt gets the file and there is nothing to retry.
    program: wait-for-server.cs
    args: ["10", "0"]
    expect:
      exit: 0
      stdout: "attempt 1: 200 OK, hello from surl\nserver stopped: Ok\n"

  - id: gives-up
    claim: The loop is bounded; with no server at all, three attempts a second apart all fail with 7 and the program gives up with curl's exit code 7.
    program: wait-for-server.cs
    args: ["3", "never"]
    expect:
      exit: 7
      stdout: "attempt 1: CurlException 7 (CouldntConnect)\nattempt 2: CurlException 7 (CouldntConnect)\nattempt 3: CurlException 7 (CouldntConnect)\ngave up after 3 attempts\n"
