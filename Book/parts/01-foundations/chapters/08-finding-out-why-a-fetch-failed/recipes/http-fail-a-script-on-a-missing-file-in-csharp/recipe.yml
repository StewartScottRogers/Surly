# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-fail-a-script-on-a-missing-file-in-csharp
title: Failing on a 404 in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: SendAsync returns the 404 Not Found as an ordinary CurlResponse; the program checks StatusCode before opening a file, throws with a message naming the URL and the status, creates no file, and exits 22.
    program: fetch-or-fail.cs
    args: [missing.txt]
    expect:
      exit: 22
      stdout: "missing.txt exists: False\n"
      stderr-contains: "download failed: GET http://127.0.0.1:"

  - id: message-names-status
    claim: The message ends in the status code and reason phrase the server sent, 404 Not Found.
    program: fetch-or-fail.cs
    args: [missing.txt]
    expect:
      exit: 22
      stderr-contains: "/missing.txt answered 404 Not Found"

  - id: present
    claim: For a file the server has, the status is 200, the body is saved, and the program exits 0.
    program: fetch-or-fail.cs
    args: [report.txt]
    expect:
      exit: 0
      stdout: "saved 11 bytes to report.txt\n"
      files:
        report.txt: "the report\n"

  - id: without-the-check
    claim: Without the status check, the 404's empty body is saved as a file of 0 bytes and the program reports success, as curl without -f does.
    program: fetch-or-fail.cs
    args: [absent.txt, --no-check]
    expect:
      exit: 0
      stdout: "saved 0 bytes to absent.txt\n"
      files:
        absent.txt: ""
