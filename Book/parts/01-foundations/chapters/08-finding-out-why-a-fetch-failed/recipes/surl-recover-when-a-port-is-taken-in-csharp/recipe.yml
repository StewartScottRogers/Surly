# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: surl-recover-when-a-port-is-taken-in-csharp
title: Recovering from Taken Ports in C#
protocols: [http]
tier: foundations
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, SurlExitCode, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 3, 45]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: With a TcpListener holding the port, StartAsync throws SurlServerStartException with ExitCode BindFailed (45) and surl's message, Address already in use; the program starts again on port 0, BoundUrl names a port that is neither the taken one nor 0, and the file is fetched there.
    program: fixture.cs
    args: [taken]
    expect:
      exit: 0
      stdout-matches: '^refused: BindFailed \(45\)\nsurl: \(45\) Could not bind http://127\.0\.0\.1:\d+/: Address already in use\nstarted on another port, not 0\n200 OK, hello from surl\n$'

  - id: free
    claim: On a port nothing holds, the first start succeeds on the port asked for, and nothing is caught.
    program: fixture.cs
    args: [free]
    expect:
      exit: 0
      stdout: "started on the port asked for\n200 OK, hello from surl\n"

  - id: other-refusals
    claim: A port that is no port at all, 70000, is SurlServerStartException with ExitCode MalformedUrl (3), URL rejected; the when filter lets only BindFailed fall back to port 0, so the program passes 3 on.
    program: fixture.cs
    args: [bad]
    expect:
      exit: 3
      stdout: "refused: MalformedUrl (3)\nsurl: (3) URL rejected: Port number was not a decimal number between 0 and 65535\n"
