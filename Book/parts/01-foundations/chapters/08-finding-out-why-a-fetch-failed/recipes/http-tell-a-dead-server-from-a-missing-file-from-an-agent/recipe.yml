# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: http-tell-a-dead-server-from-a-missing-file-from-an-agent
title: Diagnosing a Failed Fetch from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, stop_server, transfer, curl]
exit-codes: [6, 7, 22]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A path the server does not have is, to transfer, an answer with statusCode 404 and no failure, and to the curl tool with -f a tool error with exitCode 22, whose -w output is 404 22.
    program: diagnose.cs
    args: [missing]
    expect:
      exit: 1
      stdout: "transfer: statusCode 404, failure null, tool error no\ncurl -f: exitCode 22, -w [404 22], tool error yes\nfailure: curl exit code 22 (HttpReturnedError)\n"

  - id: up
    claim: A path the server has is statusCode 200 to transfer and exitCode 0 to curl -f, with no tool error.
    program: diagnose.cs
    args: [up]
    expect:
      exit: 0
      stdout: "transfer: statusCode 200, failure null, tool error no\ncurl -f: exitCode 0, -w [200 0], tool error no\n"

  - id: stopped
    claim: After stop_server the same URL has no status at all, statusCode null, and transfer is a tool error with failure kind CurlExit and curl exits 7, CouldntConnect, with -w output 000 7.
    program: diagnose.cs
    args: [stopped]
    expect:
      exit: 1
      stdout: "stop_server: tool error no\ntransfer: statusCode null, failure CurlExit, tool error yes\ncurl -f: exitCode 7, -w [000 7], tool error yes\nfailure: curl exit code 7 (CouldntConnect)\n"

  - id: unresolved
    claim: A host name that does not resolve is exit 6, CouldntResolveHost, with the same null statusCode and 000 status.
    program: diagnose.cs
    args: [unresolved]
    expect:
      exit: 1
      stdout: "transfer: statusCode null, failure CurlExit, tool error yes\ncurl -f: exitCode 6, -w [000 6], tool error yes\nfailure: curl exit code 6 (CouldntResolveHost)\n"
