# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs missing-or-empty.cs, a C# program on the official MCP SDK that starts both
# hosts from PATH; its arguments pick the curl-mcp tool and the path.
schema: 2
key: http-fail-a-script-on-a-missing-file-from-an-agent
title: Failing on a 404 from an Agent
protocols: [http]
tier: foundations
surface: mcp
mcp-tools: [start_server, transfer, curl]
curl-options: [-f, -s, -w]
exit-codes: [0, 22]
references: [curl-readme, surl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: transfer answers a missing file with statusCode 404 and surl's short error text as the body, and the call is not a tool error, so the agent must read the status to know.
    program: missing-or-empty.cs
    args: [transfer, missing.txt]
    expect:
      exit: 0
      stdout: "statusCode: 404\nbody: \"404 Not Found\\n\"\nfailure: null\ntool error: no\n"

  - id: empty-file
    claim: An empty file that is there comes back through transfer with an empty body and statusCode 200.
    program: missing-or-empty.cs
    args: [transfer, empty.txt]
    expect:
      exit: 0
      stdout: "statusCode: 200\nbody: \"\"\nfailure: null\ntool error: no\n"

  - id: curl-fail-missing
    claim: Through the curl tool with -f, the missing file makes curl exit 22, a tool error with a failure of kind CurlExit, while -w still prints 404.
    program: missing-or-empty.cs
    args: [curl, missing.txt]
    expect:
      exit: 1
      stdout: "exitCode: 22\nstandardOutput: 404\nfailure: CurlExit\ntool error: yes\n"

  - id: curl-fail-empty
    claim: The same curl -f call for the empty file exits 0 and prints 200, and is not a tool error.
    program: missing-or-empty.cs
    args: [curl, empty.txt]
    expect:
      exit: 0
      stdout: "exitCode: 0\nstandardOutput: 200\nfailure: null\ntool error: no\n"
