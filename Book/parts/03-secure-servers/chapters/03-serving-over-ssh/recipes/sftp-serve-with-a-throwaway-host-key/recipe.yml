# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: sftp-serve-with-a-throwaway-host-key
title: Serving over Secure Shell with a Throwaway Key
protocols: [sftp, scp]
tier: secure-servers
surl-options: [--directory, --throwaway-hostkey, --user, --hostkey]
curl-options: [-k, -u, -s, -S, --knownhosts]
exit-codes: [0, 2, 60, 67]
references: [surl-readme, curl-readme, rfc4251, rfc4252]

fixtures:
  site/hello.txt: "hello from surl\n"
  known_hosts: ""

servers:
  main:
    command: surl --directory site --throwaway-hostkey --user alice:s3cret sftp://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With a throwaway host key, surl serves SFTP, and curl -k with the account's user and password fetches the file, exit 0.
    run: curl -k -u alice:s3cret sftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: no-host-key
    claim: Without --throwaway-hostkey or --hostkey, surl refuses an sftp listen URL at start, names both options, and exits 2.
    run: surl sftp://127.0.0.1:{{port2}}/
    expect:
      exit: 2
      stdout: ""
      stderr-contains: "needs a host key: give --hostkey <file>, or --throwaway-hostkey for a throwaway one"

  - id: not-with-hostkey
    claim: --throwaway-hostkey cannot be given with --hostkey; surl refuses the pair at start and exits 2.
    run: surl --hostkey host_key --throwaway-hostkey sftp://127.0.0.1:{{port2}}/
    expect:
      exit: 2
      stderr-contains: "--throwaway-hostkey: cannot be used with --hostkey"

  - id: unknown-key-refused
    claim: Without -k, curl checks the host key against a known_hosts file; the throwaway key is in none, so curl refuses the server and exits 60 before logging in.
    run: curl -s -S --knownhosts known_hosts -u alice:s3cret sftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stdout: ""
      stderr-contains: "SSH remote key was not OK"

  - id: scp-too
    claim: The same listener answers scp as well, with the same login.
    run: curl -k -u alice:s3cret scp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: login-still-checked
    claim: -k skips only the host-key check; a wrong password is still refused, and curl exits 67, login denied.
    run: curl -s -S -k -u alice:wrong sftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: login-needed
    claim: With no -u at all, the login is refused the same way, exit 67.
    run: curl -s -S -k sftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 67
      stdout: ""
