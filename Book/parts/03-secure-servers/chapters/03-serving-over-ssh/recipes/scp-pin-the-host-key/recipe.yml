# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: scp-pin-the-host-key
title: Pinning the Server's Secure Shell Host Key
protocols: [scp, sftp]
tier: secure-servers
surl-options: [-v, --directory, --hostkey, --user]
curl-options: [--variable, --expand-hostpubsha256, --hostpubsha256, -u, -s, -S]
exit-codes: [0, 2, 37, 60]
references: [surl-readme, curl-readme, rfc4251]

fixtures:
  site/hello.txt: "hello from surl\n"

# The host key, and its fingerprint as ssh-keygen prints it: bits, SHA256:, the hash, comment.
setup:
  - ssh-keygen -t rsa -b 3072 -N "" -f host_key
  - ssh-keygen -lf host_key.pub > fingerprint.txt

servers:
  main:
    command: surl -v --directory site --hostkey host_key --user alice:s3cret scp://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl reads the key's SHA-256 hash from bytes 12 to 54 of the fingerprint file, pins it with --hostpubsha256, and fetches the file over SCP, exit 0.
    run: curl -u alice:s3cret --variable "host_sha256[12-54]@fingerprint.txt" --expand-hostpubsha256 "{{host_sha256}}" scp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: fingerprint-shape
    claim: ssh-keygen -l prints the key's size, 3072, then SHA256:, then the hash as 43 characters of base64 without padding, so the hash is bytes 12 to 54 of the line.
    run: ssh-keygen -lf host_key.pub
    expect:
      exit: 0
      stdout-matches: '\A3072 SHA256:[A-Za-z0-9+/]{43} '

  - id: padded-too
    claim: The same hash with base64's = padding on the end, as surl prints it, is accepted too.
    run: curl -s -S -u alice:s3cret --variable "host_sha256[12-54]@fingerprint.txt" --expand-hostpubsha256 "{{host_sha256}}=" scp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: sftp-same-pin
    claim: The scp listener answers sftp too, with the same host key and so the same pin.
    run: curl -s -S -u alice:s3cret --variable "host_sha256[12-54]@fingerprint.txt" --expand-hostpubsha256 "{{host_sha256}}" sftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: wrong-pin
    claim: A pin that does not match makes curl refuse the server before logging in, naming the hash the server offered, and exit 60.
    run: curl -s -S -u alice:s3cret --hostpubsha256 AAAABAzsMLXmAESKRY/jCK1EsFDDrPxgp5uKStD2LC8 scp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stdout: ""
      stderr-contains: "mismatch SHA256 fingerprint. Remote "

  - id: missing-key-file
    claim: A --hostkey file that cannot be read stops surl at start with exit 37, naming the file.
    run: surl --hostkey no_such_key scp://127.0.0.1:{{port2}}/
    expect:
      exit: 37
      stderr-contains: "Could not read host key no_such_key"

  - id: public-half-refused
    claim: Given the public half, host_key.pub, instead of the private key, surl refuses it at start and exits 2.
    run: surl --hostkey host_key.pub scp://127.0.0.1:{{port2}}/
    expect:
      exit: 2
      stderr-contains: "Host key host_key.pub: not a private key surl can read"
