# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: sftp-log-in-with-a-public-key
title: Logging In with a Secure Shell Key
protocols: [sftp]
tier: secure-servers
surl-options: [--directory, --hostkey, --authorized-keys]
curl-options: [-k, -u, --key, --pubkey, -s, -S]
exit-codes: [0, 37, 67]
references: [surl-readme, curl-readme, rfc4252]

fixtures:
  site/hello.txt: "hello from surl\n"

# The server's host key, alice's key, and a key nobody authorized.
setup:
  - ssh-keygen -t rsa -b 3072 -N "" -f host_key
  - ssh-keygen -t rsa -b 3072 -N "" -f alice_key
  - ssh-keygen -t rsa -b 3072 -N "" -f other_key

servers:
  main:
    command: surl --directory site --hostkey host_key --authorized-keys alice:alice_key.pub sftp://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl logs in as alice with her private key and its public half, and fetches the file, exit 0.
    run: 'curl -k -u alice: --key alice_key --pubkey alice_key.pub sftp://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: pubkey-optional
    claim: Without --pubkey, curl works the public half out from the private key, and the login still succeeds.
    run: 'curl -s -S -k -u alice: --key alice_key sftp://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: user-in-url
    claim: The user name can go in the URL instead of -u.
    run: curl -s -S -k --key alice_key sftp://alice@127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: other-key-refused
    claim: A key that is not in alice's authorized keys file is refused, and curl exits 67, login denied.
    run: 'curl -s -S -k -u alice: --key other_key --pubkey other_key.pub sftp://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: other-user-refused
    claim: alice's key does not log in as anyone else, exit 67.
    run: 'curl -s -S -k -u bob: --key alice_key --pubkey alice_key.pub sftp://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 67
      stdout: ""

  - id: no-password
    claim: With only --authorized-keys, alice has no password; a password login as alice is refused, exit 67.
    run: curl -s -S -k -u alice:s3cret sftp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 67
      stdout: ""

  - id: missing-file
    claim: An --authorized-keys file that cannot be read stops surl at start with exit 37.
    run: surl --hostkey host_key --authorized-keys alice:no_such_file sftp://127.0.0.1:{{port2}}/
    expect:
      exit: 37
      stdout: ""
