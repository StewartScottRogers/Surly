# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: sftp-list-and-make-folders-in-csharp
title: Making SFTP Folders in C#
protocols: [sftp]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlFtpOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc4251]

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A Surl.Api server with ListDirectories and AllowUploads lists its folder through Curl.Api, makes reports with a quote command, mkdir /reports, and lists it again with the new folder in it.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^list: \[hello\.txt\]\nmkdir /reports: \[hello\.txt reports\]\nlist again: \[hello\.txt reports\]\n'

  - id: twice
    claim: Making a folder that exists throws CurlException with code 21, QuoteError.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmkdir /reports: CurlException 21 QuoteError\n'

  - id: nested
    claim: A folder made inside another is listed through the outer folder's path.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmkdir /reports/2026: \[2026\]\n'

  - id: after-the-listing
    claim: A quote command whose text starts with a dash runs after the transfer, so its listing does not show the folder it made, and the next one does.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\n-mkdir /archive: \[hello\.txt reports\]\nlist last: \[archive hello\.txt reports\]\n'

  - id: folders-off
    claim: Without AllowUploads, the listing works and the same quote command throws CurlException with code 21, QuoteError.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlisting-only list: \[hello\.txt\]\nlisting-only mkdir: CurlException 21 QuoteError\n'

  - id: listings-off
    claim: Without ListDirectories, a listing throws CurlException with code 78, RemoteFileNotFound.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nclosed list: CurlException 78 RemoteFileNotFound\n$'
