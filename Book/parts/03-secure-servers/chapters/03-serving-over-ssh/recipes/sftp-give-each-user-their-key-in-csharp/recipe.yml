schema: 2
key: sftp-give-each-user-their-key-in-csharp
title: Per-User SSH Keys in C#
protocols: [sftp]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, LoginJudgedEvent, CurlClient, CurlRequest, CurlResponse, CurlSshOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc4252]

fixtures: {}

# The server's host key, one key for each deploy user, and a second key for deploy-a. a_keys is
# deploy-a's authorized keys file: one public key a line.
setup:
  - ssh-keygen -q -t rsa -b 3072 -N "" -f host_key
  - ssh-keygen -q -t rsa -b 3072 -N "" -f deploy_a
  - ssh-keygen -q -t rsa -b 3072 -N "" -f deploy_a2
  - ssh-keygen -q -t rsa -b 3072 -N "" -f deploy_b
  - cat deploy_a.pub deploy_a2.pub > a_keys

cases:
  - id: solution
    role: solution
    claim: "deploy-a logs in with its own key, CurlSshOptions.PrivateKeyFile, and fetches the file."
    program: keys.cs
    args: ["own-key"]
    expect:
      exit: 0
      stdout: "deploy-a, own key: hello from surl\n"

  - id: second-user
    claim: "deploy-b logs in to the same server with its own key and fetches the file."
    program: keys.cs
    args: ["second-user"]
    expect:
      exit: 0
      stdout: "deploy-b, own key: hello from surl\n"

  - id: a-key-as-b
    claim: "deploy-a's key offered as deploy-b is refused: CurlException with Code LoginDenied, 67."
    program: keys.cs
    args: ["a-key-as-b"]
    expect:
      exit: 0
      stdout: "deploy-b, deploy-a's key: refused, LoginDenied (67)\n"

  - id: b-key-as-a
    claim: "deploy-b's key offered as deploy-a is refused the same way, 67."
    program: keys.cs
    args: ["b-key-as-a"]
    expect:
      exit: 0
      stdout: "deploy-a, deploy-b's key: refused, LoginDenied (67)\n"

  - id: second-key-same-user
    claim: "A user may have more than one key; the second public key in deploy-a's file logs in as deploy-a."
    program: keys.cs
    args: ["second-key"]
    expect:
      exit: 0
      stdout: "deploy-a, second key: hello from surl\n"

  - id: second-key-as-b
    claim: "That second key is deploy-a's alone; offered as deploy-b it is refused, 67."
    program: keys.cs
    args: ["second-key-as-b"]
    expect:
      exit: 0
      stdout: "deploy-b, deploy-a's second key: refused, LoginDenied (67)\n"

  - id: unknown-user
    claim: "A user with no authorized keys file is refused whatever key it offers, 67."
    program: keys.cs
    args: ["unknown-user"]
    expect:
      exit: 0
      stdout: "deploy-c, deploy-a's key: refused, LoginDenied (67)\n"

  - id: events-name-the-user
    claim: "The recorded login_judged events say that deploy-a was accepted by publickey and deploy-b never was; the refused key for deploy-b leaves no login_judged event at all, since the client, held to publickey, tries no other method."
    program: keys.cs
    args: ["events"]
    expect:
      exit: 0
      stdout: "deploy-a: accepted by [publickey], refused logins: False\ndeploy-b: accepted by [], refused logins: False\n"

