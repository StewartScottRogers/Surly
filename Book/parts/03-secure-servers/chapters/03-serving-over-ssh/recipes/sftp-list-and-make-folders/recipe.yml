# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: sftp-list-and-make-folders
title: Listing and Making SFTP Folders
protocols: [sftp]
tier: secure-servers
surl-options: [--directory, --throwaway-hostkey, --user, --list-directories, --allow-uploads]
curl-options: [-k, -u, -Q, -l, -s, -S]
exit-codes: [0, 21, 78]
references: [surl-readme, curl-readme, rfc4251]

fixtures:
  site/hello.txt: "hello from surl\n"

# main: listings and folders on. closed: neither. listing-only: listings on, folders off.
servers:
  main:
    command: surl --directory site --throwaway-hostkey --user alice:s3cret --list-directories --allow-uploads sftp://127.0.0.1:{{port}}/
    ready: port
  closed:
    command: surl --throwaway-hostkey --user alice:s3cret sftp://127.0.0.1:{{port2}}/
    ready: port
  listing-only:
    command: surl --throwaway-hostkey --user alice:s3cret --list-directories sftp://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A quote command, mkdir /reports, makes a folder before the listing that follows it, and the listing shows both the file and the new folder, exit 0.
    run: curl -s -S -k -u alice:s3cret -Q "mkdir /reports" -l sftp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "hello.txt\nreports\n"

  - id: next-listing
    claim: A later listing, in a new connection, still shows the folder.
    run: curl -s -S -k -u alice:s3cret -l sftp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "hello.txt\nreports\n"

  - id: long-listing
    claim: The long listing, without -l, marks the folder with a d in the first column and the file with a dash.
    run: curl -s -S -k -u alice:s3cret sftp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout-matches: '\A-rw-r--r-- 1 surl surl +16 [^\n]* hello\.txt\r?\nd[rwx-]{9} [^\n]* reports\r?\n\Z'

  - id: after-the-listing
    claim: With a leading dash, the quote command runs after the transfer, so a listing in the same call does not yet show the folder it makes.
    run: curl -s -S -k -u alice:s3cret -Q "-mkdir /archive" -l sftp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "hello.txt\nreports\n"

  - id: made-after
    claim: The folder made after the listing is there in the next one.
    run: curl -s -S -k -u alice:s3cret -l sftp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "archive\nhello.txt\nreports\n"

  - id: nested
    claim: A folder made inside another is listed through the first one's path.
    run: curl -s -S -k -u alice:s3cret -Q "mkdir /reports/2026" -l sftp://127.0.0.1:{{port}}/reports/
    expect:
      exit: 0
      stdout: "2026\n"

  - id: twice
    claim: Making a folder that exists fails, and curl exits 21, quote command error.
    run: curl -s -S -k -u alice:s3cret -Q "mkdir /reports" -l sftp://127.0.0.1:{{port}}/
    expect:
      exit: 21
      stdout: ""
      stderr-contains: "mkdir"

  - id: listings-off
    claim: Without --list-directories, a listing is answered as if the folder were not there, and curl exits 78.
    run: curl -s -S -k -u alice:s3cret -l sftp://127.0.0.1:{{port2}}/
    expect:
      exit: 78
      stdout: ""
      stderr-contains: "No such file or directory"

  - id: folders-off
    claim: With --list-directories but not --allow-uploads, the listing works and mkdir is refused with permission denied, exit 21.
    run: curl -s -S -k -u alice:s3cret -Q "mkdir /reports" -l sftp://127.0.0.1:{{port3}}/
    expect:
      exit: 21
      stdout: ""
      stderr-contains: "Permission denied"

  - id: listing-only-lists
    claim: The same server lists its folder, which is empty, exit 0.
    run: curl -s -S -k -u alice:s3cret -l sftp://127.0.0.1:{{port3}}/
    expect:
      exit: 0
      stdout: ""

  - id: needs-a-login
    claim: A listing with no login is refused, and curl exits 67, login denied.
    run: curl -s -S -k -l sftp://127.0.0.1:{{port}}/
    expect:
      exit: 67
      stdout: ""
