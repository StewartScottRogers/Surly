# Each case runs keys.cs, a C# program on the official MCP SDK that starts surl-mcp and curl-mcp
# from PATH; its argument picks the scenario.
schema: 2
key: sftp-give-each-user-their-key-from-an-agent
title: Per-User SSH Keys from an Agent
protocols: [sftp]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl, get_events]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc4252]

fixtures: {}

# The server's host key, one key for each deploy user, and a second key for deploy-a. a_keys is
# deploy-a's authorized keys file: one public key a line.
setup:
  - ssh-keygen -q -t rsa -b 3072 -N "" -f host_key
  - ssh-keygen -q -t rsa -b 3072 -N "" -f deploy_a
  - ssh-keygen -q -t rsa -b 3072 -N "" -f deploy_a2
  - ssh-keygen -q -t rsa -b 3072 -N "" -f deploy_b
  - cat deploy_a.pub deploy_a2.pub > a_keys

cases:
  - id: solution
    role: solution
    claim: "An agent starts an SFTP server with one authorized key file for each deploy user, and curl-mcp's curl tool logs in as deploy-a with its own key and fetches the file: exit code 0."
    program: keys.cs
    args: ["own-key"]
    expect:
      exit: 0
      stdout: "deploy-a, deploy_a: exit code 0\nhello from surl\n"

  - id: second-user
    claim: "deploy-b logs in to the same server with its own key, exit code 0."
    program: keys.cs
    args: ["second-user"]
    expect:
      exit: 0
      stdout: "deploy-b, deploy_b: exit code 0\nhello from surl\n"

  - id: a-key-as-b
    claim: "deploy-a's key offered as deploy-b is refused: curl exits 67, login denied."
    program: keys.cs
    args: ["a-key-as-b"]
    expect:
      exit: 0
      stdout: "deploy-b, deploy_a: exit code 67\ncurl: (67) Login denied\n"

  - id: b-key-as-a
    claim: "deploy-b's key offered as deploy-a is refused the same way, 67."
    program: keys.cs
    args: ["b-key-as-a"]
    expect:
      exit: 0
      stdout: "deploy-a, deploy_b: exit code 67\ncurl: (67) Login denied\n"

  - id: second-key-same-user
    claim: "A user may have more than one key; the second public key in deploy-a's file logs in as deploy-a, exit code 0."
    program: keys.cs
    args: ["second-key"]
    expect:
      exit: 0
      stdout: "deploy-a, deploy_a2: exit code 0\nhello from surl\n"

  - id: second-key-as-b
    claim: "That second key is deploy-a's alone; offered as deploy-b it is refused, 67."
    program: keys.cs
    args: ["second-key-as-b"]
    expect:
      exit: 0
      stdout: "deploy-b, deploy_a2: exit code 67\ncurl: (67) Login denied\n"

  - id: unknown-user
    claim: "A user with no authorized keys file is refused whatever key it offers, 67."
    program: keys.cs
    args: ["unknown-user"]
    expect:
      exit: 0
      stdout: "deploy-c, deploy_a: exit code 67\ncurl: (67) Login denied\n"

  - id: events-name-the-user
    claim: "get_events with kinds login_judged says that deploy-a was accepted by publickey and deploy-b never was, and that logins as deploy-b were refused."
    program: keys.cs
    args: ["events"]
    expect:
      exit: 0
      stdout: "deploy-a: accepted by [publickey], refused logins: False\ndeploy-b: accepted by [], refused logins: True\n"

