# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs keep-off-smtp.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: imap-keep-a-mailbox-off-smtp-from-an-agent
title: Keeping a Mailbox Off SMTP from an Agent
protocols: [imap, smtp, pop3]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, wait_for_event, get_events, get_exchanges, list_mailboxes, curl]
curl-options: [-s, --crlf, -u, --mail-from, --mail-rcpt, -T]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc5321, rfc9051]

fixtures:
  hi.eml: "From: app@example.com\r\nTo: viewer@example.com\r\nSubject: Hello\r\n\r\nA test message.\r\n"


cases:
  - id: solution
    role: solution
    claim: "With protocols=imap the viewer mailbox reads the message app sent it over IMAP, curl exit 0."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "viewer\\ over\\ IMAP:\\ curl\\ exit\\ 0,\\ A\\ test\\ message\\.\\n"

  - id: smtp-refused
    claim: "The same user name and password are refused over SMTP; the curl tool exits 67."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "viewer\\ over\\ SMTP:\\ curl\\ exit\\ 67\\n"

  - id: refusal-reads-as-a-wrong-password
    claim: "get_exchanges shows the viewer's refusal as 535 5.7.8 Authentication credentials invalid, the reply a wrong password gets."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "viewer\\ over\\ SMTP:\\ curl\\ exit\\ 67\\n[\\s\\S]*SMTP\\ refusals\\ on\\ the\\ wire:\\ 2,\\ all\\ \"535\\ 5\\.7\\.8\\ Authentication\\ credentials\\ invalid\"\\n"

  - id: wrong-password-same-reply
    claim: "A wrong password for app, an account that may use SMTP, also exits 67 and gets the same 535; both refusals on the wire carry one reply."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "app,\\ wrong\\ password,\\ over\\ SMTP:\\ curl\\ exit\\ 67\\nSMTP\\ refusals\\ on\\ the\\ wire:\\ 2,\\ all\\ \"535\\ 5\\.7\\.8\\ Authentication\\ credentials\\ invalid\"\\n"

  - id: pop3-refused
    claim: "protocols=imap replaces the whole list, so the viewer is refused over POP3 as well, curl exit 67."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "viewer\\ over\\ POP3:\\ curl\\ exit\\ 67\\n"

  - id: mail-still-delivered
    claim: "Being kept off SMTP as a login does not stop SMTP delivering to the mailbox; wait_for_event names message 1 and list_mailboxes counts one message."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "app\\ sent\\ over\\ SMTP:\\ curl\\ exit\\ 0\\ndelivered:\\ viewer@example\\.com/INBOX/;UID=1\\n[\\s\\S]*list_mailboxes:\\ INBOX\\ holds\\ 1\\ message\\n"

  - id: other-mailbox-unrestricted
    claim: "app, given no protocols=, sends over SMTP and also logs in over IMAP and POP3, curl exit 0 each."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "app\\ sent\\ over\\ SMTP:\\ curl\\ exit\\ 0\\n[\\s\\S]*app\\ over\\ IMAP:\\ curl\\ exit\\ 0\\napp\\ over\\ POP3:\\ curl\\ exit\\ 0\\n"

  - id: judged-logins
    claim: "get_events shows the viewer's three logins by CRAM-MD5: accepted on IMAP, refused on SMTP and on POP3."
    program: keep-off-smtp.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "login_judged:\\ CRAM\\-MD5\\ viewer@example\\.com\\ is_accepted\\ true\\nlogin_judged:\\ CRAM\\-MD5\\ viewer@example\\.com\\ is_accepted\\ false\\nlogin_judged:\\ CRAM\\-MD5\\ viewer@example\\.com\\ is_accepted\\ false\\n"

  - id: imap-wrong-password
    claim: "Over IMAP the viewer's password is still checked; a wrong one makes curl exit 67."
    program: keep-off-smtp.cs
    args: ["wrong"]
    expect:
      exit: 0
      stdout-matches: "viewer,\\ wrong\\ password,\\ IMAP:\\ curl\\ exit\\ 67\\n"
