# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: pop3-log-in-with-apop-in-csharp
title: POP3 Logins with APOP in C#
protocols: [pop3]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, SurlEventKind, LoginJudgedEvent, SurlExchangeRecord, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, rfc1939]

fixtures: {}


cases:
  - id: solution
    role: solution
    claim: "With AuthenticationMethods set to apop, Curl.Api logs in with APOP and the server judges that login APOP, accepted."
    program: apop.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "Curl\\.Api\\ login:\\ ok\\n[\\s\\S]*login\\ judged:\\ APOP\\ ann@example\\.com\\ accepted\\n"

  - id: default-refuses-apop
    claim: "On the default server the greeting has no timestamp and a raw APOP is answered Unsupported authentication mechanism."
    program: apop.cs
    args: ["default"]
    expect:
      exit: 0
      stdout-matches: "greeting:\\ \\+OK\\ surl\\ ready\\nraw\\ APOP:\\ \\-ERR\\ Unsupported\\ authentication\\ mechanism\\n"

  - id: default-uses-cram-md5
    claim: "Against the default server Curl.Api logs in with CRAM-MD5, and the server judges it so; no APOP is involved."
    program: apop.cs
    args: ["default"]
    expect:
      exit: 0
      stdout-matches: "Curl\\.Api\\ login:\\ ok\\nlogin\\ judged:\\ CRAM\\-MD5\\ ann@example\\.com\\ accepted\\n"

  - id: greeting-timestamp
    claim: "Named by AuthenticationMethods, APOP changes the greeting, which now ends in a timestamp, and a raw APOP with a made-up digest is refused Authentication failed."
    program: apop.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "greeting:\\ ends\\ in\\ a\\ timestamp\\nraw\\ APOP:\\ \\-ERR\\ \\[AUTH\\]\\ Authentication\\ failed\\n"

  - id: digest-on-the-wire
    claim: "The recorded exchange holds an APOP digest that is the MD5 of the greeting's timestamp followed by the password, and the password itself is not in it."
    program: apop.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "digest\\ is\\ MD5\\ of\\ timestamp\\ and\\ password:\\ True\\npassword\\ on\\ the\\ wire:\\ False\\n"

  - id: wrong-password
    claim: "A wrong password fails the APOP login; CurlException 67."
    program: apop.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "wrong\\ password:\\ curl\\ error\\ 67\\n"

  - id: apop-only
    claim: "With APOP named alone the other logins are gone: USER is answered Encryption required and CAPA lists no SASL."
    program: apop.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "USER:\\ \\-ERR\\ \\[AUTH\\]\\ Encryption\\ required\\nCAPA\\ lists\\ SASL:\\ False\\n"

  - id: apop-with-cram-md5
    claim: "Naming APOP beside CRAM-MD5 keeps the timestamp greeting, but Curl.Api still logs in with CRAM-MD5."
    program: apop.cs
    args: ["both"]
    expect:
      exit: 0
      stdout-matches: "greeting:\\ ends\\ in\\ a\\ timestamp\\n[\\s\\S]*login\\ judged:\\ CRAM\\-MD5\\ ann@example\\.com\\ accepted\\n"
