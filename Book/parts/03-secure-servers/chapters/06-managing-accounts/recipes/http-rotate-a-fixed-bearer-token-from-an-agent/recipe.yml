# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs rotate-token.cs, a C# program on the official MCP
# SDK that starts both hosts from PATH; its argument picks the scenario.
# key MUST equal the folder name and never changes.
schema: 2
key: http-rotate-a-fixed-bearer-token-from-an-agent
title: Rotating a Fixed Bearer Token from an Agent
protocols: [https]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, add_account, set_account_password, remove_account, get_events, curl]
curl-options: [-s, -o, -w, --cacert, --oauth2-bearer]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc6750, rfc8446, mcp-spec]

fixtures: {}

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: With no account a GET with no token is 200; add_account with user "" and token-one answers {"user":""}, after which no token is 401 and token-one 200; set_account_password to token-two makes token-one 401 and token-two 200; remove_account then makes token-two 401 and a GET with no token 200 again.
    program: rotate-token.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^no token, no account: 200\nadd_account: \{"user":""\}\nno token: 401\ntoken-one: 200\nset_account_password: \{"user":""\}\ntoken-one: 401\ntoken-two: 200\n(judged: [^\n]+\n)+remove_account: [^\n]+\ntoken-two: 401\nno token: 200\n$'

  - id: judged-as-bearer-token
    claim: get_events with kinds login_judged gives three Bearer logins under the account name bearer token, never the token; accepted, refused after the rotation, accepted.
    program: rotate-token.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\ntoken-two: 200\njudged: Bearer bearer token accepted\njudged: Bearer bearer token refused\njudged: Bearer bearer token accepted\nremove_account: '

  - id: removal-warns
    claim: remove_account of the token, the server's only account, answers {"user":""} with a warning that the server has no account left and now needs no login.
    program: rotate-token.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nremove_account: \{"user":"","warning":"server s1 has no account left and now needs no login"\}\n'

  - id: refusals
    claim: A second add_account with user "" is a tool error, the Bearer-token account already exists, and token-one still works (200); with no token set, remove_account and set_account_password with user "" are tool errors saying there is no Bearer-token account.
    program: rotate-token.cs
    args: [refusals]
    expect:
      exit: 0
      stdout: "add_account again: error: the Bearer-token account already exists\ntoken-one: 200\nremove_account, none set: error: server s1 has no Bearer-token account\nset_account_password, none set: error: the Bearer-token account does not exist\n"
