# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs who-fetched.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-tell-clients-apart-by-account-from-an-agent
title: Telling Accounts Apart from an Agent
protocols: [http]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl, get_events, get_exchanges]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc7616]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Two services fetch from one surl-mcp server with their own accounts and a third call guesses search's password; get_events with kinds login_judged names the exchange, mechanism and account of each login, and get_exchanges for each accepted login's exchange shows billing fetched invoices.csv and search fetched index.html.
    program: who-fetched.cs
    args: []
    expect:
      exit: 0
      stdout: "billing GET /invoices.csv: 200\nsearch GET /index.html: 200\nsearch, wrong password, GET /invoices.csv: 401\nexchange 1: Digest billing accepted\nexchange 2: Digest search accepted\nexchange 3: Digest search refused\nbilling fetched: /invoices.csv\nsearch fetched: /index.html\n"

  - id: refused-login-names-the-claim
    claim: A wrong password is a login_judged event with is_accepted false, under the account the caller claimed.
    program: who-fetched.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nexchange 3: Digest search refused\n'

  - id: filter-by-account
    claim: get_events with account billing keeps only billing's exchange, its start, its login and its end.
    program: who-fetched.cs
    args: [by-account]
    expect:
      exit: 0
      stdout-matches: '\nbilling: exchange 1 exchange_started\nbilling: exchange 1 login_judged\nbilling: exchange 1 exchange_ended\nbilling: end of events\n$'

  - id: unknown-account-is-empty
    claim: get_events for an account no request named answers an empty list, not an error.
    program: who-fetched.cs
    args: [nobody]
    expect:
      exit: 0
      stdout-matches: '\nnobody: end of events\n$'
