# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: surl-share-one-account-file
title: Sharing One Account File
protocols: [http, ftps, imaps, mqtts]
tier: secure-servers
surl-options: [--user-file, -u, --cert, --key, --directory]
curl-options: [-u, --cacert, -s, -S, -f, -d, -X, --next]
exit-codes: [0, 2, 8, 22, 37, 67]
references: [surl-readme, curl-readme]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

fixtures:
  site/hello.txt: "hello from surl\n"
  extra/hello.txt: "hello from surl\n"
  users.txt: "# test accounts, one user:password a line\nalice:s3cret\nbob:b0bpass\n"
  extra-users.txt: "bob:b0bpass\n"
  bad-users.txt: "alice\n"

# main: one surl, four TLS listeners, one account file. extra: an account given with -u beside a file.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --user-file users.txt https://127.0.0.1:{{port}}/ ftps://127.0.0.1:{{port2}}/ imaps://127.0.0.1:{{port3}}/ mqtts://127.0.0.1:{{port4}}/
    ready: port
  extra:
    command: surl --directory extra --cert server.pem --key server.key -u carol:c4rol --user-file extra-users.txt https://127.0.0.1:{{port5}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Alice, who is in users.txt, logs in with the one password on all four listeners.
    run: curl -s --cacert server.pem -u alice:s3cret https://127.0.0.1:{{port}}/hello.txt --next -s --cacert server.pem -u alice:s3cret ftps://127.0.0.1:{{port2}}/hello.txt --next -s --cacert server.pem -u alice:s3cret -X "STATUS INBOX (MESSAGES)" imaps://127.0.0.1:{{port3}}/ --next -s --cacert server.pem -u alice:s3cret -d on mqtts://127.0.0.1:{{port4}}/t/lamp
    expect:
      exit: 0
      stdout-matches: '\Ahello from surl\nhello from surl\n\* STATUS INBOX \(MESSAGES 0\)\r?\n\Z'

  - id: second-line
    claim: Bob, on the second account line of the file, logs in on the same four listeners.
    run: curl -s --cacert server.pem -u bob:b0bpass https://127.0.0.1:{{port}}/hello.txt --next -s --cacert server.pem -u bob:b0bpass ftps://127.0.0.1:{{port2}}/hello.txt --next -s --cacert server.pem -u bob:b0bpass -X "STATUS INBOX (MESSAGES)" imaps://127.0.0.1:{{port3}}/ --next -s --cacert server.pem -u bob:b0bpass -d on mqtts://127.0.0.1:{{port4}}/t/lamp
    expect:
      exit: 0
      stdout-matches: '\Ahello from surl\nhello from surl\n\* STATUS INBOX \(MESSAGES 0\)\r?\n\Z'

  - id: missing-over-https
    claim: Over HTTPS a user who is not in the file gets 401, which curl -f makes exit 22.
    run: curl -s -S -f --cacert server.pem -u dave:nope https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "401"

  - id: missing-over-ftps
    claim: Over FTPS a user who is not in the file is refused, curl exit 67.
    run: curl -s -S --cacert server.pem -u dave:nope ftps://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 67
      stdout: ""

  - id: missing-over-imaps
    claim: Over IMAPS a user who is not in the file is refused, curl exit 67.
    run: curl -s -S --cacert server.pem -u dave:nope -X "STATUS INBOX (MESSAGES)" imaps://127.0.0.1:{{port3}}/
    expect:
      exit: 67
      stdout: ""

  - id: missing-over-mqtts
    claim: Over MQTTS a user who is not in the file is answered with CONNACK 4, and curl exits 8.
    run: curl -s -S --cacert server.pem -u dave:nope -d on mqtts://127.0.0.1:{{port4}}/t/lamp
    expect:
      exit: 8
      stdout: ""
      stderr-contains: "Expected 0000 but got 0004"

  - id: wrong-over-https
    claim: Over HTTPS a wrong password for a user in the file gets 401, which curl -f makes exit 22.
    run: curl -s -S -f --cacert server.pem -u alice:wrong https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "401"

  - id: wrong-over-ftps
    claim: Over FTPS a wrong password for a user in the file is refused, curl exit 67.
    run: curl -s -S --cacert server.pem -u alice:wrong ftps://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 67
      stdout: ""

  - id: wrong-over-imaps
    claim: Over IMAPS a wrong password for a user in the file is refused, curl exit 67.
    run: curl -s -S --cacert server.pem -u alice:wrong -X "STATUS INBOX (MESSAGES)" imaps://127.0.0.1:{{port3}}/
    expect:
      exit: 67
      stdout: ""

  - id: wrong-over-mqtts
    claim: Over MQTTS a wrong password for a user in the file is answered with CONNACK 4, and curl exits 8.
    run: curl -s -S --cacert server.pem -u alice:wrong -d on mqtts://127.0.0.1:{{port4}}/t/lamp
    expect:
      exit: 8
      stdout: ""
      stderr-contains: "Expected 0000 but got 0004"

  - id: user-flag-and-file
    claim: One surl takes both an account given with -u and the accounts of a file, so carol (-u) and bob (file) both log in.
    run: curl -s --cacert server.pem -u carol:c4rol https://127.0.0.1:{{port5}}/hello.txt --next -s --cacert server.pem -u bob:b0bpass https://127.0.0.1:{{port5}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\nhello from surl\n"

  - id: file-missing
    claim: A file that cannot be read stops surl at start with exit 37.
    run: surl --user-file nosuch.txt http://127.0.0.1:{{port6}}/
    expect:
      exit: 37
      stdout: ""

  - id: line-without-colon
    claim: A line that is not user:password stops surl at start with exit 2, and the message names the line.
    run: surl --user-file bad-users.txt http://127.0.0.1:{{port6}}/
    expect:
      exit: 2
      stdout: ""
      stderr-contains: "line 1"
