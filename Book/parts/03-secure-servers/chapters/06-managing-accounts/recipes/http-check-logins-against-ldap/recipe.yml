# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: http-check-logins-against-ldap
title: Checking Logins against LDAP
protocols: [http, ldap]
tier: secure-servers
surl-options: [--directory, --cert, --key, -u, -v, --log-file, --user-ldap, --control, --control-token-file]
curl-options: [-s, -S, -u, --cacert, -o, -w, -H, --data-binary, --json, -X]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc4511, rfc4516, rfc7617]

# dir/ holds the company directory: alice and bob under ou=people. svc.pass is the web server's
# service password, read from a file. control.token is the directory's control token.
# carol.ldif and carol.json add a new starter at run time.
fixtures:
  dir/.surl/ldap/directory.ldif: |
    dn: dc=example,dc=com
    objectClass: domain
    dc: example

    dn: ou=people,dc=example,dc=com
    objectClass: organizationalUnit
    ou: people

    dn: uid=alice,ou=people,dc=example,dc=com
    objectClass: inetOrgPerson
    uid: alice
    cn: Alice Liddell
    sn: Liddell

    dn: uid=bob,ou=people,dc=example,dc=com
    objectClass: inetOrgPerson
    uid: bob
    cn: Bob Builder
    sn: Builder
  svc.pass: "svcpass\n"
  control.token: "6f1c0a9e3b7d4c2a8e5f1b0d9c7a3e6f\n"
  carol.ldif: |
    dn: uid=carol,ou=people,dc=example,dc=com
    objectClass: inetOrgPerson
    uid: carol
    cn: Carol Danvers
    sn: Danvers
  carol.json: '{"user":"carol","password":"marvel"}'
  site/report.txt: "q3 total: 1200\n"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed. Both servers use it.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# directory: the LDAP server and its accounts, alice, bob and svc, with a control endpoint for
# managing them at run time. web: the HTTPS server, which asks the directory about every login it
# holds no account for. It holds two of its own: ops, so that every request needs a login, and an
# old local bob.
servers:
  directory:
    command: surl -v --log-file ldap.log --directory dir --cert server.pem --key server.key -u alice:wonderland -u bob:builder -u svc:svcpass --control http://127.0.0.1:{{port3}}/ --control-token-file control.token ldap://127.0.0.1:{{port}}/
    ready: port
  web:
    command: surl -v --log-file web.log --directory site --cert server.pem --key server.key -u ops:opspass -u bob:localpass --user-ldap "ldap://127.0.0.1:{{port}}/ou=people,dc=example,dc=com;bind-dn=cn=svc,dc=example,dc=com;bind-password-file=svc.pass;ca-file=server.pem" https://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: alice, whom only the directory holds, logs in to the web server with her directory password and is served the report.
    run: curl -sS --cacert server.pem -u alice:wonderland https://127.0.0.1:{{port2}}/report.txt
    expect:
      exit: 0
      stdout: "q3 total: 1200\n"

  - id: not-in-directory
    claim: carol, whom the directory does not hold, is refused 401.
    run: curl -sS --cacert server.pem -u carol:marvel -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt
    expect:
      exit: 0
      stdout: "401\n"

  - id: entry-alone
    claim: Adding carol's entry to the running directory through its control endpoint (204) is not enough; the directory checks a bind against its accounts, so carol is still refused 401.
    run: 'curl -sS -H "Authorization: Bearer 6f1c0a9e3b7d4c2a8e5f1b0d9c7a3e6f" -H "Content-Type: text/plain" --data-binary @carol.ldif -o {{null}} -w "%{http_code}\n" http://127.0.0.1:{{port3}}/v1/directory && curl -sS --cacert server.pem -u carol:marvel -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt'
    timeout: 60
    expect:
      exit: 0
      stdout: "204\n401\n"

  - id: new-starter
    claim: Once the directory also has an account for carol (204), she logs in to the web server, 200, though the web server was neither changed nor restarted.
    run: 'curl -sS -H "Authorization: Bearer 6f1c0a9e3b7d4c2a8e5f1b0d9c7a3e6f" --json @carol.json -o {{null}} -w "%{http_code}\n" http://127.0.0.1:{{port3}}/v1/accounts && curl -sS --cacert server.pem -u carol:marvel -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt'
    timeout: 60
    expect:
      exit: 0
      stdout: "204\n200\n"

  - id: leaver
    claim: Removing alice's account from the directory (204) refuses her next login to the web server, 401.
    run: 'curl -sS -H "Authorization: Bearer 6f1c0a9e3b7d4c2a8e5f1b0d9c7a3e6f" -X DELETE -o {{null}} -w "%{http_code}\n" http://127.0.0.1:{{port3}}/v1/accounts/alice && curl -sS --cacert server.pem -u alice:wonderland -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt'
    timeout: 60
    expect:
      exit: 0
      stdout: "204\n401\n"

  - id: why-refused
    claim: The web server's verbose log names the directory as its account source and gives each directory refusal its reason, no such entry for carol before she was added, wrong password while she had an entry and no account, wrong password for alice once her account was removed.
    run: 'grep -E "^Account source|directory: " web.log'
    expect:
      exit: 0
      stdout-matches: '\AAccount source: LDAP directory ldap://127\.0\.0\.1:\d+\nLogin refused: password carol \(directory: no such entry\)\nLogin refused: password carol \(directory: wrong password\)\nLogin refused: password alice \(directory: wrong password\)\n\Z'

  - id: local-shadows
    claim: A name the web server holds itself is never asked of the directory; bob with his directory password is refused 401, and with the web server's own password for bob is served, 200.
    run: curl -sS --cacert server.pem -u bob:builder -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt --next -sS --cacert server.pem -u bob:localpass -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt
    expect:
      exit: 0
      stdout: "401\n200\n"

  - id: no-login
    claim: With an account of its own, the web server answers a request with no login 401.
    run: curl -sS --cacert server.pem -o {{null}} -w "%{http_code}\n" https://127.0.0.1:{{port2}}/report.txt
    expect:
      exit: 0
      stdout: "401\n"
