# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: smb-upload-to-a-share-in-csharp
title: Uploading to SMB in C#
protocols: [smb, http]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, HttpAuthenticationMethods, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, ms-smb]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: With uploads allowed, an upload is answered 201 and the file is in the served directory, where a Curl.Api read over SMB returns it; a second upload to the name is answered 204 and replaces it.
    program: program.cs
    args: ["allow"]
    expect:
      exit: 0
      stdout: "upload: 201\non disk: quarterly numbers\nread over SMB: quarterly numbers\nupload again: 204\nread over SMB: revised numbers\n"

  - id: uploads-off-by-default
    claim: Without AllowUploads the upload is answered 405, nothing is written, and the SMB read throws CurlException with code 78, RemoteFileNotFound.
    program: program.cs
    args: ["closed"]
    expect:
      exit: 0
      stdout: "upload: 405\non disk: no file\nread over SMB: CurlException 78 RemoteFileNotFound\n"

  - id: too-large
    claim: With MaxFileSize at 10 bytes the same upload is answered 413 and nothing is stored.
    program: program.cs
    args: ["small"]
    expect:
      exit: 0
      stdout: "upload: 413\non disk: no file\nread over SMB: CurlException 78 RemoteFileNotFound\n"
