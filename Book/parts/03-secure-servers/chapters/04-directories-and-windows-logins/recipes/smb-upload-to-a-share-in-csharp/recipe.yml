# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: smb-upload-to-a-share-in-csharp
title: Uploading to SMB in C#
protocols: [smb, http]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, HttpAuthenticationMethods, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, ms-smb]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: With uploads allowed, a Curl.Api PUT with a byte body to the smb:// URL stores the file in the served directory, where a read over HTTP and a read over SMB both return it; a second upload to the name replaces it.
    program: program.cs
    args: ["allow"]
    expect:
      exit: 0
      stdout: "upload: stored\non disk: quarterly numbers\nread over HTTP: quarterly numbers\nread over SMB: quarterly numbers\nupload again: stored\nread over SMB: revised numbers\n"

  - id: uploads-off-by-default
    claim: Without AllowUploads the upload throws CurlException with code 9, RemoteAccessDenied, nothing is written, and the SMB read throws code 78, RemoteFileNotFound.
    program: program.cs
    args: ["closed"]
    expect:
      exit: 0
      stdout: "upload: CurlException 9 RemoteAccessDenied\non disk: no file\nread over SMB: CurlException 78 RemoteFileNotFound\n"

  - id: too-large
    claim: With MaxFileSize at 10 bytes the same upload throws CurlException with code 25, UploadFailed, and nothing is stored.
    program: program.cs
    args: ["small"]
    expect:
      exit: 0
      stdout: "upload: CurlException 25 UploadFailed\non disk: no file\nread over SMB: CurlException 78 RemoteFileNotFound\n"
