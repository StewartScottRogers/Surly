# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: smbs-read-a-share-over-tls-in-csharp
title: Reading Shares over SMBS in C#
protocols: [smbs]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlServerStartException, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlAuthenticationOptions, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 58]
references: [surl-readme, curl-readme, ms-smb, rfc8446]

fixtures: {}

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: A client that trusts server.pem and logs in as alice reads the file over smbs.
    program: program.cs
    args: ["trusted"]
    expect:
      exit: 0
      stdout: "read: read me first\n"

  - id: untrusted
    claim: A client that trusts nothing gets a CurlException with code 60, PeerFailedVerification.
    program: program.cs
    args: ["untrusted"]
    expect:
      exit: 0
      stdout: "read: CurlException 60 PeerFailedVerification\n"

  - id: wrong-password
    claim: A trusting client with the wrong password gets code 67, LoginDenied.
    program: program.cs
    args: ["wrong-password"]
    expect:
      exit: 0
      stdout: "read: CurlException 67 LoginDenied\n"

  - id: no-certificate
    claim: With neither a certificate nor SelfSigned, StartAsync throws SurlServerStartException naming both, and the program exits 58.
    program: program.cs
    args: ["no-certificate"]
    expect:
      exit: 58
      stdout-matches: 'needs a certificate: give --cert <file>, or --self-signed for a throwaway one'

  - id: self-signed-untrusted
    claim: With SelfSigned a client that verifies gets code 60 again.
    program: program.cs
    args: ["self-signed"]
    expect:
      exit: 0
      stdout: "read: CurlException 60 PeerFailedVerification\n"

  - id: self-signed-skip
    claim: With VerifyPeer off, the same read works.
    program: program.cs
    args: ["self-signed-skip"]
    expect:
      exit: 0
      stdout: "read: read me first\n"
