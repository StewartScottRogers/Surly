schema: 2
key: ldap-search-with-a-filter-and-scope-from-an-agent
title: Filtering a Directory Search from an Agent
protocols: [ldap]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, add_ldap_entries, curl]
curl-options: [-s, -S, -u]
exit-codes: [0, 38, 39]
references: [surl-readme, curl-readme, rfc4511, rfc4516]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: An agent starts an LDAP server with --allow-anonymous through surl-mcp, add_ldap_entries seeds six entries from LDIF text, and curl-mcp's curl tool, binding anonymously with -u :, finds bob alone with a one-level search under ou=people for (sn=B*), exit 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^add_ldap_entries: \{"entry_count":6\}\none, \(sn=B\*\): 1 \[cn=bob,ou=people,dc=example,dc=com, mail: bob@example\.com\] exit 0\n'

  - id: scope-base
    claim: Scope base returns the base entry alone.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nbase: 1 \[ou=people,dc=example,dc=com, ou: people\] exit 0\n'

  - id: scope-one
    claim: Scope one from the top returns the two organizational units directly under it.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\none from the top: 2 \[ou=people,dc=example,dc=com, ou: people \| ou=groups,dc=example,dc=com, ou: groups\] exit 0\n'

  - id: scope-sub-and-one
    claim: The filter (cn=staff) finds the group two levels down with scope sub, and nothing with scope one, which is an empty result with curl exit 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsub, \(cn=staff\): 1 \[cn=staff,ou=groups,dc=example,dc=com, cn: staff\] exit 0\none, \(cn=staff\): 0 \[\] exit 0\n'

  - id: and-not
    claim: An and filter finds alice and bob, and a not filter leaves alice when bob is excluded.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nand: 2 \[cn=alice,ou=people,dc=example,dc=com, cn: alice \| cn=bob,ou=people,dc=example,dc=com, cn: bob\] exit 0\nnot: 1 \[cn=alice,ou=people,dc=example,dc=com, cn: alice\] exit 0\n'

  - id: no-match
    claim: A filter that matches nothing is an empty answer with curl exit 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nno match: 0 \[\] exit 0\n'

  - id: missing-base
    claim: A base that is not in the directory is an empty answer with curl exit 39, the code for a failed search.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmissing base: 0 \[\] exit 39\n'

  - id: anonymous-refused
    claim: On a server started without --allow-anonymous, the same anonymous search is refused and curl exits 38, the code for a failed bind.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nstrict: 0 \[\] exit 38\n$'
