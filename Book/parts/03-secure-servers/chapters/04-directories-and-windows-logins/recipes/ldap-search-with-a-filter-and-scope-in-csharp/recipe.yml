# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: ldap-search-with-a-filter-and-scope-in-csharp
title: Filtering a Directory Search in C#
protocols: [ldap]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerDirectory, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc4511, rfc4516]

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A Surl.Api server with AllowAnonymous and a directory seeded from LDIF answers a Curl.Api one-level search under ou=people with the filter (sn=B*) and the attribute mail with bob's entry alone.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^one, \(sn=B\*\): 1 \[cn=bob,ou=people,dc=example,dc=com, mail: bob@example\.com\]\n'

  - id: scope-base
    claim: Scope base returns the base entry alone.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nbase: 1 \[ou=people,dc=example,dc=com, ou: people\]\n'

  - id: scope-one
    claim: Scope one from the top returns the two organizational units directly under it.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\none from the top: 2 \[ou=people,dc=example,dc=com, ou: people \| ou=groups,dc=example,dc=com, ou: groups\]\n'

  - id: scope-sub-and-one
    claim: The filter (cn=staff) finds the group two levels down with scope sub and nothing with scope one, and no exception is thrown for the empty result.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsub, \(cn=staff\): 1 \[cn=staff,ou=groups,dc=example,dc=com, cn: staff\]\none, \(cn=staff\): 0 \[\]\n'

  - id: and-not
    claim: An and filter finds alice and bob, and a not filter leaves alice when bob is excluded.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nand: 2 \[cn=alice,ou=people,dc=example,dc=com, cn: alice \| cn=bob,ou=people,dc=example,dc=com, cn: bob\]\nnot: 1 \[cn=alice,ou=people,dc=example,dc=com, cn: alice\]\n'

  - id: no-match
    claim: A filter that matches nothing returns an empty answer, not an exception.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nno match: 0 \[\]\n'

  - id: missing-base
    claim: A base that is not in the directory throws CurlException with code 39, LdapSearchFailed.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmissing base: CurlException 39 LdapSearchFailed\n'

  - id: anonymous-refused
    claim: Without AllowAnonymous, the same anonymous search throws CurlException with code 38, LdapCannotBind.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nstrict: CurlException 38 LdapCannotBind\n$'
