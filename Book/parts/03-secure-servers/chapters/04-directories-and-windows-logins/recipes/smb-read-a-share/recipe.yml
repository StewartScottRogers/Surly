# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: smb-read-a-share
title: Reading a File from an SMB Share
protocols: [smb]
tier: secure-servers
surl-options: [--directory, --auth, -u]
curl-options: [-u, -s, -S, -T, -V]
exit-codes: [0, 3, 9, 67, 78]
references: [surl-readme, ms-smb, ms-nlmp]

# Each top-level folder under site is a share: docs is one.
fixtures:
  site/docs/readme.txt: "read me first\n"
  site/docs/notes/todo.txt: "water the plants\n"
  report.txt: "quarterly numbers\n"

# Three servers. main is the recipe: NTLMv1 session setups accepted. strict has the same
# account and nothing loosened, and ntlm accepts the newer NTLM only; both are there so
# the refusals are checked claims, and serve an empty store, since two surl cannot share
# one --directory.
servers:
  main:
    command: surl --directory site --auth ntlmv1 -u alice:s3cret smb://127.0.0.1:{{port}}/
    ready: port
  strict:
    command: surl -u alice:s3cret smb://127.0.0.1:{{port2}}/
    ready: port
  ntlm:
    command: surl --auth ntlm -u alice:s3cret smb://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Logged in as alice, curl downloads readme.txt from the share docs and prints it, exit 0.
    run: curl -u alice:s3cret smb://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 0
      stdout: "read me first\n"

  - id: file-in-a-subfolder
    claim: The rest of the path after the share name is the path inside the share, so a file in a subfolder is fetched the same way.
    run: curl -u alice:s3cret smb://127.0.0.1:{{port}}/docs/notes/todo.txt
    expect:
      exit: 0
      stdout: "water the plants\n"

  - id: missing-file
    claim: A file that is not in the share makes curl exit 78, remote file not found, printing nothing.
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port}}/docs/missing.txt
    expect:
      exit: 78
      stdout: ""
      stderr-contains: "Remote file not found"

  - id: missing-share
    claim: A share that does not exist also makes curl exit 78.
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port}}/nope/readme.txt
    expect:
      exit: 78
      stdout: ""

  - id: folder-is-not-a-file
    claim: A folder is not a file curl can download; curl exits 78.
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port}}/docs/notes
    expect:
      exit: 78
      stdout: ""

  - id: no-share-in-url
    claim: A URL with only one path segment names no share; curl refuses it itself, exit 3, URL malformed.
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port}}/readme.txt
    expect:
      exit: 3
      stdout: ""
      stderr-contains: "missing share in URL path for SMB"

  - id: wrong-password
    claim: A wrong password is refused at session setup, and curl exits 67, login denied.
    run: curl -s -S -u alice:wrong smb://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: no-login
    claim: With no -u, curl's session setup carries no account, and it is refused the same way, exit 67.
    run: curl -s -S smb://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 67
      stdout: ""

  - id: upload-refused
    claim: The shares are read-only by default; uploading with -T is refused, and curl exits 9, access denied.
    run: curl -s -S -u alice:s3cret -T report.txt smb://127.0.0.1:{{port}}/docs/report.txt
    expect:
      exit: 9
      stdout: ""
      stderr-contains: "Access denied"

  - id: strict-refuses-ntlmv1
    claim: Without --auth ntlmv1, the right account is refused at session setup, and curl exits 67.
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port2}}/docs/readme.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: ntlm-is-not-ntlmv1
    claim: --auth ntlm, which accepts the newer NTLM for HTTP and LDAP, does not accept curl's NTLMv1 session setup; curl exits 67.
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port3}}/docs/readme.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: curl-has-smb
    claim: This curl was built with SMB; curl -V lists smb and smbs among its protocols.
    run: curl -V
    expect:
      exit: 0
      stdout-matches: '\nProtocols: [^\n]* smb smbs '
