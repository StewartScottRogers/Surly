# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008).
schema: 2
key: ldap-seed-a-directory-from-an-agent
title: Seeding a Directory from an Agent
protocols: [ldap]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, add_ldap_entries, read_directory, curl]
exit-codes: [0, 39]
references: [surl-readme, curl-readme, rfc4511, rfc4516]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A new surl-mcp LDAP server has an empty directory, so curl-mcp's curl tool exits 39 on a search; add_ldap_entries with alice's LDIF answers entry_count 3 and the same search finds her, and a second call adds bob beside her.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^empty: 0 \[\] exit 39\nfirst batch: entry_count 3\nafter the first batch: 1 \[cn=alice,ou=people,dc=example,dc=com, cn: alice\] exit 0\nsecond batch: entry_count 1\nafter the second batch: 2 \[cn=alice,ou=people,dc=example,dc=com, cn: alice \| cn=bob,ou=people,dc=example,dc=com, cn: bob\] exit 0\n'

  - id: all-or-none
    claim: A batch is all or none. When one entry has no parent, add_ldap_entries is a tool error and the entry that was fine, carol, is not added either.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmixed batch: refused\ncarol after it: 0 \[\] exit 0\n'

  - id: existing-name-and-bad-text
    claim: Adding a name that already exists, or text that is not LDIF, is a tool error too.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nalice again: refused\nnot LDIF: refused\n'

  - id: read-directory
    claim: read_directory answers the directory as LDIF with the seeded entries in it and every userPassword value left out.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nread_directory: alice present, bob present, userPassword absent, b0bpass absent\n'

  - id: no-ldap-listener
    claim: add_ldap_entries on a server that has no LDAP listener is a tool error.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nhttp server: refused\n'

  - id: another-server-is-empty
    claim: A second LDAP server has a directory of its own, empty again, so one test{apos}s people are not another{apos}s.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanother server: 0 \[\] exit 39\n$'
