# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008).
schema: 2
key: smb-upload-to-a-share-from-an-agent
title: Uploading to SMB from an Agent
protocols: [smb, http]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl]
exit-codes: [0, 9, 25, 78]
references: [surl-readme, ms-smb]

fixtures:
  site-allow/docs/readme.txt: "read me first\n"
  site-closed/docs/readme.txt: "read me first\n"
  site-small/docs/readme.txt: "read me first\n"
  report.txt: "quarterly numbers\n"
  report2.txt: "revised numbers\n"

cases:
  - id: solution
    role: solution
    claim: With uploads allowed, curl-mcp{apos}s curl tool uploads report.txt into the docs share and exits 0; the file reads back over HTTP with Digest and over SMB, and a second upload replaces it.
    program: program.cs
    args: ["allow"]
    expect:
      exit: 0
      stdout: "upload: exit 0\nread over HTTP: exit 0 quarterly numbers\nread over SMB: exit 0 quarterly numbers\nupload again: exit 0\nread over SMB: exit 0 revised numbers\n"

  - id: uploads-off-by-default
    claim: Without --allow-uploads the upload exits 9, access denied, and the name reads back as exit 78, remote file not found.
    program: program.cs
    args: ["closed"]
    expect:
      exit: 0
      stdout-matches: '^upload: exit 9 curl: \(9\) Access denied[^\n]*\nread over SMB: exit 78 curl: \(78\) Remote file not found'

  - id: too-large
    claim: With --max-filesize 10 the upload exits 25, upload failed, and the partial file is gone, so the read exits 78.
    program: program.cs
    args: ["small"]
    expect:
      exit: 0
      stdout-matches: '^upload: exit 25 curl: \(25\)[^\n]*\nread over SMB: exit 78 curl: \(78\) Remote file not found'
