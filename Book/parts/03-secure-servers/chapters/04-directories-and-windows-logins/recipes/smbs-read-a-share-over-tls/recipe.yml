# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: smbs-read-a-share-over-tls
title: Reading an SMB Share over TLS
protocols: [smbs]
tier: secure-servers
surl-options: [--cert, --key, --directory, --auth, -u, --self-signed]
curl-options: [--cacert, -k, -u, -s, -S]
exit-codes: [0, 56, 58, 60, 67]
references: [surl-readme, ms-smb, rfc8446]

# Each folder directly under a --directory is a share: docs is one.
fixtures:
  site/docs/readme.txt: "read me first\n"
  throwaway/docs/readme.txt: "read me first\n"

# The certificate and key are made by setup, with the address as a subject alternative name so
# curl can check it. main uses them; throwaway makes its own certificate.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --auth ntlmv1 -u alice:s3cret smbs://127.0.0.1:{{port}}/
    ready: port
  throwaway:
    command: surl --directory throwaway --self-signed --auth ntlmv1 -u alice:s3cret smbs://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Trusting the server{apos}s certificate with --cacert and logging in as alice, curl reads readme.txt from the share over TLS and prints it, exit 0.
    run: curl --cacert server.pem -u alice:s3cret smbs://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 0
      stdout: "read me first\n"

  - id: untrusted
    claim: Without --cacert curl does not trust a certificate no authority signed, and exits 60 before any login.
    run: curl -s -S -u alice:s3cret smbs://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 60
      stdout: ""
      stderr-contains: "curl: (60)"

  - id: wrong-password
    claim: Inside the tunnel the login is checked as on plain SMB; a wrong password makes curl exit 67, login denied.
    run: curl -s -S --cacert server.pem -u alice:wrong smbs://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Login denied"

  - id: plain-smb-to-the-tls-port
    claim: A plain smb:// client on the TLS port gets no answer it can use; curl exits 56, receive failure (on Windows).
    platforms: [windows]
    run: curl -s -S -u alice:s3cret smb://127.0.0.1:{{port}}/docs/readme.txt
    expect:
      exit: 56
      stdout: ""

  - id: no-certificate
    claim: An smbs listen URL with no --cert and no --self-signed is refused at start, exit 58, naming both options.
    run: surl --auth ntlmv1 -u alice:s3cret smbs://127.0.0.1:{{port9}}/
    expect:
      exit: 58
      stderr-contains: "needs a certificate: give --cert <file>, or --self-signed for a throwaway one"

  - id: self-signed-needs-k
    claim: The throwaway certificate of --self-signed is trusted by no one, so curl exits 60 until it is told to skip the check with -k.
    run: curl -s -S -u alice:s3cret smbs://127.0.0.1:{{port2}}/docs/readme.txt
    expect:
      exit: 60
      stdout: ""

  - id: self-signed-with-k
    claim: With -k the same read works, and the share is the same.
    run: curl -s -S -k -u alice:s3cret smbs://127.0.0.1:{{port2}}/docs/readme.txt
    expect:
      exit: 0
      stdout: "read me first\n"
