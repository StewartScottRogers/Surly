# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: http-log-in-with-ntlm
title: Logging In over HTTP with NTLM
protocols: [http]
tier: secure-servers
surl-options: [--directory, --auth, -u]
curl-options: [--ntlm, --negotiate, -u, -f, -i, -s, -S, -o, -w]
exit-codes: [0, 22]
references: [surl-readme, rfc9110, ms-nlmp, curl-changes]

fixtures:
  site/hello.txt: "hello from surl\n"

# Three servers, each with the one account. main is the recipe: NTLM accepted.
# strict has nothing loosened, and negotiate accepts Negotiate only; both are there
# for the checked claims and serve an empty store (two surl cannot share one
# --directory), which a refused login never reaches.
servers:
  main:
    command: surl --directory site --auth ntlm -u alice:s3cret http://127.0.0.1:{{port}}/
    ready: port
  strict:
    command: surl -u alice:s3cret http://127.0.0.1:{{port2}}/
    ready: port
  negotiate:
    command: surl --auth negotiate -u alice:s3cret http://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl --ntlm logs in as alice and prints hello.txt, exit 0.
    run: curl --ntlm -u alice:s3cret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: challenge-offers-ntlm
    claim: A request with no login is answered 401 Unauthorized with WWW-Authenticate NTLM as the only method offered.
    run: curl -s -i http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 401 Unauthorized\n(?:(?!WWW-Authenticate)[^\n]*\n)*WWW-Authenticate: NTLM\n\n401 Unauthorized\n$'

  - id: wrong-password
    claim: A wrong password is answered 401 again, and with -f curl exits 22.
    run: curl -f -s -S --ntlm -u alice:wrong http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "401"

  - id: basic-refused-in-clear
    claim: Under --auth ntlm, a Basic login (-u without --ntlm) sends the password in clear over http:// and is refused 403 Forbidden unchecked.
    run: curl -s -o {{null}} -w "%{http_code}" -u alice:s3cret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: strict-refuses-ntlm
    claim: Without --auth ntlm, the same NTLM login is answered 401 Unauthorized.
    run: curl -s -o {{null}} -w "%{http_code}" --ntlm -u alice:s3cret http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: strict-offers-digest
    claim: By default the 401 offers Digest, and neither NTLM nor Negotiate.
    run: curl -s -i http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 401 Unauthorized\n(?=.*\nWWW-Authenticate: Digest )(?:(?!WWW-Authenticate: (?:NTLM|Negotiate))[^\n]*\n)*\n401 Unauthorized\n$'

  - id: negotiate-offered
    claim: Under --auth negotiate the 401 offers Negotiate.
    run: curl -s -i http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '\nWWW-Authenticate: Negotiate\n'

  - id: negotiate-cannot-log-in
    claim: With no Kerberos to use, curl's --negotiate cannot log in here; the 401 stands, and with -f curl exits 22.
    run: curl -f -s -S --negotiate -u alice:s3cret http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 22
      stdout: ""

  - id: negotiate-sends-nothing
    claim: On Windows, with no Kerberos to use, the system's security library (SSPI) finds no credentials for --negotiate, and curl's error names SEC_E_NO_CREDENTIALS. Linux and macOS use GSS-API instead, which words its failure differently.
    platforms: [windows]
    run: curl -f -s -S --negotiate -u alice:s3cret http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "SEC_E_NO_CREDENTIALS"
