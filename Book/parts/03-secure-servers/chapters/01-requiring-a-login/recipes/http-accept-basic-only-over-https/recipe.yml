# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: http-accept-basic-only-over-https
title: Accepting Basic Only over HTTPS
protocols: [https, http]
tier: secure-servers
surl-options: [--directory, --cert, --key, --auth, --user]
curl-options: [-s, -u, --cacert, --digest, --http1.1, -o, -w, -D]
exit-codes: [0]
references: [surl-readme, rfc7617, rfc7616, rfc9110, rfc8446]

fixtures:
  site/hello.txt: "hello from surl\n"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main: one surl, two listeners, Basic the only method. default: the same account with --auth left out.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --auth basic --user alice:s3cret https://127.0.0.1:{{port}}/ http://127.0.0.1:{{port2}}/
    ready: port
  default:
    command: surl --cert server.pem --key server.key --user alice:s3cret https://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Over https://, Basic with alice's right password fetches the file, exit 0.
    run: curl -s --cacert server.pem -u alice:s3cret https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: wrong-password
    claim: Over https://, a wrong Basic password is answered 401 Unauthorized.
    run: curl -s --cacert server.pem -u alice:guess -o {{null}} -w "%{http_code}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: offers-basic-alone
    claim: The 401 for a request with no login offers Basic and nothing else.
    run: curl -s --http1.1 --cacert server.pem -o {{null}} -D - https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 401 Unauthorized\r?\n(?:(?!WWW-Authenticate)[^\r\n]*\r?\n)*WWW-Authenticate: Basic realm="surl", charset="UTF-8"\r?\n(?:(?!WWW-Authenticate)[^\r\n]*\r?\n)*\r?\n$'

  - id: digest-not-accepted
    claim: Digest is not accepted, because it is not offered; curl --digest with the right password is answered 401.
    run: curl -s --cacert server.pem --digest -u alice:s3cret -o {{null}} -w "%{http_code}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: default-offers-digest-first
    claim: Without --auth, the same server offers three Digest challenges before Basic, so Basic is not the only method on offer.
    run: curl -s --http1.1 --cacert server.pem -o {{null}} -D - https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '(WWW-Authenticate: Digest [^\r\n]+\r?\n){3}WWW-Authenticate: Basic realm="surl"'

  - id: clear-refused
    claim: Over http://, the right password sent with Basic is answered 403 Forbidden without being checked.
    run: curl -s -u alice:s3cret -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: clear-unchecked
    claim: A wrong password over http:// gets the same 403, so the password was not looked at.
    run: curl -s -u alice:guess -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: clear-offers-nothing
    claim: Over http://, a request with no login is answered 403, not 401, and carries no WWW-Authenticate header, because the only method on offer may not be used there.
    run: curl -s --http1.1 -o {{null}} -D - http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 403 Forbidden\r?\n(?:(?!WWW-Authenticate)[^\r\n]*\r?\n)*\r?\n$'
