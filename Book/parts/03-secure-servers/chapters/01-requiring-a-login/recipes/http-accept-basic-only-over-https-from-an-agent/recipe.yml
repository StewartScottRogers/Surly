# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-accept-basic-only-over-https-from-an-agent
title: Accepting Basic over HTTPS from an Agent
protocols: [https, http]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl]
curl-options: [-s, -i, --http1.1, --cacert, -u, --digest]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc7617, rfc9110, rfc8446]

fixtures: {}

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: An agent starts one surl-mcp server with an https and an http listener, --auth basic and one account; curl-mcp's curl tool logs in over https and is answered 200 with the file, and with the same password over http is answered 403.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^https, right password: 200 \[\] hello from surl\n(.*\n)*http, right password: 403 \[\]\n'

  - id: https-wrong-password
    claim: Over https, a wrong password is answered 401, and the answer offers Basic.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nhttps, wrong password: 401 \[Basic realm="surl", charset="UTF-8"\]\n'

  - id: basic-alone
    claim: The 401 offers Basic and nothing else, and curl --digest with the right password is answered 401 as well, since Digest is not offered.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nhttps, no login: 401 \[Basic realm="surl", charset="UTF-8"\]\nhttps, Digest: 401 \[Basic realm="surl", charset="UTF-8"\]\n'

  - id: http-unchecked
    claim: Over http, a wrong password gets the same 403 as the right one, so it was not checked.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nhttp, wrong password: 403 \[\]\n'

  - id: http-no-login
    claim: Over http, a request with no login is answered 403 with no WWW-Authenticate header.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nhttp, no login: 403 \[\]\n$'
