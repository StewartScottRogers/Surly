schema: 2
key: http-lock-out-one-account
title: Locking Out One Account
protocols: [http]
tier: secure-servers
surl-options: [--user, --fault, --control, --control-token-file, --directory, -v, --log-file]
curl-options: [--digest, -u, -s, -o, -w, -X, -H, --next]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc7616]

fixtures:
  site/hello.txt: "hello from surl\n"
  site2/hello.txt: "hello from surl\n"
  site3/hello.txt: "hello from surl\n"
  token.txt: "control-token-0123456789abcdefghij"

# main refuses bob until the test lifts the rule through the control endpoint; once refuses him for
# one login and then lets him in; calm has no rule. Each serves its own folder.
servers:
  main:
    command: surl -v --log-file surl.log --directory site --user alice:a1-secret --user bob:b2-secret --fault "refuse-login;account=bob" --control http://127.0.0.1:{{port3}} --control-token-file token.txt http://127.0.0.1:{{port}}/
    ready: port
  once:
    command: surl --directory site2 --user alice:a1-secret --user bob:b2-secret --fault "refuse-login;account=bob;times=1" http://127.0.0.1:{{port2}}/
    ready: port
  calm:
    command: surl --directory site3 --user alice:a1-secret --user bob:b2-secret http://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With the rule on bob, alice logs in and is answered 200, while bob, with his right password, is answered 401.
    run: curl -s -o {{null}} -w "%{http_code}\n" --digest -u alice:a1-secret http://127.0.0.1:{{port}}/hello.txt --next -s -o {{null}} -w "%{http_code}\n" --digest -u bob:b2-secret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "200\n401\n"

  - id: same-as-wrong-password
    claim: A refused bob looks like any failed login, a 401 with a fresh Digest challenge, so the client cannot tell a lock-out from a wrong password.
    run: curl -s -o {{null}} -w "%{http_code}\n" --digest -u bob:not-his-password http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401\n"

  - id: no-rule-no-lock
    claim: Without the rule, the same bob with the same password logs in.
    run: curl -s --digest -u bob:b2-secret http://127.0.0.1:{{port4}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: log-names-the-refusal
    claim: With -v the log has a Login refused line for bob and a Login accepted line for alice.
    run: grep -E "Login (accepted|refused)" surl.log
    expect:
      exit: 0
      stdout-matches: 'Login accepted: Digest alice\n(.*\n)*.*Login refused: Digest bob\n'

  - id: rule-listed
    claim: The control endpoint lists the rule, f1, with no limit on how often it applies.
    run: 'curl -s -H "Authorization: Bearer control-token-0123456789abcdefghij" http://127.0.0.1:{{port3}}/v1/faults'
    expect:
      exit: 0
      stdout: '{"faults":[{"fault_id":"f1","item":"refuse-login;account=bob","remaining":null}]}'

  - id: control-needs-the-token
    claim: The control endpoint answers 401 to a request without the token, so only the test can lift the rule.
    run: curl -s -o {{null}} -w "%{http_code}\n" -X DELETE http://127.0.0.1:{{port3}}/v1/faults/f1
    expect:
      exit: 0
      stdout: "401\n"

  - id: refusal-spent
    claim: With times=1 the rule refuses bob once and lifts itself, so his next login is answered 200.
    run: curl -s -o {{null}} -w "%{http_code}\n" --digest -u bob:b2-secret http://127.0.0.1:{{port2}}/hello.txt --next -s -o {{null}} -w "%{http_code}\n" --digest -u bob:b2-secret http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "401\n200\n"

  - id: lifted
    claim: Deleting the rule through the control endpoint is answered 204, and bob's next login is answered 200.
    run: 'curl -s -o {{null}} -w "%{http_code}\n" -X DELETE -H "Authorization: Bearer control-token-0123456789abcdefghij" http://127.0.0.1:{{port3}}/v1/faults/f1 --next -s -o {{null}} -w "%{http_code}\n" --digest -u bob:b2-secret http://127.0.0.1:{{port}}/hello.txt'
    expect:
      exit: 0
      stdout: "204\n200\n"
