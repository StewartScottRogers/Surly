schema: 2
key: http-lock-out-one-account-in-csharp
title: Locking Out One Account in C#
protocols: [http]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlFault, SurlFaultRule, SurlEventQuery, LoginJudgedEvent, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc7616]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: "With the rule on bob, alice is answered 200, bob with his right password is answered 401, removing the rule returns true, and bob's next login is answered 200."
    program: lock-out.cs
    args: ["lift"]
    expect:
      exit: 0
      stdout: "alice: 200 OK\nbob: 401 Unauthorized\nlifted f1: True\nbob: 200 OK\n"

  - id: same-as-wrong-password
    claim: "A locked-out bob with the right password gets the same 401 Unauthorized as bob with a wrong one, so the client cannot tell a lock-out from a wrong password."
    program: lock-out.cs
    args: ["wrong"]
    expect:
      exit: 0
      stdout: "bob, right password: 401 Unauthorized\nbob, wrong password: 401 Unauthorized\n"

  - id: no-rule-no-lock
    claim: "Without the rule, bob logs in with the same password and is answered 200."
    program: lock-out.cs
    args: ["calm"]
    expect:
      exit: 0
      stdout: "bob: 200 OK\n"

  - id: rule-listed
    claim: "Faults.List shows the rule as f1, refuse-login for bob, with no limit on how often it applies."
    program: lock-out.cs
    args: ["rule"]
    expect:
      exit: 0
      stdout: "f1: refuse-login;account=bob, remaining no limit\n"

  - id: refusal-spent
    claim: "With Times = 1 the rule refuses bob once and is spent, so his next login is answered 200."
    program: lock-out.cs
    args: ["once"]
    expect:
      exit: 0
      stdout: "bob: 401 Unauthorized\nbob: 200 OK\nuses left: 0\n"

  - id: events-name-the-account
    claim: "Recorded events say which logins were judged: alice accepted, bob refused, and one exchange involved bob."
    program: lock-out.cs
    args: ["events"]
    expect:
      exit: 0
      stdout: "Digest alice: accepted\nDigest bob: refused\nexchanges with bob: 1\n"

