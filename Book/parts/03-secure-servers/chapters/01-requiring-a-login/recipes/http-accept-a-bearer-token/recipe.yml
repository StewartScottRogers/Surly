# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: http-accept-a-bearer-token
title: Accepting a Bearer Token over HTTPS
protocols: [https, http]
tier: secure-servers
surl-options: [--directory, --user, --cert, --key, --allow-plaintext-auth]
curl-options: [-s, --cacert, --oauth2-bearer, -o, -w]
exit-codes: [0, 2]
references: [surl-readme, rfc6750, rfc8446, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  plain/hello.txt: "hello in clear\n"
  loose/hello.txt: "hello, loosened\n"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main is the recipe. plain is the same token over http://, the default; loose adds
# --allow-plaintext-auth to it. Each serves its own folder: one surl holds a folder at a time.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --user :t0ken-abc https://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --directory plain --user :t0ken-abc http://127.0.0.1:{{port2}}/
    ready: port
  loose:
    command: surl --directory loose --allow-plaintext-auth --user :t0ken-abc http://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Over HTTPS, curl --oauth2-bearer with the token the empty user name holds fetches hello.txt, exit 0.
    run: curl --cacert server.pem --oauth2-bearer t0ken-abc https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: wrong-token
    claim: A token surl does not hold is answered 401 Unauthorized.
    run: curl -s --cacert server.pem --oauth2-bearer t0ken-xyz -o {{null}} -w "%{http_code}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: no-token
    claim: A request with no token is answered 401.
    run: curl -s --cacert server.pem -o {{null}} -w "%{http_code}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: clear-token-refused
    claim: Over http://, by default, even the right token is answered 403 Forbidden.
    run: curl -s --oauth2-bearer t0ken-abc -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: clear-token-unchecked
    claim: A wrong token over http:// gets the same 403, so the token was not checked.
    run: curl -s --oauth2-bearer t0ken-xyz -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: loosened-accepts
    claim: With --allow-plaintext-auth, the right token over http:// is accepted.
    run: curl -s --oauth2-bearer t0ken-abc http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello, loosened\n"

  - id: loosened-checks
    claim: With --allow-plaintext-auth, a wrong token over http:// is checked and answered 401.
    run: curl -s --oauth2-bearer t0ken-xyz -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: one-token
    claim: An empty user name is a user name, so a second token is given twice and stops the start with exit 2.
    run: surl --user :t0ken-abc --user :t0ken-def http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: option --user: user  is given twice\n'
