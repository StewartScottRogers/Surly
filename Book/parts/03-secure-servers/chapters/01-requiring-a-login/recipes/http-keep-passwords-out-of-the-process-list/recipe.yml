# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-keep-passwords-out-of-the-process-list
title: Keeping Passwords out of the Process List
protocols: [http]
tier: secure-servers
surl-options: [--directory, --user-file, --user]
curl-options: [-s, --digest, -u, -o, -w]
exit-codes: [0, 2, 37]
references: [surl-readme, rfc7616]

# The comment line has a colon on purpose: read as an account, it would be the user #carol.
fixtures:
  site/hello.txt: "hello from surl\n"
  accounts.txt: "#carol:retired\nalice:s3cret\n\nbob:hunter2\n"
  broken.txt: "alice:s3cret\nbob\n"

servers:
  main:
    command: surl --directory site --user-file accounts.txt http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Alice, an account in accounts.txt, logs in with HTTP Digest and fetches hello.txt.
    run: curl --digest -u alice:s3cret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: every-line-an-account
    claim: Bob, on a later line after a blank one, logs in too.
    run: curl -s --digest -u bob:hunter2 http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: comment-skipped
    claim: A line starting with # is skipped, so #carol with the password retired is answered 401 Unauthorized.
    run: curl -s --digest -u "#carol:retired" -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: no-login
    claim: The file's accounts require a login as --user's do; a GET with none is answered 401.
    run: curl -s -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: malformed-line
    claim: A line that is not user:password stops the start with exit 2, naming the file and the line.
    run: surl --user-file broken.txt http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout: "surl: (2) User file broken.txt, line 2: expected <user:password>\n"

  - id: missing-file
    claim: A file that cannot be read stops the start with exit 37; surl does not create it.
    run: surl --user-file nowhere.txt http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 37
      stdout: "surl: (37) Could not read user file nowhere.txt\n"

  - id: user-in-both
    claim: A user name in the file that a --user already names stops the start with exit 2.
    run: surl --user alice:other --user-file accounts.txt http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout: "surl: (2) User file accounts.txt, line 2: user alice is given twice\n"
