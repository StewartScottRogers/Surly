schema: 2
key: http-sign-requests-with-aws-sigv4
title: Signing Requests with AWS SigV4
protocols: [http]
tier: secure-servers
surl-options: [--user, --auth, --directory, -v, --log-file]
curl-options: [--aws-sigv4, -u, --digest, -s, -o, -w, -D]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, aws-s3-api]

fixtures:
  site/hello.txt: "hello from surl\n"
  site2/hello.txt: "hello from surl\n"

# main takes SigV4 alone and logs every login; plain has the same account with --auth left out.
servers:
  main:
    command: surl -v --log-file surl.log --directory site --user AKIAEXAMPLE:topsecret --auth aws-sigv4 http://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --directory site2 --user AKIAEXAMPLE:topsecret http://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl signs the request with the access key ID and secret key, surl checks the signature, and the file is answered 200.
    run: curl -s --aws-sigv4 "aws:amz:us-east-1:s3" -u AKIAEXAMPLE:topsecret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: wrong-secret
    claim: A request signed with the wrong secret key is answered 403 Forbidden.
    run: curl -s -o {{null}} -w "%{http_code}\n" --aws-sigv4 "aws:amz:us-east-1:s3" -u AKIAEXAMPLE:wrong http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "403\n"

  - id: unknown-key
    claim: A request signed under an access key ID the server does not hold is answered 403 Forbidden, whatever secret signed it.
    run: curl -s -o {{null}} -w "%{http_code}\n" --aws-sigv4 "aws:amz:us-east-1:s3" -u NOBODY:topsecret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "403\n"

  - id: unsigned
    claim: A request with no signature is answered 403 Forbidden and carries no WWW-Authenticate challenge.
    run: curl -s -D - -o {{null}} http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^(?![\s\S]*WWW-Authenticate)HTTP/1.1 403 Forbidden\r?\n'

  - id: password-refused
    claim: With --auth aws-sigv4 alone, the right secret sent as a Basic password, or as a Digest login, is answered 403 too.
    run: curl -s -o {{null}} -w "%{http_code}\n" -u AKIAEXAMPLE:topsecret http://127.0.0.1:{{port}}/hello.txt --next -s -o {{null}} -w "%{http_code}\n" --digest -u AKIAEXAMPLE:topsecret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "403\n403\n"

  - id: any-scope
    claim: The region and service the client signs for are its own choice; a signature for eu-west-1 and ec2 is answered 200 too.
    run: curl -s -o {{null}} -w "%{http_code}\n" --aws-sigv4 "aws:amz:eu-west-1:ec2" -u AKIAEXAMPLE:topsecret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "200\n"

  - id: missing-file
    claim: A signed request for a file that is not there is answered 404, not 403, because the signature was accepted.
    run: curl -s -o {{null}} -w "%{http_code}\n" --aws-sigv4 "aws:amz:us-east-1:s3" -u AKIAEXAMPLE:topsecret http://127.0.0.1:{{port}}/missing.txt
    expect:
      exit: 0
      stdout: "404\n"

  - id: log-names-the-key
    claim: With -v, the log has a Login accepted line and a Login refused line, each naming the algorithm and the access key ID that signed.
    run: grep -E "Login (accepted|refused)" surl.log
    expect:
      exit: 0
      stdout-matches: '#\d+ \* Login accepted: AWS4-HMAC-SHA256 AKIAEXAMPLE\n(.*\n)*#\d+ \* Login refused: AWS4-HMAC-SHA256 (AKIAEXAMPLE|NOBODY)\n'

  - id: no-secret-in-the-log
    claim: Neither the secret key nor a wrong one appears anywhere in the log.
    run: grep -c -e topsecret -e wrong surl.log
    expect:
      exit: 1
      stdout: "0\n"

  - id: default-takes-sigv4
    claim: Without --auth, the same account also accepts the signed request, answered 200.
    run: curl -s -o {{null}} -w "%{http_code}\n" --aws-sigv4 "aws:amz:us-east-1:s3" -u AKIAEXAMPLE:topsecret http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "200\n"

  - id: default-wrong-secret
    claim: Without --auth, a wrong secret key is answered 401 with a Digest challenge instead of 403, because the server offers other logins.
    run: curl -s -D - -o {{null}} --aws-sigv4 "aws:amz:us-east-1:s3" -u AKIAEXAMPLE:wrong http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1.1 401 Unauthorized\r?\n(.*\r?\n)*WWW-Authenticate: Digest'
