# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-log-in-with-digest
title: Logging In with HTTP Digest
protocols: [http]
tier: secure-servers
surl-options: [--directory, --user]
curl-options: [-s, -f, --digest, --anyauth, -u, -v, -D, -o, -w]
exit-codes: [0, 22]
references: [surl-readme, rfc7616, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  main:
    command: surl --directory site --user alice:secret http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl --digest logs Alice in over plain http:// and prints hello.txt, exit 0.
    run: curl --digest -u alice:secret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: three-algorithms
    claim: Over http:// the 401 Unauthorized response offers Digest and no other method, three times, with the algorithms MD5, SHA-256 and SHA-512-256 in that order.
    run: curl -s -o {{null}} -D - http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 401 Unauthorized\r?\nDate: [^\r\n]+\r?\nServer: surl\r?\nContent-Length: 0\r?\nWWW-Authenticate: Digest realm="surl", qop="auth", algorithm=MD5, nonce="[0-9a-f]+"\r?\nWWW-Authenticate: Digest realm="surl", qop="auth", algorithm=SHA-256, nonce="[0-9a-f]+"\r?\nWWW-Authenticate: Digest realm="surl", qop="auth", algorithm=SHA-512-256, nonce="[0-9a-f]+"\r?\n\r?\n$'

  - id: curl-answers-md5
    claim: curl answers the first challenge, with algorithm=MD5, and sends a 32-digit hexadecimal response in place of the password. The order and spacing of the header's fields are the platform's (Windows builds it with SSPI), so the check reads the fields, not the layout.
    run: curl -s -v -o {{null}} --digest -u alice:secret http://127.0.0.1:{{port}}/hello.txt 2>&1
    expect:
      exit: 0
      stdout-matches: '> Authorization: Digest (?=[^\r\n]*\busername="alice")(?=[^\r\n]*\bnc=00000001)(?=[^\r\n]*\balgorithm=MD5\b)(?=[^\r\n]*\bresponse="[0-9a-f]{32}")'

  - id: wrong-password
    claim: A wrong password is answered 401 again, and curl exits 0.
    run: curl -s --digest -u alice:guess -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "401"

  - id: wrong-password-fail
    claim: With -f, curl exits 22 on that 401 instead.
    run: curl -f -s --digest -u alice:guess http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22

  - id: anyauth-picks-digest
    claim: curl --anyauth, which asks first and picks from what the server offers, logs in with Digest too.
    run: curl -s --anyauth -u alice:secret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: basic-refused
    claim: The same password sent with HTTP Basic over http:// is answered 403 Forbidden.
    run: curl -s -u alice:secret -o {{null}} -w "%{http_code}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "403"
