schema: 2
key: mqtts-log-in-over-tls-from-an-agent
title: Logging In over MQTTS from an Agent
protocols: [mqtts, mqtt]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl, read_retained_message]
exit-codes: [0]
references: [surl-readme, curl-readme, mqtt311]

fixtures: {}

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: Over mqtts the right password lets curl-mcp's curl tool publish, exit 0, and read_retained_message then answers the message the broker kept.
    program: log-in.cs
    args: ["mqtts", "s3cret"]
    expect:
      exit: 0
      stdout: "curl exit 0\nread_retained_message: {\"topic\":\"home/temp\",\"qos\":0,\"text\":\"21.5\"}\n"

  - id: wrong-password
    claim: A wrong password is refused with code 4, the curl tool exits 8 with Expected 0000 but got 0004, and the broker keeps nothing.
    program: log-in.cs
    args: ["mqtts", "wrong"]
    expect:
      exit: 0
      stdout: "curl exit 8 curl: (8) Expected 0000 but got 0004\nread_retained_message: {\"retained\":false}\n"

  - id: no-login
    claim: A connection with no user name is refused with code 5, a different answer from a wrong password, and the broker keeps nothing.
    program: log-in.cs
    args: ["mqtts", "none"]
    expect:
      exit: 0
      stdout: "curl exit 8 curl: (8) Expected 0000 but got 0005\nread_retained_message: {\"retained\":false}\n"

  - id: plain-refuses-the-password
    claim: Over plain mqtt the right password is refused with code 5, because surl will not take a password in the clear, and the broker keeps nothing.
    program: log-in.cs
    args: ["mqtt", "s3cret"]
    expect:
      exit: 0
      stdout: "curl exit 8 curl: (8) Expected 0000 but got 0005\nread_retained_message: {\"retained\":false}\n"
