schema: 2
key: https-serve-a-pfx-certificate-in-csharp
title: Serving a PFX Certificate in C#
protocols: [https]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlRequest, CurlResponse]
exit-codes: [0, 58]
references: [surl-readme, curl-readme, rfc5280]

fixtures: {}

# openssl stands in for the Windows export: server.pfx holds the certificate and its key under
# the passphrase s3cret; server.pem is the certificate alone, for the client to trust.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
  - openssl pkcs12 -export -out server.pfx -inkey server.key -in server.pem -passout pass:s3cret

cases:
  - id: solution
    role: solution
    claim: With the right passphrase SurlServer serves the PFX, and a CurlClient that trusts server.pem fetches hello.txt over HTTPS.
    program: program.cs
    args: ["s3cret"]
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: wrong-passphrase
    claim: With a wrong passphrase SurlServer.StartAsync throws SurlServerStartException, whose message is surl's (58) refusal that the file is not a P12 certificate surl can read.
    program: program.cs
    args: ["wrong"]
    expect:
      exit: 58
      stdout: "server refused to start: (58) Could not load the server certificate: 'server.pfx' is not a P12 certificate Surl can read.\n"
