# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 2
key: wss-log-in-over-tls
title: Logging In to a WebSocket over TLS
protocols: [wss, ws]
tier: secure-servers
surl-options: [--directory, --cert, --key, --user, --allow-plaintext-auth]
curl-options: [--cacert, -u, --oauth2-bearer, --digest, -s, -o, -w]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, rfc6455, rfc7617, rfc6750, rfc8446]

fixtures:
  site/hello.txt: "hello from surl\n"
  plain/hello.txt: "hello from surl\n"

# The certificate and its key are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main is the recipe: two accounts (alice, and a Bearer token held by an account with an
# empty user name) on wss, and the same accounts on plain ws beside it. plain checks
# passwords in clear; it is there only so the loosening is a checked claim.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --user alice:s3cret --user :tok123 wss://127.0.0.1:{{port}}/ ws://127.0.0.1:{{port2}}/
    ready: port
  plain:
    command: surl --directory plain --allow-plaintext-auth --user alice:s3cret ws://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Over wss, curl's Basic login as alice is checked and accepted, and hello.txt arrives as the one message, exit 0.
    run: curl --cacert server.pem -u alice:s3cret wss://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: no-login
    claim: With an account configured, an upgrade with no login is refused 401 Unauthorized, and curl exits 22.
    run: curl --cacert server.pem -s -o {{null}} -w "%{http_code}" wss://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: "401"

  - id: wrong-password
    claim: Over wss a wrong password is checked and refused 401, exit 22.
    run: curl --cacert server.pem -s -o {{null}} -w "%{http_code}" -u alice:wrong wss://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: "401"

  - id: bearer-over-wss
    claim: A Bearer token sent with --oauth2-bearer is checked over wss against the account with an empty user name, exit 0.
    run: curl --cacert server.pem --oauth2-bearer tok123 wss://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: digest-not-answered
    claim: --digest does not log in on an upgrade, because curl does not answer the 401 challenge, so it is refused 401, exit 22.
    run: curl --cacert server.pem --digest -u alice:s3cret -s -o {{null}} -w "%{http_code}" wss://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: "401"

  - id: right-password-in-clear
    claim: Over plain ws the right password is refused unchecked, 403 Forbidden, exit 22.
    run: curl -s -o {{null}} -w "%{http_code}" -u alice:s3cret ws://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 22
      stdout: "403"

  - id: wrong-password-in-clear
    claim: Over plain ws a wrong password gets the same 403, because neither is checked.
    run: curl -s -o {{null}} -w "%{http_code}" -u alice:wrong ws://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 22
      stdout: "403"

  - id: plaintext-auth-checks
    claim: Under --allow-plaintext-auth a Basic login over ws is checked instead, so the right password is accepted, exit 0.
    run: curl -u alice:s3cret ws://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: plaintext-auth-wrong
    claim: Under --allow-plaintext-auth a wrong password over ws is refused 401, exit 22.
    run: curl -s -o {{null}} -w "%{http_code}" -u alice:wrong ws://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 22
      stdout: "401"
