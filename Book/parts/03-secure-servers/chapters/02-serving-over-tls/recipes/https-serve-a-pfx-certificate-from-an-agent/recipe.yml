schema: 2
key: https-serve-a-pfx-certificate-from-an-agent
title: Serving a PFX Certificate from an Agent
protocols: [https]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, transfer]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc5280]

fixtures: {}

# openssl stands in for the Windows export: server.pfx holds the certificate and its key under
# the passphrase s3cret; server.pem is the certificate alone, for curl to trust.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
  - openssl pkcs12 -export -out server.pfx -inkey server.key -in server.pem -passout pass:s3cret

cases:
  - id: solution
    role: solution
    claim: An agent gives start_server --cert, --cert-type P12 and --pass in arguments, and curl-mcp's transfer tool, trusting server.pem through caFile, fetches the file over HTTPS with status 200.
    program: serve-pfx.cs
    args: ["s3cret"]
    expect:
      exit: 0
      stdout: "statusCode: 200\nhello from surl\n"

  - id: wrong-passphrase
    claim: With a wrong passphrase start_server is a tool error carrying surl's exit code 58, CertificateProblem, and surl's message that the --pass given does not open the P12 file.
    program: serve-pfx.cs
    args: ["wrong"]
    expect:
      exit: 1
      stdout-matches: "^exit_code: 58 \\(CertificateProblem\\)\\n.*'server\\.pfx' is a P12 file the --pass given does not open"
