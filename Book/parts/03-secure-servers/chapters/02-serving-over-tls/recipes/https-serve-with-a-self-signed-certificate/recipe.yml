# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 1
key: https-serve-with-a-self-signed-certificate
title: Serving HTTPS with a Self-Signed Certificate
protocols: [https]
tier: secure-servers
surl-options: [--directory, --self-signed, --cert]
curl-options: [-k, -s, -o, -w, --http1.1]
exit-codes: [0, 2, 58, 60]
references: [surl-readme, curl-readme, rfc8446, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  main:
    command: surl --directory site --self-signed https://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --self-signed, surl serves the directory over HTTPS, and curl -k fetches hello.txt over it, exit 0.
    run: curl -k https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: unverified-refused
    claim: Without -k, curl cannot verify the throwaway certificate, refuses the connection, prints nothing and exits 60.
    run: curl https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stdout: ""
      stderr-contains: "curl: (60)"

  - id: http2-over-tls
    claim: Over TLS, curl and surl agree on HTTP/2 during the handshake with no option asking for it.
    run: curl -k -s -o {{null}} -w "%{http_version}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "2"

  - id: http1-on-request
    claim: With --http1.1, curl offers only HTTP/1.1 in the handshake and surl answers in it.
    run: curl -k --http1.1 -s -o {{null}} -w "%{http_version}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "1.1"

  - id: no-certificate-refused
    claim: Without --self-signed and without --cert, an https listen URL is refused at start with exit 58, naming both ways to give a certificate.
    run: surl --directory site https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout: "surl: (58) https://127.0.0.1:0/ needs a certificate: give --cert <file>, or --self-signed for a throwaway one\n"

  - id: not-with-cert
    claim: --self-signed together with --cert is refused as an option badly used, exit 2, before any file is read.
    run: surl --self-signed --cert server.pem https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: option --self-signed: cannot be used with --cert\n'
