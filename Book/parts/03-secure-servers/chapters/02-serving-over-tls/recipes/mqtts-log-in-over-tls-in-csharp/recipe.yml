schema: 2
key: mqtts-log-in-over-tls-in-csharp
title: Logging In over MQTTS in C#
protocols: [mqtts, mqtt]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlRetainedMessage, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlAuthenticationOptions, CurlRequest, CurlContent, CurlException]
exit-codes: [0, 8]
references: [surl-readme, curl-readme, mqtt311]

fixtures: {}

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: Over mqtts the right password publishes the message, and the server holds it as the retained message of home/temp, with no loosening option.
    program: program.cs
    args: ["mqtts", "s3cret"]
    expect:
      exit: 0
      stdout: "home/temp = 21.5\n"

  - id: wrong-password
    claim: A wrong password makes SendAsync throw CurlException with code 8 and the message that it got 0004, bad user name or password.
    program: program.cs
    args: ["mqtts", "wrong"]
    expect:
      exit: 8
      stdout: "refused: curl code 8 WeirdServerReply: Expected 0000 but got 0004\n"

  - id: no-login
    claim: A connection with no user name is a different refusal from a wrong password, 0005, not authorized.
    program: program.cs
    args: ["mqtts", "none"]
    expect:
      exit: 8
      stdout: "refused: curl code 8 WeirdServerReply: Expected 0000 but got 0005\n"

  - id: plain-refuses-the-password
    claim: Over plain mqtt the right password is refused as not authorized, 0005, because surl will not take a password in the clear.
    program: program.cs
    args: ["mqtt", "s3cret"]
    expect:
      exit: 8
      stdout: "refused: curl code 8 WeirdServerReply: Expected 0000 but got 0005\n"
