# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: https-require-a-client-certificate
title: Requiring a Client Certificate
protocols: [https]
tier: secure-servers
surl-options: [--directory, --log-file, --cert, --key, --cacert]
curl-options: [-s, -S, --cacert, --cert, --cert-type, --key]
exit-codes: [0, 2, 58, 77]
references: [surl-readme, curl-manual, rfc8446, rfc5280]

fixtures:
  site/hello.txt: "hello from surl\n"
  open/hello.txt: "hello from surl\n"
  notes.txt: "not a certificate\n"

# The test authority (ca.pem) signs the device's certificate; another authority signs a stranger's.
# server.pem is the server's own self-signed certificate, which the client trusts with --cacert.
# Each client certificate is also packed with its key into a PFX (P12) file under the passphrase s3cret.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 30 -subj "/CN=Test Device CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign"
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout other-ca.key -out other-ca.pem -days 30 -subj "/CN=Other Device CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign"
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
  - openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj "/CN=device-1"
  - openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 30
  - openssl req -newkey rsa:2048 -nodes -keyout stranger.key -out stranger.csr -subj "/CN=device-1"
  - openssl x509 -req -in stranger.csr -CA other-ca.pem -CAkey other-ca.key -CAcreateserial -out stranger.pem -days 30
  - openssl pkcs12 -export -in client.pem -inkey client.key -out client.p12 -passout pass:s3cret
  - openssl pkcs12 -export -in stranger.pem -inkey stranger.key -out stranger.p12 -passout pass:s3cret

servers:
  # --cacert names the authority a client certificate must come from; it is what makes one required.
  main:
    command: surl --directory site --log-file tls.log --cert server.pem --key server.key --cacert ca.pem https://127.0.0.1:{{port}}/
    ready: port
  # The same server without --cacert, for contrast.
  open:
    command: surl --directory open --cert server.pem --key server.key https://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A client that presents the certificate the test authority signed, from a P12 file with its passphrase, completes the handshake and fetches the file.
    run: curl -sS --cacert server.pem --cert client.p12:s3cret --cert-type P12 https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: no-certificate
    claim: A client that presents no certificate is refused in the handshake and gets no answer; curl exits nonzero, with a code that depends on the TLS version and platform, so the check is that it failed.
    run: curl -sS --cacert server.pem https://127.0.0.1:{{port}}/hello.txt || echo refused
    expect:
      exit: 0
      stdout: "refused\n"

  - id: other-authority
    claim: A client certificate signed by another authority, with the same subject name, is refused the same way.
    run: curl -sS --cacert server.pem --cert stranger.p12:s3cret --cert-type P12 https://127.0.0.1:{{port}}/hello.txt || echo refused
    expect:
      exit: 0
      stdout: "refused\n"

  - id: server-log
    claim: The server's log names both refusals as a rejected remote certificate, and the request was never read.
    run: 'grep -c "TLS handshake failed: The remote certificate was rejected" tls.log'
    expect:
      exit: 0
      stdout: "2\n"

  - id: without-cacert
    claim: Without --cacert the server asks for no certificate, and the same client with none fetches the file.
    run: curl -sS --cacert server.pem https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: pem-on-windows
    platforms: [windows]
    claim: On Windows curl reads a client certificate from a P12 file only, as the Schannel build does; a PEM certificate and key are refused before any request, exit 58.
    run: curl -sS --cacert server.pem --cert client.pem --key client.key https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 58
      stderr-contains: "Failed to import cert file client.pem"

  - id: pem-elsewhere
    platforms: [linux, macos]
    claim: On Linux and macOS curl, as the OpenSSL build, also reads the PEM certificate and its key, and the fetch succeeds.
    run: curl -sS --cacert server.pem --cert client.pem --key client.key https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: cacert-missing
    claim: A --cacert file that does not exist is refused at start, exit 2.
    run: surl --cacert missing.pem --cert server.pem --key server.key https://127.0.0.1:{{port3}}/
    expect:
      exit: 2
      stderr-contains: "The file 'missing.pem' provided to --cacert does not exist"

  - id: cacert-unreadable
    claim: A --cacert file that holds no certificate is refused at start, exit 77.
    run: surl --cacert notes.txt --cert server.pem --key server.key https://127.0.0.1:{{port3}}/
    expect:
      exit: 77
      stderr-contains: "The --cacert file 'notes.txt' holds no certificate Surl can read."
