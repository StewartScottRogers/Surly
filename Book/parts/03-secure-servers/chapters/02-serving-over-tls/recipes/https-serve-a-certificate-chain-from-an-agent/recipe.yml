# Each case runs chain.cs, a C# program on the official MCP SDK that starts surl-mcp and curl-mcp
# from PATH; its argument picks the scenario.
schema: 2
key: https-serve-a-certificate-chain-from-an-agent
title: Serving a Certificate Chain from an Agent
protocols: [https]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc5280]

fixtures: {}

# A root authority, an intermediate it signed, and a leaf the intermediate signed for 127.0.0.1.
# chain.pem is the leaf first, then the intermediate; the clients below trust the root alone.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout root.key -out root.pem -days 30 -subj "/CN=Test Root" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
  - openssl req -newkey rsa:2048 -nodes -keyout inter.key -out inter.csr -subj "/CN=Test Intermediate"
  - printf "basicConstraints=critical,CA:TRUE,pathlen:0\nkeyUsage=critical,keyCertSign,cRLSign\n" > inter.ext
  - openssl x509 -req -in inter.csr -CA root.pem -CAkey root.key -CAcreateserial -out inter.pem -days 30 -extfile inter.ext
  - openssl req -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj "/CN=127.0.0.1"
  - printf "subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\n" > leaf.ext
  - openssl x509 -req -in leaf.csr -CA inter.pem -CAkey inter.key -CAcreateserial -out leaf.pem -days 30 -extfile leaf.ext
  - cat leaf.pem inter.pem > chain.pem
  - openssl req -newkey rsa:2048 -nodes -keyout inter2.key -out inter2.csr -subj "/CN=Other Intermediate"
  - openssl x509 -req -in inter2.csr -CA root.pem -CAkey root.key -CAcreateserial -out inter2.pem -days 30 -extfile inter.ext
  - openssl req -newkey rsa:2048 -nodes -keyout leaf2.key -out leaf2.csr -subj "/CN=127.0.0.1"
  - openssl x509 -req -in leaf2.csr -CA inter2.pem -CAkey inter2.key -CAcreateserial -out leaf2.pem -days 30 -extfile leaf.ext
  - cat inter.pem leaf.pem > reversed.pem
  - cat leaf.pem inter.pem root.pem > full.pem

cases:
  - id: solution
    role: solution
    claim: "An agent starts an HTTPS server from the chain file with start_server, and curl-mcp's curl tool, trusting only the root with --cacert, fetches the file: exit code 0, not a tool error."
    program: chain.cs
    args: ["fetch"]
    expect:
      exit: 0
      stdout: "exit code: 0\nhello from surl\ntool error: no\n"

  - id: leaf-only-caught
    claim: "The same client against a server that sends the leaf alone cannot build the path to the root: curl exits 60 and the call is a tool error."
    program: chain.cs
    args: ["leaf-only"]
    expect:
      exit: 0
      stdout: "exit code: 60\ntool error: yes\n"

  - id: no-trust
    claim: "A client that trusts neither the root nor the intermediate exits 60 too, even against the full chain."
    program: chain.cs
    args: ["no-trust"]
    expect:
      exit: 0
      stdout: "exit code: 60\ntool error: yes\n"

  - id: root-in-the-file
    claim: "A chain file that also ends with the root is served and verified the same way: exit code 0."
    program: chain.cs
    args: ["root-in-the-file"]
    expect:
      exit: 0
      stdout: "exit code: 0\nhello from surl\ntool error: no\n"

  - id: leaf-must-come-first
    claim: "A chain file that starts with the intermediate stops start_server with a tool error whose exit_code is 58, CertificateProblem, and whose text says the server certificate could not be loaded."
    program: chain.cs
    args: ["leaf-first"]
    expect:
      exit: 0
      stdout: "start refused: 58 (CertificateProblem)\nTrue\n"

  - id: key-must-match
    claim: "The intermediate's key does not match the leaf at the head of chain.pem, so that start is refused with 58, CertificateProblem, too."
    program: chain.cs
    args: ["key-match"]
    expect:
      exit: 0
      stdout: "start refused: 58 (CertificateProblem)\nTrue\n"

