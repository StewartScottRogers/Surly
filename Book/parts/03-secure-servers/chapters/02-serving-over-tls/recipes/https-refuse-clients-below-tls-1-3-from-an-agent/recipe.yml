schema: 2
key: https-refuse-clients-below-tls-1-3-from-an-agent
title: Requiring TLS 1.3 from an Agent
protocols: [https]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, curl]
exit-codes: [0, 2]
references: [surl-readme, curl-readme, rfc8446]

fixtures: {}

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: An agent starts a server with --tlsv1.3 through start_server's arguments; curl-mcp's curl tool run with --tls-max 1.2 exits 35 with no output, and run with --tlsv1.3 exits 0 and prints the file.
    platforms: [windows, linux]
    program: require-tls-13.cs
    args: ["1.3"]
    expect:
      exit: 0
      stdout: "TLS 1.2 client: exitCode 35\nTLS 1.3 client: exitCode 0 hello from surl\n"

  - id: default-range-takes-1-2
    claim: Without --tlsv1.3 the same server answers the TLS 1.2 client too, exit 0.
    platforms: [windows, linux]
    program: require-tls-13.cs
    args: ["1.2"]
    expect:
      exit: 0
      stdout: "TLS 1.2 client: exitCode 0 hello from surl\nTLS 1.3 client: exitCode 0 hello from surl\n"

  - id: empty-range
    claim: --tlsv1.3 together with --tls-max 1.2 in arguments makes start_server a tool error carrying surl's refusal, and the program exits 2.
    program: require-tls-13.cs
    args: ["empty"]
    expect:
      exit: 2
      stdout-matches: '^start_server refused: .*--tls-max.*badly used'

  - id: no-tls-1-3-on-macos
    claim: On macOS surl serves no TLS 1.3 at all, since the system TLS library it uses there has no TLS 1.3 server; even without the TLS 1.3 option the client that wants TLS 1.3 is refused, exit 35.
    platforms: [macos]
    program: require-tls-13.cs
    args: ["1.2"]
    expect:
      exit: 0
      stdout: "TLS 1.2 client: exitCode 0 hello from surl\nTLS 1.3 client: exitCode 35\n"
