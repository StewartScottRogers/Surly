schema: 2
key: https-serve-a-certificate-chain
title: Serving a Certificate Chain
protocols: [https]
tier: secure-servers
surl-options: [--cert, --key, --directory]
curl-options: [--cacert, --ssl-no-revoke, -s]
exit-codes: [0, 58, 60]
references: [surl-readme, curl-readme, rfc5280]

fixtures:
  site/hello.txt: "hello from surl\n"
  site2/hello.txt: "hello from surl\n"
  site3/hello.txt: "hello from surl\n"

# A root authority, an intermediate it signed, and a leaf the intermediate signed for 127.0.0.1.
# chain.pem is the leaf first, then the intermediate; the clients below trust the root alone.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout root.key -out root.pem -days 30 -subj "/CN=Test Root" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
  - openssl req -newkey rsa:2048 -nodes -keyout inter.key -out inter.csr -subj "/CN=Test Intermediate"
  - printf "basicConstraints=critical,CA:TRUE,pathlen:0\nkeyUsage=critical,keyCertSign,cRLSign\n" > inter.ext
  - openssl x509 -req -in inter.csr -CA root.pem -CAkey root.key -CAcreateserial -out inter.pem -days 30 -extfile inter.ext
  - openssl req -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj "/CN=127.0.0.1"
  - printf "subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\n" > leaf.ext
  - openssl x509 -req -in leaf.csr -CA inter.pem -CAkey inter.key -CAcreateserial -out leaf.pem -days 30 -extfile leaf.ext
  - cat leaf.pem inter.pem > chain.pem
  - openssl req -newkey rsa:2048 -nodes -keyout inter2.key -out inter2.csr -subj "/CN=Other Intermediate"
  - openssl x509 -req -in inter2.csr -CA root.pem -CAkey root.key -CAcreateserial -out inter2.pem -days 30 -extfile inter.ext
  - openssl req -newkey rsa:2048 -nodes -keyout leaf2.key -out leaf2.csr -subj "/CN=127.0.0.1"
  - openssl x509 -req -in leaf2.csr -CA inter2.pem -CAkey inter2.key -CAcreateserial -out leaf2.pem -days 30 -extfile leaf.ext
  - cat inter.pem leaf.pem > reversed.pem
  - cat leaf.pem inter.pem root.pem > full.pem

# main sends leaf and intermediate; full also appends the root. leafonly sends the leaf of a second
# intermediate alone: Windows keeps the intermediates it has seen, so the one main sends must not be reused.
servers:
  main:
    command: surl --directory site --cert chain.pem --key leaf.key https://127.0.0.1:{{port}}/
    ready: port
  leafonly:
    command: surl --directory site2 --cert leaf2.pem --key leaf2.key https://127.0.0.1:{{port2}}/
    ready: port
  full:
    command: surl --directory site3 --cert full.pem --key leaf.key https://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A client that trusts only the root fetches the file from the server that sends the chain, exit 0.
    run: curl -s --ssl-no-revoke --cacert root.pem https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: leaf-only-caught
    claim: The same client against a server that sends the leaf alone cannot build the path to the root, and exits 60.
    run: curl -s --ssl-no-revoke --cacert root.pem https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 60
      stdout: ""

  - id: no-trust
    claim: A client that trusts neither the root nor the intermediate exits 60 even against the full chain.
    run: curl -s --ssl-no-revoke https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stdout: ""

  - id: root-in-the-file
    claim: A chain file that also ends with the root is served and verified the same way, exit 0.
    run: curl -s --ssl-no-revoke --cacert root.pem https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: leaf-must-come-first
    claim: A chain file that starts with the intermediate is refused at start, exit 58, because the key does not match the first certificate.
    run: surl --cert reversed.pem --key leaf.key https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout-matches: '^surl: \(58\) Could not load the server certificate: '

  - id: key-must-match
    claim: The intermediate's key does not match the leaf at the head of chain.pem, so that start is refused with exit 58 too.
    run: surl --cert chain.pem --key inter.key https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout-matches: '^surl: \(58\) Could not load the server certificate: '
