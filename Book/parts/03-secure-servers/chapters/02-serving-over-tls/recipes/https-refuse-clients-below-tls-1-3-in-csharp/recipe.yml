schema: 2
key: https-refuse-clients-below-tls-1-3-in-csharp
title: Requiring TLS 1.3 in C#
protocols: [https]
tier: secure-servers
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, SslVersion, SslVersionMaximum, CurlRequest, CurlResponse, CurlException]
exit-codes: [0, 2]
references: [surl-readme, curl-readme, rfc8446]

fixtures: {}

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: A server asked for TLS 1.3 only refuses the client capped at TLS 1.2, which gets a CurlException with code 35, and answers the client that wants TLS 1.3.
    program: program.cs
    args: ["1.3"]
    expect:
      exit: 0
      stdout: "TLS 1.2 client: refused, curl code 35 SslConnectError\nTLS 1.3 client: 200 hello from surl\n"

  - id: default-range-takes-1-2
    claim: Without the TLS 1.3 option the same server serves both clients, the one capped at TLS 1.2 included.
    program: program.cs
    args: ["1.2"]
    expect:
      exit: 0
      stdout: "TLS 1.2 client: 200 hello from surl\nTLS 1.3 client: 200 hello from surl\n"

  - id: empty-range
    claim: Asking for nothing below TLS 1.3 and nothing above TLS 1.2 makes SurlServer.StartAsync throw SurlServerStartException, and the program exits 2.
    program: program.cs
    args: ["empty"]
    expect:
      exit: 2
      stdout-matches: '^server refused to start: option --tls-max: is badly used here\n'
