schema: 2
key: https-refuse-clients-below-tls-1-3
title: Refusing Clients below TLS 1.3
protocols: [https]
tier: secure-servers
surl-options: [--cert, --key, --tlsv1.3, --tls-max]
curl-options: [--cacert, --tlsv1.3, --tls-max]
exit-codes: [0, 2, 35]
references: [surl-readme, curl-readme, rfc8446]

fixtures:
  site/hello.txt: "hello from surl\n"
  site2/hello.txt: "hello from surl\n"
  site3/hello.txt: "hello from surl\n"

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main: TLS 1.3 only. usual: surl's defaults (1.2 and 1.3). capped: nothing above TLS 1.2.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --tlsv1.3 https://127.0.0.1:{{port}}/
    ready: port
  usual:
    command: surl --directory site2 --cert server.pem --key server.key https://127.0.0.1:{{port2}}/
    ready: port
  capped:
    command: surl --directory site3 --cert server.pem --key server.key --tls-max 1.2 https://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Against a server started with --tlsv1.3, a client that asks for TLS 1.3 or later with --tlsv1.3 and trusts the certificate fetches hello.txt, exit 0.
    run: curl --tlsv1.3 --cacert server.pem https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: old-client-refused
    claim: A client limited to TLS 1.2 with --tls-max 1.2 is refused by the --tlsv1.3 server, prints nothing and exits 35.
    run: curl --tls-max 1.2 --cacert server.pem https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 35
      stdout: ""
      stderr-contains: "curl: (35)"

  - id: default-client-negotiates-1-3
    claim: A curl with no version option still gets through the --tlsv1.3 server, because it offers TLS 1.3 as well as older versions.
    run: curl --cacert server.pem https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: refusal-leaves-server-running
    claim: After it has refused the TLS 1.2 client the server is still up and answers the next TLS 1.3 client.
    run: curl --tlsv1.3 --cacert server.pem https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: default-server-takes-1-2
    claim: Without --tlsv1.3, surl accepts the same TLS 1.2 client, exit 0.
    run: curl --tls-max 1.2 --cacert server.pem https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: capped-server-refuses-1-3-only-client
    claim: With --tls-max 1.2 the limit also works from above, so a client that insists on TLS 1.3 with --tlsv1.3 is refused, exit 35.
    run: curl --tlsv1.3 --cacert server.pem https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 35
      stdout: ""
      stderr-contains: "curl: (35)"

  - id: capped-server-takes-1-2
    claim: The --tls-max 1.2 server still serves a client that accepts TLS 1.2.
    run: curl --tls-max 1.2 --cacert server.pem https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: empty-range
    claim: A lowest version above the highest, --tlsv1.3 with --tls-max 1.2, is refused at start as an option badly used, exit 2.
    run: surl --cert server.pem --key server.key --tlsv1.3 --tls-max 1.2 https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: option --tls-max: is badly used here\n'
