# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs accounts.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-add-an-account-from-an-agent
title: Adding and Removing an Account from an Agent
protocols: [http]
tier: secure-servers
surface: mcp
mcp-tools: [start_server, add_account, remove_account, curl]
curl-options: [-s, -w, -u, --digest]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110, rfc7616, rfc7617]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: On a running server that has the account alice, bob's Digest login is refused 401 until add_account gives bob an account, then fetches the file, 200; after remove_account takes it away, the same login is 401 again.
    program: accounts.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "bob before add_account: 401 401 Unauthorized (curl exit 0)\nadd_account bob: bob\nbob after add_account: 200 hello from surl (curl exit 0)\nremove_account bob: bob\nbob after remove_account: 401 401 Unauthorized (curl exit 0)\n"

  - id: wrong-password
    claim: An added account is checked like one given at start; bob with a wrong password is 401.
    program: accounts.cs
    args: [wrong-password]
    expect:
      exit: 0
      stdout: "add_account bob: bob\nbob, wrong password: 401 401 Unauthorized (curl exit 0)\n"

  - id: no-overwrite
    claim: add_account for a user who already has an account is a tool error, user bob already has an account, and bob's first password still logs in.
    program: accounts.cs
    args: [no-overwrite]
    expect:
      exit: 0
      stdout: "add_account bob: bob\nadd_account bob: error: user bob already has an account\nbob, first password: 200 hello from surl (curl exit 0)\n"

  - id: change-password
    claim: To change a password, remove_account and then add_account with the new one; the new password logs in.
    program: accounts.cs
    args: [change-password]
    expect:
      exit: 0
      stdout: "add_account bob: bob\nremove_account bob: bob\nadd_account bob: bob\nbob, new password: 200 hello from surl (curl exit 0)\n"

  - id: no-colon
    claim: A user name holding a colon is a tool error, since --user could not spell it.
    program: accounts.cs
    args: [no-colon]
    expect:
      exit: 0
      stdout: "add_account carol:x: error: user: a user name may not hold ':'\n"

  - id: basic-in-clear
    claim: The same account with -u and no --digest sends Basic, a password in clear over plain HTTP, and the server answers 403.
    program: accounts.cs
    args: [basic-in-clear]
    expect:
      exit: 0
      stdout: "add_account bob: bob\nbob, Basic: 403 403 Forbidden (curl exit 0)\n"

  - id: no-such-account
    claim: remove_account for a user with no account, or on a server ID that is not running, is a tool error that says which.
    program: accounts.cs
    args: [no-such-account]
    expect:
      exit: 0
      stdout: "add_account bob: bob\nremove_account bob: bob\nremove_account bob: error: server s1 has no account bob\nremove_account alice: error: no running server has ID s99\n"

  - id: last-account-keeps-the-server-closed
    claim: remove_account also removes an account given at start, and when it removes the last one the server still asks for a login, 401 with none.
    program: accounts.cs
    args: [last-account]
    expect:
      exit: 0
      stdout: "remove_account alice: alice\nno login: 401 401 Unauthorized (curl exit 0)\n"

  - id: first-account-closes
    claim: add_account on a server with no accounts closes it; a request with no login is 401 from then on, and the new account's login fetches the file.
    program: accounts.cs
    args: [first-account]
    expect:
      exit: 0
      stdout: "remove_account alice: alice\nadd_account carol: carol\nno login: 401 401 Unauthorized (curl exit 0)\ncarol: 200 hello from surl (curl exit 0)\n"
