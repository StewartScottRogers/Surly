# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: https-run-an-https-proxy
title: Running an HTTPS Proxy
protocols: [https, http]
tier: advanced
surl-options: [--directory, --cert, --key, --proxy, -v, --log-file]
curl-options: [-x, --proxy-cacert, --cacert, --proxy-insecure, -k, -s, -S]
exit-codes: [0, 58, 60]
references: [rfc9110, rfc8446, surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"

# Two certificates for 127.0.0.1, each signed by its own key, good for 30 days; never committed.
# proxy.pem is the proxy's, origin.pem the origin's.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout proxy.key -out proxy.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout origin.key -out origin.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

servers:
  # The origin: plain HTTP on 8080 and HTTPS on 8081, with its own certificate.
  origin:
    command: surl --directory site http://127.0.0.1:{{port}}/ https://127.0.0.1:{{port2}}/ --cert origin.pem --key origin.key
    ready: port
  # The proxy, over TLS on 8082 with the proxy's certificate, logging every event to proxy.log.
  proxy:
    command: surl --proxy https://127.0.0.1:{{port3}}/ --cert proxy.pem --key proxy.key -v --log-file proxy.log
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -x https:// talks to the proxy over TLS, trusts the proxy's certificate with --proxy-cacert, and gets the http:// origin's file through it.
    run: curl -sS --proxy-cacert proxy.pem -x https://127.0.0.1:{{port3}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: untrusted-proxy
    claim: Without --proxy-cacert curl does not trust the proxy's certificate and exits 60 before any request is sent.
    run: curl -sS -x https://127.0.0.1:{{port3}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stderr-contains: "curl: (60)"

  - id: cacert-is-the-origins
    claim: --cacert names the origin's authority, not the proxy's; given the proxy's certificate it does not make the proxy trusted, exit 60.
    run: curl -sS --cacert proxy.pem -x https://127.0.0.1:{{port3}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stderr-contains: "curl: (60)"

  - id: proxy-sees-the-request
    claim: Over an https proxy with an http:// origin the proxy decrypts and forwards the request; its log says it forwarded GET and the origin answered 200.
    run: grep -m1 "Forwarded GET" proxy.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Forwarded GET to 127\.0\.0\.1:\d+; the origin answered 200\.\n$'

  - id: two-certificates
    claim: An https:// origin through the https proxy is two TLS sessions, one inside the other; --proxy-cacert trusts the proxy and --cacert the origin, and the file comes back.
    run: curl -sS --proxy-cacert proxy.pem --cacert origin.pem -x https://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: swapped
    claim: The two options are not interchangeable; with the certificates swapped curl trusts neither peer and exits 60.
    run: curl -sS --proxy-cacert origin.pem --cacert proxy.pem -x https://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 60
      stderr-contains: "curl: (60)"

  - id: k-is-the-origins
    claim: -k skips only the origin's check; the proxy's certificate is still checked and curl exits 60.
    run: curl -sS -k -x https://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 60
      stderr-contains: "curl: (60)"

  - id: proxy-insecure
    claim: --proxy-insecure skips the proxy's check, the loosening that matches -k for the proxy, and with the origin trusted the file comes back.
    run: curl -sS --proxy-insecure --cacert origin.pem -x https://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: proxy-needs-a-certificate
    claim: surl refuses to start an https proxy listener with no certificate, exit 58, naming --cert and --self-signed.
    run: surl --proxy https://127.0.0.1:{{port4}}/
    expect:
      exit: 58
      stderr-contains: "needs a certificate: give --cert <file>, or --self-signed for a throwaway one"
