# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs tunnel.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: https-tunnel-through-a-proxy-from-an-agent
title: Tunnelling through a Proxy from an Agent
protocols: [https, http]
tier: advanced
surface: mcp
mcp-tools: [start_server, transfer, get_exchanges, curl]
surl-options: [--proxy, --cert, --key, --fault]
curl-options: [-s, -x, --cacert, --proxy-cacert]
exit-codes: [0]
references: [rfc9110, rfc8446, rfc9113, surl-readme, curl-readme]

fixtures: {}

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: transfer with proxy and caFile fetches the https:// origin's file through the http proxy in a CONNECT tunnel, 200.
    program: tunnel.cs
    args: [fetch]
    expect:
      exit: 0
      stdout-matches: '^statusCode: 200, hello from surl\n'

  - id: proxy-received-connect
    claim: get_exchanges shows the proxy's exchange starting with the CONNECT it received, naming the origin's address and port, and its answer, 200 Connection established.
    program: tunnel.cs
    args: [fetch]
    expect:
      exit: 0
      stdout-matches: '\nproxy \(http\) received: CONNECT 127\.0\.0\.1:\d+ HTTP/1\.1 \| sent: HTTP/1\.1 200 Connection established \| '

  - id: proxy-never-sees-the-request
    claim: After the CONNECT every chunk the proxy relayed is base64, TLS records, and none holds the GET /hello.txt in clear.
    program: tunnel.cs
    args: [fetch]
    expect:
      exit: 0
      stdout-matches: 'proxy \(http\) received: [^\n]*GET /hello\.txt in clear: no\nproxy chunks after the CONNECT: (\d+) of \1 in base64\n'

  - id: origin-speaks-with-the-client
    claim: The origin's exchange is https, and what it received, decrypted, starts with the HTTP/2 preface PRI * HTTP/2.0, which client and origin agreed on through the tunnel.
    program: tunnel.cs
    args: [fetch]
    expect:
      exit: 0
      stdout-matches: '\norigin \(https\) received: PRI \* HTTP/2\.0 \| '

  - id: certificate-checked-end-to-end
    claim: Without caFile the tunnel opens but the client does not trust the origin, so transfer fails with exitCode 60, PeerFailedVerification, a tool error.
    program: tunnel.cs
    args: [untrusted]
    expect:
      exit: 0
      stdout: "failure: exitCode 60, curl exit code 60 (PeerFailedVerification), tool error: yes\n"

  - id: https-proxy
    claim: transfer's caFile trusts only the origin, so through the https proxy it fails with exitCode 60; the curl tool with --proxy-cacert for the proxy and --cacert for the origin gets the file, TLS inside TLS.
    program: tunnel.cs
    args: [https-proxy]
    expect:
      exit: 0
      stdout: "failure: exitCode 60, curl exit code 60 (PeerFailedVerification), tool error: yes\ncurl tool: exitCode 0, hello from surl\n"

  - id: tunnel-refused
    claim: A --fault rule in arguments that answers CONNECT with 503 opens no tunnel, and transfer fails with exitCode 7, CouldntConnect.
    program: tunnel.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "failure: exitCode 7, curl exit code 7 (CouldntConnect), tool error: yes\n"
