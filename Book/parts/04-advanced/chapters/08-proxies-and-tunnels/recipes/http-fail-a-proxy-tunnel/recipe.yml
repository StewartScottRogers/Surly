# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: http-fail-a-proxy-tunnel
title: Failing a Proxy Tunnel
protocols: [http, https]
tier: advanced
surl-options: [--directory, --cert, --key, --proxy, --fault, -v, --log-file]
curl-options: [-x, -p, --cacert, -s, -S, -v, -o, -w]
exit-codes: [0, 1, 7]
references: [rfc9110, surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

servers:
  # The origin: plain HTTP on 8080, HTTPS on 8081, and a path that answers 503 itself.
  origin:
    command: surl --directory site http://127.0.0.1:{{port}}/ https://127.0.0.1:{{port2}}/ --cert server.pem --key server.key --fault "error;scheme=http;reply=503;path=/busy.txt" -v --log-file origin.log
    ready: port
  # The proxy on 8082: it forwards plain requests and answers every CONNECT with 503.
  proxy:
    command: surl --proxy http://127.0.0.1:{{port3}}/ --fault "error;scheme=http-proxy;command=CONNECT;reply=503" -v --log-file proxy.log
    ready: port

cases:
  - id: solution
    role: solution
    claim: An https:// URL through the proxy needs a CONNECT tunnel; the proxy answers 503, and curl exits 7 with CONNECT tunnel failed, response 503.
    run: curl -sS --cacert server.pem -x http://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 7
      stderr-contains: "curl: (7) CONNECT tunnel failed, response 503"

  - id: forwarding-still-works
    claim: An http:// URL through the same proxy is forwarded, not tunnelled, and comes back 200 with the file.
    run: curl -sS -x http://127.0.0.1:{{port3}}/ -w "%{http_code}\n" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n200\n"

  - id: proxy-answered-not-origin
    claim: '%{http_connect} is the proxy''s answer to the CONNECT, 503, and %{http_code} the origin''s, 000, since no request reached the origin.'
    run: curl -s --cacert server.pem -o {{null}} -w "%{http_connect} %{http_code}\n" -x http://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 7
      stdout: "503 000\n"

  - id: origin-503-reads-differently
    claim: A 503 from the origin itself, forwarded by the proxy, reads the other way round, 000 503, and curl exits 0.
    run: curl -s -o {{null}} -w "%{http_connect} %{http_code}\n" -x http://127.0.0.1:{{port3}}/ http://127.0.0.1:{{port}}/busy.txt
    expect:
      exit: 0
      stdout: "000 503\n"

  - id: verbose-shows-the-proxys-answer
    claim: curl -v shows the CONNECT it sent and the proxy's 503 Service Unavailable before anything else.
    run: curl -sv --cacert server.pem -o {{null}} -x http://127.0.0.1:{{port3}}/ https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 7
      stderr-contains: "< HTTP/1.1 503 Service Unavailable"

  - id: forced-tunnel-fails-too
    claim: With -p curl tunnels an http:// URL as well, and the same proxy refuses it the same way, exit 7.
    run: curl -sS -p -x http://127.0.0.1:{{port3}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 7
      stderr-contains: "curl: (7) CONNECT tunnel failed, response 503"

  - id: proxy-log-names-the-rule
    claim: The proxy's log says it answered the CONNECT 503 by fault rule f1, naming the origin's address and port.
    run: grep -m1 "by fault rule f1" proxy.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* CONNECT 127\.0\.0\.1:\d+: answered 503 Service Unavailable by fault rule f1\.\n$'

  - id: origin-never-reached
    claim: The origin's log holds no completed TLS handshake, since no tunnel ever reached it; grep counts 0 and exits 1.
    run: grep -c "TLS handshake completed" origin.log
    expect:
      exit: 1
      stdout: "0\n"
