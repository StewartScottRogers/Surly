# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: http-run-a-test-proxy
title: Running a Test Proxy
protocols: [http]
tier: advanced
surl-options: [--directory, --proxy, --proxy-allow-origin, --head-timeout, --trace-ascii]
curl-options: [-x, -p, -s, -S, -o, -w]
exit-codes: [0, 7, 45]
references: [rfc9110, surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  # One surl: the origin on 8080 and a proxy on 3128.
  main:
    command: surl --directory site --trace-ascii site/origin.txt http://127.0.0.1:{{port}}/ --proxy http://127.0.0.1:{{port2}}/
    ready: port
  # A second proxy, told it may reach one address outside loopback.
  wider:
    command: surl --proxy http://127.0.0.1:{{port3}}/ --proxy-allow-origin 192.0.2.1 --head-timeout 2
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -x sends the request for the origin to the proxy, which forwards it and returns the origin's answer.
    run: curl -x http://127.0.0.1:{{port2}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: via-on-the-answer
    claim: The answer that came through the proxy carries a Via header, 1.1 surl, naming the proxy it passed.
    run: curl -s -o {{null}} -w "%header{via}" -x http://127.0.0.1:{{port2}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "1.1 surl"

  - id: origin-sees-the-proxy
    claim: The origin's trace of the Solution's request shows it arrived in origin form, GET /hello.txt, with a Via 1.1 surl header the proxy added and without curl's Proxy-Connection header.
    run: curl -s http://127.0.0.1:{{port}}/origin.txt
    expect:
      exit: 0
      stdout-matches: 'GET /hello\.txt HTTP/1\.1\n[^\n]*Host: 127\.0\.0\.1:\d+\n[^\n]*User-Agent: curl/[^\n]*\n[^\n]*Accept: \*/\*\n[^\n]*Via: 1\.1 surl\n[^\n]*\n'

  - id: outside-loopback-refused
    claim: The proxy refuses an origin outside loopback, 192.0.2.1 here, with 403 Forbidden; curl exits 0 because a 403 is an answer.
    run: curl -s -o {{null}} -w "%{http_code}" -x http://127.0.0.1:{{port2}}/ http://192.0.2.1/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: tunnel-refused
    claim: A CONNECT tunnel to that origin, which curl -p asks for, is refused the same way, and curl exits 7 with CONNECT tunnel failed, response 403.
    run: curl -sS -p -x http://127.0.0.1:{{port2}}/ http://192.0.2.1/hello.txt
    expect:
      exit: 7
      stderr-contains: "curl: (7) CONNECT tunnel failed, response 403"

  - id: tunnel-to-loopback
    claim: A CONNECT tunnel to a loopback origin is opened, 200, and the request goes through it.
    run: curl -s -p -w "%{http_connect} " -x http://127.0.0.1:{{port2}}/ http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n200 "

  - id: own-listener-refused
    claim: The proxy refuses to forward to its own listener, 403, so a request cannot loop through it.
    run: curl -s -o {{null}} -w "%{http_code}" -x http://127.0.0.1:{{port2}}/ http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "403"

  - id: allowed-origin-is-tried
    claim: With --proxy-allow-origin 192.0.2.1 the proxy tries that origin instead of refusing it; nothing answers there, so after --head-timeout it answers a gateway error, 504 Gateway Timeout (502 Bad Gateway where the network refuses at once), not 403.
    run: curl -s -o {{null}} -w "%{http_code}" -x http://127.0.0.1:{{port3}}/ http://192.0.2.1/hello.txt
    expect:
      exit: 0
      stdout-matches: '^50[24]$'

  - id: every-origin-warns
    claim: --proxy-allow-origin "*" admits every origin and warns on standard error at start; here the port is taken, so surl then exits 45.
    run: surl --proxy http://127.0.0.1:{{port2}}/ --proxy-allow-origin "*"
    expect:
      exit: 45
      stderr-contains: "surl: warning: --proxy-allow-origin: the proxy connects to every origin address, not only loopback"
