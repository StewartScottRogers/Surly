# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs run-a-proxy.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-run-a-test-proxy-from-an-agent
title: Running a Test Proxy from an Agent
protocols: [http]
tier: advanced
surface: mcp
mcp-tools: [start_server, transfer, get_exchanges, curl]
exit-codes: [0, 7]
references: [rfc9110, surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: start_server with --proxy in arguments runs an origin and a proxy, bound_urls lists the origin then the proxy, transfer with proxy fetches through it, 200 with Via 1.1 surl, and get_exchanges shows the proxy received the absolute form and the origin GET /hello.txt with Via added.
    program: run-a-proxy.cs
    args: [fetch]
    expect:
      exit: 0
      stdout-matches: '^statusCode: 200, Via: 1\.1 surl, failure: null\nproxy received: GET http://127\.0\.0\.1:\d+/hello\.txt HTTP/1\.1\norigin received: GET /hello\.txt HTTP/1\.1 \| Via: 1\.1 surl\ntool error: no\n$'

  - id: outside-loopback-refused
    claim: The proxy answers 403 for an origin outside loopback, 192.0.2.1; to transfer that is an answer, failure null and no tool error, and only the proxy has an exchange.
    program: run-a-proxy.cs
    args: [outside]
    expect:
      exit: 0
      stdout: "statusCode: 403, Via: none, failure: null\nproxy received: GET http://192.0.2.1/hello.txt HTTP/1.1\ntool error: no\n"

  - id: tunnel-refused
    claim: transfer has no tunnel field; the curl tool with -p asks for a CONNECT tunnel, the proxy refuses it, and the answer holds exitCode 7 and curl's message CONNECT tunnel failed, response 403.
    program: run-a-proxy.cs
    args: [tunnel-outside]
    expect:
      exit: 0
      stdout-matches: '^exitCode: 7\ncurl: \(7\) CONNECT tunnel failed, response 403\ntool error: yes\n$'

  - id: allowed-origin-is-tried
    claim: With --proxy-allow-origin 192.0.2.1 and --head-timeout 2 in arguments the proxy tries that origin instead; nothing answers, so it answers a gateway error (504, or 502 where the network refuses at once), not 403.
    program: run-a-proxy.cs
    args: [allowed]
    expect:
      exit: 0
      stdout-matches: '^statusCode: 50[24], Via: none, failure: null\n'

  - id: every-origin-warns
    claim: --proxy-allow-origin * admits every origin, and start_server's log_lines begin with the warning surl writes for it.
    program: run-a-proxy.cs
    args: [every-origin]
    expect:
      exit: 0
      stdout-matches: '^surl: warning: --proxy-allow-origin: the proxy connects to every origin address, not only loopback\nListening on http://127\.0\.0\.1:\d+/\nListening on http://127\.0\.0\.1:\d+/\n$'
