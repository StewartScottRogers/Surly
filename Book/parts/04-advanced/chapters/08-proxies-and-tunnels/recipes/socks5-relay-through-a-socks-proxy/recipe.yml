# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: socks5-relay-through-a-socks-proxy
title: Relaying through a SOCKS5 Proxy
protocols: [socks5h, http]
tier: advanced
surl-options: [--directory, -v, --log-file, -U, --allow-plaintext-auth]
curl-options: [-x, --socks4, --resolve, -s, -S, --max-time]
exit-codes: [0, 97]
references: [surl-readme, curl-manual, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  # One surl: the origin on localhost:8080 and a SOCKS5 server on 8081, logging every event to socks.log.
  main:
    command: surl --directory site http://localhost:{{port}}/ socks5h://127.0.0.1:{{port2}}/ -v --log-file socks.log
    ready: port
  # SOCKS5 servers with one account: one as surl starts by default, one that accepts a password in clear.
  login:
    command: surl socks5://127.0.0.1:{{port3}}/ -U app:socks-pw
    ready: port
  plain:
    command: surl socks5://127.0.0.1:{{port4}}/ -U app:socks-pw --allow-plaintext-auth
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -x socks5h:// sends the origin's name, localhost, to the SOCKS5 server, which resolves it, connects and relays the request and answer.
    run: curl -s -x socks5h://127.0.0.1:{{port2}} http://localhost:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: proxy-resolved-the-name
    claim: The server's log shows it connected to the name it was given, localhost and the origin's port, and answered 05 00, success.
    run: grep -m1 "Connected to localhost:" socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Connected to localhost:\d+; answered 05 00\.\n$'

  - id: socks5-resolves-locally
    claim: With socks5:// curl resolves the name itself, here through --resolve, and sends the address, so a name only the client knows works.
    run: curl -s --resolve origin.test:{{port}}:127.0.0.1 -x socks5://127.0.0.1:{{port2}} http://origin.test:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: socks5h-cannot-use-the-clients-name
    claim: With socks5h:// the same name goes to the server, which cannot resolve origin.test, answers 05 04, and curl exits 97.
    run: curl -sS --max-time 20 --resolve origin.test:{{port}}:127.0.0.1 -x socks5h://127.0.0.1:{{port2}} http://origin.test:{{port}}/hello.txt
    expect:
      exit: 97
      stderr-contains: "curl: (97) cannot complete SOCKS5 connection to origin.test. (4)"

  - id: log-names-host-not-found
    claim: The server's log says why, naming the origin it was asked for, origin.test, and HostNotFound.
    run: grep -m1 "the origin origin.test" socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Answered 05 04: the origin origin\.test:\d+ could not be used \(HostNotFound\)\.\n$'

  - id: socks4-turned-away
    claim: A SOCKS4 client, curl --socks4, is turned away at once with the SOCKS4 refusal 91, and curl exits 97.
    run: curl -sS --socks4 127.0.0.1:{{port2}} http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 97
      stderr-contains: "(91), request rejected or failed."

  - id: log-names-socks4
    claim: The server's log says it answered 5B to a SOCKS4 request on a SOCKS5 listener.
    run: grep -m1 "SOCKS4" socks.log
    expect:
      exit: 0
      stdout-matches: '^#\d+ \* Answered 5B: a SOCKS4 request on a SOCKS5 listener\.\n$'

  - id: outside-loopback-refused
    claim: An origin outside loopback, 192.0.2.1, is refused with 05 02, not allowed, and curl exits 97.
    run: curl -sS --max-time 20 -x socks5h://127.0.0.1:{{port2}} http://192.0.2.1/hello.txt
    expect:
      exit: 97
      stderr-contains: "curl: (97) cannot complete SOCKS5 connection to 192.0.2.1. (2)"

  - id: login-needed
    claim: A server with -U accounts offers only username and password, so a client with no login is told no authentication method was acceptable.
    run: curl -sS -x socks5h://127.0.0.1:{{port3}} http://localhost:{{port}}/hello.txt
    expect:
      exit: 97
      stderr-contains: "curl: (97) No authentication method was acceptable."

  - id: password-in-clear-refused
    claim: The SOCKS5 password travels in clear, so by default even the right one is rejected, unchecked.
    run: curl -sS -x socks5h://app:socks-pw@127.0.0.1:{{port3}} http://localhost:{{port}}/hello.txt
    expect:
      exit: 97
      stderr-contains: "curl: (97) User was rejected by the SOCKS5 server (1 1)."

  - id: plaintext-allowed
    claim: A server started with --allow-plaintext-auth accepts the same login and relays the request.
    run: curl -s -x socks5h://app:socks-pw@127.0.0.1:{{port4}} http://localhost:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
