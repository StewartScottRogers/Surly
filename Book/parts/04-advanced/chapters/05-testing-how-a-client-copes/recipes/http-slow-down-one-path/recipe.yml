# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-slow-down-one-path
title: Slowing Down One Path
protocols: [http]
tier: advanced
surl-options: [--directory, --fault]
curl-options: [-s, -o, -w, -m, -Z, --parallel-immediate]
exit-codes: [0, 28]
references: [surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/slow/report.txt: "the slow report\n"
  site/slowness.txt: "not slow at all\n"

# Every request for /slow or anything under it is held five seconds before it is answered;
# every other request is answered at once.
servers:
  main:
    command: surl --directory site --fault "delay;stage=command;path=/slow;ms=5000" http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Fetched side by side with a two-second limit each, the fast path is answered 200 and the slow one gives up after two seconds, exit 28, with no status.
    run: curl -s -Z --parallel-immediate -m 2 -w "%{url.path} %{http_code} %{exitcode}\n" -o {{null}} http://127.0.0.1:{{port}}/slow/report.txt -o {{null}} http://127.0.0.1:{{port}}/hello.txt
    timeout: 30
    expect:
      exit: 28
      stdout: "/hello.txt 200 0\n/slow/report.txt 000 28\n"

  - id: fast-path
    claim: A path outside /slow is answered in well under a second.
    run: curl -s -m 2 -o {{null}} -w "%{http_code} %{time_total}" http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^200 0\.\d+$'

  - id: slow-but-served
    claim: Without a limit, the slow path is answered 200 after the five-second hold.
    run: curl -s -o {{null}} -w "%{http_code} %{time_total}" http://127.0.0.1:{{port}}/slow/report.txt
    timeout: 30
    expect:
      exit: 0
      stdout-matches: '^200 [5-9]\.\d+$'

  - id: segment-prefix
    claim: path=/slow matches /slow and what is under it, segment by segment, not every path that starts with those letters; /slowness.txt is fast.
    run: curl -s -m 2 http://127.0.0.1:{{port}}/slowness.txt
    expect:
      exit: 0
      stdout: "not slow at all\n"

  - id: without-parallel-immediate
    claim: Without --parallel-immediate, curl waits to see whether the second transfer can share the first one's connection, so the fast path is held behind the slow one and times out too.
    run: curl -s -Z -m 2 -w "%{url.path} %{http_code} %{exitcode}\n" -o {{null}} http://127.0.0.1:{{port}}/slow/report.txt -o {{null}} http://127.0.0.1:{{port}}/hello.txt
    timeout: 30
    expect:
      exit: 28
      stdout-matches: '^(/slow/report\.txt 000 28\n/hello\.txt 000 28\n|/hello\.txt 000 28\n/slow/report\.txt 000 28\n)$'
