# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-slow-down-one-path-in-csharp
title: Slowing Down One Path in C#
protocols: [http]
tier: advanced
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, FaultStage, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Fetched at once on one client with a two-second limit, the fast path is answered 200 first and the slow path fails with CurlException 28, OperationTimedOut, before the five-second hold is over.
    program: slow-path.cs
    args: ["2"]
    expect:
      exit: 0
      stdout: "/hello.txt: 200 OK, within 5 s\n/slow/report.txt: CurlException 28 (OperationTimedOut), within 5 s\n"

  - id: no-limit
    claim: Without a limit, the slow path is answered 200 after the five-second hold, and the fast path is still answered first, within five seconds.
    program: slow-path.cs
    args: ["0"]
    timeout: 90
    expect:
      exit: 0
      stdout: "/hello.txt: 200 OK, within 5 s\n/slow/report.txt: 200 OK, after 5 s\n"

  - id: segment-prefix
    claim: Path /slow matches /slow and what is under it, by whole segments; /slowness.txt is fast.
    program: slow-path.cs
    args: ["2", "/slowness.txt"]
    expect:
      exit: 0
      stdout: "/slowness.txt: 200 OK, within 5 s\n/slow/report.txt: CurlException 28 (OperationTimedOut), within 5 s\n"
