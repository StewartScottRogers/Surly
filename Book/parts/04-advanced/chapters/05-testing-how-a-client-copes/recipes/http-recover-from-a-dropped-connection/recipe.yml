# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-recover-from-a-dropped-connection
title: Recovering from a Dropped Connection
protocols: [http]
tier: advanced
surl-options: [--directory, --fault]
curl-options: [-s, -w, --retry, --retry-all-errors]
exit-codes: [0, 56]
references: [surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"
  strict/hello.txt: "hello from surl\n"
  once/hello.txt: "hello from surl\n"

# Each server drops the first request for /hello.txt, once, and serves every request after it.
# The rule acts at the command stage, when the request has arrived, so the readiness check,
# which connects and sends nothing, does not spend it. One surl holds a folder at a time.
servers:
  main:
    command: surl --directory site --fault "drop;stage=command;path=/hello.txt;times=1" http://127.0.0.1:{{port}}/
    ready: port
  strict:
    command: surl --directory strict --fault "drop;stage=command;path=/hello.txt;times=1" http://127.0.0.1:{{port2}}/
    ready: port
  once:
    command: surl --directory once --fault "drop;stage=command;path=/hello.txt;times=1" http://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The first connection is dropped when its request arrives; with --retry 1 --retry-all-errors curl tries again, the retry is served, and curl counts one retry.
    run: curl -s --retry 1 --retry-all-errors -w "%{num_retries}\n" http://127.0.0.1:{{port}}/hello.txt
    timeout: 30
    expect:
      exit: 0
      stdout: "hello from surl\n1\n"

  - id: retry-alone
    claim: --retry alone does not count a dropped connection as transient, so curl makes no retry and exits 56.
    run: curl -s --retry 1 -w "%{num_retries}\n" http://127.0.0.1:{{port2}}/hello.txt
    timeout: 30
    expect:
      exit: 56
      stdout: "0\n"

  - id: no-retry
    claim: Without a retry, the dropped request gets nothing, and curl exits 56, a failure to receive.
    run: curl -s http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 56
      stdout: ""

  - id: once-only
    claim: The rule has times=1, so the next request, on a new connection, is served.
    run: curl -s http://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: accept-stage-spends
    claim: A rule at the accept stage spends one of its times on every connection it matches, even one that opens and closes without a byte.
    run: surl --aihelp testing
    expect:
      exit: 0
      stdout-matches: 'A rule at the `accept` stage spends one of its `times` on every connection it matches, a readiness probe that opens and closes without a byte included'
