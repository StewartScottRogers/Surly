# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: sftp-refuse-the-first-login-in-csharp
title: Refusing the First Login in C#
protocols: [sftp]
tier: advanced
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlFault, SurlFileContents, SurlNotFoundException, SurlEventQuery, SurlEventKind, LoginJudgedEvent, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlException, CurlCode]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, rfc4252]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api; its argument picks the scenario.

cases:
  - id: solution
    role: solution
    claim: Against a RefuseLogin rule with Times 2, the first upload throws CurlException LoginDenied, the retry a second later with the same password uploads the file, and the server judged three logins; password and keyboard-interactive refused by the rule on the first connection, password accepted on the second.
    program: deploy-with-retry.cs
    args: []
    expect:
      exit: 0
      stdout: "try 1: LoginDenied\ntry 2: uploaded\nstored: build 42\nlogin password alice: refused by the rule\nlogin keyboard-interactive alice: refused by the rule\nlogin password alice: accepted\nrule refusals left: 0\n"

  - id: no-retry
    claim: The same server and a client that tries once; the upload throws LoginDenied, nothing is stored, and the program exits 67, curl's code for a refused login.
    program: deploy-with-retry.cs
    args: [no-retry]
    expect:
      exit: 67
      stdout: "try 1: LoginDenied\nstored: nothing\nlogin password alice: refused by the rule\nlogin keyboard-interactive alice: refused by the rule\nrule refusals left: 0\n"

  - id: one-attempt
    claim: With Times 1 the rule is spent by the password attempt, Curl.Api falls back to keyboard-interactive on the same connection, and the first try uploads; a deploy step's retry is never exercised.
    program: deploy-with-retry.cs
    args: [one-attempt]
    expect:
      exit: 0
      stdout: "try 1: uploaded\nstored: build 42\nlogin password alice: refused by the rule\nlogin keyboard-interactive alice: accepted\nrule refusals left: 0\n"

  - id: wrong-password
    claim: A wrong password is refused by the account check before the rule is reached, on both tries and both methods, so the rule is not spent (2 refusals left), nothing is stored and the program exits 67.
    program: deploy-with-retry.cs
    args: [wrong-password]
    expect:
      exit: 67
      stdout: "try 1: LoginDenied\ntry 2: LoginDenied\nstored: nothing\nlogin password alice: refused\nlogin keyboard-interactive alice: refused\nlogin password alice: refused\nlogin keyboard-interactive alice: refused\nrule refusals left: 2\n"
