# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-recover-from-a-dropped-connection-in-csharp
title: Recovering from a Dropped Connection in C#
protocols: [http]
tier: advanced
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlFault, SurlFaultRule, SurlEventQuery, SurlEventKind, FaultStage, CurlClient, CurlRequest, CurlResponse, CurlException, CurlCode]
exit-codes: [0, 56]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The first request is dropped and SendAsync throws CurlException 56, RecvError; the one retry is served, and the server counts two exchanges and one use of the rule, which then has none left.
    program: recover.cs
    args: ["1"]
    expect:
      exit: 0
      stdout: "attempt 1: CurlException 56 (RecvError)\nattempt 2: 200 hello from surl\nretries: 1\nexchanges: 2\nfault applied: 1\nf1 remaining: 0\n"

  - id: no-retry
    claim: A client that does not retry fails with 56, the server counts one exchange, and the rule is spent all the same.
    program: recover.cs
    args: ["0"]
    expect:
      exit: 56
      stdout: "attempt 1: CurlException 56 (RecvError)\nretries: 0\nexchanges: 1\nfault applied: 1\nf1 remaining: 0\n"

  - id: spare-retries
    claim: Allowing more retries changes nothing once one has succeeded; the client stops at the first success.
    program: recover.cs
    args: ["3"]
    expect:
      exit: 0
      stdout: "attempt 1: CurlException 56 (RecvError)\nattempt 2: 200 hello from surl\nretries: 1\nexchanges: 2\nfault applied: 1\nf1 remaining: 0\n"
