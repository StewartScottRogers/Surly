# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: http-cut-a-download-off-halfway
title: Cutting a Download Off Halfway
protocols: [http]
tier: advanced
surl-options: [--directory, --fault]
curl-options: [-C, -s, -S, -o, -w, --retry, --retry-all-errors, --retry-delay, --max-time]
exit-codes: [0, 56]
references: [rfc9110, surl-readme, curl-manual]

fixtures:
  site/hello.txt: "hello from surl\n"
  dl/.keep: ""

# site/big.txt: 5,000,000 random hexadecimal digits and a line end, made fresh for each run.
setup:
  - openssl rand -hex -out site/big.txt 2500000

servers:
  # Every connection is cut once surl has sent 4,000,000 bytes on it.
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/ --fault "drop;after-bytes=4000000"
    ready: port

cases:
  - id: solution
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    role: solution
    claim: The first download is cut off and curl exits 56; curl -C - then fetches the rest, and the command as a whole exits 0.
    run: curl -sS --max-time 30 -o dl/big.txt http://127.0.0.1:{{port}}/big.txt || curl -sS --max-time 30 -C - -o dl/big.txt http://127.0.0.1:{{port}}/big.txt
    expect:
      exit: 0
      stderr-contains: "curl: (56)"

  - id: whole-file
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    claim: After the resume the downloaded file is byte for byte the one served.
    run: cmp site/big.txt dl/big.txt
    expect:
      exit: 0
      stdout: ""

  - id: cut-off
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    claim: Without a resume the download stops part-way; the answer was 200, the connection was reset, exit 56, and curl had received fewer than the 4,000,000 bytes surl sent, but more than 1,000,000.
    run: curl -sS --max-time 30 -o dl/part.txt -w "%{http_code} %{size_download}\n" http://127.0.0.1:{{port}}/big.txt
    expect:
      exit: 56
      stdout-matches: '^200 [1-3]\d{6}\n$'

  - id: partial-file-kept
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    claim: curl leaves what it received on disk, a partial file of between 1,000,000 and 3,999,999 bytes.
    run: wc -c < dl/part.txt | tr -d " "
    expect:
      exit: 0
      stdout-matches: '^[1-3]\d{6}\n$'

  - id: resume-asks-for-the-rest
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    claim: curl -C - asks for the bytes after the partial file's end; surl answers 206 Partial Content, and the rest is shorter than the cut, so it comes whole.
    run: curl -sS --max-time 30 -C - -o dl/part.txt -w "%{http_code} %{size_download}\n" http://127.0.0.1:{{port}}/big.txt
    expect:
      exit: 0
      stdout-matches: '^206 \d+\n$'

  - id: resumed-file-whole
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    claim: The resumed partial file is now the whole file.
    run: cmp site/big.txt dl/part.txt
    expect:
      exit: 0
      stdout: ""

  - id: restart-never-finishes
    platforms: [windows, linux]  # macOS: a transfer that surl aborts mid-body sometimes never ends there (batch 13 CI; Curl report 2026-11-22T2247), so cut cases run on Windows and Linux.
    claim: A client that restarts instead of resuming meets the same cut every time; curl --retry 2 --retry-all-errors without -C - retries twice and still exits 56.
    run: curl -sS --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 -o dl/again.txt -w "%{num_retries}\n" http://127.0.0.1:{{port}}/big.txt
    expect:
      exit: 56
      stdout: "2\n"

  - id: short-answer-passes
    claim: The rule counts bytes on each connection, so an answer shorter than 4,000,000 bytes is served whole.
    run: curl -sS --max-time 30 http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"
