# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs recover.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-recover-from-a-dropped-connection-from-an-agent
title: Recovering from a Dropped Connection from an Agent
protocols: [http]
tier: advanced
surface: mcp
mcp-tools: [start_server, add_fault, curl, transfer, list_servers, get_events, list_faults]
exit-codes: [0, 56]
references: [surl-readme, curl-readme, curl-manual]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: With a drop rule added by add_fault, the curl tool with --retry 1 --retry-all-errors gets the file on its one retry and exits 0; the server counts two exchanges, one use of the rule, and none left.
    program: recover.cs
    args: [retry]
    expect:
      exit: 0
      stdout: "add_fault: f1\ncurl: exit 0, hello from surl | 1\nlist_servers: exchange_count 2\nget_events: 1 fault_applied\nlist_faults: f1 remaining 0\n"

  - id: retry-alone
    claim: With --retry 1 alone, curl does not count a dropped connection as transient, makes no retry and exits 56; the server counts one exchange.
    program: recover.cs
    args: [retry-alone]
    expect:
      exit: 0
      stdout: "add_fault: f1\ncurl: exit 56, 0\nlist_servers: exchange_count 1\nget_events: 1 fault_applied\nlist_faults: f1 remaining 0\n"

  - id: transfer-does-not-retry
    claim: transfer makes one attempt per call; the dropped one is a tool error carrying curl's exit code 56, and the next call is served.
    program: recover.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "add_fault: f1\ntransfer 1: curl exit 56, tool error: yes\ntransfer 2: 200 hello from surl\nlist_servers: exchange_count 2\nget_events: 1 fault_applied\nlist_faults: f1 remaining 0\n"
