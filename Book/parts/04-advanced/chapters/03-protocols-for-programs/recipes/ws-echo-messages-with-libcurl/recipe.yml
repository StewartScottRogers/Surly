# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: ws-echo-messages-with-libcurl
title: Echoing WebSocket Messages with Libcurl
protocols: [ws]
tier: advanced
surface: csharp
surl-options: [--ws-echo, --max-message, --directory]
api-types: [CurlGlobal, CurlLibrary, CurlEasy, CurlOption, CurlCode, CurlEasyWebSocket, CurlWebSocketFlags, CurlWebSocketFrame]
exit-codes: [0, 1, 7, 22]
references: [surl-readme, rfc6455, libcurl-api]

fixtures:
  site/hello.txt: "hello from surl\n"

# The program is only the client: the servers are surl processes, started before the
# cases and stopped after them. echo is the recipe's; limited and files are for the claims.
servers:
  echo:
    command: surl --ws-echo ws://127.0.0.1:{{port}}/
    ready: port
  limited:
    command: surl --ws-echo --max-message 64 ws://127.0.0.1:{{port2}}/
    ready: port
  files:
    command: surl --directory site ws://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Against surl --ws-echo, each text message sent with curl_ws_send comes back whole from curl_ws_recv as a text message, and a CLOSE with 1000 is answered with a CLOSE with 1000; the program exits 0.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:{{port}}/", "hello", "second message"]
    expect:
      exit: 0
      stdout: "Text 5: hello\nText 14: second message\nclose 1000\n"

  - id: path-not-looked-up
    claim: With --ws-echo the path is not looked up, so a path that names no file is upgraded and echoed like any other.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:{{port}}/no/such/file", "hello"]
    expect:
      exit: 0
      stdout: "Text 5: hello\nclose 1000\n"

  - id: longer-than-the-buffer
    claim: A 102-byte message comes back whole through the program's 64-byte buffer, joined from several curl_ws_recv calls by the frame's bytesleft.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:{{port}}/", "This message is longer than the sixty-four bytes the program reads at a time, so it arrives in pieces."]
    expect:
      exit: 0
      stdout: "Text 102: This message is longer than the sixty-four bytes the program reads at a time, so it arrives in pieces.\nclose 1000\n"

  - id: past-max-message
    claim: With --max-message 64 the same 102-byte message is not echoed; the server answers it with a CLOSE whose status code is 1009, message too big, and the program exits 1.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:{{port2}}/", "This message is longer than the sixty-four bytes the program reads at a time, so it arrives in pieces."]
    expect:
      exit: 1
      stdout: "close 1009\n"

  - id: without-ws-echo
    claim: Without --ws-echo the server ignores the message and sends the file at the path as one binary message, then a CLOSE with no status code.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:{{port3}}/hello.txt", "hello"]
    expect:
      exit: 0
      stdout: "Binary 16: hello from surl\n\nclose\n"

  - id: without-ws-echo-missing
    claim: Without --ws-echo a path that names no file is refused 404 Not Found before the upgrade, so curl_easy_perform returns CURLE_HTTP_RETURNED_ERROR, 22.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:{{port3}}/missing.txt", "hello"]
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "curl error 22 (HttpReturnedError): Refused WebSocket upgrade: 404"

  - id: nothing-listening
    claim: A port nothing listens on makes curl_easy_perform return CURLE_COULDNT_CONNECT, 7.
    program: ws-echo.cs
    args: ["ws://127.0.0.1:1/", "hello"]
    expect:
      exit: 7
      stdout: ""
      stderr-contains: "curl error 7 (CouldntConnect)"
