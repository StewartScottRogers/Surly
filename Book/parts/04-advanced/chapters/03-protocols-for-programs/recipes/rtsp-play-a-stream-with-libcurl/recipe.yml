# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: rtsp-play-a-stream-with-libcurl
title: Playing a Real Time Streaming Protocol Stream with Libcurl
protocols: [rtsp]
tier: advanced
surface: csharp
surl-options: [--directory]
api-types: [CurlGlobal, CurlLibrary, CurlEasy, CurlOption, CurlInfo, CurlCode, RtspRequest, WriteCallback, InterleaveCallback]
exit-codes: [0, 7, 22]
references: [surl-readme, rfc2326, rfc3550, libcurl-api]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/clip.txt: &clip |
    Line 01 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 02 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 03 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 04 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 05 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 06 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 07 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 08 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 09 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 10 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 11 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 12 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 13 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 14 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 15 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 16 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 17 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 18 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 19 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all
    Line 20 of 20 in clip.txt, each seventy-five bytes long, 1500 bytes in all

# The program is only the client: the server is a surl process, started before the cases
# and stopped after them, as in a console recipe.
servers:
  main:
    command: surl --directory site rtsp://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: DESCRIBE answers 200 with a Session Description Protocol body naming one stream of payload type 96; SETUP for RTP interleaved on the RTSP connection answers 200 with a session ID, which libcurl sends on the requests after it; PLAY answers 200; RECEIVE delivers the file as one RTP packet, followed by one RTCP packet; TEARDOWN answers 200; and the saved payload is the file byte for byte.
    program: rtsp-play.cs
    args: ["rtsp://127.0.0.1:{{port}}/hello.txt", "hello.out"]
    expect:
      exit: 0
      stdout: "DESCRIBE 200: m=application 0 RTP/AVP 96\nSETUP 200\nPLAY 200\nTEARDOWN 200\nRTP packets: 1 (16 bytes), RTCP packets: 1\n"
      stderr-contains: "session "
      files:
        hello.out: "hello from surl\n"

  - id: several-packets
    claim: A 1500-byte file arrives as two RTP packets, and their payloads joined in order are the file byte for byte.
    program: rtsp-play.cs
    args: ["rtsp://127.0.0.1:{{port}}/clip.txt", "clip.out"]
    expect:
      exit: 0
      stdout: "DESCRIBE 200: m=application 0 RTP/AVP 96\nSETUP 200\nPLAY 200\nTEARDOWN 200\nRTP packets: 2 (1500 bytes), RTCP packets: 1\n"
      files:
        clip.out: *clip

  - id: missing-file
    claim: DESCRIBE of a path that names no file is answered 404 Not Found, and the program stops there and exits 22, as curl -f would.
    program: rtsp-play.cs
    args: ["rtsp://127.0.0.1:{{port}}/missing.txt", "missing.out"]
    expect:
      exit: 22
      stdout: "DESCRIBE 404\n"

  - id: udp-transport
    claim: SETUP asking for RTP over UDP is answered 461 Unsupported Transport, because surl streams only interleaved on the RTSP connection; the program exits 22.
    program: rtsp-play.cs
    args: ["rtsp://127.0.0.1:{{port}}/hello.txt", "hello.out", "RTP/AVP;unicast;client_port=5000-5001"]
    expect:
      exit: 22
      stdout: "DESCRIBE 200: m=application 0 RTP/AVP 96\nSETUP 461\n"

  - id: nothing-listening
    claim: A port nothing listens on makes the first curl_easy_perform return CURLE_COULDNT_CONNECT, 7.
    program: rtsp-play.cs
    args: ["rtsp://127.0.0.1:1/hello.txt", "hello.out"]
    expect:
      exit: 7
      stdout: ""
      stderr-contains: "curl error 7 (CouldntConnect)"
