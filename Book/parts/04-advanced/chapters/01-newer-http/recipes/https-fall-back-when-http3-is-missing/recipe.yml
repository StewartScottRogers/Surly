# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 2
key: https-fall-back-when-http3-is-missing
title: Falling Back without HTTP/3
protocols: [https]
tier: advanced
surl-options: [--directory, --cert, --key, --http3, --trace-ascii]
curl-options: [--http3, --http3-only, --cacert, --connect-timeout, --happy-eyeballs-timeout-ms, -v, -s, -o, -w]
exit-codes: [0, 28, 56]
references: [surl-readme, curl-readme, rfc9114, rfc9000]

fixtures:
  site/hello.txt: "hello from surl\n"
  quiet/hello.txt: "hello from surl\n"
  h3site/hello.txt: "hello from surl\n"

# The certificate and its key are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main is the recipe: HTTPS on TCP and nothing on UDP, so a QUIC packet is turned away at once.
# swallowed puts a TFTP listener on the same port number, so QUIC packets reach something
# that is not QUIC and are never answered as QUIC, as on a network that drops them.
# h3 is the same server with --http3, for the contrast. Each serves its own directory,
# since two surl processes cannot share one.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key https://127.0.0.1:{{port}}/
    ready: port
  swallowed:
    command: surl --directory quiet --cert server.pem --key server.key --trace-ascii swallowed.txt https://127.0.0.1:{{port2}}/ tftp://127.0.0.1:{{port2}}/
    ready: port
  h3:
    command: surl --directory h3site --cert server.pem --key server.key --http3 https://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --http3 and nothing on UDP, curl falls back to TCP and hello.txt comes back over HTTP/2, exit 0.
    run: curl --http3 --cacert server.pem -w "HTTP/%{http_version}\n" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\nHTTP/2\n"

  - id: fallback-is-tls-over-tcp
    claim: After the QUIC attempt fails, curl makes an ordinary TLS handshake on TCP, where surl accepts h2.
    run: curl --http3 --cacert server.pem -v -s -o {{null}} https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stderr-contains: "ALPN: server accepted h2"

  - id: insisting-fails
    claim: With --http3-only, curl has no TCP to fall back to and fails receiving, exit 56, nothing on stdout.
    run: curl --http3-only --cacert server.pem -s https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 56
      stdout: ""

  - id: swallowed-falls-back
    claim: When the QUIC packets reach a UDP listener that is not QUIC (here TFTP, which logs each one as an exchange), --http3 still falls back to TCP and gets HTTP/2.
    run: 'curl --http3 --cacert server.pem -s -o {{null}} -w "%{http_version}\n" https://127.0.0.1:{{port2}}/hello.txt && grep -c "opened: tftp" swallowed.txt'
    timeout: 30
    expect:
      exit: 0
      stdout-matches: '^2\n[1-9]\d*\n$'

  - id: swallowed-times-out
    claim: Against the same swallowing listener, --http3-only never hears QUIC back and stops at --connect-timeout 2, exit 28.
    run: curl --http3-only --connect-timeout 2 --cacert server.pem -s https://127.0.0.1:{{port2}}/hello.txt
    timeout: 30
    expect:
      exit: 28
      stdout: ""

  - id: prefers-http3-when-there
    claim: Against a server with --http3, the same --http3 request goes over HTTP/3, given --happy-eyeballs-timeout-ms 4000 so QUIC has time to win the race.
    run: curl --http3 --happy-eyeballs-timeout-ms 4000 --cacert server.pem -s -o {{null}} -w "%{http_version}\n" https://127.0.0.1:{{port3}}/hello.txt
    expect:
      exit: 0
      stdout: "3\n"
