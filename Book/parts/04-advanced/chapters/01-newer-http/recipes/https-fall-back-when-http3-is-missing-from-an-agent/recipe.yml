# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs fallback.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: https-fall-back-when-http3-is-missing-from-an-agent
title: Falling Back without HTTP/3 from an Agent
protocols: [https]
tier: advanced
surface: mcp
mcp-tools: [start_server, stop_server, curl, list_servers]
exit-codes: [0, 28, 56]
references: [surl-readme, curl-readme, rfc9114, rfc9000]

fixtures: {}

# The certificate and its key are made here, never committed; both hosts read them from the folder.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: The curl tool with --http3 against a server with nothing on UDP falls back to TCP and gets HTTP/2, exit code 0, no failure, not a tool error.
    program: fallback.cs
    args: []
    expect:
      exit: 0
      stdout: "exitCode: 0\nhttp_version: 2\nfailure: null\ntool error: no\n"

  - id: insisting-fails
    claim: On Windows, with --http3-only and --connect-timeout 2, curl has no TCP to fall back to and the turned-away QUIC packet ends it at once; the curl tool answers exit code 56, RecvError, as a tool error.
    platforms: [windows]
    program: fallback.cs
    args: [only]
    expect:
      exit: 1
      stdout: "exitCode: 56\nhttp_version: 0\nfailure: curl exit code 56 (RecvError)\ntool error: yes\n"

  - id: insisting-times-out
    claim: On Linux and macOS, curl-mcp is never told the QUIC packet was turned away, so the same --http3-only request stops at --connect-timeout 2; the curl tool answers exit code 28, OperationTimedOut, as a tool error.
    platforms: [linux, macos]
    program: fallback.cs
    args: [only]
    timeout: 60
    expect:
      exit: 1
      stdout: "exitCode: 28\nhttp_version: 0\nfailure: curl exit code 28 (OperationTimedOut)\ntool error: yes\n"

  - id: swallowed-falls-back
    claim: When the QUIC packets reach a TFTP listener on the same port number, which list_servers shows took them as exchanges, --http3 still falls back and gets HTTP/2.
    program: fallback.cs
    args: [swallowed]
    timeout: 60
    expect:
      exit: 0
      stdout: "exitCode: 0\nhttp_version: 2\nfailure: null\ntool error: no\nQUIC packets the TFTP listener took as exchanges: some\n"

  - id: swallowed-times-out
    claim: Against the same listener, --http3-only with --connect-timeout 2 ends with exit code 28, OperationTimedOut, a tool error.
    program: fallback.cs
    args: [swallowed-only]
    timeout: 60
    expect:
      exit: 1
      stdout: "exitCode: 28\nhttp_version: 0\nfailure: curl exit code 28 (OperationTimedOut)\ntool error: yes\nQUIC packets the TFTP listener took as exchanges: some\n"

  - id: prefers-http3-when-there
    claim: Against a server started with --http3 in start_server's arguments, the same --http3 request, given --happy-eyeballs-timeout-ms 4000, gets HTTP/3.
    program: fallback.cs
    args: [h3]
    expect:
      exit: 0
      stdout: "exitCode: 0\nhttp_version: 3\nfailure: null\ntool error: no\n"
