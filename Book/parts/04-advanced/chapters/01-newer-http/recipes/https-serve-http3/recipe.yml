# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 2
key: https-serve-http3
title: Serving HTTP/3 over QUIC
protocols: [https]
tier: advanced
surl-options: [--directory, --cert, --key, --http3, --tls-max]
curl-options: [--http3-only, --http3, --cacert, -V, -s, -o, -w, -I]
exit-codes: [0, 2, 56, 60]
references: [surl-readme, curl-readme, rfc9114, rfc9000, rfc8446]

fixtures:
  site/hello.txt: "hello from surl\n"
  plain/hello.txt: "hello from surl\n"

# The certificate and its key are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main is the recipe. ready: port waits for its TCP listener; surl opens the UDP one
# before it. tcp-only is the same server without --http3, there so the difference is a
# checked claim; it serves its own directory, since two surl processes cannot share one.
servers:
  main:
    command: surl --directory site --cert server.pem --key server.key --http3 https://127.0.0.1:{{port}}/
    ready: port
  tcp-only:
    command: surl --directory plain --cert server.pem --key server.key https://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --http3 on surl and --http3-only on curl, hello.txt comes back over HTTP/3 on QUIC, verified against server.pem, exit 0.
    run: curl --http3-only --cacert server.pem -w "HTTP/%{http_version}\n" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\nHTTP/3\n"

  - id: http3-head
    claim: The HTTP/3 head has no reason phrase and lower-case header names.
    run: curl --http3-only --cacert server.pem -s -I https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/3 200 \n(?:[^\n]+\n)*content-length: 16\n'

  - id: curl-has-http3
    claim: This curl lists HTTP3 among its features.
    run: curl -V
    expect:
      exit: 0
      stdout-matches: '\nFeatures:[^\n]* HTTP3[ \n]'

  - id: tcp-still-served
    claim: The TCP listener on the same port still answers, over HTTP/2 when curl asks for nothing.
    run: curl --cacert server.pem -s -o {{null}} -w "%{http_version}" https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "2"

  - id: alt-svc-advertised
    claim: Answers over TCP carry an Alt-Svc header naming h3 on the same port, good for a day.
    run: curl --cacert server.pem -s -I https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '\nalt-svc: h3=":\d+"; ma=86400\n'

  - id: untrusted-certificate
    claim: Without --cacert, curl cannot verify the certificate in the QUIC handshake either, exit 60.
    run: curl --http3-only https://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stdout: ""

  - id: off-by-default
    claim: Without --http3, surl does not answer QUIC, and curl --http3-only fails with nothing on stdout.
    run: curl --http3-only --cacert server.pem -s https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 56
      stdout: ""

  - id: off-falls-back
    claim: Without --http3 on surl, curl --http3 falls back to TCP and gets HTTP/2.
    run: curl --http3 --cacert server.pem -s -o {{null}} -w "%{http_version}" https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "2"

  - id: off-no-alt-svc
    claim: Without --http3, answers carry no Alt-Svc header.
    run: curl --cacert server.pem -s -o {{null}} -w "[%header{alt-svc}]" https://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "[]"

  - id: needs-https
    claim: --http3 with no https listen URL is refused at start as an option badly used, exit 2.
    run: surl --http3 http://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: option --http3: needs an https listen URL\n'

  - id: needs-tls-1-3
    claim: --http3 with --tls-max below 1.3 is refused at start, exit 2, because QUIC is TLS 1.3 only.
    run: surl --http3 --tls-max 1.2 --cert server.pem --key server.key https://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 2
      stdout-matches: '^surl: option --http3: needs --tls-max 1.3: QUIC is TLS 1.3 only\n'
