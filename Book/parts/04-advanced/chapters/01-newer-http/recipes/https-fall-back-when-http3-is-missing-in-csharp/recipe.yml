# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: https-fall-back-when-http3-is-missing-in-csharp
title: Falling Back without HTTP/3 in C#
protocols: [https]
tier: advanced
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlHttpOptions, CurlNetworkOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlException]
exit-codes: [0, 28, 56]
references: [surl-readme, curl-readme, rfc9114, rfc9000]

fixtures: {}

# The certificate and its key are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: HttpVersion.Http3 against a server with nothing on UDP falls back to TCP, and hello.txt comes back 200 over HTTP/2.
    program: fallback.cs
    args: []
    expect:
      exit: 0
      stdout: "HTTP/2.0 200\nhello from surl\n"

  - id: insisting-fails
    claim: HttpVersion.Http3Only has no TCP to fall back to, and SendAsync throws a CurlException with Code RecvError, curl's exit code 56.
    program: fallback.cs
    args: [only]
    expect:
      exit: 56
      stdout: "CurlException: RecvError (56)\n"

  - id: swallowed-falls-back
    claim: When the QUIC packets reach a TFTP listener on the same port number, which takes them as exchanges and never answers as QUIC, Http3 still falls back and gets HTTP/2.
    program: fallback.cs
    args: [swallowed]
    timeout: 60
    expect:
      exit: 0
      stdout: "HTTP/2.0 200\nhello from surl\nQUIC packets the TFTP listener took as exchanges: some\n"

  - id: swallowed-times-out
    claim: Against the same listener, Http3Only never finishes its handshake, and a ConnectTimeout of 2 s ends it with Code OperationTimedOut, exit code 28.
    program: fallback.cs
    args: [swallowed-only]
    timeout: 60
    expect:
      exit: 28
      stdout: "CurlException: OperationTimedOut (28)\nQUIC packets the TFTP listener took as exchanges: some\n"

  - id: prefers-http3-when-there
    claim: Against a server started with --http3 in AdditionalArguments, the same Http3 request, given a HappyEyeballsTimeout of 4 s, comes back over HTTP/3.
    program: fallback.cs
    args: [h3]
    expect:
      exit: 0
      stdout: "HTTP/3.0 200\nhello from surl\n"
