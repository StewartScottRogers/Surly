# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs faults.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: http-inject-a-fault-from-an-agent
title: Making a Server Fail from an Agent
protocols: [http]
tier: advanced
surface: mcp
mcp-tools: [start_server, add_fault, list_faults, remove_fault, get_events, transfer]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: add_fault answers the rule's ID, f1, and the next fetch is 503 Service Unavailable; after remove_fault with that ID, the fetch is 200 again.
    program: faults.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "add_fault: f1\ntransfer hello.txt: 503\nremove_fault: f1\ntransfer hello.txt: 200 hello from surl\n"

  - id: spent
    claim: A rule with times=1 applies once; list_faults still lists it, with remaining 0, and the next fetch is 200.
    program: faults.cs
    args: [spent]
    expect:
      exit: 0
      stdout: "add_fault: f1\ntransfer hello.txt: 503\nlist_faults: 1 rule(s)\n  f1 error;scheme=http;reply=503%20Service%20Unavailable remaining 0\ntransfer hello.txt: 200 hello from surl\n"

  - id: from-start
    claim: A rule given to start_server as surl's --fault option is listed by list_faults as f1, with remaining null for no limit.
    program: faults.cs
    args: [from-start]
    expect:
      exit: 0
      stdout: "list_faults: 1 rule(s)\n  f1 delay;path=%2Fslow.txt;stage=command;ms=100 remaining null\n"

  - id: drop
    claim: A drop rule cuts the connection when the request arrives, and curl-mcp's transfer answers curl's exit code 56.
    program: faults.cs
    args: [drop]
    expect:
      exit: 0
      stdout: "add_fault: f1\ntransfer hello.txt: curl exit 56\n"

  - id: events
    claim: Each time a rule applies, the server keeps a fault_applied event naming the rule, its kind, the stage and the path.
    program: faults.cs
    args: [events]
    expect:
      exit: 0
      stdout: "add_fault: f1\ntransfer hello.txt: 503\nget_events: f1 error at command on /hello.txt\n"

  - id: refused
    claim: A rule surl would refuse at start is a tool error with surl's reason, and removing a rule that is not there is a tool error too; nothing is added.
    program: faults.cs
    args: [refused]
    expect:
      exit: 0
      stdout: "add_fault: error: option --fault: key reply does not fit the http error shape\nremove_fault: error: server s1 has no fault rule f9\nlist_faults: 0 rule(s)\n"
