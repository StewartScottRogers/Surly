# The recipe's executable specification. Edit this, never the generated files.
schema: 1
key: http-refuse-an-oversized-request-head
title: Refusing an Oversized Request Head
protocols: [http]
tier: advanced
surl-options: [--directory, --max-request-head]
curl-options: [-H, -s, -o, -w, -D, -f]
exit-codes: [0, 2, 22]
references: [surl-readme, curl-manual]

# Each cookie file is one header line for curl -H @file: a cookie of 1,200 bytes and one of 600.
fixtures:
  site/hello.txt: "hello from surl\n"
  roomy/hello.txt: "hello from surl\n"
  big-cookie.txt: "Cookie: \n"
  small-cookie.txt: "Cookie: \n"

# strict refuses a request head over 1 KiB; roomy keeps surl's default limit.
# One surl holds a folder at a time, so roomy serves a folder of its own.
servers:
  strict:
    command: surl --directory site --max-request-head 1k http://127.0.0.1:{{port}}/
    ready: port
  roomy:
    command: surl --directory roomy http://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A request whose head is over the limit, here for its 1,200-byte cookie, is answered 431 Request Header Fields Too Large, though the file is there.
    run: curl -s -o {{null}} -w "%{http_code}\n" -H @big-cookie.txt http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "431\n"

  - id: under-the-limit
    claim: The same request with a 600-byte cookie fits under the limit and is served.
    run: curl -s -H @small-cookie.txt http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: default-limit
    claim: Without --max-request-head, the 1,200-byte cookie is well under surl's default limit and the request is served.
    run: curl -s -H @big-cookie.txt http://127.0.0.1:{{port2}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: closes-the-connection
    claim: The 431 has a short text body, Content-Length 36, and says Connection close, so the client must open a new connection to try again.
    run: curl -s -o {{null}} -D - -H @big-cookie.txt http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 431 Request Header Fields Too Large\r?\n.*Content-Length: 36\r?\nConnection: close\r?\n'

  - id: fail-on-431
    claim: With -f, curl treats the 431 as an error and exits 22.
    run: curl -s -f -H @big-cookie.txt http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 22
      stdout: ""

  - id: default-and-no-limit
    claim: The default limit is 100k, a size in bytes whose k suffix is 1,024, 0 means no limit, and the option loosens nothing.
    run: surl --aihelp limits
    expect:
      exit: 0
      stdout-matches: '`--max-request-head <bytes>`: the largest HTTP request head; default 100k\..*\| `--max-request-head <bytes>` \| bytes \| 100k \| [^|]*suffix k, m, g, t or p in either case, each 1024 times the one before;[^|]*0 means no limit \| no \|'

  - id: bad-size
    claim: A size surl cannot read is refused at start, exit 2.
    run: surl --max-request-head 1x http://127.0.0.1:{{port3}}/
    expect:
      exit: 2
      stderr-contains: "surl: option --max-request-head: is badly used here"
