# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: http-limit-upload-size
title: Limiting the Size of an Upload
protocols: [http]
tier: advanced
surl-options: [--directory, --allow-uploads, --user, --max-filesize]
curl-options: [-s, -f, -T, --digest, -u, -o, -w, -D, --max-filesize]
exit-codes: [0, 22, 63]
references: [surl-readme, curl-readme, curl-manual, rfc9110]

# notes.txt is 17 bytes, ten.txt exactly 10.
fixtures:
  site/hello.txt: "hello from surl\n"
  roomy/hello.txt: "hello from surl\n"
  notes.txt: "uploaded by curl\n"
  ten.txt: "123456789\n"

# main: uploads of at most 10 bytes. roomy: the default limit. One surl holds a folder at a time.
servers:
  main:
    command: surl --directory site --allow-uploads --user alice:s3cret --max-filesize 10 http://127.0.0.1:{{port}}/
    ready: port
  roomy:
    command: surl --directory roomy --allow-uploads --user alice:s3cret http://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --max-filesize 10, a 17-byte upload is answered 413 Content Too Large.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout: "413"

  - id: nothing-stored
    claim: Nothing of the refused upload is stored; the path is 404 Not Found.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout: "404"

  - id: refusal-closes
    claim: The 413 carries Connection close, so the connection ends with it.
    run: curl -s -o {{null}} -D - --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 0
      stdout-matches: 'HTTP/1\.1 413 Content Too Large\r?\n(?:[^\r\n]+\r?\n)*Connection: close\r?\n\r?\n$'

  - id: fail-flag
    claim: With -f, curl exits 22 on the 413.
    run: curl -s -f --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port}}/notes.txt
    expect:
      exit: 22
      stdout: ""

  - id: at-the-limit
    claim: An upload of exactly 10 bytes is within the limit and is stored, 201 Created.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T ten.txt http://127.0.0.1:{{port}}/ten.txt
    expect:
      exit: 0
      stdout: "201"
      files:
        site/ten.txt: "123456789\n"

  - id: unknown-length
    claim: An upload from standard input, sent chunked with no length given, is counted as it arrives and refused 413 too.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T - http://127.0.0.1:{{port}}/piped.txt < notes.txt
    expect:
      exit: 0
      stdout: "413"

  - id: unknown-length-not-stored
    claim: Nothing of the chunked upload is stored either.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret http://127.0.0.1:{{port}}/piped.txt
    expect:
      exit: 0
      stdout: "404"

  - id: default-takes-it
    claim: With the default limit, the same 17-byte upload is stored, 201 Created.
    run: curl -s -o {{null}} -w "%{http_code}" --digest -u alice:s3cret -T notes.txt http://127.0.0.1:{{port2}}/notes.txt
    expect:
      exit: 0
      stdout: "201"
      files:
        roomy/notes.txt: "uploaded by curl\n"

  - id: default
    claim: The default limit is 100M, 100 mebibytes, 0 means no limit, and a size may end in k, M, G, T or P, each 1024 times the one before.
    run: surl --aihelp limits
    expect:
      exit: 0
      stdout-matches: 'Each limit is 0 for no limit:.*`--max-filesize <bytes>`: the largest upload; default 100M\..*A size may end in k, M, G, T or P, each 1024 times the one before\.'

  - id: curl-max-filesize
    claim: curl's own --max-filesize limits what it downloads, the other way round; a 16-byte file past --max-filesize 10 makes curl exit 63.
    run: curl -s --max-filesize 10 --digest -u alice:s3cret http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 63
      stdout: ""
