# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-refuse-an-oversized-request-head-in-csharp
title: Refusing Oversized Request Heads in C#
protocols: [http]
tier: advanced
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0, 22]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Under a 1 KiB limit set through AdditionalArguments, a request carrying a 1,200-byte cookie is answered 431 Request Header Fields Too Large with a 36-byte text body and Connection close, and SendAsync throws nothing.
    program: refuse-big-heads.cs
    args: ["1200"]
    expect:
      exit: 22
      stdout: "431 Request Header Fields Too Large\nbody: 36 bytes, Connection: close\n"

  - id: under-the-limit
    claim: The same request with a 600-byte cookie fits under the limit and is served.
    program: refuse-big-heads.cs
    args: ["600"]
    expect:
      exit: 0
      stdout: "200 OK\nhello from surl\n"

  - id: default-limit
    claim: Without the option, the 1,200-byte cookie is well under surl's default limit and is served.
    program: refuse-big-heads.cs
    args: ["1200", "default"]
    expect:
      exit: 0
      stdout: "200 OK\nhello from surl\n"

  - id: past-the-default
    claim: The default limit is finite; a 200,000-byte cookie is over it and is answered 431.
    program: refuse-big-heads.cs
    args: ["200000", "default"]
    expect:
      exit: 22
      stdout: "431 Request Header Fields Too Large\nbody: 36 bytes, Connection: close\n"
