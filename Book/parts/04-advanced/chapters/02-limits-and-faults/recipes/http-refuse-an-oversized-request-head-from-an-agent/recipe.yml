# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs refuse-big-heads.cs, a C# program on the official MCP SDK that starts both hosts
# from PATH; its argument picks the scenario.
schema: 2
key: http-refuse-an-oversized-request-head-from-an-agent
title: Refusing Oversized Request Heads from an Agent
protocols: [http]
tier: advanced
surface: mcp
mcp-tools: [start_server, transfer, get_exchanges]
exit-codes: [0]
references: [surl-readme, curl-readme]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A server started with --max-request-head 1k in arguments answers a transfer carrying a 1,200-byte cookie 431 Request Header Fields Too Large, with a 36-byte text body and Connection close, and to transfer that is an answer, not a tool error.
    program: refuse-big-heads.cs
    args: [big]
    expect:
      exit: 0
      stdout: "statusCode: 431\nfailure: null\nbody: 36 bytes, Connection: close\ntool error: no\n"

  - id: under-the-limit
    claim: The same request with a 600-byte cookie fits under the limit and is served.
    program: refuse-big-heads.cs
    args: [small]
    expect:
      exit: 0
      stdout: "statusCode: 200\nfailure: null\nhello from surl\ntool error: no\n"

  - id: default-limit
    claim: Without the option, the 1,200-byte cookie is well under surl's default limit and is served.
    program: refuse-big-heads.cs
    args: [default]
    expect:
      exit: 0
      stdout: "statusCode: 200\nfailure: null\nhello from surl\ntool error: no\n"

  - id: recorded
    claim: get_exchanges shows the server sent the 431 status line on the exchange that carried the big cookie.
    program: refuse-big-heads.cs
    args: [recorded]
    expect:
      exit: 0
      stdout: "statusCode: 431\nfailure: null\nbody: 36 bytes, Connection: close\nget_exchanges: sent HTTP/1.1 431 Request Header Fields Too Large\ntool error: no\n"
