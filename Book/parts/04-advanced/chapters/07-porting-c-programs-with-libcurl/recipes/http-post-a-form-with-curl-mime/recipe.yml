# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-post-a-form-with-curl-mime
title: Posting a Form with curl_mime
protocols: [http]
tier: advanced
surface: csharp
surl-options: [--allow-anonymous, --trace-ascii]
api-types: [CurlGlobal, CurlGlobalFlags, CurlLibrary, CurlEasy, CurlMime, CurlMimePart, CurlOption, WriteCallback, CurlCode, CurlInfo, CurlErrorText]
exit-codes: [0, 7, 26]
references: [surl-readme, libcurl-api, rfc2045, rfc9110]

fixtures:
  nov.csv: "region,total\nnorth,15\n"

# The program is only the client. surl records every byte each exchange carries in trace.txt,
# which the cases read back; it serves no form, so a POST is answered 405 once it has been read.
servers:
  main:
    command: surl --allow-anonymous --trace-ascii trace.txt http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The ported program posts a two-part form with CURLOPT_MIMEPOST; curl_easy_perform returns CURLE_OK, CURLINFO_SIZE_UPLOAD_T is the whole 325-byte body, and surl answers 405 because it serves no form.
    program: post-form.cs
    args: ["http://127.0.0.1:{{port}}/reports", "nov.csv"]
    expect:
      exit: 0
      stdout: "response code 405, 325 bytes sent\n"

  - id: request-head
    claim: The request is a POST with Content-Length 325 and Content-Type multipart/form-data with a boundary libcurl chose, and no User-Agent, which libcurl sends only when told to.
    run: 'grep -o -E "(POST /reports HTTP/1.1|User-Agent: .*|Content-Length: 325|Content-Type: multipart/form-data; boundary=-+)$" trace.txt'
    expect:
      exit: 0
      stdout: "POST /reports HTTP/1.1\nContent-Length: 325\nContent-Type: multipart/form-data; boundary=--------------------\n"

  - id: parts-in-order
    claim: The recorded body holds the parts in the order they were added, each with its Content-Disposition; title by curl_mime_name, file with the file name curl_mime_filedata took from the path, and the Content-Type curl_mime_type set.
    run: 'grep -o -E "Content-(Disposition: form-data; name=.*|Type: text/csv)$" trace.txt'
    expect:
      exit: 0
      stdout: "Content-Disposition: form-data; name=\"title\"\nContent-Disposition: form-data; name=\"file\"; filename=\"nov.csv\"\nContent-Type: text/csv\n"

  - id: part-contents
    claim: The text part carries November and the file part the file's bytes; the trace shows each line end as a dot.
    run: 'grep -o -E ": (November|region,total\.north,15\.)$" trace.txt'
    expect:
      exit: 0
      stdout: ": November\n: region,total.north,15.\n"

  - id: missing-file
    claim: curl_mime_filedata of a file that cannot be read answers CURLE_READ_ERROR, 26, and the program stops before sending anything.
    program: post-form.cs
    args: ["http://127.0.0.1:{{port}}/reports", "missing.csv"]
    expect:
      exit: 26
      stdout: ""
      stderr-contains: "curl_mime_filedata() failed: Failed to open/read local data from file/application"

  - id: nothing-listening
    claim: A port nothing listens on is CURLE_COULDNT_CONNECT, 7, from curl_easy_perform.
    program: post-form.cs
    args: ["http://127.0.0.1:1/reports", "nov.csv"]
    expect:
      exit: 7
      stdout: ""
      stderr-contains: "curl_easy_perform() failed: Could not connect to server"
