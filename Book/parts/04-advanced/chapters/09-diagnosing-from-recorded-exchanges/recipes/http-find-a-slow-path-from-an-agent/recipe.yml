# Executable specification for a recipe whose subject is surl-mcp or curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH;
# its argument picks how the test run fetches.
schema: 2
key: http-find-a-slow-path-from-an-agent
title: Finding a Slow Path from an Agent
protocols: [http]
tier: advanced
surface: mcp
mcp-tools: [start_server, transfer, curl, get_events, get_exchanges]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: After a test run that fetched three paths with a transfer call each, the agent matches each exchange's start and end events to the request line it carried, and names /reports/weekly.csv, held 1.5 s by the server, as the slowest at 1.5 to 4 s, the others under 1 s.
    program: program.cs
    args: [one-each]
    expect:
      exit: 0
      stdout: "exchange 1: GET /index.html: under 1 s\nexchange 2: GET /reports/weekly.csv: 1.5 to 4 s\nexchange 3: GET /reports/daily.csv: under 1 s\nslowest: GET /reports/weekly.csv\nheld by a fault: /reports/weekly.csv (exchange 2)\n"

  - id: fault-event-agrees
    claim: The server's fault_applied event names the same path and exchange, the server's own account of what it held.
    program: program.cs
    args: [one-each]
    expect:
      exit: 0
      stdout-matches: "\nheld by a fault: /reports/weekly.csv \\(exchange 2\\)\n$"

  - id: one-connection
    claim: When the run fetched all three over one kept-alive connection, they are one exchange of 1.5 to 4 s, so the timings name the connection, not the path; only the fault_applied event says which request was held.
    program: program.cs
    args: [one-connection]
    expect:
      exit: 0
      stdout: "exchange 1: GET /index.html, GET /reports/weekly.csv, GET /reports/daily.csv: 1.5 to 4 s\nslowest: GET /index.html, GET /reports/weekly.csv, GET /reports/daily.csv\nheld by a fault: /reports/weekly.csv (exchange 1)\n"
