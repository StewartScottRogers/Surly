# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: http-change-an-answer-per-request
title: Changing an Answer per Request
protocols: [http]
tier: advanced
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerFaults, SurlFault, SurlFaultScope, FaultStage, FaultPoint, FaultAppliedEvent, SurlEventQuery, SurlEventKind, CurlClient, CurlRequest, CurlResponse]
exit-codes: [0]
references: [surl-readme, rfc9110]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: "A response override that fails /report.txt while the test's flag says so answers 200 before the flag is set, 503 while it is set, and 200 again once it is cleared, and leaves /other.txt at 200 throughout."
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^GET /report\.txt: 200 totals\nGET /report\.txt: 503 503 Service Unavailable\nGET /other\.txt: 200 other\nGET /report\.txt: 200 totals\n'

  - id: not-listed
    claim: "An override is not in the fault plan's list: Faults.List() has no entry for it, though it fails requests."
    program: program.cs
    args: []
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '\noverrides in the fault plan''s list: 0\n$'

  - id: one-event
    claim: "The server records one FaultApplied event for the one failed request, an Error at the command stage on /report.txt, and its rule identifier is the one AddOverride returned."
    program: program.cs
    args: [event]
    timeout: 120
    expect:
      exit: 0
      stdout-matches: '^GET /report\.txt: 503 503 Service Unavailable\nGET /other\.txt: 200 other\nfault events: 1; Error at Command on /report\.txt, rule f1 is override f1: True\n$'

  - id: point
    claim: "The decision is told the command and the path of each request it is asked about, GET /report.txt and then GET /other.txt, and is asked once for each."
    program: program.cs
    args: [point]
    timeout: 120
    expect:
      exit: 0
      stdout: "the decision was asked about: GET /report.txt, GET /other.txt\n"

  - id: remove
    claim: "Faults.Remove with the identifier AddOverride returned takes the override away: it returns true, then false, and /report.txt is answered 200 although the test's flag is still set."
    program: program.cs
    args: [remove]
    timeout: 120
    expect:
      exit: 0
      stdout: "GET /report.txt: 503 503 Service Unavailable\nremoved: True; again: False\nGET /report.txt: 200 totals\n"
