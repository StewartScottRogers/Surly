# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: rtsp-ask-what-a-server-offers
title: Asking a Streaming Server What It Offers
protocols: [rtsp]
tier: advanced
surl-options: [--directory, --user]
curl-options: [-i, -s, -v, -o, -w, -f, -S, --digest, -u]
exit-codes: [0, 22]
references: [surl-readme, curl-manual, rfc2326, rfc7616]

fixtures:
  site/hello.txt: "hello from surl\n"

servers:
  open:
    command: surl --directory site rtsp://127.0.0.1:{{port}}/
    ready: port
  locked:
    command: surl --user alice:s3cret rtsp://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -i asks with OPTIONS and prints the answer, RTSP/1.0 200 OK with a Public field naming OPTIONS, DESCRIBE, ANNOUNCE, SETUP, PLAY, PAUSE, TEARDOWN, GET_PARAMETER, SET_PARAMETER and RECORD, and no body, exit 0.
    run: curl -i rtsp://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout-matches: '\ARTSP/1\.0 200 OK\r?\nCSeq: 1\r?\nDate: [^\r\n]+\r?\nServer: surl\r?\nPublic: OPTIONS, DESCRIBE, ANNOUNCE, SETUP, PLAY, PAUSE, TEARDOWN, GET_PARAMETER, SET_PARAMETER, RECORD\r?\n\r?\n\Z'

  - id: options-star
    claim: Whatever path the URL names, curl sends one request, OPTIONS * RTSP/1.0 with CSeq 1, never the path itself.
    run: curl -s -v -o {{null}} rtsp://127.0.0.1:{{port}}/hello.txt 2>&1
    expect:
      exit: 0
      stdout-matches: '> OPTIONS \* RTSP/1\.0\r?\n\r?\n?> CSeq: 1\r?\n.*< RTSP/1\.0 200 OK'

  - id: login-needed
    claim: Once surl has an account, OPTIONS needs a login too; with none it is answered 401 Unauthorized offering Digest, with the algorithms MD5, SHA-256 and SHA-512-256 in that order.
    run: curl -i rtsp://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout-matches: '\ARTSP/1\.0 401 Unauthorized\r?\n.*WWW-Authenticate: Digest realm="surl", qop="auth", algorithm=MD5, nonce="[0-9a-f]+"\r?\nWWW-Authenticate: Digest realm="surl", qop="auth", algorithm=SHA-256, nonce="[0-9a-f]+"\r?\nWWW-Authenticate: Digest realm="surl", qop="auth", algorithm=SHA-512-256, nonce="[0-9a-f]+"\r?\n\r?\n\Z'

  - id: digest-one-connection
    claim: curl --digest answers the 401 and is let in, 200, on the one connection it opened.
    run: curl -s --digest -u alice:s3cret -o {{null}} -w "%{http_code} %{num_connects}" rtsp://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: "200 1"

  - id: digest-solution-f
    claim: With -f the same login exits 0 and prints nothing, since the answer has no body.
    run: curl -f --digest -u alice:s3cret rtsp://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: ""

  - id: wrong-password
    claim: A wrong password is answered 401 again; with -f, curl exits 22.
    run: curl -s -S -f --digest -u alice:wrong rtsp://127.0.0.1:{{port2}}/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "returned error: 401"

  - id: basic-refused
    claim: The right password sent with Basic, curl -u without --digest, is answered 403 Forbidden, since RTSP is always plain text.
    run: curl -s -u alice:s3cret -o {{null}} -w "%{http_code}" rtsp://127.0.0.1:{{port2}}/
    expect:
      exit: 0
      stdout: "403"
