schema: 2
key: scp-serve-a-host-certificate
title: Serving a Secure Shell Host Certificate
protocols: [scp, sftp]
tier: advanced
surl-options: [--directory, --hostkey, --hostcert, --authorized-keys, --user]
curl-options: [--variable, --expand-write-out, --expand-hostpubsha256, --hostpubsha256, --knownhosts, -o, -u, -s, -S]
exit-codes: [0, 2, 37, 60, 255]
references: [surl-readme, curl-readme, curl-manual, openssh-certkeys, rfc4251]

fixtures:
  site/hello.txt: "hello from surl\n"
  get.sftp: "get hello.txt got.txt\n"

# A certificate authority, a host key and its certificate, a spare host certificate for a key
# surl does not serve, the client's login key, a known_hosts line trusting the authority
# (and one trusting another authority), and the host key's fingerprint for curl.
setup:
  - ssh-keygen -t ed25519 -N "" -C "" -f ca
  - ssh-keygen -t rsa -b 3072 -N "" -f host_key
  - ssh-keygen -s ca -I surl-host -h -n 127.0.0.1 host_key.pub
  - ssh-keygen -t ed25519 -N "" -f spare_key
  - ssh-keygen -s ca -I spare-host -h -n 127.0.0.1 spare_key.pub
  - ssh-keygen -t ed25519 -N "" -f client_key
  - curl -s --variable ca_key@ca.pub --expand-write-out " @cert-authority * {{ca_key}}" -o {{null}} file:///{{null}} > known_hosts
  - ssh-keygen -t ed25519 -N "" -C "" -f other_ca
  - curl -s --variable ca_key@other_ca.pub --expand-write-out " @cert-authority * {{ca_key}}" -o {{null}} file:///{{null}} > other_known_hosts
  - ssh-keygen -lf host_key.pub > fingerprint.txt

servers:
  main:
    command: surl --directory site --hostkey host_key --hostcert host_key-cert.pub --authorized-keys alice:client_key.pub --user alice:s3cret scp://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: OpenSSH's sftp, trusting only the certificate authority and checking host keys strictly, accepts surl and fetches hello.txt; sftp -b echoes the batch command and exits 0 only when every command succeeded.
    run: sftp -q -b get.sftp -P {{port}} -i client_key -o UserKnownHostsFile=known_hosts -o GlobalKnownHostsFile={{null}} -o StrictHostKeyChecking=yes alice@127.0.0.1
    expect:
      exit: 0
      stdout: "sftp> get hello.txt got.txt\n"

  - id: certificate-checked
    claim: The client receives the certificate as the host key, and accepts the server because the certificate authority in known_hosts signed it.
    run: sftp -v -b get.sftp -P {{port}} -i client_key -o UserKnownHostsFile=known_hosts -o GlobalKnownHostsFile={{null}} -o StrictHostKeyChecking=yes alice@127.0.0.1
    expect:
      exit: 0
      stderr-contains: "is known and matches the RSA-CERT host certificate."

  - id: other-authority-refused
    claim: The same client trusting another authority refuses the server before logging in, Host key verification failed, and exits 255.
    run: sftp -b get.sftp -P {{port}} -i client_key -o UserKnownHostsFile=other_known_hosts -o GlobalKnownHostsFile={{null}} -o StrictHostKeyChecking=yes alice@127.0.0.1
    expect:
      exit: 255
      stdout: ""
      stderr-contains: "Host key verification failed."

  - id: known-hosts-line
    claim: OpenSSH reads the line the setup wrote, a space, @cert-authority, the host pattern * and the authority's public key, as a certificate authority (CA) for 127.0.0.1.
    run: ssh-keygen -F 127.0.0.1 -f known_hosts
    expect:
      exit: 0
      stdout-matches: '\A# Host 127\.0\.0\.1 found: line 1 CA\r?\n @cert-authority \* ssh-ed25519 [A-Za-z0-9+/=]+ ?\r?\n\Z'

  - id: curl-pins-the-plain-key
    claim: curl does not ask for the certificate; it receives the plain host key, so a --hostpubsha256 pin of host_key.pub, read from bytes 12 to 54 of the fingerprint, still fetches the file over SCP, exit 0.
    run: curl -s -S -u alice:s3cret --variable "host_sha256[12-54]@fingerprint.txt" --expand-hostpubsha256 "{{host_sha256}}" scp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: curl-ignores-the-authority
    claim: Given the known_hosts file that trusts the authority, curl does not accept the server by it; it finds no key for the host and exits 60.
    run: curl -s -S -u alice:s3cret --knownhosts known_hosts scp://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 60
      stdout: ""
      stderr-contains: "SSH remote key was not OK"

  - id: missing-certificate
    claim: A --hostcert file that cannot be read stops surl at start with exit 37, naming the file.
    run: surl --hostkey host_key --hostcert no_such-cert.pub scp://127.0.0.1:{{port2}}/
    expect:
      exit: 37
      stderr-contains: "Could not read host certificate no_such-cert.pub"

  - id: plain-key-is-no-certificate
    claim: A plain public key given as --hostcert is refused at start, exit 2.
    run: surl --hostkey host_key --hostcert host_key.pub scp://127.0.0.1:{{port2}}/
    expect:
      exit: 2
      stderr-contains: "Host certificate host_key.pub: not an OpenSSH host certificate"

  - id: certificate-for-another-key
    claim: A host certificate for a key that is not one of the --hostkey keys is refused at start, exit 2.
    run: surl --hostkey host_key --hostcert spare_key-cert.pub scp://127.0.0.1:{{port2}}/
    expect:
      exit: 2
      stderr-contains: "Host certificate spare_key-cert.pub: certifies no --hostkey key"
