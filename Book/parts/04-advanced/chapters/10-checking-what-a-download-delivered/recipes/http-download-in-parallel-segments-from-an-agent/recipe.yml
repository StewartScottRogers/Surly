# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs segments.cs, a C# program on the official MCP SDK
# that starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: http-download-in-parallel-segments-from-an-agent
title: Downloading in Parallel Segments from an Agent
protocols: [http]
tier: advanced
surface: mcp
mcp-tools: [start_server, get_exchanges, get_events, transfer, curl]
exit-codes: [0]
references: [surl-readme, curl-manual, rfc9110]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Four transfer calls sent at once, each with one Range header, are answered 206 with the Content-Range asked for and the bytes in base64, the parts joined in order are identical to the original by SHA-256, and get_exchanges holds the four Range headers.
    program: segments.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "206 bytes 0-99999/400000, isBase64 True, isTruncated False\n206 bytes 100000-199999/400000, isBase64 True, isTruncated False\n206 bytes 200000-299999/400000, isBase64 True, isTruncated False\n206 bytes 300000-399999/400000, isBase64 True, isTruncated False\njoined: 400000 bytes, identical\nserver received Range: bytes=0-99999\nserver received Range: bytes=100000-199999\nserver received Range: bytes=200000-299999\nserver received Range: bytes=300000-399999\n"

  - id: one-curl-call
    claim: One curl tool call with a transfer per range, run with --parallel, saves each range to its own file inside CURL_MCP_ROOT, and those files joined in order are identical to the original too.
    program: segments.cs
    args: [curl]
    expect:
      exit: 0
      stdout: "exitCode: 0\njoined: 400000 bytes, identical\nserver received Range: bytes=0-99999\nserver received Range: bytes=100000-199999\nserver received Range: bytes=200000-299999\nserver received Range: bytes=300000-399999\n"

  - id: in-flight-together
    claim: Against a server that holds every request for a second, get_events shows all four connections open at once, so the four calls ran side by side.
    program: segments.cs
    args: [slow]
    expect:
      exit: 0
      stdout-matches: '\njoined: 400000 bytes, identical\n(server received Range: [^\n]+\n){4}connections open at once: 4\n$'

  - id: past-the-end
    claim: A range that starts past the end is answered 416 with Content-Range bytes */400000, and to transfer that is an answer, failure null, not a tool error.
    program: segments.cs
    args: [past-the-end]
    expect:
      exit: 0
      stdout: "statusCode: 416, Content-Range bytes */400000, failure: null\n"
