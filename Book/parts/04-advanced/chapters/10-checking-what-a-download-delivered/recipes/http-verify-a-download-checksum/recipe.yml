# Executable specification. key MUST equal the folder name and never changes once published.
schema: 1
key: http-verify-a-download-checksum
title: Verifying a Download's Checksum
protocols: [http]
tier: advanced
surl-options: [--directory]
curl-options: [-f, -s, -S, -o]
exit-codes: [0, 1, 22]
references: [surl-readme, curl-manual, rfc9110]

fixtures:
  site/tool-1.0.bin: "installer for tool 1.0\n"
  fetch-verified.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Downloads a URL and keeps it only if its SHA-256 is the published one.
    # Usage: sh fetch-verified.sh <url> <published sha-256> <file>
    url=$1 want=$2 file=$3
    curl -fsS -o "$file.part" "$url" || exit
    if command -v sha256sum >/dev/null; then got=$(sha256sum "$file.part")
    else got=$(shasum -a 256 "$file.part"); fi
    got=${got%% *}
    if [ "$got" != "$want" ]; then
      rm -f "$file.part"
      echo "refused $file: SHA-256 is $got, not $want" >&2
      exit 1
    fi
    mv "$file.part" "$file"
    echo "kept $file: SHA-256 $got"

servers:
  main:
    command: surl --directory site http://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: The download whose SHA-256 is the published one is kept under its name, and the script exits 0.
    run: sh fetch-verified.sh http://127.0.0.1:{{port}}/tool-1.0.bin 0e2fb8e221331b806feda5547ebd3fa59614053f86f9f0d92b8e840976e0e80c tool-1.0.bin
    expect:
      exit: 0
      stdout: "kept tool-1.0.bin: SHA-256 0e2fb8e221331b806feda5547ebd3fa59614053f86f9f0d92b8e840976e0e80c\n"
      files:
        tool-1.0.bin: "installer for tool 1.0\n"

  - id: wrong-digest-refused
    claim: The same download checked against a different published digest is refused, exit 1, with both digests named on standard error.
    run: sh fetch-verified.sh http://127.0.0.1:{{port}}/tool-1.0.bin 3a781f0b1f6c0a682e41bd887f6307082508282ab9c96d8a6bf1dc62f0a237c2 other.bin
    expect:
      exit: 1
      stderr-contains: "refused other.bin: SHA-256 is 0e2fb8e221331b806feda5547ebd3fa59614053f86f9f0d92b8e840976e0e80c, not 3a781f0b1f6c0a682e41bd887f6307082508282ab9c96d8a6bf1dc62f0a237c2"

  - id: changed-file-refused
    claim: When the served file has changed, curl downloads it without complaint, but its digest no longer matches and the script refuses it, exit 1.
    fixtures:
      site/tool-1.0.bin: "installer for tool 1.0, with something added\n"
    run: sh fetch-verified.sh http://127.0.0.1:{{port}}/tool-1.0.bin 0e2fb8e221331b806feda5547ebd3fa59614053f86f9f0d92b8e840976e0e80c tool-1.0.bin
    expect:
      exit: 1
      stderr-contains: "refused tool-1.0.bin: SHA-256 is 3a781f0b1f6c0a682e41bd887f6307082508282ab9c96d8a6bf1dc62f0a237c2, not 0e2fb8e221331b806feda5547ebd3fa59614053f86f9f0d92b8e840976e0e80c"

  - id: refused-leaves-nothing
    claim: The refused download leaves no .part file behind.
    run: cat tool-1.0.bin.part
    expect:
      exit: 1
      stderr-contains: "tool-1.0.bin.part: No such file or directory"

  - id: kept-file-untouched
    claim: The copy of tool-1.0.bin kept earlier is untouched by the refused download of the same name, because the script writes to a .part file and renames it only on a match.
    run: cat tool-1.0.bin
    expect:
      exit: 0
      stdout: "installer for tool 1.0\n"

  - id: missing-file
    claim: A file that is not there is a 404; curl -f exits 22 with no file written, and the script exits 22 too, before any digest is taken.
    run: sh fetch-verified.sh http://127.0.0.1:{{port}}/tool-2.0.bin 0e2fb8e221331b806feda5547ebd3fa59614053f86f9f0d92b8e840976e0e80c tool-2.0.bin
    expect:
      exit: 22
      stderr-contains: "curl: (22) The requested URL returned error: 404"
