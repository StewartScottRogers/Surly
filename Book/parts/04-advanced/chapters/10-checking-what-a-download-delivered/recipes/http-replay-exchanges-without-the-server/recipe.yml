# Executable specification. key MUST equal the folder name and never changes once published.
# No servers: block. record.sh starts its own surl and stops it, so every later case runs with
# nothing listening.
schema: 2
key: http-replay-exchanges-without-the-server
title: Replaying Exchanges without the Server
protocols: [http]
tier: advanced
surl-options: [--directory, -s]
curl-options: [-s, -S, -D, -o, -w, --max-time]
exit-codes: [0, 7, 37]
references: [surl-readme, curl-readme, rfc9110]

fixtures:
  site/hello.txt: "hello from surl\n"
  site/report.csv: "region,total\nnorth,12\nsouth,7\n"
  record.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Starts surl on port $1, records each name below into rec/ (the response head in
    # <name>.head, the body in <name>), then stops the server. Usage: sh record.sh <port>
    url="http://127.0.0.1:$1"
    surl -s --directory site "$url/" > /dev/null 2>&1 &
    pid=$!
    tries=0
    until curl -s -o /dev/null --max-time 2 "$url/"; do      # wait until it answers, 10 s at most
      tries=$((tries + 1)); [ "$tries" -ge 50 ] && { kill "$pid"; exit 1; }
      sleep 0.2
    done
    mkdir -p rec
    for name in hello.txt report.csv missing.txt; do
      curl -s --max-time 10 -D "rec/$name.head" -o "rec/$name" "$url/$name"
      echo "recorded $name: $(head -n 1 "rec/$name.head" | tr -d '\r')"
    done
    kill "$pid"; wait "$pid" 2> /dev/null
    curl -s -o /dev/null --max-time 5 "$url/hello.txt"
    echo "server stopped: curl exit $?"
  replay.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Fetches the recorded body of $1 with curl from a file: URL, so no server is needed.
    # Usage: sh replay.sh <name>
    dir=$(cd rec && { pwd -W 2> /dev/null || pwd; })   # pwd -W: the Windows path, in Git Bash
    case $dir in /*) base="file://$dir" ;; *) base="file:///$dir" ;; esac
    curl -sS --max-time 10 "$(printf '%s/%s' "$base" "$1" | sed 's/ /%20/g')"

cases:
  - id: solution
    role: solution
    claim: Recording three paths from a running surl and stopping it leaves a head and a body for each, and replaying hello.txt from the recording prints its bytes with nothing listening.
    run: sh record.sh {{port}} && sh replay.sh hello.txt
    timeout: 60
    expect:
      exit: 0
      stdout: "recorded hello.txt: HTTP/1.1 200 OK\nrecorded report.csv: HTTP/1.1 200 OK\nrecorded missing.txt: HTTP/1.1 404 Not Found\nserver stopped: curl exit 7\nhello from surl\n"

  - id: same-bytes
    claim: The replayed body is byte for byte the file the server sent.
    run: sh replay.sh report.csv > replayed.csv && cmp site/report.csv replayed.csv && echo identical
    expect:
      exit: 0
      stdout: "identical\n"

  - id: head-kept
    claim: The recorded head keeps the server's headers, such as Content-Type text/csv for report.csv, for a test that checks them offline.
    run: grep -c -e "^Content-Type. text/csv" rec/report.csv.head
    expect:
      exit: 0
      stdout: "1\n"

  - id: missing-recorded-as-404
    claim: A 404 is recorded too, as its head and an empty body, so the replay of missing.txt prints nothing and the head still says 404 Not Found.
    run: sh replay.sh missing.txt && head -n 1 rec/missing.txt.head
    expect:
      exit: 0
      stdout-matches: '^HTTP/1\.1 404 Not Found\r?\n$'

  - id: not-recorded
    claim: Replaying a path that was never recorded fails with curl exit 37, Could not open file, instead of reaching any server.
    run: sh replay.sh notes.txt
    expect:
      exit: 37
      stderr-contains: "curl: (37) Could not open file"

  - id: nothing-listening
    claim: The replays above ran with the server stopped; its URL still refuses the connection, curl exit 7.
    run: curl -s -o {{null}} -w "%{http_code} %{exitcode}\n" --max-time 5 http://127.0.0.1:{{port}}/hello.txt
    expect:
      exit: 7
      stdout: "000 7\n"
