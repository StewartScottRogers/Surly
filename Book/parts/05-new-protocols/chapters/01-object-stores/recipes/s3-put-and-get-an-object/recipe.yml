# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: s3-put-and-get-an-object
title: Putting and Getting an Amazon S3 Object
protocols: [s3, https]
tier: new-protocols
surl-options: [--directory, --cert, --key, --user, --allow-uploads, --allow-anonymous]
curl-options: [--cacert, --connect-to, -u, -T, -s, -S]
exit-codes: [0, 22, 58, 60]
references: [surl-readme, curl-protocols, aws-s3-api, rfc8446, rfc7617]

fixtures:
  note.txt: "uploaded over s3\n"
  store/photos/hello.txt: "hello from surl\n"
  readonly/photos/hello.txt: "hello, read only\n"
  open/photos/hello.txt: "hello to anyone\n"

# A certificate for 127.0.0.1 and for the host name curl gives the bucket photos in
# us-east-1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:photos.s3.us-east-1.amazonaws.com"

# main is the recipe: s3 and, on the same store, https. readonly has no --allow-uploads;
# anonymous adds --allow-anonymous. Each serves its own folder: one surl holds a folder at a time.
servers:
  main:
    command: surl --directory store --cert server.pem --key server.key --user AKIAIOSFODNN7EXAMPLE:s3cret --allow-uploads s3://127.0.0.1:{{port}}/ https://127.0.0.1:{{port2}}/
    ready: port
  readonly:
    command: surl --directory readonly --cert server.pem --key server.key --user AKIAIOSFODNN7EXAMPLE:s3cret s3://127.0.0.1:{{port3}}/
    ready: port
  anonymous:
    command: surl --directory open --cert server.pem --key server.key --allow-anonymous --allow-uploads s3://127.0.0.1:{{port4}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -T puts note.txt as the object note.txt in the bucket photos, signed with the account's keys, and the second URL, with no -T, gets it back, exit 0; the object is the file store/photos/note.txt.
    run: curl --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret -T note.txt s3://photos/note.txt s3://photos/note.txt
    expect:
      exit: 0
      stdout: "uploaded over s3\n"
      files:
        store/photos/note.txt: "uploaded over s3\n"

  - id: file-is-an-object
    claim: A file already in the bucket's folder is an object, and is got like one.
    run: curl -s --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: object-over-https
    claim: The object put over s3 is served over HTTPS by the same surl at /photos/note.txt, to the same account logging in with Basic.
    run: curl -s --cacert server.pem -u AKIAIOSFODNN7EXAMPLE:s3cret https://127.0.0.1:{{port2}}/photos/note.txt
    expect:
      exit: 0
      stdout: "uploaded over s3\n"

  - id: unsigned
    claim: A request with no -u is sent unsigned and refused 403 AccessDenied; curl writes nothing and exits 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} s3://photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: AccessDenied"

  - id: wrong-secret
    claim: The right access key with the wrong secret is refused 403 SignatureDoesNotMatch, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:wrong s3://photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: SignatureDoesNotMatch"

  - id: unknown-key
    claim: An access key surl does not hold is refused 403 InvalidAccessKeyId, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAOTHEREXAMPLE:s3cret s3://photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: InvalidAccessKeyId"

  - id: missing-object
    claim: A key with no object is answered 404 NoSuchKey, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/missing.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 404: NoSuchKey"

  - id: untrusted-certificate
    claim: Without --cacert, curl does not trust the certificate, sends nothing, and exits 60.
    run: curl -s --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/hello.txt
    expect:
      exit: 60
      stdout: ""

  - id: needs-a-certificate
    claim: An s3 listen URL with no certificate stops the start with exit 58 and a message that says so.
    run: surl --user AKIAIOSFODNN7EXAMPLE:s3cret s3://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout-matches: '^surl: \(58\) s3://127\.0\.0\.1:0/ needs a certificate'

  - id: uploads-off
    claim: Without --allow-uploads, a signed put is refused 403 AccessDenied, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port3}} -u AKIAIOSFODNN7EXAMPLE:s3cret -T note.txt s3://photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: AccessDenied"

  - id: uploads-off-reads
    claim: Without --allow-uploads, a signed get is still served.
    run: curl -s --cacert server.pem --connect-to ::127.0.0.1:{{port3}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/hello.txt
    expect:
      exit: 0
      stdout: "hello, read only\n"

  - id: anonymous-read
    claim: With --allow-anonymous, an unsigned get is served.
    run: curl -s --cacert server.pem --connect-to ::127.0.0.1:{{port4}} s3://photos/hello.txt
    expect:
      exit: 0
      stdout: "hello to anyone\n"

  - id: anonymous-write
    claim: With --allow-anonymous and --allow-uploads, an unsigned put is still refused 403 AccessDenied, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port4}} -T note.txt s3://photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: AccessDenied"
