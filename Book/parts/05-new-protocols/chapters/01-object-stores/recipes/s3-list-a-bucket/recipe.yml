# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: s3-list-a-bucket
title: Listing a Bucket
protocols: [s3]
tier: new-protocols
surl-options: [--directory, --cert, --key, --user, --list-directories, --allow-anonymous]
curl-options: [--cacert, --connect-to, -u, -s, -S]
exit-codes: [0, 22]
references: [surl-readme, curl-protocols, aws-s3-api, rfc8446]

fixtures:
  store/photos/readme.txt: "read me\n"
  store/photos/2025/dec.jpg: "december\n"
  store/photos/2026/jan.jpg: "january\n"
  store/photos/2026/feb.jpg: "february\n"
  nolist/photos/readme.txt: "no listing here\n"
  open/photos/readme.txt: "open to anyone\n"
  open/photos/2026/jan.jpg: "january\n"

# A certificate for 127.0.0.1 and for every bucket's host name in us-east-1, good for 30 days,
# signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

# main is the recipe. nolist is the same without --list-directories; open adds --allow-anonymous.
# Each serves its own folder: one surl holds a folder at a time.
servers:
  main:
    command: surl --directory store --cert server.pem --key server.key --user AKIAIOSFODNN7EXAMPLE:s3cret --list-directories s3://127.0.0.1:{{port}}/
    ready: port
  nolist:
    command: surl --directory nolist --cert server.pem --key server.key --user AKIAIOSFODNN7EXAMPLE:s3cret s3://127.0.0.1:{{port2}}/
    ready: port
  open:
    command: surl --directory open --cert server.pem --key server.key --list-directories --allow-anonymous s3://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A URL that ends in a slash lists the bucket under that prefix, and curl writes the keys, one to a line, in order, exit 0.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/2026/
    expect:
      exit: 0
      stdout: "2026/feb.jpg\n2026/jan.jpg\n"

  - id: top-level
    claim: Listing s3://photos/ shows one level, the folders as prefixes ending in a slash and the objects at the top.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/
    expect:
      exit: 0
      stdout: "2025/\n2026/\nreadme.txt\n"

  - id: empty-prefix
    claim: A prefix with nothing under it lists nothing, and that is not an error, exit 0.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/2030/
    expect:
      exit: 0
      stdout: ""

  - id: no-such-bucket
    claim: A bucket that is not a folder of the store is answered 404 NoSuchBucket, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://videos/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 404: NoSuchBucket"

  - id: unsigned-listing
    claim: An unsigned listing is refused 403 AccessDenied, exit 22, though the server allows listings.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} s3://photos/2026/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: AccessDenied"

  - id: listing-off
    claim: Without --list-directories, a signed listing is refused 403 AccessDenied, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port2}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 403: AccessDenied"

  - id: listing-off-reads
    claim: Without --list-directories, a signed get of an object by its key is still served.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port2}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://photos/readme.txt
    expect:
      exit: 0
      stdout: "no listing here\n"

  - id: anonymous-listing
    claim: With --allow-anonymous and --list-directories, an unsigned listing is served.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port3}} s3://photos/2026/
    expect:
      exit: 0
      stdout: "2026/jan.jpg\n"
