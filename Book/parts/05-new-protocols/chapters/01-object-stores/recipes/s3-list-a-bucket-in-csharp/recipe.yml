# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: s3-list-a-bucket-in-csharp
title: Listing a Bucket in C#
protocols: [s3]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, CurlClient, CurlRequest, CurlResponse, CurlNetworkOptions, CurlAuthenticationOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, aws-s3-api, rfc8446]

fixtures: {}

# A certificate for 127.0.0.1 and for every bucket's host name in us-east-1, good for 30 days,
# signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A Surl.Api server with ListDirectories and one account answers Curl.Api's request for s3://photos/2026/ with the two keys under the prefix, in order, status 200.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^prefix: 200 \[2026/feb\.jpg, 2026/jan\.jpg\]\n'

  - id: top-level
    claim: The URL s3://photos/ lists one level, the folders as prefixes ending in a slash and the objects at the top.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\ntop: 200 \[2025/, 2026/, readme\.txt\]\n'

  - id: empty-prefix
    claim: A prefix with nothing under it lists nothing; the response is 200 with an empty body and nothing is thrown.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nempty: 200 \[\]\n'

  - id: no-such-bucket
    claim: A bucket that is not in the store throws CurlException with code 22, HttpReturnedError, and a message that names 404 NoSuchBucket.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nno bucket: CurlException 22 HttpReturnedError: S3 returned error 404: NoSuchBucket'

  - id: unsigned-listing
    claim: A listing with no credentials throws CurlException with code 22 and a message that names 403 AccessDenied, though the server allows listings.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nunsigned: CurlException 22 HttpReturnedError: S3 returned error 403: AccessDenied'

  - id: listing-off
    claim: On a server without ListDirectories, a signed listing throws CurlException with code 22 and a message that names 403 AccessDenied.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlisting off: CurlException 22 HttpReturnedError: S3 returned error 403: AccessDenied'

  - id: listing-off-reads
    claim: On a server without ListDirectories, a signed get of an object by its key is still served, status 200.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlisting off, get: 200 \[read me\]\n'

  - id: anonymous-listing
    claim: On a server with AllowAnonymous and ListDirectories, a listing with no credentials is served.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanonymous: 200 \[2026/feb\.jpg, 2026/jan\.jpg\]\n'
