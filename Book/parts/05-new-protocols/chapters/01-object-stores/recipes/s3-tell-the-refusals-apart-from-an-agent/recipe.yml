# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: s3-tell-the-refusals-apart-from-an-agent
title: Telling S3 Refusals Apart from an Agent
protocols: [s3]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, curl, get_events]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, aws-s3-api, rfc8446]

fixtures:
  note.txt: "a note\n"

# A certificate for 127.0.0.1 and for every bucket's host name in us-east-1, good for 30 days,
# signed by its own key; never committed. Both hosts are confined to this folder.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

cases:
  - id: solution
    role: solution
    claim: An agent that sends curl-mcp's curl tool a request with no login, one with an access key the server does not hold and one with the right key and the wrong secret gets exit code 22 each time and three different S3 errors in standard error, AccessDenied, InvalidAccessKeyId and SignatureDoesNotMatch.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^unsigned: exit 22 403 AccessDenied \(.*\nunknown key: exit 22 403 InvalidAccessKeyId \(.*\nwrong secret: exit 22 403 SignatureDoesNotMatch \('

  - id: signed
    claim: The right access key and secret are served, exit 0, and the body is in the tool's standard output.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsigned: exit 0 hello from surl\n'

  - id: signed-put-refused
    claim: A correctly signed put to a server without --allow-uploads is refused 403 AccessDenied, the same code and words as an unsigned request, exit 22.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsigned put: exit 22 403 AccessDenied \(Access Denied\)\n'

  - id: signed-listing-refused
    claim: A correctly signed listing to a server without --list-directories is refused 403 AccessDenied, with the same message as an unsigned request, exit 22.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nsigned listing: exit 22 403 AccessDenied \(Access Denied\)\n'

  - id: unsigned-message
    claim: The unsigned request's message, after the code, is Access Denied, the same words as the refused put and listing.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^unsigned: exit 22 403 AccessDenied \(Access Denied\)\n'

  - id: missing-key
    claim: A key with no object, signed correctly, is 404 NoSuchKey, not a 403, exit 22.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmissing key: exit 22 404 NoSuchKey \('

  - id: missing-bucket
    claim: A bucket that is not in the store, signed correctly, is 404 NoSuchBucket, exit 22.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nmissing bucket: exit 22 404 NoSuchBucket \('

  - id: anonymous-read
    claim: With --allow-anonymous, an unsigned get is served, exit 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanonymous read: exit 0 hello from surl\n'

  - id: anonymous-write
    claim: With --allow-anonymous and --allow-uploads, an unsigned put is still refused 403 AccessDenied, exit 22.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanonymous write: exit 22 403 AccessDenied \('

  - id: anonymous-unknown-key
    claim: With --allow-anonymous, a request signed with an access key the server does not hold is still refused 403 InvalidAccessKeyId.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanonymous unknown key: exit 22 403 InvalidAccessKeyId \('

  - id: anonymous-wrong-secret
    claim: With --allow-anonymous, the right access key with the wrong secret is still refused 403 SignatureDoesNotMatch.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanonymous wrong secret: exit 22 403 SignatureDoesNotMatch \('

  - id: logins-judged
    claim: get_events with the kind login_judged lists the logins the server judged in order, the unknown key refused, the right key with the wrong secret refused and the right key accepted; the unsigned request names no account and is not among them.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlogin_judged: AKIAOTHEREXAMPLE refused\nlogin_judged: AKIAIOSFODNN7EXAMPLE refused\nlogin_judged: AKIAIOSFODNN7EXAMPLE accepted\n'
