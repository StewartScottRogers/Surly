# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: az-list-a-container-from-an-agent
title: Listing a Blob Container from an Agent
protocols: [az]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, curl, list_files]
exit-codes: [0, 22]
references: [surl-readme, curl-readme, azure-blob-api, rfc6750, rfc8446]

fixtures: {}

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
# Both hosts are confined to this folder.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: An agent starts an az server with --list-directories, a Bearer token and an account through surl-mcp, and curl-mcp's curl tool, given the container's path with the prefix 2026/, answers exit code 0 and the two blob names in standard output, in order.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^prefix: exit 0 \[2026/feb\.jpg, 2026/jan\.jpg\]\n'

  - id: top-level
    claim: The container's own URL lists one level, the folders as prefixes ending in a slash and the blobs at the top.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\ntop: exit 0 \[2025/, 2026/, readme\.txt\]\n'

  - id: empty-prefix
    claim: A prefix with nothing under it lists nothing, and that is not an error, exit 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nempty: exit 0 \[\]\n'

  - id: no-such-container
    claim: A container that is not in the store is answered 404 ContainerNotFound in standard error, exit 22, and nothing in standard output.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nno container: exit 22 \[\] Azure Storage returned error 404: ContainerNotFound'

  - id: shared-key-listing
    claim: A listing signed with the account's Shared Key, from -u, is served like one with the Bearer token.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nshared key: exit 0 \[2026/feb\.jpg, 2026/jan\.jpg\]\n'

  - id: no-token-listing
    claim: A listing with no token is refused 401 NoAuthenticationInformation, exit 22, though the server allows listings.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nno token: exit 22 \[\] Azure Storage returned error 401: NoAuthenticationInformation'

  - id: listing-off
    claim: On a server without --list-directories, a listing with the token is refused 403 AuthorizationPermissionMismatch, exit 22.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlisting off: exit 22 \[\] Azure Storage returned error 403: AuthorizationPermissionMismatch'

  - id: listing-off-reads
    claim: On a server without --list-directories, a get of a blob by its name is still served, exit 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlisting off, get: exit 0 \[read me\]\n'

  - id: anonymous-listing
    claim: On a server with --allow-anonymous and --list-directories, a listing with no token is served.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nanonymous: exit 0 \[2026/feb\.jpg, 2026/jan\.jpg\]\n'

  - id: list-files
    claim: surl-mcp's list_files, which asks no permission of any client, lists the same folder photos/2026 of the server's store as the two blob names.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nlist_files: \[feb\.jpg, jan\.jpg\]\n'
