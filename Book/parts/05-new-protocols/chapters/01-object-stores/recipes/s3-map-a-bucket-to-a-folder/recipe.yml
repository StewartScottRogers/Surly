# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: s3-map-a-bucket-to-a-folder
title: Mapping a Bucket to a Folder
protocols: [s3, https]
tier: new-protocols
surl-options: [--directory, --bucket, --cert, --key, --user, --list-directories, --allow-uploads]
curl-options: [--cacert, --connect-to, -u, -T, -s, -S]
exit-codes: [0, 22, 37]
references: [surl-readme, curl-protocols, aws-s3-api, rfc8446, rfc7617]

fixtures:
  up.txt: "uploaded\n"
  data/gallery/sunset.txt: "sunset\n"
  data/gallery/2026/jan.txt: "january\n"
  data/other/o.txt: "other\n"
  spare/gallery/sunset.txt: "sunset\n"

# A certificate for 127.0.0.1 and for every bucket's host name in us-east-1, good for 30 days,
# signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

# main serves the folder data, in which the bucket pics is the folder /gallery, over s3 and, on
# the same store, https.
servers:
  main:
    command: surl --directory data --bucket pics=/gallery --allow-uploads --list-directories --cert server.pem --key server.key --user AKIAIOSFODNN7EXAMPLE:s3cret s3://127.0.0.1:{{port}}/ https://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: With --bucket pics=/gallery, a get of the bucket pics reads the folder data/gallery, and the object sunset.txt is the file data/gallery/sunset.txt, exit 0.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://pics/sunset.txt
    expect:
      exit: 0
      stdout: "sunset\n"

  - id: listing
    claim: Listing the bucket pics lists the folder, one level, the sub-folder as a prefix.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://pics/
    expect:
      exit: 0
      stdout: "2026/\nsunset.txt\n"

  - id: folder-keeps-its-name
    claim: The folder is still a bucket under its own name, and the bucket pics and the bucket gallery read the same file.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://gallery/sunset.txt
    expect:
      exit: 0
      stdout: "sunset\n"

  - id: unmapped-folder
    claim: A folder of the store that --bucket does not name is a bucket under its own name.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://other/o.txt
    expect:
      exit: 0
      stdout: "other\n"

  - id: no-such-bucket
    claim: A bucket that is neither mapped nor a folder is answered 404 NoSuchBucket, exit 22.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret s3://videos/sunset.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "S3 returned error 404: NoSuchBucket"

  - id: https-sees-the-folder
    claim: Over https, on the same store, the file is at its folder's path, /gallery/sunset.txt, and not under the bucket's name.
    run: curl -sS --cacert server.pem -u AKIAIOSFODNN7EXAMPLE:s3cret https://127.0.0.1:{{port2}}/gallery/sunset.txt
    expect:
      exit: 0
      stdout: "sunset\n"

  - id: https-has-no-bucket-names
    claim: Over https, /pics/sunset.txt is not found, since bucket names belong to the object-storage servers; curl -f exits 22.
    run: curl -sS -f --cacert server.pem -u AKIAIOSFODNN7EXAMPLE:s3cret https://127.0.0.1:{{port2}}/pics/sunset.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "returned error: 404"

  - id: missing-folder
    claim: A bucket mapped to a folder that does not exist stops the start with exit 37 and a message that names the folder and the bucket.
    run: surl --directory spare --bucket pics=/nowhere --cert server.pem --key server.key --user AKIAIOSFODNN7EXAMPLE:s3cret s3://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 37
      stdout-matches: '^surl: \(37\) Could not open directory /nowhere for bucket pics'

  - id: put-lands-in-the-folder
    claim: A signed put into the bucket pics writes the file into data/gallery, and the second URL gets it back, exit 0.
    run: curl -sS --cacert server.pem --connect-to ::127.0.0.1:{{port}} -u AKIAIOSFODNN7EXAMPLE:s3cret -T up.txt s3://pics/up.txt s3://pics/up.txt
    expect:
      exit: 0
      stdout: "uploaded\n"
      files:
        data/gallery/up.txt: "uploaded\n"
