# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: s3-upload-a-large-object-in-parts-in-csharp
title: Uploading a Large Object in C#
protocols: [s3]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlServerFiles, SurlFileContents, SurlFolderPage, CurlClient, CurlClientOptions, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlNetworkOptions, CurlTlsOptions, CurlTlsPeerOptions]
exit-codes: [0]
references: [surl-readme, aws-s3-api]

fixtures: {}

# A certificate for 127.0.0.1 and for any bucket's host name in us-east-1, good for 30 days,
# signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:*.s3.us-east-1.amazonaws.com"

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The app starts a multipart upload of 11,000,000 bytes, puts three parts of at most 5 MiB and completes it, each step answered 200; read back from the server's store, the object is 11,000,000 bytes and the same as the data sent.
    program: program.cs
    args: [upload]
    timeout: 180
    expect:
      exit: 0
      stdout: "initiate: 200\npart 1: 200\npart 2: 200\npart 3: 200\ncomplete: 200\nstored: 11000000 bytes, same as the file: True\n"

  - id: too-large
    claim: With 13,000,000 bytes, parts 1 and 2 (10 MiB) are taken and part 3, which takes the upload past MaxFileSize, is answered 400 EntityTooLarge; the server has already dropped the upload, so the abort is answered 404, and the bucket holds nothing.
    program: program.cs
    args: [huge]
    timeout: 180
    expect:
      exit: 0
      stdout: "initiate: 200\npart 1: 200\npart 2: 200\npart 3: 400\nrefused: EntityTooLarge\nabort: 404\nbucket holds: nothing\n"

  - id: single-put-too-large
    claim: The same 13,000,000 bytes sent as one put are refused by the same limit, 400 EntityTooLarge.
    program: program.cs
    args: [single]
    timeout: 180
    expect:
      exit: 0
      stdout: "put: 400 EntityTooLarge\n"

  - id: parts-too-small
    claim: Every part but the last must be at least 5 MiB; in 1,000,000-byte parts all eleven are taken, but the completion is answered 400 EntityTooSmall, the abort of the still-open upload is answered 204, and the bucket holds nothing.
    program: program.cs
    args: [small]
    timeout: 180
    expect:
      exit: 0
      stdout: "initiate: 200\npart 1: 200\npart 2: 200\npart 3: 200\npart 4: 200\npart 5: 200\npart 6: 200\npart 7: 200\npart 8: 200\npart 9: 200\npart 10: 200\npart 11: 200\ncomplete: 400\nrefused: EntityTooSmall\nabort: 204\nbucket holds: nothing\n"
