# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: az-put-and-get-a-blob
title: Putting and Getting an Azure Blob
protocols: [az, https]
tier: new-protocols
surl-options: [--directory, --cert, --key, --user, --allow-uploads, --allow-anonymous]
curl-options: [--cacert, --oauth2-bearer, -u, -T, -s, -S]
exit-codes: [0, 22, 58]
references: [surl-readme, curl-protocols, azure-blob-api, rfc6750, rfc8446]

fixtures:
  note.txt: "uploaded over az\n"
  store/photos/hello.txt: "hello from surl\n"
  noaccount/photos/hello.txt: "hello, no account\n"
  readonly/photos/hello.txt: "hello, read only\n"
  open/photos/hello.txt: "hello to anyone\n"

# A certificate for 127.0.0.1, good for 30 days, signed by its own key; never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main is the recipe: az and, on the same store, https. noaccount holds the token but no
# named storage account; readonly has no --allow-uploads; anonymous adds --allow-anonymous.
# Each serves its own folder: one surl holds a folder at a time.
servers:
  main:
    command: surl --directory store --cert server.pem --key server.key --user devstoreaccount1:c2VjcmV0 --user :t0ken-abc --allow-uploads az://127.0.0.1:{{port}}/ https://127.0.0.1:{{port2}}/
    ready: port
  noaccount:
    command: surl --directory noaccount --cert server.pem --key server.key --user :t0ken-abc az://127.0.0.1:{{port3}}/
    ready: port
  readonly:
    command: surl --directory readonly --cert server.pem --key server.key --user devstoreaccount1:c2VjcmV0 --user :t0ken-abc az://127.0.0.1:{{port4}}/
    ready: port
  anonymous:
    command: surl --directory open --cert server.pem --key server.key --user devstoreaccount1:c2VjcmV0 --allow-anonymous --allow-uploads az://127.0.0.1:{{port5}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: curl -T with the Bearer token puts note.txt as the blob note.txt in the container photos of the account devstoreaccount1, and the second URL, with no -T, gets it back, exit 0; the blob is the file store/photos/note.txt.
    run: curl --cacert server.pem --oauth2-bearer t0ken-abc -T note.txt az://127.0.0.1:{{port}}/devstoreaccount1/photos/note.txt az://127.0.0.1:{{port}}/devstoreaccount1/photos/note.txt
    expect:
      exit: 0
      stdout: "uploaded over az\n"
      files:
        store/photos/note.txt: "uploaded over az\n"

  - id: file-is-a-blob
    claim: A file already in the container's folder is a blob, and is got like one.
    run: curl -s --cacert server.pem --oauth2-bearer t0ken-abc az://127.0.0.1:{{port}}/devstoreaccount1/photos/hello.txt
    expect:
      exit: 0
      stdout: "hello from surl\n"

  - id: blob-over-https
    claim: The blob put over az is served over HTTPS by the same surl at /photos/note.txt, to the same Bearer token.
    run: curl -s --cacert server.pem --oauth2-bearer t0ken-abc https://127.0.0.1:{{port2}}/photos/note.txt
    expect:
      exit: 0
      stdout: "uploaded over az\n"

  - id: no-token
    claim: A request with no token is answered 401 NoAuthenticationInformation; curl writes nothing and exits 22.
    run: curl -sS --cacert server.pem az://127.0.0.1:{{port}}/devstoreaccount1/photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 401: NoAuthenticationInformation"

  - id: wrong-token
    claim: A token surl does not hold is answered 401 InvalidAuthenticationInfo, exit 22.
    run: curl -sS --cacert server.pem --oauth2-bearer t0ken-xyz az://127.0.0.1:{{port}}/devstoreaccount1/photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 401: InvalidAuthenticationInfo"

  - id: no-shared-key
    claim: curl does not sign with an account key, so -u with the account's name and key sends no credentials and is answered 401 NoAuthenticationInformation, exit 22.
    run: curl -sS --cacert server.pem -u devstoreaccount1:c2VjcmV0 az://127.0.0.1:{{port}}/devstoreaccount1/photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 401: NoAuthenticationInformation"

  - id: missing-blob
    claim: A name with no blob is answered 404 BlobNotFound, exit 22.
    run: curl -sS --cacert server.pem --oauth2-bearer t0ken-abc az://127.0.0.1:{{port}}/devstoreaccount1/photos/missing.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 404: BlobNotFound"

  - id: account-not-named
    claim: When surl holds no account named devstoreaccount1, that first segment is read as the container, which does not exist, and the get is answered 404 ContainerNotFound, exit 22.
    run: curl -sS --cacert server.pem --oauth2-bearer t0ken-abc az://127.0.0.1:{{port3}}/devstoreaccount1/photos/hello.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 404: ContainerNotFound"

  - id: needs-a-certificate
    claim: An az listen URL with no certificate stops the start with exit 58 and a message that says so.
    run: surl --user :t0ken-abc az://127.0.0.1:0/ 2>&1
    timeout: 10
    expect:
      exit: 58
      stdout-matches: '^surl: \(58\) az://127\.0\.0\.1:0/ needs a certificate'

  - id: uploads-off
    claim: Without --allow-uploads, a put with the token is refused 403 AuthorizationPermissionMismatch, exit 22.
    run: curl -sS --cacert server.pem --oauth2-bearer t0ken-abc -T note.txt az://127.0.0.1:{{port4}}/devstoreaccount1/photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 403: AuthorizationPermissionMismatch"

  - id: uploads-off-reads
    claim: Without --allow-uploads, a get with the token is still served.
    run: curl -s --cacert server.pem --oauth2-bearer t0ken-abc az://127.0.0.1:{{port4}}/devstoreaccount1/photos/hello.txt
    expect:
      exit: 0
      stdout: "hello, read only\n"

  - id: anonymous-read
    claim: With --allow-anonymous, a get with no token is served.
    run: curl -s --cacert server.pem az://127.0.0.1:{{port5}}/devstoreaccount1/photos/hello.txt
    expect:
      exit: 0
      stdout: "hello to anyone\n"

  - id: anonymous-write
    claim: With --allow-anonymous and --allow-uploads, a put with no token is still refused 401 NoAuthenticationInformation, exit 22.
    run: curl -sS --cacert server.pem -T note.txt az://127.0.0.1:{{port5}}/devstoreaccount1/photos/note.txt
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "Azure Storage returned error 401: NoAuthenticationInformation"
