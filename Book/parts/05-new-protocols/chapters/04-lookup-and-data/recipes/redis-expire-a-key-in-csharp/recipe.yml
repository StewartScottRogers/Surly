# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: redis-expire-a-key-in-csharp
title: Expiring a Redis Key in C#
protocols: [redis]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerKeys, SurlKeyContents, SurlNotFoundException, SurlAccount, CurlClient, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, redis-resp]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A key set with Keys.SetAsync and a one-minute TimeSpan reads back as its string value, with an expiry in the future, through Surl.Api and through Curl.Api; set again with a one-second expiry, two seconds later Keys.GetAsync throws SurlNotFoundException and Curl.Api's GET answers null, a body of one line feed.
    program: program.cs
    args: []
    timeout: 60
    expect:
      exit: 0
      stdout: "before: string \"abc\", expires in the future\ncurl: 4 characters, \"abc\"\nafter: no such key\ncurl: 1 characters, \"\"\n"

  - id: no-expiry
    claim: A key set with no expiry reads back with no expiry time, and Curl.Api reads the same value.
    program: program.cs
    args: [no-expiry]
    expect:
      exit: 0
      stdout: "before: string \"abc\", expires never\ncurl: 4 characters, \"abc\"\n"

  - id: expiry-bounds
    claim: An expiry of zero or of more than 365 days is refused with ArgumentOutOfRangeException; one millisecond is accepted.
    program: program.cs
    args: [bounds]
    expect:
      exit: 0
      stdout: "expiry 00:00:00: refused\nexpiry 366.00:00:00: refused\nexpiry 1 millisecond: accepted\n"

  - id: plaintext-refused
    claim: Without AllowPlaintextAuthentication the account's login over redis:// is refused, and Curl.Api throws a CurlException with code 67 and WRONGPASS in its message.
    program: program.cs
    args: [no-plaintext]
    expect:
      exit: 67
      stdout-matches: '^curl error 67: Redis server answered HELLO with error: WRONGPASS '
