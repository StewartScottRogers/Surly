# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: dns-resolve-names-over-tls-in-csharp
title: Resolving over DNS-over-TLS in C#
protocols: [dns, http]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerZones, SurlServerStartException, CurlClient, CurlRequest, CurlResponse, CurlDnsOptions, CurlNetworkOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlException]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, rfc1035]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The client looks api.example.test up over DNS over TLS, trusting the server's own certificate, gets NOERROR and 127.0.0.1 from the seeded zone, and its call to that address with the name in the URL is answered 200 with the status file.
    program: call-by-name.cs
    args: []
    expect:
      exit: 0
      stdout: "api.example.test: NOERROR, 127.0.0.1\n200 orders api: up\n"

  - id: not-in-zone
    claim: A name under the apex that the zone does not hold is answered NXDOMAIN with no address, and the client makes no call.
    program: call-by-name.cs
    args: [not-in-zone]
    expect:
      exit: 1
      stdout: "old-api.example.test: NXDOMAIN, no address\n"

  - id: untrusted
    claim: Without the server's certificate as an authority the lookup fails with CurlException, curl error 60.
    program: call-by-name.cs
    args: [untrusted]
    expect:
      exit: 1
      stdout: "lookup failed: curl error 60\n"

  - id: no-certificate
    claim: A DNS over TLS listener with neither SelfSigned nor a certificate file is refused at start with SurlServerStartException, exit code 58, CertificateProblem.
    program: call-by-name.cs
    args: [no-certificate]
    expect:
      exit: 1
      stdout: "start refused: exit 58 (CertificateProblem)\n"
