# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: redis-expire-a-key-from-an-agent
title: Expiring a Redis Key from an Agent
protocols: [redis]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, set_key, read_key, curl]
curl-options: [-s, -u]
exit-codes: [0]
references: [surl-readme, curl-readme, curl-protocols, redis-resp, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: set_key with expire_ms 6000 stores a key whose read_key answer holds a time in expires_at, and curl reads it over redis:// with GET and a positive TTL; seven seconds later read_key is a tool error, No such key., GET is null, written as an empty line, and TTL is -2.
    program: program.cs
    args: [expire]
    timeout: 90
    expect:
      exit: 0
      stdout: "set_key expire_ms 6000: 3 bytes\nbefore: read_key: abc, expires_at a time\ncurl GET: exit 0, abc\ncurl TTL: exit 0, positive\nafter: read_key: error: No such key.\ncurl GET: exit 0, null\ncurl TTL: exit 0, -2\n"

  - id: no-expiry
    claim: A key set without expire_ms has no expires_at in read_key's answer and the time to live -1; curl's EXPIRE then puts a limit on it, answers 1, and TTL is positive.
    program: program.cs
    args: [no-expiry]
    expect:
      exit: 0
      stdout: "set_key expire_ms none: 3 bytes\nbefore: read_key: abc, expires_at none\ncurl TTL: exit 0, -1\ncurl EXPIRE: exit 0, 1\ncurl TTL: exit 0, positive\n"

  - id: expire-ms-bounds
    claim: expire_ms below 1 or above 31536000000, 365 days, is refused before surl sees it, as an invalid-params error naming the bound; 1 is accepted.
    program: program.cs
    args: [bounds]
    expect:
      exit: 0
      stdout: "set_key expire_ms 0: refused: Request failed (remote): Invalid params: arguments.expire_ms: expected at least 1\nset_key expire_ms 31536000001: refused: Request failed (remote): Invalid params: arguments.expire_ms: expected at most 31536000000\nset_key expire_ms 1: 3 bytes\n"
