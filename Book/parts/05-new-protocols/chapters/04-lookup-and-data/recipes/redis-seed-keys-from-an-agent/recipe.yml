# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs keys.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: redis-seed-keys-from-an-agent
title: Seeding Redis Keys from an Agent
protocols: [redis]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, set_key, read_key, list_keys, curl]
curl-options: [-s, -S, -u, -d]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, curl-protocols, redis-resp, mcp-spec]

cases:
  - id: solution
    role: solution
    claim: set_key stores greeting in database 0 of a running server and answers the key and its database apart, read_key and list_keys find it there, and curl reads it back over redis:// with alice's login.
    program: keys.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "set_key: greeting in database 0, 5 bytes\nread_key greeting: string, 5 bytes, text \"hello\"\nlist_keys: [greeting], has_more false\ncurl exit 0, output \"hello\\n\"\n"

  - id: client-needs-login
    claim: set_key needs no login, but a client that sends none is refused at HELLO with NOAUTH, and curl exits 67.
    program: keys.cs
    args: [client-needs-login]
    expect:
      exit: 0
      stdout-matches: '\Aset_key: greeting in database 0, 5 bytes\ncurl exit 67, output "", error curl: \(67\) Redis server answered HELLO with error: NOAUTH '

  - id: pattern-and-pages
    claim: list_keys answers keys in order; pattern narrows them with a Redis glob, limit cuts a page short with has_more true, and after_key starts the next page after the key given.
    program: keys.cs
    args: [pattern-and-pages]
    expect:
      exit: 0
      stdout: "set_key: user:2 in database 0, 3 bytes\nset_key: greeting in database 0, 5 bytes\nset_key: user:1 in database 0, 5 bytes\nlist_keys: [user:1, user:2], has_more false\nlist_keys: [greeting], has_more true\nlist_keys: [user:1], has_more true\n"

  - id: curl-writes
    claim: A value curl sets with SET and -d is what read_key then answers.
    program: keys.cs
    args: [curl-writes]
    expect:
      exit: 0
      stdout: "set_key: greeting in database 0, 5 bytes\ncurl exit 0, output \"OK\\n\"\nread_key greeting: string, 7 bytes, text \"changed\"\n"

  - id: database
    claim: set_key with database 2 stores the key where curl's /2/ path reads it, and list_keys of database 0 does not list it.
    program: keys.cs
    args: [database]
    expect:
      exit: 0
      stdout: "set_key: greeting in database 2, 5 bytes\ncurl exit 0, output \"hello\\n\"\nlist_keys: [], has_more false\n"

  - id: bytes
    claim: set_key with value_base64 stores bytes that are not text, and read_key answers them as base64 rather than text.
    program: keys.cs
    args: [bytes]
    expect:
      exit: 0
      stdout: "set_key: raw in database 0, 3 bytes\nread_key raw: string, 3 bytes, base64 AAEC\n"

  - id: expires
    claim: A key set with expire_ms 1000 is gone three seconds later; read_key answers No such key and curl's GET a null, written as an empty line.
    program: keys.cs
    args: [expires]
    timeout: 90
    expect:
      exit: 0
      stdout: "set_key: session in database 0, 3 bytes\nread_key session: error: No such key.\ncurl exit 0, output \"\\n\"\n"

  - id: no-such-key
    claim: read_key of a key nobody set is a tool error, No such key.
    program: keys.cs
    args: [no-such-key]
    expect:
      exit: 0
      stdout: "read_key missing: error: No such key.\n"

  - id: no-redis-listener
    claim: set_key on a server with no Redis listener, here an HTTP one, is a tool error, since that server holds no keyspace.
    program: keys.cs
    args: [no-redis-listener]
    expect:
      exit: 0
      stdout: "set_key greeting: error: Keyspace: A key in database 0 was refused: This instance holds no Redis keyspace.\n"
