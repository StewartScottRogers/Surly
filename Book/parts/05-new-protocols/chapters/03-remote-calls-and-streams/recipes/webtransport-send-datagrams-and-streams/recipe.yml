# The recipe's executable specification. The build generates run.sh, run.ps1 and
# the listings in recipe.adoc from it; verify.py runs every case against the
# pinned surl and curl and writes verified.yml. Edit this, never the generated files.
schema: 2
key: webtransport-send-datagrams-and-streams
title: Sending WebTransport Datagrams
protocols: [webtransport]
tier: new-protocols
surl-options: [--cert, --key, --user]
curl-options: [-d, --data-binary, -u, --cacert, -m, --retry, --retry-all-errors, --retry-delay, -o, -w]
exit-codes: [0, 3, 22, 55]
references: [webtransport-http3, rfc9114, rfc9000, rfc8446, surl-readme, curl-readme, curl-protocols]

# The certificate and its key, and three payloads of exact sizes, are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
  - openssl rand -out big.bin 100000
  - openssl rand -out d1100.bin 1100
  - openssl rand -out d1099.bin 1099

fixtures:
  state.json: '{"player":1,"x":3,"y":4}'
  log.txt: "level 2 loaded"

# WebTransport listens on UDP only, so there is no TCP port to wait for (ready: none).
# The first case waits instead: curl retries until surl answers. Every curl has -m 10, so
# a session that never answers fails in 10 seconds instead of hanging.
servers:
  main:
    command: surl --cert server.pem --key server.key --user player1:secret webtransport://127.0.0.1:{{port}}/
    ready: none

cases:
  - id: wait-for-start
    claim: With --retry 5 --retry-all-errors --retry-delay 1, curl tries again until surl answers, then gets its data echoed, exit 0.
    run: curl -m 10 --retry 5 --retry-all-errors --retry-delay 1 --cacert server.pem -u player1:secret -d ready webtransport://127.0.0.1:{{port}}/game
    timeout: 60
    expect:
      exit: 0
      stdout: "ready"

  - id: solution
    role: solution
    claim: With ?wt=datagram, curl logs in with -u, sends the data as one datagram on the session, and writes the datagram surl echoes back, exit 0.
    run: curl -m 10 --cacert server.pem -u player1:secret -d @state.json "webtransport://127.0.0.1:{{port}}/game?wt=datagram"
    expect:
      exit: 0
      stdout: '{"player":1,"x":3,"y":4}'

  - id: one-way-stream
    claim: With ?wt=uni, curl sends the data on a unidirectional stream, and surl echoes it on a unidirectional stream of its own.
    run: curl -m 10 --cacert server.pem -u player1:secret -d @log.txt "webtransport://127.0.0.1:{{port}}/game?wt=uni"
    expect:
      exit: 0
      stdout: "level 2 loaded"

  - id: two-way-stream
    claim: With no wt= mode, curl sends the data on a bidirectional stream, and surl echoes it on the same stream.
    run: curl -m 10 --cacert server.pem -u player1:secret -d ping webtransport://127.0.0.1:{{port}}/game
    expect:
      exit: 0
      stdout: "ping"

  - id: stream-carries-any-size
    claim: A stream carries data of any size; 100,000 bytes sent with --data-binary on a unidirectional stream come back whole.
    run: curl -m 10 --cacert server.pem -u player1:secret --data-binary @big.bin -o {{null}} -w "%{size_upload} %{size_download}" "webtransport://127.0.0.1:{{port}}/game?wt=uni"
    expect:
      exit: 0
      stdout: "100000 100000"

  - id: datagram-fits
    claim: A datagram of 1,099 bytes, which with the one-byte quarter stream ID makes 1,100, is sent and echoed whole.
    run: curl -m 10 --cacert server.pem -u player1:secret --data-binary @d1099.bin -o {{null}} -w "%{size_upload} %{size_download}" "webtransport://127.0.0.1:{{port}}/game?wt=datagram"
    expect:
      exit: 0
      stdout: "1099 1099"

  - id: datagram-too-big
    claim: A datagram of 1,100 bytes does not fit; curl refuses to send it, exit 55, naming the limit of 1,100 bytes with the quarter stream ID.
    run: curl -m 10 --cacert server.pem -u player1:secret --data-binary @d1100.bin -o {{null}} "webtransport://127.0.0.1:{{port}}/game?wt=datagram"
    expect:
      exit: 55
      stdout: ""
      stderr-contains: "curl: (55) The data does not fit in one datagram: at most 1100 bytes, quarter stream ID included"

  - id: no-login
    claim: A session with no login is refused with HTTP status 401, and curl exits 22, writing nothing.
    run: curl -m 10 --cacert server.pem -d @state.json "webtransport://127.0.0.1:{{port}}/game?wt=datagram"
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "The server refused the WebTransport session: HTTP status 401"

  - id: wrong-password
    claim: A wrong password is refused the same way, 401, exit 22.
    run: curl -m 10 --cacert server.pem -u player1:guess -d @state.json "webtransport://127.0.0.1:{{port}}/game?wt=datagram"
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "The server refused the WebTransport session: HTTP status 401"

  - id: unknown-mode
    claim: A wt= value other than bidi, uni or datagram is refused before anything is sent, exit 3.
    run: curl -m 10 --cacert server.pem -u player1:secret -d x "webtransport://127.0.0.1:{{port}}/game?wt=dgram"
    expect:
      exit: 3
      stdout: ""
      stderr-contains: 'Unknown WebTransport mode "wt=dgram": use wt=bidi, wt=uni or wt=datagram'
