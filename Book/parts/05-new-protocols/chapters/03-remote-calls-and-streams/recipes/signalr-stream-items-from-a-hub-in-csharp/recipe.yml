# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: signalr-stream-items-from-a-hub-in-csharp
title: Streaming from a Hub in C#
protocols: [signalr]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions]
exit-codes: [0, 22]
references: [surl-readme, signalr-hub-protocol, rfc6455]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A client streams Count with 5 from an in-process hub over a WebSocket and receives five item messages, 1 to 5, one at a time, then a completion; the handshake the hub answers is an empty object, and the program exits 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout: "handshake: {}\nCount: item 1\nCount: item 2\nCount: item 3\nCount: item 4\nCount: item 5\nCount: completed after 5 items\n"

  - id: empty-stream
    claim: A stream of no items, Count with 0, is a completion straight away, and the program exits 0.
    program: program.cs
    args: [empty]
    expect:
      exit: 0
      stdout: "handshake: {}\nCount: completed after 0 items\n"

  - id: unknown-method
    claim: A stream invocation of a method the hub does not have is answered with a completion that carries the error Unknown hub method., after no item.
    program: program.cs
    args: [unknown-method]
    expect:
      exit: 22
      stdout: "handshake: {}\nShout: error after 0 items: Unknown hub method.\n"

  - id: wrong-message-type
    claim: Count is a streaming method, so an ordinary invocation of it is refused with The method was invoked with the wrong message type., and so is a stream invocation of Echo, which returns one result.
    program: program.cs
    args: [wrong-type]
    expect:
      exit: 22
      stdout: "handshake: {}\nCount: error after 0 items: The method was invoked with the wrong message type.\nEcho: error after 0 items: The method was invoked with the wrong message type.\n"

  - id: invalid-argument
    claim: Count with -1 is refused with Invalid arguments for the hub method., after no item.
    program: program.cs
    args: [invalid-argument]
    expect:
      exit: 22
      stdout: "handshake: {}\nCount: error after 0 items: Invalid arguments for the hub method.\n"

  - id: refused-by-default
    claim: A hub started without AllowAnonymous refuses the negotiate request with 401 Unauthorized, and the program never reaches the WebSocket.
    program: program.cs
    args: [refused]
    expect:
      exit: 22
      stdout: "negotiate: 401 Unauthorized\n"
