# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: coap-watch-a-resource-change-in-csharp
title: Observing CoAP Resources in C#
protocols: [coap, http]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlContent, UdpClient]
exit-codes: [0]
references: [rfc7252, rfc7641, surl-readme, curl-protocols]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: The gateway's registration is answered 2.05 with Observe 1, Max-Age 60 and setpoint=68; after Curl.Api's CoAP PUT, answered 2.04, the gateway is sent a 2.05 notification with Observe 2 and setpoint=70 within 5 seconds.
    program: observe.cs
    args: [coap]
    expect:
      exit: 0
      stdout: "registered: 2.05, Observe 1, Max-Age 60, \"setpoint=68\"\nPUT answered CoAP/1.0 2.04\nthen: 2.05, Observe 2, Max-Age 60, \"setpoint=70\"\n"

  - id: http-not-at-once
    claim: When Curl.Api replaces the file with an HTTP PUT, answered 204, the gateway is sent nothing within 5 seconds.
    program: observe.cs
    args: [http]
    expect:
      exit: 0
      stdout: "registered: 2.05, Observe 1, Max-Age 60, \"setpoint=68\"\nPUT answered 204\nthen: nothing within 5 s\n"

  - id: delete-ends
    claim: A CoAP DELETE, answered 2.02, sends the gateway a last notification, 4.04 with no Observe and no payload, which ends the observation.
    program: observe.cs
    args: [delete]
    expect:
      exit: 0
      stdout: "registered: 2.05, Observe 1, Max-Age 60, \"setpoint=68\"\nDELETE answered CoAP/1.0 2.02\nthen: 4.04, no Observe, \"\"\n"

  - id: no-uploads
    claim: Without AllowUploads the CoAP PUT is answered 4.05 and the gateway is sent nothing.
    program: observe.cs
    args: [no-uploads]
    expect:
      exit: 0
      stdout: "registered: 2.05, Observe 1, Max-Age 60, \"setpoint=68\"\nPUT answered CoAP/1.0 4.05\nthen: nothing within 5 s\n"

  - id: no-anonymous
    claim: Without AllowAnonymous the CoAP PUT, which carries no login, is answered 4.01 and the gateway is sent nothing; the read is still served.
    program: observe.cs
    args: [no-anonymous]
    expect:
      exit: 0
      stdout: "registered: 2.05, Observe 1, Max-Age 60, \"setpoint=68\"\nPUT answered CoAP/1.0 4.01\nthen: nothing within 5 s\n"
