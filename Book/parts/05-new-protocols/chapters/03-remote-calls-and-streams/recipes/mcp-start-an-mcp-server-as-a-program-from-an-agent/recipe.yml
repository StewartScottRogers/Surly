# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs agent-starts-surl.cs, a C# program on the official
# MCP SDK; here the agent's client starts surl itself, and one case drives curl-mcp.
schema: 2
key: mcp-start-an-mcp-server-as-a-program-from-an-agent
title: Starting MCP over Stdio from an Agent
protocols: [mcp+stdio]
tier: new-protocols
surface: mcp
mcp-tools: [read_file, echo, write_file, curl]
exit-codes: [0, 1]
references: [mcp-spec, surl-readme, curl-readme, curl-protocols]

fixtures:
  site/hello.txt: "hello from surl\n"

cases:
  - id: solution
    role: solution
    claim: The agent's MCP client starts surl with mcp+stdio as its server, which names itself surl, lists read_file and echo, and answers read_file with the file's text and echo with the text it was given.
    program: agent-starts-surl.cs
    args: [call]
    expect:
      exit: 0
      stdout: "server: surl\ntools: read_file, echo\nread_file: hello from surl\necho: hello from the agent\n"

  - id: tool-error
    claim: read_file for a file that is not there is a tool result marked isError, with the text no such file or folder, not a protocol error.
    program: agent-starts-surl.cs
    args: [missing]
    expect:
      exit: 1
      stdout: "server: surl\nisError: True, text: no such file or folder\n"

  - id: no-login
    claim: The session takes no login; with an account given by --user and no --allow-anonymous, the tools are listed all the same.
    program: agent-starts-surl.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "server: surl\ntools: read_file, echo\n"

  - id: uploads-off
    claim: Without --allow-uploads there is no write_file; calling it is JSON-RPC error -32602, which the SDK raises as a protocol error.
    program: agent-starts-surl.cs
    args: [write]
    expect:
      exit: 1
      stdout-matches: '^server: surl\nprotocol error -32602: [^\n]*unknown tool write_file\n$'

  - id: uploads-on
    claim: With --allow-uploads, write_file creates the file in the served directory and answers how many bytes it wrote.
    program: agent-starts-surl.cs
    args: [upload]
    expect:
      exit: 0
      stdout: "server: surl\nwrote 19 bytes to notes.txt\n"
      files:
        site/notes.txt: "written over stdio\n"

  - id: curl-mcp-starts-surl
    claim: curl-mcp's curl tool, given an mcp+stdio URL and -d with a tools/call, starts surl itself and writes the tool's text, exit code 0.
    program: agent-starts-surl.cs
    args: [curl-mcp]
    expect:
      exit: 0
      stdout: "exitCode: 0\nhello from curl-mcp\n"
