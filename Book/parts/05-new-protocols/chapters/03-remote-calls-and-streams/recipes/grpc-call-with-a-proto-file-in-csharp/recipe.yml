# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: grpc-call-with-a-proto-file-in-csharp
title: Calling gRPC with Protos in C#
protocols: [grpc]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, grpc-http2]
triplet: grpc-call-with-a-proto-file

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A request encoded by hand from the field numbers of echo.proto, message as field 1, is answered by the Surl.Api server with a reply of the same bytes, whose field 1 reads hello, and the call ends with status 0.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^echo: request 0A0568656C6C6F, reply 0A0568656C6C6F, message hello, status 0\n'

  - id: streaming
    claim: Expand with count 2 as field 2 answers two reply messages, each decoded by hand, the second with index 1.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nexpand: 2 replies: hi/0, hi/1\n'

  - id: numbers-not-names
    claim: Only the numbers matter on the wire; the same text sent under field 9, which the request type does not have, is not an error and comes back as an empty message.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nfield 9: reply message \[\], status 0\n'

  - id: reflection-by-hand
    claim: Without the file, a ServerReflectionRequest with list_services set is answered with the three services the server serves, the two reflection services and surl.test.Echo.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nreflection lists: grpc\.reflection\.v1\.ServerReflection, grpc\.reflection\.v1alpha\.ServerReflection, surl\.test\.Echo\n'

  - id: curl-api-reflection
    claim: Curl.Api calls Echo by reflection, with no body of its own, and prints the empty reply as {}, which is what the same empty request sent by hand answers, a reply of no bytes.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nCurl\.Api, no body: \{\}\nby hand, empty request: reply of 0 bytes\n'

  - id: curl-api-refusals
    claim: A service reflection does not know throws CurlException with code 22, HttpReturnedError, and a method the service does not have throws code 2, FailedInit.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nCurl\.Api, unknown service: CurlException 22 HttpReturnedError\nCurl\.Api, unknown method: CurlException 2 FailedInit\n$'
