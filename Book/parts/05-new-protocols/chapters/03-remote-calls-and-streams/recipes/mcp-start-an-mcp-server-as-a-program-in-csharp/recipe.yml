# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: mcp-start-an-mcp-server-as-a-program-in-csharp
title: Starting MCP over Stdio in C#
protocols: [mcp+stdio]
tier: new-protocols
surface: csharp
api-types: [CurlClient, CurlRequest, CurlResponse, SurlServer, SurlServerOptions, Process, ProcessStartInfo, JsonNode]
exit-codes: [0, 1]
references: [mcp-spec, surl-readme, curl-readme, curl-protocols]

fixtures:
  site/hello.txt: "hello from surl\n"

# No servers: block. Each case's program starts its own surl over standard input and output.

cases:
  - id: solution
    role: solution
    claim: The program starts surl with mcp+stdio, initializes the session, calls read_file and prints the file's text; when it closes surl's standard input, surl exits 0, and its log went to standard error.
    program: start-over-stdio.cs
    args: [call]
    expect:
      exit: 0
      stdout: "server: surl\nhello from surl\nsurl exited 0\nsurl's log: Listening on mcp+stdio:\n"

  - id: curl-api-lists
    claim: Curl.Api, given an mcp+stdio URL, starts surl with the query's items as its arguments and answers its tools as the body, one per line as name, tab, description.
    program: start-over-stdio.cs
    args: [list]
    expect:
      exit: 0
      stdout: "read_file\tRead one file Surl serves.\necho\tReturn the text it is given, unchanged.\n"

  - id: curl-api-sends-no-call
    claim: Curl.Api 0.2.0 does not send a Body as a tools/call over MCP; a request with one still answers the list of tools.
    program: start-over-stdio.cs
    args: [curl-body]
    expect:
      exit: 0
      stdout: "read_file\tRead one file Surl serves.\necho\tReturn the text it is given, unchanged.\n"

  - id: no-login
    claim: The session takes no login; with an account and no --allow-anonymous, tools/list still answers read_file and echo.
    program: start-over-stdio.cs
    args: [no-login]
    expect:
      exit: 0
      stdout: "server: surl\ntools: read_file, echo\nsurl exited 0\nsurl's log: Listening on mcp+stdio:\n"

  - id: uploads-off
    claim: Without --allow-uploads, write_file is not a tool of the session; tools/call answers JSON-RPC error -32602.
    program: start-over-stdio.cs
    args: [write]
    expect:
      exit: 1
      stdout: "server: surl\nerror -32602: Invalid params: unknown tool write_file\nsurl exited 0\nsurl's log: Listening on mcp+stdio:\n"

  - id: uploads-on
    claim: With --allow-uploads, write_file creates the file in the served directory and answers how many bytes it wrote.
    program: start-over-stdio.cs
    args: [upload]
    expect:
      exit: 0
      stdout: "server: surl\nwrote 19 bytes to notes.txt\nsurl exited 0\nsurl's log: Listening on mcp+stdio:\n"
      files:
        site/notes.txt: "written over stdio\n"

  - id: not-in-process
    claim: Surl.Api does not host an mcp+stdio listen URL in the calling process; StartAsync throws.
    program: start-over-stdio.cs
    args: [in-process]
    expect:
      exit: 1
      stdout: "StartAsync refused mcp+stdio: (UriFormatException)\n"
