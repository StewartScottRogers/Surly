# Executable specification for a recipe whose subject is surl-mcp and curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs a C# program on the official MCP SDK that starts
# both hosts from PATH and calls their tools. key MUST equal the folder name and never changes.
schema: 2
key: amqp-browse-a-queue-from-an-agent
title: Browsing a Queue from an Agent
protocols: [amqp]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, curl, wait_for_event, browse_queue]
curl-options: [-s, -S, -d]
exit-codes: [0, 67]
references: [surl-readme, curl-readme, amqp091, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: After an app queues three jobs with curl-mcp, browse_queue lists them in the order sent at positions 0, 1 and 2 with ready_count 3 and in_flight_count 0, and a second browse answers the same.
    program: program.cs
    args: [browse]
    timeout: 90
    expect:
      exit: 0
      stdout: "browse: ready 3, in flight 0\n  0 resize cat.png\n  1 resize dog.png\n  2 mail ann\nbrowse again: ready 3, in flight 0\n  0 resize cat.png\n  1 resize dog.png\n  2 mail ann\n"

  - id: paging
    claim: With a limit of 2 the first page holds positions 0 and 1 with has_more true, and a browse with after_position 1 holds position 2 with has_more false.
    program: program.cs
    args: [paging]
    timeout: 90
    expect:
      exit: 0
      stdout: "page after -1: 0 resize cat.png, 1 resize dog.png (has_more True)\npage after 1: 2 mail ann (has_more False)\n"

  - id: browse-takes-nothing
    claim: A worker that takes a job with curl after the agent has browsed gets the first job, resize cat.png, and the next browse lists the other two with ready_count 2.
    program: program.cs
    args: [untouched]
    timeout: 90
    expect:
      exit: 0
      stdout: "browse: ready 3, in flight 0\n  0 resize cat.png\n  1 resize dog.png\n  2 mail ann\nbrowse again: ready 3, in flight 0\n  0 resize cat.png\n  1 resize dog.png\n  2 mail ann\nworker took: resize cat.png\nbrowse after the worker: ready 2, in flight 0\n  0 resize dog.png\n  1 mail ann\n"

  - id: empty-queue
    claim: A queue nothing was sent to answers ready_count 0 and no messages, which is a result and not a tool error.
    program: program.cs
    args: [empty]
    timeout: 90
    expect:
      exit: 0
      stdout: "browse: ready 0, in flight 0\nbrowse again: ready 0, in flight 0\n"

  - id: no-such-queue
    claim: A queue the server was not started with is a tool error that reads No queue nope.
    program: program.cs
    args: [no-queue]
    timeout: 90
    expect:
      exit: 0
      stdout: "browse of nope: tool error True, No queue nope.\n"

  - id: anonymous-refused
    claim: Without --allow-anonymous the app is refused, curl exits 67 with the CRAM-MD5 text, and the queue holds nothing.
    program: program.cs
    args: [closed]
    timeout: 90
    expect:
      exit: 0
      stdout: "app could not queue: exit 67 (curl: (67) AMQP server offers no mechanism this client can use (it offers \"CRAM-MD5\"))\nbrowse: ready 0, in flight 0\nbrowse again: ready 0, in flight 0\n"
