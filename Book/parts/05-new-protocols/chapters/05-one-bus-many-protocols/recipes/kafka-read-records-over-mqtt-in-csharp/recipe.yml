# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: kafka-read-records-over-mqtt-in-csharp
title: From Kafka to MQTT in C#
protocols: [kafka, mqtt5]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlLogPage, SurlNotFoundException, CurlClient, CurlRequest, CurlResponse, CurlContent, CurlException]
exit-codes: [0]
references: [kafka-protocol, mqtt5, surl-readme, curl-protocols]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A record Curl.Api produces to the Kafka topic shop.orders is sent to a later Curl.Api MQTT 5 subscribe of shop/orders as the payload alone.
    program: kafka-to-mqtt.cs
    args: []
    expect:
      exit: 0
      stdout: "MQTT subscriber of shop/orders: [order-1001 placed]\n"

  - id: latest
    claim: After two records the MQTT subscriber is sent only the second, while a Kafka consumer of shop.orders reads both, a line each.
    program: kafka-to-mqtt.cs
    args: [latest]
    expect:
      exit: 0
      stdout: "MQTT subscriber of shop/orders: [order-1002 placed]\nKafka consumer of shop.orders: [order-1001 placed|order-1002 placed|]\n"

  - id: names
    claim: The store names the topic the MQTT way; ReadLogAsync of shop/orders holds the record at offset 0, ReadLogAsync of shop.orders throws SurlNotFoundException, and a Kafka consume of shop/orders throws CurlException 3, UrlMalformat.
    program: kafka-to-mqtt.cs
    args: [names]
    expect:
      exit: 0
      stdout: "MQTT subscriber of shop/orders: [order-1001 placed]\nReadLogAsync(\"shop/orders\"): 0 order-1001 placed\nReadLogAsync(\"shop.orders\"): No log for topic shop.orders.\nKafka consumer of shop/orders: 3 UrlMalformat: Kafka partition in the URL is not a number\n"

  - id: no-filter
    claim: Without a Topics filter the record is produced but not kept, and the later MQTT subscriber is sent nothing.
    program: kafka-to-mqtt.cs
    args: [no-filter]
    expect:
      exit: 0
      stdout: "MQTT subscriber of shop/orders: []\n"

  - id: no-anonymous
    claim: Without AllowAnonymous a producer with no login is disconnected; Curl.Api throws CurlException 56, RecvError.
    program: kafka-to-mqtt.cs
    args: [no-anonymous]
    expect:
      exit: 0
      stdout: "refused: 56 RecvError: Connection disconnected\n"
