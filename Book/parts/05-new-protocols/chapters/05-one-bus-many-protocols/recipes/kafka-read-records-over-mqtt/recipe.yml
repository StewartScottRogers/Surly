# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: kafka-read-records-over-mqtt
title: Reading Kafka Records over MQTT
protocols: [kafka, mqtt5]
tier: new-protocols
surl-options: [--allow-anonymous, --topic, --mqtt5-disconnect-after-retained]
curl-options: [-s, -S, -d, -m, --next]
exit-codes: [0, 3, 56]
references: [kafka-protocol, mqtt5, surl-readme, curl-protocols]

# main puts Kafka and MQTT 5 on one bus and keeps the last message on every topic under shop/.
# plain is the same with no --topic, so it keeps nothing. locked has no --allow-anonymous.
servers:
  plain:
    command: surl --allow-anonymous --mqtt5-disconnect-after-retained kafka://127.0.0.1:{{port3}}/ mqtt5://127.0.0.1:{{port4}}/
    ready: port
  locked:
    command: surl --topic "shop/#;retain" --mqtt5-disconnect-after-retained kafka://127.0.0.1:{{port5}}/ mqtt5://127.0.0.1:{{port6}}/
    ready: port
  main:
    command: surl --allow-anonymous --topic "shop/#;retain" --mqtt5-disconnect-after-retained kafka://127.0.0.1:{{port}}/ mqtt5://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A record curl produces to the Kafka topic shop.orders is sent to a later MQTT 5 subscriber of shop/orders as the payload alone, and the subscribe ends by itself with exit 0.
    run: curl -s -S -d "order-1001 placed" kafka://127.0.0.1:{{port}}/shop.orders --next -s -S -m 10 mqtt5://127.0.0.1:{{port2}}/shop/orders
    expect:
      exit: 0
      stdout: "order-1001 placed"

  - id: latest-only
    claim: After a second record the MQTT subscriber is sent only the latest, while a Kafka consumer of shop.orders still reads both, in order.
    run: curl -s -S -d "order-1002 placed" kafka://127.0.0.1:{{port}}/shop.orders --next -s -S -m 10 mqtt5://127.0.0.1:{{port2}}/shop/orders --next -s -S -m 10 kafka://127.0.0.1:{{port}}/shop.orders
    expect:
      exit: 0
      stdout: "order-1002 placedorder-1001 placed\norder-1002 placed\n"

  - id: dot-is-not-slash
    claim: An MQTT subscriber of shop.orders, the Kafka spelling, is sent nothing.
    run: curl -s -S -m 10 mqtt5://127.0.0.1:{{port2}}/shop.orders
    expect:
      exit: 0
      stdout: ""

  - id: wildcard
    claim: An MQTT subscriber of shop/# is sent the record kept on shop/orders.
    run: curl -s -S -m 10 mqtt5://127.0.0.1:{{port2}}/shop/%23
    expect:
      exit: 0
      stdout: "order-1002 placed"

  - id: slash-in-kafka-url
    claim: The MQTT spelling in a Kafka URL is refused by curl before it connects, exit 3, since the part after the slash is read as a partition.
    run: curl -s -S -m 10 kafka://127.0.0.1:{{port}}/shop/orders
    expect:
      exit: 3
      stderr-contains: "Kafka partition in the URL is not a number"

  - id: mqtt-publish
    claim: The other way round, curl publishes a message over MQTT 5 to shop/orders, exit 0.
    run: curl -s -S -d "order-1003 placed" mqtt5://127.0.0.1:{{port2}}/shop/orders
    expect:
      exit: 0
      stdout: ""

  - id: mqtt-to-kafka
    claim: That message is appended to the Kafka topic shop.orders as its third record, offset 2.
    run: curl -s -S -m 10 "kafka://127.0.0.1:{{port}}/shop.orders?offset=2"
    expect:
      exit: 0
      stdout: "order-1003 placed\n"

  - id: no-filter
    claim: On a server with no --topic filter the record is accepted but not kept, and the later MQTT subscriber is sent nothing.
    run: curl -s -S -d "order-1001 placed" kafka://127.0.0.1:{{port3}}/shop.orders --next -s -S -m 10 mqtt5://127.0.0.1:{{port4}}/shop/orders
    expect:
      exit: 0
      stdout: ""

  - id: no-anonymous
    claim: Without --allow-anonymous a Kafka producer with no login is disconnected, exit 56.
    run: curl -s -S -m 10 -d "order-1001 placed" kafka://127.0.0.1:{{port5}}/shop.orders
    expect:
      exit: 56
      stderr-contains: "Connection disconnected"
