# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: stomp-send-and-read-over-mqtt-in-csharp
title: From STOMP to MQTT in C#
protocols: [stomp, mqtt]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlEventQuery, CurlClient, CurlRequest, CurlResponse, CurlContent]
exit-codes: [0]
references: [surl-readme, curl-readme, stomp12, mqtt311]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A body Curl.Api sends over STOMP to /topic/devices/lamp/state is kept as a retained message on the MQTT topic devices/lamp/state, and a later MQTT subscribe is sent it, 22 bytes with its two-byte length and topic.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout: "devices/lamp/state: on\n1 retained, 22 bytes\n"

  - id: latest-wins
    claim: A second STOMP send to the same topic replaces the first; the MQTT subscribe is sent only the second.
    program: program.cs
    args: [latest-wins]
    expect:
      exit: 0
      stdout: "devices/fan/state: off\n1 retained, 22 bytes\n"

  - id: empty-clears
    claim: A STOMP send with an empty body clears the retained message, and the MQTT subscribe is sent nothing.
    program: program.cs
    args: [empty-clears]
    expect:
      exit: 0
      stdout: "0 retained, 0 bytes\n"

  - id: wildcard
    claim: An MQTT subscribe to devices/hall/# is sent the retained messages of both topics under it, 48 bytes in all.
    program: program.cs
    args: [wildcard]
    expect:
      exit: 0
      stdout: "devices/hall/humidity: 55\ndevices/hall/temp: 21.5\n2 retained, 48 bytes\n"

  - id: outside-the-filter
    claim: A STOMP send to a topic outside every Topics filter is accepted without an error and nothing is kept; the MQTT subscribe is sent nothing.
    program: program.cs
    args: [outside-the-filter]
    expect:
      exit: 0
      stdout: "0 retained, 0 bytes\n"

  - id: no-filter
    claim: A server given no Topics filter keeps nothing either; the MQTT subscribe to the topic just sent over STOMP is sent nothing.
    program: program.cs
    args: [no-filter]
    expect:
      exit: 0
      stdout: "0 retained, 0 bytes\n"

  - id: queue-is-not-a-topic
    claim: A STOMP send to /queue/devices/jobs goes to a queue, not to an MQTT topic; the MQTT subscribe to devices/jobs is sent nothing.
    program: program.cs
    args: [queue-is-not-a-topic]
    expect:
      exit: 0
      stdout: "0 retained, 0 bytes\n"

  - id: stomp-subscriber
    claim: A STOMP subscribe to the topic is sent nothing, 0 bytes, though the MQTT subscribe to the same topic is sent the retained message; surl ends the idle STOMP subscription by itself.
    program: program.cs
    args: [stomp-subscriber]
    expect:
      exit: 0
      stdout: "devices/lamp/state: on\n1 retained, 22 bytes\nSTOMP subscriber was sent 0 bytes\n"
