# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: nats-join-two-names-with-a-topic-map-in-csharp
title: Mapping Topics between Protocols in C#
protocols: [nats, mqtt]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlServerStartException, CurlClient, CurlRequest, CurlResponse, CurlContent, CurlException]
exit-codes: [0, 1, 2]
references: [surl-readme, nats-protocol, mqtt311]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: With TopicMaps joining nats:orders.created to mqtt:shop/orders/new, a NATS publish of paid to orders.created is read back by an MQTT subscriber to shop/orders/new.
    program: map-topics.cs
    args: []
    expect:
      exit: 0
      stdout: "MQTT shop/orders/new: paid\n"

  - id: back
    claim: The other way, an MQTT publish of shipped to shop/orders/new reaches a NATS subscriber to orders.created, subscribed first and sent the publish until it has one, for at most ten seconds.
    program: map-topics.cs
    args: [back]
    expect:
      exit: 0
      stdout: "NATS orders.created: shipped\n"

  - id: without-map
    claim: With no topic map, the NATS publish to orders.created lands on the MQTT topic orders/created, dots for slashes, and shop/orders/new holds nothing.
    program: map-topics.cs
    args: [nomap]
    expect:
      exit: 0
      stdout: "MQTT orders/created: paid\nMQTT shop/orders/new: (nothing)\n"

  - id: wildcard-refused
    claim: A map whose NATS side holds a wildcard is refused at start; StartAsync throws SurlServerStartException with exit code 2 and surl's line, not a valid name for nats.
    program: map-topics.cs
    args: [wildcard]
    expect:
      exit: 2
      stdout: "refused at start, exit 2: (2) option --topic-map: not a valid name for nats\n"

  - id: no-login-refused
    claim: Without AllowAnonymous, the NATS publish with no login throws CurlException with code 67, Authorization Violation.
    program: map-topics.cs
    args: [locked]
    expect:
      exit: 1
      stdout: "NATS publish refused: curl 67 NATS server refused the login: Authorization Violation\n"
