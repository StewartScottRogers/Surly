# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs kafka-to-mqtt.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: kafka-read-records-over-mqtt-from-an-agent
title: From Kafka to MQTT from an Agent
protocols: [kafka, mqtt5]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, curl, read_retained_message, read_log, publish_message]
curl-options: [-s, -S, -m, -d]
exit-codes: [0]
references: [kafka-protocol, mqtt5, surl-readme, curl-protocols, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A record the curl tool produces to the Kafka topic shop.orders, exit 0, is sent to a later curl tool subscribe of the MQTT 5 topic shop/orders as the payload alone.
    program: kafka-to-mqtt.cs
    args: [transfer]
    expect:
      exit: 0
      stdout: "producer exit 0\nMQTT subscriber of shop/orders: [order-1001 placed]\n"

  - id: store
    claim: The store names the topic the MQTT way; read_retained_message and read_log of shop/orders hold the record, read_log at offset 0, while read_log of shop.orders is a tool error, No log for topic shop.orders.
    program: kafka-to-mqtt.cs
    args: [store]
    expect:
      exit: 0
      stdout: "producer exit 0\nMQTT subscriber of shop/orders: [order-1001 placed]\nread_retained_message shop/orders: order-1001 placed\nread_log shop/orders: 0 order-1001 placed\nread_log shop.orders: tool error True, No log for topic shop.orders.\n"

  - id: reverse
    claim: The other way round, publish_message to the topic shop/orders appends a record that a Kafka consumer of shop.orders reads.
    program: kafka-to-mqtt.cs
    args: [reverse]
    expect:
      exit: 0
      stdout: "Kafka consumer of shop.orders: [order-1001 placed|]\n"

  - id: no-anonymous
    claim: Without --allow-anonymous a producer with no login is disconnected, curl exit 56.
    program: kafka-to-mqtt.cs
    args: [no-anonymous]
    expect:
      exit: 0
      stdout: "producer exit 56 curl: (56) Connection disconnected\n"
