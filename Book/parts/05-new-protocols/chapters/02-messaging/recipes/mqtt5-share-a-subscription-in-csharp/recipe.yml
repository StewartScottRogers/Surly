# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
# key MUST equal the folder name and never changes once published.
schema: 2
key: mqtt5-share-a-subscription-in-csharp
title: Sharing MQTT Subscriptions in C#
protocols: [mqtt5, mqtt]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, CurlClient, CurlRequest, CurlResponse, CurlContent, CurlException]
exit-codes: [0]
references: [mqtt5, surl-readme, curl-protocols]

fixtures: {}

# No servers: block. The program hosts its own server through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: Of six jobs the app publishes, the two workers subscribed to $share/workers/jobs hold job-1 to job-6 between them, none twice and each worker at least one, while the monitor subscribed to jobs is sent all six; the test passes.
    program: share.cs
    args: []
    expect:
      exit: 0
      stdout: "monitor: 6 jobs\nPASS: each job went to one worker, and both workers had some\nbetween them: job-1 job-2 job-3 job-4 job-5 job-6\n"

  - id: late
    claim: After the run a worker that joins the group is sent nothing in 3 seconds, not even the retained job-6, while a plain subscriber to jobs is sent job-6.
    program: share.cs
    args: [late]
    expect:
      exit: 0
      stdout: "monitor: 6 jobs\nPASS: each job went to one worker, and both workers had some\nbetween them: job-1 job-2 job-3 job-4 job-5 job-6\nlate worker: []\nlate plain subscriber: [job-6]\n"

  - id: no-share-topic
    claim: A subscription to $share/workers, with no topic filter after the share name, throws CurlException 3, UrlMalformat, before it subscribes.
    program: share.cs
    args: [no-share-topic]
    expect:
      exit: 0
      stdout: "refused: 3 UrlMalformat: Invalid MQTT 5 topic: \"$share/workers\" has no ShareName followed by '/'.\n"

  - id: no-anonymous
    claim: Without AllowAnonymous a worker with no login throws CurlException 67, LoginDenied, with reason code 0x87.
    program: share.cs
    args: [no-anonymous]
    expect:
      exit: 0
      stdout: "refused: 67 LoginDenied: MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"
