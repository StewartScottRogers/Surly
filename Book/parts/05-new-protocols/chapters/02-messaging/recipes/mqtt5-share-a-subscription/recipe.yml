# Executable specification. key MUST equal the folder name and never changes once published.
schema: 2
key: mqtt5-share-a-subscription
title: Sharing a Subscription between Workers
protocols: [mqtt5]
tier: new-protocols
surl-options: [--allow-anonymous, --topic]
curl-options: [-s, -S, -m, -o, --data-binary]
exit-codes: [0, 3, 28, 67]
references: [mqtt5, surl-readme, curl-protocols]

# share.sh is the test: two workers in one shared group and a monitor outside it, then six jobs.
fixtures:
  share.sh: |
    #!/bin/sh
    # Copyright (c) 2026 Stewart Rogers. Apache License 2.0. See Book/LICENSE-CODE.txt.
    # Usage: sh share.sh PORT. Two workers subscribe to the shared subscription $share/workers/jobs and a
    # monitor subscribes to jobs on its own, each writing what it is sent to a file. Once all three hold a
    # ping (the group hands each ping to one worker, so both workers are subscribed), six jobs are published
    # to jobs. When the workers hold all six between them, or after 20 s more, it stops the three and prints
    # how many jobs each was sent. It gives up after 40 pings.
    url="mqtt5://127.0.0.1:$1"
    rm -f worker1.txt worker2.txt monitor.txt
    curl -s -m 120 "$url/%24share/workers/jobs" -o worker1.txt &
    w1=$!
    curl -s -m 120 "$url/%24share/workers/jobs" -o worker2.txt &
    w2=$!
    curl -s -m 120 "$url/jobs" -o monitor.txt &
    m=$!
    tries=0
    until [ -s worker1.txt ] && [ -s worker2.txt ] && [ -s monitor.txt ]; do
      tries=$((tries + 1))
      if [ "$tries" -gt 40 ]; then echo "not all subscribed after 40 pings" >&2; kill "$w1" "$w2" "$m"; exit 1; fi
      printf 'ping\n' | curl -s --data-binary @- "$url/jobs"
      sleep 0.5
    done
    for n in 1 2 3 4 5 6; do
      printf 'job-%s\n' "$n" | curl -s --data-binary @- "$url/jobs"
    done
    tries=0
    until [ "$(cat worker1.txt worker2.txt | grep -c job)" -ge 6 ] && [ "$(grep -c job monitor.txt)" -ge 6 ]; do
      tries=$((tries + 1))
      if [ "$tries" -gt 40 ]; then break; fi
      sleep 0.5
    done
    kill "$w1" "$w2" "$m"
    echo "worker 1: $(grep -c job worker1.txt) jobs"
    echo "worker 2: $(grep -c job worker2.txt) jobs"
    echo "monitor: $(grep -c job monitor.txt) jobs"

# main keeps the last message on jobs (--topic "jobs;retain") for subscribers who come later.
# locked is the same broker without --allow-anonymous.
servers:
  locked:
    command: surl --topic "jobs;retain" mqtt5://127.0.0.1:{{port2}}/
    ready: port
  main:
    command: surl --allow-anonymous --topic "jobs;retain" mqtt5://127.0.0.1:{{port}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Of six jobs published to jobs, each of the two workers sharing $share/workers/jobs is sent at least one and at most five, while the monitor subscribed to jobs on its own is sent all six.
    run: sh share.sh {{port}}
    timeout: 150
    expect:
      exit: 0
      stdout-matches: '\Aworker 1: [1-5] jobs\nworker 2: [1-5] jobs\nmonitor: 6 jobs\n\Z'

  - id: each-once
    claim: Between them the two workers were sent each of job-1 to job-6 exactly once.
    run: sh -c "cat worker1.txt worker2.txt | grep job | sort"
    expect:
      exit: 0
      stdout: "job-1\njob-2\njob-3\njob-4\njob-5\njob-6\n"

  - id: late-member-no-retained
    claim: A worker that joins the group later is not sent the retained message, job-6; it is sent nothing and curl ends at -m 3 with exit 28.
    run: curl -s -m 3 mqtt5://127.0.0.1:{{port}}/%24share/workers/jobs
    expect:
      exit: 28
      stdout: ""

  - id: late-plain-retained
    claim: A plain subscriber to jobs that comes as late is sent the retained job-6 at once, and ends at -m 3 with exit 28.
    run: curl -s -m 3 mqtt5://127.0.0.1:{{port}}/jobs
    expect:
      exit: 28
      stdout: "job-6\n"

  - id: no-share-name-topic
    claim: A shared filter with no topic filter after the group name, $share/workers, is refused by curl before it subscribes, exit 3.
    run: curl -s -S -m 5 mqtt5://127.0.0.1:{{port}}/%24share/workers
    expect:
      exit: 3
      stderr-contains: 'Invalid MQTT 5 topic: "$share/workers" has no ShareName followed by'

  - id: no-anonymous
    claim: Without --allow-anonymous a worker with no login is refused at CONNECT, reason code 0x87 Not authorized, exit 67.
    run: curl -s -S -m 5 mqtt5://127.0.0.1:{{port2}}/%24share/workers/jobs
    expect:
      exit: 67
      stderr-contains: "MQTT 5 CONNACK reason code 0x87 NotAuthorized"
