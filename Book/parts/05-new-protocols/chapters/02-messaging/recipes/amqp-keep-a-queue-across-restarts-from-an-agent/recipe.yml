# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs program.cs, a C# program on the official MCP SDK that
# starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: amqp-keep-a-queue-across-restarts-from-an-agent
title: Durable AMQP Queues from an Agent
protocols: [amqp]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, stop_server, wait_for_event, browse_queue, curl]
curl-options: [-s, -S, -d]
exit-codes: [0]
references: [surl-readme, curl-readme, amqp091]
triplet: amqp-keep-a-queue-across-restarts

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: After stop_server and a second start_server with the same --directory, the curl tool receiving from the durable queue jobs answers job-2, the oldest message not taken before the restart; job-1, taken before it, is not back.
    program: program.cs
    args: [restart]
    expect:
      exit: 0
      stdout: "worker took: job-1\nafter the restart: job-2\n"

  - id: scratch-is-empty
    claim: A queue that is not durable starts empty after the restart even though the server has a directory; its message tmp is gone and a receive answers empty output.
    program: program.cs
    args: [scratch]
    expect:
      exit: 0
      stdout-matches: '\nscratch after the restart: \[\]\n$'

  - id: on-disk
    claim: The queue is stored in the folder the server was given, an index under .surl/bus/queues beside the lock file, while the server runs and after stop_server.
    program: program.cs
    args: [disk]
    expect:
      exit: 0
      stdout: "worker took: job-1\nrunning: lock True, index True\nstopped: lock True, index True\n"

  - id: second-restart
    claim: A second restart keeps what is left, in the order queued; the next two receives answer job-3, from before the first restart, and job-4, queued after it.
    program: program.cs
    args: [twice]
    expect:
      exit: 0
      stdout-matches: '\nafter the second restart: job-3 then job-4\n'

  - id: taken-stays-taken
    claim: After the last receive a third restart finds the queue empty; a taken message does not come back.
    program: program.cs
    args: [twice]
    expect:
      exit: 0
      stdout-matches: '\nafter the third restart: \[\]\n$'

  - id: memory-holds
    claim: A server with a durable queue but no --directory holds the jobs while it runs; after the worker takes job-1, browse_queue counts two ready.
    program: program.cs
    args: [memory]
    expect:
      exit: 0
      stdout-matches: '\nwhile it runs, jobs holds 2\n'

  - id: memory-forgets
    claim: Without --directory, durable keeps nothing; after a restart browse_queue counts none ready on the queue jobs.
    program: program.cs
    args: [memory]
    expect:
      exit: 0
      stdout-matches: '\nafter a restart, jobs holds 0\n$'
