# Executable specification for a recipe whose subject is surl-mcp or curl-mcp, the two programs as an
# AI agent drives them (ADR-0008). Each case runs discover.cs, a C# program on the official MCP SDK
# that starts both hosts from PATH; its argument picks the scenario.
schema: 2
key: xmpp-ask-what-a-server-offers-from-an-agent
title: Asking What XMPP Offers from an Agent
protocols: [xmpp]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, get_exchanges, curl]
curl-options: [--cacert, -u, -s, -S]
exit-codes: [0, 8, 60, 67]
references: [surl-readme, curl-readme, rfc6120, rfc8446]
triplet: xmpp-ask-what-a-server-offers

# The certificate and its key are made here, never committed; both hosts are confined to this folder.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: The curl tool, with --cacert and -u alice:s3cret and the server's domain as the path, answers exit 0 and the disco info of a server, an identity of category server and type im and the features info, items and ping, with no tool error.
    program: discover.cs
    args: [solution]
    expect:
      exit: 0
      stdout: "curl exit 0, tool error no: <query xmlns=\"http://jabber.org/protocol/disco#info\"><identity category=\"server\" type=\"im\" /><feature var=\"http://jabber.org/protocol/disco#info\" /><feature var=\"http://jabber.org/protocol/disco#items\" /><feature var=\"urn:xmpp:ping\" /></query>\n"

  - id: account
    claim: Asking alice@127.0.0.1 answers an identity of category account and type registered and the info and items features alone.
    program: discover.cs
    args: [account]
    expect:
      exit: 0
      stdout: "curl exit 0, tool error no: <query xmlns=\"http://jabber.org/protocol/disco#info\"><identity category=\"account\" type=\"registered\" /><feature var=\"http://jabber.org/protocol/disco#info\" /><feature var=\"http://jabber.org/protocol/disco#items\" /></query>\n"

  - id: items-not-asked
    claim: With ?disco;items on the path curl prints the info answer, and get_exchanges shows why, the one question the server received from curl was an IQ get to 127.0.0.1 with a query in the disco#info namespace.
    program: discover.cs
    args: [items-not-asked]
    expect:
      exit: 0
      stdout: "curl exit 0, tool error no: <query xmlns=\"http://jabber.org/protocol/disco#info\"><identity category=\"server\" type=\"im\" /><feature var=\"http://jabber.org/protocol/disco#info\" /><feature var=\"http://jabber.org/protocol/disco#items\" /><feature var=\"urn:xmpp:ping\" /></query>\ncurl asked: <iq type=\"get\" id=\"disco\" to=\"127.0.0.1\" xmlns=\"jabber:client\"><query xmlns=\"http://jabber.org/protocol/disco#info\" /></iq>\n"

  - id: stanza-errors
    claim: An unknown node, an account with no stream bound and a domain the server does not serve are each a tool error, curl exit 8, naming the stanza error item-not-found, service-unavailable and remote-server-not-found.
    program: discover.cs
    args: [stanza-errors]
    expect:
      exit: 0
      stdout: "curl exit 8, tool error yes: curl: (8) XMPP stanza error: item-not-found\ncurl exit 8, tool error yes: curl: (8) XMPP stanza error: service-unavailable\ncurl exit 8, tool error yes: curl: (8) XMPP stanza error: remote-server-not-found\n"

  - id: login
    claim: With no -u, curl asks for SASL ANONYMOUS, which the server does not offer, and a wrong password is answered not-authorized; each is a tool error, curl exit 67, and no answer, since the question is asked after the login.
    program: discover.cs
    args: [login]
    expect:
      exit: 0
      stdout: "curl exit 67, tool error yes: curl: (67) XMPP server does not offer SASL ANONYMOUS\ncurl exit 67, tool error yes: curl: (67) XMPP authentication failed: not-authorized\n"

  - id: untrusted
    claim: Without --cacert, curl does not trust the server's certificate and stops before it logs in, a tool error, curl exit 60.
    program: discover.cs
    args: [untrusted]
    expect:
      exit: 0
      stdout: "curl exit 60, tool error yes: certificate not trusted\n"
