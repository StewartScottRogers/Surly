# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: mqtt5-subscribe-over-websocket-in-csharp
title: MQTT over WebSocket in C#
protocols: [mqtt5+ws, mqtt5]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlEventQuery, SurlEventKind, SurlEvent, CurlClient, CurlRequest, CurlResponse, CurlContent, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, mqtt5, rfc6455]
triplet: mqtt5-subscribe-over-websocket

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: A message Curl.Api publishes over mqtt:// to dash/temp is retained, and a subscription over mqtt5+ws:// to the same topic reads it, the payload alone.
    program: program.cs
    args: [solution]
    timeout: 90
    expect:
      exit: 0
      stdout: "dashboard reads 21\n"

  - id: later-subscriber
    claim: The message stays on the topic, so a second client that subscribes over WebSocket later reads it too.
    program: program.cs
    args: [later]
    timeout: 90
    expect:
      exit: 0
      stdout: "first reads 21\nsecond reads 21\n"

  - id: wildcard
    claim: A filter with the multi-level wildcard, written %23 in the URL, reads the retained messages of both topics under dash/.
    program: program.cs
    args: [wildcard]
    timeout: 90
    expect:
      exit: 0
      stdout: "dashboard reads 2122\n"

  - id: outside-the-filter
    claim: A topic outside the Topics filter keeps nothing, so a subscription over WebSocket reads nothing.
    program: program.cs
    args: [outside]
    timeout: 90
    expect:
      exit: 0
      stdout: "dashboard reads nothing\n"

  - id: empty-message-clears
    claim: An empty publish clears the topic, and a subscription over WebSocket then reads nothing.
    program: program.cs
    args: [clear]
    timeout: 90
    expect:
      exit: 0
      stdout: "dashboard reads nothing\n"

  - id: plain-websocket-refused
    claim: A WebSocket client that does not ask for the mqtt subprotocol has its upgrade to /mqtt refused with 400, and SendAsync throws a CurlException of code 22.
    program: program.cs
    args: [plain]
    timeout: 90
    expect:
      exit: 0
      stdout: "mqtt-less client refused: curl error 22: Refused WebSocket upgrade: 400\n"

  - id: other-path-refused
    claim: A WebSocket upgrade to any other path is refused with 404, the same exception.
    program: program.cs
    args: [other-path]
    timeout: 90
    expect:
      exit: 0
      stdout: "other path refused: curl error 22: Refused WebSocket upgrade: 404\n"

  - id: no-login-refused
    claim: On a broker with an account and no AllowAnonymous, a client that sends no login over WebSocket is refused with CONNACK reason code 0x87, as a CurlException of code 67.
    program: program.cs
    args: [no-login]
    timeout: 90
    expect:
      exit: 0
      stdout: "anonymous refused: curl error 67: MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"

  - id: clear-password-refused
    claim: The right password over mqtt5+ws:// is refused unchecked with 0x87, because the WebSocket is not encrypted.
    program: program.cs
    args: [clear-text]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann refused: curl error 67: MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"

  - id: clear-password-allowed
    claim: With AllowPlaintextAuthentication, the same password is checked and accepted, and the account reads what it published.
    program: program.cs
    args: [allowed]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann reads 21\n"

  - id: wrong-password-refused
    claim: With AllowPlaintextAuthentication, a wrong password is checked and refused with reason code 0x86, bad user name or password, as a CurlException of code 67.
    program: program.cs
    args: [wrong]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann refused: curl error 67: MQTT 5 CONNACK reason code 0x86 BadUserNameOrPassword\n"
