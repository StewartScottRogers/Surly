# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: mqtt5-refuse-a-publish-by-reason-code-from-an-agent
title: MQTT 5 Reason Codes from an Agent
protocols: [mqtt5]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, read_retained_message, wait_for_event, curl]
curl-options: [-s, -S, -u, -d]
exit-codes: [0, 8, 67]
references: [surl-readme, curl-readme, curl-protocols, mqtt5, mcp-spec]
triplet: mqtt5-refuse-a-publish-by-reason-code

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: ann, granted pubsub on plant/#, publishes 21 to plant/line1/temp through the curl tool, and bob, granted sub, subscribes and reads 21, the payload alone.
    program: program.cs
    args: [solution]
    timeout: 90
    expect:
      exit: 0
      stdout: "bob reads 21\n"

  - id: subscribe-outside-the-grant
    claim: A topic no grant covers is refused in the SUBACK even for ann; the curl tool answers exit code 8 and a message naming reason code 0x87, not authorized, and it is not a tool error.
    program: program.cs
    args: [outside]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann refused: exit 8, curl: (8) MQTT 5 SUBACK reason code 0x87 NotAuthorized\n"

  - id: publish-only-cannot-subscribe
    claim: dan, granted pub, has a subscribe refused with exit code 8 and reason code 0x87.
    program: program.cs
    args: [pub-only]
    timeout: 90
    expect:
      exit: 0
      stdout: "dan refused: exit 8, curl: (8) MQTT 5 SUBACK reason code 0x87 NotAuthorized\n"

  - id: no-grant-cannot-subscribe
    claim: cy has a valid login and no grant, so a subscribe is refused with 0x87.
    program: program.cs
    args: [no-grant]
    timeout: 90
    expect:
      exit: 0
      stdout: "cy refused: exit 8, curl: (8) MQTT 5 SUBACK reason code 0x87 NotAuthorized\n"

  - id: subscribe-only-publish-dropped
    claim: bob, granted only sub, publishes 99 and the curl tool answers exit code 0 and no reason code; ann, reading after, still receives 21, and read_retained_message, which needs no grant, holds 21.
    program: program.cs
    args: [sub-only]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann reads 21\nkept: 21\n"

  - id: no-grant-publish-dropped
    claim: cy, with no grant, has a publish dropped the same way, and the topic stays at 21.
    program: program.cs
    args: [no-grant-pub]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann reads 21\nkept: 21\n"

  - id: wrong-password
    claim: A wrong password is refused at the login with CONNACK reason code 0x86, bad user name or password, curl exit code 67.
    program: program.cs
    args: [wrong-password]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann refused: exit 67, curl: (67) MQTT 5 CONNACK reason code 0x86 BadUserNameOrPassword\n"

  - id: no-login
    claim: A client that sends no login is refused with CONNACK reason code 0x87, curl exit code 67.
    program: program.cs
    args: [no-login]
    timeout: 90
    expect:
      exit: 0
      stdout: "anonymous refused: exit 67, curl: (67) MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"

  - id: clear-password-refused
    claim: Without --allow-plaintext-auth, the right password over mqtt5:// is refused unchecked with 0x87, curl exit code 67.
    program: program.cs
    args: [clear]
    timeout: 90
    expect:
      exit: 0
      stdout: "ann refused: exit 67, curl: (67) MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"
