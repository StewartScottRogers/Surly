# Executable specification for a recipe whose subject is a .NET library (ADR-0008).
schema: 2
key: xmpp-ask-what-a-server-offers-in-csharp
title: Asking What XMPP Offers in C#
protocols: [xmpp]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlRequest, CurlResponse, CurlAuthenticationOptions, CurlException]
exit-codes: [0]
references: [surl-readme, curl-readme, rfc6120, rfc8446]
triplet: xmpp-ask-what-a-server-offers

# The certificate and its key are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

fixtures: {}

# No servers: block. The program hosts its own servers through Surl.Api.

cases:
  - id: solution
    role: solution
    claim: A Surl.Api XMPP server with a certificate and two accounts, asked by Curl.Api as alice for its own domain, answers the disco info of a server, an identity of category server and type im and the features info, items and ping.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '^server: <query xmlns="http://jabber\.org/protocol/disco#info"><identity category="server" type="im" /><feature var="http://jabber\.org/protocol/disco#info" /><feature var="http://jabber\.org/protocol/disco#items" /><feature var="urn:xmpp:ping" /></query>\n'

  - id: account
    claim: Asking alice@127.0.0.1 answers an identity of category account and type registered and the info and items features alone.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\naccount: <query xmlns="http://jabber\.org/protocol/disco#info"><identity category="account" type="registered" /><feature var="http://jabber\.org/protocol/disco#info" /><feature var="http://jabber\.org/protocol/disco#items" /></query>\n'

  - id: items-not-asked
    claim: With ?disco and with ?disco;items on the path the client still asks for info and the answer is the server's info answer.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\n\?disco: <query xmlns="http://jabber\.org/protocol/disco#info"><identity category="server" type="im" />.*\n\?disco;items: <query xmlns="http://jabber\.org/protocol/disco#info"><identity category="server" type="im" />'

  - id: stanza-errors
    claim: An unknown node, an account with no stream bound and a domain the server does not serve each throw CurlException with code 8, WeirdServerReply, naming the stanza error item-not-found, service-unavailable and remote-server-not-found.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nnode x: CurlException 8 WeirdServerReply: XMPP stanza error: item-not-found\nbob: CurlException 8 WeirdServerReply: XMPP stanza error: service-unavailable\nexample\.com: CurlException 8 WeirdServerReply: XMPP stanza error: remote-server-not-found\n'

  - id: login-refused
    claim: A wrong password throws CurlException with code 67, LoginDenied, naming not-authorized, and no login throws the same code naming that the server does not offer SASL ANONYMOUS.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: '\nwrong password: CurlException 67 LoginDenied: XMPP authentication failed: not-authorized\nno login: CurlException 67 LoginDenied: XMPP server does not offer SASL ANONYMOUS\n'

  - id: raw-items
    claim: A client that writes the stanzas itself, logged in over SASL PLAIN on a server with AllowPlaintextAuthentication, gets the same info answer as Curl.Api and an items answer that is empty, for the server and for the account.
    program: program.cs
    args: []
    expect:
      exit: 0
      stdout-matches: "\nraw info, server: <iq type='result' from='127\\.0\\.0\\.1' to='alice@127\\.0\\.0\\.1/r' id='q'><query xmlns='http://jabber\\.org/protocol/disco#info'><identity category='server' type='im'/><feature var='http://jabber\\.org/protocol/disco#info'/><feature var='http://jabber\\.org/protocol/disco#items'/><feature var='urn:xmpp:ping'/></query></iq>\nraw items, server: <iq type='result' from='127\\.0\\.0\\.1' to='alice@127\\.0\\.0\\.1/r' id='q'><query xmlns='http://jabber\\.org/protocol/disco#items'/></iq>\nraw items, account: <iq type='result' from='alice@127\\.0\\.0\\.1' to='alice@127\\.0\\.0\\.1/r' id='q'><query xmlns='http://jabber\\.org/protocol/disco#items'/></iq>\n$"
