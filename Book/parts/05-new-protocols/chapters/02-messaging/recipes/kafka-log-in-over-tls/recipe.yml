schema: 2
key: kafka-log-in-over-tls
title: Logging In to Kafka over TLS
protocols: [kafkas, kafka]
tier: new-protocols
surl-options: [--cert, --key, --user, --auth, --allow-plaintext-auth]
curl-options: [--cacert, -u, -d, --next, -s, -S]
exit-codes: [0, 56, 60, 67]
references: [surl-readme, curl-readme, kafka-protocol, rfc8446]

# The certificate and its key are made here, never committed.
setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# tls: one account over kafkas, no loosening option. plain: the same account over kafka://. only-plain: kafka://
# asked to offer PLAIN alone. scram256: kafka:// asked to offer SCRAM-SHA-256 alone. loosened: kafka:// with
# --allow-plaintext-auth.
servers:
  tls:
    command: surl --user alice:s3cret --cert server.pem --key server.key kafkas://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --user alice:s3cret kafka://127.0.0.1:{{port2}}/
    ready: port
  only-plain:
    command: surl --user alice:s3cret --auth PLAIN kafka://127.0.0.1:{{port3}}/
    ready: port
  scram256:
    command: surl --user alice:s3cret --auth SCRAM-SHA-256 kafka://127.0.0.1:{{port4}}/
    ready: port
  loosened:
    command: surl --user alice:s3cret --allow-plaintext-auth kafka://127.0.0.1:{{port5}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Over kafkas:// curl trusts the certificate with --cacert, logs in with -u, produces one record and consumes it back, exit 0, with no loosening option on surl.
    run: curl -s --cacert server.pem -u alice:s3cret -d first kafkas://127.0.0.1:{{port}}/orders --next -s --cacert server.pem -u alice:s3cret kafkas://127.0.0.1:{{port}}/orders
    expect:
      exit: 0
      stdout: "first\n"

  - id: tls-uses-plain
    claim: Offered PLAIN over TLS, curl uses it; a wrong password is refused, exit 67, and curl names the mechanism, SASL PLAIN.
    run: curl -sS --cacert server.pem -u alice:wrong kafkas://127.0.0.1:{{port}}/orders
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Kafka SASL PLAIN authentication failed"

  - id: tls-no-login
    claim: A connection with no login is closed by the TLS listener, and curl exits 56.
    run: curl -sS --cacert server.pem kafkas://127.0.0.1:{{port}}/orders
    expect:
      exit: 56
      stdout: ""

  - id: untrusted-certificate
    claim: Without --cacert curl does not trust the certificate, sends no login and exits 60.
    run: curl -s -u alice:s3cret kafkas://127.0.0.1:{{port}}/orders
    expect:
      exit: 60
      stdout: ""

  - id: plain-listener-scram
    claim: The plain listener does not offer PLAIN, and the same login works over kafka:// because curl takes SCRAM instead; produce and consume both log in.
    run: curl -s -u alice:s3cret -d first kafka://127.0.0.1:{{port2}}/orders --next -s -u alice:s3cret kafka://127.0.0.1:{{port2}}/orders
    expect:
      exit: 0
      stdout: "first\n"

  - id: plain-names-scram
    claim: On the plain listener a wrong password is refused, exit 67, and curl names SCRAM-SHA-512, not PLAIN, as the mechanism that was used.
    run: curl -sS -u alice:wrong kafka://127.0.0.1:{{port2}}/orders
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Kafka SASL SCRAM-SHA-512 authentication failed"

  - id: scram-256-only
    claim: With --auth SCRAM-SHA-256 surl offers that one mechanism and curl uses it; the refusal names SCRAM-SHA-256.
    run: curl -sS -u alice:wrong kafka://127.0.0.1:{{port4}}/orders
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Kafka SASL SCRAM-SHA-256 authentication failed"

  - id: only-plain-offers-nothing
    claim: Asked with --auth PLAIN to offer PLAIN alone over kafka://, surl offers no mechanism at all, and curl stops before it sends the password, exit 67.
    run: curl -sS -u alice:s3cret kafka://127.0.0.1:{{port3}}/orders
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "it offers no SASL mechanism"

  - id: plaintext-option-loosens
    claim: With --allow-plaintext-auth surl offers PLAIN over kafka:// too, curl uses it, and a wrong password now names SASL PLAIN.
    run: curl -sS -u alice:wrong kafka://127.0.0.1:{{port5}}/orders
    expect:
      exit: 67
      stdout: ""
      stderr-contains: "Kafka SASL PLAIN authentication failed"
