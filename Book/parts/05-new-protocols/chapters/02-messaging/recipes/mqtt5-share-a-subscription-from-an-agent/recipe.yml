# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs share.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: mqtt5-share-a-subscription-from-an-agent
title: Sharing MQTT Subscriptions from an Agent
protocols: [mqtt5]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, curl, get_exchanges]
curl-options: [-s, -S, -m, -d]
exit-codes: [0]
references: [mqtt5, surl-readme, curl-protocols, mcp-spec]

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Of six jobs published to jobs once get_exchanges shows three SUBACKs, each of the two workers' curl calls on $share/workers/jobs is sent at least one and at most five, between them job-1 to job-6 each once, and the monitor's call on jobs is sent all six.
    program: share.cs
    args: [share]
    expect:
      exit: 0
      stdout-matches: '\Aworker 1: [1-5] jobs\nworker 2: [1-5] jobs\nmonitor: 6 jobs\nbetween them: job-1 job-2 job-3 job-4 job-5 job-6\n\Z'

  - id: late
    claim: After the run a worker that joins the group is sent nothing, not even the retained job-6, and its curl ends at -m 3 with exit 28; a plain subscriber to jobs is sent job-6 and ends the same way.
    program: share.cs
    args: [late]
    expect:
      exit: 0
      stdout-matches: '\nlate worker: exit 28, \[\]\nlate plain subscriber: exit 28, \[job-6\]\n\Z'

  - id: no-anonymous
    claim: Without --allow-anonymous a worker with no login is refused at CONNECT, reason code 0x87, curl exit 67.
    program: share.cs
    args: [no-anonymous]
    expect:
      exit: 0
      stdout: "worker exit 67: curl: (67) MQTT 5 CONNACK reason code 0x87 NotAuthorized\n"
