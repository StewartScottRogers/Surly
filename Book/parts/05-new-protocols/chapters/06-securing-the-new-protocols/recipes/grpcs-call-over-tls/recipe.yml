# The recipe's executable specification. Edit this, never the generated files.
schema: 2
key: grpcs-call-over-tls
title: Calling gRPC over TLS
protocols: [grpcs]
tier: new-protocols
surl-options: [--cert, --key, --user]
curl-options: [-s, -S, -d, -u, --cacert]
exit-codes: [0, 22, 58, 60]
references: [surl-readme, curl-readme, grpc-http2, rfc9113, rfc8446]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main: gRPC over TLS with one account. plain: the same account over plain grpc.
servers:
  main:
    command: surl --cert server.pem --key server.key --user alice:s3cret grpcs://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --user alice:s3cret grpc://127.0.0.1:{{port2}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: A client that trusts the server's certificate with --cacert and logs in with -u calls surl.test.Echo/Echo over grpcs, gets the reply as JSON and exits 0.
    run: curl -s -S --cacert server.pem -u alice:s3cret -d "{\"message\":\"hello\"}" grpcs://127.0.0.1:{{port}}/surl.test.Echo/Echo
    expect:
      exit: 0
      stdout: "{\n  \"message\": \"hello\"\n}\n"

  - id: untrusted
    claim: Without --cacert the client cannot verify the self-made certificate and stops before the call, exit 60, nothing printed on stdout.
    run: curl -s -S -u alice:s3cret -d "{\"message\":\"hello\"}" grpcs://127.0.0.1:{{port}}/surl.test.Echo/Echo
    expect:
      exit: 60
      stdout: ""
      stderr-contains: "curl: (60)"

  - id: wrong-name
    claim: Trusting the certificate is not enough when the URL names a host the certificate does not, localhost for a certificate made for 127.0.0.1; exit 60.
    run: curl -s -S --cacert server.pem -u alice:s3cret -d "{\"message\":\"hello\"}" grpcs://localhost:{{port}}/surl.test.Echo/Echo
    expect:
      exit: 60
      stderr-contains: "curl: (60)"

  - id: wrong-password
    claim: Over a trusted connection a wrong password is judged and refused with grpc-status 16 UNAUTHENTICATED, exit 22.
    run: curl -s -S --cacert server.pem -u alice:wrong -d "{\"message\":\"hello\"}" grpcs://127.0.0.1:{{port}}/surl.test.Echo/Echo
    expect:
      exit: 22
      stderr-contains: "The server did not answer gRPC server reflection (grpc-status 16 (UNAUTHENTICATED)"

  - id: no-login
    claim: With an account on the server, a call with no login is refused the same way, grpc-status 16, exit 22.
    run: curl -s -S --cacert server.pem -d "{\"message\":\"hello\"}" grpcs://127.0.0.1:{{port}}/surl.test.Echo/Echo
    expect:
      exit: 22
      stderr-contains: "grpc-status 16 (UNAUTHENTICATED)"

  - id: password-in-clear
    claim: The same login over plain grpc is refused unchecked with grpc-status 7 PERMISSION_DENIED, exit 22, because the password would travel in clear.
    run: curl -s -S -u alice:s3cret -d "{\"message\":\"hello\"}" grpc://127.0.0.1:{{port2}}/surl.test.Echo/Echo
    expect:
      exit: 22
      stderr-contains: "grpc-status 7 (PERMISSION_DENIED)"

  - id: no-certificate
    claim: surl refuses to start a grpcs listener with no certificate, exit 58, and names the two ways to give one.
    run: surl grpcs://127.0.0.1:{{port3}}/
    expect:
      exit: 58
      stderr-contains: "needs a certificate: give --cert <file>, or --self-signed for a throwaway one"
