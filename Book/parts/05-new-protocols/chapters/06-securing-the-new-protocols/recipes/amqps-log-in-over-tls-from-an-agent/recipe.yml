# Executable specification for a recipe whose subject is surl-mcp and curl-mcp (ADR-0008).
# Each case runs program.cs, a C# program on the official MCP SDK that starts both hosts from PATH.
schema: 2
key: amqps-log-in-over-tls-from-an-agent
title: AMQP Logins over TLS from an Agent
protocols: [amqps, amqp]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, curl, wait_for_event]
curl-options: [--cacert, -u, -d, -sS, -m]
exit-codes: [0, 1]
references: [surl-readme, curl-readme, mcp-spec, amqp091, rfc4616, rfc8446]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

fixtures: {}

cases:
  - id: solution
    role: solution
    claim: Over AMQPS, with --cacert, the curl tool logs in as alice with PLAIN, publishes paid and reads it back, curl exit 0 each time, on a server with one account and no loosening option.
    program: program.cs
    args: [login]
    expect:
      exit: 0
      stdout: "curl exit 0: read paid\ntool error: no\n"

  - id: plain-refused
    claim: The same login over plain AMQP on the same server ends with curl exit 67, because the server offers only CRAM-MD5 there and curl logs in with PLAIN; the tool answers that as a tool error.
    program: program.cs
    args: [plain-refused]
    expect:
      exit: 1
      stdout: "curl exit 67: curl: (67) AMQP server offers no mechanism this client can use (it offers \"CRAM-MD5\")\ntool error: yes\n"

  - id: plaintext-allowed
    claim: A server started with --allow-plaintext-auth offers PLAIN over plain AMQP, and the same login publishes and reads back paid, curl exit 0.
    program: program.cs
    args: [plaintext-allowed]
    expect:
      exit: 0
      stdout: "curl exit 0: read paid\ntool error: no\n"

  - id: wrong-password
    claim: A wrong password over AMQPS is answered with connection.close, reply code 403 ACCESS_REFUSED, and curl exits 67.
    program: program.cs
    args: [wrong-password]
    expect:
      exit: 1
      stdout: "curl exit 67: curl: (67) AMQP server sent connection.close: reply code 403, ACCESS_REFUSED - login refused\ntool error: yes\n"

  - id: unknown-user
    claim: A user name the server has no account for gets the same 403 as a wrong password.
    program: program.cs
    args: [unknown-user]
    expect:
      exit: 1
      stdout: "curl exit 67: curl: (67) AMQP server sent connection.close: reply code 403, ACCESS_REFUSED - login refused\ntool error: yes\n"

  - id: no-login
    claim: With no -u curl logs in as RabbitMQ's default account, which a server with accounts does not have, and gets the same 403.
    program: program.cs
    args: [no-login]
    expect:
      exit: 1
      stdout: "curl exit 67: curl: (67) AMQP server sent connection.close: reply code 403, ACCESS_REFUSED - login refused\ntool error: yes\n"

  - id: plaintext-wrong-password
    claim: With --allow-plaintext-auth the password is checked, not just accepted; a wrong one is still 403 and curl exit 67.
    program: program.cs
    args: [plaintext-wrong-password]
    expect:
      exit: 1
      stdout: "curl exit 67: curl: (67) AMQP server sent connection.close: reply code 403, ACCESS_REFUSED - login refused\ntool error: yes\n"

  - id: untrusted-certificate
    claim: Without --cacert curl does not trust the self-signed certificate and exits 60 before any login is sent.
    program: program.cs
    args: [untrusted-certificate]
    expect:
      exit: 1
      stdout: "curl exit 60\ntool error: yes\n"

  - id: needs-a-certificate
    claim: start_server with an amqps listener and no --cert is a tool error carrying surl's exit code 58, CertificateProblem.
    program: program.cs
    args: [needs-a-certificate]
    expect:
      exit: 1
      stdout: "exit_code: 58 (CertificateProblem)\ntool error: yes\n"
