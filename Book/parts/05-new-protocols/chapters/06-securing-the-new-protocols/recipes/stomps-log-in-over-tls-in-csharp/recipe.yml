schema: 2
key: stomps-log-in-over-tls-in-csharp
title: STOMP Logins over TLS in C#
protocols: [stomps, stomp]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlEventQuery, SurlQueuePage, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlAuthenticationOptions, CurlRequest, CurlContent, CurlException]
exit-codes: [0, 60, 67]
references: [surl-readme, curl-readme, stomp12, rfc8446]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: Over stomps the right password sends the message, and the server holds it in the queue, with the certificate trusted and no loosening option.
    program: program.cs
    args: ["stomps", "alice", "s3cret"]
    expect:
      exit: 0
      stdout: "queue jobs holds 1: hello\n"

  - id: wrong-password
    claim: A wrong password makes SendAsync throw CurlException with code 67 and the Authentication failed error.
    program: program.cs
    args: ["stomps", "alice", "wrong"]
    expect:
      exit: 67
      stdout-matches: '\Arefused: curl code 67 \w+: .*Authentication failed'

  - id: unknown-user
    claim: A user name the server has no account for gets the same refusal as a wrong password.
    program: program.cs
    args: ["stomps", "bob", "s3cret"]
    expect:
      exit: 67
      stdout-matches: '\Arefused: curl code 67 \w+: .*Authentication failed'

  - id: no-login
    claim: A request with no login gets the same refusal, so the message does not tell a missing login from a wrong one.
    program: program.cs
    args: ["stomps", "none", "x"]
    expect:
      exit: 67
      stdout-matches: '\Arefused: curl code 67 \w+: .*Authentication failed'

  - id: plain-refuses-the-password
    claim: Over plain stomp the right password gets the same refusal, because the server will not take a password in the clear.
    program: program.cs
    args: ["stomp", "alice", "s3cret"]
    expect:
      exit: 67
      stdout-matches: '\Arefused: curl code 67 \w+: .*Authentication failed'

  - id: plaintext-option-loosens
    claim: With AllowPlaintextAuthentication set, the same login over plain stomp sends the message and the queue holds it.
    program: program.cs
    args: ["stomp", "alice", "s3cret", "plaintext"]
    expect:
      exit: 0
      stdout: "queue jobs holds 1: hello\n"

  - id: untrusted-certificate
    claim: With no certificate authority file the client does not trust the certificate and SendAsync throws code 60, before any login is sent.
    program: program.cs
    args: ["stomps", "alice", "s3cret", "untrusted"]
    expect:
      exit: 60
      stdout-matches: '\Arefused: curl code 60 PeerFailedVerification'
