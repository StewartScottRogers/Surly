schema: 2
key: socketio-log-in-to-a-namespace-in-csharp
title: Socket.IO Logins in C#
protocols: [socketio, socketios]
tier: new-protocols
surface: csharp
api-types: [SurlServer, SurlServerOptions, SurlAccount, SurlEventQuery, CurlClient, CurlClientOptions, CurlTlsOptions, CurlTlsPeerOptions, CurlAuthenticationOptions, CurlRequest, CurlContent, CurlResponse, CurlException]
exit-codes: [0, 22, 60]
references: [surl-readme, curl-readme, socketio-protocol, rfc8446]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: Over socketios the right password joins the main namespace, SendAsync returns at the first event the server sends back, whose body is the emitted event, and the server judged the login accepted, with no loosening option.
    program: program.cs
    args: ["socketios", "alice", "s3cret"]
    timeout: 60
    expect:
      exit: 0
      stdout: "joined: [\"chat\",\"hi\"]; login accepted True\n"

  - id: wrong-password
    claim: A wrong password makes SendAsync throw CurlException with code 22 and the Not authorized refusal.
    program: program.cs
    args: ["socketios", "alice", "wrong"]
    timeout: 60
    expect:
      exit: 22
      stdout-matches: '\Arefused: curl code 22 \w+: .*Not authorized'

  - id: unknown-user
    claim: A user name the server has no account for gets the same refusal as a wrong password.
    program: program.cs
    args: ["socketios", "bob", "s3cret"]
    timeout: 60
    expect:
      exit: 22
      stdout-matches: '\Arefused: curl code 22 \w+: .*Not authorized'

  - id: no-login
    claim: A request with no login is refused with the same Not authorized, so the message does not tell a missing login from a wrong one.
    program: program.cs
    args: ["socketios", "none", "x"]
    timeout: 60
    expect:
      exit: 22
      stdout-matches: '\Arefused: curl code 22 \w+: .*Not authorized'

  - id: plain-refuses-the-password
    claim: Over plain socketio the right password is refused with the same Not authorized, because the server will not take a password in the clear.
    program: program.cs
    args: ["socketio", "alice", "s3cret"]
    timeout: 60
    expect:
      exit: 22
      stdout-matches: '\Arefused: curl code 22 \w+: .*Not authorized'

  - id: plaintext-option-loosens
    claim: With AllowPlaintextAuthentication set, the same login over plain socketio joins and the server judged it accepted.
    program: program.cs
    args: ["socketio", "alice", "s3cret", "plaintext"]
    timeout: 60
    expect:
      exit: 0
      stdout: "joined: [\"chat\",\"hi\"]; login accepted True\n"

  - id: untrusted-certificate
    claim: With no certificate authority file the client does not trust the certificate and SendAsync throws code 60, before any login is sent.
    program: program.cs
    args: ["socketios", "alice", "s3cret", "untrusted"]
    timeout: 60
    expect:
      exit: 60
      stdout-matches: '\Arefused: curl code 60 PeerFailedVerification'

  - id: token-as-user-name-refused
    claim: A token account (new SurlAccount("", "tok123")) refuses the token as the user name with no password, code 22, Not authorized.
    program: program.cs
    args: ["socketios", "tok123", "", "token"]
    timeout: 60
    expect:
      exit: 22
      stdout-matches: '\Arefused: curl code 22 \w+: .*Not authorized'

  - id: token-as-password-refused
    claim: It refuses an empty user name with the token as the password the same way, so no CurlAuthenticationOptions logs in to a token account.
    program: program.cs
    args: ["socketios", "", "tok123", "token"]
    timeout: 60
    expect:
      exit: 22
      stdout-matches: '\Arefused: curl code 22 \w+: .*Not authorized'
