schema: 2
key: rediss-log-in-over-tls-from-an-agent
title: Redis Logins over TLS from an Agent
protocols: [rediss, redis]
tier: new-protocols
surface: mcp
mcp-tools: [start_server, set_key, curl]
exit-codes: [0]
references: [surl-readme, curl-readme, redis-resp, rfc8446]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

cases:
  - id: solution
    role: solution
    claim: Over rediss the right password lets curl-mcp's curl tool read a key the agent seeded with set_key, exit 0, with no loosening option.
    program: program.cs
    args: ["rediss", "alice:s3cret"]
    expect:
      exit: 0
      stdout: "curl exit 0\nout: hello\nerr: \n"

  - id: wrong-password
    claim: A wrong password is refused with WRONGPASS and the curl tool exits 67.
    program: program.cs
    args: ["rediss", "alice:wrong"]
    expect:
      exit: 0
      stdout-matches: '\Acurl exit 67\nout: \nerr: .*WRONGPASS'

  - id: unknown-user
    claim: A user name the server has no account for gets the same WRONGPASS.
    program: program.cs
    args: ["rediss", "bob:s3cret"]
    expect:
      exit: 0
      stdout-matches: '\Acurl exit 67\nout: \nerr: .*WRONGPASS'

  - id: no-login
    claim: A request with no login is refused with NOAUTH, a different error from a wrong password, also exit 67.
    program: program.cs
    args: ["rediss", "none"]
    expect:
      exit: 0
      stdout-matches: '\Acurl exit 67\nout: \nerr: .*NOAUTH'

  - id: plain-refuses-the-password
    claim: Over plain redis the right password is answered WRONGPASS, because the server will not take a password in the clear.
    program: program.cs
    args: ["redis", "alice:s3cret"]
    expect:
      exit: 0
      stdout-matches: '\Acurl exit 67\nout: \nerr: .*WRONGPASS'

  - id: plaintext-option-loosens
    claim: Started with --allow-plaintext-auth, the same server accepts the login over plain redis.
    program: program.cs
    args: ["redis", "alice:s3cret", "plaintext"]
    expect:
      exit: 0
      stdout: "curl exit 0\nout: hello\nerr: \n"

  - id: untrusted-certificate
    claim: Without --cacert the curl tool does not trust the certificate and exits 60, before any login is sent.
    program: program.cs
    args: ["rediss", "alice:s3cret", "untrusted"]
    expect:
      exit: 0
      stdout-matches: '\Acurl exit 60\nout: \nerr: '
