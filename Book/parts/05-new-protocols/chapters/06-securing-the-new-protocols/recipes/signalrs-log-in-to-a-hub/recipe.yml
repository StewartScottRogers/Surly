schema: 2
key: signalrs-log-in-to-a-hub
title: Logging In to a SignalR Hub
protocols: [signalrs, signalr]
tier: new-protocols
surl-options: [--cert, --key, --user, --allow-plaintext-auth]
curl-options: [--cacert, -u, -d, -s, -S]
exit-codes: [0, 22, 60]
references: [surl-readme, curl-readme, signalr-hub-protocol, rfc7617, rfc8446]

setup:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.pem -days 30 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

# main: signalrs with one account and no loosening option. plain: the same account over signalr://.
# plaintext: the same again with --allow-plaintext-auth.
servers:
  main:
    command: surl --cert server.pem --key server.key --user alice:s3cret signalrs://127.0.0.1:{{port}}/
    ready: port
  plain:
    command: surl --user alice:s3cret signalr://127.0.0.1:{{port2}}/
    ready: port
  plaintext:
    command: surl --user alice:s3cret --allow-plaintext-auth signalr://127.0.0.1:{{port3}}/
    ready: port

cases:
  - id: solution
    role: solution
    claim: Over signalrs curl logs in as alice with -u, trusting the certificate with --cacert, calls the Echo method and gets its argument back, with no loosening option on surl.
    run: curl -s --cacert server.pem -u alice:s3cret -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalrs://127.0.0.1:{{port}}/
    expect:
      exit: 0
      stdout: "\"hi\"\n"

  - id: wrong-password
    claim: A wrong password gets the negotiate request refused with HTTP status 401, and curl exits 22.
    run: curl -sS --cacert server.pem -u alice:wrong -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalrs://127.0.0.1:{{port}}/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "HTTP status 401"

  - id: unknown-user
    claim: A user name surl has no account for gets the same 401 as a wrong password.
    run: curl -sS --cacert server.pem -u bob:s3cret -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalrs://127.0.0.1:{{port}}/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "HTTP status 401"

  - id: no-login
    claim: A client that sends no login gets 401 too, so over TLS the status does not tell a missing login from a wrong one.
    run: curl -sS --cacert server.pem -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalrs://127.0.0.1:{{port}}/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "HTTP status 401"

  - id: plain-refuses-the-password
    claim: Over plain signalr:// the right password is refused with 403, a different status from the 401 of a wrong login over TLS, because surl will not take a password in the clear.
    run: curl -sS -u alice:s3cret -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalr://127.0.0.1:{{port2}}/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "HTTP status 403"

  - id: plain-no-login
    claim: Over plain signalr:// a client with no login at all is still refused with 401.
    run: curl -sS -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalr://127.0.0.1:{{port2}}/
    expect:
      exit: 22
      stdout: ""
      stderr-contains: "HTTP status 401"

  - id: plaintext-option-loosens
    claim: With --allow-plaintext-auth the same login over signalr:// is accepted and Echo answers.
    run: curl -s -u alice:s3cret -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalr://127.0.0.1:{{port3}}/
    expect:
      exit: 0
      stdout: "\"hi\"\n"

  - id: untrusted-certificate
    claim: Without --cacert curl does not trust the certificate, never sends the login, and exits 60.
    run: curl -s -u alice:s3cret -d "{\"type\":1,\"target\":\"Echo\",\"arguments\":[\"hi\"]}" signalrs://127.0.0.1:{{port}}/
    expect:
      exit: 60
      stdout: ""
