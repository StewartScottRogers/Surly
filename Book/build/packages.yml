# The one place the book pins package versions (ADR-0008 item 6). Every #:package line in a
# recipe's C# program names its package at exactly the version here, so a reader can copy the
# program and run it; lint checks it. Change a version with build/pin.py, which rewrites
# this file and every #:package line in one go, then re-run verify.
# null: the package is not published yet, and its recipes stay draft.
Surly.Surl.Api: "0.1.12"
# Not a #:package: the MCP host an agent recipe starts, as a reader would (dnx Surly.Surl.Mcp@<version>).
Surly.Surl.Mcp: "0.1.12"
Surly.Curl.Api: "0.4.0-preview.6"
Surly.Libcurl: "0.4.0-preview.6"
# Not a #:package: the MCP host an agent recipe starts, as a reader would (dnx Surly.Curl.Mcp@<version>).
Surly.Curl.Mcp: "0.4.0-preview.6"
# Not a #:package: the curl program, a .NET tool on nuget.org (dnx Surly.Curl@<version> --yes -- <args>).
Surly.Curl: "0.4.0-preview.6"
ModelContextProtocol.Core: "2.4.0"
AWSSDK.S3: "4.1.2"
