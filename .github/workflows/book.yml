name: Book
on:
  push:
    branches: [master]
    paths: ["Book/**", ".github/workflows/book.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install -g asciidoctor && npm install playwright && npx playwright install --with-deps chromium
      - run: pip install pyyaml
      - run: python3 Book/build/lint.py
      - run: python3 Book/build/build.py
      - run: python3 Book/build/site.py
      - run: cp -r Book/out/recipes Book/out/site/recipes && cp Book/out/surly.html Book/out/site/book.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: Book/out/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
