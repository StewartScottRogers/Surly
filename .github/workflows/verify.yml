# Runs every recipe in the book against the pinned Surl and Curl on Linux, macOS and Windows: each
# program's release binaries when a release is tagged at its pin, else built from source
# (build/fetch_pins.py). Results are the verified.yml files (an artifact) and a summary; nothing is committed. Run it from the Actions tab or with
#   gh workflow run verify.yml [-f surl_ref=<commit> -f curl_ref=<commit>]   (default: Book/build/pins.yml)
# and it runs on a push to any branch named verify-run/... (to try a change to it).
name: Verify recipes
on:
  workflow_dispatch:
    inputs:
      surl_ref: { description: "Surl branch, tag or commit (empty: Book/build/pins.yml)", default: "" }
      curl_ref: { description: "Curl branch, tag or commit (empty: Book/build/pins.yml)", default: "" }
  push:
    branches: ["verify-run/**"]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]   # each job verifies every 8th recipe, so a run stays well under the time limit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned commits (an input overrides)
        shell: bash
        run: |
          pin() { sed -n "s/^$1: *\([0-9a-f]*\).*/\1/p" Book/build/pins.yml; }
          echo "SURL_REF=${{ inputs.surl_ref }}" | sed "s/=$/=$(pin surl)/" >> "$GITHUB_ENV"
          echo "CURL_REF=${{ inputs.curl_ref }}" | sed "s/=$/=$(pin curl)/" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { repository: StewartScottRogers/Surl, ref: "${{ env.SURL_REF }}", path: programs/Surl }
      - uses: actions/checkout@v4
        with: { repository: StewartScottRogers/Curl, ref: "${{ env.CURL_REF }}", path: programs/Curl }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Get the pinned surl, curl and both MCP hosts (release binaries when tagged, else source); pack the libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python Book/build/fetch_pins.py --out programs/pins --surl-src programs/Surl --curl-src programs/Curl --github-env \
            --surl-commit "$(git -C programs/Surl rev-parse HEAD)" --curl-commit "$(git -C programs/Curl rev-parse HEAD)"
      - name: Show the versions
        shell: bash
        run: |
          "$SURLY_SURL" --version | head -1
          "$SURLY_CURL" --version | head -1
      - name: Verify every recipe
        id: verify
        shell: bash
        run: python Book/build/verify.py -j 4 --retry-broken 1 --shard ${{ matrix.shard }}/8 | tee verify.log; exit "${PIPESTATUS[0]}"
        continue-on-error: true
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} shard ${{ matrix.shard }}/8: Surl ${SURL_REF}, Curl ${CURL_REF}"
            echo "Verified: $(grep -c ': verified$' verify.log || true) of this shard's $(grep -c -E ': (verified|broken)$' verify.log || true)"
            echo '```'
            grep -v ': verified$' verify.log | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            verify.log
            Book/parts/**/verified.yml
      # Verify may fail (a broken recipe, or a crash that stops the shard); the summary and the artifact are
      # written first, then the job fails, so a red shard is never shown green.
      - name: Fail the job when verify failed
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          echo "verify.py exited non-zero on ${{ matrix.os }} shard ${{ matrix.shard }}/8; see the summary and verify.log"
          exit 1
